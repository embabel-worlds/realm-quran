# The realm's answer surface.
#
# References are as a reader writes them: an ayah is `2:255`, a surah its number. Every reading view
# returns the Arabic beside the English, because the English is a translation of the meaning and the
# Arabic is the Quran; a view that showed only Pickthall would be showing a commentary.
#
# Views that cross scriptures — "mercy in the Bible and the Quran" — are not here. They read only the
# vocabulary's parent labels, so they live in realm-scripture-vocabulary and answer from whatever is
# installed.

- name: ReadAyah
  description: >-
    One ayah in Arabic and Pickthall's English, by `<surah>:<ayah>`. With its surah, juz, page of the
    Medina mushaf and any prostration. Only the one ayah; no tafsir or other translations.
  params:
    ref:
      type: string
      default: "2:255"
      description: "The ayah as `<surah>:<ayah>`, exactly, e.g. `2:255`, `112:1` — not `Quran 2:255`."
  cypher: |
    MATCH (a:Ayah {ref: $ref})-[:IN]->(s:Surah)
    RETURN a.name AS reference, s.name AS surah, s.meaning AS surahMeaning,
           a.original AS arabic, a.text AS english, a.juz AS juz, a.page AS page, a.sajda AS sajda

- name: ReadSurah
  description: >-
    A whole surah, ayah by ayah, in Arabic and in Pickthall's English. One surah per call, by
    number; the basmala is not a separate row except in Al-Fatiha, where it is the first ayah.
  params:
    surah:
      type: int
      default: 1
      description: "The surah's number, 1–114."
  cypher: |
    MATCH (s:Surah {chapter: $surah})<-[:IN]-(a:Ayah)
    RETURN a.verse AS ayah, a.original AS arabic, a.text AS english
    ORDER BY ayah

- name: Surahs
  description: >-
    The 114 surahs with names, meanings, length and Meccan or Medinan. In the order of the mushaf
    or the traditional order of revelation; only Meccan or only Medinan when `revelation` is given.
  params:
    order:
      type: string
      default: "mushaf"
      description: "`mushaf` (default, as printed) or `revelation` (the traditional chronological order)."
    revelation:
      type: string
      default: ""
      description: "`Meccan` or `Medinan`, exactly, to show only those; empty for all."
  cypher: |
    MATCH (s:Surah)
    WHERE $revelation = '' OR s.revelation = $revelation
    RETURN s.chapter AS number, s.name AS name, s.arabicName AS arabicName, s.meaning AS meaning,
           s.verseCount AS ayat, s.revelation AS revelation, s.revelationOrder AS revelationOrder
    ORDER BY CASE $order WHEN 'revelation' THEN s.revelationOrder ELSE s.chapter END

- name: SearchQuran
  description: >-
    Ayat whose Pickthall English contains a word or phrase, with the Arabic. Partial and
    case-insensitive: it matches inside words, so `patien` finds `patience` and `patient`. In the order
    of the mushaf, at most `limit`; this searches one translation's wording, not the Arabic — use
    SearchArabic for that.
  params:
    term:
      type: string
      default: "mercy"
      description: "The word or phrase to find, in English; a partial match, ignoring case. Pickthall's English is of 1930: `thee`, `hath`, `Lo!`."
    limit:
      type: int
      default: 100
      description: "At most this many ayat."
  cypher: |
    MATCH (a:Ayah)
    WHERE toLower(a.text) CONTAINS toLower($term)
    RETURN a.name AS reference, a.surahName AS surah, a.text AS english, a.original AS arabic
    ORDER BY a.ordinal
    LIMIT $limit

- name: SearchArabic
  description: >-
    Ayat whose Arabic contains a word or phrase, typed without diacritics. Searches the Simple
    Clean text and shows the Uthmani, in the order of the mushaf, at most `limit`. A term typed with
    diacritics finds nothing, and a phrase across a pause mark does not match.
  params:
    term:
      type: string
      default: "رحمة"
      description: "Arabic without diacritics, e.g. `رحمة`, `الصبر`. A partial match: the letters are found inside longer words too, with prefixes and suffixes."
    limit:
      type: int
      default: 100
      description: "At most this many ayat."
  cypher: |
    MATCH (a:Ayah)
    WHERE a.arabicPlain CONTAINS $term
    RETURN a.name AS reference, a.surahName AS surah, a.original AS arabic, a.text AS english
    ORDER BY a.ordinal
    LIMIT $limit

- name: SurahsMentioning
  description: >-
    Surahs ranked by how many of their ayat use a word in Pickthall's English. Counts ayat, not
    occurrences; at most `limit` surahs, each with its first ten matching ayah numbers. A surah that
    never uses it is left out.
  params:
    term:
      type: string
      default: "patience"
      description: "The word or phrase to find, in English. A partial match, ignoring case: any ayah whose text contains it."
    limit:
      type: int
      default: 25
      description: "At most this many surahs."
  cypher: |
    MATCH (s:Surah)<-[:IN]-(a:Ayah)
    WHERE toLower(a.text) CONTAINS toLower($term)
    WITH s, count(a) AS matchingAyat, collect(a.verse)[0..10] AS ayat
    RETURN s.chapter AS number, s.name AS surah, s.meaning AS meaning, matchingAyat, ayat
    ORDER BY matchingAyat DESC, number
    LIMIT $limit

- name: ReadJuz
  description: >-
    The surahs one juz spans, with the ayah range of each that falls in it. In order; counts and
    bounds only, not the text — ReadSurah reads it.
  params:
    juz:
      type: int
      default: 30
      description: "The juz, 1–30."
  cypher: |
    MATCH (j:Juz {number: $juz})<-[:IN_PORTION]-(a:Ayah)-[:IN]->(s:Surah)
    WITH j, s, count(a) AS ayat, min(a.verse) AS fromAyah, max(a.verse) AS toAyah
    RETURN j.name AS juz, s.chapter AS number, s.name AS surah, s.meaning AS meaning, fromAyah, toAyah, ayat
    ORDER BY number

- name: Sajdas
  description: >-
    The fifteen ayat of prostration (sajda), in Arabic and English. In order, with whether the
    AlQuran Cloud data classes the prostration obligatory or recommended; the schools of law do not
    all agree, and that difference is not shown.
  cypher: |
    MATCH (a:Ayah) WHERE a.sajda IS NOT NULL
    RETURN a.name AS reference, a.surahName AS surah, a.sajda AS sajda, a.text AS english, a.original AS arabic
    ORDER BY a.ordinal

- name: MeccanAndMedinan
  description: >-
    How Meccan and Medinan surahs differ in size: surahs, ayat and average length. Two rows, by the
    traditional attribution of each whole surah; ayat that tradition places in the other period are
    not split out.
  cypher: |
    MATCH (s:Surah)
    RETURN s.revelation AS revelation, count(s) AS surahs, sum(s.verseCount) AS ayat,
           round(1.0 * sum(s.verseCount) / count(s), 1) AS averageAyat
    ORDER BY revelation
