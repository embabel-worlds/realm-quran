- type: Ayah
  data:
    ref: '63:3'
    scripture: quran
    name: Quran 63:3
    chapter: 63
    verse: 3
    ordinal: 5191
    text: That is because they believed, then disbelieved, therefore their hearts are sealed so that they understand not.
    translation: Pickthall
    original: ذَٰلِكَ بِأَنَّهُمْ ءَامَنُوا۟ ثُمَّ كَفَرُوا۟ فَطُبِعَ عَلَىٰ قُلُوبِهِمْ فَهُمْ لَا يَفْقَهُونَ
    arabicPlain: ذلك بأنهم آمنوا ثم كفروا فطبع على قلوبهم فهم لا يفقهون
    surahName: Al-Munaafiqoon
    juz: 28
    manzil: 7
    ruku: 488
