- type: Ayah
  data:
    ref: '63:2'
    scripture: quran
    name: Quran 63:2
    chapter: 63
    verse: 2
    ordinal: 5190
    text: They make their faith a pretext so that they may turn (men) from the way of Allah. Verily evil is that which they are wont to do,
    translation: Pickthall
    original: ٱتَّخَذُوٓا۟ أَيْمَـٰنَهُمْ جُنَّةً فَصَدُّوا۟ عَن سَبِيلِ ٱللَّهِ ۚ إِنَّهُمْ سَآءَ مَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: اتخذوا أيمانهم جنة فصدوا عن سبيل الله ۚ إنهم ساء ما كانوا يعملون
    surahName: Al-Munaafiqoon
