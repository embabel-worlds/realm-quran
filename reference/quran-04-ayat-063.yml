- type: Ayah
  data:
    ref: '63:1'
    scripture: quran
    name: Quran 63:1
    chapter: 63
    verse: 1
    ordinal: 5189
    text: 'When the hypocrites come unto thee (O Muhammad), they say: We bear witness that thou art indeed Allah''s messenger. And Allah knoweth that thou art indeed His messenger, and Allah beareth witness that the hypocrites indeed are speaking falsely.'
    translation: Pickthall
    original: بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ إِذَا جَآءَكَ ٱلْمُنَـٰفِقُونَ قَالُوا۟ نَشْهَدُ إِنَّكَ لَرَسُولُ ٱللَّهِ ۗ وَٱللَّهُ يَعْلَمُ إِنَّكَ لَرَسُولُهُۥ وَٱللَّهُ يَشْهَدُ إِنَّ ٱلْمُنَـٰفِقِينَ لَكَـٰذِبُونَ
    arabicPlain: بسم الله الرحمن الرحيم إذا جاءك المنافقون قالوا نشهد إنك لرسول الله ۗ والله يعلم إنك لرسوله والله يشهد إن المنافقين لكاذبون
    surahName: Al-Munaafiqoon
    juz: 28
