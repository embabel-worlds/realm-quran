- type: Ayah
  data:
    ref: '63:5'
    scripture: quran
    name: Quran 63:5
    chapter: 63
    verse: 5
    ordinal: 5193
    text: 'And when it is said unto them: Come! The messenger of Allah will ask forgiveness for you! they avert their faces and thou seest them turning away, disdainful.'
    translation: Pickthall
    original: وَإِذَا قِيلَ لَهُمْ تَعَالَوْا۟ يَسْتَغْفِرْ لَكُمْ رَسُولُ ٱللَّهِ لَوَّوْا۟ رُءُوسَهُمْ وَرَأَيْتَهُمْ يَصُدُّونَ وَهُم مُّسْتَكْبِرُونَ
    arabicPlain: وإذا قيل لهم تعالوا يستغفر لكم رسول الله لووا رءوسهم ورأيتهم يصدون وهم مستكبرون
    surahName: Al-Munaafiqoon
    juz: 28
