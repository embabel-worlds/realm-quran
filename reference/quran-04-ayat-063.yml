- type: Ayah
  data:
    ref: '63:9'
    scripture: quran
    name: Quran 63:9
    chapter: 63
    verse: 9
    ordinal: 5197
    text: O ye who believe! Let not your wealth nor your children distract you from remembrance of Allah. Those who do so, they are the losers.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تُلْهِكُمْ أَمْوَٰلُكُمْ وَلَآ أَوْلَـٰدُكُمْ عَن ذِكْرِ ٱللَّهِ ۚ وَمَن يَفْعَلْ ذَٰلِكَ فَأُو۟لَـٰٓئِكَ هُمُ ٱلْخَـٰسِرُونَ
    arabicPlain: يا أيها الذين آمنوا لا تلهكم أموالكم ولا أولادكم عن ذكر الله ۚ ومن يفعل ذلك فأولئك هم الخاسرون
    surahName: Al-Munaafiqoon
    juz: 28
    manzil: 7
    ruku: 489
    page: 555
