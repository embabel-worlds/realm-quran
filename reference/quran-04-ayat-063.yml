- type: Ayah
  data:
    ref: '63:11'
    scripture: quran
    name: Quran 63:11
    chapter: 63
    verse: 11
    ordinal: 5199
    text: But Allah reprieveth no soul when its term cometh, and Allah is Informed of what ye do.
    translation: Pickthall
    original: وَلَن يُؤَخِّرَ ٱللَّهُ نَفْسًا إِذَا جَآءَ أَجَلُهَا ۚ وَٱللَّهُ خَبِيرٌۢ بِمَا تَعْمَلُونَ
    arabicPlain: ولن يؤخر الله نفسا إذا جاء أجلها ۚ والله خبير بما تعملون
    surahName: Al-Munaafiqoon
    juz: 28
