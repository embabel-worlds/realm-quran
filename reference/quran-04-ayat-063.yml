- type: Ayah
  data:
    ref: '63:6'
    scripture: quran
    name: Quran 63:6
    chapter: 63
    verse: 6
    ordinal: 5194
    text: Whether thou ask forgiveness for them or ask not forgiveness for them is all one for them; Allah will not forgive them. Lo! Allah guideth not the evil-living folk.
    translation: Pickthall
    original: سَوَآءٌ عَلَيْهِمْ أَسْتَغْفَرْتَ لَهُمْ أَمْ لَمْ تَسْتَغْفِرْ لَهُمْ لَن يَغْفِرَ ٱللَّهُ لَهُمْ ۚ إِنَّ ٱللَّهَ لَا يَهْدِى ٱلْقَوْمَ ٱلْفَـٰسِقِينَ
    arabicPlain: سواء عليهم أستغفرت لهم أم لم تستغفر لهم لن يغفر الله لهم ۚ إن الله لا يهدي القوم الفاسقين
    surahName: Al-Munaafiqoon
    juz: 28
    manzil: 7
    ruku: 488
