- type: Ayah
  data:
    ref: '63:7'
    scripture: quran
    name: Quran 63:7
    chapter: 63
    verse: 7
    ordinal: 5195
    text: 'They it is who say: Spend not on behalf of those (who dwell) with Allah''s messenger that they may disperse (and go away from you); when Allah''s are the treasures of the heavens and the earth; but the hypocrites comprehend not.'
    translation: Pickthall
    original: هُمُ ٱلَّذِينَ يَقُولُونَ لَا تُنفِقُوا۟ عَلَىٰ مَنْ عِندَ رَسُولِ ٱللَّهِ حَتَّىٰ يَنفَضُّوا۟ ۗ وَلِلَّهِ خَزَآئِنُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَلَـٰكِنَّ ٱلْمُنَـٰفِقِينَ لَا يَفْقَهُونَ
    arabicPlain: هم الذين يقولون لا تنفقوا على من عند رسول الله حتى ينفضوا ۗ ولله خزائن السماوات والأرض ولكن المنافقين لا يفقهون
    surahName: Al-Munaafiqoon
    juz: 28
    manzil: 7
    ruku: 488
    page: 555
