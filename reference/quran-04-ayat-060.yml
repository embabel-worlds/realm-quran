- type: Ayah
  data:
    ref: '60:3'
    scripture: quran
    name: Quran 60:3
    chapter: 60
    verse: 3
    ordinal: 5153
    text: Your ties of kindred and your children will avail you naught upon the Day of Resurrection. He will part you. Allah is Seer of what ye do.
    translation: Pickthall
    original: لَن تَنفَعَكُمْ أَرْحَامُكُمْ وَلَآ أَوْلَـٰدُكُمْ ۚ يَوْمَ ٱلْقِيَـٰمَةِ يَفْصِلُ بَيْنَكُمْ ۚ وَٱللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ
    arabicPlain: لن تنفعكم أرحامكم ولا أولادكم ۚ يوم القيامة يفصل بينكم ۚ والله بما تعملون بصير
    surahName: Al-Mumtahana
    juz: 28
