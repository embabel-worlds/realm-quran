  data:
    ref: '60:5'
    scripture: quran
    name: Quran 60:5
    chapter: 60
    verse: 5
    ordinal: 5155
    text: Our Lord! Make us not a prey for those who disbelieve, and forgive us, our Lord! Lo! Thou, only Thou, are the Mighty, the Wise.
    translation: Pickthall
    original: رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِّلَّذِينَ كَفَرُوا۟ وَٱغْفِرْ لَنَا رَبَّنَآ ۖ إِنَّكَ أَنتَ ٱلْعَزِيزُ ٱلْحَكِيمُ
    arabicPlain: ربنا لا تجعلنا فتنة للذين كفروا واغفر لنا ربنا ۖ إنك أنت العزيز الحكيم
    surahName: Al-Mumtahana
