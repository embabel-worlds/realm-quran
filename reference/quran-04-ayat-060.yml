- type: Ayah
  data:
    ref: '60:2'
    scripture: quran
    name: Quran 60:2
    chapter: 60
    verse: 2
    ordinal: 5152
    text: If they have the upper hand of you, they will be your foes, and will stretch out their hands and their tongues toward you with evil (intent), and they long for you to disbelieve.
    translation: Pickthall
    original: إِن يَثْقَفُوكُمْ يَكُونُوا۟ لَكُمْ أَعْدَآءً وَيَبْسُطُوٓا۟ إِلَيْكُمْ أَيْدِيَهُمْ وَأَلْسِنَتَهُم بِٱلسُّوٓءِ وَوَدُّوا۟ لَوْ تَكْفُرُونَ
    arabicPlain: إن يثقفوكم يكونوا لكم أعداء ويبسطوا إليكم أيديهم وألسنتهم بالسوء وودوا لو تكفرون
    surahName: Al-Mumtahana
    juz: 28
    manzil: 7
    ruku: 482
    page: 549
