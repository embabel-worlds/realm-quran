- type: Ayah
  data:
    ref: '60:7'
    scripture: quran
    name: Quran 60:7
    chapter: 60
    verse: 7
    ordinal: 5157
    text: It may be that Allah will ordain love between you and those of them with whom ye are at enmity. Allah is Mighty, and Allah is Forgiving, Merciful.
    translation: Pickthall
    original: ۞ عَسَى ٱللَّهُ أَن يَجْعَلَ بَيْنَكُمْ وَبَيْنَ ٱلَّذِينَ عَادَيْتُم مِّنْهُم مَّوَدَّةً ۚ وَٱللَّهُ قَدِيرٌ ۚ وَٱللَّهُ غَفُورٌ رَّحِيمٌ
    arabicPlain: ۞ عسى الله أن يجعل بينكم وبين الذين عاديتم منهم مودة ۚ والله قدير ۚ والله غفور رحيم
    surahName: Al-Mumtahana
