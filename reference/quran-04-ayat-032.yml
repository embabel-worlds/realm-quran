    verse: 18
    ordinal: 3521
    text: Is he who is a believer like unto him who is an evil-liver? They are not alike.
    translation: Pickthall
    original: أَفَمَن كَانَ مُؤْمِنًا كَمَن كَانَ فَاسِقًا ۚ لَّا يَسْتَوُۥنَ
    arabicPlain: أفمن كان مؤمنا كمن كان فاسقا ۚ لا يستوون
