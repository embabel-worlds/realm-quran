    scripture: quran
    name: Quran 32:17
    chapter: 32
    verse: 17
    ordinal: 3520
    text: No soul knoweth what is kept hid for them of joy, as a reward for what they used to do.
    translation: Pickthall
    original: فَلَا تَعْلَمُ نَفْسٌ مَّآ أُخْفِىَ لَهُم مِّن قُرَّةِ أَعْيُنٍ جَزَآءًۢ بِمَا كَانُوا۟ يَعْمَلُونَ
