  data:
    ref: '32:11'
    scripture: quran
    name: Quran 32:11
    chapter: 32
    verse: 11
    ordinal: 3514
    text: 'Say: The angel of death, who hath charge concerning you, will gather you, and afterward unto your Lord ye will be returned.'
    translation: Pickthall
    original: ۞ قُلْ يَتَوَفَّىٰكُم مَّلَكُ ٱلْمَوْتِ ٱلَّذِى وُكِّلَ بِكُمْ ثُمَّ إِلَىٰ رَبِّكُمْ تُرْجَعُونَ
    arabicPlain: ۞ قل يتوفاكم ملك الموت الذي وكل بكم ثم إلى ربكم ترجعون
    surahName: As-Sajda
    juz: 21
    manzil: 5
