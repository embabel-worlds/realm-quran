  data:
    ref: '32:10'
    scripture: quran
    name: Quran 32:10
    chapter: 32
    verse: 10
    ordinal: 3513
    text: 'And they say: When we are lost in the earth, how can we then be re-created? Nay but they are disbelievers in the meeting with their Lord.'
    translation: Pickthall
    original: وَقَالُوٓا۟ أَءِذَا ضَلَلْنَا فِى ٱلْأَرْضِ أَءِنَّا لَفِى خَلْقٍ جَدِيدٍۭ ۚ بَلْ هُم بِلِقَآءِ رَبِّهِمْ كَـٰفِرُونَ
    arabicPlain: وقالوا أإذا ضللنا في الأرض أإنا لفي خلق جديد ۚ بل هم بلقاء ربهم كافرون
    surahName: As-Sajda
