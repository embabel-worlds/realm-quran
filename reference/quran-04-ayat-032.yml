  data:
    ref: '32:12'
    scripture: quran
    name: Quran 32:12
    chapter: 32
    verse: 12
    ordinal: 3515
    text: 'Couldst thou but see when the guilty hang their heads before their Lord, (and say): Our Lord! We have now seen and heard, so send us back; we will do right, now we are sure.'
    translation: Pickthall
    original: وَلَوْ تَرَىٰٓ إِذِ ٱلْمُجْرِمُونَ نَاكِسُوا۟ رُءُوسِهِمْ عِندَ رَبِّهِمْ رَبَّنَآ أَبْصَرْنَا وَسَمِعْنَا فَٱرْجِعْنَا نَعْمَلْ صَـٰلِحًا إِنَّا مُوقِنُونَ
    arabicPlain: ولو ترى إذ المجرمون ناكسو رءوسهم عند ربهم ربنا أبصرنا وسمعنا فارجعنا نعمل صالحا إنا موقنون
    surahName: As-Sajda
    juz: 21
    manzil: 5
    ruku: 359
