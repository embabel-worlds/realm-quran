    name: Quran 32:29
    chapter: 32
    verse: 29
    ordinal: 3532
    text: 'Say (unto them): On the day of the victory the faith of those who disbelieve (and who then will believe) will not avail them, neither will they be reprieved.'
    translation: Pickthall
    original: قُلْ يَوْمَ ٱلْفَتْحِ لَا يَنفَعُ ٱلَّذِينَ كَفَرُوٓا۟ إِيمَـٰنُهُمْ وَلَا هُمْ يُنظَرُونَ
    arabicPlain: قل يوم الفتح لا ينفع الذين كفروا إيمانهم ولا هم ينظرون
