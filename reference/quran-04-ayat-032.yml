    name: Quran 32:24
    chapter: 32
    verse: 24
    ordinal: 3527
    text: And when they became steadfast and believed firmly in Our revelations, We appointed from among them leaders who guided by Our command.
    translation: Pickthall
    original: وَجَعَلْنَا مِنْهُمْ أَئِمَّةً يَهْدُونَ بِأَمْرِنَا لَمَّا صَبَرُوا۟ ۖ وَكَانُوا۟ بِـَٔايَـٰتِنَا يُوقِنُونَ
