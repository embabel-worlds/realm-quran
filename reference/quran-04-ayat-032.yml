  data:
    ref: '32:4'
    scripture: quran
    name: Quran 32:4
    chapter: 32
    verse: 4
    ordinal: 3507
    text: Allah it is Who created the heavens and the earth, and that which is between them, in six Days. Then He mounted the Throne. Ye have not, beside Him, a protecting friend or mediator. Will ye not then remember?
    translation: Pickthall
    original: ٱللَّهُ ٱلَّذِى خَلَقَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ وَمَا بَيْنَهُمَا فِى سِتَّةِ أَيَّامٍ ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ ۖ مَا لَكُم مِّن دُونِهِۦ مِن وَلِىٍّ وَلَا شَفِيعٍ ۚ أَفَلَا تَتَذَكَّرُونَ
    arabicPlain: الله الذي خلق السماوات والأرض وما بينهما في ستة أيام ثم استوى على العرش ۖ ما لكم من دونه من ولي ولا شفيع ۚ أفلا تتذكرون
    surahName: As-Sajda
    juz: 21
    manzil: 5
    ruku: 358
    page: 415
