  data:
    ref: '32:19'
    scripture: quran
    name: Quran 32:19
    chapter: 32
    verse: 19
    ordinal: 3522
    text: But as for those who believe and do good works, for them are the Gardens of Retreat - a welcome (in reward) for what they used to do.
    translation: Pickthall
    original: أَمَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ فَلَهُمْ جَنَّـٰتُ ٱلْمَأْوَىٰ نُزُلًۢا بِمَا كَانُوا۟ يَعْمَلُونَ
