    scripture: quran
    name: Quran 6:3
    chapter: 6
    verse: 3
    ordinal: 792
    text: He is Allah in the heavens and in the earth. He knoweth both your secret and your utterance, and He knoweth what ye earn.
    translation: Pickthall
    original: وَهُوَ ٱللَّهُ فِى ٱلسَّمَـٰوَٰتِ وَفِى ٱلْأَرْضِ ۖ يَعْلَمُ سِرَّكُمْ وَجَهْرَكُمْ وَيَعْلَمُ مَا تَكْسِبُونَ
