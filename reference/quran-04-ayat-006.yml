  data:
    ref: '6:25'
    scripture: quran
    name: Quran 6:25
    chapter: 6
    verse: 25
    ordinal: 814
    text: 'Of them are some who listen unto thee, but We have placed upon their hearts veils, lest they should understand, and in their ears a deafness. If they saw every token they would not believe therein; to the point that, when they come unto thee to argue with thee, the disbelievers say: This is naught else than fables of the men of old.'
    translation: Pickthall
    original: وَمِنْهُم مَّن يَسْتَمِعُ إِلَيْكَ ۖ وَجَعَلْنَا عَلَىٰ قُلُوبِهِمْ أَكِنَّةً أَن يَفْقَهُوهُ وَفِىٓ ءَاذَانِهِمْ وَقْرًا ۚ وَإِن يَرَوْا۟ كُلَّ ءَايَةٍ لَّا يُؤْمِنُوا۟ بِهَا ۚ حَتَّىٰٓ إِذَا جَآءُوكَ يُجَـٰدِلُونَكَ يَقُولُ ٱلَّذِينَ كَفَرُوٓا۟ إِنْ هَـٰذَآ إِلَّآ أَسَـٰطِيرُ ٱلْأَوَّلِينَ
    arabicPlain: ومنهم من يستمع إليك ۖ وجعلنا على قلوبهم أكنة أن يفقهوه وفي آذانهم وقرا ۚ وإن يروا كل آية لا يؤمنوا بها ۚ حتى إذا جاءوك يجادلونك يقول الذين كفروا إن هذا إلا أساطير الأولين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 104
    page: 130
