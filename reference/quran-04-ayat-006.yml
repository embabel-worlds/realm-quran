  data:
    ref: 6:124
    scripture: quran
    name: Quran 6:124
    chapter: 6
    verse: 124
    ordinal: 913
    text: 'And when a token cometh unto them, they say: We will not believe till we are given that which Allah''s messengers are given. Allah knoweth best with whom to place His message. Humiliation from Allah and heavy punishment will smite the guilty for their scheming.'
    translation: Pickthall
    original: وَإِذَا جَآءَتْهُمْ ءَايَةٌ قَالُوا۟ لَن نُّؤْمِنَ حَتَّىٰ نُؤْتَىٰ مِثْلَ مَآ أُوتِىَ رُسُلُ ٱللَّهِ ۘ ٱللَّهُ أَعْلَمُ حَيْثُ يَجْعَلُ رِسَالَتَهُۥ ۗ سَيُصِيبُ ٱلَّذِينَ أَجْرَمُوا۟ صَغَارٌ عِندَ ٱللَّهِ وَعَذَابٌ شَدِيدٌۢ بِمَا كَانُوا۟ يَمْكُرُونَ
    arabicPlain: وإذا جاءتهم آية قالوا لن نؤمن حتى نؤتى مثل ما أوتي رسل الله ۘ الله أعلم حيث يجعل رسالته ۗ سيصيب الذين أجرموا صغار عند الله وعذاب شديد بما كانوا يمكرون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 116
    page: 143
