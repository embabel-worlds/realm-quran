  data:
    ref: 6:164
    scripture: quran
    name: Quran 6:164
    chapter: 6
    verse: 164
    ordinal: 953
    text: 'Say: Shall I seek another than Allah for Lord, when He is Lord of all things? Each soul earneth only on its own account, nor doth any laden bear another''s load. Then unto your Lord is your return and He will tell you that wherein ye differed.'
    translation: Pickthall
    original: قُلْ أَغَيْرَ ٱللَّهِ أَبْغِى رَبًّا وَهُوَ رَبُّ كُلِّ شَىْءٍ ۚ وَلَا تَكْسِبُ كُلُّ نَفْسٍ إِلَّا عَلَيْهَا ۚ وَلَا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَىٰ ۚ ثُمَّ إِلَىٰ رَبِّكُم مَّرْجِعُكُمْ فَيُنَبِّئُكُم بِمَا كُنتُمْ فِيهِ تَخْتَلِفُونَ
    arabicPlain: قل أغير الله أبغي ربا وهو رب كل شيء ۚ ولا تكسب كل نفس إلا عليها ۚ ولا تزر وازرة وزر أخرى ۚ ثم إلى ربكم مرجعكم فينبئكم بما كنتم فيه تختلفون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
