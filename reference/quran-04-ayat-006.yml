  data:
    ref: '6:49'
    scripture: quran
    name: Quran 6:49
    chapter: 6
    verse: 49
    ordinal: 838
    text: But as for those who deny Our revelations, torment will afflict them for that they used to disobey.
    translation: Pickthall
    original: وَٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَـٰتِنَا يَمَسُّهُمُ ٱلْعَذَابُ بِمَا كَانُوا۟ يَفْسُقُونَ
    arabicPlain: والذين كذبوا بآياتنا يمسهم العذاب بما كانوا يفسقون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 106
    page: 133
  relations:
