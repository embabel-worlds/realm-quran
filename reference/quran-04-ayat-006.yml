  data:
    ref: 6:62
    scripture: quran
    name: Quran 6:62
    chapter: 6
    verse: 62
    ordinal: 851
    text: Then are they restored unto Allah, their Lord, the Just. Surely His is the judgment. And He is the most swift of reckoners.
    translation: Pickthall
    original: ثُمَّ رُدُّوٓا۟ إِلَى ٱللَّهِ مَوْلَىٰهُمُ ٱلْحَقِّ ۚ أَلَا لَهُ ٱلْحُكْمُ وَهُوَ أَسْرَعُ ٱلْحَـٰسِبِينَ
    arabicPlain: ثم ردوا إلى الله مولاهم الحق ۚ ألا له الحكم وهو أسرع الحاسبين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 109
    page: 135
