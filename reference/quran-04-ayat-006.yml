    name: Quran 6:161
    chapter: 6
    verse: 161
    ordinal: 950
    text: 'Say: Lo! As for me, my Lord hath guided me unto a straight path, a right religion, the community of Abraham, the upright, who was no idolater.'
    translation: Pickthall
    original: قُلْ إِنَّنِى هَدَىٰنِى رَبِّىٓ إِلَىٰ صِرَٰطٍ مُّسْتَقِيمٍ دِينًا قِيَمًا مِّلَّةَ إِبْرَٰهِيمَ حَنِيفًا ۚ وَمَا كَانَ مِنَ ٱلْمُشْرِكِينَ
    arabicPlain: قل إنني هداني ربي إلى صراط مستقيم دينا قيما ملة إبراهيم حنيفا ۚ وما كان من المشركين
