  data:
    ref: 6:155
    scripture: quran
    name: Quran 6:155
    chapter: 6
    verse: 155
    ordinal: 944
    text: And this is a blessed Scripture which We have revealed. So follow it and ward off (evil), that ye may find mercy.
    translation: Pickthall
    original: وَهَـٰذَا كِتَـٰبٌ أَنزَلْنَـٰهُ مُبَارَكٌ فَٱتَّبِعُوهُ وَٱتَّقُوا۟ لَعَلَّكُمْ تُرْحَمُونَ
    arabicPlain: وهذا كتاب أنزلناه مبارك فاتبعوه واتقوا لعلكم ترحمون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 121
    page: 149
