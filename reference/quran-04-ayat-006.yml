  data:
    ref: 6:126
    scripture: quran
    name: Quran 6:126
    chapter: 6
    verse: 126
    ordinal: 915
    text: This is the path of thy Lord, a straight path. We have detailed Our revelations for a people who take heed.
    translation: Pickthall
    original: وَهَـٰذَا صِرَٰطُ رَبِّكَ مُسْتَقِيمًا ۗ قَدْ فَصَّلْنَا ٱلْـَٔايَـٰتِ لِقَوْمٍ يَذَّكَّرُونَ
    arabicPlain: وهذا صراط ربك مستقيما ۗ قد فصلنا الآيات لقوم يذكرون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
