  data:
    ref: 6:147
    scripture: quran
    name: Quran 6:147
    chapter: 6
    verse: 147
    ordinal: 936
    text: 'So if they give the lie to thee (Muhammad), say: Your Lord is a Lord of All-Embracing Mercy, and His wrath will never be withdrawn from guilty folk.'
    translation: Pickthall
    original: فَإِن كَذَّبُوكَ فَقُل رَّبُّكُمْ ذُو رَحْمَةٍ وَٰسِعَةٍ وَلَا يُرَدُّ بَأْسُهُۥ عَنِ ٱلْقَوْمِ ٱلْمُجْرِمِينَ
    arabicPlain: فإن كذبوك فقل ربكم ذو رحمة واسعة ولا يرد بأسه عن القوم المجرمين
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 119
    page: 148
