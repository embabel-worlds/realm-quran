  data:
    ref: 6:151
    scripture: quran
    name: Quran 6:151
    chapter: 6
    verse: 151
    ordinal: 940
    text: 'Say: Come, I will recite unto you that which your Lord hath made a sacred duty for you: That ye ascribe no thing as partner unto Him and that ye do good to parents, and that ye slay not your children because of penury - We provide for you and for them - and that ye draw not nigh to lewd things whether open or concealed. And that ye slay not the life which Allah hath made sacred, save in the course of justice. This He hath command you, in order that ye may discern.'
    translation: Pickthall
    original: ۞ قُلْ تَعَالَوْا۟ أَتْلُ مَا حَرَّمَ رَبُّكُمْ عَلَيْكُمْ ۖ أَلَّا تُشْرِكُوا۟ بِهِۦ شَيْـًٔا ۖ وَبِٱلْوَٰلِدَيْنِ إِحْسَـٰنًا ۖ وَلَا تَقْتُلُوٓا۟ أَوْلَـٰدَكُم مِّنْ إِمْلَـٰقٍ ۖ نَّحْنُ نَرْزُقُكُمْ وَإِيَّاهُمْ ۖ وَلَا تَقْرَبُوا۟ ٱلْفَوَٰحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ ۖ وَلَا تَقْتُلُوا۟ ٱلنَّفْسَ ٱلَّتِى حَرَّمَ ٱللَّهُ إِلَّا بِٱلْحَقِّ ۚ ذَٰلِكُمْ وَصَّىٰكُم بِهِۦ لَعَلَّكُمْ تَعْقِلُونَ
    arabicPlain: ۞ قل تعالوا أتل ما حرم ربكم عليكم ۖ ألا تشركوا به شيئا ۖ وبالوالدين إحسانا ۖ ولا تقتلوا أولادكم من إملاق ۖ نحن نرزقكم وإياهم ۖ ولا تقربوا الفواحش ما ظهر منها وما بطن ۖ ولا تقتلوا النفس التي حرم الله إلا بالحق ۚ ذلكم وصاكم به لعلكم تعقلون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 120
    page: 148
