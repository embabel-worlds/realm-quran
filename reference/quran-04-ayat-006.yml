  data:
    ref: '6:57'
    scripture: quran
    name: Quran 6:57
    chapter: 6
    verse: 57
    ordinal: 846
    text: 'Say: I am (relying) on clear proof from my Lord, while ye deny Him. I have not that for which ye are impatient. The decision is for Allah only. He telleth the truth and He is the Best of Deciders.'
    translation: Pickthall
    original: قُلْ إِنِّى عَلَىٰ بَيِّنَةٍ مِّن رَّبِّى وَكَذَّبْتُم بِهِۦ ۚ مَا عِندِى مَا تَسْتَعْجِلُونَ بِهِۦٓ ۚ إِنِ ٱلْحُكْمُ إِلَّا لِلَّهِ ۖ يَقُصُّ ٱلْحَقَّ ۖ وَهُوَ خَيْرُ ٱلْفَـٰصِلِينَ
    arabicPlain: قل إني على بينة من ربي وكذبتم به ۚ ما عندي ما تستعجلون به ۚ إن الحكم إلا لله ۖ يقص الحق ۖ وهو خير الفاصلين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 108
    page: 134
