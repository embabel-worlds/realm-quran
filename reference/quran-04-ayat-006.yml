    text: He hath no partner. This am I commanded, and I am first of those who surrender (unto Him).
    translation: Pickthall
    original: لَا شَرِيكَ لَهُۥ ۖ وَبِذَٰلِكَ أُمِرْتُ وَأَنَا۠ أَوَّلُ ٱلْمُسْلِمِينَ
    arabicPlain: لا شريك له ۖ وبذلك أمرت وأنا أول المسلمين
