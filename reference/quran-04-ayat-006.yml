- type: Ayah
  data:
    ref: '6:7'
    scripture: quran
    name: Quran 6:7
    chapter: 6
    verse: 7
    ordinal: 796
    text: 'Had we sent down unto thee (Muhammad) (actual) writing upon parchment, so that they could feel it with their hands, those who disbelieve would have said: This is naught else than mere magic.'
    translation: Pickthall
    original: وَلَوْ نَزَّلْنَا عَلَيْكَ كِتَـٰبًا فِى قِرْطَاسٍ فَلَمَسُوهُ بِأَيْدِيهِمْ لَقَالَ ٱلَّذِينَ كَفَرُوٓا۟ إِنْ هَـٰذَآ إِلَّا سِحْرٌ مُّبِينٌ
    arabicPlain: ولو نزلنا عليك كتابا في قرطاس فلمسوه بأيديهم لقال الذين كفروا إن هذا إلا سحر مبين
    surahName: Al-An'aam
    juz: 7
