  data:
    ref: '6:50'
    scripture: quran
    name: Quran 6:50
    chapter: 6
    verse: 50
    ordinal: 839
    text: 'Say (O Muhammad, to the disbelievers): I say not unto you (that) I possess the treasures of Allah, nor that I have knowledge of the Unseen; and I say not unto you: Lo! I am an angel. I follow only that which is inspired in me. Say: Are the blind man and the seer equal? Will ye not then take thought?'
    translation: Pickthall
    original: قُل لَّآ أَقُولُ لَكُمْ عِندِى خَزَآئِنُ ٱللَّهِ وَلَآ أَعْلَمُ ٱلْغَيْبَ وَلَآ أَقُولُ لَكُمْ إِنِّى مَلَكٌ ۖ إِنْ أَتَّبِعُ إِلَّا مَا يُوحَىٰٓ إِلَىَّ ۚ قُلْ هَلْ يَسْتَوِى ٱلْأَعْمَىٰ وَٱلْبَصِيرُ ۚ أَفَلَا تَتَفَكَّرُونَ
    arabicPlain: قل لا أقول لكم عندي خزائن الله ولا أعلم الغيب ولا أقول لكم إني ملك ۖ إن أتبع إلا ما يوحى إلي ۚ قل هل يستوي الأعمى والبصير ۚ أفلا تتفكرون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 106
    page: 133
  relations:
