  data:
    ref: '6:38'
    scripture: quran
    name: Quran 6:38
    chapter: 6
    verse: 38
    ordinal: 827
    text: There is not an animal in the earth, nor a flying creature flying on two wings, but they are peoples like unto you. We have neglected nothing in the Book (of Our decrees). Then unto their Lord they will be gathered.
    translation: Pickthall
    original: وَمَا مِن دَآبَّةٍ فِى ٱلْأَرْضِ وَلَا طَـٰٓئِرٍ يَطِيرُ بِجَنَاحَيْهِ إِلَّآ أُمَمٌ أَمْثَالُكُم ۚ مَّا فَرَّطْنَا فِى ٱلْكِتَـٰبِ مِن شَىْءٍ ۚ ثُمَّ إِلَىٰ رَبِّهِمْ يُحْشَرُونَ
    arabicPlain: وما من دابة في الأرض ولا طائر يطير بجناحيه إلا أمم أمثالكم ۚ ما فرطنا في الكتاب من شيء ۚ ثم إلى ربهم يحشرون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 105
    page: 132
