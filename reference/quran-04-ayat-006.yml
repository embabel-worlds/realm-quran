  data:
    ref: 6:105
    scripture: quran
    name: Quran 6:105
    chapter: 6
    verse: 105
    ordinal: 894
    text: 'Thus do We display Our revelations that they may say (unto thee, Muhammad): "Thou hast studied," and that We may make (it) clear for people who have knowledge.'
    translation: Pickthall
    original: وَكَذَٰلِكَ نُصَرِّفُ ٱلْـَٔايَـٰتِ وَلِيَقُولُوا۟ دَرَسْتَ وَلِنُبَيِّنَهُۥ لِقَوْمٍ يَعْلَمُونَ
    arabicPlain: وكذلك نصرف الآيات وليقولوا درست ولنبينه لقوم يعلمون
    surahName: Al-An'aam
    juz: 7
