  data:
    ref: 6:100
    scripture: quran
    name: Quran 6:100
    chapter: 6
    verse: 100
    ordinal: 889
    text: Yet they ascribe as partners unto Him the jinn, although He did create them, and impute falsely, without knowledge, sons and daughters unto Him. Glorified be He and High Exalted above (all) that they ascribe (unto Him).
    translation: Pickthall
    original: وَجَعَلُوا۟ لِلَّهِ شُرَكَآءَ ٱلْجِنَّ وَخَلَقَهُمْ ۖ وَخَرَقُوا۟ لَهُۥ بَنِينَ وَبَنَـٰتٍۭ بِغَيْرِ عِلْمٍ ۚ سُبْحَـٰنَهُۥ وَتَعَـٰلَىٰ عَمَّا يَصِفُونَ
    arabicPlain: وجعلوا لله شركاء الجن وخلقهم ۖ وخرقوا له بنين وبنات بغير علم ۚ سبحانه وتعالى عما يصفون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 113
