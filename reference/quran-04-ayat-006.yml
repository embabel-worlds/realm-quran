  data:
    ref: '6:37'
    scripture: quran
    name: Quran 6:37
    chapter: 6
    verse: 37
    ordinal: 826
    text: 'They say: Why hath no portent been sent down upon him from his Lord? Say: Lo! Allah is Able to send down a portent. But most of them know not.'
    translation: Pickthall
    original: وَقَالُوا۟ لَوْلَا نُزِّلَ عَلَيْهِ ءَايَةٌ مِّن رَّبِّهِۦ ۚ قُلْ إِنَّ ٱللَّهَ قَادِرٌ عَلَىٰٓ أَن يُنَزِّلَ ءَايَةً وَلَـٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ
    arabicPlain: وقالوا لولا نزل عليه آية من ربه ۚ قل إن الله قادر على أن ينزل آية ولكن أكثرهم لا يعلمون
    surahName: Al-An'aam
    juz: 7
