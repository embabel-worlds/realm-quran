  data:
    ref: 6:81
    scripture: quran
    name: Quran 6:81
    chapter: 6
    verse: 81
    ordinal: 870
    text: How should I fear that which ye set up beside Him, when ye fear not to set up beside Allah that for which He hath revealed unto you no warrant? Which of the two factions hath more right to safety? (Answer me that) if ye have knowledge.
    translation: Pickthall
    original: وَكَيْفَ أَخَافُ مَآ أَشْرَكْتُمْ وَلَا تَخَافُونَ أَنَّكُمْ أَشْرَكْتُم بِٱللَّهِ مَا لَمْ يُنَزِّلْ بِهِۦ عَلَيْكُمْ سُلْطَـٰنًا ۚ فَأَىُّ ٱلْفَرِيقَيْنِ أَحَقُّ بِٱلْأَمْنِ ۖ إِن كُنتُمْ تَعْلَمُونَ
    arabicPlain: وكيف أخاف ما أشركتم ولا تخافون أنكم أشركتم بالله ما لم ينزل به عليكم سلطانا ۚ فأي الفريقين أحق بالأمن ۖ إن كنتم تعلمون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 110
    page: 137
