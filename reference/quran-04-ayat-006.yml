  data:
    ref: 6:78
    scripture: quran
    name: Quran 6:78
    chapter: 6
    verse: 78
    ordinal: 867
    text: 'And when he saw the sun uprising, he cried: This is my Lord! This is greater! And when it set he exclaimed: O my people! Lo! I am free from all that ye associate (with Him).'
    translation: Pickthall
    original: فَلَمَّا رَءَا ٱلشَّمْسَ بَازِغَةً قَالَ هَـٰذَا رَبِّى هَـٰذَآ أَكْبَرُ ۖ فَلَمَّآ أَفَلَتْ قَالَ يَـٰقَوْمِ إِنِّى بَرِىٓءٌ مِّمَّا تُشْرِكُونَ
    arabicPlain: فلما رأى الشمس بازغة قال هذا ربي هذا أكبر ۖ فلما أفلت قال يا قوم إني بريء مما تشركون
    surahName: Al-An'aam
    juz: 7
