- type: Ayah
  data:
    ref: '6:9'
    scripture: quran
    name: Quran 6:9
    chapter: 6
    verse: 9
    ordinal: 798
    text: Had we appointed him (Our messenger) an angel, We assuredly had made him (as) a man (that he might speak to men); and (thus) obscured for them (the truth) they (now) obscure.
    translation: Pickthall
    original: وَلَوْ جَعَلْنَـٰهُ مَلَكًا لَّجَعَلْنَـٰهُ رَجُلًا وَلَلَبَسْنَا عَلَيْهِم مَّا يَلْبِسُونَ
    arabicPlain: ولو جعلناه ملكا لجعلناه رجلا وللبسنا عليهم ما يلبسون
    surahName: Al-An'aam
