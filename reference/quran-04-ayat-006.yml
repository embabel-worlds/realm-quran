  data:
    ref: '6:24'
    scripture: quran
    name: Quran 6:24
    chapter: 6
    verse: 24
    ordinal: 813
    text: See how they lie against themselves, and (how) the thing which they devised hath failed them!
    translation: Pickthall
    original: ٱنظُرْ كَيْفَ كَذَبُوا۟ عَلَىٰٓ أَنفُسِهِمْ ۚ وَضَلَّ عَنْهُم مَّا كَانُوا۟ يَفْتَرُونَ
    arabicPlain: انظر كيف كذبوا على أنفسهم ۚ وضل عنهم ما كانوا يفترون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 104
