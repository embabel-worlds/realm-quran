  data:
    ref: 6:120
    scripture: quran
    name: Quran 6:120
    chapter: 6
    verse: 120
    ordinal: 909
    text: Forsake the outwardness of sin and the inwardness thereof. Lo! those who garner sin will be awarded that which they have earned.
    translation: Pickthall
    original: وَذَرُوا۟ ظَـٰهِرَ ٱلْإِثْمِ وَبَاطِنَهُۥٓ ۚ إِنَّ ٱلَّذِينَ يَكْسِبُونَ ٱلْإِثْمَ سَيُجْزَوْنَ بِمَا كَانُوا۟ يَقْتَرِفُونَ
    arabicPlain: وذروا ظاهر الإثم وباطنه ۚ إن الذين يكسبون الإثم سيجزون بما كانوا يقترفون
    surahName: Al-An'aam
    juz: 8
