  data:
    ref: '6:52'
    scripture: quran
    name: Quran 6:52
    chapter: 6
    verse: 52
    ordinal: 841
    text: Repel not those who call upon their Lord at morn and evening, seeking His Countenance. Thou art not accountable for them in aught, nor are they accountable for thee in aught, that thou shouldst repel them and be of the wrong-doers.
    translation: Pickthall
    original: وَلَا تَطْرُدِ ٱلَّذِينَ يَدْعُونَ رَبَّهُم بِٱلْغَدَوٰةِ وَٱلْعَشِىِّ يُرِيدُونَ وَجْهَهُۥ ۖ مَا عَلَيْكَ مِنْ حِسَابِهِم مِّن شَىْءٍ وَمَا مِنْ حِسَابِكَ عَلَيْهِم مِّن شَىْءٍ فَتَطْرُدَهُمْ فَتَكُونَ مِنَ ٱلظَّـٰلِمِينَ
    arabicPlain: ولا تطرد الذين يدعون ربهم بالغداة والعشي يريدون وجهه ۖ ما عليك من حسابهم من شيء وما من حسابك عليهم من شيء فتطردهم فتكون من الظالمين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 107
    page: 133
