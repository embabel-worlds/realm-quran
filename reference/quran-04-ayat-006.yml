  data:
    ref: '6:27'
    scripture: quran
    name: Quran 6:27
    chapter: 6
    verse: 27
    ordinal: 816
    text: 'If thou couldst see when they are set before the Fire and say: Oh, would that we might return! Then would we not deny the revelations of our Lord but we would be of the believers!'
    translation: Pickthall
    original: وَلَوْ تَرَىٰٓ إِذْ وُقِفُوا۟ عَلَى ٱلنَّارِ فَقَالُوا۟ يَـٰلَيْتَنَا نُرَدُّ وَلَا نُكَذِّبَ بِـَٔايَـٰتِ رَبِّنَا وَنَكُونَ مِنَ ٱلْمُؤْمِنِينَ
    arabicPlain: ولو ترى إذ وقفوا على النار فقالوا يا ليتنا نرد ولا نكذب بآيات ربنا ونكون من المؤمنين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 104
    page: 130
  relations:
  - predicate: IN
    to:
