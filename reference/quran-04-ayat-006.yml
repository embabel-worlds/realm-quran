  data:
    ref: '6:12'
    scripture: quran
    name: Quran 6:12
    chapter: 6
    verse: 12
    ordinal: 801
    text: 'Say: Unto whom belongeth whatsoever is in the heavens and the earth? Say: Unto Allah. He hath prescribed for Himself mercy, that He may bring you all together to the Day of Resurrection whereof there is no doubt. Those who ruin their souls will not believe.'
    translation: Pickthall
    original: قُل لِّمَن مَّا فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۖ قُل لِّلَّهِ ۚ كَتَبَ عَلَىٰ نَفْسِهِ ٱلرَّحْمَةَ ۚ لَيَجْمَعَنَّكُمْ إِلَىٰ يَوْمِ ٱلْقِيَـٰمَةِ لَا رَيْبَ فِيهِ ۚ ٱلَّذِينَ خَسِرُوٓا۟ أَنفُسَهُمْ فَهُمْ لَا يُؤْمِنُونَ
    arabicPlain: قل لمن ما في السماوات والأرض ۖ قل لله ۚ كتب على نفسه الرحمة ۚ ليجمعنكم إلى يوم القيامة لا ريب فيه ۚ الذين خسروا أنفسهم فهم لا يؤمنون
    surahName: Al-An'aam
