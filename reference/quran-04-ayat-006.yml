  data:
    ref: '6:23'
    scripture: quran
    name: Quran 6:23
    chapter: 6
    verse: 23
    ordinal: 812
    text: 'Then will they have no contention save that they will say: By Allah, our Lord, we never were idolaters.'
    translation: Pickthall
    original: ثُمَّ لَمْ تَكُن فِتْنَتُهُمْ إِلَّآ أَن قَالُوا۟ وَٱللَّهِ رَبِّنَا مَا كُنَّا مُشْرِكِينَ
    arabicPlain: ثم لم تكن فتنتهم إلا أن قالوا والله ربنا ما كنا مشركين
    surahName: Al-An'aam
    juz: 7
