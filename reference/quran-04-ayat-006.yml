  data:
    ref: 6:61
    scripture: quran
    name: Quran 6:61
    chapter: 6
    verse: 61
    ordinal: 850
    text: He is the Omnipotent over His slaves. He sendeth guardians over you until, when death cometh unto one of you, Our messengers receive him, and they neglect not.
    translation: Pickthall
    original: وَهُوَ ٱلْقَاهِرُ فَوْقَ عِبَادِهِۦ ۖ وَيُرْسِلُ عَلَيْكُمْ حَفَظَةً حَتَّىٰٓ إِذَا جَآءَ أَحَدَكُمُ ٱلْمَوْتُ تَوَفَّتْهُ رُسُلُنَا وَهُمْ لَا يُفَرِّطُونَ
    arabicPlain: وهو القاهر فوق عباده ۖ ويرسل عليكم حفظة حتى إذا جاء أحدكم الموت توفته رسلنا وهم لا يفرطون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 109
    page: 135
