- type: Ayah
  data:
    ref: '6:32'
    scripture: quran
    name: Quran 6:32
    chapter: 6
    verse: 32
    ordinal: 821
    text: Naught is the life of the world save a pastime and a sport. Better far is the abode of the Hereafter for those who keep their duty (to Allah). Have ye then no sense?
    translation: Pickthall
    original: وَمَا ٱلْحَيَوٰةُ ٱلدُّنْيَآ إِلَّا لَعِبٌ وَلَهْوٌ ۖ وَلَلدَّارُ ٱلْـَٔاخِرَةُ خَيْرٌ لِّلَّذِينَ يَتَّقُونَ ۗ أَفَلَا تَعْقِلُونَ
    arabicPlain: وما الحياة الدنيا إلا لعب ولهو ۖ وللدار الآخرة خير للذين يتقون ۗ أفلا تعقلون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 105
    page: 131
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '6'
  - predicate: IN_PORTION
    to:
      type: Juz
