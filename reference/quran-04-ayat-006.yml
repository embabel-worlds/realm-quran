  data:
    ref: 6:154
    scripture: quran
    name: Quran 6:154
    chapter: 6
    verse: 154
    ordinal: 943
    text: Again, We gave the Scripture unto Moses, complete for him who would do good, an explanation of all things, a guidance and a mercy, that they might believe in the meeting with their Lord.
    translation: Pickthall
    original: ثُمَّ ءَاتَيْنَا مُوسَى ٱلْكِتَـٰبَ تَمَامًا عَلَى ٱلَّذِىٓ أَحْسَنَ وَتَفْصِيلًا لِّكُلِّ شَىْءٍ وَهُدًى وَرَحْمَةً لَّعَلَّهُم بِلِقَآءِ رَبِّهِمْ يُؤْمِنُونَ
    arabicPlain: ثم آتينا موسى الكتاب تماما على الذي أحسن وتفصيلا لكل شيء وهدى ورحمة لعلهم بلقاء ربهم يؤمنون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 120
    page: 149
