  data:
    ref: '6:45'
    scripture: quran
    name: Quran 6:45
    chapter: 6
    verse: 45
    ordinal: 834
    text: So of the people who did wrong the last remnant was cut off. Praise be to Allah, Lord of the Worlds!
    translation: Pickthall
    original: فَقُطِعَ دَابِرُ ٱلْقَوْمِ ٱلَّذِينَ ظَلَمُوا۟ ۚ وَٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَـٰلَمِينَ
    arabicPlain: فقطع دابر القوم الذين ظلموا ۚ والحمد لله رب العالمين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 106
