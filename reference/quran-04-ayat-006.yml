    chapter: 6
    verse: 131
    ordinal: 920
    text: This is because thy Lord destroyeth not the townships arbitrarily while their people are unconscious (of the wrong they do).
    translation: Pickthall
    original: ذَٰلِكَ أَن لَّمْ يَكُن رَّبُّكَ مُهْلِكَ ٱلْقُرَىٰ بِظُلْمٍ وَأَهْلُهَا غَـٰفِلُونَ
    arabicPlain: ذلك أن لم يكن ربك مهلك القرى بظلم وأهلها غافلون
