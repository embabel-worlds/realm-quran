  data:
    ref: '6:34'
    scripture: quran
    name: Quran 6:34
    chapter: 6
    verse: 34
    ordinal: 823
    text: Messengers indeed have been denied before thee, and they were patient under the denial and the persecution till Our succour reached them. There is none to alter the decisions of Allah. Already there hath reached thee (somewhat) of the tidings of the messengers (We sent before).
    translation: Pickthall
    original: وَلَقَدْ كُذِّبَتْ رُسُلٌ مِّن قَبْلِكَ فَصَبَرُوا۟ عَلَىٰ مَا كُذِّبُوا۟ وَأُوذُوا۟ حَتَّىٰٓ أَتَىٰهُمْ نَصْرُنَا ۚ وَلَا مُبَدِّلَ لِكَلِمَـٰتِ ٱللَّهِ ۚ وَلَقَدْ جَآءَكَ مِن نَّبَإِى۟ ٱلْمُرْسَلِينَ
    arabicPlain: ولقد كذبت رسل من قبلك فصبروا على ما كذبوا وأوذوا حتى أتاهم نصرنا ۚ ولا مبدل لكلمات الله ۚ ولقد جاءك من نبإ المرسلين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 105
    page: 131
