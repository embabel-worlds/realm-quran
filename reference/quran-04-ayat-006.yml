  data:
    ref: '6:56'
    scripture: quran
    name: Quran 6:56
    chapter: 6
    verse: 56
    ordinal: 845
    text: 'Say: I am forbidden to worship those on whom ye call instead of Allah. Say: I will not follow your desires, for then should I go astray and I should not be of the rightly guided.'
    translation: Pickthall
    original: قُلْ إِنِّى نُهِيتُ أَنْ أَعْبُدَ ٱلَّذِينَ تَدْعُونَ مِن دُونِ ٱللَّهِ ۚ قُل لَّآ أَتَّبِعُ أَهْوَآءَكُمْ ۙ قَدْ ضَلَلْتُ إِذًا وَمَآ أَنَا۠ مِنَ ٱلْمُهْتَدِينَ
    arabicPlain: قل إني نهيت أن أعبد الذين تدعون من دون الله ۚ قل لا أتبع أهواءكم ۙ قد ضللت إذا وما أنا من المهتدين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 108
    page: 134
