  data:
    ref: '6:51'
    scripture: quran
    name: Quran 6:51
    chapter: 6
    verse: 51
    ordinal: 840
    text: Warn hereby those who fear (because they know) that they will be gathered unto their Lord, for whom there is no protecting ally nor intercessor beside Him, that they may ward off (evil).
    translation: Pickthall
    original: وَأَنذِرْ بِهِ ٱلَّذِينَ يَخَافُونَ أَن يُحْشَرُوٓا۟ إِلَىٰ رَبِّهِمْ ۙ لَيْسَ لَهُم مِّن دُونِهِۦ وَلِىٌّ وَلَا شَفِيعٌ لَّعَلَّهُمْ يَتَّقُونَ
    arabicPlain: وأنذر به الذين يخافون أن يحشروا إلى ربهم ۙ ليس لهم من دونه ولي ولا شفيع لعلهم يتقون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 107
    page: 133
