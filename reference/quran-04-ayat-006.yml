  data:
    ref: 6:110
    scripture: quran
    name: Quran 6:110
    chapter: 6
    verse: 110
    ordinal: 899
    text: We confound their hearts and their eyes. As they believed not therein at the first, We let them wander blindly on in their contumacy.
    translation: Pickthall
    original: وَنُقَلِّبُ أَفْـِٔدَتَهُمْ وَأَبْصَـٰرَهُمْ كَمَا لَمْ يُؤْمِنُوا۟ بِهِۦٓ أَوَّلَ مَرَّةٍ وَنَذَرُهُمْ فِى طُغْيَـٰنِهِمْ يَعْمَهُونَ
    arabicPlain: ونقلب أفئدتهم وأبصارهم كما لم يؤمنوا به أول مرة ونذرهم في طغيانهم يعمهون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 114
    page: 141
