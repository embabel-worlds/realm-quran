  data:
    ref: 6:104
    scripture: quran
    name: Quran 6:104
    chapter: 6
    verse: 104
    ordinal: 893
    text: Proofs have come unto you from your Lord, so whoso seeth, it is for his own good, and whoso is blind is blind to his own hurt. And I am not a keeper over you.
    translation: Pickthall
    original: قَدْ جَآءَكُم بَصَآئِرُ مِن رَّبِّكُمْ ۖ فَمَنْ أَبْصَرَ فَلِنَفْسِهِۦ ۖ وَمَنْ عَمِىَ فَعَلَيْهَا ۚ وَمَآ أَنَا۠ عَلَيْكُم بِحَفِيظٍ
    arabicPlain: قد جاءكم بصائر من ربكم ۖ فمن أبصر فلنفسه ۖ ومن عمي فعليها ۚ وما أنا عليكم بحفيظ
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 114
    page: 141
