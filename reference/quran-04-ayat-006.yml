    text: Lo! that which ye are promised will surely come to pass, and ye cannot escape.
    translation: Pickthall
    original: إِنَّ مَا تُوعَدُونَ لَـَٔاتٍ ۖ وَمَآ أَنتُم بِمُعْجِزِينَ
