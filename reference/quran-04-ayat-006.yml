  data:
    ref: 6:77
    scripture: quran
    name: Quran 6:77
    chapter: 6
    verse: 77
    ordinal: 866
    text: 'And when he saw the moon uprising, he exclaimed: This is my Lord. But when it set, he said: Unless my Lord guide me, I surely shall become one of the folk who are astray.'
    translation: Pickthall
    original: فَلَمَّا رَءَا ٱلْقَمَرَ بَازِغًا قَالَ هَـٰذَا رَبِّى ۖ فَلَمَّآ أَفَلَ قَالَ لَئِن لَّمْ يَهْدِنِى رَبِّى لَأَكُونَنَّ مِنَ ٱلْقَوْمِ ٱلضَّآلِّينَ
    arabicPlain: فلما رأى القمر بازغا قال هذا ربي ۖ فلما أفل قال لئن لم يهدني ربي لأكونن من القوم الضالين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 110
    page: 137
