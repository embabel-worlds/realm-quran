  data:
    ref: '6:39'
    scripture: quran
    name: Quran 6:39
    chapter: 6
    verse: 39
    ordinal: 828
    text: Those who deny Our revelations are deaf and dumb in darkness. Whom Allah will sendeth astray, and whom He will He placeth on a straight path.
    translation: Pickthall
    original: وَٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَـٰتِنَا صُمٌّ وَبُكْمٌ فِى ٱلظُّلُمَـٰتِ ۗ مَن يَشَإِ ٱللَّهُ يُضْلِلْهُ وَمَن يَشَأْ يَجْعَلْهُ عَلَىٰ صِرَٰطٍ مُّسْتَقِيمٍ
    arabicPlain: والذين كذبوا بآياتنا صم وبكم في الظلمات ۗ من يشإ الله يضلله ومن يشأ يجعله على صراط مستقيم
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 105
