  data:
    ref: 6:96
    scripture: quran
    name: Quran 6:96
    chapter: 6
    verse: 96
    ordinal: 885
    text: He is the Cleaver of the Daybreak, and He hath appointed the night for stillness, and the sun and the moon for reckoning. That is the measuring of the Mighty, the Wise.
    translation: Pickthall
    original: فَالِقُ ٱلْإِصْبَاحِ وَجَعَلَ ٱلَّيْلَ سَكَنًا وَٱلشَّمْسَ وَٱلْقَمَرَ حُسْبَانًا ۚ ذَٰلِكَ تَقْدِيرُ ٱلْعَزِيزِ ٱلْعَلِيمِ
    arabicPlain: فالق الإصباح وجعل الليل سكنا والشمس والقمر حسبانا ۚ ذلك تقدير العزيز العليم
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 113
    page: 140
  relations:
