  data:
    ref: 6:60
    scripture: quran
    name: Quran 6:60
    chapter: 6
    verse: 60
    ordinal: 849
    text: He it is Who gathereth you at night and knoweth that which ye commit by day. Then He raiseth you again to life therein, that the term appointed (for you) may be accomplished. And afterward unto Him is your return. Then He will proclaim unto you what ye used to do.
    translation: Pickthall
    original: وَهُوَ ٱلَّذِى يَتَوَفَّىٰكُم بِٱلَّيْلِ وَيَعْلَمُ مَا جَرَحْتُم بِٱلنَّهَارِ ثُمَّ يَبْعَثُكُمْ فِيهِ لِيُقْضَىٰٓ أَجَلٌ مُّسَمًّى ۖ ثُمَّ إِلَيْهِ مَرْجِعُكُمْ ثُمَّ يُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَ
    arabicPlain: وهو الذي يتوفاكم بالليل ويعلم ما جرحتم بالنهار ثم يبعثكم فيه ليقضى أجل مسمى ۖ ثم إليه مرجعكم ثم ينبئكم بما كنتم تعملون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 108
    page: 135
