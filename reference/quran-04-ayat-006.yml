  data:
    ref: '6:47'
    scripture: quran
    name: Quran 6:47
    chapter: 6
    verse: 47
    ordinal: 836
    text: 'Say: Can ye see yourselves, if the punishment of Allah come upon you unawares or openly? Would any perish save wrongdoing folk?'
    translation: Pickthall
    original: قُلْ أَرَءَيْتَكُمْ إِنْ أَتَىٰكُمْ عَذَابُ ٱللَّهِ بَغْتَةً أَوْ جَهْرَةً هَلْ يُهْلَكُ إِلَّا ٱلْقَوْمُ ٱلظَّـٰلِمُونَ
    arabicPlain: قل أرأيتكم إن أتاكم عذاب الله بغتة أو جهرة هل يهلك إلا القوم الظالمون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 106
