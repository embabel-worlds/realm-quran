  data:
    ref: 6:89
    scripture: quran
    name: Quran 6:89
    chapter: 6
    verse: 89
    ordinal: 878
    text: Those are they unto whom We gave the Scripture and command and prophethood. But if these disbelieve therein, then indeed We shall entrust it to a people who will not be disbelievers therein.
    translation: Pickthall
    original: أُو۟لَـٰٓئِكَ ٱلَّذِينَ ءَاتَيْنَـٰهُمُ ٱلْكِتَـٰبَ وَٱلْحُكْمَ وَٱلنُّبُوَّةَ ۚ فَإِن يَكْفُرْ بِهَا هَـٰٓؤُلَآءِ فَقَدْ وَكَّلْنَا بِهَا قَوْمًا لَّيْسُوا۟ بِهَا بِكَـٰفِرِينَ
    arabicPlain: أولئك الذين آتيناهم الكتاب والحكم والنبوة ۚ فإن يكفر بها هؤلاء فقد وكلنا بها قوما ليسوا بها بكافرين
