  data:
    ref: 6:118
    scripture: quran
    name: Quran 6:118
    chapter: 6
    verse: 118
    ordinal: 907
    text: Eat of that over which the name of Allah hath been mentioned, if ye are believers in His revelations.
    translation: Pickthall
    original: فَكُلُوا۟ مِمَّا ذُكِرَ ٱسْمُ ٱللَّهِ عَلَيْهِ إِن كُنتُم بِـَٔايَـٰتِهِۦ مُؤْمِنِينَ
    arabicPlain: فكلوا مما ذكر اسم الله عليه إن كنتم بآياته مؤمنين
    surahName: Al-An'aam
    juz: 8
