- type: Ayah
  data:
    ref: '6:28'
    scripture: quran
    name: Quran 6:28
    chapter: 6
    verse: 28
    ordinal: 817
    text: Nay, but that hath become clear unto them which before they used to hide. And if they were sent back they would return unto that which they are forbidden. Lo! they are liars.
    translation: Pickthall
    original: بَلْ بَدَا لَهُم مَّا كَانُوا۟ يُخْفُونَ مِن قَبْلُ ۖ وَلَوْ رُدُّوا۟ لَعَادُوا۟ لِمَا نُهُوا۟ عَنْهُ وَإِنَّهُمْ لَكَـٰذِبُونَ
    arabicPlain: بل بدا لهم ما كانوا يخفون من قبل ۖ ولو ردوا لعادوا لما نهوا عنه وإنهم لكاذبون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 104
    page: 131
