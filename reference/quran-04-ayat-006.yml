  data:
    ref: 6:90
    scripture: quran
    name: Quran 6:90
    chapter: 6
    verse: 90
    ordinal: 879
    text: 'Those are they whom Allah guideth, so follow their guidance. Say (O Muhammad, unto mankind): I ask of you no fee for it. Lo! it is naught but a Reminder to (His) creatures.'
    translation: Pickthall
    original: أُو۟لَـٰٓئِكَ ٱلَّذِينَ هَدَى ٱللَّهُ ۖ فَبِهُدَىٰهُمُ ٱقْتَدِهْ ۗ قُل لَّآ أَسْـَٔلُكُمْ عَلَيْهِ أَجْرًا ۖ إِنْ هُوَ إِلَّا ذِكْرَىٰ لِلْعَـٰلَمِينَ
    arabicPlain: أولئك الذين هدى الله ۖ فبهداهم اقتده ۗ قل لا أسألكم عليه أجرا ۖ إن هو إلا ذكرى للعالمين
