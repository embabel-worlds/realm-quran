  data:
    ref: 6:63
    scripture: quran
    name: Quran 6:63
    chapter: 6
    verse: 63
    ordinal: 852
    text: 'Say: Who delivereth you from the darkness of the land and the sea? Ye call upon Him humbly and in secret, (saying): If we are delivered from this (fear) we truly will be of the thankful.'
    translation: Pickthall
    original: قُلْ مَن يُنَجِّيكُم مِّن ظُلُمَـٰتِ ٱلْبَرِّ وَٱلْبَحْرِ تَدْعُونَهُۥ تَضَرُّعًا وَخُفْيَةً لَّئِنْ أَنجَىٰنَا مِنْ هَـٰذِهِۦ لَنَكُونَنَّ مِنَ ٱلشَّـٰكِرِينَ
    arabicPlain: قل من ينجيكم من ظلمات البر والبحر تدعونه تضرعا وخفية لئن أنجانا من هذه لنكونن من الشاكرين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 109
    page: 135
