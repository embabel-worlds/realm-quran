  data:
    ref: 6:149
    scripture: quran
    name: Quran 6:149
    chapter: 6
    verse: 149
    ordinal: 938
    text: Say - For Allah's is the final argument - Had He willed He could indeed have guided all of you.
    translation: Pickthall
    original: قُلْ فَلِلَّهِ ٱلْحُجَّةُ ٱلْبَـٰلِغَةُ ۖ فَلَوْ شَآءَ لَهَدَىٰكُمْ أَجْمَعِينَ
    arabicPlain: قل فلله الحجة البالغة ۖ فلو شاء لهداكم أجمعين
    surahName: Al-An'aam
    juz: 8
