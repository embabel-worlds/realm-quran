  data:
    ref: 6:123
    scripture: quran
    name: Quran 6:123
    chapter: 6
    verse: 123
    ordinal: 912
    text: And thus have We made in every city great ones of its wicked ones, that they should plot therein. They do but plot against themselves, though they perceive not.
    translation: Pickthall
    original: وَكَذَٰلِكَ جَعَلْنَا فِى كُلِّ قَرْيَةٍ أَكَـٰبِرَ مُجْرِمِيهَا لِيَمْكُرُوا۟ فِيهَا ۖ وَمَا يَمْكُرُونَ إِلَّا بِأَنفُسِهِمْ وَمَا يَشْعُرُونَ
    arabicPlain: وكذلك جعلنا في كل قرية أكابر مجرميها ليمكروا فيها ۖ وما يمكرون إلا بأنفسهم وما يشعرون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 116
    page: 143
