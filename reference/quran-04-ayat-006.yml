  data:
    ref: '6:41'
    scripture: quran
    name: Quran 6:41
    chapter: 6
    verse: 41
    ordinal: 830
    text: Nay, but unto Him ye call, and He removeth that because of which ye call unto Him, if He will, and ye forget whatever partners ye ascribed unto Him.
    translation: Pickthall
    original: بَلْ إِيَّاهُ تَدْعُونَ فَيَكْشِفُ مَا تَدْعُونَ إِلَيْهِ إِن شَآءَ وَتَنسَوْنَ مَا تُشْرِكُونَ
    arabicPlain: بل إياه تدعون فيكشف ما تدعون إليه إن شاء وتنسون ما تشركون
    surahName: Al-An'aam
    juz: 7
