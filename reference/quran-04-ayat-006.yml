  data:
    ref: 6:153
    scripture: quran
    name: Quran 6:153
    chapter: 6
    verse: 153
    ordinal: 942
    text: 'And (He commandeth you, saying): This is My straight path, so follow it. Follow not other ways, lest ye be parted from His way. This hath He ordained for you, that ye may ward off (evil).'
    translation: Pickthall
    original: وَأَنَّ هَـٰذَا صِرَٰطِى مُسْتَقِيمًا فَٱتَّبِعُوهُ ۖ وَلَا تَتَّبِعُوا۟ ٱلسُّبُلَ فَتَفَرَّقَ بِكُمْ عَن سَبِيلِهِۦ ۚ ذَٰلِكُمْ وَصَّىٰكُم بِهِۦ لَعَلَّكُمْ تَتَّقُونَ
    arabicPlain: وأن هذا صراطي مستقيما فاتبعوه ۖ ولا تتبعوا السبل فتفرق بكم عن سبيله ۚ ذلكم وصاكم به لعلكم تتقون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 120
    page: 149
