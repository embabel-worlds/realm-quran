  data:
    ref: 6:112
    scripture: quran
    name: Quran 6:112
    chapter: 6
    verse: 112
    ordinal: 901
    text: Thus have We appointed unto every prophet an adversary - devils of humankind and jinn who inspire in one another plausible discourse through guile. If thy Lord willed, they would not do so; so leave them alone with their devising;
    translation: Pickthall
    original: وَكَذَٰلِكَ جَعَلْنَا لِكُلِّ نَبِىٍّ عَدُوًّا شَيَـٰطِينَ ٱلْإِنسِ وَٱلْجِنِّ يُوحِى بَعْضُهُمْ إِلَىٰ بَعْضٍ زُخْرُفَ ٱلْقَوْلِ غُرُورًا ۚ وَلَوْ شَآءَ رَبُّكَ مَا فَعَلُوهُ ۖ فَذَرْهُمْ وَمَا يَفْتَرُونَ
    arabicPlain: وكذلك جعلنا لكل نبي عدوا شياطين الإنس والجن يوحي بعضهم إلى بعض زخرف القول غرورا ۚ ولو شاء ربك ما فعلوه ۖ فذرهم وما يفترون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 115
    page: 142
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '6'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-8
- type: Ayah
  data:
    ref: 6:113
    scripture: quran
    name: Quran 6:113
    chapter: 6
    verse: 113
    ordinal: 902
    text: That the hearts of those who believe not in the Hereafter may incline thereto, and that they may take pleasure therein, and that they may earn what they are earning.
    translation: Pickthall
    original: وَلِتَصْغَىٰٓ إِلَيْهِ أَفْـِٔدَةُ ٱلَّذِينَ لَا يُؤْمِنُونَ بِٱلْـَٔاخِرَةِ وَلِيَرْضَوْهُ وَلِيَقْتَرِفُوا۟ مَا هُم مُّقْتَرِفُونَ
    arabicPlain: ولتصغى إليه أفئدة الذين لا يؤمنون بالآخرة وليرضوه وليقترفوا ما هم مقترفون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 115
    page: 142
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '6'
  - predicate: IN_PORTION
    to:
      type: Juz
