  data:
    ref: '6:22'
    scripture: quran
    name: Quran 6:22
    chapter: 6
    verse: 22
    ordinal: 811
    text: 'And on the day We gather them together We shall say unto those who ascribed partners (unto Allah): Where are (now) those partners of your make-believe?'
    translation: Pickthall
    original: وَيَوْمَ نَحْشُرُهُمْ جَمِيعًا ثُمَّ نَقُولُ لِلَّذِينَ أَشْرَكُوٓا۟ أَيْنَ شُرَكَآؤُكُمُ ٱلَّذِينَ كُنتُمْ تَزْعُمُونَ
    arabicPlain: ويوم نحشرهم جميعا ثم نقول للذين أشركوا أين شركاؤكم الذين كنتم تزعمون
    surahName: Al-An'aam
    juz: 7
