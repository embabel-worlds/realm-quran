  data:
    ref: 6:83
    scripture: quran
    name: Quran 6:83
    chapter: 6
    verse: 83
    ordinal: 872
    text: That is Our argument. We gave it unto Abraham against his folk. We raise unto degrees of wisdom whom We will. Lo! thy Lord is Wise, Aware.
    translation: Pickthall
    original: وَتِلْكَ حُجَّتُنَآ ءَاتَيْنَـٰهَآ إِبْرَٰهِيمَ عَلَىٰ قَوْمِهِۦ ۚ نَرْفَعُ دَرَجَـٰتٍ مَّن نَّشَآءُ ۗ إِنَّ رَبَّكَ حَكِيمٌ عَلِيمٌ
    arabicPlain: وتلك حجتنا آتيناها إبراهيم على قومه ۚ نرفع درجات من نشاء ۗ إن ربك حكيم عليم
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 111
    page: 138
