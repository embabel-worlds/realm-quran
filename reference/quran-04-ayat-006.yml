  data:
    ref: 6:136
    scripture: quran
    name: Quran 6:136
    chapter: 6
    verse: 136
    ordinal: 925
    text: 'They assign unto Allah, of the crops and cattle which He created, a portion, and they say: "This is Allah''s" - in their make-believe - "and this is for (His) partners in regard to us." Thus that which (they assign) unto His partners in them reacheth not Allah and that which (they assign) unto Allah goeth to their (so-called) partners. Evil is their ordinance.'
    translation: Pickthall
    original: وَجَعَلُوا۟ لِلَّهِ مِمَّا ذَرَأَ مِنَ ٱلْحَرْثِ وَٱلْأَنْعَـٰمِ نَصِيبًا فَقَالُوا۟ هَـٰذَا لِلَّهِ بِزَعْمِهِمْ وَهَـٰذَا لِشُرَكَآئِنَا ۖ فَمَا كَانَ لِشُرَكَآئِهِمْ فَلَا يَصِلُ إِلَى ٱللَّهِ ۖ وَمَا كَانَ لِلَّهِ فَهُوَ يَصِلُ إِلَىٰ شُرَكَآئِهِمْ ۗ سَآءَ مَا يَحْكُمُونَ
    arabicPlain: وجعلوا لله مما ذرأ من الحرث والأنعام نصيبا فقالوا هذا لله بزعمهم وهذا لشركائنا ۖ فما كان لشركائهم فلا يصل إلى الله ۖ وما كان لله فهو يصل إلى شركائهم ۗ ساء ما يحكمون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 117
    page: 145
