  data:
    ref: '6:43'
    scripture: quran
    name: Quran 6:43
    chapter: 6
    verse: 43
    ordinal: 832
    text: If only, when Our disaster came on them, they had been humble! But their hearts were hardened and the devil made all that they used to do seem fair unto them!
    translation: Pickthall
    original: فَلَوْلَآ إِذْ جَآءَهُم بَأْسُنَا تَضَرَّعُوا۟ وَلَـٰكِن قَسَتْ قُلُوبُهُمْ وَزَيَّنَ لَهُمُ ٱلشَّيْطَـٰنُ مَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: فلولا إذ جاءهم بأسنا تضرعوا ولكن قست قلوبهم وزين لهم الشيطان ما كانوا يعملون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 106
    page: 132
