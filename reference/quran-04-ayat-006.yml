  data:
    ref: 6:142
    scripture: quran
    name: Quran 6:142
    chapter: 6
    verse: 142
    ordinal: 931
    text: And of the cattle (He produceth) some for burdens, some for food. Eat of that which Allah hath bestowed upon you, and follow not the footsteps of the devil, for lo! he is an open foe to you.
    translation: Pickthall
    original: وَمِنَ ٱلْأَنْعَـٰمِ حَمُولَةً وَفَرْشًا ۚ كُلُوا۟ مِمَّا رَزَقَكُمُ ٱللَّهُ وَلَا تَتَّبِعُوا۟ خُطُوَٰتِ ٱلشَّيْطَـٰنِ ۚ إِنَّهُۥ لَكُمْ عَدُوٌّ مُّبِينٌ
    arabicPlain: ومن الأنعام حمولة وفرشا ۚ كلوا مما رزقكم الله ولا تتبعوا خطوات الشيطان ۚ إنه لكم عدو مبين
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 118
    page: 146
