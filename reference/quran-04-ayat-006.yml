  data:
    ref: 6:125
    scripture: quran
    name: Quran 6:125
    chapter: 6
    verse: 125
    ordinal: 914
    text: And whomsoever it is Allah's will to guide, He expandeth his bosom unto the Surrender, and whomsoever it is His Will to send astray, He maketh his bosom close and narrow as if he were engaged in sheer ascent. Thus Allah layeth ignominy upon those who believe not.
    translation: Pickthall
    original: فَمَن يُرِدِ ٱللَّهُ أَن يَهْدِيَهُۥ يَشْرَحْ صَدْرَهُۥ لِلْإِسْلَـٰمِ ۖ وَمَن يُرِدْ أَن يُضِلَّهُۥ يَجْعَلْ صَدْرَهُۥ ضَيِّقًا حَرَجًا كَأَنَّمَا يَصَّعَّدُ فِى ٱلسَّمَآءِ ۚ كَذَٰلِكَ يَجْعَلُ ٱللَّهُ ٱلرِّجْسَ عَلَى ٱلَّذِينَ لَا يُؤْمِنُونَ
    arabicPlain: فمن يرد الله أن يهديه يشرح صدره للإسلام ۖ ومن يرد أن يضله يجعل صدره ضيقا حرجا كأنما يصعد في السماء ۚ كذلك يجعل الله الرجس على الذين لا يؤمنون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 116
    page: 144
