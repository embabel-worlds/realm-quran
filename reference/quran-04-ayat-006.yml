    scripture: quran
    name: Quran 6:55
    chapter: 6
    verse: 55
    ordinal: 844
    text: Thus do We expound the revelations that the way of the unrighteous may be manifest.
    translation: Pickthall
    original: وَكَذَٰلِكَ نُفَصِّلُ ٱلْـَٔايَـٰتِ وَلِتَسْتَبِينَ سَبِيلُ ٱلْمُجْرِمِينَ
    arabicPlain: وكذلك نفصل الآيات ولتستبين سبيل المجرمين
