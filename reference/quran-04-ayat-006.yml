  data:
    ref: 6:102
    scripture: quran
    name: Quran 6:102
    chapter: 6
    verse: 102
    ordinal: 891
    text: Such is Allah, your Lord. There is no Allah save Him, the Creator of all things, so worship Him. And He taketh care of all things.
    translation: Pickthall
    original: ذَٰلِكُمُ ٱللَّهُ رَبُّكُمْ ۖ لَآ إِلَـٰهَ إِلَّا هُوَ ۖ خَـٰلِقُ كُلِّ شَىْءٍ فَٱعْبُدُوهُ ۚ وَهُوَ عَلَىٰ كُلِّ شَىْءٍ وَكِيلٌ
    arabicPlain: ذلكم الله ربكم ۖ لا إله إلا هو ۖ خالق كل شيء فاعبدوه ۚ وهو على كل شيء وكيل
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 114
