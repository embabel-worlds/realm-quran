  data:
    ref: 6:108
    scripture: quran
    name: Quran 6:108
    chapter: 6
    verse: 108
    ordinal: 897
    text: Revile not those unto whom they pray beside Allah lest they wrongfully revile Allah through ignorance. Thus unto every nation have We made their deed seem fair. Then unto their Lord is their return, and He will tell them what they used to do.
    translation: Pickthall
    original: وَلَا تَسُبُّوا۟ ٱلَّذِينَ يَدْعُونَ مِن دُونِ ٱللَّهِ فَيَسُبُّوا۟ ٱللَّهَ عَدْوًۢا بِغَيْرِ عِلْمٍ ۗ كَذَٰلِكَ زَيَّنَّا لِكُلِّ أُمَّةٍ عَمَلَهُمْ ثُمَّ إِلَىٰ رَبِّهِم مَّرْجِعُهُمْ فَيُنَبِّئُهُم بِمَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: ولا تسبوا الذين يدعون من دون الله فيسبوا الله عدوا بغير علم ۗ كذلك زينا لكل أمة عملهم ثم إلى ربهم مرجعهم فينبئهم بما كانوا يعملون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 114
    page: 141
