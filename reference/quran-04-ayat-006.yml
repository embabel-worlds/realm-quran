  data:
    ref: 6:84
    scripture: quran
    name: Quran 6:84
    chapter: 6
    verse: 84
    ordinal: 873
    text: And We bestowed upon him Isaac and Jacob; each of them We guided; and Noah did We guide aforetime; and of his seed (We guided) David and Solomon and Job and Joseph and Moses and Aaron. Thus do We reward the good.
    translation: Pickthall
    original: وَوَهَبْنَا لَهُۥٓ إِسْحَـٰقَ وَيَعْقُوبَ ۚ كُلًّا هَدَيْنَا ۚ وَنُوحًا هَدَيْنَا مِن قَبْلُ ۖ وَمِن ذُرِّيَّتِهِۦ دَاوُۥدَ وَسُلَيْمَـٰنَ وَأَيُّوبَ وَيُوسُفَ وَمُوسَىٰ وَهَـٰرُونَ ۚ وَكَذَٰلِكَ نَجْزِى ٱلْمُحْسِنِينَ
    arabicPlain: ووهبنا له إسحاق ويعقوب ۚ كلا هدينا ۚ ونوحا هدينا من قبل ۖ ومن ذريته داوود وسليمان وأيوب ويوسف وموسى وهارون ۚ وكذلك نجزي المحسنين
