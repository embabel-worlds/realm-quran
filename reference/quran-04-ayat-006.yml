  data:
    ref: 6:88
    scripture: quran
    name: Quran 6:88
    chapter: 6
    verse: 88
    ordinal: 877
    text: Such is the guidance of Allah wherewith He guideth whom He will of His bondmen. But if they had set up (for worship) aught beside Him, (all) that they did would have been vain.
    translation: Pickthall
    original: ذَٰلِكَ هُدَى ٱللَّهِ يَهْدِى بِهِۦ مَن يَشَآءُ مِنْ عِبَادِهِۦ ۚ وَلَوْ أَشْرَكُوا۟ لَحَبِطَ عَنْهُم مَّا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: ذلك هدى الله يهدي به من يشاء من عباده ۚ ولو أشركوا لحبط عنهم ما كانوا يعملون
