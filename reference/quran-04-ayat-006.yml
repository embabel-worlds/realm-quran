  data:
    ref: 6:140
    scripture: quran
    name: Quran 6:140
    chapter: 6
    verse: 140
    ordinal: 929
    text: They are losers who besottedly have slain their children without knowledge, and have forbidden that which Allah bestowed upon them, inventing a lie against Allah. They indeed have gone astray and are not guided.
    translation: Pickthall
    original: قَدْ خَسِرَ ٱلَّذِينَ قَتَلُوٓا۟ أَوْلَـٰدَهُمْ سَفَهًۢا بِغَيْرِ عِلْمٍ وَحَرَّمُوا۟ مَا رَزَقَهُمُ ٱللَّهُ ٱفْتِرَآءً عَلَى ٱللَّهِ ۚ قَدْ ضَلُّوا۟ وَمَا كَانُوا۟ مُهْتَدِينَ
    arabicPlain: قد خسر الذين قتلوا أولادهم سفها بغير علم وحرموا ما رزقهم الله افتراء على الله ۚ قد ضلوا وما كانوا مهتدين
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 117
    page: 146
