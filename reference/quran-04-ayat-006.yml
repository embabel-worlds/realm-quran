  data:
    ref: 6:92
    scripture: quran
    name: Quran 6:92
    chapter: 6
    verse: 92
    ordinal: 881
    text: And this is a blessed Scripture which We have revealed, confirming that which (was revealed) before it, that thou mayst warn the Mother of Villages and those around her. Those who believe in the Hereafter believe herein, and they are careful of their worship.
    translation: Pickthall
    original: وَهَـٰذَا كِتَـٰبٌ أَنزَلْنَـٰهُ مُبَارَكٌ مُّصَدِّقُ ٱلَّذِى بَيْنَ يَدَيْهِ وَلِتُنذِرَ أُمَّ ٱلْقُرَىٰ وَمَنْ حَوْلَهَا ۚ وَٱلَّذِينَ يُؤْمِنُونَ بِٱلْـَٔاخِرَةِ يُؤْمِنُونَ بِهِۦ ۖ وَهُمْ عَلَىٰ صَلَاتِهِمْ يُحَافِظُونَ
    arabicPlain: وهذا كتاب أنزلناه مبارك مصدق الذي بين يديه ولتنذر أم القرى ومن حولها ۚ والذين يؤمنون بالآخرة يؤمنون به ۖ وهم على صلاتهم يحافظون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 112
