  data:
    ref: '6:8'
    scripture: quran
    name: Quran 6:8
    chapter: 6
    verse: 8
    ordinal: 797
    text: 'They say: Why hath not an angel been sent down unto him? If We sent down an angel, then the matter would be judged; no further time would be allowed them (for reflection).'
    translation: Pickthall
    original: وَقَالُوا۟ لَوْلَآ أُنزِلَ عَلَيْهِ مَلَكٌ ۖ وَلَوْ أَنزَلْنَا مَلَكًا لَّقُضِىَ ٱلْأَمْرُ ثُمَّ لَا يُنظَرُونَ
    arabicPlain: وقالوا لولا أنزل عليه ملك ۖ ولو أنزلنا ملكا لقضي الأمر ثم لا ينظرون
    surahName: Al-An'aam
    juz: 7
