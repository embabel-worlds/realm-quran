  data:
    ref: '6:30'
    scripture: quran
    name: Quran 6:30
    chapter: 6
    verse: 30
    ordinal: 819
    text: 'If thou couldst see when they are set before their Lord! He will say: Is not this real? They will say: Yea, verily, by our Lord! He will say: Taste now the retribution for that ye used to disbelieve.'
    translation: Pickthall
    original: وَلَوْ تَرَىٰٓ إِذْ وُقِفُوا۟ عَلَىٰ رَبِّهِمْ ۚ قَالَ أَلَيْسَ هَـٰذَا بِٱلْحَقِّ ۚ قَالُوا۟ بَلَىٰ وَرَبِّنَا ۚ قَالَ فَذُوقُوا۟ ٱلْعَذَابَ بِمَا كُنتُمْ تَكْفُرُونَ
    arabicPlain: ولو ترى إذ وقفوا على ربهم ۚ قال أليس هذا بالحق ۚ قالوا بلى وربنا ۚ قال فذوقوا العذاب بما كنتم تكفرون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 104
    page: 131
