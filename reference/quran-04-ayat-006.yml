  data:
    ref: '6:59'
    scripture: quran
    name: Quran 6:59
    chapter: 6
    verse: 59
    ordinal: 848
    text: And with Him are the keys of the Invisible. None but He knoweth them. And He knoweth what is in the land and the sea. Not a leaf falleth but He knoweth it, not a grain amid the darkness of the earth, naught of wet or dry but (it is noted) in a clear record.
    translation: Pickthall
    original: ۞ وَعِندَهُۥ مَفَاتِحُ ٱلْغَيْبِ لَا يَعْلَمُهَآ إِلَّا هُوَ ۚ وَيَعْلَمُ مَا فِى ٱلْبَرِّ وَٱلْبَحْرِ ۚ وَمَا تَسْقُطُ مِن وَرَقَةٍ إِلَّا يَعْلَمُهَا وَلَا حَبَّةٍ فِى ظُلُمَـٰتِ ٱلْأَرْضِ وَلَا رَطْبٍ وَلَا يَابِسٍ إِلَّا فِى كِتَـٰبٍ مُّبِينٍ
    arabicPlain: ۞ وعنده مفاتح الغيب لا يعلمها إلا هو ۚ ويعلم ما في البر والبحر ۚ وما تسقط من ورقة إلا يعلمها ولا حبة في ظلمات الأرض ولا رطب ولا يابس إلا في كتاب مبين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 108
    page: 134
