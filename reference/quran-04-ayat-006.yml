  data:
    ref: 6:156
    scripture: quran
    name: Quran 6:156
    chapter: 6
    verse: 156
    ordinal: 945
    text: 'Lest ye should say: The Scripture was revealed only to two sects before us, and we in sooth were unaware of what they read;'
    translation: Pickthall
    original: أَن تَقُولُوٓا۟ إِنَّمَآ أُنزِلَ ٱلْكِتَـٰبُ عَلَىٰ طَآئِفَتَيْنِ مِن قَبْلِنَا وَإِن كُنَّا عَن دِرَاسَتِهِمْ لَغَـٰفِلِينَ
    arabicPlain: أن تقولوا إنما أنزل الكتاب على طائفتين من قبلنا وإن كنا عن دراستهم لغافلين
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 121
    page: 149
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '6'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-8
- type: Ayah
  data:
    ref: 6:157
    scripture: quran
    name: Quran 6:157
    chapter: 6
    verse: 157
    ordinal: 946
    text: 'Or lest ye should say: If the Scripture had been revealed unto us, we surely had been better guided than are they. Now hath there come unto you a clear proof from your Lord, a guidance and mercy; and who doeth greater wrong than he who denieth the revelations of Allah, and turneth away from them? We award unto those who turn away from Our revelations an evil doom because of their aversion.'
    translation: Pickthall
    original: أَوْ تَقُولُوا۟ لَوْ أَنَّآ أُنزِلَ عَلَيْنَا ٱلْكِتَـٰبُ لَكُنَّآ أَهْدَىٰ مِنْهُمْ ۚ فَقَدْ جَآءَكُم بَيِّنَةٌ مِّن رَّبِّكُمْ وَهُدًى وَرَحْمَةٌ ۚ فَمَنْ أَظْلَمُ مِمَّن كَذَّبَ بِـَٔايَـٰتِ ٱللَّهِ وَصَدَفَ عَنْهَا ۗ سَنَجْزِى ٱلَّذِينَ يَصْدِفُونَ عَنْ ءَايَـٰتِنَا سُوٓءَ ٱلْعَذَابِ بِمَا كَانُوا۟ يَصْدِفُونَ
    arabicPlain: أو تقولوا لو أنا أنزل علينا الكتاب لكنا أهدى منهم ۚ فقد جاءكم بينة من ربكم وهدى ورحمة ۚ فمن أظلم ممن كذب بآيات الله وصدف عنها ۗ سنجزي الذين يصدفون عن آياتنا سوء العذاب بما كانوا يصدفون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 121
    page: 149
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '6'
  - predicate: IN_PORTION
