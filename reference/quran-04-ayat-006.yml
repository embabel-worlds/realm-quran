  data:
    ref: 6:64
    scripture: quran
    name: Quran 6:64
    chapter: 6
    verse: 64
    ordinal: 853
    text: 'Say: Allah delivereth you from this and from all affliction. Yet ye attribute partners unto Him.'
    translation: Pickthall
    original: قُلِ ٱللَّهُ يُنَجِّيكُم مِّنْهَا وَمِن كُلِّ كَرْبٍ ثُمَّ أَنتُمْ تُشْرِكُونَ
    arabicPlain: قل الله ينجيكم منها ومن كل كرب ثم أنتم تشركون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 109
    page: 135
  relations:
