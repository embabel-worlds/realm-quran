  data:
    ref: 6:66
    scripture: quran
    name: Quran 6:66
    chapter: 6
    verse: 66
    ordinal: 855
    text: 'Thy people (O Muhammad) have denied it, though it is the Truth. Say: I am not put in charge of you.'
    translation: Pickthall
    original: وَكَذَّبَ بِهِۦ قَوْمُكَ وَهُوَ ٱلْحَقُّ ۚ قُل لَّسْتُ عَلَيْكُم بِوَكِيلٍ
    arabicPlain: وكذب به قومك وهو الحق ۚ قل لست عليكم بوكيل
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 109
    page: 135
  relations:
