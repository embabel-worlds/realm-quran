  data:
    ref: 6:150
    scripture: quran
    name: Quran 6:150
    chapter: 6
    verse: 150
    ordinal: 939
    text: 'Say: Come, bring your witnesses who can bear witness that Allah forbade (all) this. And if they bear witness, do not thou bear witness with them. Follow thou not the whims of those who deny Our revelations, those who believe not in the Hereafter and deem (others) equal with their Lord.'
    translation: Pickthall
    original: قُلْ هَلُمَّ شُهَدَآءَكُمُ ٱلَّذِينَ يَشْهَدُونَ أَنَّ ٱللَّهَ حَرَّمَ هَـٰذَا ۖ فَإِن شَهِدُوا۟ فَلَا تَشْهَدْ مَعَهُمْ ۚ وَلَا تَتَّبِعْ أَهْوَآءَ ٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَـٰتِنَا وَٱلَّذِينَ لَا يُؤْمِنُونَ بِٱلْـَٔاخِرَةِ وَهُم بِرَبِّهِمْ يَعْدِلُونَ
    arabicPlain: قل هلم شهداءكم الذين يشهدون أن الله حرم هذا ۖ فإن شهدوا فلا تشهد معهم ۚ ولا تتبع أهواء الذين كذبوا بآياتنا والذين لا يؤمنون بالآخرة وهم بربهم يعدلون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 119
    page: 148
