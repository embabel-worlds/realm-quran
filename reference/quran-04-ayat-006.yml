  data:
    ref: 6:94
    scripture: quran
    name: Quran 6:94
    chapter: 6
    verse: 94
    ordinal: 883
    text: Now have ye come unto Us solitary as We did create you at the first, and ye have left behind you all that We bestowed upon you, and We behold not with you those your intercessors, of whom ye claimed that they possessed a share in you. Now is the bond between you severed, and that which ye presumed hath failed you.
    translation: Pickthall
    original: وَلَقَدْ جِئْتُمُونَا فُرَٰدَىٰ كَمَا خَلَقْنَـٰكُمْ أَوَّلَ مَرَّةٍ وَتَرَكْتُم مَّا خَوَّلْنَـٰكُمْ وَرَآءَ ظُهُورِكُمْ ۖ وَمَا نَرَىٰ مَعَكُمْ شُفَعَآءَكُمُ ٱلَّذِينَ زَعَمْتُمْ أَنَّهُمْ فِيكُمْ شُرَكَـٰٓؤُا۟ ۚ لَقَد تَّقَطَّعَ بَيْنَكُمْ وَضَلَّ عَنكُم مَّا كُنتُمْ تَزْعُمُونَ
    arabicPlain: ولقد جئتمونا فرادى كما خلقناكم أول مرة وتركتم ما خولناكم وراء ظهوركم ۖ وما نرى معكم شفعاءكم الذين زعمتم أنهم فيكم شركاء ۚ لقد تقطع بينكم وضل عنكم ما كنتم تزعمون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 112
    page: 139
