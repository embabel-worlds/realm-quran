  data:
    ref: 6:75
    scripture: quran
    name: Quran 6:75
    chapter: 6
    verse: 75
    ordinal: 864
    text: 'Thus did We show Abraham the kingdom of the heavens and the earth that he might be of those possessing certainty:'
    translation: Pickthall
    original: وَكَذَٰلِكَ نُرِىٓ إِبْرَٰهِيمَ مَلَكُوتَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَلِيَكُونَ مِنَ ٱلْمُوقِنِينَ
    arabicPlain: وكذلك نري إبراهيم ملكوت السماوات والأرض وليكون من الموقنين
    surahName: Al-An'aam
    juz: 7
