  data:
    ref: '6:17'
    scripture: quran
    name: Quran 6:17
    chapter: 6
    verse: 17
    ordinal: 806
    text: If Allah touch thee with affliction, there is none that can relieve therefrom save Him, and if He touch thee with good fortune (there is none that can impair it); for He is Able to do all things.
    translation: Pickthall
    original: وَإِن يَمْسَسْكَ ٱللَّهُ بِضُرٍّ فَلَا كَاشِفَ لَهُۥٓ إِلَّا هُوَ ۖ وَإِن يَمْسَسْكَ بِخَيْرٍ فَهُوَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ
    arabicPlain: وإن يمسسك الله بضر فلا كاشف له إلا هو ۖ وإن يمسسك بخير فهو على كل شيء قدير
    surahName: Al-An'aam
