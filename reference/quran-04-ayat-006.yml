  data:
    ref: 6:129
    scripture: quran
    name: Quran 6:129
    chapter: 6
    verse: 129
    ordinal: 918
    text: Thus We let some of the wrong-doers have power over others because of what they are wont to earn.
    translation: Pickthall
    original: وَكَذَٰلِكَ نُوَلِّى بَعْضَ ٱلظَّـٰلِمِينَ بَعْضًۢا بِمَا كَانُوا۟ يَكْسِبُونَ
    arabicPlain: وكذلك نولي بعض الظالمين بعضا بما كانوا يكسبون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 116
    page: 144
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '6'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-8
