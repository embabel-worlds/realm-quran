  data:
    ref: 6:67
    scripture: quran
    name: Quran 6:67
    chapter: 6
    verse: 67
    ordinal: 856
    text: For every announcement there is a term, and ye will come to know.
    translation: Pickthall
    original: لِّكُلِّ نَبَإٍ مُّسْتَقَرٌّ ۚ وَسَوْفَ تَعْلَمُونَ
    arabicPlain: لكل نبإ مستقر ۚ وسوف تعلمون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 109
    page: 135
