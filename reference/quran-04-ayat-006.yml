  data:
    ref: 6:73
    scripture: quran
    name: Quran 6:73
    chapter: 6
    verse: 73
    ordinal: 862
    text: 'He it is Who created the heavens and the earth in truth. In the day when He saith: Be! it is. His Word is the Truth, and His will be the Sovereignty on the day when the trumpet is blown. Knower of the Invisible and the Visible, He is the Wise, the Aware.'
    translation: Pickthall
    original: وَهُوَ ٱلَّذِى خَلَقَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ بِٱلْحَقِّ ۖ وَيَوْمَ يَقُولُ كُن فَيَكُونُ ۚ قَوْلُهُ ٱلْحَقُّ ۚ وَلَهُ ٱلْمُلْكُ يَوْمَ يُنفَخُ فِى ٱلصُّورِ ۚ عَـٰلِمُ ٱلْغَيْبِ وَٱلشَّهَـٰدَةِ ۚ وَهُوَ ٱلْحَكِيمُ ٱلْخَبِيرُ
    arabicPlain: وهو الذي خلق السماوات والأرض بالحق ۖ ويوم يقول كن فيكون ۚ قوله الحق ۚ وله الملك يوم ينفخ في الصور ۚ عالم الغيب والشهادة ۚ وهو الحكيم الخبير
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 110
    page: 136
