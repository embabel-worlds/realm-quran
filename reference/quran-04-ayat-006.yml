  data:
    ref: 6:74
    scripture: quran
    name: Quran 6:74
    chapter: 6
    verse: 74
    ordinal: 863
    text: '(Remember) when Abraham said unto his father Azar: Takest thou idols for gods? Lo! I see thee and thy folk in error manifest.'
    translation: Pickthall
    original: ۞ وَإِذْ قَالَ إِبْرَٰهِيمُ لِأَبِيهِ ءَازَرَ أَتَتَّخِذُ أَصْنَامًا ءَالِهَةً ۖ إِنِّىٓ أَرَىٰكَ وَقَوْمَكَ فِى ضَلَـٰلٍ مُّبِينٍ
    arabicPlain: ۞ وإذ قال إبراهيم لأبيه آزر أتتخذ أصناما آلهة ۖ إني أراك وقومك في ضلال مبين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 110
    page: 137
