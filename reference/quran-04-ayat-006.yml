    scripture: quran
    name: Quran 6:10
    chapter: 6
    verse: 10
    ordinal: 799
    text: Messengers (of Allah) have been derided before thee, but that whereat they scoffed surrounded such of them as did deride.
    translation: Pickthall
    original: وَلَقَدِ ٱسْتُهْزِئَ بِرُسُلٍ مِّن قَبْلِكَ فَحَاقَ بِٱلَّذِينَ سَخِرُوا۟ مِنْهُم مَّا كَانُوا۟ بِهِۦ يَسْتَهْزِءُونَ
    arabicPlain: ولقد استهزئ برسل من قبلك فحاق بالذين سخروا منهم ما كانوا به يستهزئون
