  data:
    ref: 6:76
    scripture: quran
    name: Quran 6:76
    chapter: 6
    verse: 76
    ordinal: 865
    text: 'When the night grew dark upon him he beheld a star. He said: This is my Lord. But when it set, he said: I love not things that set.'
    translation: Pickthall
    original: فَلَمَّا جَنَّ عَلَيْهِ ٱلَّيْلُ رَءَا كَوْكَبًا ۖ قَالَ هَـٰذَا رَبِّى ۖ فَلَمَّآ أَفَلَ قَالَ لَآ أُحِبُّ ٱلْـَٔافِلِينَ
    arabicPlain: فلما جن عليه الليل رأى كوكبا ۖ قال هذا ربي ۖ فلما أفل قال لا أحب الآفلين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 110
    page: 137
