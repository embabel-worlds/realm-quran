    chapter: 6
    verse: 115
    ordinal: 904
    text: Perfected is the Word of thy Lord in truth and justice. There is naught that can change His words. He is the Hearer, the Knower.
    translation: Pickthall
    original: وَتَمَّتْ كَلِمَتُ رَبِّكَ صِدْقًا وَعَدْلًا ۚ لَّا مُبَدِّلَ لِكَلِمَـٰتِهِۦ ۚ وَهُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ
    arabicPlain: وتمت كلمت ربك صدقا وعدلا ۚ لا مبدل لكلماته ۚ وهو السميع العليم
    surahName: Al-An'aam
