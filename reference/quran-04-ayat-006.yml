    scripture: quran
    name: Quran 6:69
    chapter: 6
    verse: 69
    ordinal: 858
    text: Those who ward off (evil) are not accountable for them in aught, but the Reminder (must be given them) that haply they (too) may ward off (evil).
    translation: Pickthall
    original: وَمَا عَلَى ٱلَّذِينَ يَتَّقُونَ مِنْ حِسَابِهِم مِّن شَىْءٍ وَلَـٰكِن ذِكْرَىٰ لَعَلَّهُمْ يَتَّقُونَ
    arabicPlain: وما على الذين يتقون من حسابهم من شيء ولكن ذكرى لعلهم يتقون
    surahName: Al-An'aam
    juz: 7
