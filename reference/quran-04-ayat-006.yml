  data:
    ref: '6:26'
    scripture: quran
    name: Quran 6:26
    chapter: 6
    verse: 26
    ordinal: 815
    text: And they forbid (men) from it and avoid it, and they ruin none save themselves, though they perceive not.
    translation: Pickthall
    original: وَهُمْ يَنْهَوْنَ عَنْهُ وَيَنْـَٔوْنَ عَنْهُ ۖ وَإِن يُهْلِكُونَ إِلَّآ أَنفُسَهُمْ وَمَا يَشْعُرُونَ
    arabicPlain: وهم ينهون عنه وينأون عنه ۖ وإن يهلكون إلا أنفسهم وما يشعرون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 104
