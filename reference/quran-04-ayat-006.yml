  data:
    ref: 6:146
    scripture: quran
    name: Quran 6:146
    chapter: 6
    verse: 146
    ordinal: 935
    text: Unto those who are Jews We forbade every animal with claws. And of the oxen and the sheep forbade We unto them the fat thereof save that upon the backs or the entrails, or that which is mixed with the bone. That we awarded them for their rebellion. And lo! we verily are truthful.
    translation: Pickthall
    original: وَعَلَى ٱلَّذِينَ هَادُوا۟ حَرَّمْنَا كُلَّ ذِى ظُفُرٍ ۖ وَمِنَ ٱلْبَقَرِ وَٱلْغَنَمِ حَرَّمْنَا عَلَيْهِمْ شُحُومَهُمَآ إِلَّا مَا حَمَلَتْ ظُهُورُهُمَآ أَوِ ٱلْحَوَايَآ أَوْ مَا ٱخْتَلَطَ بِعَظْمٍ ۚ ذَٰلِكَ جَزَيْنَـٰهُم بِبَغْيِهِمْ ۖ وَإِنَّا لَصَـٰدِقُونَ
    arabicPlain: وعلى الذين هادوا حرمنا كل ذي ظفر ۖ ومن البقر والغنم حرمنا عليهم شحومهما إلا ما حملت ظهورهما أو الحوايا أو ما اختلط بعظم ۚ ذلك جزيناهم ببغيهم ۖ وإنا لصادقون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 119
    page: 147
