  data:
    ref: 6:127
    scripture: quran
    name: Quran 6:127
    chapter: 6
    verse: 127
    ordinal: 916
    text: For them is the abode of peace with their Lord. He will be their Protecting Friend because of what they used to do.
    translation: Pickthall
    original: ۞ لَهُمْ دَارُ ٱلسَّلَـٰمِ عِندَ رَبِّهِمْ ۖ وَهُوَ وَلِيُّهُم بِمَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: ۞ لهم دار السلام عند ربهم ۖ وهو وليهم بما كانوا يعملون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 116
