  data:
    ref: 6:72
    scripture: quran
    name: Quran 6:72
    chapter: 6
    verse: 72
    ordinal: 861
    text: And to establish worship and be dutiful to Him, and He it is unto Whom ye will be gathered.
    translation: Pickthall
    original: وَأَنْ أَقِيمُوا۟ ٱلصَّلَوٰةَ وَٱتَّقُوهُ ۚ وَهُوَ ٱلَّذِىٓ إِلَيْهِ تُحْشَرُونَ
    arabicPlain: وأن أقيموا الصلاة واتقوه ۚ وهو الذي إليه تحشرون
    surahName: Al-An'aam
    juz: 7
