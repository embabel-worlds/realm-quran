  data:
    ref: 6:97
    scripture: quran
    name: Quran 6:97
    chapter: 6
    verse: 97
    ordinal: 886
    text: And He it is Who hath set for you the stars that ye may guide your course by them amid the darkness of the land and the sea. We have detailed Our revelations for a people who have knowledge.
    translation: Pickthall
    original: وَهُوَ ٱلَّذِى جَعَلَ لَكُمُ ٱلنُّجُومَ لِتَهْتَدُوا۟ بِهَا فِى ظُلُمَـٰتِ ٱلْبَرِّ وَٱلْبَحْرِ ۗ قَدْ فَصَّلْنَا ٱلْـَٔايَـٰتِ لِقَوْمٍ يَعْلَمُونَ
    arabicPlain: وهو الذي جعل لكم النجوم لتهتدوا بها في ظلمات البر والبحر ۗ قد فصلنا الآيات لقوم يعلمون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 113
    page: 140
  relations:
  - predicate: IN
    to:
      type: Surah
