  data:
    ref: 6:116
    scripture: quran
    name: Quran 6:116
    chapter: 6
    verse: 116
    ordinal: 905
    text: If thou obeyedst most of those on earth they would mislead thee far from Allah's way. They follow naught but an opinion, and they do but guess.
    translation: Pickthall
    original: وَإِن تُطِعْ أَكْثَرَ مَن فِى ٱلْأَرْضِ يُضِلُّوكَ عَن سَبِيلِ ٱللَّهِ ۚ إِن يَتَّبِعُونَ إِلَّا ٱلظَّنَّ وَإِنْ هُمْ إِلَّا يَخْرُصُونَ
    arabicPlain: وإن تطع أكثر من في الأرض يضلوك عن سبيل الله ۚ إن يتبعون إلا الظن وإن هم إلا يخرصون
