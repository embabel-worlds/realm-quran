  data:
    ref: 6:101
    scripture: quran
    name: Quran 6:101
    chapter: 6
    verse: 101
    ordinal: 890
    text: The Originator of the heavens and the earth! How can He have a child, when there is for Him no consort, when He created all things and is Aware of all things?
    translation: Pickthall
    original: بَدِيعُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۖ أَنَّىٰ يَكُونُ لَهُۥ وَلَدٌ وَلَمْ تَكُن لَّهُۥ صَـٰحِبَةٌ ۖ وَخَلَقَ كُلَّ شَىْءٍ ۖ وَهُوَ بِكُلِّ شَىْءٍ عَلِيمٌ
    arabicPlain: بديع السماوات والأرض ۖ أنى يكون له ولد ولم تكن له صاحبة ۖ وخلق كل شيء ۖ وهو بكل شيء عليم
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 114
