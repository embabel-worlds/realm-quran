  data:
    ref: '6:46'
    scripture: quran
    name: Quran 6:46
    chapter: 6
    verse: 46
    ordinal: 835
    text: 'Say: Have ye imagined, if Allah should take away your hearing and your sight and seal your hearts, Who is the Allah Who could restore it to you save Allah? See how We display the revelations unto them! Yet still they turn away.'
    translation: Pickthall
    original: قُلْ أَرَءَيْتُمْ إِنْ أَخَذَ ٱللَّهُ سَمْعَكُمْ وَأَبْصَـٰرَكُمْ وَخَتَمَ عَلَىٰ قُلُوبِكُم مَّنْ إِلَـٰهٌ غَيْرُ ٱللَّهِ يَأْتِيكُم بِهِ ۗ ٱنظُرْ كَيْفَ نُصَرِّفُ ٱلْـَٔايَـٰتِ ثُمَّ هُمْ يَصْدِفُونَ
    arabicPlain: قل أرأيتم إن أخذ الله سمعكم وأبصاركم وختم على قلوبكم من إله غير الله يأتيكم به ۗ انظر كيف نصرف الآيات ثم هم يصدفون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 106
    page: 133
