  data:
    ref: 6:98
    scripture: quran
    name: Quran 6:98
    chapter: 6
    verse: 98
    ordinal: 887
    text: And He it is Who hath produced you from a single being, and (hath given you) a habitation and a repository. We have detailed Our revelations for a people who have understanding.
    translation: Pickthall
    original: وَهُوَ ٱلَّذِىٓ أَنشَأَكُم مِّن نَّفْسٍ وَٰحِدَةٍ فَمُسْتَقَرٌّ وَمُسْتَوْدَعٌ ۗ قَدْ فَصَّلْنَا ٱلْـَٔايَـٰتِ لِقَوْمٍ يَفْقَهُونَ
    arabicPlain: وهو الذي أنشأكم من نفس واحدة فمستقر ومستودع ۗ قد فصلنا الآيات لقوم يفقهون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 113
