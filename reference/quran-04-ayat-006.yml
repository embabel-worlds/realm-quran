  data:
    ref: '6:54'
    scripture: quran
    name: Quran 6:54
    chapter: 6
    verse: 54
    ordinal: 843
    text: 'And when those who believe in Our revelations come unto thee, say: Peace be unto you! Your Lord hath prescribed for Himself mercy, that whoso of you doeth evil through ignorance and repenteth afterward thereof and doeth right, (for him) lo! He is Forgiving, Merciful.'
    translation: Pickthall
    original: وَإِذَا جَآءَكَ ٱلَّذِينَ يُؤْمِنُونَ بِـَٔايَـٰتِنَا فَقُلْ سَلَـٰمٌ عَلَيْكُمْ ۖ كَتَبَ رَبُّكُمْ عَلَىٰ نَفْسِهِ ٱلرَّحْمَةَ ۖ أَنَّهُۥ مَنْ عَمِلَ مِنكُمْ سُوٓءًۢا بِجَهَـٰلَةٍ ثُمَّ تَابَ مِنۢ بَعْدِهِۦ وَأَصْلَحَ فَأَنَّهُۥ غَفُورٌ رَّحِيمٌ
    arabicPlain: وإذا جاءك الذين يؤمنون بآياتنا فقل سلام عليكم ۖ كتب ربكم على نفسه الرحمة ۖ أنه من عمل منكم سوءا بجهالة ثم تاب من بعده وأصلح فأنه غفور رحيم
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 107
