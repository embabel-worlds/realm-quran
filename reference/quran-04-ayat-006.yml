  data:
    ref: 6:68
    scripture: quran
    name: Quran 6:68
    chapter: 6
    verse: 68
    ordinal: 857
    text: And when thou seest those who meddle with Our revelations, withdraw from them until they meddle with another topic. And if the devil cause thee to forget, sit not, after the remembrance, with the congregation of wrong-doers.
    translation: Pickthall
    original: وَإِذَا رَأَيْتَ ٱلَّذِينَ يَخُوضُونَ فِىٓ ءَايَـٰتِنَا فَأَعْرِضْ عَنْهُمْ حَتَّىٰ يَخُوضُوا۟ فِى حَدِيثٍ غَيْرِهِۦ ۚ وَإِمَّا يُنسِيَنَّكَ ٱلشَّيْطَـٰنُ فَلَا تَقْعُدْ بَعْدَ ٱلذِّكْرَىٰ مَعَ ٱلْقَوْمِ ٱلظَّـٰلِمِينَ
    arabicPlain: وإذا رأيت الذين يخوضون في آياتنا فأعرض عنهم حتى يخوضوا في حديث غيره ۚ وإما ينسينك الشيطان فلا تقعد بعد الذكرى مع القوم الظالمين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 109
    page: 135
  relations:
