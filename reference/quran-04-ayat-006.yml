  data:
    ref: '6:20'
    scripture: quran
    name: Quran 6:20
    chapter: 6
    verse: 20
    ordinal: 809
    text: Those unto whom We gave the Scripture recognise (this revelation) as they recognise their sons. Those who ruin their own souls will not believe.
    translation: Pickthall
    original: ٱلَّذِينَ ءَاتَيْنَـٰهُمُ ٱلْكِتَـٰبَ يَعْرِفُونَهُۥ كَمَا يَعْرِفُونَ أَبْنَآءَهُمُ ۘ ٱلَّذِينَ خَسِرُوٓا۟ أَنفُسَهُمْ فَهُمْ لَا يُؤْمِنُونَ
    arabicPlain: الذين آتيناهم الكتاب يعرفونه كما يعرفون أبناءهم ۘ الذين خسروا أنفسهم فهم لا يؤمنون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 103
