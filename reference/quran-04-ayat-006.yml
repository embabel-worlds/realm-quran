  data:
    ref: 6:91
    scripture: quran
    name: Quran 6:91
    chapter: 6
    verse: 91
    ordinal: 880
    text: 'And they measure not the power of Allah its true measure when they say: Allah hath naught revealed unto a human being. Say (unto the Jews who speak thus): Who revealed the Book which Moses brought, a light and guidance for mankind, which ye have put on parchments which ye show, but ye hide much (thereof), and (by which) ye were taught that which ye knew not yourselves nor (did) your fathers (know it)? Say: Allah. Then leave them to their play of cavilling.'
    translation: Pickthall
    original: وَمَا قَدَرُوا۟ ٱللَّهَ حَقَّ قَدْرِهِۦٓ إِذْ قَالُوا۟ مَآ أَنزَلَ ٱللَّهُ عَلَىٰ بَشَرٍ مِّن شَىْءٍ ۗ قُلْ مَنْ أَنزَلَ ٱلْكِتَـٰبَ ٱلَّذِى جَآءَ بِهِۦ مُوسَىٰ نُورًا وَهُدًى لِّلنَّاسِ ۖ تَجْعَلُونَهُۥ قَرَاطِيسَ تُبْدُونَهَا وَتُخْفُونَ كَثِيرًا ۖ وَعُلِّمْتُم مَّا لَمْ تَعْلَمُوٓا۟ أَنتُمْ وَلَآ ءَابَآؤُكُمْ ۖ قُلِ ٱللَّهُ ۖ ثُمَّ ذَرْهُمْ فِى خَوْضِهِمْ يَلْعَبُونَ
    arabicPlain: وما قدروا الله حق قدره إذ قالوا ما أنزل الله على بشر من شيء ۗ قل من أنزل الكتاب الذي جاء به موسى نورا وهدى للناس ۖ تجعلونه قراطيس تبدونها وتخفون كثيرا ۖ وعلمتم ما لم تعلموا أنتم ولا آباؤكم ۖ قل الله ۖ ثم ذرهم في خوضهم يلعبون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 112
    page: 139
