  data:
    ref: 6:160
    scripture: quran
    name: Quran 6:160
    chapter: 6
    verse: 160
    ordinal: 949
    text: Whoso bringeth a good deed will receive tenfold the like thereof, while whoso bringeth an ill-deed will be awarded but the like thereof; and they will not be wronged.
    translation: Pickthall
    original: مَن جَآءَ بِٱلْحَسَنَةِ فَلَهُۥ عَشْرُ أَمْثَالِهَا ۖ وَمَن جَآءَ بِٱلسَّيِّئَةِ فَلَا يُجْزَىٰٓ إِلَّا مِثْلَهَا وَهُمْ لَا يُظْلَمُونَ
    arabicPlain: من جاء بالحسنة فله عشر أمثالها ۖ ومن جاء بالسيئة فلا يجزى إلا مثلها وهم لا يظلمون
    surahName: Al-An'aam
    juz: 8
