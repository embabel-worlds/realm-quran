  data:
    ref: 6:107
    scripture: quran
    name: Quran 6:107
    chapter: 6
    verse: 107
    ordinal: 896
    text: Had Allah willed, they had not been idolatrous. We have not set thee as a keeper over them, nor art thou responsible for them.
    translation: Pickthall
    original: وَلَوْ شَآءَ ٱللَّهُ مَآ أَشْرَكُوا۟ ۗ وَمَا جَعَلْنَـٰكَ عَلَيْهِمْ حَفِيظًا ۖ وَمَآ أَنتَ عَلَيْهِم بِوَكِيلٍ
    arabicPlain: ولو شاء الله ما أشركوا ۗ وما جعلناك عليهم حفيظا ۖ وما أنت عليهم بوكيل
    surahName: Al-An'aam
    juz: 7
