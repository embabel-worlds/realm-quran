  data:
    ref: 6:103
    scripture: quran
    name: Quran 6:103
    chapter: 6
    verse: 103
    ordinal: 892
    text: Vision comprehendeth Him not, but He comprehendeth (all) vision. He is the Subtile, the Aware.
    translation: Pickthall
    original: لَّا تُدْرِكُهُ ٱلْأَبْصَـٰرُ وَهُوَ يُدْرِكُ ٱلْأَبْصَـٰرَ ۖ وَهُوَ ٱللَّطِيفُ ٱلْخَبِيرُ
    arabicPlain: لا تدركه الأبصار وهو يدرك الأبصار ۖ وهو اللطيف الخبير
