  data:
    ref: '6:33'
    scripture: quran
    name: Quran 6:33
    chapter: 6
    verse: 33
    ordinal: 822
    text: We know well how their talk grieveth thee, though in truth they deny not thee (Muhammad) but evil-doers flout the revelations of Allah.
    translation: Pickthall
    original: قَدْ نَعْلَمُ إِنَّهُۥ لَيَحْزُنُكَ ٱلَّذِى يَقُولُونَ ۖ فَإِنَّهُمْ لَا يُكَذِّبُونَكَ وَلَـٰكِنَّ ٱلظَّـٰلِمِينَ بِـَٔايَـٰتِ ٱللَّهِ يَجْحَدُونَ
    arabicPlain: قد نعلم إنه ليحزنك الذي يقولون ۖ فإنهم لا يكذبونك ولكن الظالمين بآيات الله يجحدون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 105
    page: 131
  relations:
