  data:
    ref: 6:95
    scripture: quran
    name: Quran 6:95
    chapter: 6
    verse: 95
    ordinal: 884
    text: Lo! Allah (it is) Who splitteth the grain of corn and the date-stone (for sprouting). He bringeth forth the living from the dead, and is the bringer-forth of the dead from the living. Such is Allah. How then are ye perverted?
    translation: Pickthall
    original: ۞ إِنَّ ٱللَّهَ فَالِقُ ٱلْحَبِّ وَٱلنَّوَىٰ ۖ يُخْرِجُ ٱلْحَىَّ مِنَ ٱلْمَيِّتِ وَمُخْرِجُ ٱلْمَيِّتِ مِنَ ٱلْحَىِّ ۚ ذَٰلِكُمُ ٱللَّهُ ۖ فَأَنَّىٰ تُؤْفَكُونَ
    arabicPlain: ۞ إن الله فالق الحب والنوى ۖ يخرج الحي من الميت ومخرج الميت من الحي ۚ ذلكم الله ۖ فأنى تؤفكون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 113
    page: 140
