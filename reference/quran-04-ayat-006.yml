  data:
    ref: '6:48'
    scripture: quran
    name: Quran 6:48
    chapter: 6
    verse: 48
    ordinal: 837
    text: We send not the messengers save as bearers of good news and warners. Whoso believeth and doeth right, there shall no fear come upon them neither shall they grieve.
    translation: Pickthall
    original: وَمَا نُرْسِلُ ٱلْمُرْسَلِينَ إِلَّا مُبَشِّرِينَ وَمُنذِرِينَ ۖ فَمَنْ ءَامَنَ وَأَصْلَحَ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
    arabicPlain: وما نرسل المرسلين إلا مبشرين ومنذرين ۖ فمن آمن وأصلح فلا خوف عليهم ولا هم يحزنون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 106
