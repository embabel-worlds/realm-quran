    scripture: quran
    name: Quran 6:2
    chapter: 6
    verse: 2
    ordinal: 791
    text: He it is Who hath created you from clay, and hath decreed a term for you. A term is fixed with Him. Yet still ye doubt!
    translation: Pickthall
    original: هُوَ ٱلَّذِى خَلَقَكُم مِّن طِينٍ ثُمَّ قَضَىٰٓ أَجَلًا ۖ وَأَجَلٌ مُّسَمًّى عِندَهُۥ ۖ ثُمَّ أَنتُمْ تَمْتَرُونَ
    arabicPlain: هو الذي خلقكم من طين ثم قضى أجلا ۖ وأجل مسمى عنده ۖ ثم أنتم تمترون
