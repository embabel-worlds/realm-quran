  data:
    ref: '6:29'
    scripture: quran
    name: Quran 6:29
    chapter: 6
    verse: 29
    ordinal: 818
    text: 'And they say: There is naught save our life of the world, and we shall not be raised (again).'
    translation: Pickthall
    original: وَقَالُوٓا۟ إِنْ هِىَ إِلَّا حَيَاتُنَا ٱلدُّنْيَا وَمَا نَحْنُ بِمَبْعُوثِينَ
    arabicPlain: وقالوا إن هي إلا حياتنا الدنيا وما نحن بمبعوثين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 104
    page: 131
