  data:
    ref: 6:117
    scripture: quran
    name: Quran 6:117
    chapter: 6
    verse: 117
    ordinal: 906
    text: Lo! thy Lord, He knoweth best who erreth from His way; and He knoweth best (who are) the rightly guided.
    translation: Pickthall
    original: إِنَّ رَبَّكَ هُوَ أَعْلَمُ مَن يَضِلُّ عَن سَبِيلِهِۦ ۖ وَهُوَ أَعْلَمُ بِٱلْمُهْتَدِينَ
    arabicPlain: إن ربك هو أعلم من يضل عن سبيله ۖ وهو أعلم بالمهتدين
