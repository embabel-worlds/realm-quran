  data:
    ref: 6:139
    scripture: quran
    name: Quran 6:139
    chapter: 6
    verse: 139
    ordinal: 928
    text: 'And they say: That which is in the bellies of such cattle is reserved for our males and is forbidden to our wives; but if it be born dead, then they (all) may be partakers thereof. He will reward them for their attribution (of such ordinances unto Him). Lo, He is Wise, Aware.'
    translation: Pickthall
    original: وَقَالُوا۟ مَا فِى بُطُونِ هَـٰذِهِ ٱلْأَنْعَـٰمِ خَالِصَةٌ لِّذُكُورِنَا وَمُحَرَّمٌ عَلَىٰٓ أَزْوَٰجِنَا ۖ وَإِن يَكُن مَّيْتَةً فَهُمْ فِيهِ شُرَكَآءُ ۚ سَيَجْزِيهِمْ وَصْفَهُمْ ۚ إِنَّهُۥ حَكِيمٌ عَلِيمٌ
    arabicPlain: وقالوا ما في بطون هذه الأنعام خالصة لذكورنا ومحرم على أزواجنا ۖ وإن يكن ميتة فهم فيه شركاء ۚ سيجزيهم وصفهم ۚ إنه حكيم عليم
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 117
    page: 146
