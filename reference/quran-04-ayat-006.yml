  data:
    ref: 6:121
    scripture: quran
    name: Quran 6:121
    chapter: 6
    verse: 121
    ordinal: 910
    text: And eat not of that whereon Allah's name hath not been mentioned, for lo! it is abomination. Lo! the devils do inspire their minions to dispute with you. But if ye obey them, ye will be in truth idolaters.
    translation: Pickthall
    original: وَلَا تَأْكُلُوا۟ مِمَّا لَمْ يُذْكَرِ ٱسْمُ ٱللَّهِ عَلَيْهِ وَإِنَّهُۥ لَفِسْقٌ ۗ وَإِنَّ ٱلشَّيَـٰطِينَ لَيُوحُونَ إِلَىٰٓ أَوْلِيَآئِهِمْ لِيُجَـٰدِلُوكُمْ ۖ وَإِنْ أَطَعْتُمُوهُمْ إِنَّكُمْ لَمُشْرِكُونَ
    arabicPlain: ولا تأكلوا مما لم يذكر اسم الله عليه وإنه لفسق ۗ وإن الشياطين ليوحون إلى أوليائهم ليجادلوكم ۖ وإن أطعتموهم إنكم لمشركون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 115
