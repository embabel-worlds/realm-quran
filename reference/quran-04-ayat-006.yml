  data:
    ref: 6:143
    scripture: quran
    name: Quran 6:143
    chapter: 6
    verse: 143
    ordinal: 932
    text: 'Eight pairs: Of the sheep twain, and of the goats twain. Say: Hath He forbidden the two males or the two females, or that which the wombs of the two females contain? Expound to me (the case) with knowledge, if ye are truthful.'
    translation: Pickthall
    original: ثَمَـٰنِيَةَ أَزْوَٰجٍ ۖ مِّنَ ٱلضَّأْنِ ٱثْنَيْنِ وَمِنَ ٱلْمَعْزِ ٱثْنَيْنِ ۗ قُلْ ءَآلذَّكَرَيْنِ حَرَّمَ أَمِ ٱلْأُنثَيَيْنِ أَمَّا ٱشْتَمَلَتْ عَلَيْهِ أَرْحَامُ ٱلْأُنثَيَيْنِ ۖ نَبِّـُٔونِى بِعِلْمٍ إِن كُنتُمْ صَـٰدِقِينَ
    arabicPlain: ثمانية أزواج ۖ من الضأن اثنين ومن المعز اثنين ۗ قل آلذكرين حرم أم الأنثيين أما اشتملت عليه أرحام الأنثيين ۖ نبئوني بعلم إن كنتم صادقين
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 118
    page: 147
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '6'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-8
- type: Ayah
  data:
    ref: 6:144
    scripture: quran
    name: Quran 6:144
    chapter: 6
    verse: 144
    ordinal: 933
    text: 'And of the camels twain and of the oxen twain. Say: Hath He forbidden the two males or the two females, or that which the wombs of the two females contain; or were ye by to witness when Allah commanded you (all) this? Then who doth greater wrong than he who deviseth a lie concerning Allah, that he may lead mankind astray without knowledge. Lo! Allah guideth not wrongdoing folk.'
    translation: Pickthall
    original: وَمِنَ ٱلْإِبِلِ ٱثْنَيْنِ وَمِنَ ٱلْبَقَرِ ٱثْنَيْنِ ۗ قُلْ ءَآلذَّكَرَيْنِ حَرَّمَ أَمِ ٱلْأُنثَيَيْنِ أَمَّا ٱشْتَمَلَتْ عَلَيْهِ أَرْحَامُ ٱلْأُنثَيَيْنِ ۖ أَمْ كُنتُمْ شُهَدَآءَ إِذْ وَصَّىٰكُمُ ٱللَّهُ بِهَـٰذَا ۚ فَمَنْ أَظْلَمُ مِمَّنِ ٱفْتَرَىٰ عَلَى ٱللَّهِ كَذِبًا لِّيُضِلَّ ٱلنَّاسَ بِغَيْرِ عِلْمٍ ۗ إِنَّ ٱللَّهَ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّـٰلِمِينَ
    arabicPlain: ومن الإبل اثنين ومن البقر اثنين ۗ قل آلذكرين حرم أم الأنثيين أما اشتملت عليه أرحام الأنثيين ۖ أم كنتم شهداء إذ وصاكم الله بهذا ۚ فمن أظلم ممن افترى على الله كذبا ليضل الناس بغير علم ۗ إن الله لا يهدي القوم الظالمين
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 118
    page: 147
  relations:
  - predicate: IN
    to:
      type: Surah
