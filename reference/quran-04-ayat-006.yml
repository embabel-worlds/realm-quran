  data:
    ref: 6:106
    scripture: quran
    name: Quran 6:106
    chapter: 6
    verse: 106
    ordinal: 895
    text: Follow that which is inspired in thee from thy Lord; there is no Allah save Him; and turn away from the idolaters.
    translation: Pickthall
    original: ٱتَّبِعْ مَآ أُوحِىَ إِلَيْكَ مِن رَّبِّكَ ۖ لَآ إِلَـٰهَ إِلَّا هُوَ ۖ وَأَعْرِضْ عَنِ ٱلْمُشْرِكِينَ
    arabicPlain: اتبع ما أوحي إليك من ربك ۖ لا إله إلا هو ۖ وأعرض عن المشركين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
