  data:
    ref: 6:122
    scripture: quran
    name: Quran 6:122
    chapter: 6
    verse: 122
    ordinal: 911
    text: Is he who was dead and We have raised him unto life, and set for him a light wherein he walketh among men, as him whose similitude is in utter darkness whence he cannot emerge? Thus is their conduct made fairseeming for the disbelievers.
    translation: Pickthall
    original: أَوَمَن كَانَ مَيْتًا فَأَحْيَيْنَـٰهُ وَجَعَلْنَا لَهُۥ نُورًا يَمْشِى بِهِۦ فِى ٱلنَّاسِ كَمَن مَّثَلُهُۥ فِى ٱلظُّلُمَـٰتِ لَيْسَ بِخَارِجٍ مِّنْهَا ۚ كَذَٰلِكَ زُيِّنَ لِلْكَـٰفِرِينَ مَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: أومن كان ميتا فأحييناه وجعلنا له نورا يمشي به في الناس كمن مثله في الظلمات ليس بخارج منها ۚ كذلك زين للكافرين ما كانوا يعملون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 116
    page: 143
