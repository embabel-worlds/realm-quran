  data:
    ref: 6:87
    scripture: quran
    name: Quran 6:87
    chapter: 6
    verse: 87
    ordinal: 876
    text: With some of their forefathers and their offspring and their brethren; and We chose them and guided them unto a straight path.
    translation: Pickthall
    original: وَمِنْ ءَابَآئِهِمْ وَذُرِّيَّـٰتِهِمْ وَإِخْوَٰنِهِمْ ۖ وَٱجْتَبَيْنَـٰهُمْ وَهَدَيْنَـٰهُمْ إِلَىٰ صِرَٰطٍ مُّسْتَقِيمٍ
