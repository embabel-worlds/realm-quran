  data:
    ref: 6:135
    scripture: quran
    name: Quran 6:135
    chapter: 6
    verse: 135
    ordinal: 924
    text: 'Say (O Muhammad): O my people! Work according to your power. Lo! I too am working. Thus ye will come to know for which of us will be the happy sequel. Lo! the wrong-doers will not be successful.'
    translation: Pickthall
    original: قُلْ يَـٰقَوْمِ ٱعْمَلُوا۟ عَلَىٰ مَكَانَتِكُمْ إِنِّى عَامِلٌ ۖ فَسَوْفَ تَعْلَمُونَ مَن تَكُونُ لَهُۥ عَـٰقِبَةُ ٱلدَّارِ ۗ إِنَّهُۥ لَا يُفْلِحُ ٱلظَّـٰلِمُونَ
    arabicPlain: قل يا قوم اعملوا على مكانتكم إني عامل ۖ فسوف تعلمون من تكون له عاقبة الدار ۗ إنه لا يفلح الظالمون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 117
    page: 145
