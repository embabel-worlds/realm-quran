  data:
    ref: 6:82
    scripture: quran
    name: Quran 6:82
    chapter: 6
    verse: 82
    ordinal: 871
    text: Those who believe and obscure not their belief by wrongdoing, theirs is safety; and they are rightly guided.
    translation: Pickthall
    original: ٱلَّذِينَ ءَامَنُوا۟ وَلَمْ يَلْبِسُوٓا۟ إِيمَـٰنَهُم بِظُلْمٍ أُو۟لَـٰٓئِكَ لَهُمُ ٱلْأَمْنُ وَهُم مُّهْتَدُونَ
    arabicPlain: الذين آمنوا ولم يلبسوا إيمانهم بظلم أولئك لهم الأمن وهم مهتدون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 110
    page: 138
