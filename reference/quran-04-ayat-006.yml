  data:
    ref: '6:53'
    scripture: quran
    name: Quran 6:53
    chapter: 6
    verse: 53
    ordinal: 842
    text: 'And even so do We try some of them by others, that they say: Are these they whom Allah favoureth among us? Is not Allah best Aware of the thanksgivers?'
    translation: Pickthall
    original: وَكَذَٰلِكَ فَتَنَّا بَعْضَهُم بِبَعْضٍ لِّيَقُولُوٓا۟ أَهَـٰٓؤُلَآءِ مَنَّ ٱللَّهُ عَلَيْهِم مِّنۢ بَيْنِنَآ ۗ أَلَيْسَ ٱللَّهُ بِأَعْلَمَ بِٱلشَّـٰكِرِينَ
    arabicPlain: وكذلك فتنا بعضهم ببعض ليقولوا أهؤلاء من الله عليهم من بيننا ۗ أليس الله بأعلم بالشاكرين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 107
