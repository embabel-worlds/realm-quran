- type: Ayah
  data:
    ref: '6:5'
    scripture: quran
    name: Quran 6:5
    chapter: 6
    verse: 5
    ordinal: 794
    text: And they denied the truth when it came unto them. But there will come unto them the tidings of that which they used to deride.
    translation: Pickthall
    original: فَقَدْ كَذَّبُوا۟ بِٱلْحَقِّ لَمَّا جَآءَهُمْ ۖ فَسَوْفَ يَأْتِيهِمْ أَنۢبَـٰٓؤُا۟ مَا كَانُوا۟ بِهِۦ يَسْتَهْزِءُونَ
    arabicPlain: فقد كذبوا بالحق لما جاءهم ۖ فسوف يأتيهم أنباء ما كانوا به يستهزئون
    surahName: Al-An'aam
    juz: 7
