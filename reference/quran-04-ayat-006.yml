- type: Ayah
  data:
    ref: 6:114
    scripture: quran
    name: Quran 6:114
    chapter: 6
    verse: 114
    ordinal: 903
    text: Shall I seek other than Allah for judge, when He it is Who hath revealed unto you (this) Scripture, fully explained? Those unto whom We gave the Scripture (aforetime) know that it is revealed from thy Lord in truth. So be not thou (O Muhammad) of the waverers.
    translation: Pickthall
    original: أَفَغَيْرَ ٱللَّهِ أَبْتَغِى حَكَمًا وَهُوَ ٱلَّذِىٓ أَنزَلَ إِلَيْكُمُ ٱلْكِتَـٰبَ مُفَصَّلًا ۚ وَٱلَّذِينَ ءَاتَيْنَـٰهُمُ ٱلْكِتَـٰبَ يَعْلَمُونَ أَنَّهُۥ مُنَزَّلٌ مِّن رَّبِّكَ بِٱلْحَقِّ ۖ فَلَا تَكُونَنَّ مِنَ ٱلْمُمْتَرِينَ
    arabicPlain: أفغير الله أبتغي حكما وهو الذي أنزل إليكم الكتاب مفصلا ۚ والذين آتيناهم الكتاب يعلمون أنه منزل من ربك بالحق ۖ فلا تكونن من الممترين
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 115
    page: 142
