  data:
    ref: '6:58'
    scripture: quran
    name: Quran 6:58
    chapter: 6
    verse: 58
    ordinal: 847
    text: 'Say: If I had that for which ye are impatient, then would the case (ere this) have been decided between me and you. Allah is Best Aware of the wrong-doers.'
    translation: Pickthall
    original: قُل لَّوْ أَنَّ عِندِى مَا تَسْتَعْجِلُونَ بِهِۦ لَقُضِىَ ٱلْأَمْرُ بَيْنِى وَبَيْنَكُمْ ۗ وَٱللَّهُ أَعْلَمُ بِٱلظَّـٰلِمِينَ
    arabicPlain: قل لو أن عندي ما تستعجلون به لقضي الأمر بيني وبينكم ۗ والله أعلم بالظالمين
    surahName: Al-An'aam
    juz: 7
