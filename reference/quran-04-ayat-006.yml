  data:
    ref: 6:79
    scripture: quran
    name: Quran 6:79
    chapter: 6
    verse: 79
    ordinal: 868
    text: Lo! I have turned my face toward Him Who created the heavens and the earth, as one by nature upright, and I am not of the idolaters.
    translation: Pickthall
    original: إِنِّى وَجَّهْتُ وَجْهِىَ لِلَّذِى فَطَرَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ حَنِيفًا ۖ وَمَآ أَنَا۠ مِنَ ٱلْمُشْرِكِينَ
    arabicPlain: إني وجهت وجهي للذي فطر السماوات والأرض حنيفا ۖ وما أنا من المشركين
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 110
