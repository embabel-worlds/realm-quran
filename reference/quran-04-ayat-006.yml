  data:
    ref: 6:137
    scripture: quran
    name: Quran 6:137
    chapter: 6
    verse: 137
    ordinal: 926
    text: Thus have their (so-called) partners (of Allah) made the killing of their children to seem fair unto many of the idolaters, that they may ruin them and make their faith obscure for them. Had Allah willed (it otherwise), they had not done so. So leave them alone with their devices.
    translation: Pickthall
    original: وَكَذَٰلِكَ زَيَّنَ لِكَثِيرٍ مِّنَ ٱلْمُشْرِكِينَ قَتْلَ أَوْلَـٰدِهِمْ شُرَكَآؤُهُمْ لِيُرْدُوهُمْ وَلِيَلْبِسُوا۟ عَلَيْهِمْ دِينَهُمْ ۖ وَلَوْ شَآءَ ٱللَّهُ مَا فَعَلُوهُ ۖ فَذَرْهُمْ وَمَا يَفْتَرُونَ
    arabicPlain: وكذلك زين لكثير من المشركين قتل أولادهم شركاؤهم ليردوهم وليلبسوا عليهم دينهم ۖ ولو شاء الله ما فعلوه ۖ فذرهم وما يفترون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 117
    page: 145
