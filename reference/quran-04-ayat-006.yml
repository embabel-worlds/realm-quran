    ordinal: 921
    text: For all there will be ranks from what they did. Thy Lord is not unaware of what they do.
    translation: Pickthall
    original: وَلِكُلٍّ دَرَجَـٰتٌ مِّمَّا عَمِلُوا۟ ۚ وَمَا رَبُّكَ بِغَـٰفِلٍ عَمَّا يَعْمَلُونَ
