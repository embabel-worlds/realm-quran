  data:
    ref: '6:42'
    scripture: quran
    name: Quran 6:42
    chapter: 6
    verse: 42
    ordinal: 831
    text: We have sent already unto peoples that were before thee, and We visited them with tribulation and adversity, in order that they might grow humble.
    translation: Pickthall
    original: وَلَقَدْ أَرْسَلْنَآ إِلَىٰٓ أُمَمٍ مِّن قَبْلِكَ فَأَخَذْنَـٰهُم بِٱلْبَأْسَآءِ وَٱلضَّرَّآءِ لَعَلَّهُمْ يَتَضَرَّعُونَ
    arabicPlain: ولقد أرسلنا إلى أمم من قبلك فأخذناهم بالبأساء والضراء لعلهم يتضرعون
    surahName: Al-An'aam
    juz: 7
