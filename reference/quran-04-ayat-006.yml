  data:
    ref: 6:80
    scripture: quran
    name: Quran 6:80
    chapter: 6
    verse: 80
    ordinal: 869
    text: 'His people argued with him. He said: Dispute ye with me concerning Allah when He hath guided me? I fear not at all that which ye set up beside Him unless my Lord willeth aught. My Lord includeth all things in His knowledge. Will ye not then remember?'
    translation: Pickthall
    original: وَحَآجَّهُۥ قَوْمُهُۥ ۚ قَالَ أَتُحَـٰٓجُّوٓنِّى فِى ٱللَّهِ وَقَدْ هَدَىٰنِ ۚ وَلَآ أَخَافُ مَا تُشْرِكُونَ بِهِۦٓ إِلَّآ أَن يَشَآءَ رَبِّى شَيْـًٔا ۗ وَسِعَ رَبِّى كُلَّ شَىْءٍ عِلْمًا ۗ أَفَلَا تَتَذَكَّرُونَ
    arabicPlain: وحاجه قومه ۚ قال أتحاجوني في الله وقد هدان ۚ ولا أخاف ما تشركون به إلا أن يشاء ربي شيئا ۗ وسع ربي كل شيء علما ۗ أفلا تتذكرون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 110
    page: 137
