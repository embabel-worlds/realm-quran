  data:
    ref: 6:152
    scripture: quran
    name: Quran 6:152
    chapter: 6
    verse: 152
    ordinal: 941
    text: And approach not the wealth of the orphan save with that which is better, till he reach maturity. Give full measure and full weight, in justice. We task not any soul beyond its scope. And if ye give your word, do justice thereunto, even though it be (against) a kinsman; and fulfil the covenant of Allah. This He commandeth you that haply ye may remember.
    translation: Pickthall
    original: وَلَا تَقْرَبُوا۟ مَالَ ٱلْيَتِيمِ إِلَّا بِٱلَّتِى هِىَ أَحْسَنُ حَتَّىٰ يَبْلُغَ أَشُدَّهُۥ ۖ وَأَوْفُوا۟ ٱلْكَيْلَ وَٱلْمِيزَانَ بِٱلْقِسْطِ ۖ لَا نُكَلِّفُ نَفْسًا إِلَّا وُسْعَهَا ۖ وَإِذَا قُلْتُمْ فَٱعْدِلُوا۟ وَلَوْ كَانَ ذَا قُرْبَىٰ ۖ وَبِعَهْدِ ٱللَّهِ أَوْفُوا۟ ۚ ذَٰلِكُمْ وَصَّىٰكُم بِهِۦ لَعَلَّكُمْ تَذَكَّرُونَ
    arabicPlain: ولا تقربوا مال اليتيم إلا بالتي هي أحسن حتى يبلغ أشده ۖ وأوفوا الكيل والميزان بالقسط ۖ لا نكلف نفسا إلا وسعها ۖ وإذا قلتم فاعدلوا ولو كان ذا قربى ۖ وبعهد الله أوفوا ۚ ذلكم وصاكم به لعلكم تذكرون
    surahName: Al-An'aam
    juz: 8
    manzil: 2
    ruku: 120
    page: 149
