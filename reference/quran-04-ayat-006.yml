  data:
    ref: 6:159
    scripture: quran
    name: Quran 6:159
    chapter: 6
    verse: 159
    ordinal: 948
    text: Lo! As for those who sunder their religion and become schismatics, no concern at all hast thou with them. Their case will go to Allah, Who then will tell them what they used to do.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ فَرَّقُوا۟ دِينَهُمْ وَكَانُوا۟ شِيَعًا لَّسْتَ مِنْهُمْ فِى شَىْءٍ ۚ إِنَّمَآ أَمْرُهُمْ إِلَى ٱللَّهِ ثُمَّ يُنَبِّئُهُم بِمَا كَانُوا۟ يَفْعَلُونَ
    arabicPlain: إن الذين فرقوا دينهم وكانوا شيعا لست منهم في شيء ۚ إنما أمرهم إلى الله ثم ينبئهم بما كانوا يفعلون
    surahName: Al-An'aam
