  data:
    ref: '6:36'
    scripture: quran
    name: Quran 6:36
    chapter: 6
    verse: 36
    ordinal: 825
    text: Only those can accept who hear. As for the dead, Allah will raise them up; then unto Him they will be returned.
    translation: Pickthall
    original: ۞ إِنَّمَا يَسْتَجِيبُ ٱلَّذِينَ يَسْمَعُونَ ۘ وَٱلْمَوْتَىٰ يَبْعَثُهُمُ ٱللَّهُ ثُمَّ إِلَيْهِ يُرْجَعُونَ
    arabicPlain: ۞ إنما يستجيب الذين يسمعون ۘ والموتى يبعثهم الله ثم إليه يرجعون
