  data:
    ref: '6:31'
    scripture: quran
    name: Quran 6:31
    chapter: 6
    verse: 31
    ordinal: 820
    text: 'They indeed are losers who deny their meeting with Allah until, when the Hour cometh on them suddenly, they cry: Alas for us, that we neglected it! They bear upon their backs their burdens. Ah, evil is that which they bear!'
    translation: Pickthall
    original: قَدْ خَسِرَ ٱلَّذِينَ كَذَّبُوا۟ بِلِقَآءِ ٱللَّهِ ۖ حَتَّىٰٓ إِذَا جَآءَتْهُمُ ٱلسَّاعَةُ بَغْتَةً قَالُوا۟ يَـٰحَسْرَتَنَا عَلَىٰ مَا فَرَّطْنَا فِيهَا وَهُمْ يَحْمِلُونَ أَوْزَارَهُمْ عَلَىٰ ظُهُورِهِمْ ۚ أَلَا سَآءَ مَا يَزِرُونَ
    arabicPlain: قد خسر الذين كذبوا بلقاء الله ۖ حتى إذا جاءتهم الساعة بغتة قالوا يا حسرتنا على ما فرطنا فيها وهم يحملون أوزارهم على ظهورهم ۚ ألا ساء ما يزرون
    surahName: Al-An'aam
    juz: 7
    manzil: 2
    ruku: 105
    page: 131
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '6'
  - predicate: IN_PORTION
