  data:
    ref: '34:27'
    scripture: quran
    name: Quran 34:27
    chapter: 34
    verse: 27
    ordinal: 3633
    text: 'Say: Show me those whom ye have joined unto Him as partners. Nay (ye dare not)! For He is Allah, the Mighty, the Wise.'
    translation: Pickthall
    original: قُلْ أَرُونِىَ ٱلَّذِينَ أَلْحَقْتُم بِهِۦ شُرَكَآءَ ۖ كَلَّا ۚ بَلْ هُوَ ٱللَّهُ ٱلْعَزِيزُ ٱلْحَكِيمُ
    arabicPlain: قل أروني الذين ألحقتم به شركاء ۖ كلا ۚ بل هو الله العزيز الحكيم
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 372
    page: 431
  relations:
