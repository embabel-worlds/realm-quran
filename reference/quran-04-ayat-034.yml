  data:
    ref: '34:21'
    scripture: quran
    name: Quran 34:21
    chapter: 34
    verse: 21
    ordinal: 3627
    text: And he had no warrant whatsoever against them, save that We would know him who believeth in the Hereafter from him who is in doubt thereof; and thy Lord (O Muhammad) taketh note of all things.
    translation: Pickthall
    original: وَمَا كَانَ لَهُۥ عَلَيْهِم مِّن سُلْطَـٰنٍ إِلَّا لِنَعْلَمَ مَن يُؤْمِنُ بِٱلْـَٔاخِرَةِ مِمَّنْ هُوَ مِنْهَا فِى شَكٍّ ۗ وَرَبُّكَ عَلَىٰ كُلِّ شَىْءٍ حَفِيظٌ
    arabicPlain: وما كان له عليهم من سلطان إلا لنعلم من يؤمن بالآخرة ممن هو منها في شك ۗ وربك على كل شيء حفيظ
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 371
