    name: Quran 34:34
    chapter: 34
    verse: 34
    ordinal: 3640
    text: 'And We sent not unto any township a warner, but its pampered ones declared: Lo! we are disbelievers in that wherewith ye have been sent.'
    translation: Pickthall
    original: وَمَآ أَرْسَلْنَا فِى قَرْيَةٍ مِّن نَّذِيرٍ إِلَّا قَالَ مُتْرَفُوهَآ إِنَّا بِمَآ أُرْسِلْتُم بِهِۦ كَـٰفِرُونَ
    arabicPlain: وما أرسلنا في قرية من نذير إلا قال مترفوها إنا بما أرسلتم به كافرون
    surahName: Saba
    juz: 22
