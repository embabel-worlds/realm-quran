  data:
    ref: '34:24'
    scripture: quran
    name: Quran 34:24
    chapter: 34
    verse: 24
    ordinal: 3630
    text: 'Say: Who giveth you provision from the sky and the earth? Say: Allah, Lo! we or you assuredly are rightly guided or in error manifest.'
    translation: Pickthall
    original: ۞ قُلْ مَن يَرْزُقُكُم مِّنَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۖ قُلِ ٱللَّهُ ۖ وَإِنَّآ أَوْ إِيَّاكُمْ لَعَلَىٰ هُدًى أَوْ فِى ضَلَـٰلٍ مُّبِينٍ
    arabicPlain: ۞ قل من يرزقكم من السماوات والأرض ۖ قل الله ۖ وإنا أو إياكم لعلى هدى أو في ضلال مبين
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 372
    page: 431
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '34'
  - predicate: IN_PORTION
