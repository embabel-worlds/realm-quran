- type: Ayah
  data:
    ref: '34:2'
    scripture: quran
    name: Quran 34:2
    chapter: 34
    verse: 2
    ordinal: 3608
    text: He knoweth that which goeth into the earth and that which cometh forth from it, and that descendeth from the heaven and that which ascendeth into it. He is the Merciful, the Forgiving.
    translation: Pickthall
    original: يَعْلَمُ مَا يَلِجُ فِى ٱلْأَرْضِ وَمَا يَخْرُجُ مِنْهَا وَمَا يَنزِلُ مِنَ ٱلسَّمَآءِ وَمَا يَعْرُجُ فِيهَا ۚ وَهُوَ ٱلرَّحِيمُ ٱلْغَفُورُ
    arabicPlain: يعلم ما يلج في الأرض وما يخرج منها وما ينزل من السماء وما يعرج فيها ۚ وهو الرحيم الغفور
    surahName: Saba
    juz: 22
