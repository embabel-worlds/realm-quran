  data:
    ref: '34:25'
    scripture: quran
    name: Quran 34:25
    chapter: 34
    verse: 25
    ordinal: 3631
    text: 'Say: Ye will not be asked of what we committed, nor shall we be asked of what ye do.'
    translation: Pickthall
    original: قُل لَّا تُسْـَٔلُونَ عَمَّآ أَجْرَمْنَا وَلَا نُسْـَٔلُ عَمَّا تَعْمَلُونَ
    arabicPlain: قل لا تسألون عما أجرمنا ولا نسأل عما تعملون
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 372
    page: 431
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '34'
  - predicate: IN_PORTION
