  data:
    ref: '34:39'
    scripture: quran
    name: Quran 34:39
    chapter: 34
    verse: 39
    ordinal: 3645
    text: 'Say: Lo! my Lord enlargeth the provision for whom He will of His bondmen, and narroweth (it) for him. And whatsoever ye spend (for good) He replaceth it. And He is the Best of Providers.'
    translation: Pickthall
    original: قُلْ إِنَّ رَبِّى يَبْسُطُ ٱلرِّزْقَ لِمَن يَشَآءُ مِنْ عِبَادِهِۦ وَيَقْدِرُ لَهُۥ ۚ وَمَآ أَنفَقْتُم مِّن شَىْءٍ فَهُوَ يُخْلِفُهُۥ ۖ وَهُوَ خَيْرُ ٱلرَّٰزِقِينَ
    arabicPlain: قل إن ربي يبسط الرزق لمن يشاء من عباده ويقدر له ۚ وما أنفقتم من شيء فهو يخلفه ۖ وهو خير الرازقين
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 374
