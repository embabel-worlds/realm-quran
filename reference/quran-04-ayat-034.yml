- type: Ayah
  data:
    ref: '34:15'
    scripture: quran
    name: Quran 34:15
    chapter: 34
    verse: 15
    ordinal: 3621
    text: 'There was indeed a sign for Sheba in their dwelling-place: Two gardens on the right hand and the left (as who should say): Eat of the provision of your Lord and render thanks to Him. A fair land and an indulgent Lord!'
    translation: Pickthall
    original: لَقَدْ كَانَ لِسَبَإٍ فِى مَسْكَنِهِمْ ءَايَةٌ ۖ جَنَّتَانِ عَن يَمِينٍ وَشِمَالٍ ۖ كُلُوا۟ مِن رِّزْقِ رَبِّكُمْ وَٱشْكُرُوا۟ لَهُۥ ۚ بَلْدَةٌ طَيِّبَةٌ وَرَبٌّ غَفُورٌ
    arabicPlain: لقد كان لسبإ في مسكنهم آية ۖ جنتان عن يمين وشمال ۖ كلوا من رزق ربكم واشكروا له ۚ بلدة طيبة ورب غفور
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 371
