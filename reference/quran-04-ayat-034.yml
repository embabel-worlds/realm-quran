  data:
    ref: '34:49'
    scripture: quran
    name: Quran 34:49
    chapter: 34
    verse: 49
    ordinal: 3655
    text: 'Say: The Truth hath come, and falsehood showeth not its face and will not return.'
    translation: Pickthall
    original: قُلْ جَآءَ ٱلْحَقُّ وَمَا يُبْدِئُ ٱلْبَـٰطِلُ وَمَا يُعِيدُ
    arabicPlain: قل جاء الحق وما يبدئ الباطل وما يعيد
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 375
    page: 434
  relations:
