  data:
    ref: '34:44'
    scripture: quran
    name: Quran 34:44
    chapter: 34
    verse: 44
    ordinal: 3650
    text: And We have given them no scriptures which they study, nor sent We unto them, before thee, any warner.
    translation: Pickthall
    original: وَمَآ ءَاتَيْنَـٰهُم مِّن كُتُبٍ يَدْرُسُونَهَا ۖ وَمَآ أَرْسَلْنَآ إِلَيْهِمْ قَبْلَكَ مِن نَّذِيرٍ
    arabicPlain: وما آتيناهم من كتب يدرسونها ۖ وما أرسلنا إليهم قبلك من نذير
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 374
