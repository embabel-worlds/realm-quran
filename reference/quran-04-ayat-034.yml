- type: Ayah
  data:
    ref: '34:14'
    scripture: quran
    name: Quran 34:14
    chapter: 34
    verse: 14
    ordinal: 3620
    text: And when We decreed death for him, nothing showed his death to them save a creeping creature of the earth which gnawed away his staff. And when he fell the jinn saw clearly how, if they had known the Unseen, they would not have continued in despised toil.
    translation: Pickthall
    original: فَلَمَّا قَضَيْنَا عَلَيْهِ ٱلْمَوْتَ مَا دَلَّهُمْ عَلَىٰ مَوْتِهِۦٓ إِلَّا دَآبَّةُ ٱلْأَرْضِ تَأْكُلُ مِنسَأَتَهُۥ ۖ فَلَمَّا خَرَّ تَبَيَّنَتِ ٱلْجِنُّ أَن لَّوْ كَانُوا۟ يَعْلَمُونَ ٱلْغَيْبَ مَا لَبِثُوا۟ فِى ٱلْعَذَابِ ٱلْمُهِينِ
    arabicPlain: فلما قضينا عليه الموت ما دلهم على موته إلا دابة الأرض تأكل منسأته ۖ فلما خر تبينت الجن أن لو كانوا يعلمون الغيب ما لبثوا في العذاب المهين
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 371
    page: 429
  relations:
  - predicate: IN
    to:
      type: Surah
