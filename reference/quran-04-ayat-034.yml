  data:
    ref: '34:40'
    scripture: quran
    name: Quran 34:40
    chapter: 34
    verse: 40
    ordinal: 3646
    text: 'And on the day when He will gather them all together, He will say unto the angels: Did these worship you?'
    translation: Pickthall
    original: وَيَوْمَ يَحْشُرُهُمْ جَمِيعًا ثُمَّ يَقُولُ لِلْمَلَـٰٓئِكَةِ أَهَـٰٓؤُلَآءِ إِيَّاكُمْ كَانُوا۟ يَعْبُدُونَ
    arabicPlain: ويوم يحشرهم جميعا ثم يقول للملائكة أهؤلاء إياكم كانوا يعبدون
    surahName: Saba
