  data:
    ref: '34:26'
    scripture: quran
    name: Quran 34:26
    chapter: 34
    verse: 26
    ordinal: 3632
    text: 'Say: Our Lord will bring us all together, then He will judge between us with truth. He is the All-knowing Judge.'
    translation: Pickthall
    original: قُلْ يَجْمَعُ بَيْنَنَا رَبُّنَا ثُمَّ يَفْتَحُ بَيْنَنَا بِٱلْحَقِّ وَهُوَ ٱلْفَتَّاحُ ٱلْعَلِيمُ
    arabicPlain: قل يجمع بيننا ربنا ثم يفتح بيننا بالحق وهو الفتاح العليم
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 372
    page: 431
