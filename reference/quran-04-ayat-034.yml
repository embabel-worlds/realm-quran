  data:
    ref: '34:38'
    scripture: quran
    name: Quran 34:38
    chapter: 34
    verse: 38
    ordinal: 3644
    text: And as for those who strive against Our revelations, challenging, they will be brought to the doom.
    translation: Pickthall
    original: وَٱلَّذِينَ يَسْعَوْنَ فِىٓ ءَايَـٰتِنَا مُعَـٰجِزِينَ أُو۟لَـٰٓئِكَ فِى ٱلْعَذَابِ مُحْضَرُونَ
    arabicPlain: والذين يسعون في آياتنا معاجزين أولئك في العذاب محضرون
    surahName: Saba
    juz: 22
    manzil: 5
