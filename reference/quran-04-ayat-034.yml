  data:
    ref: '34:45'
    scripture: quran
    name: Quran 34:45
    chapter: 34
    verse: 45
    ordinal: 3651
    text: Those before them denied, and these have not attained a tithe of that which We bestowed on them (of old); yet they denied My messengers. How intense then was My abhorrence (of them)!
    translation: Pickthall
    original: وَكَذَّبَ ٱلَّذِينَ مِن قَبْلِهِمْ وَمَا بَلَغُوا۟ مِعْشَارَ مَآ ءَاتَيْنَـٰهُمْ فَكَذَّبُوا۟ رُسُلِى ۖ فَكَيْفَ كَانَ نَكِيرِ
    arabicPlain: وكذب الذين من قبلهم وما بلغوا معشار ما آتيناهم فكذبوا رسلي ۖ فكيف كان نكير
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 374
    page: 433
  relations:
