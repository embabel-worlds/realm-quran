  data:
    ref: '34:18'
    scripture: quran
    name: Quran 34:18
    chapter: 34
    verse: 18
    ordinal: 3624
    text: 'And We set, between them and the towns which We had blessed, towns easy to be seen, and We made the stage between them easy, (saying): Travel in them safely both by night and day.'
    translation: Pickthall
    original: وَجَعَلْنَا بَيْنَهُمْ وَبَيْنَ ٱلْقُرَى ٱلَّتِى بَـٰرَكْنَا فِيهَا قُرًى ظَـٰهِرَةً وَقَدَّرْنَا فِيهَا ٱلسَّيْرَ ۖ سِيرُوا۟ فِيهَا لَيَالِىَ وَأَيَّامًا ءَامِنِينَ
    arabicPlain: وجعلنا بينهم وبين القرى التي باركنا فيها قرى ظاهرة وقدرنا فيها السير ۖ سيروا فيها ليالي وأياما آمنين
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 371
