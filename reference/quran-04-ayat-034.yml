  data:
    ref: '34:23'
    scripture: quran
    name: Quran 34:23
    chapter: 34
    verse: 23
    ordinal: 3629
    text: 'No intercession availeth with Him save for him whom He permitteth. Yet, when fear is banished from their hearts, they say: What was it that your Lord said? They say: The Truth. And He is the Sublime, the Great.'
    translation: Pickthall
    original: وَلَا تَنفَعُ ٱلشَّفَـٰعَةُ عِندَهُۥٓ إِلَّا لِمَنْ أَذِنَ لَهُۥ ۚ حَتَّىٰٓ إِذَا فُزِّعَ عَن قُلُوبِهِمْ قَالُوا۟ مَاذَا قَالَ رَبُّكُمْ ۖ قَالُوا۟ ٱلْحَقَّ ۖ وَهُوَ ٱلْعَلِىُّ ٱلْكَبِيرُ
    arabicPlain: ولا تنفع الشفاعة عنده إلا لمن أذن له ۚ حتى إذا فزع عن قلوبهم قالوا ماذا قال ربكم ۖ قالوا الحق ۖ وهو العلي الكبير
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 372
    page: 431
  relations:
  - predicate: IN
    to:
      type: Surah
