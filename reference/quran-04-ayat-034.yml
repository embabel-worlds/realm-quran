  data:
    ref: '34:41'
    scripture: quran
    name: Quran 34:41
    chapter: 34
    verse: 41
    ordinal: 3647
    text: 'They will say: Be Thou Glorified. Thou (alone) art our Guardian, not them! Nay, but they worshipped the jinn; most of them were believers in them.'
    translation: Pickthall
    original: قَالُوا۟ سُبْحَـٰنَكَ أَنتَ وَلِيُّنَا مِن دُونِهِم ۖ بَلْ كَانُوا۟ يَعْبُدُونَ ٱلْجِنَّ ۖ أَكْثَرُهُم بِهِم مُّؤْمِنُونَ
    arabicPlain: قالوا سبحانك أنت ولينا من دونهم ۖ بل كانوا يعبدون الجن ۖ أكثرهم بهم مؤمنون
    surahName: Saba
    juz: 22
    manzil: 5
