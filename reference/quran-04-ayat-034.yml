  data:
    ref: '34:29'
    scripture: quran
    name: Quran 34:29
    chapter: 34
    verse: 29
    ordinal: 3635
    text: 'And they say: When is this promise (to be fulfilled) if ye are truthful?'
    translation: Pickthall
    original: وَيَقُولُونَ مَتَىٰ هَـٰذَا ٱلْوَعْدُ إِن كُنتُمْ صَـٰدِقِينَ
    arabicPlain: ويقولون متى هذا الوعد إن كنتم صادقين
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 372
    page: 431
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '34'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-22
- type: Ayah
  data:
    ref: '34:30'
    scripture: quran
    name: Quran 34:30
    chapter: 34
    verse: 30
    ordinal: 3636
    text: 'Say (O Muhammad): Yours is the promise of a Day which ye cannot postpone nor hasten by an hour.'
    translation: Pickthall
    original: قُل لَّكُم مِّيعَادُ يَوْمٍ لَّا تَسْتَـْٔخِرُونَ عَنْهُ سَاعَةً وَلَا تَسْتَقْدِمُونَ
    arabicPlain: قل لكم ميعاد يوم لا تستأخرون عنه ساعة ولا تستقدمون
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 372
    page: 431
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '34'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-22
- type: Ayah
  data:
    ref: '34:31'
    scripture: quran
    name: Quran 34:31
    chapter: 34
    verse: 31
    ordinal: 3637
    text: 'And those who disbelieve say: We believe not in this Qur''an nor in that which was before it; but oh, if thou couldst see, when the wrong-doers are brought up before their Lord, how they cast the blame one to another; how those who were despised (in the earth) say unto those who were proud: But for you, we should have been believers.'
    translation: Pickthall
    original: وَقَالَ ٱلَّذِينَ كَفَرُوا۟ لَن نُّؤْمِنَ بِهَـٰذَا ٱلْقُرْءَانِ وَلَا بِٱلَّذِى بَيْنَ يَدَيْهِ ۗ وَلَوْ تَرَىٰٓ إِذِ ٱلظَّـٰلِمُونَ مَوْقُوفُونَ عِندَ رَبِّهِمْ يَرْجِعُ بَعْضُهُمْ إِلَىٰ بَعْضٍ ٱلْقَوْلَ يَقُولُ ٱلَّذِينَ ٱسْتُضْعِفُوا۟ لِلَّذِينَ ٱسْتَكْبَرُوا۟ لَوْلَآ أَنتُمْ لَكُنَّا مُؤْمِنِينَ
    arabicPlain: وقال الذين كفروا لن نؤمن بهذا القرآن ولا بالذي بين يديه ۗ ولو ترى إذ الظالمون موقوفون عند ربهم يرجع بعضهم إلى بعض القول يقول الذين استضعفوا للذين استكبروا لولا أنتم لكنا مؤمنين
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 373
    page: 431
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '34'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-22
- type: Ayah
  data:
    ref: '34:32'
    scripture: quran
    name: Quran 34:32
    chapter: 34
    verse: 32
    ordinal: 3638
    text: 'Those who were proud say unto those who were despised: Did we drive you away from the guidance after it had come unto you? Nay, but ye were guilty.'
    translation: Pickthall
    original: قَالَ ٱلَّذِينَ ٱسْتَكْبَرُوا۟ لِلَّذِينَ ٱسْتُضْعِفُوٓا۟ أَنَحْنُ صَدَدْنَـٰكُمْ عَنِ ٱلْهُدَىٰ بَعْدَ إِذْ جَآءَكُم ۖ بَلْ كُنتُم مُّجْرِمِينَ
    arabicPlain: قال الذين استكبروا للذين استضعفوا أنحن صددناكم عن الهدى بعد إذ جاءكم ۖ بل كنتم مجرمين
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 373
    page: 432
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '34'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-22
- type: Ayah
  data:
    ref: '34:33'
    scripture: quran
    name: Quran 34:33
    chapter: 34
    verse: 33
    ordinal: 3639
    text: 'Those who were despised say unto those who were proud: Nay but (it was your) scheming night and day, when ye commanded us to disbelieve in Allah and set up rivals unto Him. And they are filled with remorse when they behold the doom; and We place carcans on the necks of those who disbelieved. Are they requited aught save what they used to do?'
    translation: Pickthall
    original: وَقَالَ ٱلَّذِينَ ٱسْتُضْعِفُوا۟ لِلَّذِينَ ٱسْتَكْبَرُوا۟ بَلْ مَكْرُ ٱلَّيْلِ وَٱلنَّهَارِ إِذْ تَأْمُرُونَنَآ أَن نَّكْفُرَ بِٱللَّهِ وَنَجْعَلَ لَهُۥٓ أَندَادًا ۚ وَأَسَرُّوا۟ ٱلنَّدَامَةَ لَمَّا رَأَوُا۟ ٱلْعَذَابَ وَجَعَلْنَا ٱلْأَغْلَـٰلَ فِىٓ أَعْنَاقِ ٱلَّذِينَ كَفَرُوا۟ ۚ هَلْ يُجْزَوْنَ إِلَّا مَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: وقال الذين استضعفوا للذين استكبروا بل مكر الليل والنهار إذ تأمروننا أن نكفر بالله ونجعل له أندادا ۚ وأسروا الندامة لما رأوا العذاب وجعلنا الأغلال في أعناق الذين كفروا ۚ هل يجزون إلا ما كانوا يعملون
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 373
    page: 432
