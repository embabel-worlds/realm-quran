  data:
    ref: '34:11'
    scripture: quran
    name: Quran 34:11
    chapter: 34
    verse: 11
    ordinal: 3617
    text: 'Saying: Make thou long coats of mail and measure the links (thereof). And do ye right. Lo! I am Seer of what ye do.'
    translation: Pickthall
    original: أَنِ ٱعْمَلْ سَـٰبِغَـٰتٍ وَقَدِّرْ فِى ٱلسَّرْدِ ۖ وَٱعْمَلُوا۟ صَـٰلِحًا ۖ إِنِّى بِمَا تَعْمَلُونَ بَصِيرٌ
    arabicPlain: أن اعمل سابغات وقدر في السرد ۖ واعملوا صالحا ۖ إني بما تعملون بصير
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 371
