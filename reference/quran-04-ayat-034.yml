  data:
    ref: '34:22'
    scripture: quran
    name: Quran 34:22
    chapter: 34
    verse: 22
    ordinal: 3628
    text: 'Say (O Muhammad): Call upon those whom ye set up beside Allah! They possess not an atom''s weight either in the heavens or in the earth, nor have they any share in either, nor hath He an auxiliary among them.'
    translation: Pickthall
    original: قُلِ ٱدْعُوا۟ ٱلَّذِينَ زَعَمْتُم مِّن دُونِ ٱللَّهِ ۖ لَا يَمْلِكُونَ مِثْقَالَ ذَرَّةٍ فِى ٱلسَّمَـٰوَٰتِ وَلَا فِى ٱلْأَرْضِ وَمَا لَهُمْ فِيهِمَا مِن شِرْكٍ وَمَا لَهُۥ مِنْهُم مِّن ظَهِيرٍ
    arabicPlain: قل ادعوا الذين زعمتم من دون الله ۖ لا يملكون مثقال ذرة في السماوات ولا في الأرض وما لهم فيهما من شرك وما له منهم من ظهير
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 372
    page: 430
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '34'
  - predicate: IN_PORTION
    to:
      type: Juz
