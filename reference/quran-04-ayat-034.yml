  data:
    ref: '34:42'
    scripture: quran
    name: Quran 34:42
    chapter: 34
    verse: 42
    ordinal: 3648
    text: 'That day ye will possess no use nor hurt one for another. And We shall say unto those who did wrong: Taste the doom of the Fire which ye used to deny.'
    translation: Pickthall
    original: فَٱلْيَوْمَ لَا يَمْلِكُ بَعْضُكُمْ لِبَعْضٍ نَّفْعًا وَلَا ضَرًّا وَنَقُولُ لِلَّذِينَ ظَلَمُوا۟ ذُوقُوا۟ عَذَابَ ٱلنَّارِ ٱلَّتِى كُنتُم بِهَا تُكَذِّبُونَ
    arabicPlain: فاليوم لا يملك بعضكم لبعض نفعا ولا ضرا ونقول للذين ظلموا ذوقوا عذاب النار التي كنتم بها تكذبون
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 374
    page: 433
