  data:
    ref: '34:36'
    scripture: quran
    name: Quran 34:36
    chapter: 34
    verse: 36
    ordinal: 3642
    text: 'Say (O Muhammad): Lo! my Lord enlargeth the provision for whom He will and narroweth it (for whom He will). But most of mankind know not.'
    translation: Pickthall
    original: قُلْ إِنَّ رَبِّى يَبْسُطُ ٱلرِّزْقَ لِمَن يَشَآءُ وَيَقْدِرُ وَلَـٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يَعْلَمُونَ
    arabicPlain: قل إن ربي يبسط الرزق لمن يشاء ويقدر ولكن أكثر الناس لا يعلمون
    surahName: Saba
    juz: 22
