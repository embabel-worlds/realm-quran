- type: Ayah
  data:
    ref: '34:4'
    scripture: quran
    name: Quran 34:4
    chapter: 34
    verse: 4
    ordinal: 3610
    text: That He may reward those who believe and do good works. For them is pardon and a rich provision.
    translation: Pickthall
    original: لِّيَجْزِىَ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ ۚ أُو۟لَـٰٓئِكَ لَهُم مَّغْفِرَةٌ وَرِزْقٌ كَرِيمٌ
    arabicPlain: ليجزي الذين آمنوا وعملوا الصالحات ۚ أولئك لهم مغفرة ورزق كريم
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 370
