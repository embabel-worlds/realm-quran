- type: Ayah
  data:
    ref: '34:12'
    scripture: quran
    name: Quran 34:12
    chapter: 34
    verse: 12
    ordinal: 3618
    text: And unto Solomon (We gave) the wind, whereof the morning course was a month's journey and the evening course a month's journey, and We caused the fount of copper to gush forth for him, and (We gave him) certain of the jinn who worked before him by permission of his Lord. And such of them as deviated from Our command, them We caused to taste the punishment of flaming Fire.
    translation: Pickthall
    original: وَلِسُلَيْمَـٰنَ ٱلرِّيحَ غُدُوُّهَا شَهْرٌ وَرَوَاحُهَا شَهْرٌ ۖ وَأَسَلْنَا لَهُۥ عَيْنَ ٱلْقِطْرِ ۖ وَمِنَ ٱلْجِنِّ مَن يَعْمَلُ بَيْنَ يَدَيْهِ بِإِذْنِ رَبِّهِۦ ۖ وَمَن يَزِغْ مِنْهُمْ عَنْ أَمْرِنَا نُذِقْهُ مِنْ عَذَابِ ٱلسَّعِيرِ
    arabicPlain: ولسليمان الريح غدوها شهر ورواحها شهر ۖ وأسلنا له عين القطر ۖ ومن الجن من يعمل بين يديه بإذن ربه ۖ ومن يزغ منهم عن أمرنا نذقه من عذاب السعير
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 371
    page: 429
