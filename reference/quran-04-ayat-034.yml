- type: Ayah
  data:
    ref: '34:9'
    scripture: quran
    name: Quran 34:9
    chapter: 34
    verse: 9
    ordinal: 3615
    text: Have they not observed what is before them and what is behind them of the sky and the earth? If We will, We can make the earth swallow them, or cause obliteration from the sky to fall on them. Lo! herein surely is a portent for every slave who turneth (to Allah) repentant.
    translation: Pickthall
    original: أَفَلَمْ يَرَوْا۟ إِلَىٰ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُم مِّنَ ٱلسَّمَآءِ وَٱلْأَرْضِ ۚ إِن نَّشَأْ نَخْسِفْ بِهِمُ ٱلْأَرْضَ أَوْ نُسْقِطْ عَلَيْهِمْ كِسَفًا مِّنَ ٱلسَّمَآءِ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَةً لِّكُلِّ عَبْدٍ مُّنِيبٍ
    arabicPlain: أفلم يروا إلى ما بين أيديهم وما خلفهم من السماء والأرض ۚ إن نشأ نخسف بهم الأرض أو نسقط عليهم كسفا من السماء ۚ إن في ذلك لآية لكل عبد منيب
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 370
