  data:
    ref: '34:20'
    scripture: quran
    name: Quran 34:20
    chapter: 34
    verse: 20
    ordinal: 3626
    text: And Satan indeed found his calculation true concerning them, for they follow him, all save a group of true believers.
    translation: Pickthall
    original: وَلَقَدْ صَدَّقَ عَلَيْهِمْ إِبْلِيسُ ظَنَّهُۥ فَٱتَّبَعُوهُ إِلَّا فَرِيقًا مِّنَ ٱلْمُؤْمِنِينَ
    arabicPlain: ولقد صدق عليهم إبليس ظنه فاتبعوه إلا فريقا من المؤمنين
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 371
