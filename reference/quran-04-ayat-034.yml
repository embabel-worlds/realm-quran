- type: Ayah
  data:
    ref: '34:10'
    scripture: quran
    name: Quran 34:10
    chapter: 34
    verse: 10
    ordinal: 3616
    text: 'And assuredly We gave David grace from Us, (saying): O ye hills and birds, echo his psalms of praise! And We made the iron supple unto him,'
    translation: Pickthall
    original: ۞ وَلَقَدْ ءَاتَيْنَا دَاوُۥدَ مِنَّا فَضْلًا ۖ يَـٰجِبَالُ أَوِّبِى مَعَهُۥ وَٱلطَّيْرَ ۖ وَأَلَنَّا لَهُ ٱلْحَدِيدَ
    arabicPlain: ۞ ولقد آتينا داوود منا فضلا ۖ يا جبال أوبي معه والطير ۖ وألنا له الحديد
    surahName: Saba
    juz: 22
    manzil: 5
