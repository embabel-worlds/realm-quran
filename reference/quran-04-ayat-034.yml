  data:
    ref: '34:19'
    scripture: quran
    name: Quran 34:19
    chapter: 34
    verse: 19
    ordinal: 3625
    text: 'But they said: Our Lord! Make the stage between our journeys longer. And they wronged themselves, therefore We made them bywords (in the land) and scattered them abroad, a total scattering. Lo! herein verily are portents for each steadfast, grateful (heart).'
    translation: Pickthall
    original: فَقَالُوا۟ رَبَّنَا بَـٰعِدْ بَيْنَ أَسْفَارِنَا وَظَلَمُوٓا۟ أَنفُسَهُمْ فَجَعَلْنَـٰهُمْ أَحَادِيثَ وَمَزَّقْنَـٰهُمْ كُلَّ مُمَزَّقٍ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍ لِّكُلِّ صَبَّارٍ شَكُورٍ
    arabicPlain: فقالوا ربنا باعد بين أسفارنا وظلموا أنفسهم فجعلناهم أحاديث ومزقناهم كل ممزق ۚ إن في ذلك لآيات لكل صبار شكور
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 371
    page: 430
