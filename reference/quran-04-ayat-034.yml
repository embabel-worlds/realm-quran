- type: Ayah
  data:
    ref: '34:13'
    scripture: quran
    name: Quran 34:13
    chapter: 34
    verse: 13
    ordinal: 3619
    text: 'They made for him what he willed: synagogues and statues, basins like wells and boilers built into the ground. Give thanks, O House of David! Few of My bondmen are thankful.'
    translation: Pickthall
    original: يَعْمَلُونَ لَهُۥ مَا يَشَآءُ مِن مَّحَـٰرِيبَ وَتَمَـٰثِيلَ وَجِفَانٍ كَٱلْجَوَابِ وَقُدُورٍ رَّاسِيَـٰتٍ ۚ ٱعْمَلُوٓا۟ ءَالَ دَاوُۥدَ شُكْرًا ۚ وَقَلِيلٌ مِّنْ عِبَادِىَ ٱلشَّكُورُ
    arabicPlain: يعملون له ما يشاء من محاريب وتماثيل وجفان كالجواب وقدور راسيات ۚ اعملوا آل داوود شكرا ۚ وقليل من عبادي الشكور
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 371
    page: 429
  relations:
  - predicate: IN
    to:
      type: Surah
