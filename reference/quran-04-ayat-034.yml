  data:
    ref: '34:46'
    scripture: quran
    name: Quran 34:46
    chapter: 34
    verse: 46
    ordinal: 3652
    text: 'Say (unto them, O Muhammad): I exhort you unto one thing only: that ye awake, for Allah''s sake, by twos and singly, and then reflect: There is no madness in your comrade. He is naught else than a warner unto you in face of a terrific doom.'
    translation: Pickthall
    original: ۞ قُلْ إِنَّمَآ أَعِظُكُم بِوَٰحِدَةٍ ۖ أَن تَقُومُوا۟ لِلَّهِ مَثْنَىٰ وَفُرَٰدَىٰ ثُمَّ تَتَفَكَّرُوا۟ ۚ مَا بِصَاحِبِكُم مِّن جِنَّةٍ ۚ إِنْ هُوَ إِلَّا نَذِيرٌ لَّكُم بَيْنَ يَدَىْ عَذَابٍ شَدِيدٍ
    arabicPlain: ۞ قل إنما أعظكم بواحدة ۖ أن تقوموا لله مثنى وفرادى ثم تتفكروا ۚ ما بصاحبكم من جنة ۚ إن هو إلا نذير لكم بين يدي عذاب شديد
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 375
    page: 433
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '34'
  - predicate: IN_PORTION
    to:
