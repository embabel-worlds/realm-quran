  data:
    ref: '34:17'
    scripture: quran
    name: Quran 34:17
    chapter: 34
    verse: 17
    ordinal: 3623
    text: This We awarded them because of their ingratitude. Punish We ever any save the ingrates?
    translation: Pickthall
    original: ذَٰلِكَ جَزَيْنَـٰهُم بِمَا كَفَرُوا۟ ۖ وَهَلْ نُجَـٰزِىٓ إِلَّا ٱلْكَفُورَ
    arabicPlain: ذلك جزيناهم بما كفروا ۖ وهل نجازي إلا الكفور
    surahName: Saba
    juz: 22
    manzil: 5
