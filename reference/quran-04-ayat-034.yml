  data:
    ref: '34:50'
    scripture: quran
    name: Quran 34:50
    chapter: 34
    verse: 50
    ordinal: 3656
    text: 'Say: If I err, I err only to my own loss, and if I am rightly guided it is because of that which my Lord hath revealed unto me. Lo! He is Hearer, Nigh.'
    translation: Pickthall
    original: قُلْ إِن ضَلَلْتُ فَإِنَّمَآ أَضِلُّ عَلَىٰ نَفْسِى ۖ وَإِنِ ٱهْتَدَيْتُ فَبِمَا يُوحِىٓ إِلَىَّ رَبِّىٓ ۚ إِنَّهُۥ سَمِيعٌ قَرِيبٌ
    arabicPlain: قل إن ضللت فإنما أضل على نفسي ۖ وإن اهتديت فبما يوحي إلي ربي ۚ إنه سميع قريب
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 375
    page: 434
