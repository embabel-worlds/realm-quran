- type: Ayah
  data:
    ref: '34:3'
    scripture: quran
    name: Quran 34:3
    chapter: 34
    verse: 3
    ordinal: 3609
    text: 'Those who disbelieve say: The Hour will never come unto us. Say: Nay, by my Lord, but it is coming unto you surely. (He is) the Knower of the Unseen. Not an atom''s weight, or less than that or greater, escapeth Him in the heavens or in the earth, but it is in a clear Record,'
    translation: Pickthall
    original: وَقَالَ ٱلَّذِينَ كَفَرُوا۟ لَا تَأْتِينَا ٱلسَّاعَةُ ۖ قُلْ بَلَىٰ وَرَبِّى لَتَأْتِيَنَّكُمْ عَـٰلِمِ ٱلْغَيْبِ ۖ لَا يَعْزُبُ عَنْهُ مِثْقَالُ ذَرَّةٍ فِى ٱلسَّمَـٰوَٰتِ وَلَا فِى ٱلْأَرْضِ وَلَآ أَصْغَرُ مِن ذَٰلِكَ وَلَآ أَكْبَرُ إِلَّا فِى كِتَـٰبٍ مُّبِينٍ
    arabicPlain: وقال الذين كفروا لا تأتينا الساعة ۖ قل بلى وربي لتأتينكم عالم الغيب ۖ لا يعزب عنه مثقال ذرة في السماوات ولا في الأرض ولا أصغر من ذلك ولا أكبر إلا في كتاب مبين
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 370
    page: 428
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '34'
  - predicate: IN_PORTION
