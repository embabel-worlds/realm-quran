    text: 'And they say: We are more (than you) in wealth and children. We are not the punished!'
    translation: Pickthall
    original: وَقَالُوا۟ نَحْنُ أَكْثَرُ أَمْوَٰلًا وَأَوْلَـٰدًا وَمَا نَحْنُ بِمُعَذَّبِينَ
    arabicPlain: وقالوا نحن أكثر أموالا وأولادا وما نحن بمعذبين
