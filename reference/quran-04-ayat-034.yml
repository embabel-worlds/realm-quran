- type: Ayah
  data:
    ref: '34:8'
    scripture: quran
    name: Quran 34:8
    chapter: 34
    verse: 8
    ordinal: 3614
    text: Hath he invented a lie concerning Allah, or is there in him a madness? Nay, but those who disbelieve in the Hereafter are in torment and far error.
    translation: Pickthall
    original: أَفْتَرَىٰ عَلَى ٱللَّهِ كَذِبًا أَم بِهِۦ جِنَّةٌۢ ۗ بَلِ ٱلَّذِينَ لَا يُؤْمِنُونَ بِٱلْـَٔاخِرَةِ فِى ٱلْعَذَابِ وَٱلضَّلَـٰلِ ٱلْبَعِيدِ
    arabicPlain: أفترى على الله كذبا أم به جنة ۗ بل الذين لا يؤمنون بالآخرة في العذاب والضلال البعيد
    surahName: Saba
    juz: 22
    manzil: 5
