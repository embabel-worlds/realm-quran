  data:
    ref: '34:48'
    scripture: quran
    name: Quran 34:48
    chapter: 34
    verse: 48
    ordinal: 3654
    text: 'Say: Lo! my Lord hurleth the truth. (He is) the Knower of Things Hidden.'
    translation: Pickthall
    original: قُلْ إِنَّ رَبِّى يَقْذِفُ بِٱلْحَقِّ عَلَّـٰمُ ٱلْغُيُوبِ
    arabicPlain: قل إن ربي يقذف بالحق علام الغيوب
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 375
    page: 433
  relations:
