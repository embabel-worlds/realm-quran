- type: Ayah
  data:
    ref: '34:5'
    scripture: quran
    name: Quran 34:5
    chapter: 34
    verse: 5
    ordinal: 3611
    text: But those who strive against Our revelations, challenging (Us), theirs will be a painful doom of wrath.
    translation: Pickthall
    original: وَٱلَّذِينَ سَعَوْ فِىٓ ءَايَـٰتِنَا مُعَـٰجِزِينَ أُو۟لَـٰٓئِكَ لَهُمْ عَذَابٌ مِّن رِّجْزٍ أَلِيمٌ
    arabicPlain: والذين سعوا في آياتنا معاجزين أولئك لهم عذاب من رجز أليم
    surahName: Saba
    juz: 22
    manzil: 5
