  data:
    ref: '34:47'
    scripture: quran
    name: Quran 34:47
    chapter: 34
    verse: 47
    ordinal: 3653
    text: 'Say: Whatever reward I might have asked of you is yours. My reward is the affair of Allah only. He is Witness over all things.'
    translation: Pickthall
    original: قُلْ مَا سَأَلْتُكُم مِّنْ أَجْرٍ فَهُوَ لَكُمْ ۖ إِنْ أَجْرِىَ إِلَّا عَلَى ٱللَّهِ ۖ وَهُوَ عَلَىٰ كُلِّ شَىْءٍ شَهِيدٌ
    arabicPlain: قل ما سألتكم من أجر فهو لكم ۖ إن أجري إلا على الله ۖ وهو على كل شيء شهيد
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 375
    page: 433
  relations:
