  data:
    ref: '34:28'
    scripture: quran
    name: Quran 34:28
    chapter: 34
    verse: 28
    ordinal: 3634
    text: And We have not sent thee (O Muhammad) save as a bringer of good tidings and a warner unto all mankind; but most of mankind know not.
    translation: Pickthall
    original: وَمَآ أَرْسَلْنَـٰكَ إِلَّا كَآفَّةً لِّلنَّاسِ بَشِيرًا وَنَذِيرًا وَلَـٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يَعْلَمُونَ
    arabicPlain: وما أرسلناك إلا كافة للناس بشيرا ونذيرا ولكن أكثر الناس لا يعلمون
    surahName: Saba
    juz: 22
    manzil: 5
    ruku: 372
    page: 431
  relations:
