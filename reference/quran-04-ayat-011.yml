  data:
    ref: '11:50'
    scripture: quran
    name: Quran 11:50
    chapter: 11
    verse: 50
    ordinal: 1523
    text: 'And unto (the tribe of) A''ad (We sent) their brother, Hud. He said: O my people! Serve Allah! Ye have no other Allah save Him. Lo! ye do but invent.'
    translation: Pickthall
    original: وَإِلَىٰ عَادٍ أَخَاهُمْ هُودًا ۚ قَالَ يَـٰقَوْمِ ٱعْبُدُوا۟ ٱللَّهَ مَا لَكُم مِّنْ إِلَـٰهٍ غَيْرُهُۥٓ ۖ إِنْ أَنتُمْ إِلَّا مُفْتَرُونَ
    arabicPlain: وإلى عاد أخاهم هودا ۚ قال يا قوم اعبدوا الله ما لكم من إله غيره ۖ إن أنتم إلا مفترون
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 187
    page: 227
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '11'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-12
- type: Ayah
  data:
    ref: '11:51'
    scripture: quran
    name: Quran 11:51
    chapter: 11
    verse: 51
    ordinal: 1524
    text: O my people! I ask of you no reward for it. Lo! my reward is the concern only of Him Who made me. Have ye then no sense?
    translation: Pickthall
    original: يَـٰقَوْمِ لَآ أَسْـَٔلُكُمْ عَلَيْهِ أَجْرًا ۖ إِنْ أَجْرِىَ إِلَّا عَلَى ٱلَّذِى فَطَرَنِىٓ ۚ أَفَلَا تَعْقِلُونَ
    arabicPlain: يا قوم لا أسألكم عليه أجرا ۖ إن أجري إلا على الذي فطرني ۚ أفلا تعقلون
