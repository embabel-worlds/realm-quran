    name: Quran 11:101
    chapter: 11
    verse: 101
    ordinal: 1574
    text: We wronged them not, but they did wrong themselves; and their gods on whom they call beside Allah availed them naught when came thy Lord's command; they added to them naught save ruin.
    translation: Pickthall
    original: وَمَا ظَلَمْنَـٰهُمْ وَلَـٰكِن ظَلَمُوٓا۟ أَنفُسَهُمْ ۖ فَمَآ أَغْنَتْ عَنْهُمْ ءَالِهَتُهُمُ ٱلَّتِى يَدْعُونَ مِن دُونِ ٱللَّهِ مِن شَىْءٍ لَّمَّا جَآءَ أَمْرُ رَبِّكَ ۖ وَمَا زَادُوهُمْ غَيْرَ تَتْبِيبٍ
    arabicPlain: وما ظلمناهم ولكن ظلموا أنفسهم ۖ فما أغنت عنهم آلهتهم التي يدعون من دون الله من شيء لما جاء أمر ربك ۖ وما زادوهم غير تتبيب
    surahName: Hud
