  data:
    ref: '11:31'
    scripture: quran
    name: Quran 11:31
    chapter: 11
    verse: 31
    ordinal: 1504
    text: 'I say not unto you: "I have the treasures of Allah" nor "I have knowledge of the Unseen," nor say I: "Lo! I am an angel!" Nor say I unto those whom your eyes scorn that Allah will not give them good - Allah knoweth best what is in their hearts - Lo! then indeed I should be of the wrong-doers.'
    translation: Pickthall
    original: وَلَآ أَقُولُ لَكُمْ عِندِى خَزَآئِنُ ٱللَّهِ وَلَآ أَعْلَمُ ٱلْغَيْبَ وَلَآ أَقُولُ إِنِّى مَلَكٌ وَلَآ أَقُولُ لِلَّذِينَ تَزْدَرِىٓ أَعْيُنُكُمْ لَن يُؤْتِيَهُمُ ٱللَّهُ خَيْرًا ۖ ٱللَّهُ أَعْلَمُ بِمَا فِىٓ أَنفُسِهِمْ ۖ إِنِّىٓ إِذًا لَّمِنَ ٱلظَّـٰلِمِينَ
    arabicPlain: ولا أقول لكم عندي خزائن الله ولا أعلم الغيب ولا أقول إني ملك ولا أقول للذين تزدري أعينكم لن يؤتيهم الله خيرا ۖ الله أعلم بما في أنفسهم ۖ إني إذا لمن الظالمين
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 185
    page: 225
