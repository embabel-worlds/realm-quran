  data:
    ref: 11:119
    scripture: quran
    name: Quran 11:119
    chapter: 11
    verse: 119
    ordinal: 1592
    text: 'Save him on whom thy Lord hath mercy; and for that He did create them. And the Word of thy Lord hath been fulfilled: Verily I shall fill hell with the jinn and mankind together.'
    translation: Pickthall
    original: إِلَّا مَن رَّحِمَ رَبُّكَ ۚ وَلِذَٰلِكَ خَلَقَهُمْ ۗ وَتَمَّتْ كَلِمَةُ رَبِّكَ لَأَمْلَأَنَّ جَهَنَّمَ مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ أَجْمَعِينَ
    arabicPlain: إلا من رحم ربك ۚ ولذلك خلقهم ۗ وتمت كلمة ربك لأملأن جهنم من الجنة والناس أجمعين
    surahName: Hud
