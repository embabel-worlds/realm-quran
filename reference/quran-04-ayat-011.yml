  data:
    ref: '11:8'
    scripture: quran
    name: Quran 11:8
    chapter: 11
    verse: 8
    ordinal: 1481
    text: 'And if We delay for them the doom until a reckoned time, they will surely say: What withholdeth it? Verily on the day when it cometh unto them, it cannot be averted from them, and that which they derided will surround them.'
    translation: Pickthall
    original: وَلَئِنْ أَخَّرْنَا عَنْهُمُ ٱلْعَذَابَ إِلَىٰٓ أُمَّةٍ مَّعْدُودَةٍ لَّيَقُولُنَّ مَا يَحْبِسُهُۥٓ ۗ أَلَا يَوْمَ يَأْتِيهِمْ لَيْسَ مَصْرُوفًا عَنْهُمْ وَحَاقَ بِهِم مَّا كَانُوا۟ بِهِۦ يَسْتَهْزِءُونَ
    arabicPlain: ولئن أخرنا عنهم العذاب إلى أمة معدودة ليقولن ما يحبسه ۗ ألا يوم يأتيهم ليس مصروفا عنهم وحاق بهم ما كانوا به يستهزئون
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 183
    page: 222
