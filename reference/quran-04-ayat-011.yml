    scripture: quran
    name: Quran 11:85
    chapter: 11
    verse: 85
    ordinal: 1558
    text: O my people! Give full measure and full weight in justice, and wrong not people in respect of their goods. And do not evil in the earth, causing corruption.
    translation: Pickthall
    original: وَيَـٰقَوْمِ أَوْفُوا۟ ٱلْمِكْيَالَ وَٱلْمِيزَانَ بِٱلْقِسْطِ ۖ وَلَا تَبْخَسُوا۟ ٱلنَّاسَ أَشْيَآءَهُمْ وَلَا تَعْثَوْا۟ فِى ٱلْأَرْضِ مُفْسِدِينَ
    arabicPlain: ويا قوم أوفوا المكيال والميزان بالقسط ۖ ولا تبخسوا الناس أشياءهم ولا تعثوا في الأرض مفسدين
