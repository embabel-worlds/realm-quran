  data:
    ref: '11:46'
    scripture: quran
    name: Quran 11:46
    chapter: 11
    verse: 46
    ordinal: 1519
    text: 'He said: O Noah! Lo! he is not of thy household; lo! he is of evil conduct, so ask not of Me that whereof thou hast no knowledge. I admonish thee lest thou be among the ignorant.'
    translation: Pickthall
    original: قَالَ يَـٰنُوحُ إِنَّهُۥ لَيْسَ مِنْ أَهْلِكَ ۖ إِنَّهُۥ عَمَلٌ غَيْرُ صَـٰلِحٍ ۖ فَلَا تَسْـَٔلْنِ مَا لَيْسَ لَكَ بِهِۦ عِلْمٌ ۖ إِنِّىٓ أَعِظُكَ أَن تَكُونَ مِنَ ٱلْجَـٰهِلِينَ
    arabicPlain: قال يا نوح إنه ليس من أهلك ۖ إنه عمل غير صالح ۖ فلا تسألن ما ليس لك به علم ۖ إني أعظك أن تكون من الجاهلين
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 186
    page: 227
  relations:
  - predicate: IN
    to:
