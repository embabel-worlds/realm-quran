    scripture: quran
    name: Quran 11:79
    chapter: 11
    verse: 79
    ordinal: 1552
    text: 'They said: Well thou knowest that we have no right to thy daughters, and well thou knowest what we want.'
    translation: Pickthall
    original: قَالُوا۟ لَقَدْ عَلِمْتَ مَا لَنَا فِى بَنَاتِكَ مِنْ حَقٍّ وَإِنَّكَ لَتَعْلَمُ مَا نُرِيدُ
