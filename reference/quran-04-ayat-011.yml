    scripture: quran
    name: Quran 11:77
    chapter: 11
    verse: 77
    ordinal: 1550
    text: 'And when Our messengers came unto Lot, he was distressed and knew not how to protect them. He said: This is a distressful day.'
    translation: Pickthall
    original: وَلَمَّا جَآءَتْ رُسُلُنَا لُوطًا سِىٓءَ بِهِمْ وَضَاقَ بِهِمْ ذَرْعًا وَقَالَ هَـٰذَا يَوْمٌ عَصِيبٌ
    arabicPlain: ولما جاءت رسلنا لوطا سيء بهم وضاق بهم ذرعا وقال هذا يوم عصيب
