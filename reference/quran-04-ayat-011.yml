  data:
    ref: 11:68
    scripture: quran
    name: Quran 11:68
    chapter: 11
    verse: 68
    ordinal: 1541
    text: As though they had not dwelt there. Lo! Thamud disbelieved in their Lord. A far removal for Thamud!
    translation: Pickthall
    original: كَأَن لَّمْ يَغْنَوْا۟ فِيهَآ ۗ أَلَآ إِنَّ ثَمُودَا۟ كَفَرُوا۟ رَبَّهُمْ ۗ أَلَا بُعْدًا لِّثَمُودَ
    arabicPlain: كأن لم يغنوا فيها ۗ ألا إن ثمود كفروا ربهم ۗ ألا بعدا لثمود
