  data:
    ref: '11:43'
    scripture: quran
    name: Quran 11:43
    chapter: 11
    verse: 43
    ordinal: 1516
    text: 'He said: I shall betake me to some mountain that will save me from the water. (Noah) said: This day there is none that saveth from the commandment of Allah save him on whom He hath had mercy. And the wave came in between them, so he was among the drowned.'
    translation: Pickthall
    original: قَالَ سَـَٔاوِىٓ إِلَىٰ جَبَلٍ يَعْصِمُنِى مِنَ ٱلْمَآءِ ۚ قَالَ لَا عَاصِمَ ٱلْيَوْمَ مِنْ أَمْرِ ٱللَّهِ إِلَّا مَن رَّحِمَ ۚ وَحَالَ بَيْنَهُمَا ٱلْمَوْجُ فَكَانَ مِنَ ٱلْمُغْرَقِينَ
    arabicPlain: قال سآوي إلى جبل يعصمني من الماء ۚ قال لا عاصم اليوم من أمر الله إلا من رحم ۚ وحال بينهما الموج فكان من المغرقين
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 186
