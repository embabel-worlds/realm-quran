  data:
    ref: '11:57'
    scripture: quran
    name: Quran 11:57
    chapter: 11
    verse: 57
    ordinal: 1530
    text: And if ye turn away, still I have conveyed unto you that wherewith I was sent unto you, and my Lord will set in place of you a folk other than you. Ye cannot injure Him at all. Lo! my Lord is Guardian over all things.
    translation: Pickthall
    original: فَإِن تَوَلَّوْا۟ فَقَدْ أَبْلَغْتُكُم مَّآ أُرْسِلْتُ بِهِۦٓ إِلَيْكُمْ ۚ وَيَسْتَخْلِفُ رَبِّى قَوْمًا غَيْرَكُمْ وَلَا تَضُرُّونَهُۥ شَيْـًٔا ۚ إِنَّ رَبِّى عَلَىٰ كُلِّ شَىْءٍ حَفِيظٌ
    arabicPlain: فإن تولوا فقد أبلغتكم ما أرسلت به إليكم ۚ ويستخلف ربي قوما غيركم ولا تضرونه شيئا ۚ إن ربي على كل شيء حفيظ
    surahName: Hud
