  data:
    ref: '11:20'
    scripture: quran
    name: Quran 11:20
    chapter: 11
    verse: 20
    ordinal: 1493
    text: Such will not escape in the earth, nor have they any protecting friends beside Allah. For them the torment will be double. They could not bear to hear, and they used not to see.
    translation: Pickthall
    original: أُو۟لَـٰٓئِكَ لَمْ يَكُونُوا۟ مُعْجِزِينَ فِى ٱلْأَرْضِ وَمَا كَانَ لَهُم مِّن دُونِ ٱللَّهِ مِنْ أَوْلِيَآءَ ۘ يُضَـٰعَفُ لَهُمُ ٱلْعَذَابُ ۚ مَا كَانُوا۟ يَسْتَطِيعُونَ ٱلسَّمْعَ وَمَا كَانُوا۟ يُبْصِرُونَ
    arabicPlain: أولئك لم يكونوا معجزين في الأرض وما كان لهم من دون الله من أولياء ۘ يضاعف لهم العذاب ۚ ما كانوا يستطيعون السمع وما كانوا يبصرون
    surahName: Hud
    juz: 12
