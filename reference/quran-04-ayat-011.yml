  data:
    ref: '11:47'
    scripture: quran
    name: Quran 11:47
    chapter: 11
    verse: 47
    ordinal: 1520
    text: 'He said: My Lord! Lo! in Thee do I seek refuge (from the sin) that I should ask of Thee that whereof I have no knowledge. Unless Thou forgive me and have mercy on me I shall be among the lost.'
    translation: Pickthall
    original: قَالَ رَبِّ إِنِّىٓ أَعُوذُ بِكَ أَنْ أَسْـَٔلَكَ مَا لَيْسَ لِى بِهِۦ عِلْمٌ ۖ وَإِلَّا تَغْفِرْ لِى وَتَرْحَمْنِىٓ أَكُن مِّنَ ٱلْخَـٰسِرِينَ
    arabicPlain: قال رب إني أعوذ بك أن أسألك ما ليس لي به علم ۖ وإلا تغفر لي وترحمني أكن من الخاسرين
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 186
    page: 227
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '11'
  - predicate: IN_PORTION
