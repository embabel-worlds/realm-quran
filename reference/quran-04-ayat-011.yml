    chapter: 11
    verse: 35
    ordinal: 1508
    text: 'Or say they (again): He hath invented it? Say: If I have invented it, upon me be my crimes, but I am innocent of (all) that ye commit.'
    translation: Pickthall
    original: أَمْ يَقُولُونَ ٱفْتَرَىٰهُ ۖ قُلْ إِنِ ٱفْتَرَيْتُهُۥ فَعَلَىَّ إِجْرَامِى وَأَنَا۠ بَرِىٓءٌ مِّمَّا تُجْرِمُونَ
    arabicPlain: أم يقولون افتراه ۖ قل إن افتريته فعلي إجرامي وأنا بريء مما تجرمون
