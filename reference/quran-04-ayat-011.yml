    text: My counsel will not profit you if I were minded to advise you, if Allah's will is to keep you astray. He is your Lord and unto Him ye will be brought back.
    translation: Pickthall
    original: وَلَا يَنفَعُكُمْ نُصْحِىٓ إِنْ أَرَدتُّ أَنْ أَنصَحَ لَكُمْ إِن كَانَ ٱللَّهُ يُرِيدُ أَن يُغْوِيَكُمْ ۚ هُوَ رَبُّكُمْ وَإِلَيْهِ تُرْجَعُونَ
    arabicPlain: ولا ينفعكم نصحي إن أردت أن أنصح لكم إن كان الله يريد أن يغويكم ۚ هو ربكم وإليه ترجعون
