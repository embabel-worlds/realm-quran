    chapter: 11
    verse: 76
    ordinal: 1549
    text: (It was said) O Abraham! Forsake this! Lo! thy Lord's commandment hath gone forth, and lo! there cometh unto them a doom which cannot be repelled.
    translation: Pickthall
    original: يَـٰٓإِبْرَٰهِيمُ أَعْرِضْ عَنْ هَـٰذَآ ۖ إِنَّهُۥ قَدْ جَآءَ أَمْرُ رَبِّكَ ۖ وَإِنَّهُمْ ءَاتِيهِمْ عَذَابٌ غَيْرُ مَرْدُودٍ
