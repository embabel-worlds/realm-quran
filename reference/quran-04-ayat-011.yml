    name: Quran 11:111
    chapter: 11
    verse: 111
    ordinal: 1584
    text: And lo! unto each thy Lord will verily repay his works in full. Lo! He is Informed of what they do.
    translation: Pickthall
    original: وَإِنَّ كُلًّا لَّمَّا لَيُوَفِّيَنَّهُمْ رَبُّكَ أَعْمَـٰلَهُمْ ۚ إِنَّهُۥ بِمَا يَعْمَلُونَ خَبِيرٌ
    arabicPlain: وإن كلا لما ليوفينهم ربك أعمالهم ۚ إنه بما يعملون خبير
