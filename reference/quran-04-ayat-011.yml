  data:
    ref: '11:9'
    scripture: quran
    name: Quran 11:9
    chapter: 11
    verse: 9
    ordinal: 1482
    text: And if we cause man to taste some mercy from Us and afterward withdraw it from him, lo! he is despairing, thankless.
    translation: Pickthall
    original: وَلَئِنْ أَذَقْنَا ٱلْإِنسَـٰنَ مِنَّا رَحْمَةً ثُمَّ نَزَعْنَـٰهَا مِنْهُ إِنَّهُۥ لَيَـُٔوسٌ كَفُورٌ
    arabicPlain: ولئن أذقنا الإنسان منا رحمة ثم نزعناها منه إنه ليئوس كفور
    surahName: Hud
    juz: 12
    manzil: 3
