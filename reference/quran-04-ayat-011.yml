    chapter: 11
    verse: 114
    ordinal: 1587
    text: Establish worship at the two ends of the day and in some watches of the night. Lo! good deeds annul ill-deeds. This is reminder for the mindful.
    translation: Pickthall
    original: وَأَقِمِ ٱلصَّلَوٰةَ طَرَفَىِ ٱلنَّهَارِ وَزُلَفًا مِّنَ ٱلَّيْلِ ۚ إِنَّ ٱلْحَسَنَـٰتِ يُذْهِبْنَ ٱلسَّيِّـَٔاتِ ۚ ذَٰلِكَ ذِكْرَىٰ لِلذَّٰكِرِينَ
    arabicPlain: وأقم الصلاة طرفي النهار وزلفا من الليل ۚ إن الحسنات يذهبن السيئات ۚ ذلك ذكرى للذاكرين
