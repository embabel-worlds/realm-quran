  data:
    ref: '11:38'
    scripture: quran
    name: Quran 11:38
    chapter: 11
    verse: 38
    ordinal: 1511
    text: 'And he was building the ship, and every time that chieftains of his people passed him, they made mock of him. He said: Though ye make mock of Us, yet We mock at you even as ye mock;'
    translation: Pickthall
    original: وَيَصْنَعُ ٱلْفُلْكَ وَكُلَّمَا مَرَّ عَلَيْهِ مَلَأٌ مِّن قَوْمِهِۦ سَخِرُوا۟ مِنْهُ ۚ قَالَ إِن تَسْخَرُوا۟ مِنَّا فَإِنَّا نَسْخَرُ مِنكُمْ كَمَا تَسْخَرُونَ
    arabicPlain: ويصنع الفلك وكلما مر عليه ملأ من قومه سخروا منه ۚ قال إن تسخروا منا فإنا نسخر منكم كما تسخرون
    surahName: Hud
