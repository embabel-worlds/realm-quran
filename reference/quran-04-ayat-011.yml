    name: Quran 11:120
    chapter: 11
    verse: 120
    ordinal: 1593
    text: And all that We relate unto thee of the story of the messengers is in order that thereby We may make firm thy heart. And herein hath come unto thee the Truth and an exhortation and a reminder for believers.
    translation: Pickthall
    original: وَكُلًّا نَّقُصُّ عَلَيْكَ مِنْ أَنۢبَآءِ ٱلرُّسُلِ مَا نُثَبِّتُ بِهِۦ فُؤَادَكَ ۚ وَجَآءَكَ فِى هَـٰذِهِ ٱلْحَقُّ وَمَوْعِظَةٌ وَذِكْرَىٰ لِلْمُؤْمِنِينَ
    arabicPlain: وكلا نقص عليك من أنباء الرسل ما نثبت به فؤادك ۚ وجاءك في هذه الحق وموعظة وذكرى للمؤمنين
    surahName: Hud
    juz: 12
    manzil: 3
