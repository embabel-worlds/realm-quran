  data:
    ref: '11:6'
    scripture: quran
    name: Quran 11:6
    chapter: 11
    verse: 6
    ordinal: 1479
    text: And there is not a beast in the earth but the sustenance thereof dependeth on Allah. He knoweth its habitation and its repository. All is in a clear Record.
    translation: Pickthall
    original: ۞ وَمَا مِن دَآبَّةٍ فِى ٱلْأَرْضِ إِلَّا عَلَى ٱللَّهِ رِزْقُهَا وَيَعْلَمُ مُسْتَقَرَّهَا وَمُسْتَوْدَعَهَا ۚ كُلٌّ فِى كِتَـٰبٍ مُّبِينٍ
    arabicPlain: ۞ وما من دابة في الأرض إلا على الله رزقها ويعلم مستقرها ومستودعها ۚ كل في كتاب مبين
    surahName: Hud
