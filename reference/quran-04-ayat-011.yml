    scripture: quran
    name: Quran 11:121
    chapter: 11
    verse: 121
    ordinal: 1594
    text: 'And say unto those who believe not: Act according to your power. Lo! We (too) are acting.'
    translation: Pickthall
    original: وَقُل لِّلَّذِينَ لَا يُؤْمِنُونَ ٱعْمَلُوا۟ عَلَىٰ مَكَانَتِكُمْ إِنَّا عَـٰمِلُونَ
    arabicPlain: وقل للذين لا يؤمنون اعملوا على مكانتكم إنا عاملون
    surahName: Hud
    juz: 12
    manzil: 3
