    scripture: quran
    name: Quran 11:123
    chapter: 11
    verse: 123
    ordinal: 1596
    text: And Allah's is the Invisible of the heavens and the earth, and unto Him the whole matter will be returned. So worship Him and put thy trust in Him. Lo! thy Lord is not unaware of what ye (mortals) do.
    translation: Pickthall
    original: وَلِلَّهِ غَيْبُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَإِلَيْهِ يُرْجَعُ ٱلْأَمْرُ كُلُّهُۥ فَٱعْبُدْهُ وَتَوَكَّلْ عَلَيْهِ ۚ وَمَا رَبُّكَ بِغَـٰفِلٍ عَمَّا تَعْمَلُونَ
    arabicPlain: ولله غيب السماوات والأرض وإليه يرجع الأمر كله فاعبده وتوكل عليه ۚ وما ربك بغافل عما تعملون
