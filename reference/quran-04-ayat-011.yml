  data:
    ref: '11:59'
    scripture: quran
    name: Quran 11:59
    chapter: 11
    verse: 59
    ordinal: 1532
    text: And such were A'ad. They denied the revelations of their Lord and flouted His messengers and followed the command of every froward potentate.
    translation: Pickthall
    original: وَتِلْكَ عَادٌ ۖ جَحَدُوا۟ بِـَٔايَـٰتِ رَبِّهِمْ وَعَصَوْا۟ رُسُلَهُۥ وَٱتَّبَعُوٓا۟ أَمْرَ كُلِّ جَبَّارٍ عَنِيدٍ
    arabicPlain: وتلك عاد ۖ جحدوا بآيات ربهم وعصوا رسله واتبعوا أمر كل جبار عنيد
    surahName: Hud
    juz: 12
