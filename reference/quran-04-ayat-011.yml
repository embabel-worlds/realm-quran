  data:
    ref: 11:110
    scripture: quran
    name: Quran 11:110
    chapter: 11
    verse: 110
    ordinal: 1583
    text: And we verily gave unto Moses the Scripture, and there was strife thereupon; and had it not been for a Word that had already gone forth from thy Lord, the case would have been judged between them, and lo! they are in grave doubt concerning it.
    translation: Pickthall
    original: وَلَقَدْ ءَاتَيْنَا مُوسَى ٱلْكِتَـٰبَ فَٱخْتُلِفَ فِيهِ ۚ وَلَوْلَا كَلِمَةٌ سَبَقَتْ مِن رَّبِّكَ لَقُضِىَ بَيْنَهُمْ ۚ وَإِنَّهُمْ لَفِى شَكٍّ مِّنْهُ مُرِيبٍ
    arabicPlain: ولقد آتينا موسى الكتاب فاختلف فيه ۚ ولولا كلمة سبقت من ربك لقضي بينهم ۚ وإنهم لفي شك منه مريب
