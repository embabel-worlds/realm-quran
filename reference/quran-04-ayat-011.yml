    verse: 115
    ordinal: 1588
    text: And have patience, (O Muhammad), for lo! Allah loseth not the wages of the good.
    translation: Pickthall
    original: وَٱصْبِرْ فَإِنَّ ٱللَّهَ لَا يُضِيعُ أَجْرَ ٱلْمُحْسِنِينَ
