    scripture: quran
    name: Quran 11:26
    chapter: 11
    verse: 26
    ordinal: 1499
    text: That ye serve none, save Allah. Lo! I fear for you the retribution of a painful Day.
    translation: Pickthall
    original: أَن لَّا تَعْبُدُوٓا۟ إِلَّا ٱللَّهَ ۖ إِنِّىٓ أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٍ أَلِيمٍ
