  data:
    ref: '11:45'
    scripture: quran
    name: Quran 11:45
    chapter: 11
    verse: 45
    ordinal: 1518
    text: 'And Noah cried unto his Lord and said: My Lord! Lo! my son is of my household! Surely Thy promise is the truth and Thou are the Most Just of Judges.'
    translation: Pickthall
    original: وَنَادَىٰ نُوحٌ رَّبَّهُۥ فَقَالَ رَبِّ إِنَّ ٱبْنِى مِنْ أَهْلِى وَإِنَّ وَعْدَكَ ٱلْحَقُّ وَأَنتَ أَحْكَمُ ٱلْحَـٰكِمِينَ
    arabicPlain: ونادى نوح ربه فقال رب إن ابني من أهلي وإن وعدك الحق وأنت أحكم الحاكمين
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 186
    page: 226
  relations:
