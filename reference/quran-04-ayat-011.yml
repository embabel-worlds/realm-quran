  data:
    ref: 11:60
    scripture: quran
    name: Quran 11:60
    chapter: 11
    verse: 60
    ordinal: 1533
    text: And a curse was made to follow them in the world and on the Day of Resurrection. Lo! A'ad disbelieved in their Lord. A far removal for A'ad, the folk of Hud!
    translation: Pickthall
    original: وَأُتْبِعُوا۟ فِى هَـٰذِهِ ٱلدُّنْيَا لَعْنَةً وَيَوْمَ ٱلْقِيَـٰمَةِ ۗ أَلَآ إِنَّ عَادًا كَفَرُوا۟ رَبَّهُمْ ۗ أَلَا بُعْدًا لِّعَادٍ قَوْمِ هُودٍ
    arabicPlain: وأتبعوا في هذه الدنيا لعنة ويوم القيامة ۗ ألا إن عادا كفروا ربهم ۗ ألا بعدا لعاد قوم هود
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 187
