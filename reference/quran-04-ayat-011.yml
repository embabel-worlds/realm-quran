  data:
    ref: 11:62
    scripture: quran
    name: Quran 11:62
    chapter: 11
    verse: 62
    ordinal: 1535
    text: 'They said: O Salih! Thou hast been among us hitherto as that wherein our hope was placed. Dost thou ask us not to worship what our fathers worshipped? Lo! we verily are in grave doubt concerning that to which thou callest us.'
    translation: Pickthall
    original: قَالُوا۟ يَـٰصَـٰلِحُ قَدْ كُنتَ فِينَا مَرْجُوًّا قَبْلَ هَـٰذَآ ۖ أَتَنْهَىٰنَآ أَن نَّعْبُدَ مَا يَعْبُدُ ءَابَآؤُنَا وَإِنَّنَا لَفِى شَكٍّ مِّمَّا تَدْعُونَآ إِلَيْهِ مُرِيبٍ
    arabicPlain: قالوا يا صالح قد كنت فينا مرجوا قبل هذا ۖ أتنهانا أن نعبد ما يعبد آباؤنا وإننا لفي شك مما تدعونا إليه مريب
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 188
    page: 228
