  data:
    ref: '11:14'
    scripture: quran
    name: Quran 11:14
    chapter: 11
    verse: 14
    ordinal: 1487
    text: And if they answer not your prayer, then know that it is revealed only in the knowledge of Allah; and that there is no Allah save Him. Will ye then be (of) those who surrender?
    translation: Pickthall
    original: فَإِلَّمْ يَسْتَجِيبُوا۟ لَكُمْ فَٱعْلَمُوٓا۟ أَنَّمَآ أُنزِلَ بِعِلْمِ ٱللَّهِ وَأَن لَّآ إِلَـٰهَ إِلَّا هُوَ ۖ فَهَلْ أَنتُم مُّسْلِمُونَ
    arabicPlain: فإلم يستجيبوا لكم فاعلموا أنما أنزل بعلم الله وأن لا إله إلا هو ۖ فهل أنتم مسلمون
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 184
