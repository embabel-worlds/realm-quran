  data:
    ref: 11:63
    scripture: quran
    name: Quran 11:63
    chapter: 11
    verse: 63
    ordinal: 1536
    text: 'He said: O my people! Bethink you: if I am (acting) on clear proof from my Lord and there hath come unto me a mercy from Him, who will save me from Allah if I disobey Him? Ye would add to me naught save perdition.'
    translation: Pickthall
    original: قَالَ يَـٰقَوْمِ أَرَءَيْتُمْ إِن كُنتُ عَلَىٰ بَيِّنَةٍ مِّن رَّبِّى وَءَاتَىٰنِى مِنْهُ رَحْمَةً فَمَن يَنصُرُنِى مِنَ ٱللَّهِ إِنْ عَصَيْتُهُۥ ۖ فَمَا تَزِيدُونَنِى غَيْرَ تَخْسِيرٍ
    arabicPlain: قال يا قوم أرأيتم إن كنت على بينة من ربي وآتاني منه رحمة فمن ينصرني من الله إن عصيته ۖ فما تزيدونني غير تخسير
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 188
    page: 229
