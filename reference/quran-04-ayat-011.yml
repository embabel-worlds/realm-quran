    name: Quran 11:54
    chapter: 11
    verse: 54
    ordinal: 1527
    text: 'We say naught save that one of our gods hath possessed thee in an evil way. He said: I call Allah to witness, and do ye (too) bear witness, that I am innocent of (all) that ye ascribe as partners (to Allah)'
    translation: Pickthall
    original: إِن نَّقُولُ إِلَّا ٱعْتَرَىٰكَ بَعْضُ ءَالِهَتِنَا بِسُوٓءٍ ۗ قَالَ إِنِّىٓ أُشْهِدُ ٱللَّهَ وَٱشْهَدُوٓا۟ أَنِّى بَرِىٓءٌ مِّمَّا تُشْرِكُونَ
    arabicPlain: إن نقول إلا اعتراك بعض آلهتنا بسوء ۗ قال إني أشهد الله واشهدوا أني بريء مما تشركون
