  data:
    ref: '11:41'
    scripture: quran
    name: Quran 11:41
    chapter: 11
    verse: 41
    ordinal: 1514
    text: 'And he said: Embark therein! In the name of Allah be its course and its mooring. Lo! my Lord is Forgiving, Merciful.'
    translation: Pickthall
    original: ۞ وَقَالَ ٱرْكَبُوا۟ فِيهَا بِسْمِ ٱللَّهِ مَجْر۪ىٰهَا وَمُرْسَىٰهَآ ۚ إِنَّ رَبِّى لَغَفُورٌ رَّحِيمٌ
    arabicPlain: ۞ وقال اركبوا فيها بسم الله مجراها ومرساها ۚ إن ربي لغفور رحيم
    surahName: Hud
