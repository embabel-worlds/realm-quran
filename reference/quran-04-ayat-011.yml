    name: Quran 11:106
    chapter: 11
    verse: 106
    ordinal: 1579
    text: As for those who will be wretched (on that day) they will be in the Fire; sighing and wailing will be their portion therein,
    translation: Pickthall
    original: فَأَمَّا ٱلَّذِينَ شَقُوا۟ فَفِى ٱلنَّارِ لَهُمْ فِيهَا زَفِيرٌ وَشَهِيقٌ
