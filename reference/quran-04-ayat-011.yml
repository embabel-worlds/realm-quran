  data:
    ref: '11:44'
    scripture: quran
    name: Quran 11:44
    chapter: 11
    verse: 44
    ordinal: 1517
    text: 'And it was said: O earth! Swallow thy water and, O sky! be cleared of clouds! And the water was made to subside. And the commandment was fulfilled. And it (the ship) came to rest upon (the mount) Al-Judi and it was said: A far removal for wrongdoing folk!'
    translation: Pickthall
    original: وَقِيلَ يَـٰٓأَرْضُ ٱبْلَعِى مَآءَكِ وَيَـٰسَمَآءُ أَقْلِعِى وَغِيضَ ٱلْمَآءُ وَقُضِىَ ٱلْأَمْرُ وَٱسْتَوَتْ عَلَى ٱلْجُودِىِّ ۖ وَقِيلَ بُعْدًا لِّلْقَوْمِ ٱلظَّـٰلِمِينَ
    arabicPlain: وقيل يا أرض ابلعي ماءك ويا سماء أقلعي وغيض الماء وقضي الأمر واستوت على الجودي ۖ وقيل بعدا للقوم الظالمين
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 186
