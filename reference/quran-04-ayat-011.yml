  data:
    ref: '11:5'
    scripture: quran
    name: Quran 11:5
    chapter: 11
    verse: 5
    ordinal: 1478
    text: Lo! now they fold up their breasts that they may hide (their thoughts) from Him. At the very moment when they cover themselves with their clothing, Allah knoweth that which they keep hidden and that which they proclaim. Lo! He is Aware of what is in the breasts (of men).
    translation: Pickthall
    original: أَلَآ إِنَّهُمْ يَثْنُونَ صُدُورَهُمْ لِيَسْتَخْفُوا۟ مِنْهُ ۚ أَلَا حِينَ يَسْتَغْشُونَ ثِيَابَهُمْ يَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَ ۚ إِنَّهُۥ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ
    arabicPlain: ألا إنهم يثنون صدورهم ليستخفوا منه ۚ ألا حين يستغشون ثيابهم يعلم ما يسرون وما يعلنون ۚ إنه عليم بذات الصدور
    surahName: Hud
    juz: 11
    manzil: 3
    ruku: 183
