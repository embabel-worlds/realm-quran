  data:
    ref: 11:81
    scripture: quran
    name: Quran 11:81
    chapter: 11
    verse: 81
    ordinal: 1554
    text: '(The messengers) said: O Lot! Lo! we are messengers of thy Lord; they shall not reach thee. So travel with thy people in a part of the night, and let not one of you turn round - (all) save thy wife. Lo! that which smiteth them will smite her (also). Lo! their tryst is (for) the morning. Is not the morning nigh?'
    translation: Pickthall
    original: قَالُوا۟ يَـٰلُوطُ إِنَّا رُسُلُ رَبِّكَ لَن يَصِلُوٓا۟ إِلَيْكَ ۖ فَأَسْرِ بِأَهْلِكَ بِقِطْعٍ مِّنَ ٱلَّيْلِ وَلَا يَلْتَفِتْ مِنكُمْ أَحَدٌ إِلَّا ٱمْرَأَتَكَ ۖ إِنَّهُۥ مُصِيبُهَا مَآ أَصَابَهُمْ ۚ إِنَّ مَوْعِدَهُمُ ٱلصُّبْحُ ۚ أَلَيْسَ ٱلصُّبْحُ بِقَرِيبٍ
    arabicPlain: قالوا يا لوط إنا رسل ربك لن يصلوا إليك ۖ فأسر بأهلك بقطع من الليل ولا يلتفت منكم أحد إلا امرأتك ۖ إنه مصيبها ما أصابهم ۚ إن موعدهم الصبح ۚ أليس الصبح بقريب
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 189
