    name: Quran 11:105
    chapter: 11
    verse: 105
    ordinal: 1578
    text: On the day when it cometh no soul will speak except by His permission; some among them will be wretched, (others) glad.
    translation: Pickthall
    original: يَوْمَ يَأْتِ لَا تَكَلَّمُ نَفْسٌ إِلَّا بِإِذْنِهِۦ ۚ فَمِنْهُمْ شَقِىٌّ وَسَعِيدٌ
