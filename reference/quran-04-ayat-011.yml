  data:
    ref: '11:10'
    scripture: quran
    name: Quran 11:10
    chapter: 11
    verse: 10
    ordinal: 1483
    text: 'And if We cause him to taste grace after some misfortune that had befallen him, he saith: The ills have gone from me. Lo! he is exultant, boastful;'
    translation: Pickthall
    original: وَلَئِنْ أَذَقْنَـٰهُ نَعْمَآءَ بَعْدَ ضَرَّآءَ مَسَّتْهُ لَيَقُولَنَّ ذَهَبَ ٱلسَّيِّـَٔاتُ عَنِّىٓ ۚ إِنَّهُۥ لَفَرِحٌ فَخُورٌ
    arabicPlain: ولئن أذقناه نعماء بعد ضراء مسته ليقولن ذهب السيئات عني ۚ إنه لفرح فخور
    surahName: Hud
