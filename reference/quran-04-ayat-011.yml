    chapter: 11
    verse: 117
    ordinal: 1590
    text: In truth thy Lord destroyed not the townships tyrannously while their folk were doing right.
    translation: Pickthall
    original: وَمَا كَانَ رَبُّكَ لِيُهْلِكَ ٱلْقُرَىٰ بِظُلْمٍ وَأَهْلُهَا مُصْلِحُونَ
