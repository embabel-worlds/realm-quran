    original: خَـٰلِدِينَ فِيهَا مَا دَامَتِ ٱلسَّمَـٰوَٰتُ وَٱلْأَرْضُ إِلَّا مَا شَآءَ رَبُّكَ ۚ إِنَّ رَبَّكَ فَعَّالٌ لِّمَا يُرِيدُ
    arabicPlain: خالدين فيها ما دامت السماوات والأرض إلا ما شاء ربك ۚ إن ربك فعال لما يريد
