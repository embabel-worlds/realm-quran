    chapter: 11
    verse: 92
    ordinal: 1565
    text: 'He said: O my people! Is my family more to be honoured by you than Allah? and ye put Him behind you, neglected! Lo! my Lord surroundeth what ye do.'
    translation: Pickthall
    original: قَالَ يَـٰقَوْمِ أَرَهْطِىٓ أَعَزُّ عَلَيْكُم مِّنَ ٱللَّهِ وَٱتَّخَذْتُمُوهُ وَرَآءَكُمْ ظِهْرِيًّا ۖ إِنَّ رَبِّى بِمَا تَعْمَلُونَ مُحِيطٌ
    arabicPlain: قال يا قوم أرهطي أعز عليكم من الله واتخذتموه وراءكم ظهريا ۖ إن ربي بما تعملون محيط
