  data:
    ref: 11:112
    scripture: quran
    name: Quran 11:112
    chapter: 11
    verse: 112
    ordinal: 1585
    text: So tread thou the straight path as thou art commanded, and those who turn (unto Allah) with thee, and transgress not. Lo! He is Seer of what ye do.
    translation: Pickthall
    original: فَٱسْتَقِمْ كَمَآ أُمِرْتَ وَمَن تَابَ مَعَكَ وَلَا تَطْغَوْا۟ ۚ إِنَّهُۥ بِمَا تَعْمَلُونَ بَصِيرٌ
    arabicPlain: فاستقم كما أمرت ومن تاب معك ولا تطغوا ۚ إنه بما تعملون بصير
