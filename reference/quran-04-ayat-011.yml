- type: Ayah
  data:
    ref: '11:49'
    scripture: quran
    name: Quran 11:49
    chapter: 11
    verse: 49
    ordinal: 1522
    text: This is of the tidings of the Unseen which We inspire in thee (Muhammad). Thou thyself knewest it not, nor did thy folk (know it) before this. Then have patience. Lo! the sequel is for those who ward off (evil).
    translation: Pickthall
    original: تِلْكَ مِنْ أَنۢبَآءِ ٱلْغَيْبِ نُوحِيهَآ إِلَيْكَ ۖ مَا كُنتَ تَعْلَمُهَآ أَنتَ وَلَا قَوْمُكَ مِن قَبْلِ هَـٰذَا ۖ فَٱصْبِرْ ۖ إِنَّ ٱلْعَـٰقِبَةَ لِلْمُتَّقِينَ
    arabicPlain: تلك من أنباء الغيب نوحيها إليك ۖ ما كنت تعلمها أنت ولا قومك من قبل هذا ۖ فاصبر ۖ إن العاقبة للمتقين
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 186
    page: 227
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '11'
  - predicate: IN_PORTION
    to:
