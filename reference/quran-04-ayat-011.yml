    scripture: quran
    name: Quran 11:86
    chapter: 11
    verse: 86
    ordinal: 1559
    text: That which Allah leaveth with you is better for you if ye are believers; and I am not a keeper over you.
    translation: Pickthall
    original: بَقِيَّتُ ٱللَّهِ خَيْرٌ لَّكُمْ إِن كُنتُم مُّؤْمِنِينَ ۚ وَمَآ أَنَا۠ عَلَيْكُم بِحَفِيظٍ
    arabicPlain: بقيت الله خير لكم إن كنتم مؤمنين ۚ وما أنا عليكم بحفيظ
