    original: قَالُوٓا۟ أَتَعْجَبِينَ مِنْ أَمْرِ ٱللَّهِ ۖ رَحْمَتُ ٱللَّهِ وَبَرَكَـٰتُهُۥ عَلَيْكُمْ أَهْلَ ٱلْبَيْتِ ۚ إِنَّهُۥ حَمِيدٌ مَّجِيدٌ
    arabicPlain: قالوا أتعجبين من أمر الله ۖ رحمت الله وبركاته عليكم أهل البيت ۚ إنه حميد مجيد
