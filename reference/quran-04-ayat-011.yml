  data:
    ref: '11:29'
    scripture: quran
    name: Quran 11:29
    chapter: 11
    verse: 29
    ordinal: 1502
    text: And O my people! I ask of you no wealth therefor. My reward is the concern only of Allah, and I am not going to thrust away those who believe - Lo! they have to meet their Lord! - but I see you a folk that are ignorant.
    translation: Pickthall
    original: وَيَـٰقَوْمِ لَآ أَسْـَٔلُكُمْ عَلَيْهِ مَالًا ۖ إِنْ أَجْرِىَ إِلَّا عَلَى ٱللَّهِ ۚ وَمَآ أَنَا۠ بِطَارِدِ ٱلَّذِينَ ءَامَنُوٓا۟ ۚ إِنَّهُم مُّلَـٰقُوا۟ رَبِّهِمْ وَلَـٰكِنِّىٓ أَرَىٰكُمْ قَوْمًا تَجْهَلُونَ
    arabicPlain: ويا قوم لا أسألكم عليه مالا ۖ إن أجري إلا على الله ۚ وما أنا بطارد الذين آمنوا ۚ إنهم ملاقو ربهم ولكني أراكم قوما تجهلون
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 185
    page: 225
