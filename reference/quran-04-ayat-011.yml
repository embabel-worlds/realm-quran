    scripture: quran
    name: Quran 11:109
    chapter: 11
    verse: 109
    ordinal: 1582
    text: So be not thou in doubt concerning that which these (folk) worship. They worship only as their fathers worshipped aforetime. Lo! we shall pay them their whole due unabated.
    translation: Pickthall
    original: فَلَا تَكُ فِى مِرْيَةٍ مِّمَّا يَعْبُدُ هَـٰٓؤُلَآءِ ۚ مَا يَعْبُدُونَ إِلَّا كَمَا يَعْبُدُ ءَابَآؤُهُم مِّن قَبْلُ ۚ وَإِنَّا لَمُوَفُّوهُمْ نَصِيبَهُمْ غَيْرَ مَنقُوصٍ
    arabicPlain: فلا تك في مرية مما يعبد هؤلاء ۚ ما يعبدون إلا كما يعبد آباؤهم من قبل ۚ وإنا لموفوهم نصيبهم غير منقوص
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 191
