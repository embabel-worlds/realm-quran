  data:
    ref: '11:48'
    scripture: quran
    name: Quran 11:48
    chapter: 11
    verse: 48
    ordinal: 1521
    text: 'It was said (unto him): O Noah! Go thou down (from the mountain) with peace from Us and blessings upon thee and some nations (that will spring) from those with thee. (There will be other) nations unto whom We shall give enjoyment a long while and then a painful doom from Us will overtake them.'
    translation: Pickthall
    original: قِيلَ يَـٰنُوحُ ٱهْبِطْ بِسَلَـٰمٍ مِّنَّا وَبَرَكَـٰتٍ عَلَيْكَ وَعَلَىٰٓ أُمَمٍ مِّمَّن مَّعَكَ ۚ وَأُمَمٌ سَنُمَتِّعُهُمْ ثُمَّ يَمَسُّهُم مِّنَّا عَذَابٌ أَلِيمٌ
    arabicPlain: قيل يا نوح اهبط بسلام منا وبركات عليك وعلى أمم ممن معك ۚ وأمم سنمتعهم ثم يمسهم منا عذاب أليم
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 186
    page: 227
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '11'
  - predicate: IN_PORTION
    to:
