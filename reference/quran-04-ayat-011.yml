    scripture: quran
    name: Quran 11:30
    chapter: 11
    verse: 30
    ordinal: 1503
    text: And, O my people! who would deliver me from Allah if I thrust them away? Will ye not then reflect?
    translation: Pickthall
    original: وَيَـٰقَوْمِ مَن يَنصُرُنِى مِنَ ٱللَّهِ إِن طَرَدتُّهُمْ ۚ أَفَلَا تَذَكَّرُونَ
    arabicPlain: ويا قوم من ينصرني من الله إن طردتهم ۚ أفلا تذكرون
    surahName: Hud
    juz: 12
    manzil: 3
