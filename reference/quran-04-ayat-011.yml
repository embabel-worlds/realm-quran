    ref: '11:33'
    scripture: quran
    name: Quran 11:33
    chapter: 11
    verse: 33
    ordinal: 1506
    text: 'He said: Only Allah will bring it upon you if He will, and ye can by no means escape.'
    translation: Pickthall
    original: قَالَ إِنَّمَا يَأْتِيكُم بِهِ ٱللَّهُ إِن شَآءَ وَمَآ أَنتُم بِمُعْجِزِينَ
    arabicPlain: قال إنما يأتيكم به الله إن شاء وما أنتم بمعجزين
