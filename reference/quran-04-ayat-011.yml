    name: Quran 11:37
    chapter: 11
    verse: 37
    ordinal: 1510
    text: Build the ship under Our eyes and by Our inspiration, and speak not unto Me on behalf of those who do wrong. Lo! they will be drowned.
    translation: Pickthall
    original: وَٱصْنَعِ ٱلْفُلْكَ بِأَعْيُنِنَا وَوَحْيِنَا وَلَا تُخَـٰطِبْنِى فِى ٱلَّذِينَ ظَلَمُوٓا۟ ۚ إِنَّهُم مُّغْرَقُونَ
    arabicPlain: واصنع الفلك بأعيننا ووحينا ولا تخاطبني في الذين ظلموا ۚ إنهم مغرقون
    surahName: Hud
