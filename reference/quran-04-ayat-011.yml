  data:
    ref: '11:11'
    scripture: quran
    name: Quran 11:11
    chapter: 11
    verse: 11
    ordinal: 1484
    text: Save those who persevere and do good works. Theirs will be forgiveness and a great reward.
    translation: Pickthall
    original: إِلَّا ٱلَّذِينَ صَبَرُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ أُو۟لَـٰٓئِكَ لَهُم مَّغْفِرَةٌ وَأَجْرٌ كَبِيرٌ
    arabicPlain: إلا الذين صبروا وعملوا الصالحات أولئك لهم مغفرة وأجر كبير
    surahName: Hud
