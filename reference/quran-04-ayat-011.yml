  data:
    ref: 11:65
    scripture: quran
    name: Quran 11:65
    chapter: 11
    verse: 65
    ordinal: 1538
    text: 'But they hamstrung her, and then he said: Enjoy life in your dwelling-place three days! This is a threat that will not be belied.'
    translation: Pickthall
    original: فَعَقَرُوهَا فَقَالَ تَمَتَّعُوا۟ فِى دَارِكُمْ ثَلَـٰثَةَ أَيَّامٍ ۖ ذَٰلِكَ وَعْدٌ غَيْرُ مَكْذُوبٍ
    arabicPlain: فعقروها فقال تمتعوا في داركم ثلاثة أيام ۖ ذلك وعد غير مكذوب
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 188
