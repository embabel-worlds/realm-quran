    scripture: quran
    name: Quran 11:78
    chapter: 11
    verse: 78
    ordinal: 1551
    text: 'And his people came unto him, running towards him - and before then they used to commit abominations - He said: O my people! Here are my daughters! They are purer for you. Beware of Allah, and degrade me not in (the person of) my guests. Is there not among you any upright man?'
    translation: Pickthall
    original: وَجَآءَهُۥ قَوْمُهُۥ يُهْرَعُونَ إِلَيْهِ وَمِن قَبْلُ كَانُوا۟ يَعْمَلُونَ ٱلسَّيِّـَٔاتِ ۚ قَالَ يَـٰقَوْمِ هَـٰٓؤُلَآءِ بَنَاتِى هُنَّ أَطْهَرُ لَكُمْ ۖ فَٱتَّقُوا۟ ٱللَّهَ وَلَا تُخْزُونِ فِى ضَيْفِىٓ ۖ أَلَيْسَ مِنكُمْ رَجُلٌ رَّشِيدٌ
    arabicPlain: وجاءه قومه يهرعون إليه ومن قبل كانوا يعملون السيئات ۚ قال يا قوم هؤلاء بناتي هن أطهر لكم ۖ فاتقوا الله ولا تخزون في ضيفي ۖ أليس منكم رجل رشيد
    surahName: Hud
