  data:
    ref: '11:18'
    scripture: quran
    name: Quran 11:18
    chapter: 11
    verse: 18
    ordinal: 1491
    text: 'Who doeth greater wrong than he who inventeth a lie concerning Allah? Such will be brought before their Lord, and the witnesses will say: These are they who lied concerning their Lord. Now the curse of Allah is upon wrong-doers,'
    translation: Pickthall
    original: وَمَنْ أَظْلَمُ مِمَّنِ ٱفْتَرَىٰ عَلَى ٱللَّهِ كَذِبًا ۚ أُو۟لَـٰٓئِكَ يُعْرَضُونَ عَلَىٰ رَبِّهِمْ وَيَقُولُ ٱلْأَشْهَـٰدُ هَـٰٓؤُلَآءِ ٱلَّذِينَ كَذَبُوا۟ عَلَىٰ رَبِّهِمْ ۚ أَلَا لَعْنَةُ ٱللَّهِ عَلَى ٱلظَّـٰلِمِينَ
    arabicPlain: ومن أظلم ممن افترى على الله كذبا ۚ أولئك يعرضون على ربهم ويقول الأشهاد هؤلاء الذين كذبوا على ربهم ۚ ألا لعنة الله على الظالمين
