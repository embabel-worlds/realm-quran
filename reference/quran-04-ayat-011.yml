    scripture: quran
    name: Quran 11:39
    chapter: 11
    verse: 39
    ordinal: 1512
    text: And ye shall know to whom a punishment that will confound him cometh, and upon whom a lasting doom will fall.
    translation: Pickthall
    original: فَسَوْفَ تَعْلَمُونَ مَن يَأْتِيهِ عَذَابٌ يُخْزِيهِ وَيَحِلُّ عَلَيْهِ عَذَابٌ مُّقِيمٌ
    arabicPlain: فسوف تعلمون من يأتيه عذاب يخزيه ويحل عليه عذاب مقيم
