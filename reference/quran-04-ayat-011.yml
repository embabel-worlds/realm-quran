  data:
    ref: '11:32'
    scripture: quran
    name: Quran 11:32
    chapter: 11
    verse: 32
    ordinal: 1505
    text: 'They said: O Noah! Thou hast disputed with us and multiplied disputation with us; now bring upon us that wherewith thou threatenest us, if thou art of the truthful.'
    translation: Pickthall
    original: قَالُوا۟ يَـٰنُوحُ قَدْ جَـٰدَلْتَنَا فَأَكْثَرْتَ جِدَٰلَنَا فَأْتِنَا بِمَا تَعِدُنَآ إِن كُنتَ مِنَ ٱلصَّـٰدِقِينَ
    arabicPlain: قالوا يا نوح قد جادلتنا فأكثرت جدالنا فأتنا بما تعدنا إن كنت من الصادقين
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 185
