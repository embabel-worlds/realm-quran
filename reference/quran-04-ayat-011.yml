    name: Quran 11:91
    chapter: 11
    verse: 91
    ordinal: 1564
    text: 'They said: O Shu''eyb! We understand not much of that thou tellest, and lo! we do behold thee weak among us. But for thy family, we should have stoned thee, for thou art not strong against us.'
    translation: Pickthall
    original: قَالُوا۟ يَـٰشُعَيْبُ مَا نَفْقَهُ كَثِيرًا مِّمَّا تَقُولُ وَإِنَّا لَنَرَىٰكَ فِينَا ضَعِيفًا ۖ وَلَوْلَا رَهْطُكَ لَرَجَمْنَـٰكَ ۖ وَمَآ أَنتَ عَلَيْنَا بِعَزِيزٍ
    arabicPlain: قالوا يا شعيب ما نفقه كثيرا مما تقول وإنا لنراك فينا ضعيفا ۖ ولولا رهطك لرجمناك ۖ وما أنت علينا بعزيز
