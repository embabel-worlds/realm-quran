    translation: Pickthall
    original: وَكَذَٰلِكَ أَخْذُ رَبِّكَ إِذَآ أَخَذَ ٱلْقُرَىٰ وَهِىَ ظَـٰلِمَةٌ ۚ إِنَّ أَخْذَهُۥٓ أَلِيمٌ شَدِيدٌ
    arabicPlain: وكذلك أخذ ربك إذا أخذ القرى وهي ظالمة ۚ إن أخذه أليم شديد
