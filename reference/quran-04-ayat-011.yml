    name: Quran 11:23
    chapter: 11
    verse: 23
    ordinal: 1496
    text: 'Lo! those who believe and do good works and humble themselves before their Lord: such are rightful owners of the Garden; they will abide therein.'
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ وَأَخْبَتُوٓا۟ إِلَىٰ رَبِّهِمْ أُو۟لَـٰٓئِكَ أَصْحَـٰبُ ٱلْجَنَّةِ ۖ هُمْ فِيهَا خَـٰلِدُونَ
    arabicPlain: إن الذين آمنوا وعملوا الصالحات وأخبتوا إلى ربهم أولئك أصحاب الجنة ۖ هم فيها خالدون
