  data:
    ref: '11:13'
    scripture: quran
    name: Quran 11:13
    chapter: 11
    verse: 13
    ordinal: 1486
    text: 'Or they say: He hath invented it. Say: Then bring ten surahs, the like thereof, invented, and call on everyone ye can beside Allah, if ye are truthful!'
    translation: Pickthall
    original: أَمْ يَقُولُونَ ٱفْتَرَىٰهُ ۖ قُلْ فَأْتُوا۟ بِعَشْرِ سُوَرٍ مِّثْلِهِۦ مُفْتَرَيَـٰتٍ وَٱدْعُوا۟ مَنِ ٱسْتَطَعْتُم مِّن دُونِ ٱللَّهِ إِن كُنتُمْ صَـٰدِقِينَ
    arabicPlain: أم يقولون افتراه ۖ قل فأتوا بعشر سور مثله مفتريات وادعوا من استطعتم من دون الله إن كنتم صادقين
    surahName: Hud
    juz: 12
    manzil: 3
    ruku: 184
