    scripture: quran
    name: Quran 11:67
    chapter: 11
    verse: 67
    ordinal: 1540
    text: And the (awful) Cry overtook those who did wrong, so that morning found them prostrate in their dwellings,
    translation: Pickthall
    original: وَأَخَذَ ٱلَّذِينَ ظَلَمُوا۟ ٱلصَّيْحَةُ فَأَصْبَحُوا۟ فِى دِيَـٰرِهِمْ جَـٰثِمِينَ
    arabicPlain: وأخذ الذين ظلموا الصيحة فأصبحوا في ديارهم جاثمين
