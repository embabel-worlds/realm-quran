    name: Quran 11:80
    chapter: 11
    verse: 80
    ordinal: 1553
    text: 'He said: Would that I had strength to resist you or had some strong support (among you)!'
    translation: Pickthall
    original: قَالَ لَوْ أَنَّ لِى بِكُمْ قُوَّةً أَوْ ءَاوِىٓ إِلَىٰ رُكْنٍ شَدِيدٍ
    arabicPlain: قال لو أن لي بكم قوة أو آوي إلى ركن شديد
