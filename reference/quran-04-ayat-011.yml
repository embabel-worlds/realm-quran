  data:
    ref: '11:16'
    scripture: quran
    name: Quran 11:16
    chapter: 11
    verse: 16
    ordinal: 1489
    text: Those are they for whom is naught in the Hereafter save the Fire. (All) that they contrive here is vain and (all) that they are wont to do is fruitless.
    translation: Pickthall
    original: أُو۟لَـٰٓئِكَ ٱلَّذِينَ لَيْسَ لَهُمْ فِى ٱلْـَٔاخِرَةِ إِلَّا ٱلنَّارُ ۖ وَحَبِطَ مَا صَنَعُوا۟ فِيهَا وَبَـٰطِلٌ مَّا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: أولئك الذين ليس لهم في الآخرة إلا النار ۖ وحبط ما صنعوا فيها وباطل ما كانوا يعملون
    surahName: Hud
    juz: 12
    manzil: 3
