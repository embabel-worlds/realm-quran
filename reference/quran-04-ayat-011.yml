  data:
    ref: '11:15'
    scripture: quran
    name: Quran 11:15
    chapter: 11
    verse: 15
    ordinal: 1488
    text: Whoso desireth the life of the world and its pomp, We shall repay them their deeds herein, and therein they will not be wronged.
    translation: Pickthall
    original: مَن كَانَ يُرِيدُ ٱلْحَيَوٰةَ ٱلدُّنْيَا وَزِينَتَهَا نُوَفِّ إِلَيْهِمْ أَعْمَـٰلَهُمْ فِيهَا وَهُمْ فِيهَا لَا يُبْخَسُونَ
    arabicPlain: من كان يريد الحياة الدنيا وزينتها نوف إليهم أعمالهم فيها وهم فيها لا يبخسون
    surahName: Hud
    juz: 12
