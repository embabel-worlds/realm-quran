    scripture: quran
    name: Quran 27:57
    chapter: 27
    verse: 57
    ordinal: 3216
    text: Then We saved him and his household save his wife; We destined her to be of those who stayed behind.
    translation: Pickthall
    original: فَأَنجَيْنَـٰهُ وَأَهْلَهُۥٓ إِلَّا ٱمْرَأَتَهُۥ قَدَّرْنَـٰهَا مِنَ ٱلْغَـٰبِرِينَ
    arabicPlain: فأنجيناه وأهله إلا امرأته قدرناها من الغابرين
