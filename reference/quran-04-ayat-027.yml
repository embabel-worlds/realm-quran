  data:
    ref: '27:17'
    scripture: quran
    name: Quran 27:17
    chapter: 27
    verse: 17
    ordinal: 3176
    text: And there were gathered together unto Solomon his armies of the jinn and humankind, and of the birds, and they were set in battle order;
    translation: Pickthall
    original: وَحُشِرَ لِسُلَيْمَـٰنَ جُنُودُهُۥ مِنَ ٱلْجِنِّ وَٱلْإِنسِ وَٱلطَّيْرِ فَهُمْ يُوزَعُونَ
    arabicPlain: وحشر لسليمان جنوده من الجن والإنس والطير فهم يوزعون
    surahName: An-Naml
    juz: 19
    manzil: 5
    ruku: 328
