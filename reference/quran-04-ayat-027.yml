  data:
    ref: 27:84
    scripture: quran
    name: Quran 27:84
    chapter: 27
    verse: 84
    ordinal: 3243
    text: 'Till, when they come (before their Lord), He will say: Did ye deny My revelations when ye could not compass them in knowledge, or what was it that ye did?'
    translation: Pickthall
    original: حَتَّىٰٓ إِذَا جَآءُو قَالَ أَكَذَّبْتُم بِـَٔايَـٰتِى وَلَمْ تُحِيطُوا۟ بِهَا عِلْمًا أَمَّاذَا كُنتُمْ تَعْمَلُونَ
