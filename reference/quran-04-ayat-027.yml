    scripture: quran
    name: Quran 27:81
    chapter: 27
    verse: 81
    ordinal: 3240
    text: Nor canst thou lead the blind out of their error. Thou canst make none to hear, save those who believe Our revelations and who have surrendered.
    translation: Pickthall
    original: وَمَآ أَنتَ بِهَـٰدِى ٱلْعُمْىِ عَن ضَلَـٰلَتِهِمْ ۖ إِن تُسْمِعُ إِلَّا مَن يُؤْمِنُ بِـَٔايَـٰتِنَا فَهُم مُّسْلِمُونَ
    arabicPlain: وما أنت بهادي العمي عن ضلالتهم ۖ إن تسمع إلا من يؤمن بآياتنا فهم مسلمون
    surahName: An-Naml
    juz: 20
