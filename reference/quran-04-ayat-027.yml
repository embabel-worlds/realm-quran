- type: Ayah
  data:
    ref: '27:16'
    scripture: quran
    name: Quran 27:16
    chapter: 27
    verse: 16
    ordinal: 3175
    text: 'And Solomon was David''s heir. And he said: O mankind! Lo! we have been taught the language of birds, and have been given (abundance) of all things. This surely is evident favour.'
    translation: Pickthall
    original: وَوَرِثَ سُلَيْمَـٰنُ دَاوُۥدَ ۖ وَقَالَ يَـٰٓأَيُّهَا ٱلنَّاسُ عُلِّمْنَا مَنطِقَ ٱلطَّيْرِ وَأُوتِينَا مِن كُلِّ شَىْءٍ ۖ إِنَّ هَـٰذَا لَهُوَ ٱلْفَضْلُ ٱلْمُبِينُ
    arabicPlain: وورث سليمان داوود ۖ وقال يا أيها الناس علمنا منطق الطير وأوتينا من كل شيء ۖ إن هذا لهو الفضل المبين
    surahName: An-Naml
    juz: 19
    manzil: 5
    ruku: 328
    page: 378
  relations:
