  data:
    ref: '27:7'
    scripture: quran
    name: Quran 27:7
    chapter: 27
    verse: 7
    ordinal: 3166
    text: '(Remember) when Moses said unto his household: Lo! I spy afar off a fire; I will bring you tidings thence, or bring to you a borrowed flame that ye may warm yourselves.'
    translation: Pickthall
    original: إِذْ قَالَ مُوسَىٰ لِأَهْلِهِۦٓ إِنِّىٓ ءَانَسْتُ نَارًا سَـَٔاتِيكُم مِّنْهَا بِخَبَرٍ أَوْ ءَاتِيكُم بِشِهَابٍ قَبَسٍ لَّعَلَّكُمْ تَصْطَلُونَ
    arabicPlain: إذ قال موسى لأهله إني آنست نارا سآتيكم منها بخبر أو آتيكم بشهاب قبس لعلكم تصطلون
    surahName: An-Naml
    juz: 19
    manzil: 5
    ruku: 327
