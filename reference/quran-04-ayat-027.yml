  data:
    ref: 27:91
    scripture: quran
    name: Quran 27:91
    chapter: 27
    verse: 91
    ordinal: 3250
    text: '(Say): I (Muhammad) am commanded only to serve the Lord of this land which He hath hallowed, and unto Whom all things belong. And I am commanded to be of those who surrender (unto Him),'
    translation: Pickthall
    original: إِنَّمَآ أُمِرْتُ أَنْ أَعْبُدَ رَبَّ هَـٰذِهِ ٱلْبَلْدَةِ ٱلَّذِى حَرَّمَهَا وَلَهُۥ كُلُّ شَىْءٍ ۖ وَأُمِرْتُ أَنْ أَكُونَ مِنَ ٱلْمُسْلِمِينَ
    arabicPlain: إنما أمرت أن أعبد رب هذه البلدة الذي حرمها وله كل شيء ۖ وأمرت أن أكون من المسلمين
    surahName: An-Naml
    juz: 20
    manzil: 5
    ruku: 333
