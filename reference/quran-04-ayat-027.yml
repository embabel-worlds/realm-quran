  data:
    ref: '27:14'
    scripture: quran
    name: Quran 27:14
    chapter: 27
    verse: 14
    ordinal: 3173
    text: And they denied them, though their souls acknowledged them, for spite and arrogance. Then see the nature of the consequence for the wrong-doers!
    translation: Pickthall
    original: وَجَحَدُوا۟ بِهَا وَٱسْتَيْقَنَتْهَآ أَنفُسُهُمْ ظُلْمًا وَعُلُوًّا ۚ فَٱنظُرْ كَيْفَ كَانَ عَـٰقِبَةُ ٱلْمُفْسِدِينَ
    arabicPlain: وجحدوا بها واستيقنتها أنفسهم ظلما وعلوا ۚ فانظر كيف كان عاقبة المفسدين
    surahName: An-Naml
    juz: 19
