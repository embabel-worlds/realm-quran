    scripture: quran
    name: Quran 27:38
    chapter: 27
    verse: 38
    ordinal: 3197
    text: 'He said: O chiefs! Which of you will bring me her throne before they come unto me, surrendering?'
    translation: Pickthall
    original: قَالَ يَـٰٓأَيُّهَا ٱلْمَلَؤُا۟ أَيُّكُمْ يَأْتِينِى بِعَرْشِهَا قَبْلَ أَن يَأْتُونِى مُسْلِمِينَ
    arabicPlain: قال يا أيها الملأ أيكم يأتيني بعرشها قبل أن يأتوني مسلمين
    surahName: An-Naml
    juz: 19
    manzil: 5
