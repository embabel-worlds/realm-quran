  data:
    ref: 27:92
    scripture: quran
    name: Quran 27:92
    chapter: 27
    verse: 92
    ordinal: 3251
    text: 'And to recite the Qur''an. And whoso goeth right, goeth right only for (the good of) his own soul; and as for him who goeth astray - (Unto him) say: Lo! I am only a warner.'
    translation: Pickthall
    original: وَأَنْ أَتْلُوَا۟ ٱلْقُرْءَانَ ۖ فَمَنِ ٱهْتَدَىٰ فَإِنَّمَا يَهْتَدِى لِنَفْسِهِۦ ۖ وَمَن ضَلَّ فَقُلْ إِنَّمَآ أَنَا۠ مِنَ ٱلْمُنذِرِينَ
    arabicPlain: وأن أتلو القرآن ۖ فمن اهتدى فإنما يهتدي لنفسه ۖ ومن ضل فقل إنما أنا من المنذرين
    surahName: An-Naml
    juz: 20
