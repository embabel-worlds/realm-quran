    verse: 50
    ordinal: 3209
    text: 'So they plotted a plot: and We plotted a plot, while they perceived not.'
    translation: Pickthall
    original: وَمَكَرُوا۟ مَكْرًا وَمَكَرْنَا مَكْرًا وَهُمْ لَا يَشْعُرُونَ
