  data:
    ref: 27:93
    scripture: quran
    name: Quran 27:93
    chapter: 27
    verse: 93
    ordinal: 3252
    text: 'And say: Praise be to Allah Who will show you His portents so that ye shall know them. And thy Lord is not unaware of what ye (mortals) do.'
    translation: Pickthall
    original: وَقُلِ ٱلْحَمْدُ لِلَّهِ سَيُرِيكُمْ ءَايَـٰتِهِۦ فَتَعْرِفُونَهَا ۚ وَمَا رَبُّكَ بِغَـٰفِلٍ عَمَّا تَعْمَلُونَ
    arabicPlain: وقل الحمد لله سيريكم آياته فتعرفونها ۚ وما ربك بغافل عما تعملون
    surahName: An-Naml
