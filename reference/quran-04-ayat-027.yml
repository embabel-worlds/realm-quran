  data:
    ref: '27:51'
    scripture: quran
    name: Quran 27:51
    chapter: 27
    verse: 51
    ordinal: 3210
    text: Then see the nature of the consequence of their plotting, for lo! We destroyed them and their people, every one.
    translation: Pickthall
    original: فَٱنظُرْ كَيْفَ كَانَ عَـٰقِبَةُ مَكْرِهِمْ أَنَّا دَمَّرْنَـٰهُمْ وَقَوْمَهُمْ أَجْمَعِينَ
    arabicPlain: فانظر كيف كان عاقبة مكرهم أنا دمرناهم وقومهم أجمعين
