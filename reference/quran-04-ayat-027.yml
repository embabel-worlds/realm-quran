    scripture: quran
    name: Quran 27:39
    chapter: 27
    verse: 39
    ordinal: 3198
    text: 'A stalwart of the jinn said: I will bring it thee before thou canst rise from thy place. Lo! I verily am strong and trusty for such work.'
    translation: Pickthall
    original: قَالَ عِفْرِيتٌ مِّنَ ٱلْجِنِّ أَنَا۠ ءَاتِيكَ بِهِۦ قَبْلَ أَن تَقُومَ مِن مَّقَامِكَ ۖ وَإِنِّى عَلَيْهِ لَقَوِىٌّ أَمِينٌ
    arabicPlain: قال عفريت من الجن أنا آتيك به قبل أن تقوم من مقامك ۖ وإني عليه لقوي أمين
    surahName: An-Naml
    juz: 19
    manzil: 5
    ruku: 329
