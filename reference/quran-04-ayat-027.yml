    name: Quran 27:52
    chapter: 27
    verse: 52
    ordinal: 3211
    text: See, yonder are their dwellings empty and in ruins because they did wrong. Lo! herein is indeed a portent for a people who have knowledge.
    translation: Pickthall
    original: فَتِلْكَ بُيُوتُهُمْ خَاوِيَةًۢ بِمَا ظَلَمُوٓا۟ ۗ إِنَّ فِى ذَٰلِكَ لَـَٔايَةً لِّقَوْمٍ يَعْلَمُونَ
    arabicPlain: فتلك بيوتهم خاوية بما ظلموا ۗ إن في ذلك لآية لقوم يعلمون
