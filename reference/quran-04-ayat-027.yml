    scripture: quran
    name: Quran 27:34
    chapter: 27
    verse: 34
    ordinal: 3193
    text: 'She said: Lo! kings, when they enter a township, ruin it and make the honour of its people shame. Thus will they do.'
    translation: Pickthall
    original: قَالَتْ إِنَّ ٱلْمُلُوكَ إِذَا دَخَلُوا۟ قَرْيَةً أَفْسَدُوهَا وَجَعَلُوٓا۟ أَعِزَّةَ أَهْلِهَآ أَذِلَّةً ۖ وَكَذَٰلِكَ يَفْعَلُونَ
    arabicPlain: قالت إن الملوك إذا دخلوا قرية أفسدوها وجعلوا أعزة أهلها أذلة ۖ وكذلك يفعلون
