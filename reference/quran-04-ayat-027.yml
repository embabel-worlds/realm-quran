    ref: '27:55'
    scripture: quran
    name: Quran 27:55
    chapter: 27
    verse: 55
    ordinal: 3214
    text: Must ye needs lust after men instead of women? Nay, but ye are folk who act senselessly.
    translation: Pickthall
    original: أَئِنَّكُمْ لَتَأْتُونَ ٱلرِّجَالَ شَهْوَةً مِّن دُونِ ٱلنِّسَآءِ ۚ بَلْ أَنتُمْ قَوْمٌ تَجْهَلُونَ
