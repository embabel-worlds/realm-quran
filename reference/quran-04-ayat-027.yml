    text: 'Lo! it is from Solomon, and lo! it is: In the name of Allah, the Beneficent, the Merciful;'
    translation: Pickthall
    original: إِنَّهُۥ مِن سُلَيْمَـٰنَ وَإِنَّهُۥ بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ
