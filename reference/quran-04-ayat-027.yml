    scripture: quran
    name: Quran 27:35
    chapter: 27
    verse: 35
    ordinal: 3194
    text: But lo! I am going to send a present unto them, and to see with what (answer) the messengers return.
    translation: Pickthall
    original: وَإِنِّى مُرْسِلَةٌ إِلَيْهِم بِهَدِيَّةٍ فَنَاظِرَةٌۢ بِمَ يَرْجِعُ ٱلْمُرْسَلُونَ
    arabicPlain: وإني مرسلة إليهم بهدية فناظرة بم يرجع المرسلون
