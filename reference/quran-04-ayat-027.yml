    scripture: quran
    name: Quran 27:32
    chapter: 27
    verse: 32
    ordinal: 3191
    text: 'She said: O chieftains! Pronounce for me in my case. I decide no case till ye are present with me.'
    translation: Pickthall
    original: قَالَتْ يَـٰٓأَيُّهَا ٱلْمَلَؤُا۟ أَفْتُونِى فِىٓ أَمْرِى مَا كُنتُ قَاطِعَةً أَمْرًا حَتَّىٰ تَشْهَدُونِ
    arabicPlain: قالت يا أيها الملأ أفتوني في أمري ما كنت قاطعة أمرا حتى تشهدون
