  data:
    ref: '27:13'
    scripture: quran
    name: Quran 27:13
    chapter: 27
    verse: 13
    ordinal: 3172
    text: 'But when Our tokens came unto them, plain to see, they said: This is mere magic,'
    translation: Pickthall
    original: فَلَمَّا جَآءَتْهُمْ ءَايَـٰتُنَا مُبْصِرَةً قَالُوا۟ هَـٰذَا سِحْرٌ مُّبِينٌ
    arabicPlain: فلما جاءتهم آياتنا مبصرة قالوا هذا سحر مبين
    surahName: An-Naml
    juz: 19
    manzil: 5
    ruku: 327
