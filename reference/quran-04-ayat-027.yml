- type: Ayah
  data:
    ref: '27:8'
    scripture: quran
    name: Quran 27:8
    chapter: 27
    verse: 8
    ordinal: 3167
    text: 'But when he reached it, he was called, saying: Blessed is Whosoever is in the fire and Whosoever is round about it! And Glorified be Allah, the Lord of the Worlds!'
    translation: Pickthall
    original: فَلَمَّا جَآءَهَا نُودِىَ أَنۢ بُورِكَ مَن فِى ٱلنَّارِ وَمَنْ حَوْلَهَا وَسُبْحَـٰنَ ٱللَّهِ رَبِّ ٱلْعَـٰلَمِينَ
    arabicPlain: فلما جاءها نودي أن بورك من في النار ومن حولها وسبحان الله رب العالمين
    surahName: An-Naml
    juz: 19
    manzil: 5
    ruku: 327
