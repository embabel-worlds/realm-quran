    scripture: quran
    name: Quran 27:33
    chapter: 27
    verse: 33
    ordinal: 3192
    text: 'They said: We are lords of might and lords of great prowess, but it is for thee to command; so consider what thou wilt command.'
    translation: Pickthall
    original: قَالُوا۟ نَحْنُ أُو۟لُوا۟ قُوَّةٍ وَأُو۟لُوا۟ بَأْسٍ شَدِيدٍ وَٱلْأَمْرُ إِلَيْكِ فَٱنظُرِى مَاذَا تَأْمُرِينَ
