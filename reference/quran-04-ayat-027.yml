    scripture: quran
    name: Quran 27:83
    chapter: 27
    verse: 83
    ordinal: 3242
    text: And (remind them of) the Day when We shall gather out of every nation a host of those who denied Our revelations, and they will be set in array;
    translation: Pickthall
    original: وَيَوْمَ نَحْشُرُ مِن كُلِّ أُمَّةٍ فَوْجًا مِّمَّن يُكَذِّبُ بِـَٔايَـٰتِنَا فَهُمْ يُوزَعُونَ
    arabicPlain: ويوم نحشر من كل أمة فوجا ممن يكذب بآياتنا فهم يوزعون
