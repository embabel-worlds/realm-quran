  data:
    ref: '27:11'
    scripture: quran
    name: Quran 27:11
    chapter: 27
    verse: 11
    ordinal: 3170
    text: Save him who hath done wrong and afterward hath changed evil for good. And lo! I am Forgiving, Merciful.
    translation: Pickthall
    original: إِلَّا مَن ظَلَمَ ثُمَّ بَدَّلَ حُسْنًۢا بَعْدَ سُوٓءٍ فَإِنِّى غَفُورٌ رَّحِيمٌ
    arabicPlain: إلا من ظلم ثم بدل حسنا بعد سوء فإني غفور رحيم
    surahName: An-Naml
    juz: 19
    manzil: 5
    ruku: 327
