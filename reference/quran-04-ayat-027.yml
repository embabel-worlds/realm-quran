    scripture: quran
    name: Quran 27:58
    chapter: 27
    verse: 58
    ordinal: 3217
    text: And We rained a rain upon them. Dreadful is the rain of those who have been warned.
    translation: Pickthall
    original: وَأَمْطَرْنَا عَلَيْهِم مَّطَرًا ۖ فَسَآءَ مَطَرُ ٱلْمُنذَرِينَ
