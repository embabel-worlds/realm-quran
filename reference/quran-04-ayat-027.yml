    scripture: quran
    name: Quran 27:89
    chapter: 27
    verse: 89
    ordinal: 3248
    text: Whoso bringeth a good deed will have better than its worth; and such are safe from fear that Day.
    translation: Pickthall
    original: مَن جَآءَ بِٱلْحَسَنَةِ فَلَهُۥ خَيْرٌ مِّنْهَا وَهُم مِّن فَزَعٍ يَوْمَئِذٍ ءَامِنُونَ
