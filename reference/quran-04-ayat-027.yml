  data:
    ref: '27:15'
    scripture: quran
    name: Quran 27:15
    chapter: 27
    verse: 15
    ordinal: 3174
    text: 'And We verily gave knowledge unto David and Solomon, and they said: Praise be to Allah, Who hath preferred us above many of His believing slaves!'
    translation: Pickthall
    original: وَلَقَدْ ءَاتَيْنَا دَاوُۥدَ وَسُلَيْمَـٰنَ عِلْمًا ۖ وَقَالَا ٱلْحَمْدُ لِلَّهِ ٱلَّذِى فَضَّلَنَا عَلَىٰ كَثِيرٍ مِّنْ عِبَادِهِ ٱلْمُؤْمِنِينَ
    arabicPlain: ولقد آتينا داوود وسليمان علما ۖ وقالا الحمد لله الذي فضلنا على كثير من عباده المؤمنين
    surahName: An-Naml
    juz: 19
    manzil: 5
    ruku: 328
    page: 378
