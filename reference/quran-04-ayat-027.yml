    text: And there were in the city nine persons who made mischief in the land and reformed not.
    translation: Pickthall
    original: وَكَانَ فِى ٱلْمَدِينَةِ تِسْعَةُ رَهْطٍ يُفْسِدُونَ فِى ٱلْأَرْضِ وَلَا يُصْلِحُونَ
    arabicPlain: وكان في المدينة تسعة رهط يفسدون في الأرض ولا يصلحون
