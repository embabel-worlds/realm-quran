    translation: Pickthall
    original: وَصَدَّهَا مَا كَانَت تَّعْبُدُ مِن دُونِ ٱللَّهِ ۖ إِنَّهَا كَانَتْ مِن قَوْمٍ كَـٰفِرِينَ
    arabicPlain: وصدها ما كانت تعبد من دون الله ۖ إنها كانت من قوم كافرين
