- type: Ayah
  data:
    ref: '27:12'
    scripture: quran
    name: Quran 27:12
    chapter: 27
    verse: 12
    ordinal: 3171
    text: And put thy hand into the bosom of thy robe, it will come forth white but unhurt. (This will be one) among nine tokens unto Pharaoh and his people Lo! they were ever evil-living folk.
    translation: Pickthall
    original: وَأَدْخِلْ يَدَكَ فِى جَيْبِكَ تَخْرُجْ بَيْضَآءَ مِنْ غَيْرِ سُوٓءٍ ۖ فِى تِسْعِ ءَايَـٰتٍ إِلَىٰ فِرْعَوْنَ وَقَوْمِهِۦٓ ۚ إِنَّهُمْ كَانُوا۟ قَوْمًا فَـٰسِقِينَ
    arabicPlain: وأدخل يدك في جيبك تخرج بيضاء من غير سوء ۖ في تسع آيات إلى فرعون وقومه ۚ إنهم كانوا قوما فاسقين
    surahName: An-Naml
    juz: 19
    manzil: 5
    ruku: 327
    page: 377
