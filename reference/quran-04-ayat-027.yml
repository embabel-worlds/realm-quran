    verse: 23
    ordinal: 3182
    text: Lo! I found a woman ruling over them, and she hath been given (abundance) of all things, and hers is a mighty throne.
    translation: Pickthall
    original: إِنِّى وَجَدتُّ ٱمْرَأَةً تَمْلِكُهُمْ وَأُوتِيَتْ مِن كُلِّ شَىْءٍ وَلَهَا عَرْشٌ عَظِيمٌ
