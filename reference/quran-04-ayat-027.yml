    scripture: quran
    name: Quran 27:41
    chapter: 27
    verse: 41
    ordinal: 3200
    text: 'He said: Disguise her throne for her that we may see whether she will go aright or be of those not rightly guided.'
    translation: Pickthall
    original: قَالَ نَكِّرُوا۟ لَهَا عَرْشَهَا نَنظُرْ أَتَهْتَدِىٓ أَمْ تَكُونُ مِنَ ٱلَّذِينَ لَا يَهْتَدُونَ
    arabicPlain: قال نكروا لها عرشها ننظر أتهتدي أم تكون من الذين لا يهتدون
    surahName: An-Naml
    juz: 19
    manzil: 5
