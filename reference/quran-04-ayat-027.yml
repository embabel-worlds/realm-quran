  data:
    ref: 27:90
    scripture: quran
    name: Quran 27:90
    chapter: 27
    verse: 90
    ordinal: 3249
    text: And whoso bringeth an ill-deed, such will be flung down on their faces in the Fire. Are ye rewarded aught save what ye did?
    translation: Pickthall
    original: وَمَن جَآءَ بِٱلسَّيِّئَةِ فَكُبَّتْ وُجُوهُهُمْ فِى ٱلنَّارِ هَلْ تُجْزَوْنَ إِلَّا مَا كُنتُمْ تَعْمَلُونَ
    arabicPlain: ومن جاء بالسيئة فكبت وجوههم في النار هل تجزون إلا ما كنتم تعملون
