    scripture: quran
    name: Quran 17:96
    chapter: 17
    verse: 96
    ordinal: 2125
    text: 'Say: Allah sufficeth for a witness between me and you. Lo! He is Knower, Seer of His slaves.'
    translation: Pickthall
    original: قُلْ كَفَىٰ بِٱللَّهِ شَهِيدًۢا بَيْنِى وَبَيْنَكُمْ ۚ إِنَّهُۥ كَانَ بِعِبَادِهِۦ خَبِيرًۢا بَصِيرًا
    arabicPlain: قل كفى بالله شهيدا بيني وبينكم ۚ إنه كان بعباده خبيرا بصيرا
