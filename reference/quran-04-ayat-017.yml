    scripture: quran
    name: Quran 17:107
    chapter: 17
    verse: 107
    ordinal: 2136
    text: 'Say: Believe therein or believe not, lo! those who were given knowledge before it, when it is read unto them, fall down prostrate on their faces, adoring,'
    translation: Pickthall
    original: قُلْ ءَامِنُوا۟ بِهِۦٓ أَوْ لَا تُؤْمِنُوٓا۟ ۚ إِنَّ ٱلَّذِينَ أُوتُوا۟ ٱلْعِلْمَ مِن قَبْلِهِۦٓ إِذَا يُتْلَىٰ عَلَيْهِمْ يَخِرُّونَ لِلْأَذْقَانِ سُجَّدًا
    arabicPlain: قل آمنوا به أو لا تؤمنوا ۚ إن الذين أوتوا العلم من قبله إذا يتلى عليهم يخرون للأذقان سجدا
    surahName: Al-Israa
