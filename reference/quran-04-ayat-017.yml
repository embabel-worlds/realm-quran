    name: Quran 17:75
    chapter: 17
    verse: 75
    ordinal: 2104
    text: Then had we made thee taste a double (punishment) of living and a double (punishment) of dying, then hadst thou found no helper against Us.
    translation: Pickthall
    original: إِذًا لَّأَذَقْنَـٰكَ ضِعْفَ ٱلْحَيَوٰةِ وَضِعْفَ ٱلْمَمَاتِ ثُمَّ لَا تَجِدُ لَكَ عَلَيْنَا نَصِيرًا
