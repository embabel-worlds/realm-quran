    scripture: quran
    name: Quran 17:91
    chapter: 17
    verse: 91
    ordinal: 2120
    text: Or thou have a garden of date-palms and grapes, and cause rivers to gush forth therein abundantly;
    translation: Pickthall
    original: أَوْ تَكُونَ لَكَ جَنَّةٌ مِّن نَّخِيلٍ وَعِنَبٍ فَتُفَجِّرَ ٱلْأَنْهَـٰرَ خِلَـٰلَهَا تَفْجِيرًا
    arabicPlain: أو تكون لك جنة من نخيل وعنب فتفجر الأنهار خلالها تفجيرا
