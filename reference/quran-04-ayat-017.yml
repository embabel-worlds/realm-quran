  data:
    ref: '17:8'
    scripture: quran
    name: Quran 17:8
    chapter: 17
    verse: 8
    ordinal: 2037
    text: It may be that your Lord will have mercy on you, but if ye repeat (the crime) We shall repeat (the punishment), and We have appointed hell a dungeon for the disbelievers.
    translation: Pickthall
    original: عَسَىٰ رَبُّكُمْ أَن يَرْحَمَكُمْ ۚ وَإِنْ عُدتُّمْ عُدْنَا ۘ وَجَعَلْنَا جَهَنَّمَ لِلْكَـٰفِرِينَ حَصِيرًا
    arabicPlain: عسى ربكم أن يرحمكم ۚ وإن عدتم عدنا ۘ وجعلنا جهنم للكافرين حصيرا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 240
