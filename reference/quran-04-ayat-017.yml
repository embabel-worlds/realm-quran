  data:
    ref: 17:67
    scripture: quran
    name: Quran 17:67
    chapter: 17
    verse: 67
    ordinal: 2096
    text: And when harm toucheth you upon the sea, all unto whom ye cry (for succour) fail save Him (alone), but when He bringeth you safe to land, ye turn away, for man was ever thankless.
    translation: Pickthall
    original: وَإِذَا مَسَّكُمُ ٱلضُّرُّ فِى ٱلْبَحْرِ ضَلَّ مَن تَدْعُونَ إِلَّآ إِيَّاهُ ۖ فَلَمَّا نَجَّىٰكُمْ إِلَى ٱلْبَرِّ أَعْرَضْتُمْ ۚ وَكَانَ ٱلْإِنسَـٰنُ كَفُورًا
    arabicPlain: وإذا مسكم الضر في البحر ضل من تدعون إلا إياه ۖ فلما نجاكم إلى البر أعرضتم ۚ وكان الإنسان كفورا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 246
    page: 289
