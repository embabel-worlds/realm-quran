    name: Quran 17:78
    chapter: 17
    verse: 78
    ordinal: 2107
    text: Establish worship at the going down of the sun until the dark of night, and (the recital of) the Qur'an at dawn. Lo! (the recital of) the Qur'an at dawn is ever witnessed.
    translation: Pickthall
    original: أَقِمِ ٱلصَّلَوٰةَ لِدُلُوكِ ٱلشَّمْسِ إِلَىٰ غَسَقِ ٱلَّيْلِ وَقُرْءَانَ ٱلْفَجْرِ ۖ إِنَّ قُرْءَانَ ٱلْفَجْرِ كَانَ مَشْهُودًا
    arabicPlain: أقم الصلاة لدلوك الشمس إلى غسق الليل وقرآن الفجر ۖ إن قرآن الفجر كان مشهودا
