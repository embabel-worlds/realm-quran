  data:
    ref: 17:73
    scripture: quran
    name: Quran 17:73
    chapter: 17
    verse: 73
    ordinal: 2102
    text: And they indeed strove hard to beguile thee (Muhammad) away from that wherewith We have inspired thee, that thou shouldst invent other than it against Us; and then would they have accepted thee as a friend.
    translation: Pickthall
    original: وَإِن كَادُوا۟ لَيَفْتِنُونَكَ عَنِ ٱلَّذِىٓ أَوْحَيْنَآ إِلَيْكَ لِتَفْتَرِىَ عَلَيْنَا غَيْرَهُۥ ۖ وَإِذًا لَّٱتَّخَذُوكَ خَلِيلًا
    arabicPlain: وإن كادوا ليفتنونك عن الذي أوحينا إليك لتفتري علينا غيره ۖ وإذا لاتخذوك خليلا
