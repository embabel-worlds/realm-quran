    name: Quran 17:95
    chapter: 17
    verse: 95
    ordinal: 2124
    text: 'Say: If there were in the earth angels walking secure, We had sent down for them from heaven an angel as messenger.'
    translation: Pickthall
    original: قُل لَّوْ كَانَ فِى ٱلْأَرْضِ مَلَـٰٓئِكَةٌ يَمْشُونَ مُطْمَئِنِّينَ لَنَزَّلْنَا عَلَيْهِم مِّنَ ٱلسَّمَآءِ مَلَكًا رَّسُولًا
