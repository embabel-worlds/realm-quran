    name: Quran 17:82
    chapter: 17
    verse: 82
    ordinal: 2111
    text: And We reveal of the Qur'an that which is a healing and a mercy for believers though it increase the evil-doers in naught save ruin.
    translation: Pickthall
    original: وَنُنَزِّلُ مِنَ ٱلْقُرْءَانِ مَا هُوَ شِفَآءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ ۙ وَلَا يَزِيدُ ٱلظَّـٰلِمِينَ إِلَّا خَسَارًا
    arabicPlain: وننزل من القرآن ما هو شفاء ورحمة للمؤمنين ۙ ولا يزيد الظالمين إلا خسارا
