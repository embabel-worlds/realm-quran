    chapter: 17
    verse: 88
    ordinal: 2117
    text: 'Say: Verily, though mankind and the jinn should assemble to produce the like of this Qur''an, they could not produce the like thereof though they were helpers one of another.'
    translation: Pickthall
    original: قُل لَّئِنِ ٱجْتَمَعَتِ ٱلْإِنسُ وَٱلْجِنُّ عَلَىٰٓ أَن يَأْتُوا۟ بِمِثْلِ هَـٰذَا ٱلْقُرْءَانِ لَا يَأْتُونَ بِمِثْلِهِۦ وَلَوْ كَانَ بَعْضُهُمْ لِبَعْضٍ ظَهِيرًا
    arabicPlain: قل لئن اجتمعت الإنس والجن على أن يأتوا بمثل هذا القرآن لا يأتون بمثله ولو كان بعضهم لبعض ظهيرا
