  data:
    ref: '17:6'
    scripture: quran
    name: Quran 17:6
    chapter: 17
    verse: 6
    ordinal: 2035
    text: Then we gave you once again your turn against them, and We aided you with wealth and children and made you more in soldiery.
    translation: Pickthall
    original: ثُمَّ رَدَدْنَا لَكُمُ ٱلْكَرَّةَ عَلَيْهِمْ وَأَمْدَدْنَـٰكُم بِأَمْوَٰلٍ وَبَنِينَ وَجَعَلْنَـٰكُمْ أَكْثَرَ نَفِيرًا
    arabicPlain: ثم رددنا لكم الكرة عليهم وأمددناكم بأموال وبنين وجعلناكم أكثر نفيرا
    surahName: Al-Israa
    juz: 15
