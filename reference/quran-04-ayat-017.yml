    scripture: quran
    name: Quran 17:106
    chapter: 17
    verse: 106
    ordinal: 2135
    text: And (it is) a Qur'an that We have divided, that thou mayst recite it unto mankind at intervals, and We have revealed it by (successive) revelation.
    translation: Pickthall
    original: وَقُرْءَانًا فَرَقْنَـٰهُ لِتَقْرَأَهُۥ عَلَى ٱلنَّاسِ عَلَىٰ مُكْثٍ وَنَزَّلْنَـٰهُ تَنزِيلًا
    arabicPlain: وقرآنا فرقناه لتقرأه على الناس على مكث ونزلناه تنزيلا
    surahName: Al-Israa
    juz: 15
