  data:
    ref: '17:10'
    scripture: quran
    name: Quran 17:10
    chapter: 17
    verse: 10
    ordinal: 2039
    text: And that those who believe not in the Hereafter, for them We have prepared a painful doom.
    translation: Pickthall
    original: وَأَنَّ ٱلَّذِينَ لَا يُؤْمِنُونَ بِٱلْـَٔاخِرَةِ أَعْتَدْنَا لَهُمْ عَذَابًا أَلِيمًا
    arabicPlain: وأن الذين لا يؤمنون بالآخرة أعتدنا لهم عذابا أليما
    surahName: Al-Israa
