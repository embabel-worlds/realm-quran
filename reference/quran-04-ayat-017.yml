  data:
    ref: '17:33'
    scripture: quran
    name: Quran 17:33
    chapter: 17
    verse: 33
    ordinal: 2062
    text: And slay not the life which Allah hath forbidden save with right. Whoso is slain wrongfully, We have given power unto his heir, but let him not commit excess in slaying. Lo! he will be helped.
    translation: Pickthall
    original: وَلَا تَقْتُلُوا۟ ٱلنَّفْسَ ٱلَّتِى حَرَّمَ ٱللَّهُ إِلَّا بِٱلْحَقِّ ۗ وَمَن قُتِلَ مَظْلُومًا فَقَدْ جَعَلْنَا لِوَلِيِّهِۦ سُلْطَـٰنًا فَلَا يُسْرِف فِّى ٱلْقَتْلِ ۖ إِنَّهُۥ كَانَ مَنصُورًا
    arabicPlain: ولا تقتلوا النفس التي حرم الله إلا بالحق ۗ ومن قتل مظلوما فقد جعلنا لوليه سلطانا فلا يسرف في القتل ۖ إنه كان منصورا
    surahName: Al-Israa
