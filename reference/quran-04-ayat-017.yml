  data:
    ref: 17:66
    scripture: quran
    name: Quran 17:66
    chapter: 17
    verse: 66
    ordinal: 2095
    text: (O mankind), your Lord is He Who driveth for you the ship upon the sea that ye may seek of His bounty. Lo! He was ever Merciful toward you.
    translation: Pickthall
    original: رَّبُّكُمُ ٱلَّذِى يُزْجِى لَكُمُ ٱلْفُلْكَ فِى ٱلْبَحْرِ لِتَبْتَغُوا۟ مِن فَضْلِهِۦٓ ۚ إِنَّهُۥ كَانَ بِكُمْ رَحِيمًا
    arabicPlain: ربكم الذي يزجي لكم الفلك في البحر لتبتغوا من فضله ۚ إنه كان بكم رحيما
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 246
    page: 288
