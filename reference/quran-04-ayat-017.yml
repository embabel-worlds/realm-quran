  data:
    ref: '17:54'
    scripture: quran
    name: Quran 17:54
    chapter: 17
    verse: 54
    ordinal: 2083
    text: Your Lord is Best Aware of you. If He will, He will have mercy on you, or if He will, He will punish you. We have not sent thee (O Muhammad) as a warden over them.
    translation: Pickthall
    original: رَّبُّكُمْ أَعْلَمُ بِكُمْ ۖ إِن يَشَأْ يَرْحَمْكُمْ أَوْ إِن يَشَأْ يُعَذِّبْكُمْ ۚ وَمَآ أَرْسَلْنَـٰكَ عَلَيْهِمْ وَكِيلًا
    arabicPlain: ربكم أعلم بكم ۖ إن يشأ يرحمكم أو إن يشأ يعذبكم ۚ وما أرسلناك عليهم وكيلا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 245
    page: 287
  relations:
