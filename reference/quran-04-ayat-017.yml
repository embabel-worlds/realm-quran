  data:
    ref: 17:64
    scripture: quran
    name: Quran 17:64
    chapter: 17
    verse: 64
    ordinal: 2093
    text: And excite any of them whom thou canst with thy voice, and urge thy horse and foot against them, and be a partner in their wealth and children, and promise them. Satan promiseth them only to deceive.
    translation: Pickthall
    original: وَٱسْتَفْزِزْ مَنِ ٱسْتَطَعْتَ مِنْهُم بِصَوْتِكَ وَأَجْلِبْ عَلَيْهِم بِخَيْلِكَ وَرَجِلِكَ وَشَارِكْهُمْ فِى ٱلْأَمْوَٰلِ وَٱلْأَوْلَـٰدِ وَعِدْهُمْ ۚ وَمَا يَعِدُهُمُ ٱلشَّيْطَـٰنُ إِلَّا غُرُورًا
    arabicPlain: واستفزز من استطعت منهم بصوتك وأجلب عليهم بخيلك ورجلك وشاركهم في الأموال والأولاد وعدهم ۚ وما يعدهم الشيطان إلا غرورا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 246
