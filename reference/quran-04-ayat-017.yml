  data:
    ref: 17:71
    scripture: quran
    name: Quran 17:71
    chapter: 17
    verse: 71
    ordinal: 2100
    text: On the day when We shall summon all men with their record, whoso is given his book in his right hand - such will read their book and they will not be wronged a shred.
    translation: Pickthall
    original: يَوْمَ نَدْعُوا۟ كُلَّ أُنَاسٍۭ بِإِمَـٰمِهِمْ ۖ فَمَنْ أُوتِىَ كِتَـٰبَهُۥ بِيَمِينِهِۦ فَأُو۟لَـٰٓئِكَ يَقْرَءُونَ كِتَـٰبَهُمْ وَلَا يُظْلَمُونَ فَتِيلًا
    arabicPlain: يوم ندعو كل أناس بإمامهم ۖ فمن أوتي كتابه بيمينه فأولئك يقرءون كتابهم ولا يظلمون فتيلا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 247
    page: 289
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '17'
  - predicate: IN_PORTION
    to:
      type: Juz
