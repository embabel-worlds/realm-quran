    scripture: quran
    name: Quran 17:109
    chapter: 17
    verse: 109
    ordinal: 2138
    text: They fall down on their faces, weeping, and it increaseth humility in them.
    translation: Pickthall
    original: وَيَخِرُّونَ لِلْأَذْقَانِ يَبْكُونَ وَيَزِيدُهُمْ خُشُوعًا ۩
    arabicPlain: ويخرون للأذقان يبكون ويزيدهم خشوعا ۩
