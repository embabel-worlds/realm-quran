  data:
    ref: 17:62
    scripture: quran
    name: Quran 17:62
    chapter: 17
    verse: 62
    ordinal: 2091
    text: 'He said: Seest Thou this (creature) whom Thou hast honoured above me, if Thou give me grace until the Day of Resurrection I verily will seize his seed, save but a few.'
    translation: Pickthall
    original: قَالَ أَرَءَيْتَكَ هَـٰذَا ٱلَّذِى كَرَّمْتَ عَلَىَّ لَئِنْ أَخَّرْتَنِ إِلَىٰ يَوْمِ ٱلْقِيَـٰمَةِ لَأَحْتَنِكَنَّ ذُرِّيَّتَهُۥٓ إِلَّا قَلِيلًا
    arabicPlain: قال أرأيتك هذا الذي كرمت علي لئن أخرتن إلى يوم القيامة لأحتنكن ذريته إلا قليلا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 246
    page: 288
