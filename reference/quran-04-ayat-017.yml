  data:
    ref: 17:70
    scripture: quran
    name: Quran 17:70
    chapter: 17
    verse: 70
    ordinal: 2099
    text: Verily we have honoured the Children of Adam. We carry them on the land and the sea, and have made provision of good things for them, and have preferred them above many of those whom We created with a marked preferment.
    translation: Pickthall
    original: ۞ وَلَقَدْ كَرَّمْنَا بَنِىٓ ءَادَمَ وَحَمَلْنَـٰهُمْ فِى ٱلْبَرِّ وَٱلْبَحْرِ وَرَزَقْنَـٰهُم مِّنَ ٱلطَّيِّبَـٰتِ وَفَضَّلْنَـٰهُمْ عَلَىٰ كَثِيرٍ مِّمَّنْ خَلَقْنَا تَفْضِيلًا
    arabicPlain: ۞ ولقد كرمنا بني آدم وحملناهم في البر والبحر ورزقناهم من الطيبات وفضلناهم على كثير ممن خلقنا تفضيلا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 246
    page: 289
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '17'
  - predicate: IN_PORTION
    to:
