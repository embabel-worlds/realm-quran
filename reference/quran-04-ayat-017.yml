    name: Quran 17:20
    chapter: 17
    verse: 20
    ordinal: 2049
    text: Each do We supply, both these and those, from the bounty of thy Lord. And the bounty of thy Lord can never be walled up.
    translation: Pickthall
    original: كُلًّا نُّمِدُّ هَـٰٓؤُلَآءِ وَهَـٰٓؤُلَآءِ مِنْ عَطَآءِ رَبِّكَ ۚ وَمَا كَانَ عَطَآءُ رَبِّكَ مَحْظُورًا
