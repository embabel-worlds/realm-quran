    name: Quran 17:49
    chapter: 17
    verse: 49
    ordinal: 2078
    text: 'And they say: When we are bones and fragments, shall we forsooth, be raised up as a new creation?'
    translation: Pickthall
    original: وَقَالُوٓا۟ أَءِذَا كُنَّا عِظَـٰمًا وَرُفَـٰتًا أَءِنَّا لَمَبْعُوثُونَ خَلْقًا جَدِيدًا
    arabicPlain: وقالوا أإذا كنا عظاما ورفاتا أإنا لمبعوثون خلقا جديدا
