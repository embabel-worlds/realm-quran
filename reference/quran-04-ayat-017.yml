    scripture: quran
    name: Quran 17:46
    chapter: 17
    verse: 46
    ordinal: 2075
    text: And We place upon their hearts veils lest they should understand it, and in their ears a deafness; and when thou makest mention of thy Lord alone in the Qur'an, they turn their backs in aversion.
    translation: Pickthall
    original: وَجَعَلْنَا عَلَىٰ قُلُوبِهِمْ أَكِنَّةً أَن يَفْقَهُوهُ وَفِىٓ ءَاذَانِهِمْ وَقْرًا ۚ وَإِذَا ذَكَرْتَ رَبَّكَ فِى ٱلْقُرْءَانِ وَحْدَهُۥ وَلَّوْا۟ عَلَىٰٓ أَدْبَـٰرِهِمْ نُفُورًا
    arabicPlain: وجعلنا على قلوبهم أكنة أن يفقهوه وفي آذانهم وقرا ۚ وإذا ذكرت ربك في القرآن وحده ولوا على أدبارهم نفورا
