    scripture: quran
    name: Quran 17:31
    chapter: 17
    verse: 31
    ordinal: 2060
    text: Slay not your children, fearing a fall to poverty, We shall provide for them and for you. Lo! the slaying of them is great sin.
    translation: Pickthall
    original: وَلَا تَقْتُلُوٓا۟ أَوْلَـٰدَكُمْ خَشْيَةَ إِمْلَـٰقٍ ۖ نَّحْنُ نَرْزُقُهُمْ وَإِيَّاكُمْ ۚ إِنَّ قَتْلَهُمْ كَانَ خِطْـًٔا كَبِيرًا
    arabicPlain: ولا تقتلوا أولادكم خشية إملاق ۖ نحن نرزقهم وإياكم ۚ إن قتلهم كان خطئا كبيرا
    surahName: Al-Israa
