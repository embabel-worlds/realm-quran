  data:
    ref: 17:61
    scripture: quran
    name: Quran 17:61
    chapter: 17
    verse: 61
    ordinal: 2090
    text: 'And when We said unto the angels: Fall down prostrate before Adam and they fell prostrate all save Iblis, he said: Shall I fall prostrate before that which Thou hast created of clay?'
    translation: Pickthall
    original: وَإِذْ قُلْنَا لِلْمَلَـٰٓئِكَةِ ٱسْجُدُوا۟ لِـَٔادَمَ فَسَجَدُوٓا۟ إِلَّآ إِبْلِيسَ قَالَ ءَأَسْجُدُ لِمَنْ خَلَقْتَ طِينًا
    arabicPlain: وإذ قلنا للملائكة اسجدوا لآدم فسجدوا إلا إبليس قال أأسجد لمن خلقت طينا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 246
