    scripture: quran
    name: Quran 17:100
    chapter: 17
    verse: 100
    ordinal: 2129
    text: 'Say (unto them): If ye possessed the treasures of the mercy of my Lord, ye would surely hold them back for fear of spending, for man was ever grudging.'
    translation: Pickthall
    original: قُل لَّوْ أَنتُمْ تَمْلِكُونَ خَزَآئِنَ رَحْمَةِ رَبِّىٓ إِذًا لَّأَمْسَكْتُمْ خَشْيَةَ ٱلْإِنفَاقِ ۚ وَكَانَ ٱلْإِنسَـٰنُ قَتُورًا
    arabicPlain: قل لو أنتم تملكون خزائن رحمة ربي إذا لأمسكتم خشية الإنفاق ۚ وكان الإنسان قتورا
    surahName: Al-Israa
