  data:
    ref: 17:60
    scripture: quran
    name: Quran 17:60
    chapter: 17
    verse: 60
    ordinal: 2089
    text: 'And (it was a warning) when we told thee: Lo! thy Lord encompasseth mankind, and We appointed the sight which We showed thee as an ordeal for mankind, and (likewise) the Accursed Tree in the Qur''an. We warn them, but it increaseth them in naught save gross impiety.'
    translation: Pickthall
    original: وَإِذْ قُلْنَا لَكَ إِنَّ رَبَّكَ أَحَاطَ بِٱلنَّاسِ ۚ وَمَا جَعَلْنَا ٱلرُّءْيَا ٱلَّتِىٓ أَرَيْنَـٰكَ إِلَّا فِتْنَةً لِّلنَّاسِ وَٱلشَّجَرَةَ ٱلْمَلْعُونَةَ فِى ٱلْقُرْءَانِ ۚ وَنُخَوِّفُهُمْ فَمَا يَزِيدُهُمْ إِلَّا طُغْيَـٰنًا كَبِيرًا
    arabicPlain: وإذ قلنا لك إن ربك أحاط بالناس ۚ وما جعلنا الرؤيا التي أريناك إلا فتنة للناس والشجرة الملعونة في القرآن ۚ ونخوفهم فما يزيدهم إلا طغيانا كبيرا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 245
    page: 288
