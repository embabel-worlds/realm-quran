  data:
    ref: 17:103
    scripture: quran
    name: Quran 17:103
    chapter: 17
    verse: 103
    ordinal: 2132
    text: And he wished to scare them from the land, but We drowned him and those with him, all together.
    translation: Pickthall
    original: فَأَرَادَ أَن يَسْتَفِزَّهُم مِّنَ ٱلْأَرْضِ فَأَغْرَقْنَـٰهُ وَمَن مَّعَهُۥ جَمِيعًا
    arabicPlain: فأراد أن يستفزهم من الأرض فأغرقناه ومن معه جميعا
