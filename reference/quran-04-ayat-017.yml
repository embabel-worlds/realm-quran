  data:
    ref: '17:11'
    scripture: quran
    name: Quran 17:11
    chapter: 17
    verse: 11
    ordinal: 2040
    text: Man prayeth for evil as he prayeth for good; for man was ever hasty.
    translation: Pickthall
    original: وَيَدْعُ ٱلْإِنسَـٰنُ بِٱلشَّرِّ دُعَآءَهُۥ بِٱلْخَيْرِ ۖ وَكَانَ ٱلْإِنسَـٰنُ عَجُولًا
    arabicPlain: ويدع الإنسان بالشر دعاءه بالخير ۖ وكان الإنسان عجولا
