  data:
    ref: '17:51'
    scripture: quran
    name: Quran 17:51
    chapter: 17
    verse: 51
    ordinal: 2080
    text: 'Or some created thing that is yet greater in your thoughts! Then they will say: Who shall bring us back (to life). Say: He Who created you at the first. Then will they shake their heads at thee, and say: When will it be? Say: It will perhaps be soon;'
    translation: Pickthall
    original: أَوْ خَلْقًا مِّمَّا يَكْبُرُ فِى صُدُورِكُمْ ۚ فَسَيَقُولُونَ مَن يُعِيدُنَا ۖ قُلِ ٱلَّذِى فَطَرَكُمْ أَوَّلَ مَرَّةٍ ۚ فَسَيُنْغِضُونَ إِلَيْكَ رُءُوسَهُمْ وَيَقُولُونَ مَتَىٰ هُوَ ۖ قُلْ عَسَىٰٓ أَن يَكُونَ قَرِيبًا
    arabicPlain: أو خلقا مما يكبر في صدوركم ۚ فسيقولون من يعيدنا ۖ قل الذي فطركم أول مرة ۚ فسينغضون إليك رءوسهم ويقولون متى هو ۖ قل عسى أن يكون قريبا
    surahName: Al-Israa
