    name: Quran 17:28
    chapter: 17
    verse: 28
    ordinal: 2057
    text: But if thou turn away from them, seeking mercy from thy Lord, for which thou hopest, then speak unto them a reasonable word.
    translation: Pickthall
    original: وَإِمَّا تُعْرِضَنَّ عَنْهُمُ ٱبْتِغَآءَ رَحْمَةٍ مِّن رَّبِّكَ تَرْجُوهَا فَقُل لَّهُمْ قَوْلًا مَّيْسُورًا
