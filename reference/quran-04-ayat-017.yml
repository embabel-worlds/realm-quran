    chapter: 17
    verse: 30
    ordinal: 2059
    text: Lo! thy Lord enlargeth the provision for whom He will, and straiteneth (it for whom He will). Lo, He was ever Knower, Seer of His slaves.
    translation: Pickthall
    original: إِنَّ رَبَّكَ يَبْسُطُ ٱلرِّزْقَ لِمَن يَشَآءُ وَيَقْدِرُ ۚ إِنَّهُۥ كَانَ بِعِبَادِهِۦ خَبِيرًۢا بَصِيرًا
    arabicPlain: إن ربك يبسط الرزق لمن يشاء ويقدر ۚ إنه كان بعباده خبيرا بصيرا
