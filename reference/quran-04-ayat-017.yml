    scripture: quran
    name: Quran 17:48
    chapter: 17
    verse: 48
    ordinal: 2077
    text: See what similitudes they coin for thee, and thus are all astray, and cannot find a road!
    translation: Pickthall
    original: ٱنظُرْ كَيْفَ ضَرَبُوا۟ لَكَ ٱلْأَمْثَالَ فَضَلُّوا۟ فَلَا يَسْتَطِيعُونَ سَبِيلًا
