  data:
    ref: 17:69
    scripture: quran
    name: Quran 17:69
    chapter: 17
    verse: 69
    ordinal: 2098
    text: Or feel ye secure that He will not return you to that (plight) a second time, and send against you a hurricane of wind and drown you for your thanklessness, and then ye will not find therein that ye have any avenger against Us?
    translation: Pickthall
    original: أَمْ أَمِنتُمْ أَن يُعِيدَكُمْ فِيهِ تَارَةً أُخْرَىٰ فَيُرْسِلَ عَلَيْكُمْ قَاصِفًا مِّنَ ٱلرِّيحِ فَيُغْرِقَكُم بِمَا كَفَرْتُمْ ۙ ثُمَّ لَا تَجِدُوا۟ لَكُمْ عَلَيْنَا بِهِۦ تَبِيعًا
    arabicPlain: أم أمنتم أن يعيدكم فيه تارة أخرى فيرسل عليكم قاصفا من الريح فيغرقكم بما كفرتم ۙ ثم لا تجدوا لكم علينا به تبيعا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 246
    page: 289
