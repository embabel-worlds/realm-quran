  data:
    ref: 17:105
    scripture: quran
    name: Quran 17:105
    chapter: 17
    verse: 105
    ordinal: 2134
    text: With truth have We sent it down, and with truth hath it descended. And We have sent thee as naught else save a bearer of good tidings and a warner.
    translation: Pickthall
    original: وَبِٱلْحَقِّ أَنزَلْنَـٰهُ وَبِٱلْحَقِّ نَزَلَ ۗ وَمَآ أَرْسَلْنَـٰكَ إِلَّا مُبَشِّرًا وَنَذِيرًا
    arabicPlain: وبالحق أنزلناه وبالحق نزل ۗ وما أرسلناك إلا مبشرا ونذيرا
    surahName: Al-Israa
