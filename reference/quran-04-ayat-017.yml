  data:
    ref: '17:17'
    scripture: quran
    name: Quran 17:17
    chapter: 17
    verse: 17
    ordinal: 2046
    text: How many generations have We destroyed since Noah! And Allah sufficeth as Knower and Beholder of the sins of His slaves.
    translation: Pickthall
    original: وَكَمْ أَهْلَكْنَا مِنَ ٱلْقُرُونِ مِنۢ بَعْدِ نُوحٍ ۗ وَكَفَىٰ بِرَبِّكَ بِذُنُوبِ عِبَادِهِۦ خَبِيرًۢا بَصِيرًا
