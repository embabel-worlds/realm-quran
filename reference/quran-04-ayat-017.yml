  data:
    ref: 17:65
    scripture: quran
    name: Quran 17:65
    chapter: 17
    verse: 65
    ordinal: 2094
    text: Lo! My (faithful) bondmen - over them thou hast no power, and thy Lord sufficeth as (their) guardian.
    translation: Pickthall
    original: إِنَّ عِبَادِى لَيْسَ لَكَ عَلَيْهِمْ سُلْطَـٰنٌ ۚ وَكَفَىٰ بِرَبِّكَ وَكِيلًا
    arabicPlain: إن عبادي ليس لك عليهم سلطان ۚ وكفى بربك وكيلا
    surahName: Al-Israa
    juz: 15
    manzil: 4
