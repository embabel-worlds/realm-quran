    scripture: quran
    name: Quran 17:92
    chapter: 17
    verse: 92
    ordinal: 2121
    text: Or thou cause the heaven to fall upon us piecemeal, as thou hast pretended, or bring Allah and the angels as a warrant;
    translation: Pickthall
    original: أَوْ تُسْقِطَ ٱلسَّمَآءَ كَمَا زَعَمْتَ عَلَيْنَا كِسَفًا أَوْ تَأْتِىَ بِٱللَّهِ وَٱلْمَلَـٰٓئِكَةِ قَبِيلًا
    arabicPlain: أو تسقط السماء كما زعمت علينا كسفا أو تأتي بالله والملائكة قبيلا
    surahName: Al-Israa
    juz: 15
