    scripture: quran
    name: Quran 17:35
    chapter: 17
    verse: 35
    ordinal: 2064
    text: Fill the measure when ye measure, and weigh with a right balance; that is meet, and better in the end.
    translation: Pickthall
    original: وَأَوْفُوا۟ ٱلْكَيْلَ إِذَا كِلْتُمْ وَزِنُوا۟ بِٱلْقِسْطَاسِ ٱلْمُسْتَقِيمِ ۚ ذَٰلِكَ خَيْرٌ وَأَحْسَنُ تَأْوِيلًا
    arabicPlain: وأوفوا الكيل إذا كلتم وزنوا بالقسطاس المستقيم ۚ ذلك خير وأحسن تأويلا
    surahName: Al-Israa
