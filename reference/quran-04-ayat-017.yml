    scripture: quran
    name: Quran 17:13
    chapter: 17
    verse: 13
    ordinal: 2042
    text: And every man's augury have We fastened to his own neck, and We shall bring forth for him on the Day of Resurrection a book which he will find wide open.
    translation: Pickthall
    original: وَكُلَّ إِنسَـٰنٍ أَلْزَمْنَـٰهُ طَـٰٓئِرَهُۥ فِى عُنُقِهِۦ ۖ وَنُخْرِجُ لَهُۥ يَوْمَ ٱلْقِيَـٰمَةِ كِتَـٰبًا يَلْقَىٰهُ مَنشُورًا
    arabicPlain: وكل إنسان ألزمناه طائره في عنقه ۖ ونخرج له يوم القيامة كتابا يلقاه منشورا
    surahName: Al-Israa
