    scripture: quran
    name: Quran 17:32
    chapter: 17
    verse: 32
    ordinal: 2061
    text: And come not near unto adultery. Lo! it is an abomination and an evil way.
    translation: Pickthall
    original: وَلَا تَقْرَبُوا۟ ٱلزِّنَىٰٓ ۖ إِنَّهُۥ كَانَ فَـٰحِشَةً وَسَآءَ سَبِيلًا
    arabicPlain: ولا تقربوا الزنى ۖ إنه كان فاحشة وساء سبيلا
    surahName: Al-Israa
    juz: 15
    manzil: 4
