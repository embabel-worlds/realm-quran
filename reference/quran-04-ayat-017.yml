  data:
    ref: '17:56'
    scripture: quran
    name: Quran 17:56
    chapter: 17
    verse: 56
    ordinal: 2085
    text: 'Say: Cry unto those (saints and angels) whom ye assume (to be gods) beside Him, yet they have no power to rid you of misfortune nor to change.'
    translation: Pickthall
    original: قُلِ ٱدْعُوا۟ ٱلَّذِينَ زَعَمْتُم مِّن دُونِهِۦ فَلَا يَمْلِكُونَ كَشْفَ ٱلضُّرِّ عَنكُمْ وَلَا تَحْوِيلًا
    arabicPlain: قل ادعوا الذين زعمتم من دونه فلا يملكون كشف الضر عنكم ولا تحويلا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 245
