    name: Quran 17:83
    chapter: 17
    verse: 83
    ordinal: 2112
    text: And when We make life pleasant unto man, he turneth away and is averse; and when ill toucheth him he is in despair.
    translation: Pickthall
    original: وَإِذَآ أَنْعَمْنَا عَلَى ٱلْإِنسَـٰنِ أَعْرَضَ وَنَـَٔا بِجَانِبِهِۦ ۖ وَإِذَا مَسَّهُ ٱلشَّرُّ كَانَ يَـُٔوسًا
