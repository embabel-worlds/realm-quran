    scripture: quran
    name: Quran 17:108
    chapter: 17
    verse: 108
    ordinal: 2137
    text: 'Saying: Glory to our Lord! Verily the promise of our Lord must be fulfilled.'
    translation: Pickthall
    original: وَيَقُولُونَ سُبْحَـٰنَ رَبِّنَآ إِن كَانَ وَعْدُ رَبِّنَا لَمَفْعُولًا
    arabicPlain: ويقولون سبحان ربنا إن كان وعد ربنا لمفعولا
    surahName: Al-Israa
    juz: 15
