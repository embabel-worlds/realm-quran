  data:
    ref: 17:63
    scripture: quran
    name: Quran 17:63
    chapter: 17
    verse: 63
    ordinal: 2092
    text: 'He said: Go, and whosoever of them followeth thee - lo! hell will be your payment, ample payment.'
    translation: Pickthall
    original: قَالَ ٱذْهَبْ فَمَن تَبِعَكَ مِنْهُمْ فَإِنَّ جَهَنَّمَ جَزَآؤُكُمْ جَزَآءً مَّوْفُورًا
    arabicPlain: قال اذهب فمن تبعك منهم فإن جهنم جزاؤكم جزاء موفورا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 246
    page: 288
