    chapter: 17
    verse: 21
    ordinal: 2050
    text: See how We prefer one of them above another, and verily the Hereafter will be greater in degrees and greater in preferment.
    translation: Pickthall
    original: ٱنظُرْ كَيْفَ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٍ ۚ وَلَلْـَٔاخِرَةُ أَكْبَرُ دَرَجَـٰتٍ وَأَكْبَرُ تَفْضِيلًا
