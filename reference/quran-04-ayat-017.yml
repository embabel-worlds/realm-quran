    scripture: quran
    name: Quran 17:52
    chapter: 17
    verse: 52
    ordinal: 2081
    text: A day when He will call you and ye will answer with His praise, and ye will think that ye have tarried but a little while.
    translation: Pickthall
    original: يَوْمَ يَدْعُوكُمْ فَتَسْتَجِيبُونَ بِحَمْدِهِۦ وَتَظُنُّونَ إِن لَّبِثْتُمْ إِلَّا قَلِيلًا
    arabicPlain: يوم يدعوكم فتستجيبون بحمده وتظنون إن لبثتم إلا قليلا
