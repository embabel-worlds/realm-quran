  data:
    ref: 17:110
    scripture: quran
    name: Quran 17:110
    chapter: 17
    verse: 110
    ordinal: 2139
    text: 'Say (unto mankind): Cry unto Allah, or cry unto the Beneficent, unto whichsoever ye cry (it is the same). His are the most beautiful names. And thou (Muhammad), be not loud-voiced in thy worship nor yet silent therein, but follow a way between.'
    translation: Pickthall
    original: قُلِ ٱدْعُوا۟ ٱللَّهَ أَوِ ٱدْعُوا۟ ٱلرَّحْمَـٰنَ ۖ أَيًّا مَّا تَدْعُوا۟ فَلَهُ ٱلْأَسْمَآءُ ٱلْحُسْنَىٰ ۚ وَلَا تَجْهَرْ بِصَلَاتِكَ وَلَا تُخَافِتْ بِهَا وَٱبْتَغِ بَيْنَ ذَٰلِكَ سَبِيلًا
    arabicPlain: قل ادعوا الله أو ادعوا الرحمن ۖ أيا ما تدعوا فله الأسماء الحسنى ۚ ولا تجهر بصلاتك ولا تخافت بها وابتغ بين ذلك سبيلا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 251
    page: 293
