  data:
    ref: 17:97
    scripture: quran
    name: Quran 17:97
    chapter: 17
    verse: 97
    ordinal: 2126
    text: And he whom Allah guideth, he is led aright; while, as for him whom He sendeth astray, for them thou wilt find no protecting friends beside Him, and We shall assemble them on the Day of Resurrection on their faces, blind, dumb and deaf; their habitation will be hell; whenever it abateth, We increase the flame for them.
    translation: Pickthall
    original: وَمَن يَهْدِ ٱللَّهُ فَهُوَ ٱلْمُهْتَدِ ۖ وَمَن يُضْلِلْ فَلَن تَجِدَ لَهُمْ أَوْلِيَآءَ مِن دُونِهِۦ ۖ وَنَحْشُرُهُمْ يَوْمَ ٱلْقِيَـٰمَةِ عَلَىٰ وُجُوهِهِمْ عُمْيًا وَبُكْمًا وَصُمًّا ۖ مَّأْوَىٰهُمْ جَهَنَّمُ ۖ كُلَّمَا خَبَتْ زِدْنَـٰهُمْ سَعِيرًا
    arabicPlain: ومن يهد الله فهو المهتد ۖ ومن يضلل فلن تجد لهم أولياء من دونه ۖ ونحشرهم يوم القيامة على وجوههم عميا وبكما وصما ۖ مأواهم جهنم ۖ كلما خبت زدناهم سعيرا
