    ref: '17:36'
    scripture: quran
    name: Quran 17:36
    chapter: 17
    verse: 36
    ordinal: 2065
    text: (O man), follow not that whereof thou hast no knowledge. Lo! the hearing and the sight and the heart - of each of these it will be asked.
    translation: Pickthall
    original: وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِۦ عِلْمٌ ۚ إِنَّ ٱلسَّمْعَ وَٱلْبَصَرَ وَٱلْفُؤَادَ كُلُّ أُو۟لَـٰٓئِكَ كَانَ عَنْهُ مَسْـُٔولًا
    arabicPlain: ولا تقف ما ليس لك به علم ۚ إن السمع والبصر والفؤاد كل أولئك كان عنه مسئولا
