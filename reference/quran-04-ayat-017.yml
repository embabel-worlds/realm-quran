    name: Quran 17:84
    chapter: 17
    verse: 84
    ordinal: 2113
    text: 'Say: Each one doth according to his rule of conduct, and thy Lord is Best Aware of him whose way is right.'
    translation: Pickthall
    original: قُلْ كُلٌّ يَعْمَلُ عَلَىٰ شَاكِلَتِهِۦ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًا
