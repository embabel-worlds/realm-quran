    name: Quran 17:25
    chapter: 17
    verse: 25
    ordinal: 2054
    text: Your Lord is Best Aware of what is in your minds. If ye are righteous, then lo! He was ever Forgiving unto those who turn (unto Him).
    translation: Pickthall
    original: رَّبُّكُمْ أَعْلَمُ بِمَا فِى نُفُوسِكُمْ ۚ إِن تَكُونُوا۟ صَـٰلِحِينَ فَإِنَّهُۥ كَانَ لِلْأَوَّٰبِينَ غَفُورًا
    arabicPlain: ربكم أعلم بما في نفوسكم ۚ إن تكونوا صالحين فإنه كان للأوابين غفورا
