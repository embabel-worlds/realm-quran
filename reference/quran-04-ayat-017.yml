  data:
    ref: 17:101
    scripture: quran
    name: Quran 17:101
    chapter: 17
    verse: 101
    ordinal: 2130
    text: 'And verily We gave unto Moses nine tokens, clear proofs (of Allah''s Sovereignty). Do but ask the Children of Israel how he came unto them, then Pharaoh said unto him: Lo! I deem thee one bewitched, O Moses.'
    translation: Pickthall
    original: وَلَقَدْ ءَاتَيْنَا مُوسَىٰ تِسْعَ ءَايَـٰتٍۭ بَيِّنَـٰتٍ ۖ فَسْـَٔلْ بَنِىٓ إِسْرَٰٓءِيلَ إِذْ جَآءَهُمْ فَقَالَ لَهُۥ فِرْعَوْنُ إِنِّى لَأَظُنُّكَ يَـٰمُوسَىٰ مَسْحُورًا
    arabicPlain: ولقد آتينا موسى تسع آيات بينات ۖ فاسأل بني إسرائيل إذ جاءهم فقال له فرعون إني لأظنك يا موسى مسحورا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 251
