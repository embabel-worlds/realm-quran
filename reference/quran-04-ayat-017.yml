    name: Quran 17:29
    chapter: 17
    verse: 29
    ordinal: 2058
    text: And let not thy hand be chained to thy neck nor open it with a complete opening, lest thou sit down rebuked, denuded.
    translation: Pickthall
    original: وَلَا تَجْعَلْ يَدَكَ مَغْلُولَةً إِلَىٰ عُنُقِكَ وَلَا تَبْسُطْهَا كُلَّ ٱلْبَسْطِ فَتَقْعُدَ مَلُومًا مَّحْسُورًا
    arabicPlain: ولا تجعل يدك مغلولة إلى عنقك ولا تبسطها كل البسط فتقعد ملوما محسورا
