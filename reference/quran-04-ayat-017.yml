- type: Ayah
  data:
    ref: '17:5'
    scripture: quran
    name: Quran 17:5
    chapter: 17
    verse: 5
    ordinal: 2034
    text: So when the time for the first of the two came, We roused against you slaves of Ours of great might who ravaged (your) country, and it was a threat performed.
    translation: Pickthall
    original: فَإِذَا جَآءَ وَعْدُ أُولَىٰهُمَا بَعَثْنَا عَلَيْكُمْ عِبَادًا لَّنَآ أُو۟لِى بَأْسٍ شَدِيدٍ فَجَاسُوا۟ خِلَـٰلَ ٱلدِّيَارِ ۚ وَكَانَ وَعْدًا مَّفْعُولًا
    arabicPlain: فإذا جاء وعد أولاهما بعثنا عليكم عبادا لنا أولي بأس شديد فجاسوا خلال الديار ۚ وكان وعدا مفعولا
    surahName: Al-Israa
