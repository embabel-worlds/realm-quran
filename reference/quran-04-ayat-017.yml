    scripture: quran
    name: Quran 17:53
    chapter: 17
    verse: 53
    ordinal: 2082
    text: Tell My bondmen to speak that which is kindlier. Lo! the devil soweth discord among them. Lo! the devil is for man an open foe.
    translation: Pickthall
    original: وَقُل لِّعِبَادِى يَقُولُوا۟ ٱلَّتِى هِىَ أَحْسَنُ ۚ إِنَّ ٱلشَّيْطَـٰنَ يَنزَغُ بَيْنَهُمْ ۚ إِنَّ ٱلشَّيْطَـٰنَ كَانَ لِلْإِنسَـٰنِ عَدُوًّا مُّبِينًا
    arabicPlain: وقل لعبادي يقولوا التي هي أحسن ۚ إن الشيطان ينزغ بينهم ۚ إن الشيطان كان للإنسان عدوا مبينا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 245
    page: 287
