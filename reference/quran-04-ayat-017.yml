    ref: '17:55'
    scripture: quran
    name: Quran 17:55
    chapter: 17
    verse: 55
    ordinal: 2084
    text: And thy Lord is Best Aware of all who are in the heavens and the earth. And we preferred some of the prophets above others, and unto David We gave the Psalms.
    translation: Pickthall
    original: وَرَبُّكَ أَعْلَمُ بِمَن فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۗ وَلَقَدْ فَضَّلْنَا بَعْضَ ٱلنَّبِيِّـۧنَ عَلَىٰ بَعْضٍ ۖ وَءَاتَيْنَا دَاوُۥدَ زَبُورًا
    arabicPlain: وربك أعلم بمن في السماوات والأرض ۗ ولقد فضلنا بعض النبيين على بعض ۖ وآتينا داوود زبورا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 245
