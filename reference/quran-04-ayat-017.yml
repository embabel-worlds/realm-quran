  data:
    ref: '17:57'
    scripture: quran
    name: Quran 17:57
    chapter: 17
    verse: 57
    ordinal: 2086
    text: Those unto whom they cry seek the way of approach to their Lord, which of them shall be the nearest; they hope for His mercy and they fear His doom. Lo! the doom of thy Lord is to be shunned.
    translation: Pickthall
    original: أُو۟لَـٰٓئِكَ ٱلَّذِينَ يَدْعُونَ يَبْتَغُونَ إِلَىٰ رَبِّهِمُ ٱلْوَسِيلَةَ أَيُّهُمْ أَقْرَبُ وَيَرْجُونَ رَحْمَتَهُۥ وَيَخَافُونَ عَذَابَهُۥٓ ۚ إِنَّ عَذَابَ رَبِّكَ كَانَ مَحْذُورًا
    arabicPlain: أولئك الذين يدعون يبتغون إلى ربهم الوسيلة أيهم أقرب ويرجون رحمته ويخافون عذابه ۚ إن عذاب ربك كان محذورا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 245
    page: 287
