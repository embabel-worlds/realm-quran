  data:
    ref: '17:15'
    scripture: quran
    name: Quran 17:15
    chapter: 17
    verse: 15
    ordinal: 2044
    text: Whosoever goeth right, it is only for (the good of) his own soul that he goeth right, and whosoever erreth, erreth only to its hurt. No laden soul can bear another's load, We never punish until we have sent a messenger.
    translation: Pickthall
    original: مَّنِ ٱهْتَدَىٰ فَإِنَّمَا يَهْتَدِى لِنَفْسِهِۦ ۖ وَمَن ضَلَّ فَإِنَّمَا يَضِلُّ عَلَيْهَا ۚ وَلَا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَىٰ ۗ وَمَا كُنَّا مُعَذِّبِينَ حَتَّىٰ نَبْعَثَ رَسُولًا
    arabicPlain: من اهتدى فإنما يهتدي لنفسه ۖ ومن ضل فإنما يضل عليها ۚ ولا تزر وازرة وزر أخرى ۗ وما كنا معذبين حتى نبعث رسولا
    surahName: Al-Israa
    juz: 15
