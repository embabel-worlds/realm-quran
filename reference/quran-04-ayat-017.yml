    name: Quran 17:24
    chapter: 17
    verse: 24
    ordinal: 2053
    text: 'And lower unto them the wing of submission through mercy, and say: My Lord! Have mercy on them both as they did care for me when I was little.'
    translation: Pickthall
    original: وَٱخْفِضْ لَهُمَا جَنَاحَ ٱلذُّلِّ مِنَ ٱلرَّحْمَةِ وَقُل رَّبِّ ٱرْحَمْهُمَا كَمَا رَبَّيَانِى صَغِيرًا
    arabicPlain: واخفض لهما جناح الذل من الرحمة وقل رب ارحمهما كما ربياني صغيرا
