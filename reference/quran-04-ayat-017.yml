    name: Quran 17:41
    chapter: 17
    verse: 41
    ordinal: 2070
    text: We verily have displayed (Our warnings) in this Qur'an that they may take heed, but it increaseth them in naught save aversion.
    translation: Pickthall
    original: وَلَقَدْ صَرَّفْنَا فِى هَـٰذَا ٱلْقُرْءَانِ لِيَذَّكَّرُوا۟ وَمَا يَزِيدُهُمْ إِلَّا نُفُورًا
