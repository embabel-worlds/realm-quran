    scripture: quran
    name: Quran 17:89
    chapter: 17
    verse: 89
    ordinal: 2118
    text: And verily We have displayed for mankind in this Qur'an all kind of similitudes, but most of mankind refuse aught save disbelief.
    translation: Pickthall
    original: وَلَقَدْ صَرَّفْنَا لِلنَّاسِ فِى هَـٰذَا ٱلْقُرْءَانِ مِن كُلِّ مَثَلٍ فَأَبَىٰٓ أَكْثَرُ ٱلنَّاسِ إِلَّا كُفُورًا
    arabicPlain: ولقد صرفنا للناس في هذا القرآن من كل مثل فأبى أكثر الناس إلا كفورا
    surahName: Al-Israa
