    name: Quran 17:26
    chapter: 17
    verse: 26
    ordinal: 2055
    text: Give the kinsman his due, and the needy, and the wayfarer, and squander not (thy wealth) in wantonness.
    translation: Pickthall
    original: وَءَاتِ ذَا ٱلْقُرْبَىٰ حَقَّهُۥ وَٱلْمِسْكِينَ وَٱبْنَ ٱلسَّبِيلِ وَلَا تُبَذِّرْ تَبْذِيرًا
