    scripture: quran
    name: Quran 17:45
    chapter: 17
    verse: 45
    ordinal: 2074
    text: And when thou recitest the Qur'an we place between thee and those who believe not in the Hereafter a hidden barrier;
    translation: Pickthall
    original: وَإِذَا قَرَأْتَ ٱلْقُرْءَانَ جَعَلْنَا بَيْنَكَ وَبَيْنَ ٱلَّذِينَ لَا يُؤْمِنُونَ بِٱلْـَٔاخِرَةِ حِجَابًا مَّسْتُورًا
    arabicPlain: وإذا قرأت القرآن جعلنا بينك وبين الذين لا يؤمنون بالآخرة حجابا مستورا
    surahName: Al-Israa
