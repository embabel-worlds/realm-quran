  data:
    ref: 17:68
    scripture: quran
    name: Quran 17:68
    chapter: 17
    verse: 68
    ordinal: 2097
    text: Feel ye then secure that He will not cause a slope of the land to engulf you, or send a sand-storm upon you, and then ye will find that ye have no protector?
    translation: Pickthall
    original: أَفَأَمِنتُمْ أَن يَخْسِفَ بِكُمْ جَانِبَ ٱلْبَرِّ أَوْ يُرْسِلَ عَلَيْكُمْ حَاصِبًا ثُمَّ لَا تَجِدُوا۟ لَكُمْ وَكِيلًا
    arabicPlain: أفأمنتم أن يخسف بكم جانب البر أو يرسل عليكم حاصبا ثم لا تجدوا لكم وكيلا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 246
    page: 289
  relations:
  - predicate: IN
    to:
