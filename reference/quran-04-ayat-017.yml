  data:
    ref: '17:59'
    scripture: quran
    name: Quran 17:59
    chapter: 17
    verse: 59
    ordinal: 2088
    text: Naught hindereth Us from sending portents save that the folk of old denied them. And We gave Thamud the she-camel - a clear portent save to warn.
    translation: Pickthall
    original: وَمَا مَنَعَنَآ أَن نُّرْسِلَ بِٱلْـَٔايَـٰتِ إِلَّآ أَن كَذَّبَ بِهَا ٱلْأَوَّلُونَ ۚ وَءَاتَيْنَا ثَمُودَ ٱلنَّاقَةَ مُبْصِرَةً فَظَلَمُوا۟ بِهَا ۚ وَمَا نُرْسِلُ بِٱلْـَٔايَـٰتِ إِلَّا تَخْوِيفًا
    arabicPlain: وما منعنا أن نرسل بالآيات إلا أن كذب بها الأولون ۚ وآتينا ثمود الناقة مبصرة فظلموا بها ۚ وما نرسل بالآيات إلا تخويفا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 245
    page: 288
