  data:
    ref: 17:72
    scripture: quran
    name: Quran 17:72
    chapter: 17
    verse: 72
    ordinal: 2101
    text: Whoso is blind here will be blind in the Hereafter, and yet further from the road.
    translation: Pickthall
    original: وَمَن كَانَ فِى هَـٰذِهِۦٓ أَعْمَىٰ فَهُوَ فِى ٱلْـَٔاخِرَةِ أَعْمَىٰ وَأَضَلُّ سَبِيلًا
    arabicPlain: ومن كان في هذه أعمى فهو في الآخرة أعمى وأضل سبيلا
    surahName: Al-Israa
    juz: 15
    manzil: 4
    ruku: 247
    page: 289
  relations:
  - predicate: IN
    to:
      type: Surah
