    name: Quran 25:59
    chapter: 25
    verse: 59
    ordinal: 2914
    text: Who created the heavens and the earth and all that is between them in six Days, then He mounted the Throne. The Beneficent! Ask anyone informed concerning Him!
    translation: Pickthall
    original: ٱلَّذِى خَلَقَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ وَمَا بَيْنَهُمَا فِى سِتَّةِ أَيَّامٍ ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ ۚ ٱلرَّحْمَـٰنُ فَسْـَٔلْ بِهِۦ خَبِيرًا
    arabicPlain: الذي خلق السماوات والأرض وما بينهما في ستة أيام ثم استوى على العرش ۚ الرحمن فاسأل به خبيرا
    surahName: Al-Furqaan
    juz: 19
    manzil: 4
    ruku: 314
    page: 365
  relations:
