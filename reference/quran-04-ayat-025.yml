  data:
    ref: '25:58'
    scripture: quran
    name: Quran 25:58
    chapter: 25
    verse: 58
    ordinal: 2913
    text: And trust thou in the Living One Who dieth not, and hymn His praise. He sufficeth as the Knower of His bondmen's sins,
    translation: Pickthall
    original: وَتَوَكَّلْ عَلَى ٱلْحَىِّ ٱلَّذِى لَا يَمُوتُ وَسَبِّحْ بِحَمْدِهِۦ ۚ وَكَفَىٰ بِهِۦ بِذُنُوبِ عِبَادِهِۦ خَبِيرًا
    arabicPlain: وتوكل على الحي الذي لا يموت وسبح بحمده ۚ وكفى به بذنوب عباده خبيرا
    surahName: Al-Furqaan
