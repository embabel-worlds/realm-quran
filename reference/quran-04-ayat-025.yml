    verse: 11
    ordinal: 2866
    text: Nay, but they deny (the coming of) the Hour, and for those who deny (the coming of) the Hour We have prepared a flame.
    translation: Pickthall
    original: بَلْ كَذَّبُوا۟ بِٱلسَّاعَةِ ۖ وَأَعْتَدْنَا لِمَن كَذَّبَ بِٱلسَّاعَةِ سَعِيرًا
    arabicPlain: بل كذبوا بالساعة ۖ وأعتدنا لمن كذب بالساعة سعيرا
