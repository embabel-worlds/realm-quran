    name: Quran 25:67
    chapter: 25
    verse: 67
    ordinal: 2922
    text: And those who, when they spend, are neither prodigal nor grudging; and there is ever a firm station between the two;
    translation: Pickthall
    original: وَٱلَّذِينَ إِذَآ أَنفَقُوا۟ لَمْ يُسْرِفُوا۟ وَلَمْ يَقْتُرُوا۟ وَكَانَ بَيْنَ ذَٰلِكَ قَوَامًا
