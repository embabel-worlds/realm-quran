  data:
    ref: '25:5'
    scripture: quran
    name: Quran 25:5
    chapter: 25
    verse: 5
    ordinal: 2860
    text: 'And they say: Fables of the men of old which he hath had written down so that they are dictated to him morn and evening.'
    translation: Pickthall
    original: وَقَالُوٓا۟ أَسَـٰطِيرُ ٱلْأَوَّلِينَ ٱكْتَتَبَهَا فَهِىَ تُمْلَىٰ عَلَيْهِ بُكْرَةً وَأَصِيلًا
    arabicPlain: وقالوا أساطير الأولين اكتتبها فهي تملى عليه بكرة وأصيلا
    surahName: Al-Furqaan
    juz: 18
