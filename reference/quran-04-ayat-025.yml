  data:
    ref: '25:6'
    scripture: quran
    name: Quran 25:6
    chapter: 25
    verse: 6
    ordinal: 2861
    text: 'Say (unto them, O Muhammad): He who knoweth the secret of the heavens and the earth hath revealed it. Lo! He ever is Forgiving, Merciful.'
    translation: Pickthall
    original: قُلْ أَنزَلَهُ ٱلَّذِى يَعْلَمُ ٱلسِّرَّ فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۚ إِنَّهُۥ كَانَ غَفُورًا رَّحِيمًا
    arabicPlain: قل أنزله الذي يعلم السر في السماوات والأرض ۚ إنه كان غفورا رحيما
    surahName: Al-Furqaan
    juz: 18
    manzil: 4
    ruku: 310
