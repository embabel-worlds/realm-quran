    name: Quran 25:42
    chapter: 25
    verse: 42
    ordinal: 2897
    text: He would have led us far away from our gods if we had not been staunch to them. They will know, when they behold the doom, who is more astray as to the road.
    translation: Pickthall
    original: إِن كَادَ لَيُضِلُّنَا عَنْ ءَالِهَتِنَا لَوْلَآ أَن صَبَرْنَا عَلَيْهَا ۚ وَسَوْفَ يَعْلَمُونَ حِينَ يَرَوْنَ ٱلْعَذَابَ مَنْ أَضَلُّ سَبِيلًا
    arabicPlain: إن كاد ليضلنا عن آلهتنا لولا أن صبرنا عليها ۚ وسوف يعلمون حين يرون العذاب من أضل سبيلا
