    name: Quran 25:9
    chapter: 25
    verse: 9
    ordinal: 2864
    text: See how they coin similitudes for thee, so that they are all astray and cannot find a road!
    translation: Pickthall
    original: ٱنظُرْ كَيْفَ ضَرَبُوا۟ لَكَ ٱلْأَمْثَـٰلَ فَضَلُّوا۟ فَلَا يَسْتَطِيعُونَ سَبِيلًا
    arabicPlain: انظر كيف ضربوا لك الأمثال فضلوا فلا يستطيعون سبيلا
    surahName: Al-Furqaan
