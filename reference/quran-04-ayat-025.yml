- type: Ayah
  data:
    ref: '25:8'
    scripture: quran
    name: Quran 25:8
    chapter: 25
    verse: 8
    ordinal: 2863
    text: 'Or (why is not) treasure thrown down unto him, or why hath he not a paradise from whence to eat? And the evil-doers say: Ye are but following a man bewitched.'
    translation: Pickthall
    original: أَوْ يُلْقَىٰٓ إِلَيْهِ كَنزٌ أَوْ تَكُونُ لَهُۥ جَنَّةٌ يَأْكُلُ مِنْهَا ۚ وَقَالَ ٱلظَّـٰلِمُونَ إِن تَتَّبِعُونَ إِلَّا رَجُلًا مَّسْحُورًا
    arabicPlain: أو يلقى إليه كنز أو تكون له جنة يأكل منها ۚ وقال الظالمون إن تتبعون إلا رجلا مسحورا
    surahName: Al-Furqaan
    juz: 18
    manzil: 4
    ruku: 310
