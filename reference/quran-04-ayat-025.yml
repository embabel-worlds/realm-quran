    name: Quran 25:16
    chapter: 25
    verse: 16
    ordinal: 2871
    text: Therein abiding, they have all that they desire. It is for thy Lord a promise that must be fulfilled.
    translation: Pickthall
    original: لَّهُمْ فِيهَا مَا يَشَآءُونَ خَـٰلِدِينَ ۚ كَانَ عَلَىٰ رَبِّكَ وَعْدًا مَّسْـُٔولًا
    arabicPlain: لهم فيها ما يشاءون خالدين ۚ كان على ربك وعدا مسئولا
