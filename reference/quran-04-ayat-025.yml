- type: Ayah
  data:
    ref: '25:7'
    scripture: quran
    name: Quran 25:7
    chapter: 25
    verse: 7
    ordinal: 2862
    text: 'And they say: What aileth this messenger (of Allah) that he eateth food and walketh in the markets? Why is not an angel sent down unto him, to be a warner with him.'
    translation: Pickthall
    original: وَقَالُوا۟ مَالِ هَـٰذَا ٱلرَّسُولِ يَأْكُلُ ٱلطَّعَامَ وَيَمْشِى فِى ٱلْأَسْوَاقِ ۙ لَوْلَآ أُنزِلَ إِلَيْهِ مَلَكٌ فَيَكُونَ مَعَهُۥ نَذِيرًا
    arabicPlain: وقالوا مال هذا الرسول يأكل الطعام ويمشي في الأسواق ۙ لولا أنزل إليه ملك فيكون معه نذيرا
    surahName: Al-Furqaan
    juz: 18
    manzil: 4
    ruku: 310
    page: 360
