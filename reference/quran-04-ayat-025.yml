    name: Quran 25:47
    chapter: 25
    verse: 47
    ordinal: 2902
    text: And He it is Who maketh night a covering for you, and sleep repose, and maketh day a resurrection.
    translation: Pickthall
    original: وَهُوَ ٱلَّذِى جَعَلَ لَكُمُ ٱلَّيْلَ لِبَاسًا وَٱلنَّوْمَ سُبَاتًا وَجَعَلَ ٱلنَّهَارَ نُشُورًا
