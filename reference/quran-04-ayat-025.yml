    text: And indeed they have passed by the township whereon was rained the fatal rain. Can it be that they have not seen it? Nay, but they hope for no resurrection.
    translation: Pickthall
    original: وَلَقَدْ أَتَوْا۟ عَلَى ٱلْقَرْيَةِ ٱلَّتِىٓ أُمْطِرَتْ مَطَرَ ٱلسَّوْءِ ۚ أَفَلَمْ يَكُونُوا۟ يَرَوْنَهَا ۚ بَلْ كَانُوا۟ لَا يَرْجُونَ نُشُورًا
    arabicPlain: ولقد أتوا على القرية التي أمطرت مطر السوء ۚ أفلم يكونوا يرونها ۚ بل كانوا لا يرجون نشورا
    surahName: Al-Furqaan
    juz: 19
    manzil: 4
