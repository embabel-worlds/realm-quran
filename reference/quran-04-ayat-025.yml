    name: Quran 25:77
    chapter: 25
    verse: 77
    ordinal: 2932
    text: 'Say (O Muhammad, unto the disbelievers): My Lord would not concern Himself with you but for your prayer. But now ye have denied (the Truth), therefor there will be judgment.'
    translation: Pickthall
    original: قُلْ مَا يَعْبَؤُا۟ بِكُمْ رَبِّى لَوْلَا دُعَآؤُكُمْ ۖ فَقَدْ كَذَّبْتُمْ فَسَوْفَ يَكُونُ لِزَامًۢا
    arabicPlain: قل ما يعبأ بكم ربي لولا دعاؤكم ۖ فقد كذبتم فسوف يكون لزاما
