    name: Quran 25:55
    chapter: 25
    verse: 55
    ordinal: 2910
    text: Yet they worship instead of Allah that which can neither benefit them nor hurt them. The disbeliever was ever a partisan against his Lord.
    translation: Pickthall
    original: وَيَعْبُدُونَ مِن دُونِ ٱللَّهِ مَا لَا يَنفَعُهُمْ وَلَا يَضُرُّهُمْ ۗ وَكَانَ ٱلْكَافِرُ عَلَىٰ رَبِّهِۦ ظَهِيرًا
    arabicPlain: ويعبدون من دون الله ما لا ينفعهم ولا يضرهم ۗ وكان الكافر على ربه ظهيرا
