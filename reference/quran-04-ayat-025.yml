- type: Ayah
  data:
    ref: '25:4'
    scripture: quran
    name: Quran 25:4
    chapter: 25
    verse: 4
    ordinal: 2859
    text: 'Those who disbelieve say: This is naught but a lie that he hath invented, and other folk have helped him with it, so that they have produced a slander and a lie.'
    translation: Pickthall
    original: وَقَالَ ٱلَّذِينَ كَفَرُوٓا۟ إِنْ هَـٰذَآ إِلَّآ إِفْكٌ ٱفْتَرَىٰهُ وَأَعَانَهُۥ عَلَيْهِ قَوْمٌ ءَاخَرُونَ ۖ فَقَدْ جَآءُو ظُلْمًا وَزُورًا
    arabicPlain: وقال الذين كفروا إن هذا إلا إفك افتراه وأعانه عليه قوم آخرون ۖ فقد جاءوا ظلما وزورا
    surahName: Al-Furqaan
    juz: 18
    manzil: 4
    ruku: 310
    page: 360
