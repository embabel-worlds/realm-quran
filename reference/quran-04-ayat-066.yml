- type: Ayah
  data:
    ref: '66:9'
    scripture: quran
    name: Quran 66:9
    chapter: 66
    verse: 9
    ordinal: 5238
    text: O Prophet! Strive against the disbelievers and the hypocrites, and be stern with them. Hell will be their home, a hapless journey's end.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلنَّبِىُّ جَـٰهِدِ ٱلْكُفَّارَ وَٱلْمُنَـٰفِقِينَ وَٱغْلُظْ عَلَيْهِمْ ۚ وَمَأْوَىٰهُمْ جَهَنَّمُ ۖ وَبِئْسَ ٱلْمَصِيرُ
    arabicPlain: يا أيها النبي جاهد الكفار والمنافقين واغلظ عليهم ۚ ومأواهم جهنم ۖ وبئس المصير
    surahName: At-Tahrim
    juz: 28
    manzil: 7
    ruku: 495
    page: 561
