- type: Ayah
  data:
    ref: '66:2'
    scripture: quran
    name: Quran 66:2
    chapter: 66
    verse: 2
    ordinal: 5231
    text: Allah hath made lawful for you (Muslims) absolution from your oaths (of such a kind), and Allah is your Protector. He is the Knower, the Wise.
    translation: Pickthall
    original: قَدْ فَرَضَ ٱللَّهُ لَكُمْ تَحِلَّةَ أَيْمَـٰنِكُمْ ۚ وَٱللَّهُ مَوْلَىٰكُمْ ۖ وَهُوَ ٱلْعَلِيمُ ٱلْحَكِيمُ
    arabicPlain: قد فرض الله لكم تحلة أيمانكم ۚ والله مولاكم ۖ وهو العليم الحكيم
    surahName: At-Tahrim
    juz: 28
    manzil: 7
    ruku: 494
