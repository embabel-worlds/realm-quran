- type: Ayah
  data:
    ref: '66:7'
    scripture: quran
    name: Quran 66:7
    chapter: 66
    verse: 7
    ordinal: 5236
    text: '(Then it will be said): O ye who disbelieve! Make no excuses for yourselves this day. Ye are only being paid for what ye used to do.'
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ كَفَرُوا۟ لَا تَعْتَذِرُوا۟ ٱلْيَوْمَ ۖ إِنَّمَا تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَ
    arabicPlain: يا أيها الذين كفروا لا تعتذروا اليوم ۖ إنما تجزون ما كنتم تعملون
    surahName: At-Tahrim
    juz: 28
    manzil: 7
    ruku: 494
    page: 560
