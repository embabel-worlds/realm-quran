- type: Ayah
  data:
    ref: '66:12'
    scripture: quran
    name: Quran 66:12
    chapter: 66
    verse: 12
    ordinal: 5241
    text: And Mary, daughter of 'Imran, whose body was chaste, therefor We breathed therein something of Our Spirit. And she put faith in the words of her Lord and His scriptures, and was of the obedient.
    translation: Pickthall
    original: وَمَرْيَمَ ٱبْنَتَ عِمْرَٰنَ ٱلَّتِىٓ أَحْصَنَتْ فَرْجَهَا فَنَفَخْنَا فِيهِ مِن رُّوحِنَا وَصَدَّقَتْ بِكَلِمَـٰتِ رَبِّهَا وَكُتُبِهِۦ وَكَانَتْ مِنَ ٱلْقَـٰنِتِينَ
    arabicPlain: ومريم ابنت عمران التي أحصنت فرجها فنفخنا فيه من روحنا وصدقت بكلمات ربها وكتبه وكانت من القانتين
    surahName: At-Tahrim
    juz: 28
    manzil: 7
    ruku: 495
    page: 561
