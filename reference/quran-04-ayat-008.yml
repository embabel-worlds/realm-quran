  data:
    ref: '8:47'
    scripture: quran
    name: Quran 8:47
    chapter: 8
    verse: 47
    ordinal: 1207
    text: Be not as those who came forth from their dwellings boastfully and to be seen of men, and debar (men) from the way of Allah, while Allah is surrounding all they do.
    translation: Pickthall
    original: وَلَا تَكُونُوا۟ كَٱلَّذِينَ خَرَجُوا۟ مِن دِيَـٰرِهِم بَطَرًا وَرِئَآءَ ٱلنَّاسِ وَيَصُدُّونَ عَن سَبِيلِ ٱللَّهِ ۚ وَٱللَّهُ بِمَا يَعْمَلُونَ مُحِيطٌ
    arabicPlain: ولا تكونوا كالذين خرجوا من ديارهم بطرا ورئاء الناس ويصدون عن سبيل الله ۚ والله بما يعملون محيط
    surahName: Al-Anfaal
    juz: 10
    manzil: 2
    ruku: 151
