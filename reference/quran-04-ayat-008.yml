  data:
    ref: '8:33'
    scripture: quran
    name: Quran 8:33
    chapter: 8
    verse: 33
    ordinal: 1193
    text: But Allah would not punish them while thou wast with them, nor will He punish them while they seek forgiveness.
    translation: Pickthall
    original: وَمَا كَانَ ٱللَّهُ لِيُعَذِّبَهُمْ وَأَنتَ فِيهِمْ ۚ وَمَا كَانَ ٱللَّهُ مُعَذِّبَهُمْ وَهُمْ يَسْتَغْفِرُونَ
    arabicPlain: وما كان الله ليعذبهم وأنت فيهم ۚ وما كان الله معذبهم وهم يستغفرون
    surahName: Al-Anfaal
    juz: 9
    manzil: 2
    ruku: 149
    page: 180
  relations:
