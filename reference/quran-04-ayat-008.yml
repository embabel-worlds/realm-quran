  data:
    ref: '8:46'
    scripture: quran
    name: Quran 8:46
    chapter: 8
    verse: 46
    ordinal: 1206
    text: And obey Allah and His messenger, and dispute not one with another lest ye falter and your strength depart from you; but be steadfast! Lo! Allah is with the steadfast.
    translation: Pickthall
    original: وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥ وَلَا تَنَـٰزَعُوا۟ فَتَفْشَلُوا۟ وَتَذْهَبَ رِيحُكُمْ ۖ وَٱصْبِرُوٓا۟ ۚ إِنَّ ٱللَّهَ مَعَ ٱلصَّـٰبِرِينَ
    arabicPlain: وأطيعوا الله ورسوله ولا تنازعوا فتفشلوا وتذهب ريحكم ۖ واصبروا ۚ إن الله مع الصابرين
    surahName: Al-Anfaal
    juz: 10
    manzil: 2
    ruku: 151
