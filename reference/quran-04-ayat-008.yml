  data:
    ref: '8:39'
    scripture: quran
    name: Quran 8:39
    chapter: 8
    verse: 39
    ordinal: 1199
    text: And fight them until persecution is no more, and religion is all for Allah. But if they cease, then lo! Allah is Seer of what they do.
    translation: Pickthall
    original: وَقَـٰتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٌ وَيَكُونَ ٱلدِّينُ كُلُّهُۥ لِلَّهِ ۚ فَإِنِ ٱنتَهَوْا۟ فَإِنَّ ٱللَّهَ بِمَا يَعْمَلُونَ بَصِيرٌ
    arabicPlain: وقاتلوهم حتى لا تكون فتنة ويكون الدين كله لله ۚ فإن انتهوا فإن الله بما يعملون بصير
    surahName: Al-Anfaal
