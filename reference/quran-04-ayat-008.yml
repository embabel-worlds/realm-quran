  data:
    ref: '8:32'
    scripture: quran
    name: Quran 8:32
    chapter: 8
    verse: 32
    ordinal: 1192
    text: 'And when they said: O Allah! If this be indeed the truth from Thee, then rain down stones on us or bring on us some painful doom!'
    translation: Pickthall
    original: وَإِذْ قَالُوا۟ ٱللَّهُمَّ إِن كَانَ هَـٰذَا هُوَ ٱلْحَقَّ مِنْ عِندِكَ فَأَمْطِرْ عَلَيْنَا حِجَارَةً مِّنَ ٱلسَّمَآءِ أَوِ ٱئْتِنَا بِعَذَابٍ أَلِيمٍ
    arabicPlain: وإذ قالوا اللهم إن كان هذا هو الحق من عندك فأمطر علينا حجارة من السماء أو ائتنا بعذاب أليم
    surahName: Al-Anfaal
    juz: 9
    manzil: 2
    ruku: 149
    page: 180
  relations:
