  data:
    ref: '8:17'
    scripture: quran
    name: Quran 8:17
    chapter: 8
    verse: 17
    ordinal: 1177
    text: Ye (Muslims) slew them not, but Allah slew them. And thou (Muhammad) threwest not when thou didst throw, but Allah threw, that He might test the believers by a fair test from Him. Lo! Allah is Hearer, Knower.
    translation: Pickthall
    original: فَلَمْ تَقْتُلُوهُمْ وَلَـٰكِنَّ ٱللَّهَ قَتَلَهُمْ ۚ وَمَا رَمَيْتَ إِذْ رَمَيْتَ وَلَـٰكِنَّ ٱللَّهَ رَمَىٰ ۚ وَلِيُبْلِىَ ٱلْمُؤْمِنِينَ مِنْهُ بَلَآءً حَسَنًا ۚ إِنَّ ٱللَّهَ سَمِيعٌ عَلِيمٌ
    arabicPlain: فلم تقتلوهم ولكن الله قتلهم ۚ وما رميت إذ رميت ولكن الله رمى ۚ وليبلي المؤمنين منه بلاء حسنا ۚ إن الله سميع عليم
    surahName: Al-Anfaal
