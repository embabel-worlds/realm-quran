    chapter: 8
    verse: 6
    ordinal: 1166
    text: Disputing with thee of the Truth after it had been made manifest, as if they were being driven to death visible.
    translation: Pickthall
    original: يُجَـٰدِلُونَكَ فِى ٱلْحَقِّ بَعْدَ مَا تَبَيَّنَ كَأَنَّمَا يُسَاقُونَ إِلَى ٱلْمَوْتِ وَهُمْ يَنظُرُونَ
