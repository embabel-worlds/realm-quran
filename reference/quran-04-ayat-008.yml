    scripture: quran
    name: Quran 8:52
    chapter: 8
    verse: 52
    ordinal: 1212
    text: (Their way is) as the way of Pharaoh's folk and those before them; they disbelieved the revelations of Allah, and Allah took them in their sins. Lo! Allah is Strong, severe in punishment.
    translation: Pickthall
    original: كَدَأْبِ ءَالِ فِرْعَوْنَ ۙ وَٱلَّذِينَ مِن قَبْلِهِمْ ۚ كَفَرُوا۟ بِـَٔايَـٰتِ ٱللَّهِ فَأَخَذَهُمُ ٱللَّهُ بِذُنُوبِهِمْ ۗ إِنَّ ٱللَّهَ قَوِىٌّ شَدِيدُ ٱلْعِقَابِ
    arabicPlain: كدأب آل فرعون ۙ والذين من قبلهم ۚ كفروا بآيات الله فأخذهم الله بذنوبهم ۗ إن الله قوي شديد العقاب
    surahName: Al-Anfaal
    juz: 10
