  data:
    ref: 8:63
    scripture: quran
    name: Quran 8:63
    chapter: 8
    verse: 63
    ordinal: 1223
    text: And (as for the believers) hath attuned their hearts. If thou hadst spent all that is in the earth thou couldst not have attuned their hearts, but Allah hath attuned them. Lo! He is Mighty, Wise.
    translation: Pickthall
    original: وَأَلَّفَ بَيْنَ قُلُوبِهِمْ ۚ لَوْ أَنفَقْتَ مَا فِى ٱلْأَرْضِ جَمِيعًا مَّآ أَلَّفْتَ بَيْنَ قُلُوبِهِمْ وَلَـٰكِنَّ ٱللَّهَ أَلَّفَ بَيْنَهُمْ ۚ إِنَّهُۥ عَزِيزٌ حَكِيمٌ
    arabicPlain: وألف بين قلوبهم ۚ لو أنفقت ما في الأرض جميعا ما ألفت بين قلوبهم ولكن الله ألف بينهم ۚ إنه عزيز حكيم
    surahName: Al-Anfaal
    juz: 10
    manzil: 2
    ruku: 153
