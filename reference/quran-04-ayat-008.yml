    scripture: quran
    name: Quran 8:15
    chapter: 8
    verse: 15
    ordinal: 1175
    text: O ye who believe! When ye meet those who disbelieve in battle, turn not your backs to them.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا لَقِيتُمُ ٱلَّذِينَ كَفَرُوا۟ زَحْفًا فَلَا تُوَلُّوهُمُ ٱلْأَدْبَارَ
