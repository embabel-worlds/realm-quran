  data:
    ref: 8:66
    scripture: quran
    name: Quran 8:66
    chapter: 8
    verse: 66
    ordinal: 1226
    text: Now hath Allah lightened your burden, for He knoweth that there is weakness in you. So if there be of you a steadfast hundred they shall overcome two hundred, and if there be of you a thousand (steadfast) they shall overcome two thousand by permission of Allah. Allah is with the steadfast.
    translation: Pickthall
    original: ٱلْـَٔـٰنَ خَفَّفَ ٱللَّهُ عَنكُمْ وَعَلِمَ أَنَّ فِيكُمْ ضَعْفًا ۚ فَإِن يَكُن مِّنكُم مِّا۟ئَةٌ صَابِرَةٌ يَغْلِبُوا۟ مِا۟ئَتَيْنِ ۚ وَإِن يَكُن مِّنكُمْ أَلْفٌ يَغْلِبُوٓا۟ أَلْفَيْنِ بِإِذْنِ ٱللَّهِ ۗ وَٱللَّهُ مَعَ ٱلصَّـٰبِرِينَ
    arabicPlain: الآن خفف الله عنكم وعلم أن فيكم ضعفا ۚ فإن يكن منكم مائة صابرة يغلبوا مائتين ۚ وإن يكن منكم ألف يغلبوا ألفين بإذن الله ۗ والله مع الصابرين
    surahName: Al-Anfaal
    juz: 10
    manzil: 2
    ruku: 154
    page: 185
  relations:
