  data:
    ref: '8:56'
    scripture: quran
    name: Quran 8:56
    chapter: 8
    verse: 56
    ordinal: 1216
    text: Those of them with whom thou madest a treaty, and then at every opportunity they break their treaty, and they keep not duty (to Allah).
    translation: Pickthall
    original: ٱلَّذِينَ عَـٰهَدتَّ مِنْهُمْ ثُمَّ يَنقُضُونَ عَهْدَهُمْ فِى كُلِّ مَرَّةٍ وَهُمْ لَا يَتَّقُونَ
    arabicPlain: الذين عاهدت منهم ثم ينقضون عهدهم في كل مرة وهم لا يتقون
