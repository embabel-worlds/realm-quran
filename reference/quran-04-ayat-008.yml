- type: Ayah
  data:
    ref: '8:1'
    scripture: quran
    name: Quran 8:1
    chapter: 8
    verse: 1
    ordinal: 1161
    text: 'They ask thee (O Muhammad) of the spoils of war. Say: The spoils of war belong to Allah and the messenger, so keep your duty to Allah, and adjust the matter of your difference, and obey Allah and His messenger, if ye are (true) believers.'
    translation: Pickthall
    original: بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ يَسْـَٔلُونَكَ عَنِ ٱلْأَنفَالِ ۖ قُلِ ٱلْأَنفَالُ لِلَّهِ وَٱلرَّسُولِ ۖ فَٱتَّقُوا۟ ٱللَّهَ وَأَصْلِحُوا۟ ذَاتَ بَيْنِكُمْ ۖ وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥٓ إِن كُنتُم مُّؤْمِنِينَ
    arabicPlain: بسم الله الرحمن الرحيم يسألونك عن الأنفال ۖ قل الأنفال لله والرسول ۖ فاتقوا الله وأصلحوا ذات بينكم ۖ وأطيعوا الله ورسوله إن كنتم مؤمنين
    surahName: Al-Anfaal
