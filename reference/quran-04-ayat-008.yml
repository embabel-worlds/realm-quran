    name: Quran 8:25
    chapter: 8
    verse: 25
    ordinal: 1185
    text: And guard yourselves against a chastisement which cannot fall exclusively on those of you who are wrong-doers, and know that Allah is severe in punishment.
    translation: Pickthall
    original: وَٱتَّقُوا۟ فِتْنَةً لَّا تُصِيبَنَّ ٱلَّذِينَ ظَلَمُوا۟ مِنكُمْ خَآصَّةً ۖ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ
    arabicPlain: واتقوا فتنة لا تصيبن الذين ظلموا منكم خاصة ۖ واعلموا أن الله شديد العقاب
