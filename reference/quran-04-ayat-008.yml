  data:
    ref: '8:59'
    scripture: quran
    name: Quran 8:59
    chapter: 8
    verse: 59
    ordinal: 1219
    text: And let not those who disbelieve suppose that they can outstrip (Allah's Purpose). Lo! they cannot escape.
    translation: Pickthall
    original: وَلَا يَحْسَبَنَّ ٱلَّذِينَ كَفَرُوا۟ سَبَقُوٓا۟ ۚ إِنَّهُمْ لَا يُعْجِزُونَ
    arabicPlain: ولا يحسبن الذين كفروا سبقوا ۚ إنهم لا يعجزون
