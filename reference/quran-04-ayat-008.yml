  data:
    ref: '8:45'
    scripture: quran
    name: Quran 8:45
    chapter: 8
    verse: 45
    ordinal: 1205
    text: O ye who believe! When ye meet an army, hold firm and think of Allah much, that ye may be successful.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا لَقِيتُمْ فِئَةً فَٱثْبُتُوا۟ وَٱذْكُرُوا۟ ٱللَّهَ كَثِيرًا لَّعَلَّكُمْ تُفْلِحُونَ
    arabicPlain: يا أيها الذين آمنوا إذا لقيتم فئة فاثبتوا واذكروا الله كثيرا لعلكم تفلحون
    surahName: Al-Anfaal
