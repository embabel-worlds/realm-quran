  data:
    ref: '8:49'
    scripture: quran
    name: Quran 8:49
    chapter: 8
    verse: 49
    ordinal: 1209
    text: 'When the hypocrites and those in whose hearts is a disease said: Their religion hath deluded these. Whoso putteth his trust in Allah (will find that) lo! Allah is Mighty, Wise.'
    translation: Pickthall
    original: إِذْ يَقُولُ ٱلْمُنَـٰفِقُونَ وَٱلَّذِينَ فِى قُلُوبِهِم مَّرَضٌ غَرَّ هَـٰٓؤُلَآءِ دِينُهُمْ ۗ وَمَن يَتَوَكَّلْ عَلَى ٱللَّهِ فَإِنَّ ٱللَّهَ عَزِيزٌ حَكِيمٌ
    arabicPlain: إذ يقول المنافقون والذين في قلوبهم مرض غر هؤلاء دينهم ۗ ومن يتوكل على الله فإن الله عزيز حكيم
    surahName: Al-Anfaal
    juz: 10
    manzil: 2
    ruku: 152
    page: 183
