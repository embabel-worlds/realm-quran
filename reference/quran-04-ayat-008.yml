  data:
    ref: 8:67
    scripture: quran
    name: Quran 8:67
    chapter: 8
    verse: 67
    ordinal: 1227
    text: It is not for any prophet to have captives until he hath made slaughter in the land. Ye desire the lure of this world and Allah desireth (for you) the Hereafter, and Allah is Mighty, Wise.
    translation: Pickthall
    original: مَا كَانَ لِنَبِىٍّ أَن يَكُونَ لَهُۥٓ أَسْرَىٰ حَتَّىٰ يُثْخِنَ فِى ٱلْأَرْضِ ۚ تُرِيدُونَ عَرَضَ ٱلدُّنْيَا وَٱللَّهُ يُرِيدُ ٱلْـَٔاخِرَةَ ۗ وَٱللَّهُ عَزِيزٌ حَكِيمٌ
    arabicPlain: ما كان لنبي أن يكون له أسرى حتى يثخن في الأرض ۚ تريدون عرض الدنيا والله يريد الآخرة ۗ والله عزيز حكيم
