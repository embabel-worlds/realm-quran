    scripture: quran
    name: Quran 8:23
    chapter: 8
    verse: 23
    ordinal: 1183
    text: Had Allah known of any good in them He would have made them hear, but had He made them hear they would have turned away, averse.
    translation: Pickthall
    original: وَلَوْ عَلِمَ ٱللَّهُ فِيهِمْ خَيْرًا لَّأَسْمَعَهُمْ ۖ وَلَوْ أَسْمَعَهُمْ لَتَوَلَّوا۟ وَّهُم مُّعْرِضُونَ
