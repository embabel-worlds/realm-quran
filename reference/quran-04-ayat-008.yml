  data:
    ref: '8:30'
    scripture: quran
    name: Quran 8:30
    chapter: 8
    verse: 30
    ordinal: 1190
    text: And when those who disbelieve plot against thee (O Muhammad) to wound thee fatally, or to kill thee or to drive thee forth; they plot, but Allah (also) plotteth; and Allah is the best of plotters.
    translation: Pickthall
    original: وَإِذْ يَمْكُرُ بِكَ ٱلَّذِينَ كَفَرُوا۟ لِيُثْبِتُوكَ أَوْ يَقْتُلُوكَ أَوْ يُخْرِجُوكَ ۚ وَيَمْكُرُونَ وَيَمْكُرُ ٱللَّهُ ۖ وَٱللَّهُ خَيْرُ ٱلْمَـٰكِرِينَ
    arabicPlain: وإذ يمكر بك الذين كفروا ليثبتوك أو يقتلوك أو يخرجوك ۚ ويمكرون ويمكر الله ۖ والله خير الماكرين
    surahName: Al-Anfaal
    juz: 9
    manzil: 2
    ruku: 149
    page: 180
