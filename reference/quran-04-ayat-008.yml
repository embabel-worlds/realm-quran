    name: Quran 8:55
    chapter: 8
    verse: 55
    ordinal: 1215
    text: Lo! the worst of beasts in Allah's sight are the ungrateful who will not believe.
    translation: Pickthall
    original: إِنَّ شَرَّ ٱلدَّوَآبِّ عِندَ ٱللَّهِ ٱلَّذِينَ كَفَرُوا۟ فَهُمْ لَا يُؤْمِنُونَ
    arabicPlain: إن شر الدواب عند الله الذين كفروا فهم لا يؤمنون
