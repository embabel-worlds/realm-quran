  data:
    ref: 8:75
    scripture: quran
    name: Quran 8:75
    chapter: 8
    verse: 75
    ordinal: 1235
    text: And those who afterwards believed and left their homes and strove along with you, they are of you; and those who are akin are nearer one to another in the ordinance of Allah. Lo! Allah is Knower of all things.
    translation: Pickthall
    original: وَٱلَّذِينَ ءَامَنُوا۟ مِنۢ بَعْدُ وَهَاجَرُوا۟ وَجَـٰهَدُوا۟ مَعَكُمْ فَأُو۟لَـٰٓئِكَ مِنكُمْ ۚ وَأُو۟لُوا۟ ٱلْأَرْحَامِ بَعْضُهُمْ أَوْلَىٰ بِبَعْضٍ فِى كِتَـٰبِ ٱللَّهِ ۗ إِنَّ ٱللَّهَ بِكُلِّ شَىْءٍ عَلِيمٌۢ
    arabicPlain: والذين آمنوا من بعد وهاجروا وجاهدوا معكم فأولئك منكم ۚ وأولو الأرحام بعضهم أولى ببعض في كتاب الله ۗ إن الله بكل شيء عليم
