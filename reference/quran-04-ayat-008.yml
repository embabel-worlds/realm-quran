  data:
    ref: '8:34'
    scripture: quran
    name: Quran 8:34
    chapter: 8
    verse: 34
    ordinal: 1194
    text: What (plea) have they that Allah should not punish them, when they debar (His servants) from the Inviolable Place of Worship, though they are not its fitting guardians. Its fitting guardians are those only who keep their duty to Allah. But most of them know not.
    translation: Pickthall
    original: وَمَا لَهُمْ أَلَّا يُعَذِّبَهُمُ ٱللَّهُ وَهُمْ يَصُدُّونَ عَنِ ٱلْمَسْجِدِ ٱلْحَرَامِ وَمَا كَانُوٓا۟ أَوْلِيَآءَهُۥٓ ۚ إِنْ أَوْلِيَآؤُهُۥٓ إِلَّا ٱلْمُتَّقُونَ وَلَـٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ
    arabicPlain: وما لهم ألا يعذبهم الله وهم يصدون عن المسجد الحرام وما كانوا أولياءه ۚ إن أولياؤه إلا المتقون ولكن أكثرهم لا يعلمون
    surahName: Al-Anfaal
    juz: 9
    manzil: 2
    ruku: 149
    page: 181
