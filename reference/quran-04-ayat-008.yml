    name: Quran 8:24
    chapter: 8
    verse: 24
    ordinal: 1184
    text: O ye who believe! Obey Allah, and the messenger when He calleth you to that which quickeneth you, and know that Allah cometh in between the man and his own heart, and that He it is unto Whom ye will be gathered.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱسْتَجِيبُوا۟ لِلَّهِ وَلِلرَّسُولِ إِذَا دَعَاكُمْ لِمَا يُحْيِيكُمْ ۖ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ يَحُولُ بَيْنَ ٱلْمَرْءِ وَقَلْبِهِۦ وَأَنَّهُۥٓ إِلَيْهِ تُحْشَرُونَ
    arabicPlain: يا أيها الذين آمنوا استجيبوا لله وللرسول إذا دعاكم لما يحييكم ۖ واعلموا أن الله يحول بين المرء وقلبه وأنه إليه تحشرون
