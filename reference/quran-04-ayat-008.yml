    scripture: quran
    name: Quran 8:64
    chapter: 8
    verse: 64
    ordinal: 1224
    text: O Prophet! Allah is Sufficient for thee and those who follow thee of the believers.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلنَّبِىُّ حَسْبُكَ ٱللَّهُ وَمَنِ ٱتَّبَعَكَ مِنَ ٱلْمُؤْمِنِينَ
    arabicPlain: يا أيها النبي حسبك الله ومن اتبعك من المؤمنين
