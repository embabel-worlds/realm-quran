    scripture: quran
    name: Quran 8:4
    chapter: 8
    verse: 4
    ordinal: 1164
    text: Those are they who are in truth believers. For them are grades (of honour) with their Lord, and pardon, and a bountiful provision.
    translation: Pickthall
