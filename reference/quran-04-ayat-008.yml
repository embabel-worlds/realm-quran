    chapter: 8
    verse: 28
    ordinal: 1188
    text: And know that your possessions and your children are a test, and that with Allah is immense reward.
    translation: Pickthall
    original: وَٱعْلَمُوٓا۟ أَنَّمَآ أَمْوَٰلُكُمْ وَأَوْلَـٰدُكُمْ فِتْنَةٌ وَأَنَّ ٱللَّهَ عِندَهُۥٓ أَجْرٌ عَظِيمٌ
