    name: Quran 8:35
    chapter: 8
    verse: 35
    ordinal: 1195
    text: 'And their worship at the (holy) House is naught but whistling and hand-clapping. Therefore (it is said unto them): Taste of the doom because ye disbelieve.'
    translation: Pickthall
    original: وَمَا كَانَ صَلَاتُهُمْ عِندَ ٱلْبَيْتِ إِلَّا مُكَآءً وَتَصْدِيَةً ۚ فَذُوقُوا۟ ٱلْعَذَابَ بِمَا كُنتُمْ تَكْفُرُونَ
    arabicPlain: وما كان صلاتهم عند البيت إلا مكاء وتصدية ۚ فذوقوا العذاب بما كنتم تكفرون
    surahName: Al-Anfaal
    juz: 9
    manzil: 2
    ruku: 149
