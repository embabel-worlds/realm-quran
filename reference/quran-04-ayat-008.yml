  data:
    ref: '8:58'
    scripture: quran
    name: Quran 8:58
    chapter: 8
    verse: 58
    ordinal: 1218
    text: And if thou fearest treachery from any folk, then throw back to them (their treaty) fairly. Lo! Allah loveth not the treacherous.
    translation: Pickthall
    original: وَإِمَّا تَخَافَنَّ مِن قَوْمٍ خِيَانَةً فَٱنۢبِذْ إِلَيْهِمْ عَلَىٰ سَوَآءٍ ۚ إِنَّ ٱللَّهَ لَا يُحِبُّ ٱلْخَآئِنِينَ
    arabicPlain: وإما تخافن من قوم خيانة فانبذ إليهم على سواء ۚ إن الله لا يحب الخائنين
    surahName: Al-Anfaal
