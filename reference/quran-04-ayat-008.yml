  data:
    ref: '8:31'
    scripture: quran
    name: Quran 8:31
    chapter: 8
    verse: 31
    ordinal: 1191
    text: 'And when Our revelations are recited unto them they say: We have heard. If we wish we can speak the like of this. Lo! this is naught but fables of the men of old.'
    translation: Pickthall
    original: وَإِذَا تُتْلَىٰ عَلَيْهِمْ ءَايَـٰتُنَا قَالُوا۟ قَدْ سَمِعْنَا لَوْ نَشَآءُ لَقُلْنَا مِثْلَ هَـٰذَآ ۙ إِنْ هَـٰذَآ إِلَّآ أَسَـٰطِيرُ ٱلْأَوَّلِينَ
    arabicPlain: وإذا تتلى عليهم آياتنا قالوا قد سمعنا لو نشاء لقلنا مثل هذا ۙ إن هذا إلا أساطير الأولين
    surahName: Al-Anfaal
    juz: 9
    manzil: 2
    ruku: 149
    page: 180
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '8'
  - predicate: IN_PORTION
