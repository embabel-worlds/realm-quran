  data:
    ref: '8:40'
    scripture: quran
    name: Quran 8:40
    chapter: 8
    verse: 40
    ordinal: 1200
    text: And if they turn away, then know that Allah is your Befriender - a Transcendent Patron, a Transcendent Helper!
    translation: Pickthall
    original: وَإِن تَوَلَّوْا۟ فَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ مَوْلَىٰكُمْ ۚ نِعْمَ ٱلْمَوْلَىٰ وَنِعْمَ ٱلنَّصِيرُ
    arabicPlain: وإن تولوا فاعلموا أن الله مولاكم ۚ نعم المولى ونعم النصير
    surahName: Al-Anfaal
    juz: 9
