    scripture: quran
    name: Quran 8:62
    chapter: 8
    verse: 62
    ordinal: 1222
    text: And if they would deceive thee, then lo! Allah is Sufficient for thee. He it is Who supporteth thee with His help and with the believers,
    translation: Pickthall
    original: وَإِن يُرِيدُوٓا۟ أَن يَخْدَعُوكَ فَإِنَّ حَسْبَكَ ٱللَّهُ ۚ هُوَ ٱلَّذِىٓ أَيَّدَكَ بِنَصْرِهِۦ وَبِٱلْمُؤْمِنِينَ
    arabicPlain: وإن يريدوا أن يخدعوك فإن حسبك الله ۚ هو الذي أيدك بنصره وبالمؤمنين
    surahName: Al-Anfaal
    juz: 10
