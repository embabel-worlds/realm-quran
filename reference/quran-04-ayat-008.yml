  data:
    ref: '8:43'
    scripture: quran
    name: Quran 8:43
    chapter: 8
    verse: 43
    ordinal: 1203
    text: When Allah showed them unto thee (O Muhammad) in thy dream as few in number, and if He had shown them to thee as many, ye (Muslims) would have faltered and would have quarrelled over the affair. But Allah saved (you). Lo! He knoweth what is in the breasts (of men).
    translation: Pickthall
    original: إِذْ يُرِيكَهُمُ ٱللَّهُ فِى مَنَامِكَ قَلِيلًا ۖ وَلَوْ أَرَىٰكَهُمْ كَثِيرًا لَّفَشِلْتُمْ وَلَتَنَـٰزَعْتُمْ فِى ٱلْأَمْرِ وَلَـٰكِنَّ ٱللَّهَ سَلَّمَ ۗ إِنَّهُۥ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ
    arabicPlain: إذ يريكهم الله في منامك قليلا ۖ ولو أراكهم كثيرا لفشلتم ولتنازعتم في الأمر ولكن الله سلم ۗ إنه عليم بذات الصدور
    surahName: Al-Anfaal
    juz: 10
    manzil: 2
    ruku: 150
    page: 182
