  data:
    ref: '8:57'
    scripture: quran
    name: Quran 8:57
    chapter: 8
    verse: 57
    ordinal: 1217
    text: If thou comest on them in the war, deal with them so as to strike fear in those who are behind them, that haply they may remember.
    translation: Pickthall
    original: فَإِمَّا تَثْقَفَنَّهُمْ فِى ٱلْحَرْبِ فَشَرِّدْ بِهِم مَّنْ خَلْفَهُمْ لَعَلَّهُمْ يَذَّكَّرُونَ
    arabicPlain: فإما تثقفنهم في الحرب فشرد بهم من خلفهم لعلهم يذكرون
    surahName: Al-Anfaal
    juz: 10
