  data:
    ref: '8:10'
    scripture: quran
    name: Quran 8:10
    chapter: 8
    verse: 10
    ordinal: 1170
    text: Allah appointed it only as good tidings, and that your hearts thereby might be at rest. Victory cometh only by the help of Allah. Lo! Allah is Mighty, Wise.
    translation: Pickthall
    original: وَمَا جَعَلَهُ ٱللَّهُ إِلَّا بُشْرَىٰ وَلِتَطْمَئِنَّ بِهِۦ قُلُوبُكُمْ ۚ وَمَا ٱلنَّصْرُ إِلَّا مِنْ عِندِ ٱللَّهِ ۚ إِنَّ ٱللَّهَ عَزِيزٌ حَكِيمٌ
    arabicPlain: وما جعله الله إلا بشرى ولتطمئن به قلوبكم ۚ وما النصر إلا من عند الله ۚ إن الله عزيز حكيم
    surahName: Al-Anfaal
