    verse: 50
    ordinal: 1210
    text: 'If thou couldst see how the angels receive those who disbelieve, smiting faces and their backs and (saying): Taste the punishment of burning!'
    translation: Pickthall
    original: وَلَوْ تَرَىٰٓ إِذْ يَتَوَفَّى ٱلَّذِينَ كَفَرُوا۟ ۙ ٱلْمَلَـٰٓئِكَةُ يَضْرِبُونَ وُجُوهَهُمْ وَأَدْبَـٰرَهُمْ وَذُوقُوا۟ عَذَابَ ٱلْحَرِيقِ
    arabicPlain: ولو ترى إذ يتوفى الذين كفروا ۙ الملائكة يضربون وجوههم وأدبارهم وذوقوا عذاب الحريق
