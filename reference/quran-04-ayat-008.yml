    name: Quran 8:54
    chapter: 8
    verse: 54
    ordinal: 1214
    text: (Their way is) as the way of Pharaoh's folk and those before them; they denied the revelations of their Lord, so We destroyed them in their sins. And We drowned the folk of Pharaoh. All were evil-doers.
    translation: Pickthall
    original: كَدَأْبِ ءَالِ فِرْعَوْنَ ۙ وَٱلَّذِينَ مِن قَبْلِهِمْ ۚ كَذَّبُوا۟ بِـَٔايَـٰتِ رَبِّهِمْ فَأَهْلَكْنَـٰهُم بِذُنُوبِهِمْ وَأَغْرَقْنَآ ءَالَ فِرْعَوْنَ ۚ وَكُلٌّ كَانُوا۟ ظَـٰلِمِينَ
    arabicPlain: كدأب آل فرعون ۙ والذين من قبلهم ۚ كذبوا بآيات ربهم فأهلكناهم بذنوبهم وأغرقنا آل فرعون ۚ وكل كانوا ظالمين
