  data:
    ref: '8:9'
    scripture: quran
    name: Quran 8:9
    chapter: 8
    verse: 9
    ordinal: 1169
    text: 'When ye sought help of your Lord and He answered you (saying): I will help you with a thousand of the angels, rank on rank.'
    translation: Pickthall
    original: إِذْ تَسْتَغِيثُونَ رَبَّكُمْ فَٱسْتَجَابَ لَكُمْ أَنِّى مُمِدُّكُم بِأَلْفٍ مِّنَ ٱلْمَلَـٰٓئِكَةِ مُرْدِفِينَ
    arabicPlain: إذ تستغيثون ربكم فاستجاب لكم أني ممدكم بألف من الملائكة مردفين
