    name: Quran 8:13
    chapter: 8
    verse: 13
    ordinal: 1173
    text: That is because they opposed Allah and His messenger. Whoso opposeth Allah and His messenger, (for him) lo! Allah is severe in punishment.
    translation: Pickthall
    original: ذَٰلِكَ بِأَنَّهُمْ شَآقُّوا۟ ٱللَّهَ وَرَسُولَهُۥ ۚ وَمَن يُشَاقِقِ ٱللَّهَ وَرَسُولَهُۥ فَإِنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ
    arabicPlain: ذلك بأنهم شاقوا الله ورسوله ۚ ومن يشاقق الله ورسوله فإن الله شديد العقاب
