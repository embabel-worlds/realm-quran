  data:
    ref: 8:61
    scripture: quran
    name: Quran 8:61
    chapter: 8
    verse: 61
    ordinal: 1221
    text: And if they incline to peace, incline thou also to it, and trust in Allah. Lo! He, even He, is the Hearer, the Knower.
    translation: Pickthall
    original: ۞ وَإِن جَنَحُوا۟ لِلسَّلْمِ فَٱجْنَحْ لَهَا وَتَوَكَّلْ عَلَى ٱللَّهِ ۚ إِنَّهُۥ هُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ
    arabicPlain: ۞ وإن جنحوا للسلم فاجنح لها وتوكل على الله ۚ إنه هو السميع العليم
    surahName: Al-Anfaal
    juz: 10
    manzil: 2
