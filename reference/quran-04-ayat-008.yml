  data:
    ref: '8:36'
    scripture: quran
    name: Quran 8:36
    chapter: 8
    verse: 36
    ordinal: 1196
    text: Lo! those who disbelieve spend their wealth in order that they may debar (men) from the way of Allah. They will spend it, then it will become an anguish for them, then they will be conquered. And those who disbelieve will be gathered unto hell,
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ كَفَرُوا۟ يُنفِقُونَ أَمْوَٰلَهُمْ لِيَصُدُّوا۟ عَن سَبِيلِ ٱللَّهِ ۚ فَسَيُنفِقُونَهَا ثُمَّ تَكُونُ عَلَيْهِمْ حَسْرَةً ثُمَّ يُغْلَبُونَ ۗ وَٱلَّذِينَ كَفَرُوٓا۟ إِلَىٰ جَهَنَّمَ يُحْشَرُونَ
    arabicPlain: إن الذين كفروا ينفقون أموالهم ليصدوا عن سبيل الله ۚ فسينفقونها ثم تكون عليهم حسرة ثم يغلبون ۗ والذين كفروا إلى جهنم يحشرون
    surahName: Al-Anfaal
    juz: 9
    manzil: 2
    ruku: 149
