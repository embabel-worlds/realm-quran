  data:
    ref: '64:4'
    scripture: quran
    name: Quran 64:4
    chapter: 64
    verse: 4
    ordinal: 5203
    text: He knoweth all that is in the heavens and the earth, and He knoweth what ye conceal and what ye publish. And Allah is Aware of what is in the breasts (of men).
    translation: Pickthall
    original: يَعْلَمُ مَا فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَيَعْلَمُ مَا تُسِرُّونَ وَمَا تُعْلِنُونَ ۚ وَٱللَّهُ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ
    arabicPlain: يعلم ما في السماوات والأرض ويعلم ما تسرون وما تعلنون ۚ والله عليم بذات الصدور
    surahName: At-Taghaabun
    juz: 28
