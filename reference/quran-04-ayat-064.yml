  data:
    ref: '64:12'
    scripture: quran
    name: Quran 64:12
    chapter: 64
    verse: 12
    ordinal: 5211
    text: Obey Allah and obey His messenger; but if ye turn away, then the duty of Our messenger is only to convey (the message) plainly.
    translation: Pickthall
    original: وَأَطِيعُوا۟ ٱللَّهَ وَأَطِيعُوا۟ ٱلرَّسُولَ ۚ فَإِن تَوَلَّيْتُمْ فَإِنَّمَا عَلَىٰ رَسُولِنَا ٱلْبَلَـٰغُ ٱلْمُبِينُ
    arabicPlain: وأطيعوا الله وأطيعوا الرسول ۚ فإن توليتم فإنما على رسولنا البلاغ المبين
    surahName: At-Taghaabun
    juz: 28
    manzil: 7
    ruku: 491
