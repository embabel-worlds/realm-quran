  data:
    ref: '64:15'
    scripture: quran
    name: Quran 64:15
    chapter: 64
    verse: 15
    ordinal: 5214
    text: Your wealth and your children are only a temptation, whereas Allah! with Him is an immense reward.
    translation: Pickthall
    original: إِنَّمَآ أَمْوَٰلُكُمْ وَأَوْلَـٰدُكُمْ فِتْنَةٌ ۚ وَٱللَّهُ عِندَهُۥٓ أَجْرٌ عَظِيمٌ
    arabicPlain: إنما أموالكم وأولادكم فتنة ۚ والله عنده أجر عظيم
    surahName: At-Taghaabun
    juz: 28
    manzil: 7
    ruku: 491
    page: 557
  relations:
