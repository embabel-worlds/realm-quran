  data:
    ref: '64:11'
    scripture: quran
    name: Quran 64:11
    chapter: 64
    verse: 11
    ordinal: 5210
    text: No calamity befalleth save by Allah's leave. And whosoever believeth in Allah, He guideth his heart. And Allah is Knower of all things.
    translation: Pickthall
    original: مَآ أَصَابَ مِن مُّصِيبَةٍ إِلَّا بِإِذْنِ ٱللَّهِ ۗ وَمَن يُؤْمِنۢ بِٱللَّهِ يَهْدِ قَلْبَهُۥ ۚ وَٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمٌ
    arabicPlain: ما أصاب من مصيبة إلا بإذن الله ۗ ومن يؤمن بالله يهد قلبه ۚ والله بكل شيء عليم
    surahName: At-Taghaabun
    juz: 28
    manzil: 7
    ruku: 491
