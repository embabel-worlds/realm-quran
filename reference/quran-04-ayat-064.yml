  data:
    ref: '64:2'
    scripture: quran
    name: Quran 64:2
    chapter: 64
    verse: 2
    ordinal: 5201
    text: He it is Who created you, but one of you is a disbeliever and one of you is a believer, and Allah is Seer of what ye do.
    translation: Pickthall
    original: هُوَ ٱلَّذِى خَلَقَكُمْ فَمِنكُمْ كَافِرٌ وَمِنكُم مُّؤْمِنٌ ۚ وَٱللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ
    arabicPlain: هو الذي خلقكم فمنكم كافر ومنكم مؤمن ۚ والله بما تعملون بصير
    surahName: At-Taghaabun
    juz: 28
