  data:
    ref: '64:3'
    scripture: quran
    name: Quran 64:3
    chapter: 64
    verse: 3
    ordinal: 5202
    text: He created the heavens and the earth with truth, and He shaped you and made good your shapes, and unto Him is the journeying.
    translation: Pickthall
    original: خَلَقَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ بِٱلْحَقِّ وَصَوَّرَكُمْ فَأَحْسَنَ صُوَرَكُمْ ۖ وَإِلَيْهِ ٱلْمَصِيرُ
    arabicPlain: خلق السماوات والأرض بالحق وصوركم فأحسن صوركم ۖ وإليه المصير
    surahName: At-Taghaabun
