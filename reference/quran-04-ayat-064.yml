  data:
    ref: '64:13'
    scripture: quran
    name: Quran 64:13
    chapter: 64
    verse: 13
    ordinal: 5212
    text: Allah! There is no Allah save Him. In Allah, therefore, let believers put their trust.
    translation: Pickthall
    original: ٱللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ ۚ وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ
    arabicPlain: الله لا إله إلا هو ۚ وعلى الله فليتوكل المؤمنون
    surahName: At-Taghaabun
    juz: 28
    manzil: 7
    ruku: 491
