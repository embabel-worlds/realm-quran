- type: Ayah
  data:
    ref: '64:8'
    scripture: quran
    name: Quran 64:8
    chapter: 64
    verse: 8
    ordinal: 5207
    text: So believe in Allah and His messenger and the light which We have revealed. And Allah is Informed of what ye do.
    translation: Pickthall
    original: فَـَٔامِنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَٱلنُّورِ ٱلَّذِىٓ أَنزَلْنَا ۚ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ
    arabicPlain: فآمنوا بالله ورسوله والنور الذي أنزلنا ۚ والله بما تعملون خبير
    surahName: At-Taghaabun
    juz: 28
    manzil: 7
    ruku: 490
