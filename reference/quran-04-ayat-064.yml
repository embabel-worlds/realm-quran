  data:
    ref: '64:16'
    scripture: quran
    name: Quran 64:16
    chapter: 64
    verse: 16
    ordinal: 5215
    text: So keep your duty to Allah as best ye can, and listen, and obey, and spend; that is better for your souls. And whoso is saved from his own greed, such are the successful.
    translation: Pickthall
    original: فَٱتَّقُوا۟ ٱللَّهَ مَا ٱسْتَطَعْتُمْ وَٱسْمَعُوا۟ وَأَطِيعُوا۟ وَأَنفِقُوا۟ خَيْرًا لِّأَنفُسِكُمْ ۗ وَمَن يُوقَ شُحَّ نَفْسِهِۦ فَأُو۟لَـٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ
    arabicPlain: فاتقوا الله ما استطعتم واسمعوا وأطيعوا وأنفقوا خيرا لأنفسكم ۗ ومن يوق شح نفسه فأولئك هم المفلحون
    surahName: At-Taghaabun
    juz: 28
    manzil: 7
    ruku: 491
    page: 557
  relations:
  - predicate: IN
    to:
      type: Surah
