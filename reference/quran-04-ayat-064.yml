  data:
    ref: '64:6'
    scripture: quran
    name: Quran 64:6
    chapter: 64
    verse: 6
    ordinal: 5205
    text: 'That was because their messengers (from Allah) kept coming unto them with clear proofs (of Allah''s Sovereignty), but they said: Shall mere mortals guide us? So they disbelieved and turned away, and Allah was independent (of them). Allah is Absolute, Owner of Praise.'
    translation: Pickthall
    original: ذَٰلِكَ بِأَنَّهُۥ كَانَت تَّأْتِيهِمْ رُسُلُهُم بِٱلْبَيِّنَـٰتِ فَقَالُوٓا۟ أَبَشَرٌ يَهْدُونَنَا فَكَفَرُوا۟ وَتَوَلَّوا۟ ۚ وَّٱسْتَغْنَى ٱللَّهُ ۚ وَٱللَّهُ غَنِىٌّ حَمِيدٌ
    arabicPlain: ذلك بأنه كانت تأتيهم رسلهم بالبينات فقالوا أبشر يهدوننا فكفروا وتولوا ۚ واستغنى الله ۚ والله غني حميد
    surahName: At-Taghaabun
    juz: 28
    manzil: 7
    ruku: 490
    page: 556
