- type: Ayah
  data:
    ref: '64:10'
    scripture: quran
    name: Quran 64:10
    chapter: 64
    verse: 10
    ordinal: 5209
    text: But those who disbelieve and deny Our revelations, such are owners of the Fire; they will abide therein - a hapless journey's end!
    translation: Pickthall
    original: وَٱلَّذِينَ كَفَرُوا۟ وَكَذَّبُوا۟ بِـَٔايَـٰتِنَآ أُو۟لَـٰٓئِكَ أَصْحَـٰبُ ٱلنَّارِ خَـٰلِدِينَ فِيهَا ۖ وَبِئْسَ ٱلْمَصِيرُ
    arabicPlain: والذين كفروا وكذبوا بآياتنا أولئك أصحاب النار خالدين فيها ۖ وبئس المصير
    surahName: At-Taghaabun
    juz: 28
    manzil: 7
    ruku: 490
    page: 557
