  data:
    ref: '64:5'
    scripture: quran
    name: Quran 64:5
    chapter: 64
    verse: 5
    ordinal: 5204
    text: Hath not the story reached you of those who disbelieved of old and so did taste the ill-effects of their conduct, and theirs will be a painful doom.
    translation: Pickthall
    original: أَلَمْ يَأْتِكُمْ نَبَؤُا۟ ٱلَّذِينَ كَفَرُوا۟ مِن قَبْلُ فَذَاقُوا۟ وَبَالَ أَمْرِهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌ
    arabicPlain: ألم يأتكم نبأ الذين كفروا من قبل فذاقوا وبال أمرهم ولهم عذاب أليم
    surahName: At-Taghaabun
    juz: 28
