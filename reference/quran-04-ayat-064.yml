- type: Ayah
  data:
    ref: '64:7'
    scripture: quran
    name: Quran 64:7
    chapter: 64
    verse: 7
    ordinal: 5206
    text: 'Those who disbelieve assert that they will not be raised again. Say (unto them, O Muhammad): Yea, verily, by my Lord! ye will be raised again and then ye will be informed of what ye did; and that is easy for Allah.'
    translation: Pickthall
    original: زَعَمَ ٱلَّذِينَ كَفَرُوٓا۟ أَن لَّن يُبْعَثُوا۟ ۚ قُلْ بَلَىٰ وَرَبِّى لَتُبْعَثُنَّ ثُمَّ لَتُنَبَّؤُنَّ بِمَا عَمِلْتُمْ ۚ وَذَٰلِكَ عَلَى ٱللَّهِ يَسِيرٌ
    arabicPlain: زعم الذين كفروا أن لن يبعثوا ۚ قل بلى وربي لتبعثن ثم لتنبؤن بما عملتم ۚ وذلك على الله يسير
    surahName: At-Taghaabun
    juz: 28
    manzil: 7
    ruku: 490
    page: 556
