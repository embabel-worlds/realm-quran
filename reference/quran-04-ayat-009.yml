- type: Ayah
  data:
    ref: '9:7'
    scripture: quran
    name: Quran 9:7
    chapter: 9
    verse: 7
    ordinal: 1242
    text: How can there be a treaty with Allah and with His messenger for the idolaters save those with whom ye made a treaty at the Inviolable Place of Worship? So long as they are true to you, be true to them. Lo! Allah loveth those who keep their duty.
    translation: Pickthall
    original: كَيْفَ يَكُونُ لِلْمُشْرِكِينَ عَهْدٌ عِندَ ٱللَّهِ وَعِندَ رَسُولِهِۦٓ إِلَّا ٱلَّذِينَ عَـٰهَدتُّمْ عِندَ ٱلْمَسْجِدِ ٱلْحَرَامِ ۖ فَمَا ٱسْتَقَـٰمُوا۟ لَكُمْ فَٱسْتَقِيمُوا۟ لَهُمْ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَّقِينَ
    arabicPlain: كيف يكون للمشركين عهد عند الله وعند رسوله إلا الذين عاهدتم عند المسجد الحرام ۖ فما استقاموا لكم فاستقيموا لهم ۚ إن الله يحب المتقين
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 157
    page: 188
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '9'
  - predicate: IN_PORTION
