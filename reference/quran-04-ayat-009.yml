  data:
    ref: '9:39'
    scripture: quran
    name: Quran 9:39
    chapter: 9
    verse: 39
    ordinal: 1274
    text: If ye go not forth He will afflict you with a painful doom, and will choose instead of you a folk other than you. Ye cannot harm Him at all. Allah is Able to do all things.
    translation: Pickthall
    original: إِلَّا تَنفِرُوا۟ يُعَذِّبْكُمْ عَذَابًا أَلِيمًا وَيَسْتَبْدِلْ قَوْمًا غَيْرَكُمْ وَلَا تَضُرُّوهُ شَيْـًٔا ۗ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ
    arabicPlain: إلا تنفروا يعذبكم عذابا أليما ويستبدل قوما غيركم ولا تضروه شيئا ۗ والله على كل شيء قدير
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 161
    page: 193
