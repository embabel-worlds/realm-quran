  data:
    ref: 9:116
    scripture: quran
    name: Quran 9:116
    chapter: 9
    verse: 116
    ordinal: 1351
    text: Lo! Allah! Unto Him belongeth the Sovereignty of the heavens and the earth. He quickeneth and He giveth death. And ye have, instead of Allah, no protecting friend nor helper.
    translation: Pickthall
    original: إِنَّ ٱللَّهَ لَهُۥ مُلْكُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۖ يُحْىِۦ وَيُمِيتُ ۚ وَمَا لَكُم مِّن دُونِ ٱللَّهِ مِن وَلِىٍّ وَلَا نَصِيرٍ
    arabicPlain: إن الله له ملك السماوات والأرض ۖ يحيي ويميت ۚ وما لكم من دون الله من ولي ولا نصير
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 169
    page: 205
