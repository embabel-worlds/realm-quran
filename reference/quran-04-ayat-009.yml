- type: Ayah
  data:
    ref: '9:53'
    scripture: quran
    name: Quran 9:53
    chapter: 9
    verse: 53
    ordinal: 1288
    text: 'Say: Pay (your contribution), willingly or unwillingly, it will not be accepted from you. Lo! ye were ever froward folk.'
    translation: Pickthall
    original: قُلْ أَنفِقُوا۟ طَوْعًا أَوْ كَرْهًا لَّن يُتَقَبَّلَ مِنكُمْ ۖ إِنَّكُمْ كُنتُمْ قَوْمًا فَـٰسِقِينَ
    arabicPlain: قل أنفقوا طوعا أو كرها لن يتقبل منكم ۖ إنكم كنتم قوما فاسقين
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 195
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '9'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-10
- type: Ayah
  data:
    ref: '9:54'
    scripture: quran
    name: Quran 9:54
    chapter: 9
    verse: 54
    ordinal: 1289
    text: And naught preventeth that their contributions should be accepted from them save that they have disbelieved in Allah and in His messenger, and they come not to worship save as idlers, and pay not (their contribution) save reluctantly.
    translation: Pickthall
    original: وَمَا مَنَعَهُمْ أَن تُقْبَلَ مِنْهُمْ نَفَقَـٰتُهُمْ إِلَّآ أَنَّهُمْ كَفَرُوا۟ بِٱللَّهِ وَبِرَسُولِهِۦ وَلَا يَأْتُونَ ٱلصَّلَوٰةَ إِلَّا وَهُمْ كُسَالَىٰ وَلَا يُنفِقُونَ إِلَّا وَهُمْ كَـٰرِهُونَ
    arabicPlain: وما منعهم أن تقبل منهم نفقاتهم إلا أنهم كفروا بالله وبرسوله ولا يأتون الصلاة إلا وهم كسالى ولا ينفقون إلا وهم كارهون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 195
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '9'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-10
- type: Ayah
  data:
    ref: '9:55'
    scripture: quran
    name: Quran 9:55
    chapter: 9
    verse: 55
    ordinal: 1290
    text: So let not their riches nor their children please thee (O Muhammad). Allah thereby intendeth but to punish them in the life of the world and that their souls shall pass away while they are disbelievers.
    translation: Pickthall
    original: فَلَا تُعْجِبْكَ أَمْوَٰلُهُمْ وَلَآ أَوْلَـٰدُهُمْ ۚ إِنَّمَا يُرِيدُ ٱللَّهُ لِيُعَذِّبَهُم بِهَا فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَتَزْهَقَ أَنفُسُهُمْ وَهُمْ كَـٰفِرُونَ
    arabicPlain: فلا تعجبك أموالهم ولا أولادهم ۚ إنما يريد الله ليعذبهم بها في الحياة الدنيا وتزهق أنفسهم وهم كافرون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 196
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '9'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-10
- type: Ayah
  data:
    ref: '9:56'
    scripture: quran
    name: Quran 9:56
    chapter: 9
    verse: 56
    ordinal: 1291
    text: And they swear by Allah that they are in truth of you, when they are not of you, but they are folk who are afraid.
    translation: Pickthall
    original: وَيَحْلِفُونَ بِٱللَّهِ إِنَّهُمْ لَمِنكُمْ وَمَا هُم مِّنكُمْ وَلَـٰكِنَّهُمْ قَوْمٌ يَفْرَقُونَ
    arabicPlain: ويحلفون بالله إنهم لمنكم وما هم منكم ولكنهم قوم يفرقون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 196
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '9'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-10
- type: Ayah
  data:
    ref: '9:57'
    scripture: quran
    name: Quran 9:57
    chapter: 9
    verse: 57
    ordinal: 1292
    text: Had they but found a refuge, or caverns, or a place to enter, they surely had resorted thither swift as runaways.
    translation: Pickthall
    original: لَوْ يَجِدُونَ مَلْجَـًٔا أَوْ مَغَـٰرَٰتٍ أَوْ مُدَّخَلًا لَّوَلَّوْا۟ إِلَيْهِ وَهُمْ يَجْمَحُونَ
    arabicPlain: لو يجدون ملجأ أو مغارات أو مدخلا لولوا إليه وهم يجمحون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 196
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '9'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-10
- type: Ayah
  data:
    ref: '9:58'
    scripture: quran
    name: Quran 9:58
    chapter: 9
    verse: 58
    ordinal: 1293
    text: And of them is he who defameth thee in the matter of the alms. If they are given thereof they are content, and if they are not given thereof, behold! they are enraged.
    translation: Pickthall
    original: وَمِنْهُم مَّن يَلْمِزُكَ فِى ٱلصَّدَقَـٰتِ فَإِنْ أُعْطُوا۟ مِنْهَا رَضُوا۟ وَإِن لَّمْ يُعْطَوْا۟ مِنْهَآ إِذَا هُمْ يَسْخَطُونَ
    arabicPlain: ومنهم من يلمزك في الصدقات فإن أعطوا منها رضوا وإن لم يعطوا منها إذا هم يسخطون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 196
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '9'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-10
- type: Ayah
  data:
    ref: '9:59'
    scripture: quran
    name: Quran 9:59
    chapter: 9
    verse: 59
    ordinal: 1294
    text: '(How much more seemly) had they been content with that which Allah and His messenger had given them and had said: Allah sufficeth us. Allah will give us of His bounty, and (also) His messenger. Unto Allah we are suppliants.'
    translation: Pickthall
    original: وَلَوْ أَنَّهُمْ رَضُوا۟ مَآ ءَاتَىٰهُمُ ٱللَّهُ وَرَسُولُهُۥ وَقَالُوا۟ حَسْبُنَا ٱللَّهُ سَيُؤْتِينَا ٱللَّهُ مِن فَضْلِهِۦ وَرَسُولُهُۥٓ إِنَّآ إِلَى ٱللَّهِ رَٰغِبُونَ
    arabicPlain: ولو أنهم رضوا ما آتاهم الله ورسوله وقالوا حسبنا الله سيؤتينا الله من فضله ورسوله إنا إلى الله راغبون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 196
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '9'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-10
- type: Ayah
  data:
    ref: 9:60
    scripture: quran
    name: Quran 9:60
    chapter: 9
    verse: 60
    ordinal: 1295
    text: The alms are only for the poor and the needy, and those who collect them, and those whose hearts are to be reconciled, and to free the captives and the debtors, and for the cause of Allah, and (for) the wayfarer; a duty imposed by Allah. Allah is Knower, Wise.
    translation: Pickthall
    original: ۞ إِنَّمَا ٱلصَّدَقَـٰتُ لِلْفُقَرَآءِ وَٱلْمَسَـٰكِينِ وَٱلْعَـٰمِلِينَ عَلَيْهَا وَٱلْمُؤَلَّفَةِ قُلُوبُهُمْ وَفِى ٱلرِّقَابِ وَٱلْغَـٰرِمِينَ وَفِى سَبِيلِ ٱللَّهِ وَٱبْنِ ٱلسَّبِيلِ ۖ فَرِيضَةً مِّنَ ٱللَّهِ ۗ وَٱللَّهُ عَلِيمٌ حَكِيمٌ
    arabicPlain: ۞ إنما الصدقات للفقراء والمساكين والعاملين عليها والمؤلفة قلوبهم وفي الرقاب والغارمين وفي سبيل الله وابن السبيل ۖ فريضة من الله ۗ والله عليم حكيم
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 163
    page: 196
