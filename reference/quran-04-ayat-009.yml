- type: Ayah
  data:
    ref: '9:9'
    scripture: quran
    name: Quran 9:9
    chapter: 9
    verse: 9
    ordinal: 1244
    text: They have purchased with the revelations of Allah a little gain, so they debar (men) from His way. Lo! evil is that which they are wont to do.
    translation: Pickthall
    original: ٱشْتَرَوْا۟ بِـَٔايَـٰتِ ٱللَّهِ ثَمَنًا قَلِيلًا فَصَدُّوا۟ عَن سَبِيلِهِۦٓ ۚ إِنَّهُمْ سَآءَ مَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: اشتروا بآيات الله ثمنا قليلا فصدوا عن سبيله ۚ إنهم ساء ما كانوا يعملون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 157
    page: 188
