  data:
    ref: 9:85
    scripture: quran
    name: Quran 9:85
    chapter: 9
    verse: 85
    ordinal: 1320
    text: Let not their wealth nor their children please thee! Allah purposeth only to punish them thereby in the world, and that their souls shall pass away while they are disbelievers.
    translation: Pickthall
    original: وَلَا تُعْجِبْكَ أَمْوَٰلُهُمْ وَأَوْلَـٰدُهُمْ ۚ إِنَّمَا يُرِيدُ ٱللَّهُ أَن يُعَذِّبَهُم بِهَا فِى ٱلدُّنْيَا وَتَزْهَقَ أَنفُسُهُمْ وَهُمْ كَـٰفِرُونَ
    arabicPlain: ولا تعجبك أموالهم وأولادهم ۚ إنما يريد الله أن يعذبهم بها في الدنيا وتزهق أنفسهم وهم كافرون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 166
    page: 200
