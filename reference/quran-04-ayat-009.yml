  data:
    ref: 9:121
    scripture: quran
    name: Quran 9:121
    chapter: 9
    verse: 121
    ordinal: 1356
    text: Nor spend they any spending, small or great, nor do they cross a valley, but it is recorded for them, that Allah may repay them the best of what they used to do.
    translation: Pickthall
    original: وَلَا يُنفِقُونَ نَفَقَةً صَغِيرَةً وَلَا كَبِيرَةً وَلَا يَقْطَعُونَ وَادِيًا إِلَّا كُتِبَ لَهُمْ لِيَجْزِيَهُمُ ٱللَّهُ أَحْسَنَ مَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: ولا ينفقون نفقة صغيرة ولا كبيرة ولا يقطعون واديا إلا كتب لهم ليجزيهم الله أحسن ما كانوا يعملون
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 170
