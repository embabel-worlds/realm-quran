  data:
    ref: 9:97
    scripture: quran
    name: Quran 9:97
    chapter: 9
    verse: 97
    ordinal: 1332
    text: The wandering Arabs are more hard in disbelief and hypocrisy, and more likely to be ignorant of the limits which Allah hath revealed unto His messenger. And Allah is Knower, Wise.
    translation: Pickthall
    original: ٱلْأَعْرَابُ أَشَدُّ كُفْرًا وَنِفَاقًا وَأَجْدَرُ أَلَّا يَعْلَمُوا۟ حُدُودَ مَآ أَنزَلَ ٱللَّهُ عَلَىٰ رَسُولِهِۦ ۗ وَٱللَّهُ عَلِيمٌ حَكِيمٌ
    arabicPlain: الأعراب أشد كفرا ونفاقا وأجدر ألا يعلموا حدود ما أنزل الله على رسوله ۗ والله عليم حكيم
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 167
    page: 202
