  data:
    ref: 9:68
    scripture: quran
    name: Quran 9:68
    chapter: 9
    verse: 68
    ordinal: 1303
    text: Allah promiseth the hypocrites, both men and women, and the disbelievers fire of hell for their abode. It will suffice them. Allah curseth them, and theirs is lasting torment.
    translation: Pickthall
    original: وَعَدَ ٱللَّهُ ٱلْمُنَـٰفِقِينَ وَٱلْمُنَـٰفِقَـٰتِ وَٱلْكُفَّارَ نَارَ جَهَنَّمَ خَـٰلِدِينَ فِيهَا ۚ هِىَ حَسْبُهُمْ ۚ وَلَعَنَهُمُ ٱللَّهُ ۖ وَلَهُمْ عَذَابٌ مُّقِيمٌ
    arabicPlain: وعد الله المنافقين والمنافقات والكفار نار جهنم خالدين فيها ۚ هي حسبهم ۚ ولعنهم الله ۖ ولهم عذاب مقيم
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 164
    page: 197
