  data:
    ref: '9:44'
    scripture: quran
    name: Quran 9:44
    chapter: 9
    verse: 44
    ordinal: 1279
    text: Those who believe in Allah and the Last Day ask no leave of thee lest they should strive with their wealth and their lives. Allah is Aware of those who keep their duty (unto Him).
    translation: Pickthall
    original: لَا يَسْتَـْٔذِنُكَ ٱلَّذِينَ يُؤْمِنُونَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ أَن يُجَـٰهِدُوا۟ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْ ۗ وَٱللَّهُ عَلِيمٌۢ بِٱلْمُتَّقِينَ
    arabicPlain: لا يستأذنك الذين يؤمنون بالله واليوم الآخر أن يجاهدوا بأموالهم وأنفسهم ۗ والله عليم بالمتقين
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 194
