    scripture: quran
    name: Quran 9:78
    chapter: 9
    verse: 78
    ordinal: 1313
    text: Know they not that Allah knoweth both their secret and the thought that they confide, and that Allah is the Knower of Things Hidden?
    translation: Pickthall
    original: أَلَمْ يَعْلَمُوٓا۟ أَنَّ ٱللَّهَ يَعْلَمُ سِرَّهُمْ وَنَجْوَىٰهُمْ وَأَنَّ ٱللَّهَ عَلَّـٰمُ ٱلْغُيُوبِ
    arabicPlain: ألم يعلموا أن الله يعلم سرهم ونجواهم وأن الله علام الغيوب
