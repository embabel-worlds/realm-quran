  data:
    ref: 9:64
    scripture: quran
    name: Quran 9:64
    chapter: 9
    verse: 64
    ordinal: 1299
    text: 'The hypocrites fear lest a surah should be revealed concerning them, proclaiming what is in their hearts. Say: Scoff (your fill)! Lo! Allah is disclosing what ye fear.'
    translation: Pickthall
    original: يَحْذَرُ ٱلْمُنَـٰفِقُونَ أَن تُنَزَّلَ عَلَيْهِمْ سُورَةٌ تُنَبِّئُهُم بِمَا فِى قُلُوبِهِمْ ۚ قُلِ ٱسْتَهْزِءُوٓا۟ إِنَّ ٱللَّهَ مُخْرِجٌ مَّا تَحْذَرُونَ
    arabicPlain: يحذر المنافقون أن تنزل عليهم سورة تنبئهم بما في قلوبهم ۚ قل استهزئوا إن الله مخرج ما تحذرون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 163
