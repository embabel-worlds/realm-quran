  data:
    ref: 9:80
    scripture: quran
    name: Quran 9:80
    chapter: 9
    verse: 80
    ordinal: 1315
    text: Ask forgiveness for them (O Muhammad), or ask not forgiveness for them; though thou ask forgiveness for them seventy times Allah will not forgive them. That is because they disbelieved in Allah and His messenger, and Allah guideth not wrongdoing folk.
    translation: Pickthall
    original: ٱسْتَغْفِرْ لَهُمْ أَوْ لَا تَسْتَغْفِرْ لَهُمْ إِن تَسْتَغْفِرْ لَهُمْ سَبْعِينَ مَرَّةً فَلَن يَغْفِرَ ٱللَّهُ لَهُمْ ۚ ذَٰلِكَ بِأَنَّهُمْ كَفَرُوا۟ بِٱللَّهِ وَرَسُولِهِۦ ۗ وَٱللَّهُ لَا يَهْدِى ٱلْقَوْمَ ٱلْفَـٰسِقِينَ
    arabicPlain: استغفر لهم أو لا تستغفر لهم إن تستغفر لهم سبعين مرة فلن يغفر الله لهم ۚ ذلك بأنهم كفروا بالله ورسوله ۗ والله لا يهدي القوم الفاسقين
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 165
    page: 200
