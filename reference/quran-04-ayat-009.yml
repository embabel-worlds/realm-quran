  data:
    ref: '9:26'
    scripture: quran
    name: Quran 9:26
    chapter: 9
    verse: 26
    ordinal: 1261
    text: Then Allah sent His peace of reassurance down upon His messenger and upon the believers, and sent down hosts ye could not see, and punished those who disbelieved. Such is the reward of disbelievers.
    translation: Pickthall
    original: ثُمَّ أَنزَلَ ٱللَّهُ سَكِينَتَهُۥ عَلَىٰ رَسُولِهِۦ وَعَلَى ٱلْمُؤْمِنِينَ وَأَنزَلَ جُنُودًا لَّمْ تَرَوْهَا وَعَذَّبَ ٱلَّذِينَ كَفَرُوا۟ ۚ وَذَٰلِكَ جَزَآءُ ٱلْكَـٰفِرِينَ
    arabicPlain: ثم أنزل الله سكينته على رسوله وعلى المؤمنين وأنزل جنودا لم تروها وعذب الذين كفروا ۚ وذلك جزاء الكافرين
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 159
    page: 190
  relations:
