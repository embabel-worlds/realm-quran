  data:
    ref: 9:111
    scripture: quran
    name: Quran 9:111
    chapter: 9
    verse: 111
    ordinal: 1346
    text: 'Lo! Allah hath bought from the believers their lives and their wealth because the Garden will be theirs: they shall fight in the way of Allah and shall slay and be slain. It is a promise which is binding on Him in the Torah and the Gospel and the Qur''an. Who fulfilleth His covenant better than Allah? Rejoice then in your bargain that ye have made, for that is the supreme triumph.'
    translation: Pickthall
    original: ۞ إِنَّ ٱللَّهَ ٱشْتَرَىٰ مِنَ ٱلْمُؤْمِنِينَ أَنفُسَهُمْ وَأَمْوَٰلَهُم بِأَنَّ لَهُمُ ٱلْجَنَّةَ ۚ يُقَـٰتِلُونَ فِى سَبِيلِ ٱللَّهِ فَيَقْتُلُونَ وَيُقْتَلُونَ ۖ وَعْدًا عَلَيْهِ حَقًّا فِى ٱلتَّوْرَىٰةِ وَٱلْإِنجِيلِ وَٱلْقُرْءَانِ ۚ وَمَنْ أَوْفَىٰ بِعَهْدِهِۦ مِنَ ٱللَّهِ ۚ فَٱسْتَبْشِرُوا۟ بِبَيْعِكُمُ ٱلَّذِى بَايَعْتُم بِهِۦ ۚ وَذَٰلِكَ هُوَ ٱلْفَوْزُ ٱلْعَظِيمُ
    arabicPlain: ۞ إن الله اشترى من المؤمنين أنفسهم وأموالهم بأن لهم الجنة ۚ يقاتلون في سبيل الله فيقتلون ويقتلون ۖ وعدا عليه حقا في التوراة والإنجيل والقرآن ۚ ومن أوفى بعهده من الله ۚ فاستبشروا ببيعكم الذي بايعتم به ۚ وذلك هو الفوز العظيم
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 169
    page: 204
