  data:
    ref: '9:43'
    scripture: quran
    name: Quran 9:43
    chapter: 9
    verse: 43
    ordinal: 1278
    text: Allah forgive thee (O Muhammad)! Wherefor didst thou grant them leave ere those who told the truth were manifest to thee and thou didst know the liars?
    translation: Pickthall
    original: عَفَا ٱللَّهُ عَنكَ لِمَ أَذِنتَ لَهُمْ حَتَّىٰ يَتَبَيَّنَ لَكَ ٱلَّذِينَ صَدَقُوا۟ وَتَعْلَمَ ٱلْكَـٰذِبِينَ
    arabicPlain: عفا الله عنك لم أذنت لهم حتى يتبين لك الذين صدقوا وتعلم الكاذبين
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 194
