  data:
    ref: 9:81
    scripture: quran
    name: Quran 9:81
    chapter: 9
    verse: 81
    ordinal: 1316
    text: 'Those who were left behind rejoiced at sitting still behind the messenger of Allah, and were averse to striving with their wealth and their lives in Allah''s way. And they said: Go not forth in the heat! Say: The fire of hell is more intense of heat, if they but understood.'
    translation: Pickthall
    original: فَرِحَ ٱلْمُخَلَّفُونَ بِمَقْعَدِهِمْ خِلَـٰفَ رَسُولِ ٱللَّهِ وَكَرِهُوٓا۟ أَن يُجَـٰهِدُوا۟ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْ فِى سَبِيلِ ٱللَّهِ وَقَالُوا۟ لَا تَنفِرُوا۟ فِى ٱلْحَرِّ ۗ قُلْ نَارُ جَهَنَّمَ أَشَدُّ حَرًّا ۚ لَّوْ كَانُوا۟ يَفْقَهُونَ
    arabicPlain: فرح المخلفون بمقعدهم خلاف رسول الله وكرهوا أن يجاهدوا بأموالهم وأنفسهم في سبيل الله وقالوا لا تنفروا في الحر ۗ قل نار جهنم أشد حرا ۚ لو كانوا يفقهون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 166
    page: 200
