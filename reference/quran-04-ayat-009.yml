- type: Ayah
  data:
    ref: '9:10'
    scripture: quran
    name: Quran 9:10
    chapter: 9
    verse: 10
    ordinal: 1245
    text: And they observe toward a believer neither pact nor honour. These are they who are transgressors.
    translation: Pickthall
    original: لَا يَرْقُبُونَ فِى مُؤْمِنٍ إِلًّا وَلَا ذِمَّةً ۚ وَأُو۟لَـٰٓئِكَ هُمُ ٱلْمُعْتَدُونَ
    arabicPlain: لا يرقبون في مؤمن إلا ولا ذمة ۚ وأولئك هم المعتدون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 157
