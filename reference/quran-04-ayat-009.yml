    verse: 105
    ordinal: 1340
    text: 'And say (unto them): Act! Allah will behold your actions, and (so will) His messenger and the believers, and ye will be brought back to the Knower of the Invisible and the Visible, and He will tell you what ye used to do.'
    translation: Pickthall
    original: وَقُلِ ٱعْمَلُوا۟ فَسَيَرَى ٱللَّهُ عَمَلَكُمْ وَرَسُولُهُۥ وَٱلْمُؤْمِنُونَ ۖ وَسَتُرَدُّونَ إِلَىٰ عَـٰلِمِ ٱلْغَيْبِ وَٱلشَّهَـٰدَةِ فَيُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَ
    arabicPlain: وقل اعملوا فسيرى الله عملكم ورسوله والمؤمنون ۖ وستردون إلى عالم الغيب والشهادة فينبئكم بما كنتم تعملون
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 168
    page: 203
