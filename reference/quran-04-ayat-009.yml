- type: Ayah
  data:
    ref: '9:15'
    scripture: quran
    name: Quran 9:15
    chapter: 9
    verse: 15
    ordinal: 1250
    text: And He will remove the anger of their hearts. Allah relenteth toward whom He will. Allah is Knower, Wise.
    translation: Pickthall
    original: وَيُذْهِبْ غَيْظَ قُلُوبِهِمْ ۗ وَيَتُوبُ ٱللَّهُ عَلَىٰ مَن يَشَآءُ ۗ وَٱللَّهُ عَلِيمٌ حَكِيمٌ
    arabicPlain: ويذهب غيظ قلوبهم ۗ ويتوب الله على من يشاء ۗ والله عليم حكيم
    surahName: At-Tawba
    juz: 10
    manzil: 2
