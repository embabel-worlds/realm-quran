- type: Ayah
  data:
    ref: '9:6'
    scripture: quran
    name: Quran 9:6
    chapter: 9
    verse: 6
    ordinal: 1241
    text: And if anyone of the idolaters seeketh thy protection (O Muhammad), then protect him so that he may hear the Word of Allah, and afterward convey him to his place of safety. That is because they are a folk who know not.
    translation: Pickthall
    original: وَإِنْ أَحَدٌ مِّنَ ٱلْمُشْرِكِينَ ٱسْتَجَارَكَ فَأَجِرْهُ حَتَّىٰ يَسْمَعَ كَلَـٰمَ ٱللَّهِ ثُمَّ أَبْلِغْهُ مَأْمَنَهُۥ ۚ ذَٰلِكَ بِأَنَّهُمْ قَوْمٌ لَّا يَعْلَمُونَ
    arabicPlain: وإن أحد من المشركين استجارك فأجره حتى يسمع كلام الله ثم أبلغه مأمنه ۚ ذلك بأنهم قوم لا يعلمون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 156
    page: 187
