  data:
    ref: 9:88
    scripture: quran
    name: Quran 9:88
    chapter: 9
    verse: 88
    ordinal: 1323
    text: But the messenger and those who believe with him strive with their wealth and their lives. Such are they for whom are the good things. Such are they who are the successful.
    translation: Pickthall
    original: لَـٰكِنِ ٱلرَّسُولُ وَٱلَّذِينَ ءَامَنُوا۟ مَعَهُۥ جَـٰهَدُوا۟ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْ ۚ وَأُو۟لَـٰٓئِكَ لَهُمُ ٱلْخَيْرَٰتُ ۖ وَأُو۟لَـٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ
    arabicPlain: لكن الرسول والذين آمنوا معه جاهدوا بأموالهم وأنفسهم ۚ وأولئك لهم الخيرات ۖ وأولئك هم المفلحون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 166
    page: 201
