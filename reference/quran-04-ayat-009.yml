  data:
    ref: 9:73
    scripture: quran
    name: Quran 9:73
    chapter: 9
    verse: 73
    ordinal: 1308
    text: O Prophet! Strive against the disbelievers and the hypocrites! Be harsh with them. Their ultimate abode is hell, a hapless journey's end.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلنَّبِىُّ جَـٰهِدِ ٱلْكُفَّارَ وَٱلْمُنَـٰفِقِينَ وَٱغْلُظْ عَلَيْهِمْ ۚ وَمَأْوَىٰهُمْ جَهَنَّمُ ۖ وَبِئْسَ ٱلْمَصِيرُ
    arabicPlain: يا أيها النبي جاهد الكفار والمنافقين واغلظ عليهم ۚ ومأواهم جهنم ۖ وبئس المصير
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 165
    page: 199
  relations:
  - predicate: IN
    to:
      type: Surah
