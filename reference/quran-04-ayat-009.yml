  data:
    ref: 9:124
    scripture: quran
    name: Quran 9:124
    chapter: 9
    verse: 124
    ordinal: 1359
    text: 'And whenever a surah is revealed there are some of them who say: Which one of you hath thus increased in faith? As for those who believe, it hath increased them in faith and they rejoice (therefor).'
    translation: Pickthall
    original: وَإِذَا مَآ أُنزِلَتْ سُورَةٌ فَمِنْهُم مَّن يَقُولُ أَيُّكُمْ زَادَتْهُ هَـٰذِهِۦٓ إِيمَـٰنًا ۚ فَأَمَّا ٱلَّذِينَ ءَامَنُوا۟ فَزَادَتْهُمْ إِيمَـٰنًا وَهُمْ يَسْتَبْشِرُونَ
    arabicPlain: وإذا ما أنزلت سورة فمنهم من يقول أيكم زادته هذه إيمانا ۚ فأما الذين آمنوا فزادتهم إيمانا وهم يستبشرون
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 171
    page: 207
