  data:
    ref: '9:14'
    scripture: quran
    name: Quran 9:14
    chapter: 9
    verse: 14
    ordinal: 1249
    text: Fight them! Allah will chastise them at your hands, and He will lay them low and give you victory over them, and He will heal the breasts of folk who are believers.
    translation: Pickthall
    original: قَـٰتِلُوهُمْ يُعَذِّبْهُمُ ٱللَّهُ بِأَيْدِيكُمْ وَيُخْزِهِمْ وَيَنصُرْكُمْ عَلَيْهِمْ وَيَشْفِ صُدُورَ قَوْمٍ مُّؤْمِنِينَ
    arabicPlain: قاتلوهم يعذبهم الله بأيديكم ويخزهم وينصركم عليهم ويشف صدور قوم مؤمنين
    surahName: At-Tawba
    juz: 10
