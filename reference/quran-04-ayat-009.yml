  data:
    ref: 9:103
    scripture: quran
    name: Quran 9:103
    chapter: 9
    verse: 103
    ordinal: 1338
    text: Take alms of their wealth, wherewith thou mayst purify them and mayst make them grow, and pray for them. Lo! thy prayer is an assuagement for them. Allah is Hearer, Knower.
    translation: Pickthall
    original: خُذْ مِنْ أَمْوَٰلِهِمْ صَدَقَةً تُطَهِّرُهُمْ وَتُزَكِّيهِم بِهَا وَصَلِّ عَلَيْهِمْ ۖ إِنَّ صَلَوٰتَكَ سَكَنٌ لَّهُمْ ۗ وَٱللَّهُ سَمِيعٌ عَلِيمٌ
    arabicPlain: خذ من أموالهم صدقة تطهرهم وتزكيهم بها وصل عليهم ۖ إن صلاتك سكن لهم ۗ والله سميع عليم
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 168
    page: 203
