  data:
    ref: 9:89
    scripture: quran
    name: Quran 9:89
    chapter: 9
    verse: 89
    ordinal: 1324
    text: Allah hath made ready for them Gardens underneath which rivers flow, wherein they will abide. That is the supreme triumph.
    translation: Pickthall
    original: أَعَدَّ ٱللَّهُ لَهُمْ جَنَّـٰتٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ خَـٰلِدِينَ فِيهَا ۚ ذَٰلِكَ ٱلْفَوْزُ ٱلْعَظِيمُ
    arabicPlain: أعد الله لهم جنات تجري من تحتها الأنهار خالدين فيها ۚ ذلك الفوز العظيم
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 166
    page: 201
