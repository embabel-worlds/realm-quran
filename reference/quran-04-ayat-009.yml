  data:
    ref: 9:110
    scripture: quran
    name: Quran 9:110
    chapter: 9
    verse: 110
    ordinal: 1345
    text: The building which they built will never cease to be a misgiving in their hearts unless their hearts be torn to pieces. Allah is Knower, Wise.
    translation: Pickthall
    original: لَا يَزَالُ بُنْيَـٰنُهُمُ ٱلَّذِى بَنَوْا۟ رِيبَةً فِى قُلُوبِهِمْ إِلَّآ أَن تَقَطَّعَ قُلُوبُهُمْ ۗ وَٱللَّهُ عَلِيمٌ حَكِيمٌ
    arabicPlain: لا يزال بنيانهم الذي بنوا ريبة في قلوبهم إلا أن تقطع قلوبهم ۗ والله عليم حكيم
    surahName: At-Tawba
    juz: 11
