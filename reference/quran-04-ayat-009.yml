  data:
    ref: '9:35'
    scripture: quran
    name: Quran 9:35
    chapter: 9
    verse: 35
    ordinal: 1270
    text: 'On the day when it will (all) be heated in the fire of hell, and their foreheads and their flanks and their backs will be branded therewith (and it will be said unto them): Here is that which ye hoarded for yourselves. Now taste of what ye used to hoard.'
    translation: Pickthall
    original: يَوْمَ يُحْمَىٰ عَلَيْهَا فِى نَارِ جَهَنَّمَ فَتُكْوَىٰ بِهَا جِبَاهُهُمْ وَجُنُوبُهُمْ وَظُهُورُهُمْ ۖ هَـٰذَا مَا كَنَزْتُمْ لِأَنفُسِكُمْ فَذُوقُوا۟ مَا كُنتُمْ تَكْنِزُونَ
    arabicPlain: يوم يحمى عليها في نار جهنم فتكوى بها جباههم وجنوبهم وظهورهم ۖ هذا ما كنزتم لأنفسكم فذوقوا ما كنتم تكنزون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 160
    page: 192
