  data:
    ref: 9:93
    scripture: quran
    name: Quran 9:93
    chapter: 9
    verse: 93
    ordinal: 1328
    text: The road (of blame) is only against those who ask for leave of thee (to stay at home) when they are rich. They are content to be with the useless. Allah hath sealed their hearts so that they know not.
    translation: Pickthall
    original: ۞ إِنَّمَا ٱلسَّبِيلُ عَلَى ٱلَّذِينَ يَسْتَـْٔذِنُونَكَ وَهُمْ أَغْنِيَآءُ ۚ رَضُوا۟ بِأَن يَكُونُوا۟ مَعَ ٱلْخَوَالِفِ وَطَبَعَ ٱللَّهُ عَلَىٰ قُلُوبِهِمْ فَهُمْ لَا يَعْلَمُونَ
    arabicPlain: ۞ إنما السبيل على الذين يستأذنونك وهم أغنياء ۚ رضوا بأن يكونوا مع الخوالف وطبع الله على قلوبهم فهم لا يعلمون
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 167
    page: 201
