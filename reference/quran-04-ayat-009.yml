  data:
    ref: 9:87
    scripture: quran
    name: Quran 9:87
    chapter: 9
    verse: 87
    ordinal: 1322
    text: They are content that they should be with the useless and their hearts are sealed, so that they apprehend not.
    translation: Pickthall
    original: رَضُوا۟ بِأَن يَكُونُوا۟ مَعَ ٱلْخَوَالِفِ وَطُبِعَ عَلَىٰ قُلُوبِهِمْ فَهُمْ لَا يَفْقَهُونَ
    arabicPlain: رضوا بأن يكونوا مع الخوالف وطبع على قلوبهم فهم لا يفقهون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 166
    page: 201
