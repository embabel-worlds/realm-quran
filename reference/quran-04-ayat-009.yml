  data:
    ref: '9:41'
    scripture: quran
    name: Quran 9:41
    chapter: 9
    verse: 41
    ordinal: 1276
    text: Go forth, light-armed and heavy-armed, and strive with your wealth and your lives in the way of Allah! That is best for you if ye but knew.
    translation: Pickthall
    original: ٱنفِرُوا۟ خِفَافًا وَثِقَالًا وَجَـٰهِدُوا۟ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ فِى سَبِيلِ ٱللَّهِ ۚ ذَٰلِكُمْ خَيْرٌ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ
    arabicPlain: انفروا خفافا وثقالا وجاهدوا بأموالكم وأنفسكم في سبيل الله ۚ ذلكم خير لكم إن كنتم تعلمون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 161
    page: 194
