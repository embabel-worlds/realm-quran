  data:
    ref: '9:21'
    scripture: quran
    name: Quran 9:21
    chapter: 9
    verse: 21
    ordinal: 1256
    text: Their Lord giveth them good tidings of mercy from Him, and acceptance, and Gardens where enduring pleasure will be theirs;
    translation: Pickthall
    original: يُبَشِّرُهُمْ رَبُّهُم بِرَحْمَةٍ مِّنْهُ وَرِضْوَٰنٍ وَجَنَّـٰتٍ لَّهُمْ فِيهَا نَعِيمٌ مُّقِيمٌ
    arabicPlain: يبشرهم ربهم برحمة منه ورضوان وجنات لهم فيها نعيم مقيم
    surahName: At-Tawba
