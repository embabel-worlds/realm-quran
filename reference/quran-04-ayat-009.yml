  data:
    ref: '9:17'
    scripture: quran
    name: Quran 9:17
    chapter: 9
    verse: 17
    ordinal: 1252
    text: It is not for the idolaters to tend Allah's sanctuaries, bearing witness against themselves of disbelief. As for such, their works are vain and in the Fire they will abide.
    translation: Pickthall
    original: مَا كَانَ لِلْمُشْرِكِينَ أَن يَعْمُرُوا۟ مَسَـٰجِدَ ٱللَّهِ شَـٰهِدِينَ عَلَىٰٓ أَنفُسِهِم بِٱلْكُفْرِ ۚ أُو۟لَـٰٓئِكَ حَبِطَتْ أَعْمَـٰلُهُمْ وَفِى ٱلنَّارِ هُمْ خَـٰلِدُونَ
    arabicPlain: ما كان للمشركين أن يعمروا مساجد الله شاهدين على أنفسهم بالكفر ۚ أولئك حبطت أعمالهم وفي النار هم خالدون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 158
    page: 189
