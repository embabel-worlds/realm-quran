  data:
    ref: 9:125
    scripture: quran
    name: Quran 9:125
    chapter: 9
    verse: 125
    ordinal: 1360
    text: But as for those in whose hearts is disease, it only addeth wickedness to their wickedness, and they die while they are disbelievers.
    translation: Pickthall
    original: وَأَمَّا ٱلَّذِينَ فِى قُلُوبِهِم مَّرَضٌ فَزَادَتْهُمْ رِجْسًا إِلَىٰ رِجْسِهِمْ وَمَاتُوا۟ وَهُمْ كَـٰفِرُونَ
    arabicPlain: وأما الذين في قلوبهم مرض فزادتهم رجسا إلى رجسهم وماتوا وهم كافرون
    surahName: At-Tawba
    juz: 11
