  data:
    ref: 9:90
    scripture: quran
    name: Quran 9:90
    chapter: 9
    verse: 90
    ordinal: 1325
    text: And those among the wandering Arabs who had an excuse came in order that permission might be granted them. And those who lied to Allah and His messenger sat at home. A painful doom will fall on those of them who disbelieve.
    translation: Pickthall
    original: وَجَآءَ ٱلْمُعَذِّرُونَ مِنَ ٱلْأَعْرَابِ لِيُؤْذَنَ لَهُمْ وَقَعَدَ ٱلَّذِينَ كَذَبُوا۟ ٱللَّهَ وَرَسُولَهُۥ ۚ سَيُصِيبُ ٱلَّذِينَ كَفَرُوا۟ مِنْهُمْ عَذَابٌ أَلِيمٌ
    arabicPlain: وجاء المعذرون من الأعراب ليؤذن لهم وقعد الذين كذبوا الله ورسوله ۚ سيصيب الذين كفروا منهم عذاب أليم
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 167
