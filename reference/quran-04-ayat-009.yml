  data:
    ref: 9:84
    scripture: quran
    name: Quran 9:84
    chapter: 9
    verse: 84
    ordinal: 1319
    text: And never (O Muhammad) pray for one of them who dieth, nor stand by his grave. Lo! they disbelieved in Allah and His messenger, and they died while they were evil-doers.
    translation: Pickthall
    original: وَلَا تُصَلِّ عَلَىٰٓ أَحَدٍ مِّنْهُم مَّاتَ أَبَدًا وَلَا تَقُمْ عَلَىٰ قَبْرِهِۦٓ ۖ إِنَّهُمْ كَفَرُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَمَاتُوا۟ وَهُمْ فَـٰسِقُونَ
    arabicPlain: ولا تصل على أحد منهم مات أبدا ولا تقم على قبره ۖ إنهم كفروا بالله ورسوله وماتوا وهم فاسقون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 166
