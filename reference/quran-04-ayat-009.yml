  data:
    ref: 9:65
    scripture: quran
    name: Quran 9:65
    chapter: 9
    verse: 65
    ordinal: 1300
    text: 'And if thou ask them (O Muhammad) they will say: We did but talk and jest. Say: Was it at Allah and His revelations and His messenger that ye did scoff?'
    translation: Pickthall
    original: وَلَئِن سَأَلْتَهُمْ لَيَقُولُنَّ إِنَّمَا كُنَّا نَخُوضُ وَنَلْعَبُ ۚ قُلْ أَبِٱللَّهِ وَءَايَـٰتِهِۦ وَرَسُولِهِۦ كُنتُمْ تَسْتَهْزِءُونَ
    arabicPlain: ولئن سألتهم ليقولن إنما كنا نخوض ونلعب ۚ قل أبالله وآياته ورسوله كنتم تستهزئون
    surahName: At-Tawba
