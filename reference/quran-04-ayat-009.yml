- type: Ayah
  data:
    ref: '9:12'
    scripture: quran
    name: Quran 9:12
    chapter: 9
    verse: 12
    ordinal: 1247
    text: And if they break their pledges after their treaty (hath been made with you) and assail your religion, then fight the heads of disbelief - Lo! they have no binding oaths - in order that they may desist.
    translation: Pickthall
    original: وَإِن نَّكَثُوٓا۟ أَيْمَـٰنَهُم مِّنۢ بَعْدِ عَهْدِهِمْ وَطَعَنُوا۟ فِى دِينِكُمْ فَقَـٰتِلُوٓا۟ أَئِمَّةَ ٱلْكُفْرِ ۙ إِنَّهُمْ لَآ أَيْمَـٰنَ لَهُمْ لَعَلَّهُمْ يَنتَهُونَ
    arabicPlain: وإن نكثوا أيمانهم من بعد عهدهم وطعنوا في دينكم فقاتلوا أئمة الكفر ۙ إنهم لا أيمان لهم لعلهم ينتهون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 157
    page: 188
