- type: Ayah
  data:
    ref: '9:3'
    scripture: quran
    name: Quran 9:3
    chapter: 9
    verse: 3
    ordinal: 1238
    text: And a proclamation from Allah and His messenger to all men on the day of the Greater Pilgrimage that Allah is free from obligation to the idolaters, and (so is) His messenger. So, if ye repent, it will be better for you; but if ye are averse, then know that ye cannot escape Allah. Give tidings (O Muhammad) of a painful doom to those who disbelieve,
    translation: Pickthall
    original: وَأَذَٰنٌ مِّنَ ٱللَّهِ وَرَسُولِهِۦٓ إِلَى ٱلنَّاسِ يَوْمَ ٱلْحَجِّ ٱلْأَكْبَرِ أَنَّ ٱللَّهَ بَرِىٓءٌ مِّنَ ٱلْمُشْرِكِينَ ۙ وَرَسُولُهُۥ ۚ فَإِن تُبْتُمْ فَهُوَ خَيْرٌ لَّكُمْ ۖ وَإِن تَوَلَّيْتُمْ فَٱعْلَمُوٓا۟ أَنَّكُمْ غَيْرُ مُعْجِزِى ٱللَّهِ ۗ وَبَشِّرِ ٱلَّذِينَ كَفَرُوا۟ بِعَذَابٍ أَلِيمٍ
    arabicPlain: وأذان من الله ورسوله إلى الناس يوم الحج الأكبر أن الله بريء من المشركين ۙ ورسوله ۚ فإن تبتم فهو خير لكم ۖ وإن توليتم فاعلموا أنكم غير معجزي الله ۗ وبشر الذين كفروا بعذاب أليم
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 156
    page: 187
