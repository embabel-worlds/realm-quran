  data:
    ref: '9:25'
    scripture: quran
    name: Quran 9:25
    chapter: 9
    verse: 25
    ordinal: 1260
    text: Allah hath given you victory on many fields and on the day of Huneyn, when ye exulted in your multitude but it availed you naught, and the earth, vast as it is, was straitened for you; then ye turned back in flight;
    translation: Pickthall
    original: لَقَدْ نَصَرَكُمُ ٱللَّهُ فِى مَوَاطِنَ كَثِيرَةٍ ۙ وَيَوْمَ حُنَيْنٍ ۙ إِذْ أَعْجَبَتْكُمْ كَثْرَتُكُمْ فَلَمْ تُغْنِ عَنكُمْ شَيْـًٔا وَضَاقَتْ عَلَيْكُمُ ٱلْأَرْضُ بِمَا رَحُبَتْ ثُمَّ وَلَّيْتُم مُّدْبِرِينَ
    arabicPlain: لقد نصركم الله في مواطن كثيرة ۙ ويوم حنين ۙ إذ أعجبتكم كثرتكم فلم تغن عنكم شيئا وضاقت عليكم الأرض بما رحبت ثم وليتم مدبرين
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 159
    page: 190
  relations:
