  data:
    ref: 9:108
    scripture: quran
    name: Quran 9:108
    chapter: 9
    verse: 108
    ordinal: 1343
    text: Never stand (to pray) there. A place of worship which was found upon duty (to Allah) from the first day is more worthy that thou shouldst stand (to pray) therein, wherein are men who love to purify themselves. Allah loveth the purifiers.
    translation: Pickthall
    original: لَا تَقُمْ فِيهِ أَبَدًا ۚ لَّمَسْجِدٌ أُسِّسَ عَلَى ٱلتَّقْوَىٰ مِنْ أَوَّلِ يَوْمٍ أَحَقُّ أَن تَقُومَ فِيهِ ۚ فِيهِ رِجَالٌ يُحِبُّونَ أَن يَتَطَهَّرُوا۟ ۚ وَٱللَّهُ يُحِبُّ ٱلْمُطَّهِّرِينَ
    arabicPlain: لا تقم فيه أبدا ۚ لمسجد أسس على التقوى من أول يوم أحق أن تقوم فيه ۚ فيه رجال يحبون أن يتطهروا ۚ والله يحب المطهرين
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 168
    page: 204
