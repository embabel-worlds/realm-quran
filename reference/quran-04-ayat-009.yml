  data:
    ref: '9:20'
    scripture: quran
    name: Quran 9:20
    chapter: 9
    verse: 20
    ordinal: 1255
    text: Those who believe, and have left their homes and striven with their wealth and their lives in Allah's way are of much greater worth in Allah's sight. These are they who are triumphant.
    translation: Pickthall
    original: ٱلَّذِينَ ءَامَنُوا۟ وَهَاجَرُوا۟ وَجَـٰهَدُوا۟ فِى سَبِيلِ ٱللَّهِ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْ أَعْظَمُ دَرَجَةً عِندَ ٱللَّهِ ۚ وَأُو۟لَـٰٓئِكَ هُمُ ٱلْفَآئِزُونَ
    arabicPlain: الذين آمنوا وهاجروا وجاهدوا في سبيل الله بأموالهم وأنفسهم أعظم درجة عند الله ۚ وأولئك هم الفائزون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 158
