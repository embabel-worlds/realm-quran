  data:
    ref: '9:49'
    scripture: quran
    name: Quran 9:49
    chapter: 9
    verse: 49
    ordinal: 1284
    text: 'Of them is he who saith: Grant me leave (to stay at home) and tempt me not. Surely it is into temptation that they (thus) have fallen. Lo! hell verily is all around the disbelievers.'
    translation: Pickthall
    original: وَمِنْهُم مَّن يَقُولُ ٱئْذَن لِّى وَلَا تَفْتِنِّىٓ ۚ أَلَا فِى ٱلْفِتْنَةِ سَقَطُوا۟ ۗ وَإِنَّ جَهَنَّمَ لَمُحِيطَةٌۢ بِٱلْكَـٰفِرِينَ
    arabicPlain: ومنهم من يقول ائذن لي ولا تفتني ۚ ألا في الفتنة سقطوا ۗ وإن جهنم لمحيطة بالكافرين
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 195
  relations:
  - predicate: IN
    to:
