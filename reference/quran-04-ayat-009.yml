  data:
    ref: '9:50'
    scripture: quran
    name: Quran 9:50
    chapter: 9
    verse: 50
    ordinal: 1285
    text: 'If good befalleth thee (O Muhammad) it afflicteth them, and if calamity befalleth thee, they say: We took precaution, and they turn away well pleased.'
    translation: Pickthall
    original: إِن تُصِبْكَ حَسَنَةٌ تَسُؤْهُمْ ۖ وَإِن تُصِبْكَ مُصِيبَةٌ يَقُولُوا۟ قَدْ أَخَذْنَآ أَمْرَنَا مِن قَبْلُ وَيَتَوَلَّوا۟ وَّهُمْ فَرِحُونَ
    arabicPlain: إن تصبك حسنة تسؤهم ۖ وإن تصبك مصيبة يقولوا قد أخذنا أمرنا من قبل ويتولوا وهم فرحون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 195
  relations:
