  data:
    ref: 9:66
    scripture: quran
    name: Quran 9:66
    chapter: 9
    verse: 66
    ordinal: 1301
    text: Make no excuse. Ye have disbelieved after your (confession of) belief. If We forgive a party of you, a party of you We shall punish because they have been guilty.
    translation: Pickthall
    original: لَا تَعْتَذِرُوا۟ قَدْ كَفَرْتُم بَعْدَ إِيمَـٰنِكُمْ ۚ إِن نَّعْفُ عَن طَآئِفَةٍ مِّنكُمْ نُعَذِّبْ طَآئِفَةًۢ بِأَنَّهُمْ كَانُوا۟ مُجْرِمِينَ
    arabicPlain: لا تعتذروا قد كفرتم بعد إيمانكم ۚ إن نعف عن طائفة منكم نعذب طائفة بأنهم كانوا مجرمين
