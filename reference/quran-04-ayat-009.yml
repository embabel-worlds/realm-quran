- type: Ayah
  data:
    ref: '9:13'
    scripture: quran
    name: Quran 9:13
    chapter: 9
    verse: 13
    ordinal: 1248
    text: Will ye not fight a folk who broke their solemn pledges, and purposed to drive out the messenger and did attack you first? What! Fear ye them? Now Allah hath more right that ye should fear Him, if ye are believers
    translation: Pickthall
    original: أَلَا تُقَـٰتِلُونَ قَوْمًا نَّكَثُوٓا۟ أَيْمَـٰنَهُمْ وَهَمُّوا۟ بِإِخْرَاجِ ٱلرَّسُولِ وَهُم بَدَءُوكُمْ أَوَّلَ مَرَّةٍ ۚ أَتَخْشَوْنَهُمْ ۚ فَٱللَّهُ أَحَقُّ أَن تَخْشَوْهُ إِن كُنتُم مُّؤْمِنِينَ
    arabicPlain: ألا تقاتلون قوما نكثوا أيمانهم وهموا بإخراج الرسول وهم بدءوكم أول مرة ۚ أتخشونهم ۚ فالله أحق أن تخشوه إن كنتم مؤمنين
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 157
    page: 188
