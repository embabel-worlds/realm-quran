  data:
    ref: 9:102
    scripture: quran
    name: Quran 9:102
    chapter: 9
    verse: 102
    ordinal: 1337
    text: And (there are) others who have acknowledged their faults. They mixed a righteous action with another that was bad. It may be that Allah will relent toward them. Lo! Allah is Forgiving, Merciful.
    translation: Pickthall
    original: وَءَاخَرُونَ ٱعْتَرَفُوا۟ بِذُنُوبِهِمْ خَلَطُوا۟ عَمَلًا صَـٰلِحًا وَءَاخَرَ سَيِّئًا عَسَى ٱللَّهُ أَن يَتُوبَ عَلَيْهِمْ ۚ إِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ
    arabicPlain: وآخرون اعترفوا بذنوبهم خلطوا عملا صالحا وآخر سيئا عسى الله أن يتوب عليهم ۚ إن الله غفور رحيم
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 168
    page: 203
  relations:
  - predicate: IN
    to:
      type: Surah
