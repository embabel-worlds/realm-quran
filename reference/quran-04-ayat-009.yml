- type: Ayah
  data:
    ref: '9:8'
    scripture: quran
    name: Quran 9:8
    chapter: 9
    verse: 8
    ordinal: 1243
    text: How (can there be any treaty for the others) when, if they have the upper hand of you, they regard not pact nor honour in respect of you? They satisfy you with their mouths the while their hearts refuse. And most of them are wrongdoers.
    translation: Pickthall
    original: كَيْفَ وَإِن يَظْهَرُوا۟ عَلَيْكُمْ لَا يَرْقُبُوا۟ فِيكُمْ إِلًّا وَلَا ذِمَّةً ۚ يُرْضُونَكُم بِأَفْوَٰهِهِمْ وَتَأْبَىٰ قُلُوبُهُمْ وَأَكْثَرُهُمْ فَـٰسِقُونَ
    arabicPlain: كيف وإن يظهروا عليكم لا يرقبوا فيكم إلا ولا ذمة ۚ يرضونكم بأفواههم وتأبى قلوبهم وأكثرهم فاسقون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 157
    page: 188
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '9'
  - predicate: IN_PORTION
