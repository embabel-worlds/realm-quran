  data:
    ref: 9:96
    scripture: quran
    name: Quran 9:96
    chapter: 9
    verse: 96
    ordinal: 1331
    text: They swear unto you, that ye may accept them. Though ye accept them. Allah verily accepteth not wrongdoing folk.
    translation: Pickthall
    original: يَحْلِفُونَ لَكُمْ لِتَرْضَوْا۟ عَنْهُمْ ۖ فَإِن تَرْضَوْا۟ عَنْهُمْ فَإِنَّ ٱللَّهَ لَا يَرْضَىٰ عَنِ ٱلْقَوْمِ ٱلْفَـٰسِقِينَ
    arabicPlain: يحلفون لكم لترضوا عنهم ۖ فإن ترضوا عنهم فإن الله لا يرضى عن القوم الفاسقين
    surahName: At-Tawba
    juz: 11
