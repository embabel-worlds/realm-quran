  data:
    ref: 9:101
    scripture: quran
    name: Quran 9:101
    chapter: 9
    verse: 101
    ordinal: 1336
    text: And among those around you of the wandering Arabs there are hypocrites, and among the townspeople of Al-Madinah (there are some who) persist in hypocrisy whom thou (O Muhammad) knowest not. We, We know them, and We shall chastise them twice; then they will be relegated to a painful doom.
    translation: Pickthall
    original: وَمِمَّنْ حَوْلَكُم مِّنَ ٱلْأَعْرَابِ مُنَـٰفِقُونَ ۖ وَمِنْ أَهْلِ ٱلْمَدِينَةِ ۖ مَرَدُوا۟ عَلَى ٱلنِّفَاقِ لَا تَعْلَمُهُمْ ۖ نَحْنُ نَعْلَمُهُمْ ۚ سَنُعَذِّبُهُم مَّرَّتَيْنِ ثُمَّ يُرَدُّونَ إِلَىٰ عَذَابٍ عَظِيمٍ
    arabicPlain: وممن حولكم من الأعراب منافقون ۖ ومن أهل المدينة ۖ مردوا على النفاق لا تعلمهم ۖ نحن نعلمهم ۚ سنعذبهم مرتين ثم يردون إلى عذاب عظيم
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 168
    page: 203
  relations:
