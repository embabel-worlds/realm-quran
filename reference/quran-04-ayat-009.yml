  data:
    ref: 9:119
    scripture: quran
    name: Quran 9:119
    chapter: 9
    verse: 119
    ordinal: 1354
    text: O ye who believe! Be careful of your duty to Allah, and be with the truthful.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَكُونُوا۟ مَعَ ٱلصَّـٰدِقِينَ
    arabicPlain: يا أيها الذين آمنوا اتقوا الله وكونوا مع الصادقين
    surahName: At-Tawba
    juz: 11
    manzil: 2
