  data:
    ref: 9:91
    scripture: quran
    name: Quran 9:91
    chapter: 9
    verse: 91
    ordinal: 1326
    text: Not unto the weak nor unto the sick nor unto those who can find naught to spend is any fault (to be imputed though they stay at home) if they are true to Allah and His messenger. Not unto the good is there any road (of blame). Allah is Forgiving, Merciful.
    translation: Pickthall
    original: لَّيْسَ عَلَى ٱلضُّعَفَآءِ وَلَا عَلَى ٱلْمَرْضَىٰ وَلَا عَلَى ٱلَّذِينَ لَا يَجِدُونَ مَا يُنفِقُونَ حَرَجٌ إِذَا نَصَحُوا۟ لِلَّهِ وَرَسُولِهِۦ ۚ مَا عَلَى ٱلْمُحْسِنِينَ مِن سَبِيلٍ ۚ وَٱللَّهُ غَفُورٌ رَّحِيمٌ
    arabicPlain: ليس على الضعفاء ولا على المرضى ولا على الذين لا يجدون ما ينفقون حرج إذا نصحوا لله ورسوله ۚ ما على المحسنين من سبيل ۚ والله غفور رحيم
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 167
    page: 201
