  data:
    ref: '9:48'
    scripture: quran
    name: Quran 9:48
    chapter: 9
    verse: 48
    ordinal: 1283
    text: Aforetime they sought to cause sedition and raised difficulties for thee till the Truth came and the decree of Allah was made manifest, though they were loth.
    translation: Pickthall
    original: لَقَدِ ٱبْتَغَوُا۟ ٱلْفِتْنَةَ مِن قَبْلُ وَقَلَّبُوا۟ لَكَ ٱلْأُمُورَ حَتَّىٰ جَآءَ ٱلْحَقُّ وَظَهَرَ أَمْرُ ٱللَّهِ وَهُمْ كَـٰرِهُونَ
    arabicPlain: لقد ابتغوا الفتنة من قبل وقلبوا لك الأمور حتى جاء الحق وظهر أمر الله وهم كارهون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 195
