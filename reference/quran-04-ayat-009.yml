  data:
    ref: 9:126
    scripture: quran
    name: Quran 9:126
    chapter: 9
    verse: 126
    ordinal: 1361
    text: See they not that they are tested once or twice in every year? Still they turn not in repentance, neither pay they heed.
    translation: Pickthall
    original: أَوَلَا يَرَوْنَ أَنَّهُمْ يُفْتَنُونَ فِى كُلِّ عَامٍ مَّرَّةً أَوْ مَرَّتَيْنِ ثُمَّ لَا يَتُوبُونَ وَلَا هُمْ يَذَّكَّرُونَ
    arabicPlain: أولا يرون أنهم يفتنون في كل عام مرة أو مرتين ثم لا يتوبون ولا هم يذكرون
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 171
    page: 207
