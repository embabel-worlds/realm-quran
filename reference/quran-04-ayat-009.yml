    scripture: quran
    name: Quran 9:76
    chapter: 9
    verse: 76
    ordinal: 1311
    text: Yet when He gave them of His bounty, they hoarded it and turned away, averse;
    translation: Pickthall
    original: فَلَمَّآ ءَاتَىٰهُم مِّن فَضْلِهِۦ بَخِلُوا۟ بِهِۦ وَتَوَلَّوا۟ وَّهُم مُّعْرِضُونَ
    arabicPlain: فلما آتاهم من فضله بخلوا به وتولوا وهم معرضون
