  data:
    ref: 9:128
    scripture: quran
    name: Quran 9:128
    chapter: 9
    verse: 128
    ordinal: 1363
    text: There hath come unto you a messenger, (one) of yourselves, unto whom aught that ye are overburdened is grievous, full of concern for you, for the believers full of pity, merciful.
    translation: Pickthall
    original: لَقَدْ جَآءَكُمْ رَسُولٌ مِّنْ أَنفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُم بِٱلْمُؤْمِنِينَ رَءُوفٌ رَّحِيمٌ
    arabicPlain: لقد جاءكم رسول من أنفسكم عزيز عليه ما عنتم حريص عليكم بالمؤمنين رءوف رحيم
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 171
