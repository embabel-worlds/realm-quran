  data:
    ref: '9:46'
    scripture: quran
    name: Quran 9:46
    chapter: 9
    verse: 46
    ordinal: 1281
    text: 'And if they had wished to go forth they would assuredly have made ready some equipment, but Allah was averse to their being sent forth and held them back and it was said (unto them): Sit ye with the sedentary!'
    translation: Pickthall
    original: ۞ وَلَوْ أَرَادُوا۟ ٱلْخُرُوجَ لَأَعَدُّوا۟ لَهُۥ عُدَّةً وَلَـٰكِن كَرِهَ ٱللَّهُ ٱنۢبِعَاثَهُمْ فَثَبَّطَهُمْ وَقِيلَ ٱقْعُدُوا۟ مَعَ ٱلْقَـٰعِدِينَ
    arabicPlain: ۞ ولو أرادوا الخروج لأعدوا له عدة ولكن كره الله انبعاثهم فثبطهم وقيل اقعدوا مع القاعدين
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 194
