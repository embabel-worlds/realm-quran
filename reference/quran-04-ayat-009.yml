  data:
    ref: 9:127
    scripture: quran
    name: Quran 9:127
    chapter: 9
    verse: 127
    ordinal: 1362
    text: 'And whenever a surah is revealed, they look one at another (as who should say): Doth anybody see you? Then they turn away. Allah turneth away their hearts because they are a folk who understand not.'
    translation: Pickthall
    original: وَإِذَا مَآ أُنزِلَتْ سُورَةٌ نَّظَرَ بَعْضُهُمْ إِلَىٰ بَعْضٍ هَلْ يَرَىٰكُم مِّنْ أَحَدٍ ثُمَّ ٱنصَرَفُوا۟ ۚ صَرَفَ ٱللَّهُ قُلُوبَهُم بِأَنَّهُمْ قَوْمٌ لَّا يَفْقَهُونَ
    arabicPlain: وإذا ما أنزلت سورة نظر بعضهم إلى بعض هل يراكم من أحد ثم انصرفوا ۚ صرف الله قلوبهم بأنهم قوم لا يفقهون
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 171
