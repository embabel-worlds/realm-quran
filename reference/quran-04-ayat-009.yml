  data:
    ref: 9:129
    scripture: quran
    name: Quran 9:129
    chapter: 9
    verse: 129
    ordinal: 1364
    text: 'Now, if they turn away (O Muhammad) say: Allah sufficeth me. There is no Allah save Him. In Him have I put my trust, and He is Lord of the Tremendous Throne.'
    translation: Pickthall
    original: فَإِن تَوَلَّوْا۟ فَقُلْ حَسْبِىَ ٱللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ ۖ عَلَيْهِ تَوَكَّلْتُ ۖ وَهُوَ رَبُّ ٱلْعَرْشِ ٱلْعَظِيمِ
    arabicPlain: فإن تولوا فقل حسبي الله لا إله إلا هو ۖ عليه توكلت ۖ وهو رب العرش العظيم
    surahName: At-Tawba
    juz: 11
