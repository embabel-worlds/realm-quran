    name: Quran 9:106
    chapter: 9
    verse: 106
    ordinal: 1341
    text: And (there are) others who await Allah's decree, whether He will punish them or will forgive them. Allah is Knower, Wise.
    translation: Pickthall
    original: وَءَاخَرُونَ مُرْجَوْنَ لِأَمْرِ ٱللَّهِ إِمَّا يُعَذِّبُهُمْ وَإِمَّا يَتُوبُ عَلَيْهِمْ ۗ وَٱللَّهُ عَلِيمٌ حَكِيمٌ
    arabicPlain: وآخرون مرجون لأمر الله إما يعذبهم وإما يتوب عليهم ۗ والله عليم حكيم
    surahName: At-Tawba
