  data:
    ref: 9:123
    scripture: quran
    name: Quran 9:123
    chapter: 9
    verse: 123
    ordinal: 1358
    text: O ye who believe! Fight those of the disbelievers who are near to you, and let them find harshness in you, and know that Allah is with those who keep their duty (unto Him).
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ قَـٰتِلُوا۟ ٱلَّذِينَ يَلُونَكُم مِّنَ ٱلْكُفَّارِ وَلْيَجِدُوا۟ فِيكُمْ غِلْظَةً ۚ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ مَعَ ٱلْمُتَّقِينَ
    arabicPlain: يا أيها الذين آمنوا قاتلوا الذين يلونكم من الكفار وليجدوا فيكم غلظة ۚ واعلموا أن الله مع المتقين
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 171
    page: 207
