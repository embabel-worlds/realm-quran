  data:
    ref: '9:47'
    scripture: quran
    name: Quran 9:47
    chapter: 9
    verse: 47
    ordinal: 1282
    text: Had they gone forth among you they had added to you naught save trouble and had hurried to and fro among you, seeking to cause sedition among you; and among you there are some who would have listened to them. Allah is Aware of evil-doers.
    translation: Pickthall
    original: لَوْ خَرَجُوا۟ فِيكُم مَّا زَادُوكُمْ إِلَّا خَبَالًا وَلَأَوْضَعُوا۟ خِلَـٰلَكُمْ يَبْغُونَكُمُ ٱلْفِتْنَةَ وَفِيكُمْ سَمَّـٰعُونَ لَهُمْ ۗ وَٱللَّهُ عَلِيمٌۢ بِٱلظَّـٰلِمِينَ
    arabicPlain: لو خرجوا فيكم ما زادوكم إلا خبالا ولأوضعوا خلالكم يبغونكم الفتنة وفيكم سماعون لهم ۗ والله عليم بالظالمين
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 194
