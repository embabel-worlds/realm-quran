- type: Ayah
  data:
    ref: '9:11'
    scripture: quran
    name: Quran 9:11
    chapter: 9
    verse: 11
    ordinal: 1246
    text: But if they repent and establish worship and pay the poor-due, then are they your brethren in religion. We detail Our revelations for a people who have knowledge.
    translation: Pickthall
    original: فَإِن تَابُوا۟ وَأَقَامُوا۟ ٱلصَّلَوٰةَ وَءَاتَوُا۟ ٱلزَّكَوٰةَ فَإِخْوَٰنُكُمْ فِى ٱلدِّينِ ۗ وَنُفَصِّلُ ٱلْـَٔايَـٰتِ لِقَوْمٍ يَعْلَمُونَ
    arabicPlain: فإن تابوا وأقاموا الصلاة وآتوا الزكاة فإخوانكم في الدين ۗ ونفصل الآيات لقوم يعلمون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 157
    page: 188
