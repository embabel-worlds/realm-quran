  data:
    ref: 9:115
    scripture: quran
    name: Quran 9:115
    chapter: 9
    verse: 115
    ordinal: 1350
    text: It was never Allah's (part) that He should send a folk astray after He had guided them until He had made clear unto them what they should avoid. Lo! Allah is Aware of all things.
    translation: Pickthall
    original: وَمَا كَانَ ٱللَّهُ لِيُضِلَّ قَوْمًۢا بَعْدَ إِذْ هَدَىٰهُمْ حَتَّىٰ يُبَيِّنَ لَهُم مَّا يَتَّقُونَ ۚ إِنَّ ٱللَّهَ بِكُلِّ شَىْءٍ عَلِيمٌ
    arabicPlain: وما كان الله ليضل قوما بعد إذ هداهم حتى يبين لهم ما يتقون ۚ إن الله بكل شيء عليم
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 169
    page: 205
