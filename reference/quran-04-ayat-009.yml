- type: Ayah
  data:
    ref: '9:51'
    scripture: quran
    name: Quran 9:51
    chapter: 9
    verse: 51
    ordinal: 1286
    text: 'Say: Naught befalleth us save that which Allah hath decreed for us. He is our Protecting Friend. In Allah let believers put their trust!'
    translation: Pickthall
    original: قُل لَّن يُصِيبَنَآ إِلَّا مَا كَتَبَ ٱللَّهُ لَنَا هُوَ مَوْلَىٰنَا ۚ وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ
    arabicPlain: قل لن يصيبنا إلا ما كتب الله لنا هو مولانا ۚ وعلى الله فليتوكل المؤمنون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 195
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '9'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-10
- type: Ayah
  data:
    ref: '9:52'
    scripture: quran
    name: Quran 9:52
    chapter: 9
    verse: 52
    ordinal: 1287
    text: 'Say: Can ye await for us aught save one of two good things (death or victory in Allah''s way)? while we await for you that Allah will afflict you with a doom from Him or at our hands. Await then! Lo! We are awaiting with you.'
    translation: Pickthall
    original: قُلْ هَلْ تَرَبَّصُونَ بِنَآ إِلَّآ إِحْدَى ٱلْحُسْنَيَيْنِ ۖ وَنَحْنُ نَتَرَبَّصُ بِكُمْ أَن يُصِيبَكُمُ ٱللَّهُ بِعَذَابٍ مِّنْ عِندِهِۦٓ أَوْ بِأَيْدِينَا ۖ فَتَرَبَّصُوٓا۟ إِنَّا مَعَكُم مُّتَرَبِّصُونَ
    arabicPlain: قل هل تربصون بنا إلا إحدى الحسنيين ۖ ونحن نتربص بكم أن يصيبكم الله بعذاب من عنده أو بأيدينا ۖ فتربصوا إنا معكم متربصون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 162
    page: 195
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '9'
  - predicate: IN_PORTION
    to:
      type: Juz
