  data:
    ref: 9:98
    scripture: quran
    name: Quran 9:98
    chapter: 9
    verse: 98
    ordinal: 1333
    text: And of the wandering Arabs there is he who taketh that which he expendeth (for the cause of Allah) as a loss, and awaiteth (evil) turns of fortune for you (that he may be rid of it). The evil turn of fortune will be theirs. Allah is Hearer, Knower.
    translation: Pickthall
    original: وَمِنَ ٱلْأَعْرَابِ مَن يَتَّخِذُ مَا يُنفِقُ مَغْرَمًا وَيَتَرَبَّصُ بِكُمُ ٱلدَّوَآئِرَ ۚ عَلَيْهِمْ دَآئِرَةُ ٱلسَّوْءِ ۗ وَٱللَّهُ سَمِيعٌ عَلِيمٌ
    arabicPlain: ومن الأعراب من يتخذ ما ينفق مغرما ويتربص بكم الدوائر ۚ عليهم دائرة السوء ۗ والله سميع عليم
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 167
    page: 202
