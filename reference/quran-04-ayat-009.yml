  data:
    ref: 9:67
    scripture: quran
    name: Quran 9:67
    chapter: 9
    verse: 67
    ordinal: 1302
    text: The hypocrites, both men and women, proceed one from another. They enjoin the wrong, and they forbid the right, and they withhold their hands (from spending for the cause of Allah). They forget Allah, so He hath forgotten them. Lo! the hypocrites, they are the transgressors.
    translation: Pickthall
    original: ٱلْمُنَـٰفِقُونَ وَٱلْمُنَـٰفِقَـٰتُ بَعْضُهُم مِّنۢ بَعْضٍ ۚ يَأْمُرُونَ بِٱلْمُنكَرِ وَيَنْهَوْنَ عَنِ ٱلْمَعْرُوفِ وَيَقْبِضُونَ أَيْدِيَهُمْ ۚ نَسُوا۟ ٱللَّهَ فَنَسِيَهُمْ ۗ إِنَّ ٱلْمُنَـٰفِقِينَ هُمُ ٱلْفَـٰسِقُونَ
    arabicPlain: المنافقون والمنافقات بعضهم من بعض ۚ يأمرون بالمنكر وينهون عن المعروف ويقبضون أيديهم ۚ نسوا الله فنسيهم ۗ إن المنافقين هم الفاسقون
    surahName: At-Tawba
    juz: 10
    manzil: 2
    ruku: 164
