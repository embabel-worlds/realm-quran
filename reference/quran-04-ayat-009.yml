    name: Quran 9:75
    chapter: 9
    verse: 75
    ordinal: 1310
    text: 'And of them is he who made a covenant with Allah (saying): If He give us of His bounty we will give alms and become of the righteous.'
    translation: Pickthall
    original: ۞ وَمِنْهُم مَّنْ عَـٰهَدَ ٱللَّهَ لَئِنْ ءَاتَىٰنَا مِن فَضْلِهِۦ لَنَصَّدَّقَنَّ وَلَنَكُونَنَّ مِنَ ٱلصَّـٰلِحِينَ
