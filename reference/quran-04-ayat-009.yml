  data:
    ref: 9:104
    scripture: quran
    name: Quran 9:104
    chapter: 9
    verse: 104
    ordinal: 1339
    text: Know they not that Allah is He Who accepteth repentance from His bondmen and taketh the alms, and that Allah is He Who is the Relenting, the Merciful.
    translation: Pickthall
    original: أَلَمْ يَعْلَمُوٓا۟ أَنَّ ٱللَّهَ هُوَ يَقْبَلُ ٱلتَّوْبَةَ عَنْ عِبَادِهِۦ وَيَأْخُذُ ٱلصَّدَقَـٰتِ وَأَنَّ ٱللَّهَ هُوَ ٱلتَّوَّابُ ٱلرَّحِيمُ
    arabicPlain: ألم يعلموا أن الله هو يقبل التوبة عن عباده ويأخذ الصدقات وأن الله هو التواب الرحيم
    surahName: At-Tawba
    juz: 11
    manzil: 2
    ruku: 168
