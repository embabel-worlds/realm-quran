- type: Ayah
  data:
    ref: '9:2'
    scripture: quran
    name: Quran 9:2
    chapter: 9
    verse: 2
    ordinal: 1237
    text: Travel freely in the land four months, and know that ye cannot escape Allah and that Allah will confound the disbelievers (in His Guidance).
    translation: Pickthall
    original: فَسِيحُوا۟ فِى ٱلْأَرْضِ أَرْبَعَةَ أَشْهُرٍ وَٱعْلَمُوٓا۟ أَنَّكُمْ غَيْرُ مُعْجِزِى ٱللَّهِ ۙ وَأَنَّ ٱللَّهَ مُخْزِى ٱلْكَـٰفِرِينَ
    arabicPlain: فسيحوا في الأرض أربعة أشهر واعلموا أنكم غير معجزي الله ۙ وأن الله مخزي الكافرين
