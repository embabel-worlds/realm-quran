  data:
    ref: '9:27'
    scripture: quran
    name: Quran 9:27
    chapter: 9
    verse: 27
    ordinal: 1262
    text: Then afterward Allah will relent toward whom He will; for Allah is Forgiving, Merciful.
    translation: Pickthall
    original: ثُمَّ يَتُوبُ ٱللَّهُ مِنۢ بَعْدِ ذَٰلِكَ عَلَىٰ مَن يَشَآءُ ۗ وَٱللَّهُ غَفُورٌ رَّحِيمٌ
    arabicPlain: ثم يتوب الله من بعد ذلك على من يشاء ۗ والله غفور رحيم
    surahName: At-Tawba
    juz: 10
    manzil: 2
