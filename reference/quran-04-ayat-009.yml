  data:
    ref: 9:63
    scripture: quran
    name: Quran 9:63
    chapter: 9
    verse: 63
    ordinal: 1298
    text: Know they not that whoso opposeth Allah and His messenger, his verily is fire of hell, to abide therein? That is the extreme abasement.
    translation: Pickthall
    original: أَلَمْ يَعْلَمُوٓا۟ أَنَّهُۥ مَن يُحَادِدِ ٱللَّهَ وَرَسُولَهُۥ فَأَنَّ لَهُۥ نَارَ جَهَنَّمَ خَـٰلِدًا فِيهَا ۚ ذَٰلِكَ ٱلْخِزْىُ ٱلْعَظِيمُ
    arabicPlain: ألم يعلموا أنه من يحادد الله ورسوله فأن له نار جهنم خالدا فيها ۚ ذلك الخزي العظيم
