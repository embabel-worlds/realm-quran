    scripture: quran
    name: Quran 9:22
    chapter: 9
    verse: 22
    ordinal: 1257
    text: There they will abide for ever. Lo! with Allah there is immense reward.
    translation: Pickthall
    original: خَـٰلِدِينَ فِيهَآ أَبَدًا ۚ إِنَّ ٱللَّهَ عِندَهُۥٓ أَجْرٌ عَظِيمٌ
    arabicPlain: خالدين فيها أبدا ۚ إن الله عنده أجر عظيم
    surahName: At-Tawba
