  data:
    ref: 9:82
    scripture: quran
    name: Quran 9:82
    chapter: 9
    verse: 82
    ordinal: 1317
    text: 'Then let them laugh a little: they will weep much, as the reward of what they used to earn.'
    translation: Pickthall
    original: فَلْيَضْحَكُوا۟ قَلِيلًا وَلْيَبْكُوا۟ كَثِيرًا جَزَآءًۢ بِمَا كَانُوا۟ يَكْسِبُونَ
    arabicPlain: فليضحكوا قليلا وليبكوا كثيرا جزاء بما كانوا يكسبون
    surahName: At-Tawba
    juz: 10
