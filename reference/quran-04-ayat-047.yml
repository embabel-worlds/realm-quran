    scripture: quran
    name: Quran 47:9
    chapter: 47
    verse: 9
    ordinal: 4554
    text: That is because they are averse to that which Allah hath revealed, therefor maketh He their actions fruitless.
    translation: Pickthall
    original: ذَٰلِكَ بِأَنَّهُمْ كَرِهُوا۟ مَآ أَنزَلَ ٱللَّهُ فَأَحْبَطَ أَعْمَـٰلَهُمْ
