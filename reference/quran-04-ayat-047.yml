    scripture: quran
    name: Quran 47:29
    chapter: 47
    verse: 29
    ordinal: 4574
    text: Or do those in whose hearts is a disease deem that Allah will not bring to light their (secret) hates?
    translation: Pickthall
    original: أَمْ حَسِبَ ٱلَّذِينَ فِى قُلُوبِهِم مَّرَضٌ أَن لَّن يُخْرِجَ ٱللَّهُ أَضْغَـٰنَهُمْ
