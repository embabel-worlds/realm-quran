- type: Ayah
  data:
    ref: '47:3'
    scripture: quran
    name: Quran 47:3
    chapter: 47
    verse: 3
    ordinal: 4548
    text: That is because those who disbelieve follow falsehood and because those who believe follow the truth from their Lord. Thus Allah coineth their similitudes for mankind.
    translation: Pickthall
    original: ذَٰلِكَ بِأَنَّ ٱلَّذِينَ كَفَرُوا۟ ٱتَّبَعُوا۟ ٱلْبَـٰطِلَ وَأَنَّ ٱلَّذِينَ ءَامَنُوا۟ ٱتَّبَعُوا۟ ٱلْحَقَّ مِن رَّبِّهِمْ ۚ كَذَٰلِكَ يَضْرِبُ ٱللَّهُ لِلنَّاسِ أَمْثَـٰلَهُمْ
    arabicPlain: ذلك بأن الذين كفروا اتبعوا الباطل وأن الذين آمنوا اتبعوا الحق من ربهم ۚ كذلك يضرب الله للناس أمثالهم
    surahName: Muhammad
    juz: 26
    manzil: 6
    ruku: 442
    page: 507
