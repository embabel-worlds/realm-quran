    name: Quran 47:28
    chapter: 47
    verse: 28
    ordinal: 4573
    text: That will be because they followed that which angereth Allah, and hated that which pleaseth Him. Therefor He hath made their actions vain.
    translation: Pickthall
    original: ذَٰلِكَ بِأَنَّهُمُ ٱتَّبَعُوا۟ مَآ أَسْخَطَ ٱللَّهَ وَكَرِهُوا۟ رِضْوَٰنَهُۥ فَأَحْبَطَ أَعْمَـٰلَهُمْ
    arabicPlain: ذلك بأنهم اتبعوا ما أسخط الله وكرهوا رضوانه فأحبط أعمالهم
