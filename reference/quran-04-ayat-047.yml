    scripture: quran
    name: Quran 47:33
    chapter: 47
    verse: 33
    ordinal: 4578
    text: O ye who believe! Obey Allah and obey the messenger, and render not your actions vain.
    translation: Pickthall
    original: ۞ يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ أَطِيعُوا۟ ٱللَّهَ وَأَطِيعُوا۟ ٱلرَّسُولَ وَلَا تُبْطِلُوٓا۟ أَعْمَـٰلَكُمْ
    arabicPlain: ۞ يا أيها الذين آمنوا أطيعوا الله وأطيعوا الرسول ولا تبطلوا أعمالكم
    surahName: Muhammad
