  data:
    ref: '47:14'
    scripture: quran
    name: Quran 47:14
    chapter: 47
    verse: 14
    ordinal: 4559
    text: Is he who relieth on a clear proof from his Lord like those for whom the evil that they do is beautified while they follow their own lusts?
    translation: Pickthall
    original: أَفَمَن كَانَ عَلَىٰ بَيِّنَةٍ مِّن رَّبِّهِۦ كَمَن زُيِّنَ لَهُۥ سُوٓءُ عَمَلِهِۦ وَٱتَّبَعُوٓا۟ أَهْوَآءَهُم
    arabicPlain: أفمن كان على بينة من ربه كمن زين له سوء عمله واتبعوا أهواءهم
    surahName: Muhammad
    juz: 26
    manzil: 6
