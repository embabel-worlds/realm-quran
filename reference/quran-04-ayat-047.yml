    scripture: quran
    name: Quran 47:25
    chapter: 47
    verse: 25
    ordinal: 4570
    text: Lo! those who turn back after the guidance hath been manifested unto them, Satan hath seduced them, and He giveth them the rein.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ ٱرْتَدُّوا۟ عَلَىٰٓ أَدْبَـٰرِهِم مِّنۢ بَعْدِ مَا تَبَيَّنَ لَهُمُ ٱلْهُدَى ۙ ٱلشَّيْطَـٰنُ سَوَّلَ لَهُمْ وَأَمْلَىٰ لَهُمْ
