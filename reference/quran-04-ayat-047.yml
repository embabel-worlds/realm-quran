    scripture: quran
    name: Quran 47:34
    chapter: 47
    verse: 34
    ordinal: 4579
    text: Lo! those who disbelieve and turn from the way of Allah and then die disbelievers, Allah surely will not pardon them.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ كَفَرُوا۟ وَصَدُّوا۟ عَن سَبِيلِ ٱللَّهِ ثُمَّ مَاتُوا۟ وَهُمْ كُفَّارٌ فَلَن يَغْفِرَ ٱللَّهُ لَهُمْ
    arabicPlain: إن الذين كفروا وصدوا عن سبيل الله ثم ماتوا وهم كفار فلن يغفر الله لهم
