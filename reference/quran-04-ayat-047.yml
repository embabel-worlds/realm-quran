    name: Quran 47:22
    chapter: 47
    verse: 22
    ordinal: 4567
    text: Would ye then, if ye were given the command, work corruption in the land and sever your ties of kinship?
    translation: Pickthall
    original: فَهَلْ عَسَيْتُمْ إِن تَوَلَّيْتُمْ أَن تُفْسِدُوا۟ فِى ٱلْأَرْضِ وَتُقَطِّعُوٓا۟ أَرْحَامَكُمْ
