    name: Quran 47:27
    chapter: 47
    verse: 27
    ordinal: 4572
    text: Then how (will it be with them) when the angels gather them, smiting their faces and their backs!
    translation: Pickthall
    original: فَكَيْفَ إِذَا تَوَفَّتْهُمُ ٱلْمَلَـٰٓئِكَةُ يَضْرِبُونَ وُجُوهَهُمْ وَأَدْبَـٰرَهُمْ
    arabicPlain: فكيف إذا توفتهم الملائكة يضربون وجوههم وأدبارهم
