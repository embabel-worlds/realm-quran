    text: That is because Allah is patron of those who believe, and because the disbelievers have no patron.
    translation: Pickthall
    original: ذَٰلِكَ بِأَنَّ ٱللَّهَ مَوْلَى ٱلَّذِينَ ءَامَنُوا۟ وَأَنَّ ٱلْكَـٰفِرِينَ لَا مَوْلَىٰ لَهُمْ
    arabicPlain: ذلك بأن الله مولى الذين آمنوا وأن الكافرين لا مولى لهم
