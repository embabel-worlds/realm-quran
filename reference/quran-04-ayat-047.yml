    scripture: quran
    name: Quran 47:31
    chapter: 47
    verse: 31
    ordinal: 4576
    text: And verily We shall try you till We know those of you who strive hard (for the cause of Allah) and the steadfast, and till We test your record.
    translation: Pickthall
    original: وَلَنَبْلُوَنَّكُمْ حَتَّىٰ نَعْلَمَ ٱلْمُجَـٰهِدِينَ مِنكُمْ وَٱلصَّـٰبِرِينَ وَنَبْلُوَا۟ أَخْبَارَكُمْ
