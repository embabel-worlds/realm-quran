    scripture: quran
    name: Quran 47:21
    chapter: 47
    verse: 21
    ordinal: 4566
    text: Obedience and a civil word. Then, when the matter is determined, if they are loyal to Allah it will be well for them.
    translation: Pickthall
    original: طَاعَةٌ وَقَوْلٌ مَّعْرُوفٌ ۚ فَإِذَا عَزَمَ ٱلْأَمْرُ فَلَوْ صَدَقُوا۟ ٱللَّهَ لَكَانَ خَيْرًا لَّهُمْ
    arabicPlain: طاعة وقول معروف ۚ فإذا عزم الأمر فلو صدقوا الله لكان خيرا لهم
