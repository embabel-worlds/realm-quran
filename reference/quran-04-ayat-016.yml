  data:
    ref: 16:62
    scripture: quran
    name: Quran 16:62
    chapter: 16
    verse: 62
    ordinal: 1963
    text: And they assign unto Allah that which they (themselves) dislike, and their tongues expound the lie that the better portion will be theirs. Assuredly theirs will be the Fire, and they will be abandoned.
    translation: Pickthall
    original: وَيَجْعَلُونَ لِلَّهِ مَا يَكْرَهُونَ وَتَصِفُ أَلْسِنَتُهُمُ ٱلْكَذِبَ أَنَّ لَهُمُ ٱلْحُسْنَىٰ ۖ لَا جَرَمَ أَنَّ لَهُمُ ٱلنَّارَ وَأَنَّهُم مُّفْرَطُونَ
    arabicPlain: ويجعلون لله ما يكرهون وتصف ألسنتهم الكذب أن لهم الحسنى ۖ لا جرم أن لهم النار وأنهم مفرطون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 231
