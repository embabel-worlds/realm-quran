    scripture: quran
    name: Quran 16:3
    chapter: 16
    verse: 3
    ordinal: 1904
    text: He hath created the heavens and the earth with truth. High be He Exalted above all that they associate (with Him).
    translation: Pickthall
    original: خَلَقَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ بِٱلْحَقِّ ۚ تَعَـٰلَىٰ عَمَّا يُشْرِكُونَ
    arabicPlain: خلق السماوات والأرض بالحق ۚ تعالى عما يشركون
    surahName: An-Nahl
    juz: 14
    manzil: 3
