  data:
    ref: '16:20'
    scripture: quran
    name: Quran 16:20
    chapter: 16
    verse: 20
    ordinal: 1921
    text: Those unto whom they cry beside Allah created naught, but are themselves created.
    translation: Pickthall
    original: وَٱلَّذِينَ يَدْعُونَ مِن دُونِ ٱللَّهِ لَا يَخْلُقُونَ شَيْـًٔا وَهُمْ يُخْلَقُونَ
    arabicPlain: والذين يدعون من دون الله لا يخلقون شيئا وهم يخلقون
    surahName: An-Nahl
