  data:
    ref: 16:67
    scripture: quran
    name: Quran 16:67
    chapter: 16
    verse: 67
    ordinal: 1968
    text: And of the fruits of the date-palm, and grapes, whence ye derive strong drink and (also) good nourishment. Lo! therein is indeed a portent for people who have sense.
    translation: Pickthall
    original: وَمِن ثَمَرَٰتِ ٱلنَّخِيلِ وَٱلْأَعْنَـٰبِ تَتَّخِذُونَ مِنْهُ سَكَرًا وَرِزْقًا حَسَنًا ۗ إِنَّ فِى ذَٰلِكَ لَـَٔايَةً لِّقَوْمٍ يَعْقِلُونَ
    arabicPlain: ومن ثمرات النخيل والأعناب تتخذون منه سكرا ورزقا حسنا ۗ إن في ذلك لآية لقوم يعقلون
    surahName: An-Nahl
    juz: 14
