  data:
    ref: '16:4'
    scripture: quran
    name: Quran 16:4
    chapter: 16
    verse: 4
    ordinal: 1905
    text: He hath created man from a drop of fluid, yet behold! he is an open opponent.
    translation: Pickthall
    original: خَلَقَ ٱلْإِنسَـٰنَ مِن نُّطْفَةٍ فَإِذَا هُوَ خَصِيمٌ مُّبِينٌ
    arabicPlain: خلق الإنسان من نطفة فإذا هو خصيم مبين
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 224
