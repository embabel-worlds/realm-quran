  data:
    ref: '16:7'
    scripture: quran
    name: Quran 16:7
    chapter: 16
    verse: 7
    ordinal: 1908
    text: And they bear your loads for you unto a land ye could not reach save with great trouble to yourselves. Lo! your Lord is Full of Pity, Merciful.
    translation: Pickthall
    original: وَتَحْمِلُ أَثْقَالَكُمْ إِلَىٰ بَلَدٍ لَّمْ تَكُونُوا۟ بَـٰلِغِيهِ إِلَّا بِشِقِّ ٱلْأَنفُسِ ۚ إِنَّ رَبَّكُمْ لَرَءُوفٌ رَّحِيمٌ
    arabicPlain: وتحمل أثقالكم إلى بلد لم تكونوا بالغيه إلا بشق الأنفس ۚ إن ربكم لرءوف رحيم
    surahName: An-Nahl
