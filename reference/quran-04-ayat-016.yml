  data:
    ref: '16:28'
    scripture: quran
    name: Quran 16:28
    chapter: 16
    verse: 28
    ordinal: 1929
    text: 'Whom the angels cause to die while they are wronging themselves. Then will they make full submission (saying): We used not to do any wrong. Nay! Surely Allah is Knower of what ye used to do.'
    translation: Pickthall
    original: ٱلَّذِينَ تَتَوَفَّىٰهُمُ ٱلْمَلَـٰٓئِكَةُ ظَالِمِىٓ أَنفُسِهِمْ ۖ فَأَلْقَوُا۟ ٱلسَّلَمَ مَا كُنَّا نَعْمَلُ مِن سُوٓءٍۭ ۚ بَلَىٰٓ إِنَّ ٱللَّهَ عَلِيمٌۢ بِمَا كُنتُمْ تَعْمَلُونَ
    arabicPlain: الذين تتوفاهم الملائكة ظالمي أنفسهم ۖ فألقوا السلم ما كنا نعمل من سوء ۚ بلى إن الله عليم بما كنتم تعملون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 227
    page: 270
  relations:
