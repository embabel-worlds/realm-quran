  data:
    ref: 16:78
    scripture: quran
    name: Quran 16:78
    chapter: 16
    verse: 78
    ordinal: 1979
    text: And Allah brought you forth from the wombs of your mothers knowing nothing, and gave you hearing and sight and hearts that haply ye might give thanks.
    translation: Pickthall
    original: وَٱللَّهُ أَخْرَجَكُم مِّنۢ بُطُونِ أُمَّهَـٰتِكُمْ لَا تَعْلَمُونَ شَيْـًٔا وَجَعَلَ لَكُمُ ٱلسَّمْعَ وَٱلْأَبْصَـٰرَ وَٱلْأَفْـِٔدَةَ ۙ لَعَلَّكُمْ تَشْكُرُونَ
    arabicPlain: والله أخرجكم من بطون أمهاتكم لا تعلمون شيئا وجعل لكم السمع والأبصار والأفئدة ۙ لعلكم تشكرون
    surahName: An-Nahl
    juz: 14
