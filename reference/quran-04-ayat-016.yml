  data:
    ref: 16:88
    scripture: quran
    name: Quran 16:88
    chapter: 16
    verse: 88
    ordinal: 1989
    text: For those who disbelieve and debar (men) from the way of Allah, We add doom to doom because they wrought corruption,
    translation: Pickthall
    original: ٱلَّذِينَ كَفَرُوا۟ وَصَدُّوا۟ عَن سَبِيلِ ٱللَّهِ زِدْنَـٰهُمْ عَذَابًا فَوْقَ ٱلْعَذَابِ بِمَا كَانُوا۟ يُفْسِدُونَ
    arabicPlain: الذين كفروا وصدوا عن سبيل الله زدناهم عذابا فوق العذاب بما كانوا يفسدون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 235
    page: 277
  relations:
