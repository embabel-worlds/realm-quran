  data:
    ref: '16:8'
    scripture: quran
    name: Quran 16:8
    chapter: 16
    verse: 8
    ordinal: 1909
    text: And horses and mules and asses (hath He created) that ye may ride them, and for ornament. And He createth that which ye know not.
    translation: Pickthall
    original: وَٱلْخَيْلَ وَٱلْبِغَالَ وَٱلْحَمِيرَ لِتَرْكَبُوهَا وَزِينَةً ۚ وَيَخْلُقُ مَا لَا تَعْلَمُونَ
    arabicPlain: والخيل والبغال والحمير لتركبوها وزينة ۚ ويخلق ما لا تعلمون
    surahName: An-Nahl
    juz: 14
