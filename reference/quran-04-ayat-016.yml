  data:
    ref: '16:25'
    scripture: quran
    name: Quran 16:25
    chapter: 16
    verse: 25
    ordinal: 1926
    text: That they may bear their burdens undiminished on the Day of Resurrection, with somewhat of the burdens of those whom they mislead without knowledge. Ah! evil is that which they bear!
    translation: Pickthall
    original: لِيَحْمِلُوٓا۟ أَوْزَارَهُمْ كَامِلَةً يَوْمَ ٱلْقِيَـٰمَةِ ۙ وَمِنْ أَوْزَارِ ٱلَّذِينَ يُضِلُّونَهُم بِغَيْرِ عِلْمٍ ۗ أَلَا سَآءَ مَا يَزِرُونَ
    arabicPlain: ليحملوا أوزارهم كاملة يوم القيامة ۙ ومن أوزار الذين يضلونهم بغير علم ۗ ألا ساء ما يزرون
    surahName: An-Nahl
