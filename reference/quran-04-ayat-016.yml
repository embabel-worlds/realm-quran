    scripture: quran
    name: Quran 16:57
    chapter: 16
    verse: 57
    ordinal: 1958
    text: And they assign unto Allah daughters - Be He Glorified! - and unto themselves what they desire;
    translation: Pickthall
    original: وَيَجْعَلُونَ لِلَّهِ ٱلْبَنَـٰتِ سُبْحَـٰنَهُۥ ۙ وَلَهُم مَّا يَشْتَهُونَ
    arabicPlain: ويجعلون لله البنات سبحانه ۙ ولهم ما يشتهون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 230
