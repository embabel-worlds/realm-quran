  data:
    ref: '16:38'
    scripture: quran
    name: Quran 16:38
    chapter: 16
    verse: 38
    ordinal: 1939
    text: And they swear by Allah their most binding oaths (that) Allah will not raise up him who dieth. Nay, but it is a promise (binding) upon Him in truth, but most of mankind know not,
    translation: Pickthall
    original: وَأَقْسَمُوا۟ بِٱللَّهِ جَهْدَ أَيْمَـٰنِهِمْ ۙ لَا يَبْعَثُ ٱللَّهُ مَن يَمُوتُ ۚ بَلَىٰ وَعْدًا عَلَيْهِ حَقًّا وَلَـٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يَعْلَمُونَ
    arabicPlain: وأقسموا بالله جهد أيمانهم ۙ لا يبعث الله من يموت ۚ بلى وعدا عليه حقا ولكن أكثر الناس لا يعلمون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 228
