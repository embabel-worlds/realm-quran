  data:
    ref: '16:32'
    scripture: quran
    name: Quran 16:32
    chapter: 16
    verse: 32
    ordinal: 1933
    text: 'Those whom the angels cause to die (when they are) good. They say: Peace be unto you! Enter the Garden because of what ye used to do.'
    translation: Pickthall
    original: ٱلَّذِينَ تَتَوَفَّىٰهُمُ ٱلْمَلَـٰٓئِكَةُ طَيِّبِينَ ۙ يَقُولُونَ سَلَـٰمٌ عَلَيْكُمُ ٱدْخُلُوا۟ ٱلْجَنَّةَ بِمَا كُنتُمْ تَعْمَلُونَ
    arabicPlain: الذين تتوفاهم الملائكة طيبين ۙ يقولون سلام عليكم ادخلوا الجنة بما كنتم تعملون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 227
    page: 270
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '16'
  - predicate: IN_PORTION
