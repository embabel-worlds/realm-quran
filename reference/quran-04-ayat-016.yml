    name: Quran 16:39
    chapter: 16
    verse: 39
    ordinal: 1940
    text: That He may explain unto them that wherein they differ, and that those who disbelieved may know that they were liars.
    translation: Pickthall
    original: لِيُبَيِّنَ لَهُمُ ٱلَّذِى يَخْتَلِفُونَ فِيهِ وَلِيَعْلَمَ ٱلَّذِينَ كَفَرُوٓا۟ أَنَّهُمْ كَانُوا۟ كَـٰذِبِينَ
    arabicPlain: ليبين لهم الذي يختلفون فيه وليعلم الذين كفروا أنهم كانوا كاذبين
