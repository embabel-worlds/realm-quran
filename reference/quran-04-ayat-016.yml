- type: Ayah
  data:
    ref: '16:34'
    scripture: quran
    name: Quran 16:34
    chapter: 16
    verse: 34
    ordinal: 1935
    text: So that the evils of what they did smote them, and that which they used to mock surrounded them.
    translation: Pickthall
    original: فَأَصَابَهُمْ سَيِّـَٔاتُ مَا عَمِلُوا۟ وَحَاقَ بِهِم مَّا كَانُوا۟ بِهِۦ يَسْتَهْزِءُونَ
    arabicPlain: فأصابهم سيئات ما عملوا وحاق بهم ما كانوا به يستهزئون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 227
    page: 270
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '16'
  - predicate: IN_PORTION
    to:
      type: Juz
