  data:
    ref: '16:5'
    scripture: quran
    name: Quran 16:5
    chapter: 16
    verse: 5
    ordinal: 1906
    text: And the cattle hath He created, whence ye have warm clothing and uses, and whereof ye eat;
    translation: Pickthall
    original: وَٱلْأَنْعَـٰمَ خَلَقَهَا ۗ لَكُمْ فِيهَا دِفْءٌ وَمَنَـٰفِعُ وَمِنْهَا تَأْكُلُونَ
    arabicPlain: والأنعام خلقها ۗ لكم فيها دفء ومنافع ومنها تأكلون
    surahName: An-Nahl
    juz: 14
    manzil: 3
