  data:
    ref: 16:64
    scripture: quran
    name: Quran 16:64
    chapter: 16
    verse: 64
    ordinal: 1965
    text: And We have revealed the Scripture unto thee only that thou mayst explain unto them that wherein they differ, and (as) a guidance and a mercy for a people who believe.
    translation: Pickthall
    original: وَمَآ أَنزَلْنَا عَلَيْكَ ٱلْكِتَـٰبَ إِلَّا لِتُبَيِّنَ لَهُمُ ٱلَّذِى ٱخْتَلَفُوا۟ فِيهِ ۙ وَهُدًى وَرَحْمَةً لِّقَوْمٍ يُؤْمِنُونَ
    arabicPlain: وما أنزلنا عليك الكتاب إلا لتبين لهم الذي اختلفوا فيه ۙ وهدى ورحمة لقوم يؤمنون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 231
    page: 273
