    chapter: 16
    verse: 116
    ordinal: 2017
    text: 'And speak not, concerning that which your own tongues qualify (as clean or unclean), the falsehood: "This is lawful, and this is forbidden," so that ye invent a lie against Allah. Lo! those who invent a lie against Allah will not succeed.'
    translation: Pickthall
    original: وَلَا تَقُولُوا۟ لِمَا تَصِفُ أَلْسِنَتُكُمُ ٱلْكَذِبَ هَـٰذَا حَلَـٰلٌ وَهَـٰذَا حَرَامٌ لِّتَفْتَرُوا۟ عَلَى ٱللَّهِ ٱلْكَذِبَ ۚ إِنَّ ٱلَّذِينَ يَفْتَرُونَ عَلَى ٱللَّهِ ٱلْكَذِبَ لَا يُفْلِحُونَ
