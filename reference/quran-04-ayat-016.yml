  data:
    ref: '16:56'
    scripture: quran
    name: Quran 16:56
    chapter: 16
    verse: 56
    ordinal: 1957
    text: And they assign a portion of that which We have given them unto what they know not. By Allah! but ye will indeed be asked concerning (all) that ye used to invent.
    translation: Pickthall
    original: وَيَجْعَلُونَ لِمَا لَا يَعْلَمُونَ نَصِيبًا مِّمَّا رَزَقْنَـٰهُمْ ۗ تَٱللَّهِ لَتُسْـَٔلُنَّ عَمَّا كُنتُمْ تَفْتَرُونَ
    arabicPlain: ويجعلون لما لا يعلمون نصيبا مما رزقناهم ۗ تالله لتسألن عما كنتم تفترون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 230
    page: 273
  relations:
