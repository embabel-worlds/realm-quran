  data:
    ref: 16:107
    scripture: quran
    name: Quran 16:107
    chapter: 16
    verse: 107
    ordinal: 2008
    text: That is because they have chosen the life of the world rather than the Hereafter, and because Allah guideth not the disbelieving folk.
    translation: Pickthall
    original: ذَٰلِكَ بِأَنَّهُمُ ٱسْتَحَبُّوا۟ ٱلْحَيَوٰةَ ٱلدُّنْيَا عَلَى ٱلْـَٔاخِرَةِ وَأَنَّ ٱللَّهَ لَا يَهْدِى ٱلْقَوْمَ ٱلْكَـٰفِرِينَ
    arabicPlain: ذلك بأنهم استحبوا الحياة الدنيا على الآخرة وأن الله لا يهدي القوم الكافرين
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 237
    page: 279
  relations:
