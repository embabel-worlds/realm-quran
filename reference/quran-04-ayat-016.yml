  data:
    ref: 16:100
    scripture: quran
    name: Quran 16:100
    chapter: 16
    verse: 100
    ordinal: 2001
    text: His power is only over those who make a friend of him, and those who ascribe partners unto Him (Allah).
    translation: Pickthall
    original: إِنَّمَا سُلْطَـٰنُهُۥ عَلَى ٱلَّذِينَ يَتَوَلَّوْنَهُۥ وَٱلَّذِينَ هُم بِهِۦ مُشْرِكُونَ
