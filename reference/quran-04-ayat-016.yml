- type: Ayah
  data:
    ref: '16:2'
    scripture: quran
    name: Quran 16:2
    chapter: 16
    verse: 2
    ordinal: 1903
    text: 'He sendeth down the angels with the Spirit of His command unto whom He will of His bondmen, (saying): Warn mankind that there is no Allah save Me, so keep your duty unto Me.'
    translation: Pickthall
    original: يُنَزِّلُ ٱلْمَلَـٰٓئِكَةَ بِٱلرُّوحِ مِنْ أَمْرِهِۦ عَلَىٰ مَن يَشَآءُ مِنْ عِبَادِهِۦٓ أَنْ أَنذِرُوٓا۟ أَنَّهُۥ لَآ إِلَـٰهَ إِلَّآ أَنَا۠ فَٱتَّقُونِ
    arabicPlain: ينزل الملائكة بالروح من أمره على من يشاء من عباده أن أنذروا أنه لا إله إلا أنا فاتقون
    surahName: An-Nahl
    juz: 14
    manzil: 3
