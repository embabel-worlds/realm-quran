  data:
    ref: '16:58'
    scripture: quran
    name: Quran 16:58
    chapter: 16
    verse: 58
    ordinal: 1959
    text: When if one of them receiveth tidings of the birth of a female, his face remaineth darkened, and he is wroth inwardly.
    translation: Pickthall
    original: وَإِذَا بُشِّرَ أَحَدُهُم بِٱلْأُنثَىٰ ظَلَّ وَجْهُهُۥ مُسْوَدًّا وَهُوَ كَظِيمٌ
    arabicPlain: وإذا بشر أحدهم بالأنثى ظل وجهه مسودا وهو كظيم
    surahName: An-Nahl
    juz: 14
    manzil: 3
