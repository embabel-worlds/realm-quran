    scripture: quran
    name: Quran 16:18
    chapter: 16
    verse: 18
    ordinal: 1919
    text: And if ye would count the favour of Allah ye cannot reckon it. Lo! Allah is indeed Forgiving, Merciful.
    translation: Pickthall
    original: وَإِن تَعُدُّوا۟ نِعْمَةَ ٱللَّهِ لَا تُحْصُوهَآ ۗ إِنَّ ٱللَّهَ لَغَفُورٌ رَّحِيمٌ
    arabicPlain: وإن تعدوا نعمة الله لا تحصوها ۗ إن الله لغفور رحيم
    surahName: An-Nahl
