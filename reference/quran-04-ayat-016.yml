  data:
    ref: '16:43'
    scripture: quran
    name: Quran 16:43
    chapter: 16
    verse: 43
    ordinal: 1944
    text: And We sent not (as Our messengers) before thee other than men whom We inspired - Ask the followers of the Remembrance if ye know not! -
    translation: Pickthall
    original: وَمَآ أَرْسَلْنَا مِن قَبْلِكَ إِلَّا رِجَالًا نُّوحِىٓ إِلَيْهِمْ ۚ فَسْـَٔلُوٓا۟ أَهْلَ ٱلذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ
    arabicPlain: وما أرسلنا من قبلك إلا رجالا نوحي إليهم ۚ فاسألوا أهل الذكر إن كنتم لا تعلمون
