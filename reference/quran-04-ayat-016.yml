    scripture: quran
    name: Quran 16:95
    chapter: 16
    verse: 95
    ordinal: 1996
    text: And purchase not a small gain at the price of Allah's covenant. Lo! that which Allah hath is better for you, if ye did but know.
    translation: Pickthall
    original: وَلَا تَشْتَرُوا۟ بِعَهْدِ ٱللَّهِ ثَمَنًا قَلِيلًا ۚ إِنَّمَا عِندَ ٱللَّهِ هُوَ خَيْرٌ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ
    arabicPlain: ولا تشتروا بعهد الله ثمنا قليلا ۚ إنما عند الله هو خير لكم إن كنتم تعلمون
