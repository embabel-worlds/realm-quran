  data:
    ref: 16:84
    scripture: quran
    name: Quran 16:84
    chapter: 16
    verse: 84
    ordinal: 1985
    text: And (bethink you of) the day when we raise up of every nation a witness, then there is no leave for disbelievers, nor are they allowed to make amends.
    translation: Pickthall
    original: وَيَوْمَ نَبْعَثُ مِن كُلِّ أُمَّةٍ شَهِيدًا ثُمَّ لَا يُؤْذَنُ لِلَّذِينَ كَفَرُوا۟ وَلَا هُمْ يُسْتَعْتَبُونَ
    arabicPlain: ويوم نبعث من كل أمة شهيدا ثم لا يؤذن للذين كفروا ولا هم يستعتبون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 235
    page: 276
  relations:
