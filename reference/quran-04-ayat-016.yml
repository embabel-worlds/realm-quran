  data:
    ref: 16:82
    scripture: quran
    name: Quran 16:82
    chapter: 16
    verse: 82
    ordinal: 1983
    text: Then, if they turn away, thy duty (O Muhammad) is but plain conveyance (of the message).
    translation: Pickthall
    original: فَإِن تَوَلَّوْا۟ فَإِنَّمَا عَلَيْكَ ٱلْبَلَـٰغُ ٱلْمُبِينُ
    arabicPlain: فإن تولوا فإنما عليك البلاغ المبين
    surahName: An-Nahl
    juz: 14
    manzil: 3
