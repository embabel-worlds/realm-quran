    name: Quran 16:93
    chapter: 16
    verse: 93
    ordinal: 1994
    text: Had Allah willed He could have made you (all) one nation, but He sendeth whom He will astray and guideth whom He will, and ye will indeed be asked of what ye used to do.
    translation: Pickthall
    original: وَلَوْ شَآءَ ٱللَّهُ لَجَعَلَكُمْ أُمَّةً وَٰحِدَةً وَلَـٰكِن يُضِلُّ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ ۚ وَلَتُسْـَٔلُنَّ عَمَّا كُنتُمْ تَعْمَلُونَ
    arabicPlain: ولو شاء الله لجعلكم أمة واحدة ولكن يضل من يشاء ويهدي من يشاء ۚ ولتسألن عما كنتم تعملون
