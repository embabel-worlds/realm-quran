- type: Ayah
  data:
    ref: '16:35'
    scripture: quran
    name: Quran 16:35
    chapter: 16
    verse: 35
    ordinal: 1936
    text: 'And the idolaters say: Had Allah willed, we had not worshipped aught beside Him, we and our fathers, nor had we forbidden aught without (command from) Him. Even so did those before them. Are the messengers charged with aught save plain conveyance (of the message)?'
    translation: Pickthall
    original: وَقَالَ ٱلَّذِينَ أَشْرَكُوا۟ لَوْ شَآءَ ٱللَّهُ مَا عَبَدْنَا مِن دُونِهِۦ مِن شَىْءٍ نَّحْنُ وَلَآ ءَابَآؤُنَا وَلَا حَرَّمْنَا مِن دُونِهِۦ مِن شَىْءٍ ۚ كَذَٰلِكَ فَعَلَ ٱلَّذِينَ مِن قَبْلِهِمْ ۚ فَهَلْ عَلَى ٱلرُّسُلِ إِلَّا ٱلْبَلَـٰغُ ٱلْمُبِينُ
    arabicPlain: وقال الذين أشركوا لو شاء الله ما عبدنا من دونه من شيء نحن ولا آباؤنا ولا حرمنا من دونه من شيء ۚ كذلك فعل الذين من قبلهم ۚ فهل على الرسل إلا البلاغ المبين
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 228
    page: 271
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '16'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-14
- type: Ayah
  data:
    ref: '16:36'
    scripture: quran
    name: Quran 16:36
    chapter: 16
    verse: 36
    ordinal: 1937
    text: 'And verily We have raised in every nation a messenger, (proclaiming): Serve Allah and shun false gods. Then some of them (there were) whom Allah guided, and some of them (there were) upon whom error had just hold. Do but travel in the land and see the nature of the consequence for the deniers!'
    translation: Pickthall
    original: وَلَقَدْ بَعَثْنَا فِى كُلِّ أُمَّةٍ رَّسُولًا أَنِ ٱعْبُدُوا۟ ٱللَّهَ وَٱجْتَنِبُوا۟ ٱلطَّـٰغُوتَ ۖ فَمِنْهُم مَّنْ هَدَى ٱللَّهُ وَمِنْهُم مَّنْ حَقَّتْ عَلَيْهِ ٱلضَّلَـٰلَةُ ۚ فَسِيرُوا۟ فِى ٱلْأَرْضِ فَٱنظُرُوا۟ كَيْفَ كَانَ عَـٰقِبَةُ ٱلْمُكَذِّبِينَ
    arabicPlain: ولقد بعثنا في كل أمة رسولا أن اعبدوا الله واجتنبوا الطاغوت ۖ فمنهم من هدى الله ومنهم من حقت عليه الضلالة ۚ فسيروا في الأرض فانظروا كيف كان عاقبة المكذبين
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 228
    page: 271
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '16'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-14
- type: Ayah
  data:
    ref: '16:37'
    scripture: quran
    name: Quran 16:37
    chapter: 16
    verse: 37
    ordinal: 1938
    text: Even if thou (O Muhammad) desirest their right guidance, still Allah assuredly will not guide him who misleadeth. Such have no helpers.
    translation: Pickthall
    original: إِن تَحْرِصْ عَلَىٰ هُدَىٰهُمْ فَإِنَّ ٱللَّهَ لَا يَهْدِى مَن يُضِلُّ ۖ وَمَا لَهُم مِّن نَّـٰصِرِينَ
    arabicPlain: إن تحرص على هداهم فإن الله لا يهدي من يضل ۖ وما لهم من ناصرين
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 228
    page: 271
  relations:
