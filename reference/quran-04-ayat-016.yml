  data:
    ref: 16:97
    scripture: quran
    name: Quran 16:97
    chapter: 16
    verse: 97
    ordinal: 1998
    text: Whosoever doeth right, whether male or female, and is a believer, him verily we shall quicken with good life, and We shall pay them a recompense in proportion to the best of what they used to do.
    translation: Pickthall
    original: مَنْ عَمِلَ صَـٰلِحًا مِّن ذَكَرٍ أَوْ أُنثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُۥ حَيَوٰةً طَيِّبَةً ۖ وَلَنَجْزِيَنَّهُمْ أَجْرَهُم بِأَحْسَنِ مَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: من عمل صالحا من ذكر أو أنثى وهو مؤمن فلنحيينه حياة طيبة ۖ ولنجزينهم أجرهم بأحسن ما كانوا يعملون
