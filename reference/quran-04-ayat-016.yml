    scripture: quran
    name: Quran 16:23
    chapter: 16
    verse: 23
    ordinal: 1924
    text: Assuredly Allah knoweth that which they keep hidden and that which they proclaim. Lo! He loveth not the proud.
    translation: Pickthall
    original: لَا جَرَمَ أَنَّ ٱللَّهَ يَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَ ۚ إِنَّهُۥ لَا يُحِبُّ ٱلْمُسْتَكْبِرِينَ
    arabicPlain: لا جرم أن الله يعلم ما يسرون وما يعلنون ۚ إنه لا يحب المستكبرين
