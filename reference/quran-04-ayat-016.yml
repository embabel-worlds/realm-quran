  data:
    ref: 16:109
    scripture: quran
    name: Quran 16:109
    chapter: 16
    verse: 109
    ordinal: 2010
    text: Assuredly in the Hereafter they are the losers.
    translation: Pickthall
    original: لَا جَرَمَ أَنَّهُمْ فِى ٱلْـَٔاخِرَةِ هُمُ ٱلْخَـٰسِرُونَ
    arabicPlain: لا جرم أنهم في الآخرة هم الخاسرون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 237
    page: 279
  relations:
