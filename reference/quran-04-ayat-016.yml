  data:
    ref: 16:90
    scripture: quran
    name: Quran 16:90
    chapter: 16
    verse: 90
    ordinal: 1991
    text: Lo! Allah enjoineth justice and kindness, and giving to kinsfolk, and forbiddeth lewdness and abomination and wickedness. He exhorteth you in order that ye may take heed.
    translation: Pickthall
    original: ۞ إِنَّ ٱللَّهَ يَأْمُرُ بِٱلْعَدْلِ وَٱلْإِحْسَـٰنِ وَإِيتَآئِ ذِى ٱلْقُرْبَىٰ وَيَنْهَىٰ عَنِ ٱلْفَحْشَآءِ وَٱلْمُنكَرِ وَٱلْبَغْىِ ۚ يَعِظُكُمْ لَعَلَّكُمْ تَذَكَّرُونَ
    arabicPlain: ۞ إن الله يأمر بالعدل والإحسان وإيتاء ذي القربى وينهى عن الفحشاء والمنكر والبغي ۚ يعظكم لعلكم تذكرون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 236
    page: 277
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '16'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-14
- type: Ayah
  data:
    ref: 16:91
    scripture: quran
    name: Quran 16:91
    chapter: 16
    verse: 91
    ordinal: 1992
    text: Fulfil the covenant of Allah when ye have covenanted, and break not your oaths after the asseveration of them, and after ye have made Allah surety over you. Lo! Allah knoweth what ye do.
    translation: Pickthall
    original: وَأَوْفُوا۟ بِعَهْدِ ٱللَّهِ إِذَا عَـٰهَدتُّمْ وَلَا تَنقُضُوا۟ ٱلْأَيْمَـٰنَ بَعْدَ تَوْكِيدِهَا وَقَدْ جَعَلْتُمُ ٱللَّهَ عَلَيْكُمْ كَفِيلًا ۚ إِنَّ ٱللَّهَ يَعْلَمُ مَا تَفْعَلُونَ
    arabicPlain: وأوفوا بعهد الله إذا عاهدتم ولا تنقضوا الأيمان بعد توكيدها وقد جعلتم الله عليكم كفيلا ۚ إن الله يعلم ما تفعلون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 236
    page: 277
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '16'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-14
- type: Ayah
  data:
    ref: 16:92
    scripture: quran
    name: Quran 16:92
    chapter: 16
    verse: 92
    ordinal: 1993
    text: And be not like unto her who unravelleth the thread, after she hath made it strong, to thin filaments, making your oaths a deceit between you because of a nation being more numerous than (another) nation. Allah only trieth you thereby, and He verily will explain to you on the Day of Resurrection that wherein ye differed.
    translation: Pickthall
    original: وَلَا تَكُونُوا۟ كَٱلَّتِى نَقَضَتْ غَزْلَهَا مِنۢ بَعْدِ قُوَّةٍ أَنكَـٰثًا تَتَّخِذُونَ أَيْمَـٰنَكُمْ دَخَلًۢا بَيْنَكُمْ أَن تَكُونَ أُمَّةٌ هِىَ أَرْبَىٰ مِنْ أُمَّةٍ ۚ إِنَّمَا يَبْلُوكُمُ ٱللَّهُ بِهِۦ ۚ وَلَيُبَيِّنَنَّ لَكُمْ يَوْمَ ٱلْقِيَـٰمَةِ مَا كُنتُمْ فِيهِ تَخْتَلِفُونَ
    arabicPlain: ولا تكونوا كالتي نقضت غزلها من بعد قوة أنكاثا تتخذون أيمانكم دخلا بينكم أن تكون أمة هي أربى من أمة ۚ إنما يبلوكم الله به ۚ وليبينن لكم يوم القيامة ما كنتم فيه تختلفون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 236
