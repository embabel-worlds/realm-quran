  data:
    ref: '16:54'
    scripture: quran
    name: Quran 16:54
    chapter: 16
    verse: 54
    ordinal: 1955
    text: And afterward, when He hath rid you of the misfortune, behold! a set of you attribute partners to their Lord,
    translation: Pickthall
    original: ثُمَّ إِذَا كَشَفَ ٱلضُّرَّ عَنكُمْ إِذَا فَرِيقٌ مِّنكُم بِرَبِّهِمْ يُشْرِكُونَ
    arabicPlain: ثم إذا كشف الضر عنكم إذا فريق منكم بربهم يشركون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 230
    page: 272
  relations:
  - predicate: IN
    to:
      type: Surah
