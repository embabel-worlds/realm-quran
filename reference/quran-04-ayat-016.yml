    scripture: quran
    name: Quran 16:104
    chapter: 16
    verse: 104
    ordinal: 2005
    text: Lo! those who disbelieve the revelations of Allah, Allah guideth them not and theirs will be a painful doom.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ لَا يُؤْمِنُونَ بِـَٔايَـٰتِ ٱللَّهِ لَا يَهْدِيهِمُ ٱللَّهُ وَلَهُمْ عَذَابٌ أَلِيمٌ
    arabicPlain: إن الذين لا يؤمنون بآيات الله لا يهديهم الله ولهم عذاب أليم
    surahName: An-Nahl
    juz: 14
