  data:
    ref: 16:85
    scripture: quran
    name: Quran 16:85
    chapter: 16
    verse: 85
    ordinal: 1986
    text: And when those who did wrong behold the doom, it will not be made light for them, nor will they be reprieved.
    translation: Pickthall
    original: وَإِذَا رَءَا ٱلَّذِينَ ظَلَمُوا۟ ٱلْعَذَابَ فَلَا يُخَفَّفُ عَنْهُمْ وَلَا هُمْ يُنظَرُونَ
    arabicPlain: وإذا رأى الذين ظلموا العذاب فلا يخفف عنهم ولا هم ينظرون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 235
