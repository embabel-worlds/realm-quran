  data:
    ref: 16:71
    scripture: quran
    name: Quran 16:71
    chapter: 16
    verse: 71
    ordinal: 1972
    text: And Allah hath favoured some of you above others in provision. Now those who are more favoured will by no means hand over their provision to those (slaves) whom their right hands possess, so that they may be equal with them in respect thereof. Is it then the grace of Allah that they deny?
    translation: Pickthall
    original: وَٱللَّهُ فَضَّلَ بَعْضَكُمْ عَلَىٰ بَعْضٍ فِى ٱلرِّزْقِ ۚ فَمَا ٱلَّذِينَ فُضِّلُوا۟ بِرَآدِّى رِزْقِهِمْ عَلَىٰ مَا مَلَكَتْ أَيْمَـٰنُهُمْ فَهُمْ فِيهِ سَوَآءٌ ۚ أَفَبِنِعْمَةِ ٱللَّهِ يَجْحَدُونَ
    arabicPlain: والله فضل بعضكم على بعض في الرزق ۚ فما الذين فضلوا برادي رزقهم على ما ملكت أيمانهم فهم فيه سواء ۚ أفبنعمة الله يجحدون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 233
    page: 274
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '16'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-14
- type: Ayah
  data:
    ref: 16:72
    scripture: quran
    name: Quran 16:72
    chapter: 16
    verse: 72
    ordinal: 1973
    text: And Allah hath given you wives of your own kind, and hath given you, from your wives, sons and grandsons, and hath made provision of good things for you. Is it then in vanity that they believe and in the grace of Allah that they disbelieve?
    translation: Pickthall
    original: وَٱللَّهُ جَعَلَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَٰجًا وَجَعَلَ لَكُم مِّنْ أَزْوَٰجِكُم بَنِينَ وَحَفَدَةً وَرَزَقَكُم مِّنَ ٱلطَّيِّبَـٰتِ ۚ أَفَبِٱلْبَـٰطِلِ يُؤْمِنُونَ وَبِنِعْمَتِ ٱللَّهِ هُمْ يَكْفُرُونَ
    arabicPlain: والله جعل لكم من أنفسكم أزواجا وجعل لكم من أزواجكم بنين وحفدة ورزقكم من الطيبات ۚ أفبالباطل يؤمنون وبنعمت الله هم يكفرون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 233
    page: 274
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '16'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-14
- type: Ayah
  data:
    ref: 16:73
    scripture: quran
    name: Quran 16:73
    chapter: 16
    verse: 73
    ordinal: 1974
    text: And they worship beside Allah that which owneth no provision whatsoever for them from the heavens or the earth, nor have they (whom they worship) any power.
    translation: Pickthall
    original: وَيَعْبُدُونَ مِن دُونِ ٱللَّهِ مَا لَا يَمْلِكُ لَهُمْ رِزْقًا مِّنَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ شَيْـًٔا وَلَا يَسْتَطِيعُونَ
    arabicPlain: ويعبدون من دون الله ما لا يملك لهم رزقا من السماوات والأرض شيئا ولا يستطيعون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 233
    page: 275
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '16'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-14
- type: Ayah
  data:
    ref: 16:74
    scripture: quran
    name: Quran 16:74
    chapter: 16
    verse: 74
    ordinal: 1975
    text: So coin not similitudes for Allah. Lo! Allah knoweth; ye know not.
    translation: Pickthall
    original: فَلَا تَضْرِبُوا۟ لِلَّهِ ٱلْأَمْثَالَ ۚ إِنَّ ٱللَّهَ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ
    arabicPlain: فلا تضربوا لله الأمثال ۚ إن الله يعلم وأنتم لا تعلمون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 233
    page: 275
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '16'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-14
- type: Ayah
  data:
    ref: 16:75
    scripture: quran
    name: Quran 16:75
    chapter: 16
    verse: 75
    ordinal: 1976
    text: 'Allah coineth a similitude: (on the one hand) a (mere) chattel slave, who hath control of nothing, and (on the other hand) one on whom we have bestowed a fair provision from Us, and he spendeth thereof secretly and openly. Are they equal? Praise be to Allah! But most of them know not.'
    translation: Pickthall
    original: ۞ ضَرَبَ ٱللَّهُ مَثَلًا عَبْدًا مَّمْلُوكًا لَّا يَقْدِرُ عَلَىٰ شَىْءٍ وَمَن رَّزَقْنَـٰهُ مِنَّا رِزْقًا حَسَنًا فَهُوَ يُنفِقُ مِنْهُ سِرًّا وَجَهْرًا ۖ هَلْ يَسْتَوُۥنَ ۚ ٱلْحَمْدُ لِلَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ
    arabicPlain: ۞ ضرب الله مثلا عبدا مملوكا لا يقدر على شيء ومن رزقناه منا رزقا حسنا فهو ينفق منه سرا وجهرا ۖ هل يستوون ۚ الحمد لله ۚ بل أكثرهم لا يعلمون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 233
    page: 275
  relations:
  - predicate: IN
    to:
