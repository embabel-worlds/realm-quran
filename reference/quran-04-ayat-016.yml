  data:
    ref: '16:45'
    scripture: quran
    name: Quran 16:45
    chapter: 16
    verse: 45
    ordinal: 1946
    text: Are they who plan ill-deeds then secure that Allah will not cause the earth to swallow them, or that the doom will not come on them whence they know not?
    translation: Pickthall
    original: أَفَأَمِنَ ٱلَّذِينَ مَكَرُوا۟ ٱلسَّيِّـَٔاتِ أَن يَخْسِفَ ٱللَّهُ بِهِمُ ٱلْأَرْضَ أَوْ يَأْتِيَهُمُ ٱلْعَذَابُ مِنْ حَيْثُ لَا يَشْعُرُونَ
    arabicPlain: أفأمن الذين مكروا السيئات أن يخسف الله بهم الأرض أو يأتيهم العذاب من حيث لا يشعرون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 229
    page: 272
