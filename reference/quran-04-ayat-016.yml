  data:
    ref: 16:96
    scripture: quran
    name: Quran 16:96
    chapter: 16
    verse: 96
    ordinal: 1997
    text: That which ye have wasteth away, and that which Allah hath remaineth. And verily We shall pay those who are steadfast a recompense in proportion to the best of what they used to do.
    translation: Pickthall
    original: مَا عِندَكُمْ يَنفَدُ ۖ وَمَا عِندَ ٱللَّهِ بَاقٍ ۗ وَلَنَجْزِيَنَّ ٱلَّذِينَ صَبَرُوٓا۟ أَجْرَهُم بِأَحْسَنِ مَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: ما عندكم ينفد ۖ وما عند الله باق ۗ ولنجزين الذين صبروا أجرهم بأحسن ما كانوا يعملون
