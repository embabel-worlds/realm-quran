    scripture: quran
    name: Quran 16:52
    chapter: 16
    verse: 52
    ordinal: 1953
    text: Unto Him belongeth whatsoever is in the heavens and the earth, and religion is His for ever. Will ye then fear any other than Allah?
    translation: Pickthall
    original: وَلَهُۥ مَا فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَلَهُ ٱلدِّينُ وَاصِبًا ۚ أَفَغَيْرَ ٱللَّهِ تَتَّقُونَ
    arabicPlain: وله ما في السماوات والأرض وله الدين واصبا ۚ أفغير الله تتقون
    surahName: An-Nahl
    juz: 14
    manzil: 3
