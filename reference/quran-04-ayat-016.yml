    scripture: quran
    name: Quran 16:22
    chapter: 16
    verse: 22
    ordinal: 1923
    text: Your Allah is One Allah. But as for those who believe not in the Hereafter their hearts refuse to know, for they are proud.
    translation: Pickthall
    original: إِلَـٰهُكُمْ إِلَـٰهٌ وَٰحِدٌ ۚ فَٱلَّذِينَ لَا يُؤْمِنُونَ بِٱلْـَٔاخِرَةِ قُلُوبُهُم مُّنكِرَةٌ وَهُم مُّسْتَكْبِرُونَ
    arabicPlain: إلهكم إله واحد ۚ فالذين لا يؤمنون بالآخرة قلوبهم منكرة وهم مستكبرون
