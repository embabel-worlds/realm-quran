    chapter: 16
    verse: 19
    ordinal: 1920
    text: And Allah knoweth that which ye keep hidden and that which ye proclaim.
    translation: Pickthall
    original: وَٱللَّهُ يَعْلَمُ مَا تُسِرُّونَ وَمَا تُعْلِنُونَ
    arabicPlain: والله يعلم ما تسرون وما تعلنون
