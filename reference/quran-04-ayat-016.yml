    scripture: quran
    name: Quran 16:40
    chapter: 16
    verse: 40
    ordinal: 1941
    text: 'And Our word unto a thing, when We intend it, is only that We say unto it: Be! and it is.'
    translation: Pickthall
    original: إِنَّمَا قَوْلُنَا لِشَىْءٍ إِذَآ أَرَدْنَـٰهُ أَن نَّقُولَ لَهُۥ كُن فَيَكُونُ
