  data:
    ref: 16:68
    scripture: quran
    name: Quran 16:68
    chapter: 16
    verse: 68
    ordinal: 1969
    text: 'And thy Lord inspired the bee, saying: Choose thou habitations in the hills and in the trees and in that which they thatch;'
    translation: Pickthall
    original: وَأَوْحَىٰ رَبُّكَ إِلَى ٱلنَّحْلِ أَنِ ٱتَّخِذِى مِنَ ٱلْجِبَالِ بُيُوتًا وَمِنَ ٱلشَّجَرِ وَمِمَّا يَعْرِشُونَ
    arabicPlain: وأوحى ربك إلى النحل أن اتخذي من الجبال بيوتا ومن الشجر ومما يعرشون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 232
