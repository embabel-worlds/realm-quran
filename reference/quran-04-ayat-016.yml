  data:
    ref: '16:44'
    scripture: quran
    name: Quran 16:44
    chapter: 16
    verse: 44
    ordinal: 1945
    text: With clear proofs and writings; and We have revealed unto thee the Remembrance that thou mayst explain to mankind that which hath been revealed for them, and that haply they may reflect.
    translation: Pickthall
    original: بِٱلْبَيِّنَـٰتِ وَٱلزُّبُرِ ۗ وَأَنزَلْنَآ إِلَيْكَ ٱلذِّكْرَ لِتُبَيِّنَ لِلنَّاسِ مَا نُزِّلَ إِلَيْهِمْ وَلَعَلَّهُمْ يَتَفَكَّرُونَ
    arabicPlain: بالبينات والزبر ۗ وأنزلنا إليك الذكر لتبين للناس ما نزل إليهم ولعلهم يتفكرون
    surahName: An-Nahl
    juz: 14
    manzil: 3
