    scripture: quran
    name: Quran 16:101
    chapter: 16
    verse: 101
    ordinal: 2002
    text: 'And when We put a revelation in place of (another) revelation, - and Allah knoweth best what He revealeth - they say: Lo! thou art but inventing. Most of them know not.'
    translation: Pickthall
    original: وَإِذَا بَدَّلْنَآ ءَايَةً مَّكَانَ ءَايَةٍ ۙ وَٱللَّهُ أَعْلَمُ بِمَا يُنَزِّلُ قَالُوٓا۟ إِنَّمَآ أَنتَ مُفْتَرٍۭ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ
    arabicPlain: وإذا بدلنا آية مكان آية ۙ والله أعلم بما ينزل قالوا إنما أنت مفتر ۚ بل أكثرهم لا يعلمون
    surahName: An-Nahl
