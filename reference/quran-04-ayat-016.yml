    scripture: quran
    name: Quran 16:50
    chapter: 16
    verse: 50
    ordinal: 1951
    text: They fear their Lord above them, and do what they are bidden.
    translation: Pickthall
    original: يَخَافُونَ رَبَّهُم مِّن فَوْقِهِمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ ۩
    arabicPlain: يخافون ربهم من فوقهم ويفعلون ما يؤمرون ۩
