- type: Ayah
  data:
    ref: '16:11'
    scripture: quran
    name: Quran 16:11
    chapter: 16
    verse: 11
    ordinal: 1912
    text: Therewith He causeth crops to grow for you, and the olive and the date-palm and grapes and all kinds of fruit. Lo! herein is indeed a portent for people who reflect.
    translation: Pickthall
    original: يُنۢبِتُ لَكُم بِهِ ٱلزَّرْعَ وَٱلزَّيْتُونَ وَٱلنَّخِيلَ وَٱلْأَعْنَـٰبَ وَمِن كُلِّ ٱلثَّمَرَٰتِ ۗ إِنَّ فِى ذَٰلِكَ لَـَٔايَةً لِّقَوْمٍ يَتَفَكَّرُونَ
    arabicPlain: ينبت لكم به الزرع والزيتون والنخيل والأعناب ومن كل الثمرات ۗ إن في ذلك لآية لقوم يتفكرون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 225
