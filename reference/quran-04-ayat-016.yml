  data:
    ref: 16:69
    scripture: quran
    name: Quran 16:69
    chapter: 16
    verse: 69
    ordinal: 1970
    text: Then eat of all fruits, and follow the ways of thy Lord, made smooth (for thee). There cometh forth from their bellies a drink divers of hues, wherein is healing for mankind. Lo! herein is indeed a portent for people who reflect.
    translation: Pickthall
    original: ثُمَّ كُلِى مِن كُلِّ ٱلثَّمَرَٰتِ فَٱسْلُكِى سُبُلَ رَبِّكِ ذُلُلًا ۚ يَخْرُجُ مِنۢ بُطُونِهَا شَرَابٌ مُّخْتَلِفٌ أَلْوَٰنُهُۥ فِيهِ شِفَآءٌ لِّلنَّاسِ ۗ إِنَّ فِى ذَٰلِكَ لَـَٔايَةً لِّقَوْمٍ يَتَفَكَّرُونَ
    arabicPlain: ثم كلي من كل الثمرات فاسلكي سبل ربك ذللا ۚ يخرج من بطونها شراب مختلف ألوانه فيه شفاء للناس ۗ إن في ذلك لآية لقوم يتفكرون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 232
    page: 274
