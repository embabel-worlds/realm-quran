  data:
    ref: 16:79
    scripture: quran
    name: Quran 16:79
    chapter: 16
    verse: 79
    ordinal: 1980
    text: Have they not seen the birds obedient in mid-air? None holdeth them save Allah. Lo! herein, verily, are portents for a people who believe.
    translation: Pickthall
    original: أَلَمْ يَرَوْا۟ إِلَى ٱلطَّيْرِ مُسَخَّرَٰتٍ فِى جَوِّ ٱلسَّمَآءِ مَا يُمْسِكُهُنَّ إِلَّا ٱللَّهُ ۗ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍ لِّقَوْمٍ يُؤْمِنُونَ
    arabicPlain: ألم يروا إلى الطير مسخرات في جو السماء ما يمسكهن إلا الله ۗ إن في ذلك لآيات لقوم يؤمنون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 234
