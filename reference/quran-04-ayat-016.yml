  data:
    ref: 16:86
    scripture: quran
    name: Quran 16:86
    chapter: 16
    verse: 86
    ordinal: 1987
    text: 'And when those who ascribed partners to Allah behold those partners of theirs, they will say: Our Lord! these are our partners unto whom we used to cry instead of Thee. But they will fling to them the saying: Lo! ye verily are liars!'
    translation: Pickthall
    original: وَإِذَا رَءَا ٱلَّذِينَ أَشْرَكُوا۟ شُرَكَآءَهُمْ قَالُوا۟ رَبَّنَا هَـٰٓؤُلَآءِ شُرَكَآؤُنَا ٱلَّذِينَ كُنَّا نَدْعُوا۟ مِن دُونِكَ ۖ فَأَلْقَوْا۟ إِلَيْهِمُ ٱلْقَوْلَ إِنَّكُمْ لَكَـٰذِبُونَ
    arabicPlain: وإذا رأى الذين أشركوا شركاءهم قالوا ربنا هؤلاء شركاؤنا الذين كنا ندعو من دونك ۖ فألقوا إليهم القول إنكم لكاذبون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 235
    page: 276
