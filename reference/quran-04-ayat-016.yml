  data:
    ref: '16:13'
    scripture: quran
    name: Quran 16:13
    chapter: 16
    verse: 13
    ordinal: 1914
    text: And whatsoever He hath created for you in the earth of divers hues, lo! therein is indeed a portent for people who take heed.
    translation: Pickthall
    original: وَمَا ذَرَأَ لَكُمْ فِى ٱلْأَرْضِ مُخْتَلِفًا أَلْوَٰنُهُۥٓ ۗ إِنَّ فِى ذَٰلِكَ لَـَٔايَةً لِّقَوْمٍ يَذَّكَّرُونَ
    arabicPlain: وما ذرأ لكم في الأرض مختلفا ألوانه ۗ إن في ذلك لآية لقوم يذكرون
    surahName: An-Nahl
    juz: 14
