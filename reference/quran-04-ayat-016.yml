- type: Ayah
  data:
    ref: '16:12'
    scripture: quran
    name: Quran 16:12
    chapter: 16
    verse: 12
    ordinal: 1913
    text: And He hath constrained the night and the day and the sun and the moon to be of service unto you, and the stars are made subservient by His command. Lo! herein indeed are portents for people who have sense.
    translation: Pickthall
    original: وَسَخَّرَ لَكُمُ ٱلَّيْلَ وَٱلنَّهَارَ وَٱلشَّمْسَ وَٱلْقَمَرَ ۖ وَٱلنُّجُومُ مُسَخَّرَٰتٌۢ بِأَمْرِهِۦٓ ۗ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍ لِّقَوْمٍ يَعْقِلُونَ
    arabicPlain: وسخر لكم الليل والنهار والشمس والقمر ۖ والنجوم مسخرات بأمره ۗ إن في ذلك لآيات لقوم يعقلون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 225
