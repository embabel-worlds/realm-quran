    name: Quran 16:98
    chapter: 16
    verse: 98
    ordinal: 1999
    text: And when thou recitest the Qur'an, seek refuge in Allah from Satan the outcast.
    translation: Pickthall
    original: فَإِذَا قَرَأْتَ ٱلْقُرْءَانَ فَٱسْتَعِذْ بِٱللَّهِ مِنَ ٱلشَّيْطَـٰنِ ٱلرَّجِيمِ
    arabicPlain: فإذا قرأت القرآن فاستعذ بالله من الشيطان الرجيم
