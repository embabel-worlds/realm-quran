  data:
    ref: '16:46'
    scripture: quran
    name: Quran 16:46
    chapter: 16
    verse: 46
    ordinal: 1947
    text: Or that He will not seize them in their going to and fro so that there be no escape for them?
    translation: Pickthall
    original: أَوْ يَأْخُذَهُمْ فِى تَقَلُّبِهِمْ فَمَا هُم بِمُعْجِزِينَ
    arabicPlain: أو يأخذهم في تقلبهم فما هم بمعجزين
    surahName: An-Nahl
    juz: 14
    manzil: 3
