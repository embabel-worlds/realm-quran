  data:
    ref: 16:103
    scripture: quran
    name: Quran 16:103
    chapter: 16
    verse: 103
    ordinal: 2004
    text: 'And We know well that they say: Only a man teacheth him. The speech of him at whom they falsely hint is outlandish, and this is clear Arabic speech.'
    translation: Pickthall
    original: وَلَقَدْ نَعْلَمُ أَنَّهُمْ يَقُولُونَ إِنَّمَا يُعَلِّمُهُۥ بَشَرٌ ۗ لِّسَانُ ٱلَّذِى يُلْحِدُونَ إِلَيْهِ أَعْجَمِىٌّ وَهَـٰذَا لِسَانٌ عَرَبِىٌّ مُّبِينٌ
    arabicPlain: ولقد نعلم أنهم يقولون إنما يعلمه بشر ۗ لسان الذي يلحدون إليه أعجمي وهذا لسان عربي مبين
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 237
