  data:
    ref: '16:29'
    scripture: quran
    name: Quran 16:29
    chapter: 16
    verse: 29
    ordinal: 1930
    text: So enter the gates of hell, to dwell therein for ever. Woeful indeed will be the lodging of the arrogant.
    translation: Pickthall
    original: فَٱدْخُلُوٓا۟ أَبْوَٰبَ جَهَنَّمَ خَـٰلِدِينَ فِيهَا ۖ فَلَبِئْسَ مَثْوَى ٱلْمُتَكَبِّرِينَ
    arabicPlain: فادخلوا أبواب جهنم خالدين فيها ۖ فلبئس مثوى المتكبرين
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 227
