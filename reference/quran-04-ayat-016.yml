    name: Quran 16:17
    chapter: 16
    verse: 17
    ordinal: 1918
    text: Is He then Who createth as him who createth not? Will ye not then remember?
    translation: Pickthall
    original: أَفَمَن يَخْلُقُ كَمَن لَّا يَخْلُقُ ۗ أَفَلَا تَذَكَّرُونَ
