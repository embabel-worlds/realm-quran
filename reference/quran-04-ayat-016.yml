  data:
    ref: '16:55'
    scripture: quran
    name: Quran 16:55
    chapter: 16
    verse: 55
    ordinal: 1956
    text: So as to deny that which We have given them. Then enjoy life (while ye may), for ye will come to know.
    translation: Pickthall
    original: لِيَكْفُرُوا۟ بِمَآ ءَاتَيْنَـٰهُمْ ۚ فَتَمَتَّعُوا۟ ۖ فَسَوْفَ تَعْلَمُونَ
    arabicPlain: ليكفروا بما آتيناهم ۚ فتمتعوا ۖ فسوف تعلمون
    surahName: An-Nahl
