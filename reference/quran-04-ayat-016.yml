    scripture: quran
    name: Quran 16:99
    chapter: 16
    verse: 99
    ordinal: 2000
    text: Lo! he hath no power over those who believe and put trust in their Lord.
    translation: Pickthall
    original: إِنَّهُۥ لَيْسَ لَهُۥ سُلْطَـٰنٌ عَلَى ٱلَّذِينَ ءَامَنُوا۟ وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ
