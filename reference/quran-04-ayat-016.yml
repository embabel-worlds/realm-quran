  data:
    ref: '16:53'
    scripture: quran
    name: Quran 16:53
    chapter: 16
    verse: 53
    ordinal: 1954
    text: And whatever of comfort ye enjoy, it is from Allah. Then, when misfortune reacheth you, unto Him ye cry for help.
    translation: Pickthall
    original: وَمَا بِكُم مِّن نِّعْمَةٍ فَمِنَ ٱللَّهِ ۖ ثُمَّ إِذَا مَسَّكُمُ ٱلضُّرُّ فَإِلَيْهِ تَجْـَٔرُونَ
    arabicPlain: وما بكم من نعمة فمن الله ۖ ثم إذا مسكم الضر فإليه تجأرون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 230
