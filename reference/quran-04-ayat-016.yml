- type: Ayah
  data:
    ref: '16:31'
    scripture: quran
    name: Quran 16:31
    chapter: 16
    verse: 31
    ordinal: 1932
    text: Gardens of Eden which they enter, underneath which rivers flow, wherein they have what they will. Thus Allah repayeth those who ward off (evil),
    translation: Pickthall
    original: جَنَّـٰتُ عَدْنٍ يَدْخُلُونَهَا تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ ۖ لَهُمْ فِيهَا مَا يَشَآءُونَ ۚ كَذَٰلِكَ يَجْزِى ٱللَّهُ ٱلْمُتَّقِينَ
    arabicPlain: جنات عدن يدخلونها تجري من تحتها الأنهار ۖ لهم فيها ما يشاءون ۚ كذلك يجزي الله المتقين
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 227
    page: 270
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '16'
