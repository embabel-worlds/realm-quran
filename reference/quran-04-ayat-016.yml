    scripture: quran
    name: Quran 16:105
    chapter: 16
    verse: 105
    ordinal: 2006
    text: Only they invent falsehood who believe not Allah's revelations, and (only) they are the liars.
    translation: Pickthall
    original: إِنَّمَا يَفْتَرِى ٱلْكَذِبَ ٱلَّذِينَ لَا يُؤْمِنُونَ بِـَٔايَـٰتِ ٱللَّهِ ۖ وَأُو۟لَـٰٓئِكَ هُمُ ٱلْكَـٰذِبُونَ
    arabicPlain: إنما يفتري الكذب الذين لا يؤمنون بآيات الله ۖ وأولئك هم الكاذبون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 237
