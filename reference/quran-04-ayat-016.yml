  data:
    ref: '16:6'
    scripture: quran
    name: Quran 16:6
    chapter: 16
    verse: 6
    ordinal: 1907
    text: And wherein is beauty for you, when ye bring them home, and when ye take them out to pasture.
    translation: Pickthall
    original: وَلَكُمْ فِيهَا جَمَالٌ حِينَ تُرِيحُونَ وَحِينَ تَسْرَحُونَ
    arabicPlain: ولكم فيها جمال حين تريحون وحين تسرحون
