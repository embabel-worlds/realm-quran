    scripture: quran
    name: Quran 16:15
    chapter: 16
    verse: 15
    ordinal: 1916
    text: And He hath cast into the earth firm hills that it quake not with you, and streams and roads that ye may find a way.
    translation: Pickthall
    original: وَأَلْقَىٰ فِى ٱلْأَرْضِ رَوَٰسِىَ أَن تَمِيدَ بِكُمْ وَأَنْهَـٰرًا وَسُبُلًا لَّعَلَّكُمْ تَهْتَدُونَ
    arabicPlain: وألقى في الأرض رواسي أن تميد بكم وأنهارا وسبلا لعلكم تهتدون
    surahName: An-Nahl
