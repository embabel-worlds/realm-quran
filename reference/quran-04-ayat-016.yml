  data:
    ref: 16:108
    scripture: quran
    name: Quran 16:108
    chapter: 16
    verse: 108
    ordinal: 2009
    text: Such are they whose hearts and ears and eyes Allah hath sealed. And such are the heedless.
    translation: Pickthall
    original: أُو۟لَـٰٓئِكَ ٱلَّذِينَ طَبَعَ ٱللَّهُ عَلَىٰ قُلُوبِهِمْ وَسَمْعِهِمْ وَأَبْصَـٰرِهِمْ ۖ وَأُو۟لَـٰٓئِكَ هُمُ ٱلْغَـٰفِلُونَ
    arabicPlain: أولئك الذين طبع الله على قلوبهم وسمعهم وأبصارهم ۖ وأولئك هم الغافلون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 237
    page: 279
  relations:
