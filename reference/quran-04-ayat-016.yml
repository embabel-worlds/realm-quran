  data:
    ref: '16:51'
    scripture: quran
    name: Quran 16:51
    chapter: 16
    verse: 51
    ordinal: 1952
    text: 'Allah hath said: Choose not two gods. There is only One Allah. So of Me, Me only, be in awe.'
    translation: Pickthall
    original: ۞ وَقَالَ ٱللَّهُ لَا تَتَّخِذُوٓا۟ إِلَـٰهَيْنِ ٱثْنَيْنِ ۖ إِنَّمَا هُوَ إِلَـٰهٌ وَٰحِدٌ ۖ فَإِيَّـٰىَ فَٱرْهَبُونِ
    arabicPlain: ۞ وقال الله لا تتخذوا إلهين اثنين ۖ إنما هو إله واحد ۖ فإياي فارهبون
    surahName: An-Nahl
    juz: 14
