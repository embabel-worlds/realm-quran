  data:
    ref: 16:83
    scripture: quran
    name: Quran 16:83
    chapter: 16
    verse: 83
    ordinal: 1984
    text: They know the favour of Allah and then deny it. Most of them are ingrates.
    translation: Pickthall
    original: يَعْرِفُونَ نِعْمَتَ ٱللَّهِ ثُمَّ يُنكِرُونَهَا وَأَكْثَرُهُمُ ٱلْكَـٰفِرُونَ
    arabicPlain: يعرفون نعمت الله ثم ينكرونها وأكثرهم الكافرون
    surahName: An-Nahl
    juz: 14
    manzil: 3
