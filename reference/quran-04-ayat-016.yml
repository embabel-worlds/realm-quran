  data:
    ref: 16:77
    scripture: quran
    name: Quran 16:77
    chapter: 16
    verse: 77
    ordinal: 1978
    text: And unto Allah belongeth the Unseen of the heavens and the earth, and the matter of the Hour (of Doom) is but as a twinkling of the eye, or it is nearer still. Lo! Allah is Able to do all things.
    translation: Pickthall
    original: وَلِلَّهِ غَيْبُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۚ وَمَآ أَمْرُ ٱلسَّاعَةِ إِلَّا كَلَمْحِ ٱلْبَصَرِ أَوْ هُوَ أَقْرَبُ ۚ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ
    arabicPlain: ولله غيب السماوات والأرض ۚ وما أمر الساعة إلا كلمح البصر أو هو أقرب ۚ إن الله على كل شيء قدير
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 234
