  data:
    ref: 16:60
    scripture: quran
    name: Quran 16:60
    chapter: 16
    verse: 60
    ordinal: 1961
    text: For those who believe not in the Hereafter is an evil similitude, and Allah's is the Sublime Similitude. He is the Mighty, the Wise.
    translation: Pickthall
    original: لِلَّذِينَ لَا يُؤْمِنُونَ بِٱلْـَٔاخِرَةِ مَثَلُ ٱلسَّوْءِ ۖ وَلِلَّهِ ٱلْمَثَلُ ٱلْأَعْلَىٰ ۚ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ
    arabicPlain: للذين لا يؤمنون بالآخرة مثل السوء ۖ ولله المثل الأعلى ۚ وهو العزيز الحكيم
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 230
