  data:
    ref: 16:102
    scripture: quran
    name: Quran 16:102
    chapter: 16
    verse: 102
    ordinal: 2003
    text: 'Say: The holy Spirit hath delivered it from thy Lord with truth, that it may confirm (the faith of) those who believe, and as guidance and good tidings for those who have surrendered (to Allah).'
    translation: Pickthall
    original: قُلْ نَزَّلَهُۥ رُوحُ ٱلْقُدُسِ مِن رَّبِّكَ بِٱلْحَقِّ لِيُثَبِّتَ ٱلَّذِينَ ءَامَنُوا۟ وَهُدًى وَبُشْرَىٰ لِلْمُسْلِمِينَ
    arabicPlain: قل نزله روح القدس من ربك بالحق ليثبت الذين آمنوا وهدى وبشرى للمسلمين
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 237
