  data:
    ref: '16:30'
    scripture: quran
    name: Quran 16:30
    chapter: 16
    verse: 30
    ordinal: 1931
    text: 'And it is said unto those who ward off (evil): What hath your Lord revealed? They say: Good. For those who do good in this world there is a good (reward) and the home of the Hereafter will be better. Pleasant indeed will be the home of those who ward off (evil) -'
    translation: Pickthall
    original: ۞ وَقِيلَ لِلَّذِينَ ٱتَّقَوْا۟ مَاذَآ أَنزَلَ رَبُّكُمْ ۚ قَالُوا۟ خَيْرًا ۗ لِّلَّذِينَ أَحْسَنُوا۟ فِى هَـٰذِهِ ٱلدُّنْيَا حَسَنَةٌ ۚ وَلَدَارُ ٱلْـَٔاخِرَةِ خَيْرٌ ۚ وَلَنِعْمَ دَارُ ٱلْمُتَّقِينَ
    arabicPlain: ۞ وقيل للذين اتقوا ماذا أنزل ربكم ۚ قالوا خيرا ۗ للذين أحسنوا في هذه الدنيا حسنة ۚ ولدار الآخرة خير ۚ ولنعم دار المتقين
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 227
    page: 270
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '16'
  - predicate: IN_PORTION
    to:
      type: Juz
