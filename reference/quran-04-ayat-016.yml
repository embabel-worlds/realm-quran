- type: Ayah
  data:
    ref: '16:10'
    scripture: quran
    name: Quran 16:10
    chapter: 16
    verse: 10
    ordinal: 1911
    text: He it is Who sendeth down water from the sky, whence ye have drink, and whence are trees on which ye send your beasts to pasture.
    translation: Pickthall
    original: هُوَ ٱلَّذِىٓ أَنزَلَ مِنَ ٱلسَّمَآءِ مَآءً ۖ لَّكُم مِّنْهُ شَرَابٌ وَمِنْهُ شَجَرٌ فِيهِ تُسِيمُونَ
    arabicPlain: هو الذي أنزل من السماء ماء ۖ لكم منه شراب ومنه شجر فيه تسيمون
    surahName: An-Nahl
    juz: 14
    manzil: 3
