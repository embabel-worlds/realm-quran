    scripture: quran
    name: Quran 16:47
    chapter: 16
    verse: 47
    ordinal: 1948
    text: Or that He will not seize them with a gradual wasting? Lo! thy Lord is indeed Full of Pity, Merciful.
    translation: Pickthall
    original: أَوْ يَأْخُذَهُمْ عَلَىٰ تَخَوُّفٍ فَإِنَّ رَبَّكُمْ لَرَءُوفٌ رَّحِيمٌ
    arabicPlain: أو يأخذهم على تخوف فإن ربكم لرءوف رحيم
