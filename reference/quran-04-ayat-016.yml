  data:
    ref: '16:41'
    scripture: quran
    name: Quran 16:41
    chapter: 16
    verse: 41
    ordinal: 1942
    text: And those who became fugitives for the cause of Allah after they had been oppressed, We verily shall give them goodly lodging in the world, and surely the reward of the Hereafter is greater, if they but knew;
    translation: Pickthall
    original: وَٱلَّذِينَ هَاجَرُوا۟ فِى ٱللَّهِ مِنۢ بَعْدِ مَا ظُلِمُوا۟ لَنُبَوِّئَنَّهُمْ فِى ٱلدُّنْيَا حَسَنَةً ۖ وَلَأَجْرُ ٱلْـَٔاخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ
    arabicPlain: والذين هاجروا في الله من بعد ما ظلموا لنبوئنهم في الدنيا حسنة ۖ ولأجر الآخرة أكبر ۚ لو كانوا يعلمون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 229
