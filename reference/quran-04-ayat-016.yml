  data:
    ref: '16:9'
    scripture: quran
    name: Quran 16:9
    chapter: 16
    verse: 9
    ordinal: 1910
    text: And Allah's is the direction of the way, and some (roads) go not straight. And had He willed He would have led you all aright.
    translation: Pickthall
    original: وَعَلَى ٱللَّهِ قَصْدُ ٱلسَّبِيلِ وَمِنْهَا جَآئِرٌ ۚ وَلَوْ شَآءَ لَهَدَىٰكُمْ أَجْمَعِينَ
    arabicPlain: وعلى الله قصد السبيل ومنها جائر ۚ ولو شاء لهداكم أجمعين
    surahName: An-Nahl
    juz: 14
