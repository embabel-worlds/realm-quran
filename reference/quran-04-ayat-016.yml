    scripture: quran
    name: Quran 16:59
    chapter: 16
    verse: 59
    ordinal: 1960
    text: 'He hideth himself from the folk because of the evil of that whereof he hath had tidings, (asking himself): Shall he keep it in contempt, or bury it beneath the dust. Verily evil is their judgment.'
    translation: Pickthall
    original: يَتَوَٰرَىٰ مِنَ ٱلْقَوْمِ مِن سُوٓءِ مَا بُشِّرَ بِهِۦٓ ۚ أَيُمْسِكُهُۥ عَلَىٰ هُونٍ أَمْ يَدُسُّهُۥ فِى ٱلتُّرَابِ ۗ أَلَا سَآءَ مَا يَحْكُمُونَ
    arabicPlain: يتوارى من القوم من سوء ما بشر به ۚ أيمسكه على هون أم يدسه في التراب ۗ ألا ساء ما يحكمون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 230
