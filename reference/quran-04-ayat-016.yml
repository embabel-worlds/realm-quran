  data:
    ref: '16:24'
    scripture: quran
    name: Quran 16:24
    chapter: 16
    verse: 24
    ordinal: 1925
    text: 'And when it is said unto them: What hath your Lord revealed? they say: (Mere) fables of the men of old,'
    translation: Pickthall
    original: وَإِذَا قِيلَ لَهُم مَّاذَآ أَنزَلَ رَبُّكُمْ ۙ قَالُوٓا۟ أَسَـٰطِيرُ ٱلْأَوَّلِينَ
    arabicPlain: وإذا قيل لهم ماذا أنزل ربكم ۙ قالوا أساطير الأولين
