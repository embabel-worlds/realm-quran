  data:
    ref: 16:87
    scripture: quran
    name: Quran 16:87
    chapter: 16
    verse: 87
    ordinal: 1988
    text: And they proffer unto Allah submission on that day, and all that they used to invent hath failed them.
    translation: Pickthall
    original: وَأَلْقَوْا۟ إِلَى ٱللَّهِ يَوْمَئِذٍ ٱلسَّلَمَ ۖ وَضَلَّ عَنْهُم مَّا كَانُوا۟ يَفْتَرُونَ
    arabicPlain: وألقوا إلى الله يومئذ السلم ۖ وضل عنهم ما كانوا يفترون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 235
    page: 276
  relations:
