  data:
    ref: 16:61
    scripture: quran
    name: Quran 16:61
    chapter: 16
    verse: 61
    ordinal: 1962
    text: If Allah were to take mankind to task for their wrong-doing, he would not leave hereon a living creature, but He reprieveth them to an appointed term, and when their term cometh they cannot put (it) off an hour nor (yet) advance (it).
    translation: Pickthall
    original: وَلَوْ يُؤَاخِذُ ٱللَّهُ ٱلنَّاسَ بِظُلْمِهِم مَّا تَرَكَ عَلَيْهَا مِن دَآبَّةٍ وَلَـٰكِن يُؤَخِّرُهُمْ إِلَىٰٓ أَجَلٍ مُّسَمًّى ۖ فَإِذَا جَآءَ أَجَلُهُمْ لَا يَسْتَـْٔخِرُونَ سَاعَةً ۖ وَلَا يَسْتَقْدِمُونَ
    arabicPlain: ولو يؤاخذ الله الناس بظلمهم ما ترك عليها من دابة ولكن يؤخرهم إلى أجل مسمى ۖ فإذا جاء أجلهم لا يستأخرون ساعة ۖ ولا يستقدمون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 231
