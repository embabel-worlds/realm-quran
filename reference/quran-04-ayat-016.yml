  data:
    ref: '16:27'
    scripture: quran
    name: Quran 16:27
    chapter: 16
    verse: 27
    ordinal: 1928
    text: 'Then on the Day of Resurrection He will disgrace them and will say: Where are My partners, for whose sake ye opposed (My guidance)? Those who have been given knowledge will say: Disgrace this day and evil are upon the disbelievers,'
    translation: Pickthall
    original: ثُمَّ يَوْمَ ٱلْقِيَـٰمَةِ يُخْزِيهِمْ وَيَقُولُ أَيْنَ شُرَكَآءِىَ ٱلَّذِينَ كُنتُمْ تُشَـٰٓقُّونَ فِيهِمْ ۚ قَالَ ٱلَّذِينَ أُوتُوا۟ ٱلْعِلْمَ إِنَّ ٱلْخِزْىَ ٱلْيَوْمَ وَٱلسُّوٓءَ عَلَى ٱلْكَـٰفِرِينَ
    arabicPlain: ثم يوم القيامة يخزيهم ويقول أين شركائي الذين كنتم تشاقون فيهم ۚ قال الذين أوتوا العلم إن الخزي اليوم والسوء على الكافرين
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 227
    page: 270
