  data:
    ref: 16:66
    scripture: quran
    name: Quran 16:66
    chapter: 16
    verse: 66
    ordinal: 1967
    text: And lo! in the cattle there is a lesson for you. We give you to drink of that which is in their bellies, from betwixt the refuse and the blood, pure milk palatable to the drinkers.
    translation: Pickthall
    original: وَإِنَّ لَكُمْ فِى ٱلْأَنْعَـٰمِ لَعِبْرَةً ۖ نُّسْقِيكُم مِّمَّا فِى بُطُونِهِۦ مِنۢ بَيْنِ فَرْثٍ وَدَمٍ لَّبَنًا خَالِصًا سَآئِغًا لِّلشَّـٰرِبِينَ
    arabicPlain: وإن لكم في الأنعام لعبرة ۖ نسقيكم مما في بطونه من بين فرث ودم لبنا خالصا سائغا للشاربين
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 232
    page: 274
