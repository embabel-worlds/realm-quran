    name: Quran 16:1
    chapter: 16
    verse: 1
    ordinal: 1902
    text: The commandment of Allah will come to pass, so seek not ye to hasten it. Glorified and Exalted be He above all that they associate (with Him).
    translation: Pickthall
    original: بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ أَتَىٰٓ أَمْرُ ٱللَّهِ فَلَا تَسْتَعْجِلُوهُ ۚ سُبْحَـٰنَهُۥ وَتَعَـٰلَىٰ عَمَّا يُشْرِكُونَ
    arabicPlain: بسم الله الرحمن الرحيم أتى أمر الله فلا تستعجلوه ۚ سبحانه وتعالى عما يشركون
