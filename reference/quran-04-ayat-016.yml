    translation: Pickthall
    original: وَإِنْ عَاقَبْتُمْ فَعَاقِبُوا۟ بِمِثْلِ مَا عُوقِبْتُم بِهِۦ ۖ وَلَئِن صَبَرْتُمْ لَهُوَ خَيْرٌ لِّلصَّـٰبِرِينَ
    arabicPlain: وإن عاقبتم فعاقبوا بمثل ما عوقبتم به ۖ ولئن صبرتم لهو خير للصابرين
