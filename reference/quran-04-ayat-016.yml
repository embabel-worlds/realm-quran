    scripture: quran
    name: Quran 16:49
    chapter: 16
    verse: 49
    ordinal: 1950
    text: And unto Allah maketh prostration whatsoever is in the heavens and whatsoever is in the earth of living creatures, and the angels (also) and they are not proud.
    translation: Pickthall
    original: وَلِلَّهِ يَسْجُدُ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ مِن دَآبَّةٍ وَٱلْمَلَـٰٓئِكَةُ وَهُمْ لَا يَسْتَكْبِرُونَ
    arabicPlain: ولله يسجد ما في السماوات وما في الأرض من دابة والملائكة وهم لا يستكبرون
