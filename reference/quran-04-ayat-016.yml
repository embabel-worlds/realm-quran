  data:
    ref: 16:65
    scripture: quran
    name: Quran 16:65
    chapter: 16
    verse: 65
    ordinal: 1966
    text: Allah sendeth down water from the sky and therewith reviveth the earth after her death. Lo! herein is indeed a portent for a folk who hear.
    translation: Pickthall
    original: وَٱللَّهُ أَنزَلَ مِنَ ٱلسَّمَآءِ مَآءً فَأَحْيَا بِهِ ٱلْأَرْضَ بَعْدَ مَوْتِهَآ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَةً لِّقَوْمٍ يَسْمَعُونَ
    arabicPlain: والله أنزل من السماء ماء فأحيا به الأرض بعد موتها ۚ إن في ذلك لآية لقوم يسمعون
    surahName: An-Nahl
    juz: 14
    manzil: 3
    ruku: 231
