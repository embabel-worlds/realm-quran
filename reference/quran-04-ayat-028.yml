  data:
    ref: '28:16'
    scripture: quran
    name: Quran 28:16
    chapter: 28
    verse: 16
    ordinal: 3268
    text: 'He said: My Lord! Lo! I have wronged my soul, so forgive me. Then He forgave him. Lo! He is the Forgiving, the Merciful.'
    translation: Pickthall
    original: قَالَ رَبِّ إِنِّى ظَلَمْتُ نَفْسِى فَٱغْفِرْ لِى فَغَفَرَ لَهُۥٓ ۚ إِنَّهُۥ هُوَ ٱلْغَفُورُ ٱلرَّحِيمُ
    arabicPlain: قال رب إني ظلمت نفسي فاغفر لي فغفر له ۚ إنه هو الغفور الرحيم
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 335
