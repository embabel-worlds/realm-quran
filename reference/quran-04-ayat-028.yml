  data:
    ref: '28:42'
    scripture: quran
    name: Quran 28:42
    chapter: 28
    verse: 42
    ordinal: 3294
    text: And We made a curse to follow them in this world, and on the Day of Resurrection they will be among the hateful.
    translation: Pickthall
    original: وَأَتْبَعْنَـٰهُمْ فِى هَـٰذِهِ ٱلدُّنْيَا لَعْنَةً ۖ وَيَوْمَ ٱلْقِيَـٰمَةِ هُم مِّنَ ٱلْمَقْبُوحِينَ
    arabicPlain: وأتبعناهم في هذه الدنيا لعنة ۖ ويوم القيامة هم من المقبوحين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 337
