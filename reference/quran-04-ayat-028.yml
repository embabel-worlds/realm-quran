  data:
    ref: '28:46'
    scripture: quran
    name: Quran 28:46
    chapter: 28
    verse: 46
    ordinal: 3298
    text: And thou was not beside the Mount when We did call; but (the knowledge of it is) a mercy from thy Lord that thou mayst warn a folk unto whom no warner came before thee, that haply they may give heed.
    translation: Pickthall
    original: وَمَا كُنتَ بِجَانِبِ ٱلطُّورِ إِذْ نَادَيْنَا وَلَـٰكِن رَّحْمَةً مِّن رَّبِّكَ لِتُنذِرَ قَوْمًا مَّآ أَتَىٰهُم مِّن نَّذِيرٍ مِّن قَبْلِكَ لَعَلَّهُمْ يَتَذَكَّرُونَ
    arabicPlain: وما كنت بجانب الطور إذ نادينا ولكن رحمة من ربك لتنذر قوما ما أتاهم من نذير من قبلك لعلهم يتذكرون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 338
    page: 391
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '28'
  - predicate: IN_PORTION
    to:
      type: Juz
