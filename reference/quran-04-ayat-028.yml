- type: Ayah
  data:
    ref: '28:15'
    scripture: quran
    name: Quran 28:15
    chapter: 28
    verse: 15
    ordinal: 3267
    text: 'And he entered the city at a time of carelessness of its folk, and he found therein two men fighting, one of his own caste, and the other of his enemies; and he who was of his caste asked him for help against him who was of his enemies. So Moses struck him with his fist and killed him. He said: This is of the devil''s doing. Lo! he is an enemy, a mere misleader.'
    translation: Pickthall
    original: وَدَخَلَ ٱلْمَدِينَةَ عَلَىٰ حِينِ غَفْلَةٍ مِّنْ أَهْلِهَا فَوَجَدَ فِيهَا رَجُلَيْنِ يَقْتَتِلَانِ هَـٰذَا مِن شِيعَتِهِۦ وَهَـٰذَا مِنْ عَدُوِّهِۦ ۖ فَٱسْتَغَـٰثَهُ ٱلَّذِى مِن شِيعَتِهِۦ عَلَى ٱلَّذِى مِنْ عَدُوِّهِۦ فَوَكَزَهُۥ مُوسَىٰ فَقَضَىٰ عَلَيْهِ ۖ قَالَ هَـٰذَا مِنْ عَمَلِ ٱلشَّيْطَـٰنِ ۖ إِنَّهُۥ عَدُوٌّ مُّضِلٌّ مُّبِينٌ
    arabicPlain: ودخل المدينة على حين غفلة من أهلها فوجد فيها رجلين يقتتلان هذا من شيعته وهذا من عدوه ۖ فاستغاثه الذي من شيعته على الذي من عدوه فوكزه موسى فقضى عليه ۖ قال هذا من عمل الشيطان ۖ إنه عدو مضل مبين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 335
    page: 387
  relations:
