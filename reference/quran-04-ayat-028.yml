  data:
    ref: 28:63
    scripture: quran
    name: Quran 28:63
    chapter: 28
    verse: 63
    ordinal: 3315
    text: 'Those concerning whom the Word will have come true will say: Our Lord! These are they whom we led astray. We led them astray even as we ourselves were astray. We declare our innocence before Thee: us they never worshipped.'
    translation: Pickthall
    original: قَالَ ٱلَّذِينَ حَقَّ عَلَيْهِمُ ٱلْقَوْلُ رَبَّنَا هَـٰٓؤُلَآءِ ٱلَّذِينَ أَغْوَيْنَآ أَغْوَيْنَـٰهُمْ كَمَا غَوَيْنَا ۖ تَبَرَّأْنَآ إِلَيْكَ ۖ مَا كَانُوٓا۟ إِيَّانَا يَعْبُدُونَ
    arabicPlain: قال الذين حق عليهم القول ربنا هؤلاء الذين أغوينا أغويناهم كما غوينا ۖ تبرأنا إليك ۖ ما كانوا إيانا يعبدون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 340
    page: 393
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '28'
