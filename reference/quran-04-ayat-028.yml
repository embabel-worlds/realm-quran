  data:
    ref: '28:35'
    scripture: quran
    name: Quran 28:35
    chapter: 28
    verse: 35
    ordinal: 3287
    text: 'He said: We will strengthen thine arm with thy brother, and We will give unto you both power so that they cannot reach you for Our portents. Ye twain, and those who follow you, will be the winners.'
    translation: Pickthall
    original: قَالَ سَنَشُدُّ عَضُدَكَ بِأَخِيكَ وَنَجْعَلُ لَكُمَا سُلْطَـٰنًا فَلَا يَصِلُونَ إِلَيْكُمَا ۚ بِـَٔايَـٰتِنَآ أَنتُمَا وَمَنِ ٱتَّبَعَكُمَا ٱلْغَـٰلِبُونَ
    arabicPlain: قال سنشد عضدك بأخيك ونجعل لكما سلطانا فلا يصلون إليكما ۚ بآياتنا أنتما ومن اتبعكما الغالبون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 337
    page: 389
