  data:
    ref: 28:81
    scripture: quran
    name: Quran 28:81
    chapter: 28
    verse: 81
    ordinal: 3333
    text: So We caused the earth to swallow him and his dwelling-place. Then he had no host to help him against Allah, nor was he of those who can save themselves.
    translation: Pickthall
    original: فَخَسَفْنَا بِهِۦ وَبِدَارِهِ ٱلْأَرْضَ فَمَا كَانَ لَهُۥ مِن فِئَةٍ يَنصُرُونَهُۥ مِن دُونِ ٱللَّهِ وَمَا كَانَ مِنَ ٱلْمُنتَصِرِينَ
    arabicPlain: فخسفنا به وبداره الأرض فما كان له من فئة ينصرونه من دون الله وما كان من المنتصرين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 341
    page: 395
