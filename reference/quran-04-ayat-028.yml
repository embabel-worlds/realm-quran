  data:
    ref: '28:54'
    scripture: quran
    name: Quran 28:54
    chapter: 28
    verse: 54
    ordinal: 3306
    text: These will be given their reward twice over, because they are steadfast and repel evil with good, and spend of that wherewith We have provided them,
    translation: Pickthall
    original: أُو۟لَـٰٓئِكَ يُؤْتَوْنَ أَجْرَهُم مَّرَّتَيْنِ بِمَا صَبَرُوا۟ وَيَدْرَءُونَ بِٱلْحَسَنَةِ ٱلسَّيِّئَةَ وَمِمَّا رَزَقْنَـٰهُمْ يُنفِقُونَ
    arabicPlain: أولئك يؤتون أجرهم مرتين بما صبروا ويدرءون بالحسنة السيئة ومما رزقناهم ينفقون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 339
