  data:
    ref: '28:23'
    scripture: quran
    name: Quran 28:23
    chapter: 28
    verse: 23
    ordinal: 3275
    text: 'And when he came unto the water of Midian he found there a whole tribe of men, watering. And he found apart from them two women keeping back (their flocks). He said: What aileth you? The two said: We cannot give (our flocks) to drink till the shepherds return from the water; and our father is a very old man.'
    translation: Pickthall
    original: وَلَمَّا وَرَدَ مَآءَ مَدْيَنَ وَجَدَ عَلَيْهِ أُمَّةً مِّنَ ٱلنَّاسِ يَسْقُونَ وَوَجَدَ مِن دُونِهِمُ ٱمْرَأَتَيْنِ تَذُودَانِ ۖ قَالَ مَا خَطْبُكُمَا ۖ قَالَتَا لَا نَسْقِى حَتَّىٰ يُصْدِرَ ٱلرِّعَآءُ ۖ وَأَبُونَا شَيْخٌ كَبِيرٌ
    arabicPlain: ولما ورد ماء مدين وجد عليه أمة من الناس يسقون ووجد من دونهم امرأتين تذودان ۖ قال ما خطبكما ۖ قالتا لا نسقي حتى يصدر الرعاء ۖ وأبونا شيخ كبير
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 336
    page: 388
