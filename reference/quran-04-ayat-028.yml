  data:
    ref: '28:37'
    scripture: quran
    name: Quran 28:37
    chapter: 28
    verse: 37
    ordinal: 3289
    text: 'And Moses said: My Lord is Best Aware of him who bringeth guidance from His presence, and whose will be the sequel of the Home (of bliss). Lo! wrong-doers will not be successful.'
    translation: Pickthall
    original: وَقَالَ مُوسَىٰ رَبِّىٓ أَعْلَمُ بِمَن جَآءَ بِٱلْهُدَىٰ مِنْ عِندِهِۦ وَمَن تَكُونُ لَهُۥ عَـٰقِبَةُ ٱلدَّارِ ۖ إِنَّهُۥ لَا يُفْلِحُ ٱلظَّـٰلِمُونَ
    arabicPlain: وقال موسى ربي أعلم بمن جاء بالهدى من عنده ومن تكون له عاقبة الدار ۖ إنه لا يفلح الظالمون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 337
    page: 390
