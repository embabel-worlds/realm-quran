    scripture: quran
    name: Quran 28:74
    chapter: 28
    verse: 74
    ordinal: 3326
    text: 'And on the Day when He shall call unto them and say: Where are My partners whom ye pretended?'
    translation: Pickthall
    original: وَيَوْمَ يُنَادِيهِمْ فَيَقُولُ أَيْنَ شُرَكَآءِىَ ٱلَّذِينَ كُنتُمْ تَزْعُمُونَ
    arabicPlain: ويوم يناديهم فيقول أين شركائي الذين كنتم تزعمون
