  data:
    ref: '28:5'
    scripture: quran
    name: Quran 28:5
    chapter: 28
    verse: 5
    ordinal: 3257
    text: And We desired to show favour unto those who were oppressed in the earth, and to make them examples and to make them the inheritors,
    translation: Pickthall
    original: وَنُرِيدُ أَن نَّمُنَّ عَلَى ٱلَّذِينَ ٱسْتُضْعِفُوا۟ فِى ٱلْأَرْضِ وَنَجْعَلَهُمْ أَئِمَّةً وَنَجْعَلَهُمُ ٱلْوَٰرِثِينَ
    arabicPlain: ونريد أن نمن على الذين استضعفوا في الأرض ونجعلهم أئمة ونجعلهم الوارثين
    surahName: Al-Qasas
