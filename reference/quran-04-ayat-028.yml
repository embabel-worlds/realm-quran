  data:
    ref: '28:36'
    scripture: quran
    name: Quran 28:36
    chapter: 28
    verse: 36
    ordinal: 3288
    text: 'But when Moses came unto them with Our clear tokens, they said: This is naught but invented magic. We never heard of this among our fathers of old.'
    translation: Pickthall
    original: فَلَمَّا جَآءَهُم مُّوسَىٰ بِـَٔايَـٰتِنَا بَيِّنَـٰتٍ قَالُوا۟ مَا هَـٰذَآ إِلَّا سِحْرٌ مُّفْتَرًى وَمَا سَمِعْنَا بِهَـٰذَا فِىٓ ءَابَآئِنَا ٱلْأَوَّلِينَ
    arabicPlain: فلما جاءهم موسى بآياتنا بينات قالوا ما هذا إلا سحر مفترى وما سمعنا بهذا في آبائنا الأولين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 337
