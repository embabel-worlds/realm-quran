  data:
    ref: '28:11'
    scripture: quran
    name: Quran 28:11
    chapter: 28
    verse: 11
    ordinal: 3263
    text: 'And she said unto his sister: Trace him. So she observed him from afar, and they perceived not.'
    translation: Pickthall
    original: وَقَالَتْ لِأُخْتِهِۦ قُصِّيهِ ۖ فَبَصُرَتْ بِهِۦ عَن جُنُبٍ وَهُمْ لَا يَشْعُرُونَ
    arabicPlain: وقالت لأخته قصيه ۖ فبصرت به عن جنب وهم لا يشعرون
    surahName: Al-Qasas
    juz: 20
