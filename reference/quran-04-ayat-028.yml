  data:
    ref: 28:84
    scripture: quran
    name: Quran 28:84
    chapter: 28
    verse: 84
    ordinal: 3336
    text: Whoso bringeth a good deed, he will have better than the same; while as for him who bringeth an ill-deed, those who do ill-deeds will be requited only what they did.
    translation: Pickthall
    original: مَن جَآءَ بِٱلْحَسَنَةِ فَلَهُۥ خَيْرٌ مِّنْهَا ۖ وَمَن جَآءَ بِٱلسَّيِّئَةِ فَلَا يُجْزَى ٱلَّذِينَ عَمِلُوا۟ ٱلسَّيِّـَٔاتِ إِلَّا مَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: من جاء بالحسنة فله خير منها ۖ ومن جاء بالسيئة فلا يجزى الذين عملوا السيئات إلا ما كانوا يعملون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 341
    page: 395
