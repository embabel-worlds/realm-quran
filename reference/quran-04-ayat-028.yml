  data:
    ref: '28:24'
    scripture: quran
    name: Quran 28:24
    chapter: 28
    verse: 24
    ordinal: 3276
    text: 'So he watered (their flock) for them. Then he turned aside into the shade, and said: My Lord! I am needy of whatever good Thou sendest down for me.'
    translation: Pickthall
    original: فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰٓ إِلَى ٱلظِّلِّ فَقَالَ رَبِّ إِنِّى لِمَآ أَنزَلْتَ إِلَىَّ مِنْ خَيْرٍ فَقِيرٌ
    arabicPlain: فسقى لهما ثم تولى إلى الظل فقال رب إني لما أنزلت إلي من خير فقير
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 336
