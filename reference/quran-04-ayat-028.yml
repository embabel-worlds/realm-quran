  data:
    ref: 28:68
    scripture: quran
    name: Quran 28:68
    chapter: 28
    verse: 68
    ordinal: 3320
    text: Thy Lord bringeth to pass what He willeth and chooseth. They have never any choice. Glorified be Allah and Exalted above all that they associate (with Him)!
    translation: Pickthall
    original: وَرَبُّكَ يَخْلُقُ مَا يَشَآءُ وَيَخْتَارُ ۗ مَا كَانَ لَهُمُ ٱلْخِيَرَةُ ۚ سُبْحَـٰنَ ٱللَّهِ وَتَعَـٰلَىٰ عَمَّا يُشْرِكُونَ
    arabicPlain: وربك يخلق ما يشاء ويختار ۗ ما كان لهم الخيرة ۚ سبحان الله وتعالى عما يشركون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 340
    page: 393
