  data:
    ref: '28:44'
    scripture: quran
    name: Quran 28:44
    chapter: 28
    verse: 44
    ordinal: 3296
    text: And thou (Muhammad) wast not on the western side (of the Mount) when We expounded unto Moses the commandment, and thou wast not among those present;
    translation: Pickthall
    original: وَمَا كُنتَ بِجَانِبِ ٱلْغَرْبِىِّ إِذْ قَضَيْنَآ إِلَىٰ مُوسَى ٱلْأَمْرَ وَمَا كُنتَ مِنَ ٱلشَّـٰهِدِينَ
    arabicPlain: وما كنت بجانب الغربي إذ قضينا إلى موسى الأمر وما كنت من الشاهدين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 338
    page: 391
  relations:
