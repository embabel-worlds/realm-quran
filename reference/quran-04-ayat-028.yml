  data:
    ref: '28:22'
    scripture: quran
    name: Quran 28:22
    chapter: 28
    verse: 22
    ordinal: 3274
    text: 'And when he turned his face toward Midian, he said: Peradventure my Lord will guide me in the right road.'
    translation: Pickthall
    original: وَلَمَّا تَوَجَّهَ تِلْقَآءَ مَدْيَنَ قَالَ عَسَىٰ رَبِّىٓ أَن يَهْدِيَنِى سَوَآءَ ٱلسَّبِيلِ
    arabicPlain: ولما توجه تلقاء مدين قال عسى ربي أن يهديني سواء السبيل
    surahName: Al-Qasas
    juz: 20
