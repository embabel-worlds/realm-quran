  data:
    ref: '28:21'
    scripture: quran
    name: Quran 28:21
    chapter: 28
    verse: 21
    ordinal: 3273
    text: 'So he escaped from thence, fearing, vigilant. He said: My Lord! Deliver me from the wrongdoing folk.'
    translation: Pickthall
    original: فَخَرَجَ مِنْهَا خَآئِفًا يَتَرَقَّبُ ۖ قَالَ رَبِّ نَجِّنِى مِنَ ٱلْقَوْمِ ٱلظَّـٰلِمِينَ
    arabicPlain: فخرج منها خائفا يترقب ۖ قال رب نجني من القوم الظالمين
    surahName: Al-Qasas
    juz: 20
