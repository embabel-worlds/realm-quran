  data:
    ref: '28:26'
    scripture: quran
    name: Quran 28:26
    chapter: 28
    verse: 26
    ordinal: 3278
    text: 'One of the two women said: O my father! Hire him! For the best (man) that thou canst hire in the strong, the trustworthy.'
    translation: Pickthall
    original: قَالَتْ إِحْدَىٰهُمَا يَـٰٓأَبَتِ ٱسْتَـْٔجِرْهُ ۖ إِنَّ خَيْرَ مَنِ ٱسْتَـْٔجَرْتَ ٱلْقَوِىُّ ٱلْأَمِينُ
    arabicPlain: قالت إحداهما يا أبت استأجره ۖ إن خير من استأجرت القوي الأمين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 336
    page: 388
