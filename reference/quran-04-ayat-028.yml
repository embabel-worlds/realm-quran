  data:
    ref: 28:67
    scripture: quran
    name: Quran 28:67
    chapter: 28
    verse: 67
    ordinal: 3319
    text: But as for him who shall repent and believe and do right, he haply may be one of the successful.
    translation: Pickthall
    original: فَأَمَّا مَن تَابَ وَءَامَنَ وَعَمِلَ صَـٰلِحًا فَعَسَىٰٓ أَن يَكُونَ مِنَ ٱلْمُفْلِحِينَ
    arabicPlain: فأما من تاب وآمن وعمل صالحا فعسى أن يكون من المفلحين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 340
