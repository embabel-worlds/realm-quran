  data:
    ref: '28:40'
    scripture: quran
    name: Quran 28:40
    chapter: 28
    verse: 40
    ordinal: 3292
    text: Therefor We seized him and his hosts, and abandoned them unto the sea. Behold the nature of the consequence for evil-doers!
    translation: Pickthall
    original: فَأَخَذْنَـٰهُ وَجُنُودَهُۥ فَنَبَذْنَـٰهُمْ فِى ٱلْيَمِّ ۖ فَٱنظُرْ كَيْفَ كَانَ عَـٰقِبَةُ ٱلظَّـٰلِمِينَ
    arabicPlain: فأخذناه وجنوده فنبذناهم في اليم ۖ فانظر كيف كان عاقبة الظالمين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 337
