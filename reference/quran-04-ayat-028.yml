  data:
    ref: '28:6'
    scripture: quran
    name: Quran 28:6
    chapter: 28
    verse: 6
    ordinal: 3258
    text: And to establish them in the earth, and to show Pharaoh and Haman and their hosts that which they feared from them.
    translation: Pickthall
    original: وَنُمَكِّنَ لَهُمْ فِى ٱلْأَرْضِ وَنُرِىَ فِرْعَوْنَ وَهَـٰمَـٰنَ وَجُنُودَهُمَا مِنْهُم مَّا كَانُوا۟ يَحْذَرُونَ
    arabicPlain: ونمكن لهم في الأرض ونري فرعون وهامان وجنودهما منهم ما كانوا يحذرون
    surahName: Al-Qasas
