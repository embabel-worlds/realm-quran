  data:
    ref: '28:34'
    scripture: quran
    name: Quran 28:34
    chapter: 28
    verse: 34
    ordinal: 3286
    text: My brother Aaron is more eloquent than me in speech. Therefor send him with me as a helper to confirm me. Lo! I fear that they will give the lie to me.
    translation: Pickthall
    original: وَأَخِى هَـٰرُونُ هُوَ أَفْصَحُ مِنِّى لِسَانًا فَأَرْسِلْهُ مَعِىَ رِدْءًا يُصَدِّقُنِىٓ ۖ إِنِّىٓ أَخَافُ أَن يُكَذِّبُونِ
    arabicPlain: وأخي هارون هو أفصح مني لسانا فأرسله معي ردءا يصدقني ۖ إني أخاف أن يكذبون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
