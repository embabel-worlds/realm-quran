  data:
    ref: '28:41'
    scripture: quran
    name: Quran 28:41
    chapter: 28
    verse: 41
    ordinal: 3293
    text: And We made them patterns that invite unto the Fire, and on the Day of Resurrection they will not be helped.
    translation: Pickthall
    original: وَجَعَلْنَـٰهُمْ أَئِمَّةً يَدْعُونَ إِلَى ٱلنَّارِ ۖ وَيَوْمَ ٱلْقِيَـٰمَةِ لَا يُنصَرُونَ
    arabicPlain: وجعلناهم أئمة يدعون إلى النار ۖ ويوم القيامة لا ينصرون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
