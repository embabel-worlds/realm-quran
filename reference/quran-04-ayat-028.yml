    scripture: quran
    name: Quran 28:65
    chapter: 28
    verse: 65
    ordinal: 3317
    text: 'And on the Day when He will call unto them and say: What answer gave ye to the messengers?'
    translation: Pickthall
    original: وَيَوْمَ يُنَادِيهِمْ فَيَقُولُ مَاذَآ أَجَبْتُمُ ٱلْمُرْسَلِينَ
    arabicPlain: ويوم يناديهم فيقول ماذا أجبتم المرسلين
