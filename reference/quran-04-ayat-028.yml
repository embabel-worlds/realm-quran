- type: Ayah
  data:
    ref: '28:10'
    scripture: quran
    name: Quran 28:10
    chapter: 28
    verse: 10
    ordinal: 3262
    text: And the heart of the mother of Moses became void, and she would have betrayed him if We had not fortified her heart, that she might be of the believers.
    translation: Pickthall
    original: وَأَصْبَحَ فُؤَادُ أُمِّ مُوسَىٰ فَـٰرِغًا ۖ إِن كَادَتْ لَتُبْدِى بِهِۦ لَوْلَآ أَن رَّبَطْنَا عَلَىٰ قَلْبِهَا لِتَكُونَ مِنَ ٱلْمُؤْمِنِينَ
    arabicPlain: وأصبح فؤاد أم موسى فارغا ۖ إن كادت لتبدي به لولا أن ربطنا على قلبها لتكون من المؤمنين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 334
