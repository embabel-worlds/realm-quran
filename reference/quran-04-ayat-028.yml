  data:
    ref: 28:83
    scripture: quran
    name: Quran 28:83
    chapter: 28
    verse: 83
    ordinal: 3335
    text: As for that Abode of the Hereafter We assign it unto those who seek not oppression in the earth, nor yet corruption. The sequel is for those who ward off (evil).
    translation: Pickthall
    original: تِلْكَ ٱلدَّارُ ٱلْـَٔاخِرَةُ نَجْعَلُهَا لِلَّذِينَ لَا يُرِيدُونَ عُلُوًّا فِى ٱلْأَرْضِ وَلَا فَسَادًا ۚ وَٱلْعَـٰقِبَةُ لِلْمُتَّقِينَ
    arabicPlain: تلك الدار الآخرة نجعلها للذين لا يريدون علوا في الأرض ولا فسادا ۚ والعاقبة للمتقين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 341
    page: 395
