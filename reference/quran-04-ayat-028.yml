  data:
    ref: 28:64
    scripture: quran
    name: Quran 28:64
    chapter: 28
    verse: 64
    ordinal: 3316
    text: 'And it will be said: Cry unto your (so-called) partners (of Allah). And they will cry unto them, and they will give no answer unto them, and they will see the Doom. Ah, if they had but been guided!'
    translation: Pickthall
    original: وَقِيلَ ٱدْعُوا۟ شُرَكَآءَكُمْ فَدَعَوْهُمْ فَلَمْ يَسْتَجِيبُوا۟ لَهُمْ وَرَأَوُا۟ ٱلْعَذَابَ ۚ لَوْ أَنَّهُمْ كَانُوا۟ يَهْتَدُونَ
    arabicPlain: وقيل ادعوا شركاءكم فدعوهم فلم يستجيبوا لهم ورأوا العذاب ۚ لو أنهم كانوا يهتدون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 340
    page: 393
