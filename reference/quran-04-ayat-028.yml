- type: Ayah
  data:
    ref: '28:47'
    scripture: quran
    name: Quran 28:47
    chapter: 28
    verse: 47
    ordinal: 3299
    text: 'Otherwise, if disaster should afflict them because of that which their own hands have sent before (them), they might say: Our Lord! Why sentest Thou no messenger unto us, that we might have followed Thy revelations and been of the believers?'
    translation: Pickthall
    original: وَلَوْلَآ أَن تُصِيبَهُم مُّصِيبَةٌۢ بِمَا قَدَّمَتْ أَيْدِيهِمْ فَيَقُولُوا۟ رَبَّنَا لَوْلَآ أَرْسَلْتَ إِلَيْنَا رَسُولًا فَنَتَّبِعَ ءَايَـٰتِكَ وَنَكُونَ مِنَ ٱلْمُؤْمِنِينَ
    arabicPlain: ولولا أن تصيبهم مصيبة بما قدمت أيديهم فيقولوا ربنا لولا أرسلت إلينا رسولا فنتبع آياتك ونكون من المؤمنين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 338
    page: 391
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '28'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-20
- type: Ayah
  data:
    ref: '28:48'
    scripture: quran
    name: Quran 28:48
    chapter: 28
    verse: 48
    ordinal: 3300
    text: 'But when there came unto them the Truth from Our presence, they said: Why is he not given the like of what was given unto Moses? Did they not disbelieve in that which was given unto Moses of old? They say: Two magics that support each other; and they say: Lo! in both we are disbelievers.'
    translation: Pickthall
    original: فَلَمَّا جَآءَهُمُ ٱلْحَقُّ مِنْ عِندِنَا قَالُوا۟ لَوْلَآ أُوتِىَ مِثْلَ مَآ أُوتِىَ مُوسَىٰٓ ۚ أَوَلَمْ يَكْفُرُوا۟ بِمَآ أُوتِىَ مُوسَىٰ مِن قَبْلُ ۖ قَالُوا۟ سِحْرَانِ تَظَـٰهَرَا وَقَالُوٓا۟ إِنَّا بِكُلٍّ كَـٰفِرُونَ
    arabicPlain: فلما جاءهم الحق من عندنا قالوا لولا أوتي مثل ما أوتي موسى ۚ أولم يكفروا بما أوتي موسى من قبل ۖ قالوا سحران تظاهرا وقالوا إنا بكل كافرون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 338
    page: 391
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '28'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-20
- type: Ayah
  data:
    ref: '28:49'
    scripture: quran
    name: Quran 28:49
    chapter: 28
    verse: 49
    ordinal: 3301
    text: 'Say (unto them, O Muhammad): Then bring a scripture from the presence of Allah that giveth clearer guidance than these two (that) I may follow it, if ye are truthful.'
    translation: Pickthall
    original: قُلْ فَأْتُوا۟ بِكِتَـٰبٍ مِّنْ عِندِ ٱللَّهِ هُوَ أَهْدَىٰ مِنْهُمَآ أَتَّبِعْهُ إِن كُنتُمْ صَـٰدِقِينَ
    arabicPlain: قل فأتوا بكتاب من عند الله هو أهدى منهما أتبعه إن كنتم صادقين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 338
    page: 391
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '28'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-20
- type: Ayah
  data:
    ref: '28:50'
    scripture: quran
    name: Quran 28:50
    chapter: 28
    verse: 50
    ordinal: 3302
    text: And if they answer thee not, then know that what they follow is their lusts. And who goeth farther astray than he who followeth his lust without guidance from Allah. Lo! Allah guideth not wrongdoing folk.
    translation: Pickthall
    original: فَإِن لَّمْ يَسْتَجِيبُوا۟ لَكَ فَٱعْلَمْ أَنَّمَا يَتَّبِعُونَ أَهْوَآءَهُمْ ۚ وَمَنْ أَضَلُّ مِمَّنِ ٱتَّبَعَ هَوَىٰهُ بِغَيْرِ هُدًى مِّنَ ٱللَّهِ ۚ إِنَّ ٱللَّهَ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّـٰلِمِينَ
    arabicPlain: فإن لم يستجيبوا لك فاعلم أنما يتبعون أهواءهم ۚ ومن أضل ممن اتبع هواه بغير هدى من الله ۚ إن الله لا يهدي القوم الظالمين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 338
    page: 391
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '28'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-20
- type: Ayah
  data:
    ref: '28:51'
    scripture: quran
    name: Quran 28:51
    chapter: 28
    verse: 51
    ordinal: 3303
    text: And now verily We have caused the Word to reach them, that haply they may give heed.
    translation: Pickthall
    original: ۞ وَلَقَدْ وَصَّلْنَا لَهُمُ ٱلْقَوْلَ لَعَلَّهُمْ يَتَذَكَّرُونَ
    arabicPlain: ۞ ولقد وصلنا لهم القول لعلهم يتذكرون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 339
    page: 392
  relations:
