  data:
    ref: '28:29'
    scripture: quran
    name: Quran 28:29
    chapter: 28
    verse: 29
    ordinal: 3281
    text: 'Then, when Moses had fulfilled the term, and was travelling with his housefolk, he saw in the distance a fire and said unto his housefolk: Bide ye (here). Lo! I see in the distance a fire; peradventure I shall bring you tidings thence, or a brand from the fire that ye may warm yourselves.'
    translation: Pickthall
    original: ۞ فَلَمَّا قَضَىٰ مُوسَى ٱلْأَجَلَ وَسَارَ بِأَهْلِهِۦٓ ءَانَسَ مِن جَانِبِ ٱلطُّورِ نَارًا قَالَ لِأَهْلِهِ ٱمْكُثُوٓا۟ إِنِّىٓ ءَانَسْتُ نَارًا لَّعَلِّىٓ ءَاتِيكُم مِّنْهَا بِخَبَرٍ أَوْ جَذْوَةٍ مِّنَ ٱلنَّارِ لَعَلَّكُمْ تَصْطَلُونَ
    arabicPlain: ۞ فلما قضى موسى الأجل وسار بأهله آنس من جانب الطور نارا قال لأهله امكثوا إني آنست نارا لعلي آتيكم منها بخبر أو جذوة من النار لعلكم تصطلون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 337
    page: 389
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '28'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-20
- type: Ayah
  data:
    ref: '28:30'
    scripture: quran
    name: Quran 28:30
    chapter: 28
    verse: 30
    ordinal: 3282
    text: 'And when he reached it, he was called from the right side of the valley in the blessed field, from the tree: O Moses! Lo! I, even I, am Allah, the Lord of the Worlds;'
    translation: Pickthall
    original: فَلَمَّآ أَتَىٰهَا نُودِىَ مِن شَـٰطِئِ ٱلْوَادِ ٱلْأَيْمَنِ فِى ٱلْبُقْعَةِ ٱلْمُبَـٰرَكَةِ مِنَ ٱلشَّجَرَةِ أَن يَـٰمُوسَىٰٓ إِنِّىٓ أَنَا ٱللَّهُ رَبُّ ٱلْعَـٰلَمِينَ
    arabicPlain: فلما أتاها نودي من شاطئ الواد الأيمن في البقعة المباركة من الشجرة أن يا موسى إني أنا الله رب العالمين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 337
    page: 389
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '28'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-20
- type: Ayah
  data:
    ref: '28:31'
    scripture: quran
    name: Quran 28:31
    chapter: 28
    verse: 31
    ordinal: 3283
    text: 'Throw down thy staff. And when he saw it writhing as it had been a demon, he turned to flee headlong, (and it was said unto him): O Moses! Draw nigh and fear not. Lo! thou art of those who are secure.'
    translation: Pickthall
    original: وَأَنْ أَلْقِ عَصَاكَ ۖ فَلَمَّا رَءَاهَا تَهْتَزُّ كَأَنَّهَا جَآنٌّ وَلَّىٰ مُدْبِرًا وَلَمْ يُعَقِّبْ ۚ يَـٰمُوسَىٰٓ أَقْبِلْ وَلَا تَخَفْ ۖ إِنَّكَ مِنَ ٱلْـَٔامِنِينَ
    arabicPlain: وأن ألق عصاك ۖ فلما رآها تهتز كأنها جان ولى مدبرا ولم يعقب ۚ يا موسى أقبل ولا تخف ۖ إنك من الآمنين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 337
    page: 389
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '28'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-20
- type: Ayah
  data:
    ref: '28:32'
    scripture: quran
    name: Quran 28:32
    chapter: 28
    verse: 32
    ordinal: 3284
    text: Thrust thy hand into the bosom of thy robe it will come forth white without hurt. And guard thy heart from fear. Then these shall be two proofs from your Lord unto Pharaoh and his chiefs. Lo! they are evil-living folk.
    translation: Pickthall
    original: ٱسْلُكْ يَدَكَ فِى جَيْبِكَ تَخْرُجْ بَيْضَآءَ مِنْ غَيْرِ سُوٓءٍ وَٱضْمُمْ إِلَيْكَ جَنَاحَكَ مِنَ ٱلرَّهْبِ ۖ فَذَٰنِكَ بُرْهَـٰنَانِ مِن رَّبِّكَ إِلَىٰ فِرْعَوْنَ وَمَلَإِي۟هِۦٓ ۚ إِنَّهُمْ كَانُوا۟ قَوْمًا فَـٰسِقِينَ
    arabicPlain: اسلك يدك في جيبك تخرج بيضاء من غير سوء واضمم إليك جناحك من الرهب ۖ فذانك برهانان من ربك إلى فرعون وملئه ۚ إنهم كانوا قوما فاسقين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 337
    page: 389
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '28'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-20
- type: Ayah
  data:
    ref: '28:33'
    scripture: quran
    name: Quran 28:33
    chapter: 28
    verse: 33
    ordinal: 3285
    text: 'He said: My Lord! Lo! I killed a man among them and I fear that they will kill me.'
    translation: Pickthall
    original: قَالَ رَبِّ إِنِّى قَتَلْتُ مِنْهُمْ نَفْسًا فَأَخَافُ أَن يَقْتُلُونِ
    arabicPlain: قال رب إني قتلت منهم نفسا فأخاف أن يقتلون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 337
    page: 389
  relations:
  - predicate: IN
    to:
