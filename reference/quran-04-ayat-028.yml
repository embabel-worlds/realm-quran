  data:
    ref: '28:28'
    scripture: quran
    name: Quran 28:28
    chapter: 28
    verse: 28
    ordinal: 3280
    text: 'He said: That (is settled) between thee and me. Whichever of the two terms I fulfil, there will be no injustice to me, and Allah is Surety over what we say.'
    translation: Pickthall
    original: قَالَ ذَٰلِكَ بَيْنِى وَبَيْنَكَ ۖ أَيَّمَا ٱلْأَجَلَيْنِ قَضَيْتُ فَلَا عُدْوَٰنَ عَلَىَّ ۖ وَٱللَّهُ عَلَىٰ مَا نَقُولُ وَكِيلٌ
    arabicPlain: قال ذلك بيني وبينك ۖ أيما الأجلين قضيت فلا عدوان علي ۖ والله على ما نقول وكيل
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 336
    page: 388
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '28'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-20
