  data:
    ref: 28:69
    scripture: quran
    name: Quran 28:69
    chapter: 28
    verse: 69
    ordinal: 3321
    text: And thy Lord knoweth what their breasts conceal, and what they publish.
    translation: Pickthall
    original: وَرَبُّكَ يَعْلَمُ مَا تُكِنُّ صُدُورُهُمْ وَمَا يُعْلِنُونَ
    arabicPlain: وربك يعلم ما تكن صدورهم وما يعلنون
    surahName: Al-Qasas
    juz: 20
