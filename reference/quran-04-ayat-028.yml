  data:
    ref: '28:12'
    scripture: quran
    name: Quran 28:12
    chapter: 28
    verse: 12
    ordinal: 3264
    text: 'And We had before forbidden foster-mothers for him, so she said: Shall I show you a household who will rear him for you and take care of him?'
    translation: Pickthall
    original: ۞ وَحَرَّمْنَا عَلَيْهِ ٱلْمَرَاضِعَ مِن قَبْلُ فَقَالَتْ هَلْ أَدُلُّكُمْ عَلَىٰٓ أَهْلِ بَيْتٍ يَكْفُلُونَهُۥ لَكُمْ وَهُمْ لَهُۥ نَـٰصِحُونَ
    arabicPlain: ۞ وحرمنا عليه المراضع من قبل فقالت هل أدلكم على أهل بيت يكفلونه لكم وهم له ناصحون
    surahName: Al-Qasas
    juz: 20
