  data:
    ref: 28:85
    scripture: quran
    name: Quran 28:85
    chapter: 28
    verse: 85
    ordinal: 3337
    text: 'Lo! He Who hath given thee the Qur''an for a law will surely bring thee home again. Say: My Lord is Best Aware of him who bringeth guidance and him who is in error manifest.'
    translation: Pickthall
    original: إِنَّ ٱلَّذِى فَرَضَ عَلَيْكَ ٱلْقُرْءَانَ لَرَآدُّكَ إِلَىٰ مَعَادٍ ۚ قُل رَّبِّىٓ أَعْلَمُ مَن جَآءَ بِٱلْهُدَىٰ وَمَنْ هُوَ فِى ضَلَـٰلٍ مُّبِينٍ
    arabicPlain: إن الذي فرض عليك القرآن لرادك إلى معاد ۚ قل ربي أعلم من جاء بالهدى ومن هو في ضلال مبين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 341
    page: 396
  relations:
