- type: Ayah
  data:
    ref: '28:9'
    scripture: quran
    name: Quran 28:9
    chapter: 28
    verse: 9
    ordinal: 3261
    text: 'And the wife of Pharaoh said: (He will be) a consolation for me and for thee. Kill him not. Peradventure he may be of use to us, or we may choose him for a son. And they perceived not.'
    translation: Pickthall
    original: وَقَالَتِ ٱمْرَأَتُ فِرْعَوْنَ قُرَّتُ عَيْنٍ لِّى وَلَكَ ۖ لَا تَقْتُلُوهُ عَسَىٰٓ أَن يَنفَعَنَآ أَوْ نَتَّخِذَهُۥ وَلَدًا وَهُمْ لَا يَشْعُرُونَ
    arabicPlain: وقالت امرأت فرعون قرت عين لي ولك ۖ لا تقتلوه عسى أن ينفعنا أو نتخذه ولدا وهم لا يشعرون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 334
    page: 386
