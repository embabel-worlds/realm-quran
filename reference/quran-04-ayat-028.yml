  data:
    ref: '28:14'
    scripture: quran
    name: Quran 28:14
    chapter: 28
    verse: 14
    ordinal: 3266
    text: And when he reached his full strength and was ripe, We gave him wisdom and knowledge. Thus do We reward the good.
    translation: Pickthall
    original: وَلَمَّا بَلَغَ أَشُدَّهُۥ وَٱسْتَوَىٰٓ ءَاتَيْنَـٰهُ حُكْمًا وَعِلْمًا ۚ وَكَذَٰلِكَ نَجْزِى ٱلْمُحْسِنِينَ
    arabicPlain: ولما بلغ أشده واستوى آتيناه حكما وعلما ۚ وكذلك نجزي المحسنين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 335
