  data:
    ref: 28:77
    scripture: quran
    name: Quran 28:77
    chapter: 28
    verse: 77
    ordinal: 3329
    text: But seek the abode of the Hereafter in that which Allah hath given thee and neglect not thy portion of the world, and be thou kind even as Allah hath been kind to thee, and seek not corruption in the earth; lo! Allah loveth not corrupters,
    translation: Pickthall
    original: وَٱبْتَغِ فِيمَآ ءَاتَىٰكَ ٱللَّهُ ٱلدَّارَ ٱلْـَٔاخِرَةَ ۖ وَلَا تَنسَ نَصِيبَكَ مِنَ ٱلدُّنْيَا ۖ وَأَحْسِن كَمَآ أَحْسَنَ ٱللَّهُ إِلَيْكَ ۖ وَلَا تَبْغِ ٱلْفَسَادَ فِى ٱلْأَرْضِ ۖ إِنَّ ٱللَّهَ لَا يُحِبُّ ٱلْمُفْسِدِينَ
    arabicPlain: وابتغ فيما آتاك الله الدار الآخرة ۖ ولا تنس نصيبك من الدنيا ۖ وأحسن كما أحسن الله إليك ۖ ولا تبغ الفساد في الأرض ۖ إن الله لا يحب المفسدين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 341
    page: 394
