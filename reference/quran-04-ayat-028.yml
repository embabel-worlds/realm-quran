- type: Ayah
  data:
    ref: '28:18'
    scripture: quran
    name: Quran 28:18
    chapter: 28
    verse: 18
    ordinal: 3270
    text: 'And morning found him in the city, fearing, vigilant, when behold! he who had appealed to him the day before cried out to him for help. Moses said unto him: Lo! thou art indeed a mere hothead.'
    translation: Pickthall
    original: فَأَصْبَحَ فِى ٱلْمَدِينَةِ خَآئِفًا يَتَرَقَّبُ فَإِذَا ٱلَّذِى ٱسْتَنصَرَهُۥ بِٱلْأَمْسِ يَسْتَصْرِخُهُۥ ۚ قَالَ لَهُۥ مُوسَىٰٓ إِنَّكَ لَغَوِىٌّ مُّبِينٌ
    arabicPlain: فأصبح في المدينة خائفا يترقب فإذا الذي استنصره بالأمس يستصرخه ۚ قال له موسى إنك لغوي مبين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 335
    page: 387
