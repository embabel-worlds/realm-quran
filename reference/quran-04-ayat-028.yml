  data:
    ref: 28:62
    scripture: quran
    name: Quran 28:62
    chapter: 28
    verse: 62
    ordinal: 3314
    text: 'On the day when He will call unto them and say: Where are My partners whom ye imagined?'
    translation: Pickthall
    original: وَيَوْمَ يُنَادِيهِمْ فَيَقُولُ أَيْنَ شُرَكَآءِىَ ٱلَّذِينَ كُنتُمْ تَزْعُمُونَ
    arabicPlain: ويوم يناديهم فيقول أين شركائي الذين كنتم تزعمون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 340
    page: 393
  relations:
