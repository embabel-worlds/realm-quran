  data:
    ref: '28:45'
    scripture: quran
    name: Quran 28:45
    chapter: 28
    verse: 45
    ordinal: 3297
    text: But We brought forth generations, and their lives dragged on for them. And thou wast not a dweller in Midian, reciting unto them Our revelations, but We kept sending (messengers to men).
    translation: Pickthall
    original: وَلَـٰكِنَّآ أَنشَأْنَا قُرُونًا فَتَطَاوَلَ عَلَيْهِمُ ٱلْعُمُرُ ۚ وَمَا كُنتَ ثَاوِيًا فِىٓ أَهْلِ مَدْيَنَ تَتْلُوا۟ عَلَيْهِمْ ءَايَـٰتِنَا وَلَـٰكِنَّا كُنَّا مُرْسِلِينَ
    arabicPlain: ولكنا أنشأنا قرونا فتطاول عليهم العمر ۚ وما كنت ثاويا في أهل مدين تتلو عليهم آياتنا ولكنا كنا مرسلين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 338
    page: 391
