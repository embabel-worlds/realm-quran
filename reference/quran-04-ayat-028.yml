  data:
    ref: 28:79
    scripture: quran
    name: Quran 28:79
    chapter: 28
    verse: 79
    ordinal: 3331
    text: 'Then went he forth before his people in his pomp. Those who were desirous of the life of the world said: Ah, would that we had the like of what hath been given unto Korah! Lo! he is lord of rare good fortune.'
    translation: Pickthall
    original: فَخَرَجَ عَلَىٰ قَوْمِهِۦ فِى زِينَتِهِۦ ۖ قَالَ ٱلَّذِينَ يُرِيدُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا يَـٰلَيْتَ لَنَا مِثْلَ مَآ أُوتِىَ قَـٰرُونُ إِنَّهُۥ لَذُو حَظٍّ عَظِيمٍ
    arabicPlain: فخرج على قومه في زينته ۖ قال الذين يريدون الحياة الدنيا يا ليت لنا مثل ما أوتي قارون إنه لذو حظ عظيم
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 341
    page: 395
  relations:
