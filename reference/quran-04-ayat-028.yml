  data:
    ref: '28:56'
    scripture: quran
    name: Quran 28:56
    chapter: 28
    verse: 56
    ordinal: 3308
    text: Lo! thou (O Muhammad) guidest not whom thou lovest, but Allah guideth whom He will. And He is Best Aware of those who walk aright.
    translation: Pickthall
    original: إِنَّكَ لَا تَهْدِى مَنْ أَحْبَبْتَ وَلَـٰكِنَّ ٱللَّهَ يَهْدِى مَن يَشَآءُ ۚ وَهُوَ أَعْلَمُ بِٱلْمُهْتَدِينَ
    arabicPlain: إنك لا تهدي من أحببت ولكن الله يهدي من يشاء ۚ وهو أعلم بالمهتدين
    surahName: Al-Qasas
    juz: 20
