  data:
    ref: '28:43'
    scripture: quran
    name: Quran 28:43
    chapter: 28
    verse: 43
    ordinal: 3295
    text: 'And We verily gave the Scripture unto Moses after We had destroyed the generations of old: clear testimonies for mankind, and a guidance and a mercy, that haply they might reflect.'
    translation: Pickthall
    original: وَلَقَدْ ءَاتَيْنَا مُوسَى ٱلْكِتَـٰبَ مِنۢ بَعْدِ مَآ أَهْلَكْنَا ٱلْقُرُونَ ٱلْأُولَىٰ بَصَآئِرَ لِلنَّاسِ وَهُدًى وَرَحْمَةً لَّعَلَّهُمْ يَتَذَكَّرُونَ
    arabicPlain: ولقد آتينا موسى الكتاب من بعد ما أهلكنا القرون الأولى بصائر للناس وهدى ورحمة لعلهم يتذكرون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 338
