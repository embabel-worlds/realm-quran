  data:
    ref: '28:17'
    scripture: quran
    name: Quran 28:17
    chapter: 28
    verse: 17
    ordinal: 3269
    text: 'He said: My Lord! Forasmuch as Thou hast favoured me, I will nevermore be a supporter of the guilty.'
    translation: Pickthall
    original: قَالَ رَبِّ بِمَآ أَنْعَمْتَ عَلَىَّ فَلَنْ أَكُونَ ظَهِيرًا لِّلْمُجْرِمِينَ
    arabicPlain: قال رب بما أنعمت علي فلن أكون ظهيرا للمجرمين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 335
