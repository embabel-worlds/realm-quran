  data:
    ref: 28:80
    scripture: quran
    name: Quran 28:80
    chapter: 28
    verse: 80
    ordinal: 3332
    text: 'But those who had been given knowledge said: Woe unto you! The reward of Allah for him who believeth and doeth right is better, and only the steadfast will obtain it.'
    translation: Pickthall
    original: وَقَالَ ٱلَّذِينَ أُوتُوا۟ ٱلْعِلْمَ وَيْلَكُمْ ثَوَابُ ٱللَّهِ خَيْرٌ لِّمَنْ ءَامَنَ وَعَمِلَ صَـٰلِحًا وَلَا يُلَقَّىٰهَآ إِلَّا ٱلصَّـٰبِرُونَ
    arabicPlain: وقال الذين أوتوا العلم ويلكم ثواب الله خير لمن آمن وعمل صالحا ولا يلقاها إلا الصابرون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 341
    page: 395
