  data:
    ref: '28:58'
    scripture: quran
    name: Quran 28:58
    chapter: 28
    verse: 58
    ordinal: 3310
    text: And how many a community have We destroyed that was thankless for its means of livelihood! And yonder are their dwellings, which have not been inhabited after them save a little. And We, even We, were the inheritors.
    translation: Pickthall
    original: وَكَمْ أَهْلَكْنَا مِن قَرْيَةٍۭ بَطِرَتْ مَعِيشَتَهَا ۖ فَتِلْكَ مَسَـٰكِنُهُمْ لَمْ تُسْكَن مِّنۢ بَعْدِهِمْ إِلَّا قَلِيلًا ۖ وَكُنَّا نَحْنُ ٱلْوَٰرِثِينَ
    arabicPlain: وكم أهلكنا من قرية بطرت معيشتها ۖ فتلك مساكنهم لم تسكن من بعدهم إلا قليلا ۖ وكنا نحن الوارثين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 339
    page: 392
