  data:
    ref: '28:39'
    scripture: quran
    name: Quran 28:39
    chapter: 28
    verse: 39
    ordinal: 3291
    text: And he and his hosts were haughty in the land without right, and deemed that they would never be brought back to Us.
    translation: Pickthall
    original: وَٱسْتَكْبَرَ هُوَ وَجُنُودُهُۥ فِى ٱلْأَرْضِ بِغَيْرِ ٱلْحَقِّ وَظَنُّوٓا۟ أَنَّهُمْ إِلَيْنَا لَا يُرْجَعُونَ
    arabicPlain: واستكبر هو وجنوده في الأرض بغير الحق وظنوا أنهم إلينا لا يرجعون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
