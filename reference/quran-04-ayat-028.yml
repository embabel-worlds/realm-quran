  data:
    ref: 28:60
    scripture: quran
    name: Quran 28:60
    chapter: 28
    verse: 60
    ordinal: 3312
    text: And whatsoever ye have been given is a comfort of the life of the world and an ornament thereof; and that which Allah hath is better and more lasting. Have ye then no sense?
    translation: Pickthall
    original: وَمَآ أُوتِيتُم مِّن شَىْءٍ فَمَتَـٰعُ ٱلْحَيَوٰةِ ٱلدُّنْيَا وَزِينَتُهَا ۚ وَمَا عِندَ ٱللَّهِ خَيْرٌ وَأَبْقَىٰٓ ۚ أَفَلَا تَعْقِلُونَ
    arabicPlain: وما أوتيتم من شيء فمتاع الحياة الدنيا وزينتها ۚ وما عند الله خير وأبقى ۚ أفلا تعقلون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 339
    page: 393
