  data:
    ref: '28:59'
    scripture: quran
    name: Quran 28:59
    chapter: 28
    verse: 59
    ordinal: 3311
    text: And never did thy Lord destroy the townships, till He had raised up in their mother(-town) a messenger reciting unto them Our revelations. And never did We destroy the townships unless the folk thereof were evil-doers.
    translation: Pickthall
    original: وَمَا كَانَ رَبُّكَ مُهْلِكَ ٱلْقُرَىٰ حَتَّىٰ يَبْعَثَ فِىٓ أُمِّهَا رَسُولًا يَتْلُوا۟ عَلَيْهِمْ ءَايَـٰتِنَا ۚ وَمَا كُنَّا مُهْلِكِى ٱلْقُرَىٰٓ إِلَّا وَأَهْلُهَا ظَـٰلِمُونَ
    arabicPlain: وما كان ربك مهلك القرى حتى يبعث في أمها رسولا يتلو عليهم آياتنا ۚ وما كنا مهلكي القرى إلا وأهلها ظالمون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 339
    page: 392
