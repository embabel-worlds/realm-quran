  data:
    ref: 28:86
    scripture: quran
    name: Quran 28:86
    chapter: 28
    verse: 86
    ordinal: 3338
    text: Thou hadst no hope that the Scripture would be inspired in thee; but it is a mercy from thy Lord, so never be a helper to the disbelievers.
    translation: Pickthall
    original: وَمَا كُنتَ تَرْجُوٓا۟ أَن يُلْقَىٰٓ إِلَيْكَ ٱلْكِتَـٰبُ إِلَّا رَحْمَةً مِّن رَّبِّكَ ۖ فَلَا تَكُونَنَّ ظَهِيرًا لِّلْكَـٰفِرِينَ
    arabicPlain: وما كنت ترجو أن يلقى إليك الكتاب إلا رحمة من ربك ۖ فلا تكونن ظهيرا للكافرين
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 341
    page: 396
  relations:
