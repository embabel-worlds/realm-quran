  data:
    ref: 28:66
    scripture: quran
    name: Quran 28:66
    chapter: 28
    verse: 66
    ordinal: 3318
    text: On that day (all) tidings will be dimmed for them, nor will they ask one of another,
    translation: Pickthall
    original: فَعَمِيَتْ عَلَيْهِمُ ٱلْأَنۢبَآءُ يَوْمَئِذٍ فَهُمْ لَا يَتَسَآءَلُونَ
    arabicPlain: فعميت عليهم الأنباء يومئذ فهم لا يتساءلون
    surahName: Al-Qasas
    juz: 20
    manzil: 5
    ruku: 340
