  data:
    ref: 29:66
    scripture: quran
    name: Quran 29:66
    chapter: 29
    verse: 66
    ordinal: 3406
    text: That they may disbelieve in that which We have given them, and that they may take their ease. But they will come to know.
    translation: Pickthall
    original: لِيَكْفُرُوا۟ بِمَآ ءَاتَيْنَـٰهُمْ وَلِيَتَمَتَّعُوا۟ ۖ فَسَوْفَ يَعْلَمُونَ
    arabicPlain: ليكفروا بما آتيناهم وليتمتعوا ۖ فسوف يعلمون
    surahName: Al-Ankaboot
    juz: 21
    manzil: 5
    ruku: 348
