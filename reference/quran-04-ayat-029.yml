    scripture: quran
    name: Quran 29:69
    chapter: 29
    verse: 69
    ordinal: 3409
    text: As for those who strive in Us, We surely guide them to Our paths, and lo! Allah is with the good.
    translation: Pickthall
    original: وَٱلَّذِينَ جَـٰهَدُوا۟ فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا ۚ وَإِنَّ ٱللَّهَ لَمَعَ ٱلْمُحْسِنِينَ
    arabicPlain: والذين جاهدوا فينا لنهدينهم سبلنا ۚ وإن الله لمع المحسنين
    surahName: Al-Ankaboot
    juz: 21
    manzil: 5
