    scripture: quran
    name: Quran 29:6
    chapter: 29
    verse: 6
    ordinal: 3346
    text: And whosoever striveth, striveth only for himself, for lo! Allah is altogether Independent of (His) creatures.
    translation: Pickthall
    original: وَمَن جَـٰهَدَ فَإِنَّمَا يُجَـٰهِدُ لِنَفْسِهِۦٓ ۚ إِنَّ ٱللَّهَ لَغَنِىٌّ عَنِ ٱلْعَـٰلَمِينَ
    arabicPlain: ومن جاهد فإنما يجاهد لنفسه ۚ إن الله لغني عن العالمين
