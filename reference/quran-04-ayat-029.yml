  data:
    ref: '29:28'
    scripture: quran
    name: Quran 29:28
    chapter: 29
    verse: 28
    ordinal: 3368
    text: 'And Lot! (Remember) when he said unto his folk: Lo! ye commit lewdness such as no creature did before you.'
    translation: Pickthall
    original: وَلُوطًا إِذْ قَالَ لِقَوْمِهِۦٓ إِنَّكُمْ لَتَأْتُونَ ٱلْفَـٰحِشَةَ مَا سَبَقَكُم بِهَا مِنْ أَحَدٍ مِّنَ ٱلْعَـٰلَمِينَ
    arabicPlain: ولوطا إذ قال لقومه إنكم لتأتون الفاحشة ما سبقكم بها من أحد من العالمين
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 344
    page: 399
  relations:
