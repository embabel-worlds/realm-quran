  data:
    ref: 29:63
    scripture: quran
    name: Quran 29:63
    chapter: 29
    verse: 63
    ordinal: 3403
    text: 'And if thou wert to ask them: Who causeth water to come down from the sky, and therewith reviveth the earth after its death? they verily would say: Allah. Say: Praise be to Allah! But most of them have no sense.'
    translation: Pickthall
    original: وَلَئِن سَأَلْتَهُم مَّن نَّزَّلَ مِنَ ٱلسَّمَآءِ مَآءً فَأَحْيَا بِهِ ٱلْأَرْضَ مِنۢ بَعْدِ مَوْتِهَا لَيَقُولُنَّ ٱللَّهُ ۚ قُلِ ٱلْحَمْدُ لِلَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْقِلُونَ
    arabicPlain: ولئن سألتهم من نزل من السماء ماء فأحيا به الأرض من بعد موتها ليقولن الله ۚ قل الحمد لله ۚ بل أكثرهم لا يعقلون
    surahName: Al-Ankaboot
    juz: 21
    manzil: 5
    ruku: 347
