    scripture: quran
    name: Quran 29:21
    chapter: 29
    verse: 21
    ordinal: 3361
    text: He punisheth whom He will and showeth mercy unto whom He will, and unto Him ye will be turned.
    translation: Pickthall
    original: يُعَذِّبُ مَن يَشَآءُ وَيَرْحَمُ مَن يَشَآءُ ۖ وَإِلَيْهِ تُقْلَبُونَ
