  data:
    ref: '29:35'
    scripture: quran
    name: Quran 29:35
    chapter: 29
    verse: 35
    ordinal: 3375
    text: And verily of that We have left a clear sign for people who have sense.
    translation: Pickthall
    original: وَلَقَد تَّرَكْنَا مِنْهَآ ءَايَةًۢ بَيِّنَةً لِّقَوْمٍ يَعْقِلُونَ
    arabicPlain: ولقد تركنا منها آية بينة لقوم يعقلون
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 345
    page: 400
