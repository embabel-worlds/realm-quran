  data:
    ref: '29:12'
    scripture: quran
    name: Quran 29:12
    chapter: 29
    verse: 12
    ordinal: 3352
    text: 'Those who disbelieve say unto those who believe: Follow our way (of religion) and we verily will bear your sins (for you). They cannot bear aught of their sins. Lo! they verily are liars.'
    translation: Pickthall
    original: وَقَالَ ٱلَّذِينَ كَفَرُوا۟ لِلَّذِينَ ءَامَنُوا۟ ٱتَّبِعُوا۟ سَبِيلَنَا وَلْنَحْمِلْ خَطَـٰيَـٰكُمْ وَمَا هُم بِحَـٰمِلِينَ مِنْ خَطَـٰيَـٰهُم مِّن شَىْءٍ ۖ إِنَّهُمْ لَكَـٰذِبُونَ
    arabicPlain: وقال الذين كفروا للذين آمنوا اتبعوا سبيلنا ولنحمل خطاياكم وما هم بحاملين من خطاياهم من شيء ۖ إنهم لكاذبون
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 342
    page: 397
  relations:
  - predicate: IN
    to:
      type: Surah
