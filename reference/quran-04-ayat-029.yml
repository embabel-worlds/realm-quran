  data:
    ref: '29:36'
    scripture: quran
    name: Quran 29:36
    chapter: 29
    verse: 36
    ordinal: 3376
    text: 'And unto Midian We sent Shu''eyb, their brother. He said: O my people! Serve Allah, and look forward to the Last Day, and do not evil, making mischief, in the earth.'
    translation: Pickthall
    original: وَإِلَىٰ مَدْيَنَ أَخَاهُمْ شُعَيْبًا فَقَالَ يَـٰقَوْمِ ٱعْبُدُوا۟ ٱللَّهَ وَٱرْجُوا۟ ٱلْيَوْمَ ٱلْـَٔاخِرَ وَلَا تَعْثَوْا۟ فِى ٱلْأَرْضِ مُفْسِدِينَ
    arabicPlain: وإلى مدين أخاهم شعيبا فقال يا قوم اعبدوا الله وارجوا اليوم الآخر ولا تعثوا في الأرض مفسدين
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 345
    page: 400
