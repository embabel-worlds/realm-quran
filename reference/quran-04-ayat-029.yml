  data:
    ref: '29:23'
    scripture: quran
    name: Quran 29:23
    chapter: 29
    verse: 23
    ordinal: 3363
    text: Those who disbelieve in the revelations of Allah and in (their) Meeting with Him, such have no hope of My mercy. For such there is a painful doom.
    translation: Pickthall
    original: وَٱلَّذِينَ كَفَرُوا۟ بِـَٔايَـٰتِ ٱللَّهِ وَلِقَآئِهِۦٓ أُو۟لَـٰٓئِكَ يَئِسُوا۟ مِن رَّحْمَتِى وَأُو۟لَـٰٓئِكَ لَهُمْ عَذَابٌ أَلِيمٌ
    arabicPlain: والذين كفروا بآيات الله ولقائه أولئك يئسوا من رحمتي وأولئك لهم عذاب أليم
    surahName: Al-Ankaboot
    juz: 20
