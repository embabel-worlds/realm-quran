- type: Ayah
  data:
    ref: '29:48'
    scripture: quran
    name: Quran 29:48
    chapter: 29
    verse: 48
    ordinal: 3388
    text: And thou (O Muhammad) wast not a reader of any scripture before it, nor didst thou write it with thy right hand, for then might those have doubted, who follow falsehood.
    translation: Pickthall
    original: وَمَا كُنتَ تَتْلُوا۟ مِن قَبْلِهِۦ مِن كِتَـٰبٍ وَلَا تَخُطُّهُۥ بِيَمِينِكَ ۖ إِذًا لَّٱرْتَابَ ٱلْمُبْطِلُونَ
    arabicPlain: وما كنت تتلو من قبله من كتاب ولا تخطه بيمينك ۖ إذا لارتاب المبطلون
    surahName: Al-Ankaboot
    juz: 21
    manzil: 5
    ruku: 346
    page: 402
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '29'
  - predicate: IN_PORTION
    to:
