  data:
    ref: '29:22'
    scripture: quran
    name: Quran 29:22
    chapter: 29
    verse: 22
    ordinal: 3362
    text: Ye cannot escape (from Him) in the earth or in the sky, and beside Allah there is for you no friend or helper.
    translation: Pickthall
    original: وَمَآ أَنتُم بِمُعْجِزِينَ فِى ٱلْأَرْضِ وَلَا فِى ٱلسَّمَآءِ ۖ وَمَا لَكُم مِّن دُونِ ٱللَّهِ مِن وَلِىٍّ وَلَا نَصِيرٍ
    arabicPlain: وما أنتم بمعجزين في الأرض ولا في السماء ۖ وما لكم من دون الله من ولي ولا نصير
