  data:
    ref: '29:13'
    scripture: quran
    name: Quran 29:13
    chapter: 29
    verse: 13
    ordinal: 3353
    text: But they verily will bear their own loads and other loads beside their own, and they verily will be questioned on the Day of Resurrection concerning that which they invented.
    translation: Pickthall
    original: وَلَيَحْمِلُنَّ أَثْقَالَهُمْ وَأَثْقَالًا مَّعَ أَثْقَالِهِمْ ۖ وَلَيُسْـَٔلُنَّ يَوْمَ ٱلْقِيَـٰمَةِ عَمَّا كَانُوا۟ يَفْتَرُونَ
    arabicPlain: وليحملن أثقالهم وأثقالا مع أثقالهم ۖ وليسألن يوم القيامة عما كانوا يفترون
    surahName: Al-Ankaboot
    juz: 20
