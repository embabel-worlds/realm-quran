  data:
    ref: 29:61
    scripture: quran
    name: Quran 29:61
    chapter: 29
    verse: 61
    ordinal: 3401
    text: 'And if thou wert to ask them: Who created the heavens and the earth, and constrained the sun and the moon (to their appointed work)? they would say: Allah. How then are they turned away?'
    translation: Pickthall
    original: وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ وَسَخَّرَ ٱلشَّمْسَ وَٱلْقَمَرَ لَيَقُولُنَّ ٱللَّهُ ۖ فَأَنَّىٰ يُؤْفَكُونَ
    arabicPlain: ولئن سألتهم من خلق السماوات والأرض وسخر الشمس والقمر ليقولن الله ۖ فأنى يؤفكون
    surahName: Al-Ankaboot
    juz: 21
