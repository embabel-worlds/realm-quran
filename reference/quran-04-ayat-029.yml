  data:
    ref: 29:67
    scripture: quran
    name: Quran 29:67
    chapter: 29
    verse: 67
    ordinal: 3407
    text: Have they not seen that We have appointed a sanctuary immune (from violence), while mankind are ravaged all around them? Do they then believe in falsehood and disbelieve in the bounty of Allah?
    translation: Pickthall
    original: أَوَلَمْ يَرَوْا۟ أَنَّا جَعَلْنَا حَرَمًا ءَامِنًا وَيُتَخَطَّفُ ٱلنَّاسُ مِنْ حَوْلِهِمْ ۚ أَفَبِٱلْبَـٰطِلِ يُؤْمِنُونَ وَبِنِعْمَةِ ٱللَّهِ يَكْفُرُونَ
    arabicPlain: أولم يروا أنا جعلنا حرما آمنا ويتخطف الناس من حولهم ۚ أفبالباطل يؤمنون وبنعمة الله يكفرون
    surahName: Al-Ankaboot
    juz: 21
    manzil: 5
    ruku: 348
    page: 404
