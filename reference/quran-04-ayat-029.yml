  data:
    ref: '29:49'
    scripture: quran
    name: Quran 29:49
    chapter: 29
    verse: 49
    ordinal: 3389
    text: But it is clear revelations in the hearts of those who have been given knowledge, and none deny Our revelations save wrong-doers.
    translation: Pickthall
    original: بَلْ هُوَ ءَايَـٰتٌۢ بَيِّنَـٰتٌ فِى صُدُورِ ٱلَّذِينَ أُوتُوا۟ ٱلْعِلْمَ ۚ وَمَا يَجْحَدُ بِـَٔايَـٰتِنَآ إِلَّا ٱلظَّـٰلِمُونَ
    arabicPlain: بل هو آيات بينات في صدور الذين أوتوا العلم ۚ وما يجحد بآياتنا إلا الظالمون
    surahName: Al-Ankaboot
    juz: 21
    manzil: 5
    ruku: 346
    page: 402
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '29'
  - predicate: IN_PORTION
    to:
