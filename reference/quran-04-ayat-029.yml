  data:
    ref: '29:31'
    scripture: quran
    name: Quran 29:31
    chapter: 29
    verse: 31
    ordinal: 3371
    text: 'And when Our messengers brought Abraham the good news, they said: Lo! we are about to destroy the people of that township, for its people are wrong-doers.'
    translation: Pickthall
    original: وَلَمَّا جَآءَتْ رُسُلُنَآ إِبْرَٰهِيمَ بِٱلْبُشْرَىٰ قَالُوٓا۟ إِنَّا مُهْلِكُوٓا۟ أَهْلِ هَـٰذِهِ ٱلْقَرْيَةِ ۖ إِنَّ أَهْلَهَا كَانُوا۟ ظَـٰلِمِينَ
    arabicPlain: ولما جاءت رسلنا إبراهيم بالبشرى قالوا إنا مهلكو أهل هذه القرية ۖ إن أهلها كانوا ظالمين
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 345
    page: 400
  relations:
