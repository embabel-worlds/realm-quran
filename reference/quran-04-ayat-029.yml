  data:
    ref: '29:53'
    scripture: quran
    name: Quran 29:53
    chapter: 29
    verse: 53
    ordinal: 3393
    text: They bid thee hasten on the doom (of Allah). And if a term had not been appointed, the doom would assuredly have come unto them (ere now). And verily it will come upon them suddenly when they perceive not.
    translation: Pickthall
    original: وَيَسْتَعْجِلُونَكَ بِٱلْعَذَابِ ۚ وَلَوْلَآ أَجَلٌ مُّسَمًّى لَّجَآءَهُمُ ٱلْعَذَابُ وَلَيَأْتِيَنَّهُم بَغْتَةً وَهُمْ لَا يَشْعُرُونَ
    arabicPlain: ويستعجلونك بالعذاب ۚ ولولا أجل مسمى لجاءهم العذاب وليأتينهم بغتة وهم لا يشعرون
