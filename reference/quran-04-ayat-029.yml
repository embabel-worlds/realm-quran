  data:
    ref: 29:64
    scripture: quran
    name: Quran 29:64
    chapter: 29
    verse: 64
    ordinal: 3404
    text: This life of the world is but a pastime and a game. Lo! the home of the Hereafter - that is Life, if they but knew.
    translation: Pickthall
    original: وَمَا هَـٰذِهِ ٱلْحَيَوٰةُ ٱلدُّنْيَآ إِلَّا لَهْوٌ وَلَعِبٌ ۚ وَإِنَّ ٱلدَّارَ ٱلْـَٔاخِرَةَ لَهِىَ ٱلْحَيَوَانُ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ
    arabicPlain: وما هذه الحياة الدنيا إلا لهو ولعب ۚ وإن الدار الآخرة لهي الحيوان ۚ لو كانوا يعلمون
    surahName: Al-Ankaboot
    juz: 21
    manzil: 5
    ruku: 348
