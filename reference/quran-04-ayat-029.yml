  data:
    ref: '29:26'
    scripture: quran
    name: Quran 29:26
    chapter: 29
    verse: 26
    ordinal: 3366
    text: 'And Lot believed him, and said: Lo! I am a fugitive unto my Lord. Lo! He, only He, is the Mighty, the Wise.'
    translation: Pickthall
    original: ۞ فَـَٔامَنَ لَهُۥ لُوطٌ ۘ وَقَالَ إِنِّى مُهَاجِرٌ إِلَىٰ رَبِّىٓ ۖ إِنَّهُۥ هُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ
    arabicPlain: ۞ فآمن له لوط ۘ وقال إني مهاجر إلى ربي ۖ إنه هو العزيز الحكيم
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 344
    page: 399
