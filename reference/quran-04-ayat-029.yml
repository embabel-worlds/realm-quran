    scripture: quran
    name: Quran 29:9
    chapter: 29
    verse: 9
    ordinal: 3349
    text: And as for those who believe and do good works, We verily shall make them enter in among the righteous.
    translation: Pickthall
    original: وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ لَنُدْخِلَنَّهُمْ فِى ٱلصَّـٰلِحِينَ
    arabicPlain: والذين آمنوا وعملوا الصالحات لندخلنهم في الصالحين
