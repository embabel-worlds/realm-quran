  data:
    ref: '29:34'
    scripture: quran
    name: Quran 29:34
    chapter: 29
    verse: 34
    ordinal: 3374
    text: Lo! We are about to bring down upon the folk of this township a fury from the sky because they are evil-livers.
    translation: Pickthall
    original: إِنَّا مُنزِلُونَ عَلَىٰٓ أَهْلِ هَـٰذِهِ ٱلْقَرْيَةِ رِجْزًا مِّنَ ٱلسَّمَآءِ بِمَا كَانُوا۟ يَفْسُقُونَ
    arabicPlain: إنا منزلون على أهل هذه القرية رجزا من السماء بما كانوا يفسقون
    surahName: Al-Ankaboot
    juz: 20
