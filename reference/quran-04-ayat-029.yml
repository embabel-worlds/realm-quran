  data:
    ref: '29:38'
    scripture: quran
    name: Quran 29:38
    chapter: 29
    verse: 38
    ordinal: 3378
    text: And (the tribes of) A'ad and Thamud! (Their fate) is manifest unto you from their (ruined and deserted) dwellings. Satan made their deeds seem fair unto them and so debarred them from the Way, though they were keen observers.
    translation: Pickthall
    original: وَعَادًا وَثَمُودَا۟ وَقَد تَّبَيَّنَ لَكُم مِّن مَّسَـٰكِنِهِمْ ۖ وَزَيَّنَ لَهُمُ ٱلشَّيْطَـٰنُ أَعْمَـٰلَهُمْ فَصَدَّهُمْ عَنِ ٱلسَّبِيلِ وَكَانُوا۟ مُسْتَبْصِرِينَ
    arabicPlain: وعادا وثمود وقد تبين لكم من مساكنهم ۖ وزين لهم الشيطان أعمالهم فصدهم عن السبيل وكانوا مستبصرين
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 345
