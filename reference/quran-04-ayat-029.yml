  data:
    ref: '29:39'
    scripture: quran
    name: Quran 29:39
    chapter: 29
    verse: 39
    ordinal: 3379
    text: And Korah, Pharaoh and Haman! Moses came unto them with clear proofs (of Allah's Sovereignty), but they were boastful in the land. And they were not winners (in the race).
    translation: Pickthall
    original: وَقَـٰرُونَ وَفِرْعَوْنَ وَهَـٰمَـٰنَ ۖ وَلَقَدْ جَآءَهُم مُّوسَىٰ بِٱلْبَيِّنَـٰتِ فَٱسْتَكْبَرُوا۟ فِى ٱلْأَرْضِ وَمَا كَانُوا۟ سَـٰبِقِينَ
    arabicPlain: وقارون وفرعون وهامان ۖ ولقد جاءهم موسى بالبينات فاستكبروا في الأرض وما كانوا سابقين
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 345
