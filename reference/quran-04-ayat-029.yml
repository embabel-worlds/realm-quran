  data:
    ref: '29:16'
    scripture: quran
    name: Quran 29:16
    chapter: 29
    verse: 16
    ordinal: 3356
    text: 'And Abraham! (Remember) when he said unto his folk: Serve Allah, and keep your duty unto Him; that is better for you if ye did but know.'
    translation: Pickthall
    original: وَإِبْرَٰهِيمَ إِذْ قَالَ لِقَوْمِهِ ٱعْبُدُوا۟ ٱللَّهَ وَٱتَّقُوهُ ۖ ذَٰلِكُمْ خَيْرٌ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ
    arabicPlain: وإبراهيم إذ قال لقومه اعبدوا الله واتقوه ۖ ذلكم خير لكم إن كنتم تعلمون
    surahName: Al-Ankaboot
    juz: 20
