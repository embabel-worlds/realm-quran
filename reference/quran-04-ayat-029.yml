  data:
    ref: 29:62
    scripture: quran
    name: Quran 29:62
    chapter: 29
    verse: 62
    ordinal: 3402
    text: Allah maketh the provision wide for whom He will of His bondmen, and straiteneth it for whom (He will). Lo! Allah is Aware of all things.
    translation: Pickthall
    original: ٱللَّهُ يَبْسُطُ ٱلرِّزْقَ لِمَن يَشَآءُ مِنْ عِبَادِهِۦ وَيَقْدِرُ لَهُۥٓ ۚ إِنَّ ٱللَّهَ بِكُلِّ شَىْءٍ عَلِيمٌ
    arabicPlain: الله يبسط الرزق لمن يشاء من عباده ويقدر له ۚ إن الله بكل شيء عليم
    surahName: Al-Ankaboot
    juz: 21
    manzil: 5
    ruku: 347
    page: 403
