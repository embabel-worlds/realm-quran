  data:
    ref: '29:29'
    scripture: quran
    name: Quran 29:29
    chapter: 29
    verse: 29
    ordinal: 3369
    text: 'For come ye not in unto males, and cut ye not the road (for travellers), and commit ye not abomination in your meetings? But the answer of his folk was only that they said: Bring Allah''s doom upon us if thou art a truthteller!'
    translation: Pickthall
    original: أَئِنَّكُمْ لَتَأْتُونَ ٱلرِّجَالَ وَتَقْطَعُونَ ٱلسَّبِيلَ وَتَأْتُونَ فِى نَادِيكُمُ ٱلْمُنكَرَ ۖ فَمَا كَانَ جَوَابَ قَوْمِهِۦٓ إِلَّآ أَن قَالُوا۟ ٱئْتِنَا بِعَذَابِ ٱللَّهِ إِن كُنتَ مِنَ ٱلصَّـٰدِقِينَ
    arabicPlain: أئنكم لتأتون الرجال وتقطعون السبيل وتأتون في ناديكم المنكر ۖ فما كان جواب قومه إلا أن قالوا ائتنا بعذاب الله إن كنت من الصادقين
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 344
    page: 399
