  data:
    ref: '29:30'
    scripture: quran
    name: Quran 29:30
    chapter: 29
    verse: 30
    ordinal: 3370
    text: 'He said: My Lord! Give me victory over folk who work corruption.'
    translation: Pickthall
    original: قَالَ رَبِّ ٱنصُرْنِى عَلَى ٱلْقَوْمِ ٱلْمُفْسِدِينَ
    arabicPlain: قال رب انصرني على القوم المفسدين
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 344
    page: 399
