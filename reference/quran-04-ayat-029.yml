  data:
    ref: 29:68
    scripture: quran
    name: Quran 29:68
    chapter: 29
    verse: 68
    ordinal: 3408
    text: Who doeth greater wrong than he who inventeth a lie concerning Allah, or denieth the truth when it cometh unto him? Is not there a home in hell for disbelievers?
    translation: Pickthall
    original: وَمَنْ أَظْلَمُ مِمَّنِ ٱفْتَرَىٰ عَلَى ٱللَّهِ كَذِبًا أَوْ كَذَّبَ بِٱلْحَقِّ لَمَّا جَآءَهُۥٓ ۚ أَلَيْسَ فِى جَهَنَّمَ مَثْوًى لِّلْكَـٰفِرِينَ
    arabicPlain: ومن أظلم ممن افترى على الله كذبا أو كذب بالحق لما جاءه ۚ أليس في جهنم مثوى للكافرين
    surahName: Al-Ankaboot
    juz: 21
    manzil: 5
    ruku: 348
    page: 404
  relations:
