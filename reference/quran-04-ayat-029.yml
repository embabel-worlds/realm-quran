  data:
    ref: '29:24'
    scripture: quran
    name: Quran 29:24
    chapter: 29
    verse: 24
    ordinal: 3364
    text: 'But the answer of his folk was only that they said: "Kill him" or "Burn him." Then Allah saved him from the Fire. Lo! herein verily are portents for folk who believe.'
    translation: Pickthall
    original: فَمَا كَانَ جَوَابَ قَوْمِهِۦٓ إِلَّآ أَن قَالُوا۟ ٱقْتُلُوهُ أَوْ حَرِّقُوهُ فَأَنجَىٰهُ ٱللَّهُ مِنَ ٱلنَّارِ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍ لِّقَوْمٍ يُؤْمِنُونَ
    arabicPlain: فما كان جواب قومه إلا أن قالوا اقتلوه أو حرقوه فأنجاه الله من النار ۚ إن في ذلك لآيات لقوم يؤمنون
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 344
