  data:
    ref: '29:52'
    scripture: quran
    name: Quran 29:52
    chapter: 29
    verse: 52
    ordinal: 3392
    text: 'Say (unto them, O Muhammad): Allah sufficeth for witness between me and you. He knoweth whatsoever is in the heavens and the earth. And those who believe in vanity and disbelieve in Allah, they it is who are the losers.'
    translation: Pickthall
    original: قُلْ كَفَىٰ بِٱللَّهِ بَيْنِى وَبَيْنَكُمْ شَهِيدًا ۖ يَعْلَمُ مَا فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۗ وَٱلَّذِينَ ءَامَنُوا۟ بِٱلْبَـٰطِلِ وَكَفَرُوا۟ بِٱللَّهِ أُو۟لَـٰٓئِكَ هُمُ ٱلْخَـٰسِرُونَ
    arabicPlain: قل كفى بالله بيني وبينكم شهيدا ۖ يعلم ما في السماوات والأرض ۗ والذين آمنوا بالباطل وكفروا بالله أولئك هم الخاسرون
    surahName: Al-Ankaboot
    juz: 21
    manzil: 5
    ruku: 347
    page: 402
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '29'
  - predicate: IN_PORTION
    to:
