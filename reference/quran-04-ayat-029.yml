  data:
    ref: '29:8'
    scripture: quran
    name: Quran 29:8
    chapter: 29
    verse: 8
    ordinal: 3348
    text: We have enjoined on man kindness to parents; but if they strive to make thee join with Me that of which thou hast no knowledge, then obey them not. Unto Me is your return and I shall tell you what ye used to do.
    translation: Pickthall
    original: وَوَصَّيْنَا ٱلْإِنسَـٰنَ بِوَٰلِدَيْهِ حُسْنًا ۖ وَإِن جَـٰهَدَاكَ لِتُشْرِكَ بِى مَا لَيْسَ لَكَ بِهِۦ عِلْمٌ فَلَا تُطِعْهُمَآ ۚ إِلَىَّ مَرْجِعُكُمْ فَأُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَ
    arabicPlain: ووصينا الإنسان بوالديه حسنا ۖ وإن جاهداك لتشرك بي ما ليس لك به علم فلا تطعهما ۚ إلي مرجعكم فأنبئكم بما كنتم تعملون
