    scripture: quran
    name: Quran 29:19
    chapter: 29
    verse: 19
    ordinal: 3359
    text: See they not how Allah produceth creation, then reproduceth it? Lo! for Allah that is easy.
    translation: Pickthall
    original: أَوَلَمْ يَرَوْا۟ كَيْفَ يُبْدِئُ ٱللَّهُ ٱلْخَلْقَ ثُمَّ يُعِيدُهُۥٓ ۚ إِنَّ ذَٰلِكَ عَلَى ٱللَّهِ يَسِيرٌ
    arabicPlain: أولم يروا كيف يبدئ الله الخلق ثم يعيده ۚ إن ذلك على الله يسير
