  data:
    ref: 29:65
    scripture: quran
    name: Quran 29:65
    chapter: 29
    verse: 65
    ordinal: 3405
    text: And when they mount upon the ships they pray to Allah, making their faith pure for Him only, but when He bringeth them safe to land, behold! they ascribe partners (unto Him),
    translation: Pickthall
    original: فَإِذَا رَكِبُوا۟ فِى ٱلْفُلْكِ دَعَوُا۟ ٱللَّهَ مُخْلِصِينَ لَهُ ٱلدِّينَ فَلَمَّا نَجَّىٰهُمْ إِلَى ٱلْبَرِّ إِذَا هُمْ يُشْرِكُونَ
    arabicPlain: فإذا ركبوا في الفلك دعوا الله مخلصين له الدين فلما نجاهم إلى البر إذا هم يشركون
    surahName: Al-Ankaboot
    juz: 21
    manzil: 5
    ruku: 348
    page: 404
