  data:
    ref: '29:45'
    scripture: quran
    name: Quran 29:45
    chapter: 29
    verse: 45
    ordinal: 3385
    text: Recite that which hath been inspired in thee of the Scripture, and establish worship. Lo! worship preserveth from lewdness and iniquity, but verily remembrance of Allah is more important. And Allah knoweth what ye do.
    translation: Pickthall
    original: ٱتْلُ مَآ أُوحِىَ إِلَيْكَ مِنَ ٱلْكِتَـٰبِ وَأَقِمِ ٱلصَّلَوٰةَ ۖ إِنَّ ٱلصَّلَوٰةَ تَنْهَىٰ عَنِ ٱلْفَحْشَآءِ وَٱلْمُنكَرِ ۗ وَلَذِكْرُ ٱللَّهِ أَكْبَرُ ۗ وَٱللَّهُ يَعْلَمُ مَا تَصْنَعُونَ
    arabicPlain: اتل ما أوحي إليك من الكتاب وأقم الصلاة ۖ إن الصلاة تنهى عن الفحشاء والمنكر ۗ ولذكر الله أكبر ۗ والله يعلم ما تصنعون
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 346
    page: 401
