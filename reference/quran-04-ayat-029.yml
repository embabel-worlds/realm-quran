  data:
    ref: '29:32'
    scripture: quran
    name: Quran 29:32
    chapter: 29
    verse: 32
    ordinal: 3372
    text: 'He said: Lo! Lot is there. They said: We are best aware of who is there. We are to deliver him and his household, all save his wife, who is of those who stay behind.'
    translation: Pickthall
    original: قَالَ إِنَّ فِيهَا لُوطًا ۚ قَالُوا۟ نَحْنُ أَعْلَمُ بِمَن فِيهَا ۖ لَنُنَجِّيَنَّهُۥ وَأَهْلَهُۥٓ إِلَّا ٱمْرَأَتَهُۥ كَانَتْ مِنَ ٱلْغَـٰبِرِينَ
    arabicPlain: قال إن فيها لوطا ۚ قالوا نحن أعلم بمن فيها ۖ لننجينه وأهله إلا امرأته كانت من الغابرين
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 345
    page: 400
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '29'
  - predicate: IN_PORTION
    to:
      type: Juz
