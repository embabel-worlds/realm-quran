  data:
    ref: '29:27'
    scripture: quran
    name: Quran 29:27
    chapter: 29
    verse: 27
    ordinal: 3367
    text: And We bestowed on him Isaac and Jacob, and We established the prophethood and the Scripture among his seed, and We gave him his reward in the world, and lo! in the Hereafter he verily is among the righteous.
    translation: Pickthall
    original: وَوَهَبْنَا لَهُۥٓ إِسْحَـٰقَ وَيَعْقُوبَ وَجَعَلْنَا فِى ذُرِّيَّتِهِ ٱلنُّبُوَّةَ وَٱلْكِتَـٰبَ وَءَاتَيْنَـٰهُ أَجْرَهُۥ فِى ٱلدُّنْيَا ۖ وَإِنَّهُۥ فِى ٱلْـَٔاخِرَةِ لَمِنَ ٱلصَّـٰلِحِينَ
    arabicPlain: ووهبنا له إسحاق ويعقوب وجعلنا في ذريته النبوة والكتاب وآتيناه أجره في الدنيا ۖ وإنه في الآخرة لمن الصالحين
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 344
    page: 399
