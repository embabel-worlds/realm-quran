  data:
    ref: '29:44'
    scripture: quran
    name: Quran 29:44
    chapter: 29
    verse: 44
    ordinal: 3384
    text: Allah created the heavens and the earth with truth. Lo! therein is indeed a portent for believers.
    translation: Pickthall
    original: خَلَقَ ٱللَّهُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ بِٱلْحَقِّ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَةً لِّلْمُؤْمِنِينَ
    arabicPlain: خلق الله السماوات والأرض بالحق ۚ إن في ذلك لآية للمؤمنين
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 345
