    name: Quran 29:56
    chapter: 29
    verse: 56
    ordinal: 3396
    text: O my bondmen who believe! Lo! My earth is spacious. Therefor serve Me only.
    translation: Pickthall
    original: يَـٰعِبَادِىَ ٱلَّذِينَ ءَامَنُوٓا۟ إِنَّ أَرْضِى وَٰسِعَةٌ فَإِيَّـٰىَ فَٱعْبُدُونِ
    arabicPlain: يا عبادي الذين آمنوا إن أرضي واسعة فإياي فاعبدون
