    scripture: quran
    name: Quran 29:55
    chapter: 29
    verse: 55
    ordinal: 3395
    text: 'On the day when the doom will overwhelm them from above them and from underneath their feet, and He will say: Taste what ye used to do!'
    translation: Pickthall
    original: يَوْمَ يَغْشَىٰهُمُ ٱلْعَذَابُ مِن فَوْقِهِمْ وَمِن تَحْتِ أَرْجُلِهِمْ وَيَقُولُ ذُوقُوا۟ مَا كُنتُمْ تَعْمَلُونَ
    arabicPlain: يوم يغشاهم العذاب من فوقهم ومن تحت أرجلهم ويقول ذوقوا ما كنتم تعملون
