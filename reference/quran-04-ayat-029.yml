- type: Ayah
  data:
    ref: '29:51'
    scripture: quran
    name: Quran 29:51
    chapter: 29
    verse: 51
    ordinal: 3391
    text: Is it not enough for them that We have sent down unto thee the Scripture which is read unto them? Lo! herein verily is mercy, and a reminder for folk who believe.
    translation: Pickthall
    original: أَوَلَمْ يَكْفِهِمْ أَنَّآ أَنزَلْنَا عَلَيْكَ ٱلْكِتَـٰبَ يُتْلَىٰ عَلَيْهِمْ ۚ إِنَّ فِى ذَٰلِكَ لَرَحْمَةً وَذِكْرَىٰ لِقَوْمٍ يُؤْمِنُونَ
    arabicPlain: أولم يكفهم أنا أنزلنا عليك الكتاب يتلى عليهم ۚ إن في ذلك لرحمة وذكرى لقوم يؤمنون
    surahName: Al-Ankaboot
    juz: 21
    manzil: 5
    ruku: 346
    page: 402
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '29'
  - predicate: IN_PORTION
    to:
