  data:
    ref: '29:42'
    scripture: quran
    name: Quran 29:42
    chapter: 29
    verse: 42
    ordinal: 3382
    text: Lo! Allah knoweth what thing they invoke instead of Him. He is the Mighty, the Wise.
    translation: Pickthall
    original: إِنَّ ٱللَّهَ يَعْلَمُ مَا يَدْعُونَ مِن دُونِهِۦ مِن شَىْءٍ ۚ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ
    arabicPlain: إن الله يعلم ما يدعون من دونه من شيء ۚ وهو العزيز الحكيم
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 345
