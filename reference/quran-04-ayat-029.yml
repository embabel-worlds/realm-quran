  data:
    ref: 29:60
    scripture: quran
    name: Quran 29:60
    chapter: 29
    verse: 60
    ordinal: 3400
    text: And how many an animal there is that beareth not its own provision! Allah provideth for it and for you. He is the Hearer, the Knower.
    translation: Pickthall
    original: وَكَأَيِّن مِّن دَآبَّةٍ لَّا تَحْمِلُ رِزْقَهَا ٱللَّهُ يَرْزُقُهَا وَإِيَّاكُمْ ۚ وَهُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ
    arabicPlain: وكأين من دابة لا تحمل رزقها الله يرزقها وإياكم ۚ وهو السميع العليم
    surahName: Al-Ankaboot
    juz: 21
