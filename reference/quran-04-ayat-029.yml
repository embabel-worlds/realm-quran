    verse: 11
    ordinal: 3351
    text: Verily Allah knoweth those who believe, and verily He knoweth the hypocrites.
    translation: Pickthall
    original: وَلَيَعْلَمَنَّ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ وَلَيَعْلَمَنَّ ٱلْمُنَـٰفِقِينَ
