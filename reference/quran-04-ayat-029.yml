    scripture: quran
    name: Quran 29:37
    chapter: 29
    verse: 37
    ordinal: 3377
    text: But they denied him, and the dreadful earthquake took them, and morning found them prostrate in their dwelling place.
    translation: Pickthall
    original: فَكَذَّبُوهُ فَأَخَذَتْهُمُ ٱلرَّجْفَةُ فَأَصْبَحُوا۟ فِى دَارِهِمْ جَـٰثِمِينَ
    arabicPlain: فكذبوه فأخذتهم الرجفة فأصبحوا في دارهم جاثمين
    surahName: Al-Ankaboot
    juz: 20
