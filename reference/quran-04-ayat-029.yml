  data:
    ref: '29:41'
    scripture: quran
    name: Quran 29:41
    chapter: 29
    verse: 41
    ordinal: 3381
    text: The likeness of those who choose other patrons than Allah is as the likeness of the spider when she taketh unto herself a house, and lo! the frailest of all houses is the spider's house, if they but knew.
    translation: Pickthall
    original: مَثَلُ ٱلَّذِينَ ٱتَّخَذُوا۟ مِن دُونِ ٱللَّهِ أَوْلِيَآءَ كَمَثَلِ ٱلْعَنكَبُوتِ ٱتَّخَذَتْ بَيْتًا ۖ وَإِنَّ أَوْهَنَ ٱلْبُيُوتِ لَبَيْتُ ٱلْعَنكَبُوتِ ۖ لَوْ كَانُوا۟ يَعْلَمُونَ
    arabicPlain: مثل الذين اتخذوا من دون الله أولياء كمثل العنكبوت اتخذت بيتا ۖ وإن أوهن البيوت لبيت العنكبوت ۖ لو كانوا يعلمون
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 345
    page: 401
