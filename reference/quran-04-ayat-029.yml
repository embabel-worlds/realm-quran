  data:
    ref: '29:18'
    scripture: quran
    name: Quran 29:18
    chapter: 29
    verse: 18
    ordinal: 3358
    text: But if ye deny, then nations have denied before you. The messenger is only to convey (the message) plainly.
    translation: Pickthall
    original: وَإِن تُكَذِّبُوا۟ فَقَدْ كَذَّبَ أُمَمٌ مِّن قَبْلِكُمْ ۖ وَمَا عَلَى ٱلرَّسُولِ إِلَّا ٱلْبَلَـٰغُ ٱلْمُبِينُ
    arabicPlain: وإن تكذبوا فقد كذب أمم من قبلكم ۖ وما على الرسول إلا البلاغ المبين
