  data:
    ref: '29:43'
    scripture: quran
    name: Quran 29:43
    chapter: 29
    verse: 43
    ordinal: 3383
    text: As for these similitudes, We coin them for mankind, but none will grasp their meaning save the wise.
    translation: Pickthall
    original: وَتِلْكَ ٱلْأَمْثَـٰلُ نَضْرِبُهَا لِلنَّاسِ ۖ وَمَا يَعْقِلُهَآ إِلَّا ٱلْعَـٰلِمُونَ
    arabicPlain: وتلك الأمثال نضربها للناس ۖ وما يعقلها إلا العالمون
    surahName: Al-Ankaboot
    juz: 20
