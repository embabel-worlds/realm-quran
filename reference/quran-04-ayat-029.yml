- type: Ayah
  data:
    ref: '29:50'
    scripture: quran
    name: Quran 29:50
    chapter: 29
    verse: 50
    ordinal: 3390
    text: 'And they say: Why are not portents sent down upon him from his Lord? Say: Portents are with Allah only, and I am but a plain warner.'
    translation: Pickthall
    original: وَقَالُوا۟ لَوْلَآ أُنزِلَ عَلَيْهِ ءَايَـٰتٌ مِّن رَّبِّهِۦ ۖ قُلْ إِنَّمَا ٱلْـَٔايَـٰتُ عِندَ ٱللَّهِ وَإِنَّمَآ أَنَا۠ نَذِيرٌ مُّبِينٌ
    arabicPlain: وقالوا لولا أنزل عليه آيات من ربه ۖ قل إنما الآيات عند الله وإنما أنا نذير مبين
    surahName: Al-Ankaboot
    juz: 21
    manzil: 5
    ruku: 346
    page: 402
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '29'
  - predicate: IN_PORTION
    to:
