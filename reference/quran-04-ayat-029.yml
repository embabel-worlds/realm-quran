  data:
    ref: '29:25'
    scripture: quran
    name: Quran 29:25
    chapter: 29
    verse: 25
    ordinal: 3365
    text: 'He said: Ye have chosen only idols instead of Allah. The love between you is only in the life of the world. Then on the Day of Resurrection ye will deny each other and curse each other, and your abode will be the Fire, and ye will have no helpers.'
    translation: Pickthall
    original: وَقَالَ إِنَّمَا ٱتَّخَذْتُم مِّن دُونِ ٱللَّهِ أَوْثَـٰنًا مَّوَدَّةَ بَيْنِكُمْ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا ۖ ثُمَّ يَوْمَ ٱلْقِيَـٰمَةِ يَكْفُرُ بَعْضُكُم بِبَعْضٍ وَيَلْعَنُ بَعْضُكُم بَعْضًا وَمَأْوَىٰكُمُ ٱلنَّارُ وَمَا لَكُم مِّن نَّـٰصِرِينَ
    arabicPlain: وقال إنما اتخذتم من دون الله أوثانا مودة بينكم في الحياة الدنيا ۖ ثم يوم القيامة يكفر بعضكم ببعض ويلعن بعضكم بعضا ومأواكم النار وما لكم من ناصرين
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 344
