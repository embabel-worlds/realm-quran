  data:
    ref: '29:33'
    scripture: quran
    name: Quran 29:33
    chapter: 29
    verse: 33
    ordinal: 3373
    text: 'And when Our messengers came unto Lot, he was troubled upon their account, for he could not protect them; but they said: Fear not, nor grieve! Lo! we are to deliver thee and thy household, (all) save thy wife, who is of those who stay behind.'
    translation: Pickthall
    original: وَلَمَّآ أَن جَآءَتْ رُسُلُنَا لُوطًا سِىٓءَ بِهِمْ وَضَاقَ بِهِمْ ذَرْعًا وَقَالُوا۟ لَا تَخَفْ وَلَا تَحْزَنْ ۖ إِنَّا مُنَجُّوكَ وَأَهْلَكَ إِلَّا ٱمْرَأَتَكَ كَانَتْ مِنَ ٱلْغَـٰبِرِينَ
    arabicPlain: ولما أن جاءت رسلنا لوطا سيء بهم وضاق بهم ذرعا وقالوا لا تخف ولا تحزن ۖ إنا منجوك وأهلك إلا امرأتك كانت من الغابرين
    surahName: Al-Ankaboot
    juz: 20
    manzil: 5
    ruku: 345
    page: 400
