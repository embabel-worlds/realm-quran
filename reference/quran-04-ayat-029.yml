    scripture: quran
    name: Quran 29:7
    chapter: 29
    verse: 7
    ordinal: 3347
    text: And as for those who believe and do good works, We shall remit from them their evil deeds and shall repay them the best that they did.
    translation: Pickthall
    original: وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ لَنُكَفِّرَنَّ عَنْهُمْ سَيِّـَٔاتِهِمْ وَلَنَجْزِيَنَّهُمْ أَحْسَنَ ٱلَّذِى كَانُوا۟ يَعْمَلُونَ
    arabicPlain: والذين آمنوا وعملوا الصالحات لنكفرن عنهم سيئاتهم ولنجزينهم أحسن الذي كانوا يعملون
