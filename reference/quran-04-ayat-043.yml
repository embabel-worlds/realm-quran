- type: Ayah
  data:
    ref: '43:22'
    scripture: quran
    name: Quran 43:22
    chapter: 43
    verse: 22
    ordinal: 4347
    text: 'Nay, for they say only: Lo! we found our fathers following a religion, and we are guided by their footprints.'
    translation: Pickthall
    original: بَلْ قَالُوٓا۟ إِنَّا وَجَدْنَآ ءَابَآءَنَا عَلَىٰٓ أُمَّةٍ وَإِنَّا عَلَىٰٓ ءَاثَـٰرِهِم مُّهْتَدُونَ
