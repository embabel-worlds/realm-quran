    translation: Pickthall
    original: وَجَعَلُوا۟ ٱلْمَلَـٰٓئِكَةَ ٱلَّذِينَ هُمْ عِبَـٰدُ ٱلرَّحْمَـٰنِ إِنَـٰثًا ۚ أَشَهِدُوا۟ خَلْقَهُمْ ۚ سَتُكْتَبُ شَهَـٰدَتُهُمْ وَيُسْـَٔلُونَ
    arabicPlain: وجعلوا الملائكة الذين هم عباد الرحمن إناثا ۚ أشهدوا خلقهم ۚ ستكتب شهادتهم ويسألون
    surahName: Az-Zukhruf
    juz: 25
    manzil: 6
    ruku: 425
    page: 490
