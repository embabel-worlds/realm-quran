    scripture: quran
    name: Quran 43:42
    chapter: 43
    verse: 42
    ordinal: 4367
    text: Or (if) We show thee that wherewith We threaten them; for lo! We have complete command of them.
    translation: Pickthall
    original: أَوْ نُرِيَنَّكَ ٱلَّذِى وَعَدْنَـٰهُمْ فَإِنَّا عَلَيْهِم مُّقْتَدِرُونَ
    arabicPlain: أو نرينك الذي وعدناهم فإنا عليهم مقتدرون
