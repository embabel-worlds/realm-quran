  data:
    ref: '43:43'
    scripture: quran
    name: Quran 43:43
    chapter: 43
    verse: 43
    ordinal: 4368
    text: So hold thou fast to that which is inspired in thee. Lo! thou art on a right path.
    translation: Pickthall
    original: فَٱسْتَمْسِكْ بِٱلَّذِىٓ أُوحِىَ إِلَيْكَ ۖ إِنَّكَ عَلَىٰ صِرَٰطٍ مُّسْتَقِيمٍ
