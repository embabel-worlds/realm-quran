    translation: Pickthall
    original: أَمْ ءَاتَيْنَـٰهُمْ كِتَـٰبًا مِّن قَبْلِهِۦ فَهُم بِهِۦ مُسْتَمْسِكُونَ
    arabicPlain: أم آتيناهم كتابا من قبله فهم به مستمسكون
    surahName: Az-Zukhruf
    juz: 25
    manzil: 6
    ruku: 425
    page: 490
  relations:
