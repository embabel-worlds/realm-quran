    translation: Pickthall
    original: وَمَن يَعْشُ عَن ذِكْرِ ٱلرَّحْمَـٰنِ نُقَيِّضْ لَهُۥ شَيْطَـٰنًا فَهُوَ لَهُۥ قَرِينٌ
    arabicPlain: ومن يعش عن ذكر الرحمن نقيض له شيطانا فهو له قرين
    surahName: Az-Zukhruf
    juz: 25
