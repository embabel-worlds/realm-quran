    translation: Pickthall
    original: وَلَن يَنفَعَكُمُ ٱلْيَوْمَ إِذ ظَّلَمْتُمْ أَنَّكُمْ فِى ٱلْعَذَابِ مُشْتَرِكُونَ
    arabicPlain: ولن ينفعكم اليوم إذ ظلمتم أنكم في العذاب مشتركون
    surahName: Az-Zukhruf
