    name: Quran 43:38
    chapter: 43
    verse: 38
    ordinal: 4363
    text: 'Till, when he cometh unto Us, he saith (unto his comrade): Ah, would that between me and thee there were the distance of the two horizons - an evil comrade!'
    translation: Pickthall
    original: حَتَّىٰٓ إِذَا جَآءَنَا قَالَ يَـٰلَيْتَ بَيْنِى وَبَيْنَكَ بُعْدَ ٱلْمَشْرِقَيْنِ فَبِئْسَ ٱلْقَرِينُ
    arabicPlain: حتى إذا جاءنا قال يا ليت بيني وبينك بعد المشرقين فبئس القرين
    surahName: Az-Zukhruf
    juz: 25
    manzil: 6
