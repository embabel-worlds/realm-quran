- type: Ayah
  data:
    ref: '43:13'
    scripture: quran
    name: Quran 43:13
    chapter: 43
    verse: 13
    ordinal: 4338
    text: 'That ye may mount upon their backs, and may remember your Lord''s favour when ye mount thereon, and may say: Glorified be He Who hath subdued these unto us, and we were not capable (of subduing them);'
    translation: Pickthall
    original: لِتَسْتَوُۥا۟ عَلَىٰ ظُهُورِهِۦ ثُمَّ تَذْكُرُوا۟ نِعْمَةَ رَبِّكُمْ إِذَا ٱسْتَوَيْتُمْ عَلَيْهِ وَتَقُولُوا۟ سُبْحَـٰنَ ٱلَّذِى سَخَّرَ لَنَا هَـٰذَا وَمَا كُنَّا لَهُۥ مُقْرِنِينَ
    arabicPlain: لتستووا على ظهوره ثم تذكروا نعمة ربكم إذا استويتم عليه وتقولوا سبحان الذي سخر لنا هذا وما كنا له مقرنين
    surahName: Az-Zukhruf
