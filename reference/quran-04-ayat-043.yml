    translation: Pickthall
    original: أَفَأَنتَ تُسْمِعُ ٱلصُّمَّ أَوْ تَهْدِى ٱلْعُمْىَ وَمَن كَانَ فِى ضَلَـٰلٍ مُّبِينٍ
    arabicPlain: أفأنت تسمع الصم أو تهدي العمي ومن كان في ضلال مبين
