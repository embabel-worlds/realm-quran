    scripture: quran
    name: Quran 43:31
    chapter: 43
    verse: 31
    ordinal: 4356
    text: 'And they say: If only this Qur''an had been revealed to some great man of the two towns?'
    translation: Pickthall
    original: وَقَالُوا۟ لَوْلَا نُزِّلَ هَـٰذَا ٱلْقُرْءَانُ عَلَىٰ رَجُلٍ مِّنَ ٱلْقَرْيَتَيْنِ عَظِيمٍ
    arabicPlain: وقالوا لولا نزل هذا القرآن على رجل من القريتين عظيم
