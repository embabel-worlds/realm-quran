  data:
    ref: '43:41'
    scripture: quran
    name: Quran 43:41
    chapter: 43
    verse: 41
    ordinal: 4366
    text: And if We take thee away, We surely shall take vengeance on them,
    translation: Pickthall
    original: فَإِمَّا نَذْهَبَنَّ بِكَ فَإِنَّا مِنْهُم مُّنتَقِمُونَ
    arabicPlain: فإما نذهبن بك فإنا منهم منتقمون
    surahName: Az-Zukhruf
