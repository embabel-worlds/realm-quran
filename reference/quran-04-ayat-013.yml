  data:
    ref: '13:23'
    scripture: quran
    name: Quran 13:23
    chapter: 13
    verse: 23
    ordinal: 1730
    text: Gardens of Eden which they enter, along with all who do right of their fathers and their helpmeets and their seed. The angels enter unto them from every gate,
    translation: Pickthall
    original: جَنَّـٰتُ عَدْنٍ يَدْخُلُونَهَا وَمَن صَلَحَ مِنْ ءَابَآئِهِمْ وَأَزْوَٰجِهِمْ وَذُرِّيَّـٰتِهِمْ ۖ وَٱلْمَلَـٰٓئِكَةُ يَدْخُلُونَ عَلَيْهِم مِّن كُلِّ بَابٍ
    arabicPlain: جنات عدن يدخلونها ومن صلح من آبائهم وأزواجهم وذرياتهم ۖ والملائكة يدخلون عليهم من كل باب
