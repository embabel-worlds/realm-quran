  data:
    ref: '13:33'
    scripture: quran
    name: Quran 13:33
    chapter: 13
    verse: 33
    ordinal: 1740
    text: 'Is He Who is aware of the deserts of every soul (as he who is aware of nothing)? Yet they ascribe unto Allah partners. Say: Name them. Is it that ye would inform Him of something which He knoweth not in the earth? Or is it but a way of speaking? Nay but their contrivance is made seeming fair for those who disbelieve and they are kept from the right road. He whom Allah sendeth astray, for him there is no guide.'
    translation: Pickthall
    original: أَفَمَنْ هُوَ قَآئِمٌ عَلَىٰ كُلِّ نَفْسٍۭ بِمَا كَسَبَتْ ۗ وَجَعَلُوا۟ لِلَّهِ شُرَكَآءَ قُلْ سَمُّوهُمْ ۚ أَمْ تُنَبِّـُٔونَهُۥ بِمَا لَا يَعْلَمُ فِى ٱلْأَرْضِ أَم بِظَـٰهِرٍ مِّنَ ٱلْقَوْلِ ۗ بَلْ زُيِّنَ لِلَّذِينَ كَفَرُوا۟ مَكْرُهُمْ وَصُدُّوا۟ عَنِ ٱلسَّبِيلِ ۗ وَمَن يُضْلِلِ ٱللَّهُ فَمَا لَهُۥ مِنْ هَادٍ
    arabicPlain: أفمن هو قائم على كل نفس بما كسبت ۗ وجعلوا لله شركاء قل سموهم ۚ أم تنبئونه بما لا يعلم في الأرض أم بظاهر من القول ۗ بل زين للذين كفروا مكرهم وصدوا عن السبيل ۗ ومن يضلل الله فما له من هاد
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 209
    page: 253
