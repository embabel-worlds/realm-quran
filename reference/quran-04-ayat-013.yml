- type: Ayah
  data:
    ref: '13:7'
    scripture: quran
    name: Quran 13:7
    chapter: 13
    verse: 7
    ordinal: 1714
    text: 'Those who disbelieve say: If only some portent were sent down upon him from his Lord! Thou art a warner only, and for every folk a guide.'
    translation: Pickthall
    original: وَيَقُولُ ٱلَّذِينَ كَفَرُوا۟ لَوْلَآ أُنزِلَ عَلَيْهِ ءَايَةٌ مِّن رَّبِّهِۦٓ ۗ إِنَّمَآ أَنتَ مُنذِرٌ ۖ وَلِكُلِّ قَوْمٍ هَادٍ
    arabicPlain: ويقول الذين كفروا لولا أنزل عليه آية من ربه ۗ إنما أنت منذر ۖ ولكل قوم هاد
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 205
    page: 250
