  data:
    ref: '13:41'
    scripture: quran
    name: Quran 13:41
    chapter: 13
    verse: 41
    ordinal: 1748
    text: See they not how we aim to the land, reducing it of its outlying parts? (When) Allah doometh there is none that can postpone His doom, and He is swift at reckoning.
    translation: Pickthall
    original: أَوَلَمْ يَرَوْا۟ أَنَّا نَأْتِى ٱلْأَرْضَ نَنقُصُهَا مِنْ أَطْرَافِهَا ۚ وَٱللَّهُ يَحْكُمُ لَا مُعَقِّبَ لِحُكْمِهِۦ ۚ وَهُوَ سَرِيعُ ٱلْحِسَابِ
    arabicPlain: أولم يروا أنا نأتي الأرض ننقصها من أطرافها ۚ والله يحكم لا معقب لحكمه ۚ وهو سريع الحساب
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 210
    page: 254
