  data:
    ref: '13:40'
    scripture: quran
    name: Quran 13:40
    chapter: 13
    verse: 40
    ordinal: 1747
    text: Whether We let thee see something of that which We have promised them, or make thee die (before its happening), thine is but conveyance (of the message). Ours the reckoning.
    translation: Pickthall
    original: وَإِن مَّا نُرِيَنَّكَ بَعْضَ ٱلَّذِى نَعِدُهُمْ أَوْ نَتَوَفَّيَنَّكَ فَإِنَّمَا عَلَيْكَ ٱلْبَلَـٰغُ وَعَلَيْنَا ٱلْحِسَابُ
    arabicPlain: وإن ما نرينك بعض الذي نعدهم أو نتوفينك فإنما عليك البلاغ وعلينا الحساب
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 210
