  data:
    ref: '13:42'
    scripture: quran
    name: Quran 13:42
    chapter: 13
    verse: 42
    ordinal: 1749
    text: Those who were before them plotted; but all plotting is Allah's. He knoweth that which each soul earneth. The disbelievers will come to know for whom will be the sequel of the (heavenly) Home.
    translation: Pickthall
    original: وَقَدْ مَكَرَ ٱلَّذِينَ مِن قَبْلِهِمْ فَلِلَّهِ ٱلْمَكْرُ جَمِيعًا ۖ يَعْلَمُ مَا تَكْسِبُ كُلُّ نَفْسٍ ۗ وَسَيَعْلَمُ ٱلْكُفَّـٰرُ لِمَنْ عُقْبَى ٱلدَّارِ
    arabicPlain: وقد مكر الذين من قبلهم فلله المكر جميعا ۖ يعلم ما تكسب كل نفس ۗ وسيعلم الكفار لمن عقبى الدار
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 210
    page: 254
