- type: Ayah
  data:
    ref: '13:3'
    scripture: quran
    name: Quran 13:3
    chapter: 13
    verse: 3
    ordinal: 1710
    text: And He it is Who spread out the earth and placed therein firm hills and flowing streams, and of all fruits He placed therein two spouses (male and female). He covereth the night with the day. Lo! herein verily are portents for people who take thought.
    translation: Pickthall
    original: وَهُوَ ٱلَّذِى مَدَّ ٱلْأَرْضَ وَجَعَلَ فِيهَا رَوَٰسِىَ وَأَنْهَـٰرًا ۖ وَمِن كُلِّ ٱلثَّمَرَٰتِ جَعَلَ فِيهَا زَوْجَيْنِ ٱثْنَيْنِ ۖ يُغْشِى ٱلَّيْلَ ٱلنَّهَارَ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍ لِّقَوْمٍ يَتَفَكَّرُونَ
    arabicPlain: وهو الذي مد الأرض وجعل فيها رواسي وأنهارا ۖ ومن كل الثمرات جعل فيها زوجين اثنين ۖ يغشي الليل النهار ۚ إن في ذلك لآيات لقوم يتفكرون
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 205
    page: 249
