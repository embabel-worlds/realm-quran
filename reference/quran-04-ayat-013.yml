  data:
    ref: '13:39'
    scripture: quran
    name: Quran 13:39
    chapter: 13
    verse: 39
    ordinal: 1746
    text: Allah effaceth what He will, and establisheth (what He will), and with Him is the source of ordinance.
    translation: Pickthall
    original: يَمْحُوا۟ ٱللَّهُ مَا يَشَآءُ وَيُثْبِتُ ۖ وَعِندَهُۥٓ أُمُّ ٱلْكِتَـٰبِ
    arabicPlain: يمحو الله ما يشاء ويثبت ۖ وعنده أم الكتاب
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 210
