- type: Ayah
  data:
    ref: '13:14'
    scripture: quran
    name: Quran 13:14
    chapter: 13
    verse: 14
    ordinal: 1721
    text: Unto Him is the real prayer. Those unto whom they pray beside Allah respond to them not at all, save as (is the response to) one who stretcheth forth his hands toward water (asking) that it may come unto his mouth, and it will never reach it. The prayer of disbelievers goeth (far) astray.
    translation: Pickthall
    original: لَهُۥ دَعْوَةُ ٱلْحَقِّ ۖ وَٱلَّذِينَ يَدْعُونَ مِن دُونِهِۦ لَا يَسْتَجِيبُونَ لَهُم بِشَىْءٍ إِلَّا كَبَـٰسِطِ كَفَّيْهِ إِلَى ٱلْمَآءِ لِيَبْلُغَ فَاهُ وَمَا هُوَ بِبَـٰلِغِهِۦ ۚ وَمَا دُعَآءُ ٱلْكَـٰفِرِينَ إِلَّا فِى ضَلَـٰلٍ
    arabicPlain: له دعوة الحق ۖ والذين يدعون من دونه لا يستجيبون لهم بشيء إلا كباسط كفيه إلى الماء ليبلغ فاه وما هو ببالغه ۚ وما دعاء الكافرين إلا في ضلال
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 206
    page: 251
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '13'
