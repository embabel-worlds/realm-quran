  data:
    ref: '13:38'
    scripture: quran
    name: Quran 13:38
    chapter: 13
    verse: 38
    ordinal: 1745
    text: And verily We sent messengers (to mankind) before thee, and We appointed for them wives and offspring, and it was not (given) to any messenger that he should bring a portent save by Allah's leave. For everything there is a time prescribed.
    translation: Pickthall
    original: وَلَقَدْ أَرْسَلْنَا رُسُلًا مِّن قَبْلِكَ وَجَعَلْنَا لَهُمْ أَزْوَٰجًا وَذُرِّيَّةً ۚ وَمَا كَانَ لِرَسُولٍ أَن يَأْتِىَ بِـَٔايَةٍ إِلَّا بِإِذْنِ ٱللَّهِ ۗ لِكُلِّ أَجَلٍ كِتَابٌ
    arabicPlain: ولقد أرسلنا رسلا من قبلك وجعلنا لهم أزواجا وذرية ۚ وما كان لرسول أن يأتي بآية إلا بإذن الله ۗ لكل أجل كتاب
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 210
    page: 254
