  data:
    ref: '13:12'
    scripture: quran
    name: Quran 13:12
    chapter: 13
    verse: 12
    ordinal: 1719
    text: He it is Who showeth you the lightning, a fear and a hope, and raiseth the heavy clouds.
    translation: Pickthall
    original: هُوَ ٱلَّذِى يُرِيكُمُ ٱلْبَرْقَ خَوْفًا وَطَمَعًا وَيُنشِئُ ٱلسَّحَابَ ٱلثِّقَالَ
    arabicPlain: هو الذي يريكم البرق خوفا وطمعا وينشئ السحاب الثقال
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 206
    page: 250
