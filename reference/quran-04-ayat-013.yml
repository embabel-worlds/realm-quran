  data:
    ref: '13:8'
    scripture: quran
    name: Quran 13:8
    chapter: 13
    verse: 8
    ordinal: 1715
    text: Allah knoweth that which every female beareth and that which the wombs absorb and that which they grow. And everything with Him is measured.
    translation: Pickthall
    original: ٱللَّهُ يَعْلَمُ مَا تَحْمِلُ كُلُّ أُنثَىٰ وَمَا تَغِيضُ ٱلْأَرْحَامُ وَمَا تَزْدَادُ ۖ وَكُلُّ شَىْءٍ عِندَهُۥ بِمِقْدَارٍ
    arabicPlain: الله يعلم ما تحمل كل أنثى وما تغيض الأرحام وما تزداد ۖ وكل شيء عنده بمقدار
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 206
