  data:
    ref: '13:34'
    scripture: quran
    name: Quran 13:34
    chapter: 13
    verse: 34
    ordinal: 1741
    text: For them is torment in the life of the world, and verily the doom of the Hereafter is more painful, and they have no defender from Allah.
    translation: Pickthall
    original: لَّهُمْ عَذَابٌ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا ۖ وَلَعَذَابُ ٱلْـَٔاخِرَةِ أَشَقُّ ۖ وَمَا لَهُم مِّنَ ٱللَّهِ مِن وَاقٍ
    arabicPlain: لهم عذاب في الحياة الدنيا ۖ ولعذاب الآخرة أشق ۖ وما لهم من الله من واق
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 209
    page: 253
