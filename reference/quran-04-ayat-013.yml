  data:
    ref: '13:37'
    scripture: quran
    name: Quran 13:37
    chapter: 13
    verse: 37
    ordinal: 1744
    text: Thus have We revealed it, a decisive utterance in Arabic; and if thou shouldst follow their desires after that which hath come unto thee of knowledge, then truly wouldst thou have from Allah no protecting friend nor defender.
    translation: Pickthall
    original: وَكَذَٰلِكَ أَنزَلْنَـٰهُ حُكْمًا عَرَبِيًّا ۚ وَلَئِنِ ٱتَّبَعْتَ أَهْوَآءَهُم بَعْدَ مَا جَآءَكَ مِنَ ٱلْعِلْمِ مَا لَكَ مِنَ ٱللَّهِ مِن وَلِىٍّ وَلَا وَاقٍ
    arabicPlain: وكذلك أنزلناه حكما عربيا ۚ ولئن اتبعت أهواءهم بعد ما جاءك من العلم ما لك من الله من ولي ولا واق
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 209
    page: 254
