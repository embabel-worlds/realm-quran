  data:
    ref: '13:25'
    scripture: quran
    name: Quran 13:25
    chapter: 13
    verse: 25
    ordinal: 1732
    text: 'And those who break the covenant of Allah after ratifying it, and sever that which Allah hath commanded should be joined, and make mischief in the earth: theirs is the curse and theirs the ill abode.'
    translation: Pickthall
    original: وَٱلَّذِينَ يَنقُضُونَ عَهْدَ ٱللَّهِ مِنۢ بَعْدِ مِيثَـٰقِهِۦ وَيَقْطَعُونَ مَآ أَمَرَ ٱللَّهُ بِهِۦٓ أَن يُوصَلَ وَيُفْسِدُونَ فِى ٱلْأَرْضِ ۙ أُو۟لَـٰٓئِكَ لَهُمُ ٱللَّعْنَةُ وَلَهُمْ سُوٓءُ ٱلدَّارِ
    arabicPlain: والذين ينقضون عهد الله من بعد ميثاقه ويقطعون ما أمر الله به أن يوصل ويفسدون في الأرض ۙ أولئك لهم اللعنة ولهم سوء الدار
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 207
