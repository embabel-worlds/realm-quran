- type: Ayah
  data:
    ref: '13:2'
    scripture: quran
    name: Quran 13:2
    chapter: 13
    verse: 2
    ordinal: 1709
    text: Allah it is Who raised up the heavens without visible supports, then mounted the Throne, and compelled the sun and the moon to be of service, each runneth unto an appointed term; He ordereth the course; He detaileth the revelations, that haply ye may be certain of the meeting with your Lord.
    translation: Pickthall
    original: ٱللَّهُ ٱلَّذِى رَفَعَ ٱلسَّمَـٰوَٰتِ بِغَيْرِ عَمَدٍ تَرَوْنَهَا ۖ ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ ۖ وَسَخَّرَ ٱلشَّمْسَ وَٱلْقَمَرَ ۖ كُلٌّ يَجْرِى لِأَجَلٍ مُّسَمًّى ۚ يُدَبِّرُ ٱلْأَمْرَ يُفَصِّلُ ٱلْـَٔايَـٰتِ لَعَلَّكُم بِلِقَآءِ رَبِّكُمْ تُوقِنُونَ
    arabicPlain: الله الذي رفع السماوات بغير عمد ترونها ۖ ثم استوى على العرش ۖ وسخر الشمس والقمر ۖ كل يجري لأجل مسمى ۚ يدبر الأمر يفصل الآيات لعلكم بلقاء ربكم توقنون
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 205
