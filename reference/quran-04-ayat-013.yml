- type: Ayah
  data:
    ref: '13:6'
    scripture: quran
    name: Quran 13:6
    chapter: 13
    verse: 6
    ordinal: 1713
    text: And they bid thee hasten on the evil rather than the good, when exemplary punishments have indeed occurred before them. But lo! thy Lord is rich in pardon for mankind despite their wrong, and lo! thy Lord is strong in punishment.
    translation: Pickthall
    original: وَيَسْتَعْجِلُونَكَ بِٱلسَّيِّئَةِ قَبْلَ ٱلْحَسَنَةِ وَقَدْ خَلَتْ مِن قَبْلِهِمُ ٱلْمَثُلَـٰتُ ۗ وَإِنَّ رَبَّكَ لَذُو مَغْفِرَةٍ لِّلنَّاسِ عَلَىٰ ظُلْمِهِمْ ۖ وَإِنَّ رَبَّكَ لَشَدِيدُ ٱلْعِقَابِ
    arabicPlain: ويستعجلونك بالسيئة قبل الحسنة وقد خلت من قبلهم المثلات ۗ وإن ربك لذو مغفرة للناس على ظلمهم ۖ وإن ربك لشديد العقاب
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 205
    page: 250
