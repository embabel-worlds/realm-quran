  data:
    ref: '13:19'
    scripture: quran
    name: Quran 13:19
    chapter: 13
    verse: 19
    ordinal: 1726
    text: Is he who knoweth that what is revealed unto thee from thy Lord is the truth like him who is blind? But only men of understanding heed;
    translation: Pickthall
    original: ۞ أَفَمَن يَعْلَمُ أَنَّمَآ أُنزِلَ إِلَيْكَ مِن رَّبِّكَ ٱلْحَقُّ كَمَنْ هُوَ أَعْمَىٰٓ ۚ إِنَّمَا يَتَذَكَّرُ أُو۟لُوا۟ ٱلْأَلْبَـٰبِ
    arabicPlain: ۞ أفمن يعلم أنما أنزل إليك من ربك الحق كمن هو أعمى ۚ إنما يتذكر أولو الألباب
