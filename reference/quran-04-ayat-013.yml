  data:
    ref: '13:24'
    scripture: quran
    name: Quran 13:24
    chapter: 13
    verse: 24
    ordinal: 1731
    text: '(Saying): Peace be unto you because ye persevered. Ah, passing sweet will be the sequel of the (heavenly) Home.'
    translation: Pickthall
    original: سَلَـٰمٌ عَلَيْكُم بِمَا صَبَرْتُمْ ۚ فَنِعْمَ عُقْبَى ٱلدَّارِ
    arabicPlain: سلام عليكم بما صبرتم ۚ فنعم عقبى الدار
    surahName: Ar-Ra'd
    juz: 13
