  data:
    ref: '13:28'
    scripture: quran
    name: Quran 13:28
    chapter: 13
    verse: 28
    ordinal: 1735
    text: Who have believed and whose hearts have rest in the remembrance of Allah. Verily in the remembrance of Allah do hearts find rest!
    translation: Pickthall
    original: ٱلَّذِينَ ءَامَنُوا۟ وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ ٱللَّهِ ۗ أَلَا بِذِكْرِ ٱللَّهِ تَطْمَئِنُّ ٱلْقُلُوبُ
    arabicPlain: الذين آمنوا وتطمئن قلوبهم بذكر الله ۗ ألا بذكر الله تطمئن القلوب
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 208
    page: 252
