  data:
    ref: '13:26'
    scripture: quran
    name: Quran 13:26
    chapter: 13
    verse: 26
    ordinal: 1733
    text: Allah enlargeth livelihood for whom He will, and straiteneth (it for whom He will); and they rejoice in the life of the world, whereas the life of the world is but brief comfort as compared with the Hereafter.
    translation: Pickthall
    original: ٱللَّهُ يَبْسُطُ ٱلرِّزْقَ لِمَن يَشَآءُ وَيَقْدِرُ ۚ وَفَرِحُوا۟ بِٱلْحَيَوٰةِ ٱلدُّنْيَا وَمَا ٱلْحَيَوٰةُ ٱلدُّنْيَا فِى ٱلْـَٔاخِرَةِ إِلَّا مَتَـٰعٌ
    arabicPlain: الله يبسط الرزق لمن يشاء ويقدر ۚ وفرحوا بالحياة الدنيا وما الحياة الدنيا في الآخرة إلا متاع
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 207
    page: 252
