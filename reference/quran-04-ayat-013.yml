    scripture: quran
    name: Quran 13:20
    chapter: 13
    verse: 20
    ordinal: 1727
    text: Such as keep the pact of Allah, and break not the covenant;
    translation: Pickthall
    original: ٱلَّذِينَ يُوفُونَ بِعَهْدِ ٱللَّهِ وَلَا يَنقُضُونَ ٱلْمِيثَـٰقَ
