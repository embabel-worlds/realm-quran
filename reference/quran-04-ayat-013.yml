  data:
    ref: '13:32'
    scripture: quran
    name: Quran 13:32
    chapter: 13
    verse: 32
    ordinal: 1739
    text: And verily messengers (of Allah) were mocked before thee, but long I bore with those who disbelieved. At length I seized them, and how (awful) was My punishment!
    translation: Pickthall
    original: وَلَقَدِ ٱسْتُهْزِئَ بِرُسُلٍ مِّن قَبْلِكَ فَأَمْلَيْتُ لِلَّذِينَ كَفَرُوا۟ ثُمَّ أَخَذْتُهُمْ ۖ فَكَيْفَ كَانَ عِقَابِ
    arabicPlain: ولقد استهزئ برسل من قبلك فأمليت للذين كفروا ثم أخذتهم ۖ فكيف كان عقاب
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 209
    page: 253
