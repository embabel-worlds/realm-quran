    chapter: 13
    verse: 9
    ordinal: 1716
    text: He is the Knower of the Invisible and the Visible, the Great, the High Exalted.
    translation: Pickthall
    original: عَـٰلِمُ ٱلْغَيْبِ وَٱلشَّهَـٰدَةِ ٱلْكَبِيرُ ٱلْمُتَعَالِ
    arabicPlain: عالم الغيب والشهادة الكبير المتعال
    surahName: Ar-Ra'd
