  data:
    ref: '13:18'
    scripture: quran
    name: Quran 13:18
    chapter: 13
    verse: 18
    ordinal: 1725
    text: For those who answered Allah's call is bliss; and for those who answered not His call, if they had all that is in the earth, and therewith the like thereof, they would proffer it as ransom. Such will have a woeful reckoning, and their habitation will be hell, a dire abode.
    translation: Pickthall
    original: لِلَّذِينَ ٱسْتَجَابُوا۟ لِرَبِّهِمُ ٱلْحُسْنَىٰ ۚ وَٱلَّذِينَ لَمْ يَسْتَجِيبُوا۟ لَهُۥ لَوْ أَنَّ لَهُم مَّا فِى ٱلْأَرْضِ جَمِيعًا وَمِثْلَهُۥ مَعَهُۥ لَٱفْتَدَوْا۟ بِهِۦٓ ۚ أُو۟لَـٰٓئِكَ لَهُمْ سُوٓءُ ٱلْحِسَابِ وَمَأْوَىٰهُمْ جَهَنَّمُ ۖ وَبِئْسَ ٱلْمِهَادُ
    arabicPlain: للذين استجابوا لربهم الحسنى ۚ والذين لم يستجيبوا له لو أن لهم ما في الأرض جميعا ومثله معه لافتدوا به ۚ أولئك لهم سوء الحساب ومأواهم جهنم ۖ وبئس المهاد
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 206
