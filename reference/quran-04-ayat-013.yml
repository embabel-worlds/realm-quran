- type: Ayah
  data:
    ref: '13:11'
    scripture: quran
    name: Quran 13:11
    chapter: 13
    verse: 11
    ordinal: 1718
    text: For him are angels ranged before him and behind him, who guard him by Allah's command. Lo! Allah changeth not the condition of a folk until they (first) change that which is in their hearts; and if Allah willeth misfortune for a folk there is none that can repel it, nor have they a defender beside Him.
    translation: Pickthall
    original: لَهُۥ مُعَقِّبَـٰتٌ مِّنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ يَحْفَظُونَهُۥ مِنْ أَمْرِ ٱللَّهِ ۗ إِنَّ ٱللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّىٰ يُغَيِّرُوا۟ مَا بِأَنفُسِهِمْ ۗ وَإِذَآ أَرَادَ ٱللَّهُ بِقَوْمٍ سُوٓءًا فَلَا مَرَدَّ لَهُۥ ۚ وَمَا لَهُم مِّن دُونِهِۦ مِن وَالٍ
    arabicPlain: له معقبات من بين يديه ومن خلفه يحفظونه من أمر الله ۗ إن الله لا يغير ما بقوم حتى يغيروا ما بأنفسهم ۗ وإذا أراد الله بقوم سوءا فلا مرد له ۚ وما لهم من دونه من وال
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 206
    page: 250
