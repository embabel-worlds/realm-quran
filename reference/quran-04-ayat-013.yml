  data:
    ref: '13:29'
    scripture: quran
    name: Quran 13:29
    chapter: 13
    verse: 29
    ordinal: 1736
    text: 'Those who believe and do right: Joy is for them, and bliss (their) journey''s end.'
    translation: Pickthall
    original: ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ طُوبَىٰ لَهُمْ وَحُسْنُ مَـَٔابٍ
    arabicPlain: الذين آمنوا وعملوا الصالحات طوبى لهم وحسن مآب
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 208
