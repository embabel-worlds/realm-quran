- type: Ayah
  data:
    ref: '13:5'
    scripture: quran
    name: Quran 13:5
    chapter: 13
    verse: 5
    ordinal: 1712
    text: 'And if thou wonderest, then wondrous is their saying: When we are dust, are we then forsooth (to be raised) in a new creation? Such are they who disbelieve in their Lord; such have carcans on their necks; such are rightful owners of the Fire, they will abide therein.'
    translation: Pickthall
    original: ۞ وَإِن تَعْجَبْ فَعَجَبٌ قَوْلُهُمْ أَءِذَا كُنَّا تُرَٰبًا أَءِنَّا لَفِى خَلْقٍ جَدِيدٍ ۗ أُو۟لَـٰٓئِكَ ٱلَّذِينَ كَفَرُوا۟ بِرَبِّهِمْ ۖ وَأُو۟لَـٰٓئِكَ ٱلْأَغْلَـٰلُ فِىٓ أَعْنَاقِهِمْ ۖ وَأُو۟لَـٰٓئِكَ أَصْحَـٰبُ ٱلنَّارِ ۖ هُمْ فِيهَا خَـٰلِدُونَ
    arabicPlain: ۞ وإن تعجب فعجب قولهم أإذا كنا ترابا أإنا لفي خلق جديد ۗ أولئك الذين كفروا بربهم ۖ وأولئك الأغلال في أعناقهم ۖ وأولئك أصحاب النار ۖ هم فيها خالدون
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 205
    page: 249
