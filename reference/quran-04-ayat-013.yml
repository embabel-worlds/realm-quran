  data:
    ref: '13:15'
    scripture: quran
    name: Quran 13:15
    chapter: 13
    verse: 15
    ordinal: 1722
    text: And unto Allah falleth prostrate whosoever is in the heavens and the earth, willingly or unwillingly, as do their shadows in the morning and the evening hours.
    translation: Pickthall
    original: وَلِلَّهِ يَسْجُدُ مَن فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ طَوْعًا وَكَرْهًا وَظِلَـٰلُهُم بِٱلْغُدُوِّ وَٱلْـَٔاصَالِ ۩
    arabicPlain: ولله يسجد من في السماوات والأرض طوعا وكرها وظلالهم بالغدو والآصال ۩
    surahName: Ar-Ra'd
    juz: 13
