  data:
    ref: '13:27'
    scripture: quran
    name: Quran 13:27
    chapter: 13
    verse: 27
    ordinal: 1734
    text: 'Those who disbelieve say: If only a portent were sent down upon him from his Lord! Say: Lo! Allah sendeth whom He will astray, and guideth unto Himself all who turn (unto Him),'
    translation: Pickthall
    original: وَيَقُولُ ٱلَّذِينَ كَفَرُوا۟ لَوْلَآ أُنزِلَ عَلَيْهِ ءَايَةٌ مِّن رَّبِّهِۦ ۗ قُلْ إِنَّ ٱللَّهَ يُضِلُّ مَن يَشَآءُ وَيَهْدِىٓ إِلَيْهِ مَنْ أَنَابَ
    arabicPlain: ويقول الذين كفروا لولا أنزل عليه آية من ربه ۗ قل إن الله يضل من يشاء ويهدي إليه من أناب
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 208
    page: 252
