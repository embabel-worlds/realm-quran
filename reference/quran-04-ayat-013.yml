  data:
    ref: '13:43'
    scripture: quran
    name: Quran 13:43
    chapter: 13
    verse: 43
    ordinal: 1750
    text: 'They who disbelieve say: Thou art no messenger (of Allah). Say: Allah, and whosoever hath knowledge of the Scripture, is sufficient witness between me and you.'
    translation: Pickthall
    original: وَيَقُولُ ٱلَّذِينَ كَفَرُوا۟ لَسْتَ مُرْسَلًا ۚ قُلْ كَفَىٰ بِٱللَّهِ شَهِيدًۢا بَيْنِى وَبَيْنَكُمْ وَمَنْ عِندَهُۥ عِلْمُ ٱلْكِتَـٰبِ
    arabicPlain: ويقول الذين كفروا لست مرسلا ۚ قل كفى بالله شهيدا بيني وبينكم ومن عنده علم الكتاب
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 210
    page: 255
