  data:
    ref: '13:35'
    scripture: quran
    name: Quran 13:35
    chapter: 13
    verse: 35
    ordinal: 1742
    text: 'A similitude of the Garden which is promised unto those who keep their duty (to Allah): Underneath it rivers flow; its food is everlasting, and its shade; this is the reward of those who keep their duty, while the reward of disbelievers is the Fire.'
    translation: Pickthall
    original: ۞ مَّثَلُ ٱلْجَنَّةِ ٱلَّتِى وُعِدَ ٱلْمُتَّقُونَ ۖ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ ۖ أُكُلُهَا دَآئِمٌ وَظِلُّهَا ۚ تِلْكَ عُقْبَى ٱلَّذِينَ ٱتَّقَوا۟ ۖ وَّعُقْبَى ٱلْكَـٰفِرِينَ ٱلنَّارُ
    arabicPlain: ۞ مثل الجنة التي وعد المتقون ۖ تجري من تحتها الأنهار ۖ أكلها دائم وظلها ۚ تلك عقبى الذين اتقوا ۖ وعقبى الكافرين النار
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 209
    page: 254
