  data:
    ref: '13:17'
    scripture: quran
    name: Quran 13:17
    chapter: 13
    verse: 17
    ordinal: 1724
    text: He sendeth down water from the sky, so that valleys flow according to their measure, and the flood beareth (on its surface) swelling foam - from that which they smelt in the fire in order to make ornaments and tools riseth a foam like unto it - thus Allah coineth (the similitude of) the true and the false. Then, as for the foam, it passeth away as scum upon the banks, while, as for that which is of use to mankind, it remaineth in the earth. Thus Allah coineth the similitudes.
    translation: Pickthall
    original: أَنزَلَ مِنَ ٱلسَّمَآءِ مَآءً فَسَالَتْ أَوْدِيَةٌۢ بِقَدَرِهَا فَٱحْتَمَلَ ٱلسَّيْلُ زَبَدًا رَّابِيًا ۚ وَمِمَّا يُوقِدُونَ عَلَيْهِ فِى ٱلنَّارِ ٱبْتِغَآءَ حِلْيَةٍ أَوْ مَتَـٰعٍ زَبَدٌ مِّثْلُهُۥ ۚ كَذَٰلِكَ يَضْرِبُ ٱللَّهُ ٱلْحَقَّ وَٱلْبَـٰطِلَ ۚ فَأَمَّا ٱلزَّبَدُ فَيَذْهَبُ جُفَآءً ۖ وَأَمَّا مَا يَنفَعُ ٱلنَّاسَ فَيَمْكُثُ فِى ٱلْأَرْضِ ۚ كَذَٰلِكَ يَضْرِبُ ٱللَّهُ ٱلْأَمْثَالَ
    arabicPlain: أنزل من السماء ماء فسالت أودية بقدرها فاحتمل السيل زبدا رابيا ۚ ومما يوقدون عليه في النار ابتغاء حلية أو متاع زبد مثله ۚ كذلك يضرب الله الحق والباطل ۚ فأما الزبد فيذهب جفاء ۖ وأما ما ينفع الناس فيمكث في الأرض ۚ كذلك يضرب الله الأمثال
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 206
    page: 251
