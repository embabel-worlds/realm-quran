- type: Ayah
  data:
    ref: '13:10'
    scripture: quran
    name: Quran 13:10
    chapter: 13
    verse: 10
    ordinal: 1717
    text: Alike of you is he who hideth the saying and he who noiseth it abroad, he who lurketh in the night and he who goeth freely in the daytime.
    translation: Pickthall
    original: سَوَآءٌ مِّنكُم مَّنْ أَسَرَّ ٱلْقَوْلَ وَمَن جَهَرَ بِهِۦ وَمَنْ هُوَ مُسْتَخْفٍۭ بِٱلَّيْلِ وَسَارِبٌۢ بِٱلنَّهَارِ
    arabicPlain: سواء منكم من أسر القول ومن جهر به ومن هو مستخف بالليل وسارب بالنهار
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
