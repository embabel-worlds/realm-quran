  data:
    ref: '13:21'
    scripture: quran
    name: Quran 13:21
    chapter: 13
    verse: 21
    ordinal: 1728
    text: Such as unite that which Allah hath commandeth should be joined, and fear their Lord, and dread a woeful reckoning;
    translation: Pickthall
    original: وَٱلَّذِينَ يَصِلُونَ مَآ أَمَرَ ٱللَّهُ بِهِۦٓ أَن يُوصَلَ وَيَخْشَوْنَ رَبَّهُمْ وَيَخَافُونَ سُوٓءَ ٱلْحِسَابِ
    arabicPlain: والذين يصلون ما أمر الله به أن يوصل ويخشون ربهم ويخافون سوء الحساب
