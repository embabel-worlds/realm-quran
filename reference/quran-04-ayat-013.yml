  data:
    ref: '13:36'
    scripture: quran
    name: Quran 13:36
    chapter: 13
    verse: 36
    ordinal: 1743
    text: 'Those unto whom We gave the Scripture rejoice in that which is revealed unto thee. And of the clans there are who deny some of it. Say: I am commanded only that I serve Allah and ascribe unto Him no partner. Unto Him I cry, and unto Him is my return.'
    translation: Pickthall
    original: وَٱلَّذِينَ ءَاتَيْنَـٰهُمُ ٱلْكِتَـٰبَ يَفْرَحُونَ بِمَآ أُنزِلَ إِلَيْكَ ۖ وَمِنَ ٱلْأَحْزَابِ مَن يُنكِرُ بَعْضَهُۥ ۚ قُلْ إِنَّمَآ أُمِرْتُ أَنْ أَعْبُدَ ٱللَّهَ وَلَآ أُشْرِكَ بِهِۦٓ ۚ إِلَيْهِ أَدْعُوا۟ وَإِلَيْهِ مَـَٔابِ
    arabicPlain: والذين آتيناهم الكتاب يفرحون بما أنزل إليك ۖ ومن الأحزاب من ينكر بعضه ۚ قل إنما أمرت أن أعبد الله ولا أشرك به ۚ إليه أدعو وإليه مآب
    surahName: Ar-Ra'd
    juz: 13
    manzil: 3
    ruku: 209
    page: 254
  relations:
  - predicate: IN
    to:
      type: Surah
