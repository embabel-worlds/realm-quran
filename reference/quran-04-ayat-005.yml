  data:
    ref: '5:26'
    scripture: quran
    name: Quran 5:26
    chapter: 5
    verse: 26
    ordinal: 695
    text: '(Their Lord) said: For this the land will surely be forbidden them for forty years that they will wander in the earth, bewildered. So grieve not over the wrongdoing folk.'
    translation: Pickthall
    original: قَالَ فَإِنَّهَا مُحَرَّمَةٌ عَلَيْهِمْ ۛ أَرْبَعِينَ سَنَةً ۛ يَتِيهُونَ فِى ٱلْأَرْضِ ۚ فَلَا تَأْسَ عَلَى ٱلْقَوْمِ ٱلْفَـٰسِقِينَ
    arabicPlain: قال فإنها محرمة عليهم ۛ أربعين سنة ۛ يتيهون في الأرض ۚ فلا تأس على القوم الفاسقين
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 89
