  data:
    ref: '5:22'
    scripture: quran
    name: Quran 5:22
    chapter: 5
    verse: 22
    ordinal: 691
    text: 'They said: O Moses! Lo! a giant people (dwell) therein and lo! we go not in till they go forth from thence. When they go forth from thence, then we will enter (not till then).'
    translation: Pickthall
    original: قَالُوا۟ يَـٰمُوسَىٰٓ إِنَّ فِيهَا قَوْمًا جَبَّارِينَ وَإِنَّا لَن نَّدْخُلَهَا حَتَّىٰ يَخْرُجُوا۟ مِنْهَا فَإِن يَخْرُجُوا۟ مِنْهَا فَإِنَّا دَٰخِلُونَ
    arabicPlain: قالوا يا موسى إن فيها قوما جبارين وإنا لن ندخلها حتى يخرجوا منها فإن يخرجوا منها فإنا داخلون
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 89
    page: 111
