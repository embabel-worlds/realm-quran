  data:
    ref: 5:83
    scripture: quran
    name: Quran 5:83
    chapter: 5
    verse: 83
    ordinal: 752
    text: 'When they listen to that which hath been revealed unto the messengers, thou seest their eyes overflow with tears because of their recognition of the Truth. They say: Our Lord, we believe. Inscribe us as among the witnesses.'
    translation: Pickthall
    original: وَإِذَا سَمِعُوا۟ مَآ أُنزِلَ إِلَى ٱلرَّسُولِ تَرَىٰٓ أَعْيُنَهُمْ تَفِيضُ مِنَ ٱلدَّمْعِ مِمَّا عَرَفُوا۟ مِنَ ٱلْحَقِّ ۖ يَقُولُونَ رَبَّنَآ ءَامَنَّا فَٱكْتُبْنَا مَعَ ٱلشَّـٰهِدِينَ
    arabicPlain: وإذا سمعوا ما أنزل إلى الرسول ترى أعينهم تفيض من الدمع مما عرفوا من الحق ۖ يقولون ربنا آمنا فاكتبنا مع الشاهدين
    surahName: Al-Maaida
    juz: 7
    manzil: 2
    ruku: 96
