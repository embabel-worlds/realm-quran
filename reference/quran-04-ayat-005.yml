    scripture: quran
    name: Quran 5:98
    chapter: 5
    verse: 98
    ordinal: 767
    text: Know that Allah is severe in punishment, but that Allah (also) is Forgiving, Merciful.
    translation: Pickthall
    original: ٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ وَأَنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ
