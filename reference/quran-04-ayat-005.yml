  data:
    ref: 5:80
    scripture: quran
    name: Quran 5:80
    chapter: 5
    verse: 80
    ordinal: 749
    text: 'Thou seest many of them making friends with those who disbelieve. Surely ill for them is that which they themselves send on before them: that Allah will be wroth with them and in the doom they will abide.'
    translation: Pickthall
    original: تَرَىٰ كَثِيرًا مِّنْهُمْ يَتَوَلَّوْنَ ٱلَّذِينَ كَفَرُوا۟ ۚ لَبِئْسَ مَا قَدَّمَتْ لَهُمْ أَنفُسُهُمْ أَن سَخِطَ ٱللَّهُ عَلَيْهِمْ وَفِى ٱلْعَذَابِ هُمْ خَـٰلِدُونَ
    arabicPlain: ترى كثيرا منهم يتولون الذين كفروا ۚ لبئس ما قدمت لهم أنفسهم أن سخط الله عليهم وفي العذاب هم خالدون
    surahName: Al-Maaida
    juz: 6
