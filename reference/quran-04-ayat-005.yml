  data:
    ref: 5:105
    scripture: quran
    name: Quran 5:105
    chapter: 5
    verse: 105
    ordinal: 774
    text: O ye who believe! Ye have charge of your own souls. He who erreth cannot injure you if ye are rightly guided. Unto Allah ye will all return; and then He will inform you of what ye used to do.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ عَلَيْكُمْ أَنفُسَكُمْ ۖ لَا يَضُرُّكُم مَّن ضَلَّ إِذَا ٱهْتَدَيْتُمْ ۚ إِلَى ٱللَّهِ مَرْجِعُكُمْ جَمِيعًا فَيُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَ
    arabicPlain: يا أيها الذين آمنوا عليكم أنفسكم ۖ لا يضركم من ضل إذا اهتديتم ۚ إلى الله مرجعكم جميعا فينبئكم بما كنتم تعملون
    surahName: Al-Maaida
    juz: 7
    manzil: 2
    ruku: 99
    page: 125
