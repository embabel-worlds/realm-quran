  data:
    ref: 5:70
    scripture: quran
    name: Quran 5:70
    chapter: 5
    verse: 70
    ordinal: 739
    text: We made a covenant of old with the Children of Israel and We sent unto them messengers. As often as a messenger came unto them with that which their souls desired not (they became rebellious). Some (of them) they denied and some they slew.
    translation: Pickthall
    original: لَقَدْ أَخَذْنَا مِيثَـٰقَ بَنِىٓ إِسْرَٰٓءِيلَ وَأَرْسَلْنَآ إِلَيْهِمْ رُسُلًا ۖ كُلَّمَا جَآءَهُمْ رَسُولٌۢ بِمَا لَا تَهْوَىٰٓ أَنفُسُهُمْ فَرِيقًا كَذَّبُوا۟ وَفَرِيقًا يَقْتُلُونَ
    arabicPlain: لقد أخذنا ميثاق بني إسرائيل وأرسلنا إليهم رسلا ۖ كلما جاءهم رسول بما لا تهوى أنفسهم فريقا كذبوا وفريقا يقتلون
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 95
    page: 119
