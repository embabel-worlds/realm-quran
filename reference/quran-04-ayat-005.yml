  data:
    ref: 5:79
    scripture: quran
    name: Quran 5:79
    chapter: 5
    verse: 79
    ordinal: 748
    text: They restrained not one another from the wickedness they did. Verily evil was that they used to do!
    translation: Pickthall
    original: كَانُوا۟ لَا يَتَنَاهَوْنَ عَن مُّنكَرٍ فَعَلُوهُ ۚ لَبِئْسَ مَا كَانُوا۟ يَفْعَلُونَ
    arabicPlain: كانوا لا يتناهون عن منكر فعلوه ۚ لبئس ما كانوا يفعلون
    surahName: Al-Maaida
    juz: 6
