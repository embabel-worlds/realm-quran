  data:
    ref: 5:76
    scripture: quran
    name: Quran 5:76
    chapter: 5
    verse: 76
    ordinal: 745
    text: 'Say: Serve ye in place of Allah that which possesseth for you neither hurt nor use? Allah it is Who is the Hearer, the Knower.'
    translation: Pickthall
    original: قُلْ أَتَعْبُدُونَ مِن دُونِ ٱللَّهِ مَا لَا يَمْلِكُ لَكُمْ ضَرًّا وَلَا نَفْعًا ۚ وَٱللَّهُ هُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ
    arabicPlain: قل أتعبدون من دون الله ما لا يملك لكم ضرا ولا نفعا ۚ والله هو السميع العليم
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 95
    page: 120
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '5'
  - predicate: IN_PORTION
