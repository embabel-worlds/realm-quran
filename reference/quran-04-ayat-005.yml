  data:
    ref: 5:64
    scripture: quran
    name: Quran 5:64
    chapter: 5
    verse: 64
    ordinal: 733
    text: 'The Jews say: Allah''s hand is fettered. Their hands are fettered and they are accursed for saying so. Nay, but both His hands are spread out wide in bounty. He bestoweth as He will. That which hath been revealed unto thee from thy Lord is certain to increase the contumacy and disbelief of many of them, and We have cast among them enmity and hatred till the Day of Resurrection. As often as they light a fire for war, Allah extinguisheth it. Their effort is for corruption in the land, and Allah loveth not corrupters.'
    translation: Pickthall
    original: وَقَالَتِ ٱلْيَهُودُ يَدُ ٱللَّهِ مَغْلُولَةٌ ۚ غُلَّتْ أَيْدِيهِمْ وَلُعِنُوا۟ بِمَا قَالُوا۟ ۘ بَلْ يَدَاهُ مَبْسُوطَتَانِ يُنفِقُ كَيْفَ يَشَآءُ ۚ وَلَيَزِيدَنَّ كَثِيرًا مِّنْهُم مَّآ أُنزِلَ إِلَيْكَ مِن رَّبِّكَ طُغْيَـٰنًا وَكُفْرًا ۚ وَأَلْقَيْنَا بَيْنَهُمُ ٱلْعَدَٰوَةَ وَٱلْبَغْضَآءَ إِلَىٰ يَوْمِ ٱلْقِيَـٰمَةِ ۚ كُلَّمَآ أَوْقَدُوا۟ نَارًا لِّلْحَرْبِ أَطْفَأَهَا ٱللَّهُ ۚ وَيَسْعَوْنَ فِى ٱلْأَرْضِ فَسَادًا ۚ وَٱللَّهُ لَا يُحِبُّ ٱلْمُفْسِدِينَ
    arabicPlain: وقالت اليهود يد الله مغلولة ۚ غلت أيديهم ولعنوا بما قالوا ۘ بل يداه مبسوطتان ينفق كيف يشاء ۚ وليزيدن كثيرا منهم ما أنزل إليك من ربك طغيانا وكفرا ۚ وألقينا بينهم العداوة والبغضاء إلى يوم القيامة ۚ كلما أوقدوا نارا للحرب أطفأها الله ۚ ويسعون في الأرض فسادا ۚ والله لا يحب المفسدين
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 94
    page: 118
