  data:
    ref: 5:88
    scripture: quran
    name: Quran 5:88
    chapter: 5
    verse: 88
    ordinal: 757
    text: Eat of that which Allah hath bestowed on you as food lawful and good, and keep your duty to Allah in Whom ye are believers.
    translation: Pickthall
    original: وَكُلُوا۟ مِمَّا رَزَقَكُمُ ٱللَّهُ حَلَـٰلًا طَيِّبًا ۚ وَٱتَّقُوا۟ ٱللَّهَ ٱلَّذِىٓ أَنتُم بِهِۦ مُؤْمِنُونَ
    arabicPlain: وكلوا مما رزقكم الله حلالا طيبا ۚ واتقوا الله الذي أنتم به مؤمنون
    surahName: Al-Maaida
    juz: 7
    manzil: 2
    ruku: 97
