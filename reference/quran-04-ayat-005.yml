  data:
    ref: '5:43'
    scripture: quran
    name: Quran 5:43
    chapter: 5
    verse: 43
    ordinal: 712
    text: How come they unto thee for judgment when they have the Torah, wherein Allah hath delivered judgment (for them)? Yet even after that they turn away. Such (folk) are not believers.
    translation: Pickthall
    original: وَكَيْفَ يُحَكِّمُونَكَ وَعِندَهُمُ ٱلتَّوْرَىٰةُ فِيهَا حُكْمُ ٱللَّهِ ثُمَّ يَتَوَلَّوْنَ مِنۢ بَعْدِ ذَٰلِكَ ۚ وَمَآ أُو۟لَـٰٓئِكَ بِٱلْمُؤْمِنِينَ
    arabicPlain: وكيف يحكمونك وعندهم التوراة فيها حكم الله ثم يتولون من بعد ذلك ۚ وما أولئك بالمؤمنين
    surahName: Al-Maaida
    juz: 6
