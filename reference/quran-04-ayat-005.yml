  data:
    ref: 5:62
    scripture: quran
    name: Quran 5:62
    chapter: 5
    verse: 62
    ordinal: 731
    text: And thou seest many of them vying one with another in sin and transgression and their devouring of illicit gain. Verily evil is what they do.
    translation: Pickthall
    original: وَتَرَىٰ كَثِيرًا مِّنْهُمْ يُسَـٰرِعُونَ فِى ٱلْإِثْمِ وَٱلْعُدْوَٰنِ وَأَكْلِهِمُ ٱلسُّحْتَ ۚ لَبِئْسَ مَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: وترى كثيرا منهم يسارعون في الإثم والعدوان وأكلهم السحت ۚ لبئس ما كانوا يعملون
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 94
    page: 118
  relations:
  - predicate: IN
    to:
      type: Surah
