  data:
    ref: 5:109
    scripture: quran
    name: Quran 5:109
    chapter: 5
    verse: 109
    ordinal: 778
    text: 'In the day when Allah gathereth together the messengers, and saith: What was your response (from mankind)? they say: We have no knowledge. Lo! Thou, only Thou art the Knower of Things Hidden,'
    translation: Pickthall
    original: ۞ يَوْمَ يَجْمَعُ ٱللَّهُ ٱلرُّسُلَ فَيَقُولُ مَاذَآ أُجِبْتُمْ ۖ قَالُوا۟ لَا عِلْمَ لَنَآ ۖ إِنَّكَ أَنتَ عَلَّـٰمُ ٱلْغُيُوبِ
    arabicPlain: ۞ يوم يجمع الله الرسل فيقول ماذا أجبتم ۖ قالوا لا علم لنا ۖ إنك أنت علام الغيوب
