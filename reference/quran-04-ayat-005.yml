  data:
    ref: 5:100
    scripture: quran
    name: Quran 5:100
    chapter: 5
    verse: 100
    ordinal: 769
    text: 'Say: The evil and the good are not alike even though the plenty of the evil attract thee. So be mindful of your duty to Allah, O men of understanding, that ye may succeed.'
    translation: Pickthall
    original: قُل لَّا يَسْتَوِى ٱلْخَبِيثُ وَٱلطَّيِّبُ وَلَوْ أَعْجَبَكَ كَثْرَةُ ٱلْخَبِيثِ ۚ فَٱتَّقُوا۟ ٱللَّهَ يَـٰٓأُو۟لِى ٱلْأَلْبَـٰبِ لَعَلَّكُمْ تُفْلِحُونَ
    arabicPlain: قل لا يستوي الخبيث والطيب ولو أعجبك كثرة الخبيث ۚ فاتقوا الله يا أولي الألباب لعلكم تفلحون
