  data:
    ref: '5:29'
    scripture: quran
    name: Quran 5:29
    chapter: 5
    verse: 29
    ordinal: 698
    text: Lo! I would rather thou shouldst bear the punishment of the sin against me and thine own sin and become one of the owners of the fire. That is the reward of evil-doers.
    translation: Pickthall
    original: إِنِّىٓ أُرِيدُ أَن تَبُوٓأَ بِإِثْمِى وَإِثْمِكَ فَتَكُونَ مِنْ أَصْحَـٰبِ ٱلنَّارِ ۚ وَذَٰلِكَ جَزَٰٓؤُا۟ ٱلظَّـٰلِمِينَ
    arabicPlain: إني أريد أن تبوء بإثمي وإثمك فتكون من أصحاب النار ۚ وذلك جزاء الظالمين
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 90
