  data:
    ref: '5:25'
    scripture: quran
    name: Quran 5:25
    chapter: 5
    verse: 25
    ordinal: 694
    text: 'He said: My Lord! I have control of none but myself and my brother, so distinguish between us and the wrong-doing folk.'
    translation: Pickthall
    original: قَالَ رَبِّ إِنِّى لَآ أَمْلِكُ إِلَّا نَفْسِى وَأَخِى ۖ فَٱفْرُقْ بَيْنَنَا وَبَيْنَ ٱلْقَوْمِ ٱلْفَـٰسِقِينَ
    arabicPlain: قال رب إني لا أملك إلا نفسي وأخي ۖ فافرق بيننا وبين القوم الفاسقين
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 89
