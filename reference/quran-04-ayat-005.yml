  data:
    ref: 5:103
    scripture: quran
    name: Quran 5:103
    chapter: 5
    verse: 103
    ordinal: 772
    text: Allah hath not appointed anything in the nature of a Bahirah or a Sa'ibah or a Wasilah or a Hami, but those who disbelieve invent a lie against Allah. Most of them have no sense.
    translation: Pickthall
    original: مَا جَعَلَ ٱللَّهُ مِنۢ بَحِيرَةٍ وَلَا سَآئِبَةٍ وَلَا وَصِيلَةٍ وَلَا حَامٍ ۙ وَلَـٰكِنَّ ٱلَّذِينَ كَفَرُوا۟ يَفْتَرُونَ عَلَى ٱللَّهِ ٱلْكَذِبَ ۖ وَأَكْثَرُهُمْ لَا يَعْقِلُونَ
    arabicPlain: ما جعل الله من بحيرة ولا سائبة ولا وصيلة ولا حام ۙ ولكن الذين كفروا يفترون على الله الكذب ۖ وأكثرهم لا يعقلون
