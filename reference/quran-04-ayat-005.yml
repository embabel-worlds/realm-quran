  data:
    ref: 5:118
    scripture: quran
    name: Quran 5:118
    chapter: 5
    verse: 118
    ordinal: 787
    text: If Thou punish them, lo! they are Thy slaves, and if Thou forgive them (lo! they are Thy slaves). Lo! Thou, only Thou, art the Mighty, the Wise.
    translation: Pickthall
    original: إِن تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ ۖ وَإِن تَغْفِرْ لَهُمْ فَإِنَّكَ أَنتَ ٱلْعَزِيزُ ٱلْحَكِيمُ
    arabicPlain: إن تعذبهم فإنهم عبادك ۖ وإن تغفر لهم فإنك أنت العزيز الحكيم
    surahName: Al-Maaida
