  data:
    ref: '5:34'
    scripture: quran
    name: Quran 5:34
    chapter: 5
    verse: 34
    ordinal: 703
    text: Save those who repent before ye overpower them. For know that Allah is Forgiving, Merciful.
    translation: Pickthall
    original: إِلَّا ٱلَّذِينَ تَابُوا۟ مِن قَبْلِ أَن تَقْدِرُوا۟ عَلَيْهِمْ ۖ فَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ
    arabicPlain: إلا الذين تابوا من قبل أن تقدروا عليهم ۖ فاعلموا أن الله غفور رحيم
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 90
    page: 113
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '5'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-6
