  data:
    ref: 5:112
    scripture: quran
    name: Quran 5:112
    chapter: 5
    verse: 112
    ordinal: 781
    text: 'When the disciples said: O Jesus, son of Mary! Is thy Lord able to send down for us a table spread with food from heaven? He said: Observe your duty to Allah, if ye are true believers.'
    translation: Pickthall
    original: إِذْ قَالَ ٱلْحَوَارِيُّونَ يَـٰعِيسَى ٱبْنَ مَرْيَمَ هَلْ يَسْتَطِيعُ رَبُّكَ أَن يُنَزِّلَ عَلَيْنَا مَآئِدَةً مِّنَ ٱلسَّمَآءِ ۖ قَالَ ٱتَّقُوا۟ ٱللَّهَ إِن كُنتُم مُّؤْمِنِينَ
    arabicPlain: إذ قال الحواريون يا عيسى ابن مريم هل يستطيع ربك أن ينزل علينا مائدة من السماء ۖ قال اتقوا الله إن كنتم مؤمنين
    surahName: Al-Maaida
    juz: 7
