  data:
    ref: 5:82
    scripture: quran
    name: Quran 5:82
    chapter: 5
    verse: 82
    ordinal: 751
    text: 'Thou wilt find the most vehement of mankind in hostility to those who believe (to be) the Jews and the idolaters. And thou wilt find the nearest of them in affection to those who believe (to be) those who say: Lo! We are Christians. That is because there are among them priests and monks, and because they are not proud.'
    translation: Pickthall
    original: ۞ لَتَجِدَنَّ أَشَدَّ ٱلنَّاسِ عَدَٰوَةً لِّلَّذِينَ ءَامَنُوا۟ ٱلْيَهُودَ وَٱلَّذِينَ أَشْرَكُوا۟ ۖ وَلَتَجِدَنَّ أَقْرَبَهُم مَّوَدَّةً لِّلَّذِينَ ءَامَنُوا۟ ٱلَّذِينَ قَالُوٓا۟ إِنَّا نَصَـٰرَىٰ ۚ ذَٰلِكَ بِأَنَّ مِنْهُمْ قِسِّيسِينَ وَرُهْبَانًا وَأَنَّهُمْ لَا يَسْتَكْبِرُونَ
    arabicPlain: ۞ لتجدن أشد الناس عداوة للذين آمنوا اليهود والذين أشركوا ۖ ولتجدن أقربهم مودة للذين آمنوا الذين قالوا إنا نصارى ۚ ذلك بأن منهم قسيسين ورهبانا وأنهم لا يستكبرون
    surahName: Al-Maaida
    juz: 7
    manzil: 2
    ruku: 96
    page: 121
