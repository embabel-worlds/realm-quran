  data:
    ref: '5:31'
    scripture: quran
    name: Quran 5:31
    chapter: 5
    verse: 31
    ordinal: 700
    text: 'Then Allah sent a raven scratching up the ground, to show him how to hide his brother''s naked corpse. He said: Woe unto me! Am I not able to be as this raven and so hide my brother''s naked corpse? And he became repentant.'
    translation: Pickthall
    original: فَبَعَثَ ٱللَّهُ غُرَابًا يَبْحَثُ فِى ٱلْأَرْضِ لِيُرِيَهُۥ كَيْفَ يُوَٰرِى سَوْءَةَ أَخِيهِ ۚ قَالَ يَـٰوَيْلَتَىٰٓ أَعَجَزْتُ أَنْ أَكُونَ مِثْلَ هَـٰذَا ٱلْغُرَابِ فَأُوَٰرِىَ سَوْءَةَ أَخِى ۖ فَأَصْبَحَ مِنَ ٱلنَّـٰدِمِينَ
    arabicPlain: فبعث الله غرابا يبحث في الأرض ليريه كيف يواري سوءة أخيه ۚ قال يا ويلتى أعجزت أن أكون مثل هذا الغراب فأواري سوءة أخي ۖ فأصبح من النادمين
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 90
    page: 112
