  data:
    ref: 5:85
    scripture: quran
    name: Quran 5:85
    chapter: 5
    verse: 85
    ordinal: 754
    text: Allah hath rewarded them for that their saying - Gardens underneath which rivers flow, wherein they will abide for ever. That is the reward of the good.
    translation: Pickthall
    original: فَأَثَـٰبَهُمُ ٱللَّهُ بِمَا قَالُوا۟ جَنَّـٰتٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ خَـٰلِدِينَ فِيهَا ۚ وَذَٰلِكَ جَزَآءُ ٱلْمُحْسِنِينَ
    arabicPlain: فأثابهم الله بما قالوا جنات تجري من تحتها الأنهار خالدين فيها ۚ وذلك جزاء المحسنين
    surahName: Al-Maaida
    juz: 7
