  data:
    ref: '5:30'
    scripture: quran
    name: Quran 5:30
    chapter: 5
    verse: 30
    ordinal: 699
    text: But (the other's) mind imposed on him the killing of his brother, so he slew him and became one of the losers.
    translation: Pickthall
    original: فَطَوَّعَتْ لَهُۥ نَفْسُهُۥ قَتْلَ أَخِيهِ فَقَتَلَهُۥ فَأَصْبَحَ مِنَ ٱلْخَـٰسِرِينَ
    arabicPlain: فطوعت له نفسه قتل أخيه فقتله فأصبح من الخاسرين
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 90
