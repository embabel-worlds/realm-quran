  data:
    ref: '5:51'
    scripture: quran
    name: Quran 5:51
    chapter: 5
    verse: 51
    ordinal: 720
    text: O ye who believe! Take not the Jews and the Christians for friends. They are friends one to another. He among you who taketh them for friends is (one) of them. Lo! Allah guideth not wrongdoing folk.
    translation: Pickthall
    original: ۞ يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ ٱلْيَهُودَ وَٱلنَّصَـٰرَىٰٓ أَوْلِيَآءَ ۘ بَعْضُهُمْ أَوْلِيَآءُ بَعْضٍ ۚ وَمَن يَتَوَلَّهُم مِّنكُمْ فَإِنَّهُۥ مِنْهُمْ ۗ إِنَّ ٱللَّهَ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّـٰلِمِينَ
    arabicPlain: ۞ يا أيها الذين آمنوا لا تتخذوا اليهود والنصارى أولياء ۘ بعضهم أولياء بعض ۚ ومن يتولهم منكم فإنه منهم ۗ إن الله لا يهدي القوم الظالمين
    surahName: Al-Maaida
    juz: 6
    manzil: 2
