  data:
    ref: '5:23'
    scripture: quran
    name: Quran 5:23
    chapter: 5
    verse: 23
    ordinal: 692
    text: 'Then out spake two of those who feared (their Lord, men) unto whom Allah had been gracious: Enter in upon them by the gate, for if ye enter by it, lo! ye will be victorious. So put your trust (in Allah) if ye are indeed believers.'
    translation: Pickthall
    original: قَالَ رَجُلَانِ مِنَ ٱلَّذِينَ يَخَافُونَ أَنْعَمَ ٱللَّهُ عَلَيْهِمَا ٱدْخُلُوا۟ عَلَيْهِمُ ٱلْبَابَ فَإِذَا دَخَلْتُمُوهُ فَإِنَّكُمْ غَـٰلِبُونَ ۚ وَعَلَى ٱللَّهِ فَتَوَكَّلُوٓا۟ إِن كُنتُم مُّؤْمِنِينَ
    arabicPlain: قال رجلان من الذين يخافون أنعم الله عليهما ادخلوا عليهم الباب فإذا دخلتموه فإنكم غالبون ۚ وعلى الله فتوكلوا إن كنتم مؤمنين
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 89
    page: 111
