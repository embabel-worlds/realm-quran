  data:
    ref: '5:42'
    scripture: quran
    name: Quran 5:42
    chapter: 5
    verse: 42
    ordinal: 711
    text: Listeners for the sake of falsehood! Greedy for illicit gain! If then they have recourse unto thee (Muhammad) judge between them or disclaim jurisdiction. If thou disclaimest jurisdiction, then they cannot harm thee at all. But if thou judgest, judge between them with equity. Lo! Allah loveth the equitable.
    translation: Pickthall
    original: سَمَّـٰعُونَ لِلْكَذِبِ أَكَّـٰلُونَ لِلسُّحْتِ ۚ فَإِن جَآءُوكَ فَٱحْكُم بَيْنَهُمْ أَوْ أَعْرِضْ عَنْهُمْ ۖ وَإِن تُعْرِضْ عَنْهُمْ فَلَن يَضُرُّوكَ شَيْـًٔا ۖ وَإِنْ حَكَمْتَ فَٱحْكُم بَيْنَهُم بِٱلْقِسْطِ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُقْسِطِينَ
    arabicPlain: سماعون للكذب أكالون للسحت ۚ فإن جاءوك فاحكم بينهم أو أعرض عنهم ۖ وإن تعرض عنهم فلن يضروك شيئا ۖ وإن حكمت فاحكم بينهم بالقسط ۚ إن الله يحب المقسطين
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 91
    page: 115
