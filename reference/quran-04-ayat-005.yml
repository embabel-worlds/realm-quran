  data:
    ref: '5:56'
    scripture: quran
    name: Quran 5:56
    chapter: 5
    verse: 56
    ordinal: 725
    text: And whoso taketh Allah and His messenger and those who believe for guardian (will know that), lo! the party of Allah, they are the victorious.
    translation: Pickthall
    original: وَمَن يَتَوَلَّ ٱللَّهَ وَرَسُولَهُۥ وَٱلَّذِينَ ءَامَنُوا۟ فَإِنَّ حِزْبَ ٱللَّهِ هُمُ ٱلْغَـٰلِبُونَ
    arabicPlain: ومن يتول الله ورسوله والذين آمنوا فإن حزب الله هم الغالبون
