  data:
    ref: 5:92
    scripture: quran
    name: Quran 5:92
    chapter: 5
    verse: 92
    ordinal: 761
    text: Obey Allah and obey the messenger, and beware! But if ye turn away, then know that the duty of Our messenger is only plain conveyance (of the message).
    translation: Pickthall
    original: وَأَطِيعُوا۟ ٱللَّهَ وَأَطِيعُوا۟ ٱلرَّسُولَ وَٱحْذَرُوا۟ ۚ فَإِن تَوَلَّيْتُمْ فَٱعْلَمُوٓا۟ أَنَّمَا عَلَىٰ رَسُولِنَا ٱلْبَلَـٰغُ ٱلْمُبِينُ
    arabicPlain: وأطيعوا الله وأطيعوا الرسول واحذروا ۚ فإن توليتم فاعلموا أنما على رسولنا البلاغ المبين
    surahName: Al-Maaida
    juz: 7
    manzil: 2
    ruku: 97
