- type: Ayah
  data:
    ref: '5:7'
    scripture: quran
    name: Quran 5:7
    chapter: 5
    verse: 7
    ordinal: 676
    text: 'Remember Allah''s grace upon you and His covenant by which He bound you when ye said: We hear and we obey; And keep your duty to Allah. Lo! He knoweth what is in the breasts (of men).'
    translation: Pickthall
    original: وَٱذْكُرُوا۟ نِعْمَةَ ٱللَّهِ عَلَيْكُمْ وَمِيثَـٰقَهُ ٱلَّذِى وَاثَقَكُم بِهِۦٓ إِذْ قُلْتُمْ سَمِعْنَا وَأَطَعْنَا ۖ وَٱتَّقُوا۟ ٱللَّهَ ۚ إِنَّ ٱللَّهَ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ
    arabicPlain: واذكروا نعمة الله عليكم وميثاقه الذي واثقكم به إذ قلتم سمعنا وأطعنا ۖ واتقوا الله ۚ إن الله عليم بذات الصدور
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 87
    page: 108
  relations:
