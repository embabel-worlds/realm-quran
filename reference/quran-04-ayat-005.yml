  data:
    ref: '5:53'
    scripture: quran
    name: Quran 5:53
    chapter: 5
    verse: 53
    ordinal: 722
    text: 'Then will the believers say (unto the people of the Scripture): are these they who swore by Allah their most binding oaths that they were surely with you? Their works have failed, and they have become the losers.'
    translation: Pickthall
    original: وَيَقُولُ ٱلَّذِينَ ءَامَنُوٓا۟ أَهَـٰٓؤُلَآءِ ٱلَّذِينَ أَقْسَمُوا۟ بِٱللَّهِ جَهْدَ أَيْمَـٰنِهِمْ ۙ إِنَّهُمْ لَمَعَكُمْ ۚ حَبِطَتْ أَعْمَـٰلُهُمْ فَأَصْبَحُوا۟ خَـٰسِرِينَ
    arabicPlain: ويقول الذين آمنوا أهؤلاء الذين أقسموا بالله جهد أيمانهم ۙ إنهم لمعكم ۚ حبطت أعمالهم فأصبحوا خاسرين
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 93
    page: 117
