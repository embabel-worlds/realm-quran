- type: Ayah
  data:
    ref: '5:4'
    scripture: quran
    name: Quran 5:4
    chapter: 5
    verse: 4
    ordinal: 673
    text: 'They ask thee (O Muhammad) what is made lawful for them. Say: (all) good things are made lawful for you. And those beasts and birds of prey which ye have trained as hounds are trained, ye teach them that which Allah taught you; so eat of that which they catch for you and mention Allah''s name upon it, and observe your duty to Allah. Lo! Allah is swift to take account.'
    translation: Pickthall
    original: يَسْـَٔلُونَكَ مَاذَآ أُحِلَّ لَهُمْ ۖ قُلْ أُحِلَّ لَكُمُ ٱلطَّيِّبَـٰتُ ۙ وَمَا عَلَّمْتُم مِّنَ ٱلْجَوَارِحِ مُكَلِّبِينَ تُعَلِّمُونَهُنَّ مِمَّا عَلَّمَكُمُ ٱللَّهُ ۖ فَكُلُوا۟ مِمَّآ أَمْسَكْنَ عَلَيْكُمْ وَٱذْكُرُوا۟ ٱسْمَ ٱللَّهِ عَلَيْهِ ۖ وَٱتَّقُوا۟ ٱللَّهَ ۚ إِنَّ ٱللَّهَ سَرِيعُ ٱلْحِسَابِ
    arabicPlain: يسألونك ماذا أحل لهم ۖ قل أحل لكم الطيبات ۙ وما علمتم من الجوارح مكلبين تعلمونهن مما علمكم الله ۖ فكلوا مما أمسكن عليكم واذكروا اسم الله عليه ۖ واتقوا الله ۚ إن الله سريع الحساب
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 86
    page: 107
  relations:
