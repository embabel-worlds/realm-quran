  data:
    ref: 5:63
    scripture: quran
    name: Quran 5:63
    chapter: 5
    verse: 63
    ordinal: 732
    text: Why do not the rabbis and the priests forbid their evil-speaking and their devouring of illicit gain? Verily evil is their handiwork.
    translation: Pickthall
    original: لَوْلَا يَنْهَىٰهُمُ ٱلرَّبَّـٰنِيُّونَ وَٱلْأَحْبَارُ عَن قَوْلِهِمُ ٱلْإِثْمَ وَأَكْلِهِمُ ٱلسُّحْتَ ۚ لَبِئْسَ مَا كَانُوا۟ يَصْنَعُونَ
    arabicPlain: لولا ينهاهم الربانيون والأحبار عن قولهم الإثم وأكلهم السحت ۚ لبئس ما كانوا يصنعون
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 94
    page: 118
  relations:
