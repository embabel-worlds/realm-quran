  data:
    ref: 5:78
    scripture: quran
    name: Quran 5:78
    chapter: 5
    verse: 78
    ordinal: 747
    text: Those of the Children of Israel who went astray were cursed by the tongue of David, and of Jesus, son of Mary. That was because they rebelled and used to transgress.
    translation: Pickthall
    original: لُعِنَ ٱلَّذِينَ كَفَرُوا۟ مِنۢ بَنِىٓ إِسْرَٰٓءِيلَ عَلَىٰ لِسَانِ دَاوُۥدَ وَعِيسَى ٱبْنِ مَرْيَمَ ۚ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ
    arabicPlain: لعن الذين كفروا من بني إسرائيل على لسان داوود وعيسى ابن مريم ۚ ذلك بما عصوا وكانوا يعتدون
