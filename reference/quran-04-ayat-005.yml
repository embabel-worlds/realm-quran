  data:
    ref: '5:37'
    scripture: quran
    name: Quran 5:37
    chapter: 5
    verse: 37
    ordinal: 706
    text: They will wish to come forth from the Fire, but they will not come forth from it. Theirs will be a lasting doom.
    translation: Pickthall
    original: يُرِيدُونَ أَن يَخْرُجُوا۟ مِنَ ٱلنَّارِ وَمَا هُم بِخَـٰرِجِينَ مِنْهَا ۖ وَلَهُمْ عَذَابٌ مُّقِيمٌ
    arabicPlain: يريدون أن يخرجوا من النار وما هم بخارجين منها ۖ ولهم عذاب مقيم
