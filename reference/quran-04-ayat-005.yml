  data:
    ref: '5:21'
    scripture: quran
    name: Quran 5:21
    chapter: 5
    verse: 21
    ordinal: 690
    text: 'O my people! Go into the holy land which Allah hath ordained for you. Turn not in flight, for surely ye turn back as losers:'
    translation: Pickthall
    original: يَـٰقَوْمِ ٱدْخُلُوا۟ ٱلْأَرْضَ ٱلْمُقَدَّسَةَ ٱلَّتِى كَتَبَ ٱللَّهُ لَكُمْ وَلَا تَرْتَدُّوا۟ عَلَىٰٓ أَدْبَارِكُمْ فَتَنقَلِبُوا۟ خَـٰسِرِينَ
    arabicPlain: يا قوم ادخلوا الأرض المقدسة التي كتب الله لكم ولا ترتدوا على أدباركم فتنقلبوا خاسرين
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 89
