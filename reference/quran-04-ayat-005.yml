  data:
    ref: 5:119
    scripture: quran
    name: Quran 5:119
    chapter: 5
    verse: 119
    ordinal: 788
    text: 'Allah saith: This is a day in which their truthfulness profiteth the truthful, for theirs are Gardens underneath which rivers flow, wherein they are secure for ever, Allah taking pleasure in them and they in Him. That is the great triumph.'
    translation: Pickthall
    original: قَالَ ٱللَّهُ هَـٰذَا يَوْمُ يَنفَعُ ٱلصَّـٰدِقِينَ صِدْقُهُمْ ۚ لَهُمْ جَنَّـٰتٌ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ خَـٰلِدِينَ فِيهَآ أَبَدًا ۚ رَّضِىَ ٱللَّهُ عَنْهُمْ وَرَضُوا۟ عَنْهُ ۚ ذَٰلِكَ ٱلْفَوْزُ ٱلْعَظِيمُ
    arabicPlain: قال الله هذا يوم ينفع الصادقين صدقهم ۚ لهم جنات تجري من تحتها الأنهار خالدين فيها أبدا ۚ رضي الله عنهم ورضوا عنه ۚ ذلك الفوز العظيم
    surahName: Al-Maaida
    juz: 7
    manzil: 2
    ruku: 101
    page: 127
