  data:
    ref: 5:61
    scripture: quran
    name: Quran 5:61
    chapter: 5
    verse: 61
    ordinal: 730
    text: 'When they come unto you (Muslims), they say: We believe; but they came in unbelief and they went out in the same; and Allah knoweth best what they were hiding.'
    translation: Pickthall
    original: وَإِذَا جَآءُوكُمْ قَالُوٓا۟ ءَامَنَّا وَقَد دَّخَلُوا۟ بِٱلْكُفْرِ وَهُمْ قَدْ خَرَجُوا۟ بِهِۦ ۚ وَٱللَّهُ أَعْلَمُ بِمَا كَانُوا۟ يَكْتُمُونَ
    arabicPlain: وإذا جاءوكم قالوا آمنا وقد دخلوا بالكفر وهم قد خرجوا به ۚ والله أعلم بما كانوا يكتمون
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 94
    page: 118
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '5'
  - predicate: IN_PORTION
    to:
      type: Juz
