  data:
    ref: 5:71
    scripture: quran
    name: Quran 5:71
    chapter: 5
    verse: 71
    ordinal: 740
    text: They thought no harm would come of it, so they were wilfully blind and deaf. And afterward Allah turned (in mercy) toward them. Now (even after that) are many of them wilfully blind and deaf. Allah is Seer of what they do.
    translation: Pickthall
    original: وَحَسِبُوٓا۟ أَلَّا تَكُونَ فِتْنَةٌ فَعَمُوا۟ وَصَمُّوا۟ ثُمَّ تَابَ ٱللَّهُ عَلَيْهِمْ ثُمَّ عَمُوا۟ وَصَمُّوا۟ كَثِيرٌ مِّنْهُمْ ۚ وَٱللَّهُ بَصِيرٌۢ بِمَا يَعْمَلُونَ
    arabicPlain: وحسبوا ألا تكون فتنة فعموا وصموا ثم تاب الله عليهم ثم عموا وصموا كثير منهم ۚ والله بصير بما يعملون
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 95
    page: 120
