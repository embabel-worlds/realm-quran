  data:
    ref: 5:115
    scripture: quran
    name: Quran 5:115
    chapter: 5
    verse: 115
    ordinal: 784
    text: 'Allah said: Lo! I send it down for you. And whoso disbelieveth of you afterward, him surely will I punish with a punishment wherewith I have not punished any of (My) creatures.'
    translation: Pickthall
    original: قَالَ ٱللَّهُ إِنِّى مُنَزِّلُهَا عَلَيْكُمْ ۖ فَمَن يَكْفُرْ بَعْدُ مِنكُمْ فَإِنِّىٓ أُعَذِّبُهُۥ عَذَابًا لَّآ أُعَذِّبُهُۥٓ أَحَدًا مِّنَ ٱلْعَـٰلَمِينَ
    arabicPlain: قال الله إني منزلها عليكم ۖ فمن يكفر بعد منكم فإني أعذبه عذابا لا أعذبه أحدا من العالمين
    surahName: Al-Maaida
    juz: 7
    manzil: 2
    ruku: 100
