  data:
    ref: 5:75
    scripture: quran
    name: Quran 5:75
    chapter: 5
    verse: 75
    ordinal: 744
    text: The Messiah, son of Mary, was no other than a messenger, messengers (the like of whom) had passed away before him. And his mother was a saintly woman. And they both used to eat (earthly) food. See how We make the revelations clear for them, and see how they are turned away!
    translation: Pickthall
    original: مَّا ٱلْمَسِيحُ ٱبْنُ مَرْيَمَ إِلَّا رَسُولٌ قَدْ خَلَتْ مِن قَبْلِهِ ٱلرُّسُلُ وَأُمُّهُۥ صِدِّيقَةٌ ۖ كَانَا يَأْكُلَانِ ٱلطَّعَامَ ۗ ٱنظُرْ كَيْفَ نُبَيِّنُ لَهُمُ ٱلْـَٔايَـٰتِ ثُمَّ ٱنظُرْ أَنَّىٰ يُؤْفَكُونَ
    arabicPlain: ما المسيح ابن مريم إلا رسول قد خلت من قبله الرسل وأمه صديقة ۖ كانا يأكلان الطعام ۗ انظر كيف نبين لهم الآيات ثم انظر أنى يؤفكون
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 95
    page: 120
