    scripture: quran
    name: Quran 5:102
    chapter: 5
    verse: 102
    ordinal: 771
    text: A folk before you asked (for such disclosures) and then disbelieved therein.
    translation: Pickthall
    original: قَدْ سَأَلَهَا قَوْمٌ مِّن قَبْلِكُمْ ثُمَّ أَصْبَحُوا۟ بِهَا كَـٰفِرِينَ
