  data:
    ref: 5:104
    scripture: quran
    name: Quran 5:104
    chapter: 5
    verse: 104
    ordinal: 773
    text: 'And when it is said unto them: Come unto that which Allah hath revealed and unto the messenger, they say: Enough for us is that wherein we found our fathers. What! Even though their fathers had no knowledge whatsoever, and no guidance?'
    translation: Pickthall
    original: وَإِذَا قِيلَ لَهُمْ تَعَالَوْا۟ إِلَىٰ مَآ أَنزَلَ ٱللَّهُ وَإِلَى ٱلرَّسُولِ قَالُوا۟ حَسْبُنَا مَا وَجَدْنَا عَلَيْهِ ءَابَآءَنَآ ۚ أَوَلَوْ كَانَ ءَابَآؤُهُمْ لَا يَعْلَمُونَ شَيْـًٔا وَلَا يَهْتَدُونَ
    arabicPlain: وإذا قيل لهم تعالوا إلى ما أنزل الله وإلى الرسول قالوا حسبنا ما وجدنا عليه آباءنا ۚ أولو كان آباؤهم لا يعلمون شيئا ولا يهتدون
    surahName: Al-Maaida
    juz: 7
    manzil: 2
    ruku: 99
