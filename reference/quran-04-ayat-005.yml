  data:
    ref: '5:28'
    scripture: quran
    name: Quran 5:28
    chapter: 5
    verse: 28
    ordinal: 697
    text: Even if thou stretch out thy hand against me to kill me, I shall not stretch out my hand against thee to kill thee, lo! I fear Allah, the Lord of the Worlds.
    translation: Pickthall
    original: لَئِنۢ بَسَطتَ إِلَىَّ يَدَكَ لِتَقْتُلَنِى مَآ أَنَا۠ بِبَاسِطٍ يَدِىَ إِلَيْكَ لِأَقْتُلَكَ ۖ إِنِّىٓ أَخَافُ ٱللَّهَ رَبَّ ٱلْعَـٰلَمِينَ
    arabicPlain: لئن بسطت إلي يدك لتقتلني ما أنا بباسط يدي إليك لأقتلك ۖ إني أخاف الله رب العالمين
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 90
