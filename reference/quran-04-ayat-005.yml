  data:
    ref: '5:35'
    scripture: quran
    name: Quran 5:35
    chapter: 5
    verse: 35
    ordinal: 704
    text: O ye who believe! Be mindful of your duty to Allah, and seek the way of approach unto Him, and strive in His way in order that ye may succeed.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَٱبْتَغُوٓا۟ إِلَيْهِ ٱلْوَسِيلَةَ وَجَـٰهِدُوا۟ فِى سَبِيلِهِۦ لَعَلَّكُمْ تُفْلِحُونَ
    arabicPlain: يا أيها الذين آمنوا اتقوا الله وابتغوا إليه الوسيلة وجاهدوا في سبيله لعلكم تفلحون
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 91
    page: 113
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '5'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-6
- type: Ayah
  data:
    ref: '5:36'
    scripture: quran
    name: Quran 5:36
    chapter: 5
    verse: 36
    ordinal: 705
    text: As for those who disbelieve, lo! if all that is in the earth were theirs, and as much again therewith, to ransom them from the doom on the Day of Resurrection, it would not be accepted from them. Theirs will be a painful doom.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ كَفَرُوا۟ لَوْ أَنَّ لَهُم مَّا فِى ٱلْأَرْضِ جَمِيعًا وَمِثْلَهُۥ مَعَهُۥ لِيَفْتَدُوا۟ بِهِۦ مِنْ عَذَابِ يَوْمِ ٱلْقِيَـٰمَةِ مَا تُقُبِّلَ مِنْهُمْ ۖ وَلَهُمْ عَذَابٌ أَلِيمٌ
    arabicPlain: إن الذين كفروا لو أن لهم ما في الأرض جميعا ومثله معه ليفتدوا به من عذاب يوم القيامة ما تقبل منهم ۖ ولهم عذاب أليم
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 91
    page: 113
  relations:
