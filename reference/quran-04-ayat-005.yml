  data:
    ref: '5:24'
    scripture: quran
    name: Quran 5:24
    chapter: 5
    verse: 24
    ordinal: 693
    text: 'They said: O Moses! We will never enter (the land) while they are in it. So go thou and thy Lord and fight! We will sit here.'
    translation: Pickthall
    original: قَالُوا۟ يَـٰمُوسَىٰٓ إِنَّا لَن نَّدْخُلَهَآ أَبَدًا مَّا دَامُوا۟ فِيهَا ۖ فَٱذْهَبْ أَنتَ وَرَبُّكَ فَقَـٰتِلَآ إِنَّا هَـٰهُنَا قَـٰعِدُونَ
    arabicPlain: قالوا يا موسى إنا لن ندخلها أبدا ما داموا فيها ۖ فاذهب أنت وربك فقاتلا إنا هاهنا قاعدون
    surahName: Al-Maaida
