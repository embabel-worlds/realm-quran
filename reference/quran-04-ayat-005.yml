  data:
    ref: 5:74
    scripture: quran
    name: Quran 5:74
    chapter: 5
    verse: 74
    ordinal: 743
    text: Will they not rather turn unto Allah and seek forgiveness of Him? For Allah is Forgiving, Merciful.
    translation: Pickthall
    original: أَفَلَا يَتُوبُونَ إِلَى ٱللَّهِ وَيَسْتَغْفِرُونَهُۥ ۚ وَٱللَّهُ غَفُورٌ رَّحِيمٌ
    arabicPlain: أفلا يتوبون إلى الله ويستغفرونه ۚ والله غفور رحيم
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 95
