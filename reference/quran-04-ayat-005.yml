  data:
    ref: 5:99
    scripture: quran
    name: Quran 5:99
    chapter: 5
    verse: 99
    ordinal: 768
    text: The duty of the messenger is only to convey (the message). Allah knoweth what ye proclaim and what ye hide.
    translation: Pickthall
    original: مَّا عَلَى ٱلرَّسُولِ إِلَّا ٱلْبَلَـٰغُ ۗ وَٱللَّهُ يَعْلَمُ مَا تُبْدُونَ وَمَا تَكْتُمُونَ
