  data:
    ref: '5:47'
    scripture: quran
    name: Quran 5:47
    chapter: 5
    verse: 47
    ordinal: 716
    text: 'Let the People of the Gospel judge by that which Allah hath revealed therein. Whoso judgeth not by that which Allah hath revealed: such are evil-livers.'
    translation: Pickthall
    original: وَلْيَحْكُمْ أَهْلُ ٱلْإِنجِيلِ بِمَآ أَنزَلَ ٱللَّهُ فِيهِ ۚ وَمَن لَّمْ يَحْكُم بِمَآ أَنزَلَ ٱللَّهُ فَأُو۟لَـٰٓئِكَ هُمُ ٱلْفَـٰسِقُونَ
    arabicPlain: وليحكم أهل الإنجيل بما أنزل الله فيه ۚ ومن لم يحكم بما أنزل الله فأولئك هم الفاسقون
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 92
    page: 116
