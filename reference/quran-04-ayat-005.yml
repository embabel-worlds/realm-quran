  data:
    ref: 5:111
    scripture: quran
    name: Quran 5:111
    chapter: 5
    verse: 111
    ordinal: 780
    text: 'And when I inspired the disciples, (saying): Believe in Me and in My messenger, they said: We believe. Bear witness that we have surrendered (unto Thee) "we are muslims".'
    translation: Pickthall
    original: وَإِذْ أَوْحَيْتُ إِلَى ٱلْحَوَارِيِّـۧنَ أَنْ ءَامِنُوا۟ بِى وَبِرَسُولِى قَالُوٓا۟ ءَامَنَّا وَٱشْهَدْ بِأَنَّنَا مُسْلِمُونَ
    arabicPlain: وإذ أوحيت إلى الحواريين أن آمنوا بي وبرسولي قالوا آمنا واشهد بأننا مسلمون
    surahName: Al-Maaida
    juz: 7
    manzil: 2
    ruku: 100
