  data:
    ref: 5:86
    scripture: quran
    name: Quran 5:86
    chapter: 5
    verse: 86
    ordinal: 755
    text: But those who disbelieve and deny Our revelations, they are owners of hell-fire.
    translation: Pickthall
    original: وَٱلَّذِينَ كَفَرُوا۟ وَكَذَّبُوا۟ بِـَٔايَـٰتِنَآ أُو۟لَـٰٓئِكَ أَصْحَـٰبُ ٱلْجَحِيمِ
    arabicPlain: والذين كفروا وكذبوا بآياتنا أولئك أصحاب الجحيم
