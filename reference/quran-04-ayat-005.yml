  data:
    ref: 5:60
    scripture: quran
    name: Quran 5:60
    chapter: 5
    verse: 60
    ordinal: 729
    text: Shall I tell thee of a worse (case) than theirs for retribution with Allah? (Worse is the case of him) whom Allah hath cursed, him on whom His wrath hath fallen and of whose sort Allah hath turned some to apes and swine, and who serveth idols. Such are in worse plight and further astray from the plain road.
    translation: Pickthall
    original: قُلْ هَلْ أُنَبِّئُكُم بِشَرٍّ مِّن ذَٰلِكَ مَثُوبَةً عِندَ ٱللَّهِ ۚ مَن لَّعَنَهُ ٱللَّهُ وَغَضِبَ عَلَيْهِ وَجَعَلَ مِنْهُمُ ٱلْقِرَدَةَ وَٱلْخَنَازِيرَ وَعَبَدَ ٱلطَّـٰغُوتَ ۚ أُو۟لَـٰٓئِكَ شَرٌّ مَّكَانًا وَأَضَلُّ عَن سَوَآءِ ٱلسَّبِيلِ
    arabicPlain: قل هل أنبئكم بشر من ذلك مثوبة عند الله ۚ من لعنه الله وغضب عليه وجعل منهم القردة والخنازير وعبد الطاغوت ۚ أولئك شر مكانا وأضل عن سواء السبيل
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 94
    page: 118
  relations:
