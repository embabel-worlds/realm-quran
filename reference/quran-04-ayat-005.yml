    name: Quran 5:50
    chapter: 5
    verse: 50
    ordinal: 719
    text: Is it a judgment of the time of (pagan) ignorance that they are seeking? Who is better than Allah for judgment to a people who have certainty (in their belief)?
    translation: Pickthall
    original: أَفَحُكْمَ ٱلْجَـٰهِلِيَّةِ يَبْغُونَ ۚ وَمَنْ أَحْسَنُ مِنَ ٱللَّهِ حُكْمًا لِّقَوْمٍ يُوقِنُونَ
    arabicPlain: أفحكم الجاهلية يبغون ۚ ومن أحسن من الله حكما لقوم يوقنون
