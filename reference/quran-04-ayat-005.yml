  data:
    ref: 5:117
    scripture: quran
    name: Quran 5:117
    chapter: 5
    verse: 117
    ordinal: 786
    text: 'I spake unto them only that which Thou commandedst me, (saying): Worship Allah, my Lord and your Lord. I was a witness of them while I dwelt among them, and when Thou tookest me Thou wast the Watcher over them. Thou art Witness over all things.'
    translation: Pickthall
    original: مَا قُلْتُ لَهُمْ إِلَّا مَآ أَمَرْتَنِى بِهِۦٓ أَنِ ٱعْبُدُوا۟ ٱللَّهَ رَبِّى وَرَبَّكُمْ ۚ وَكُنتُ عَلَيْهِمْ شَهِيدًا مَّا دُمْتُ فِيهِمْ ۖ فَلَمَّا تَوَفَّيْتَنِى كُنتَ أَنتَ ٱلرَّقِيبَ عَلَيْهِمْ ۚ وَأَنتَ عَلَىٰ كُلِّ شَىْءٍ شَهِيدٌ
    arabicPlain: ما قلت لهم إلا ما أمرتني به أن اعبدوا الله ربي وربكم ۚ وكنت عليهم شهيدا ما دمت فيهم ۖ فلما توفيتني كنت أنت الرقيب عليهم ۚ وأنت على كل شيء شهيد
    surahName: Al-Maaida
    juz: 7
    manzil: 2
    ruku: 101
