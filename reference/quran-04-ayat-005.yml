  data:
    ref: 5:73
    scripture: quran
    name: Quran 5:73
    chapter: 5
    verse: 73
    ordinal: 742
    text: 'They surely disbelieve who say: Lo! Allah is the third of three; when there is no Allah save the One Allah. If they desist not from so saying a painful doom will fall on those of them who disbelieve.'
    translation: Pickthall
    original: لَّقَدْ كَفَرَ ٱلَّذِينَ قَالُوٓا۟ إِنَّ ٱللَّهَ ثَالِثُ ثَلَـٰثَةٍ ۘ وَمَا مِنْ إِلَـٰهٍ إِلَّآ إِلَـٰهٌ وَٰحِدٌ ۚ وَإِن لَّمْ يَنتَهُوا۟ عَمَّا يَقُولُونَ لَيَمَسَّنَّ ٱلَّذِينَ كَفَرُوا۟ مِنْهُمْ عَذَابٌ أَلِيمٌ
    arabicPlain: لقد كفر الذين قالوا إن الله ثالث ثلاثة ۘ وما من إله إلا إله واحد ۚ وإن لم ينتهوا عما يقولون ليمسن الذين كفروا منهم عذاب أليم
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 95
