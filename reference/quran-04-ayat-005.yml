  data:
    ref: 5:84
    scripture: quran
    name: Quran 5:84
    chapter: 5
    verse: 84
    ordinal: 753
    text: How should we not believe in Allah and that which hath come unto us of the Truth. And (how should we not) hope that our Lord will bring us in along with righteous folk?
    translation: Pickthall
    original: وَمَا لَنَا لَا نُؤْمِنُ بِٱللَّهِ وَمَا جَآءَنَا مِنَ ٱلْحَقِّ وَنَطْمَعُ أَن يُدْخِلَنَا رَبُّنَا مَعَ ٱلْقَوْمِ ٱلصَّـٰلِحِينَ
    arabicPlain: وما لنا لا نؤمن بالله وما جاءنا من الحق ونطمع أن يدخلنا ربنا مع القوم الصالحين
    surahName: Al-Maaida
    juz: 7
