  data:
    ref: '5:59'
    scripture: quran
    name: Quran 5:59
    chapter: 5
    verse: 59
    ordinal: 728
    text: 'Say: O People of the Scripture! Do ye blame us for aught else than that we believe in Allah and that which is revealed unto us and that which was revealed aforetime, and because most of you are evil-livers?'
    translation: Pickthall
    original: قُلْ يَـٰٓأَهْلَ ٱلْكِتَـٰبِ هَلْ تَنقِمُونَ مِنَّآ إِلَّآ أَنْ ءَامَنَّا بِٱللَّهِ وَمَآ أُنزِلَ إِلَيْنَا وَمَآ أُنزِلَ مِن قَبْلُ وَأَنَّ أَكْثَرَكُمْ فَـٰسِقُونَ
    arabicPlain: قل يا أهل الكتاب هل تنقمون منا إلا أن آمنا بالله وما أنزل إلينا وما أنزل من قبل وأن أكثركم فاسقون
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 94
    page: 118
