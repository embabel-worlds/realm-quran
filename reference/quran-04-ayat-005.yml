  data:
    ref: '5:58'
    scripture: quran
    name: Quran 5:58
    chapter: 5
    verse: 58
    ordinal: 727
    text: And when ye call to prayer they take it for a jest and sport. That is because they are a folk who understand not.
    translation: Pickthall
    original: وَإِذَا نَادَيْتُمْ إِلَى ٱلصَّلَوٰةِ ٱتَّخَذُوهَا هُزُوًا وَلَعِبًا ۚ ذَٰلِكَ بِأَنَّهُمْ قَوْمٌ لَّا يَعْقِلُونَ
    arabicPlain: وإذا ناديتم إلى الصلاة اتخذوها هزوا ولعبا ۚ ذلك بأنهم قوم لا يعقلون
    surahName: Al-Maaida
