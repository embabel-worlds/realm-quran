  data:
    ref: '5:18'
    scripture: quran
    name: Quran 5:18
    chapter: 5
    verse: 18
    ordinal: 687
    text: 'The Jews and Christians say: We are sons of Allah and His loved ones. Say: Why then doth He chastise you for your sins? Nay, ye are but mortals of His creating. He forgiveth whom He will, and chastiseth whom He will. Allah''s is the Sovereignty of the heavens and the earth and all that is between them, and unto Him is the journeying.'
    translation: Pickthall
    original: وَقَالَتِ ٱلْيَهُودُ وَٱلنَّصَـٰرَىٰ نَحْنُ أَبْنَـٰٓؤُا۟ ٱللَّهِ وَأَحِبَّـٰٓؤُهُۥ ۚ قُلْ فَلِمَ يُعَذِّبُكُم بِذُنُوبِكُم ۖ بَلْ أَنتُم بَشَرٌ مِّمَّنْ خَلَقَ ۚ يَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ ۚ وَلِلَّهِ مُلْكُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَمَا بَيْنَهُمَا ۖ وَإِلَيْهِ ٱلْمَصِيرُ
    arabicPlain: وقالت اليهود والنصارى نحن أبناء الله وأحباؤه ۚ قل فلم يعذبكم بذنوبكم ۖ بل أنتم بشر ممن خلق ۚ يغفر لمن يشاء ويعذب من يشاء ۚ ولله ملك السماوات والأرض وما بينهما ۖ وإليه المصير
    surahName: Al-Maaida
    juz: 6
    manzil: 2
    ruku: 88
    page: 111
