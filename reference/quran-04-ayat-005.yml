    scripture: quran
    name: Quran 5:40
    chapter: 5
    verse: 40
    ordinal: 709
    text: Knowest thou not that unto Allah belongeth the Sovereignty of the heavens and the earth? He punisheth whom He will, and forgiveth whom He will. Allah is Able to do all things.
    translation: Pickthall
    original: أَلَمْ تَعْلَمْ أَنَّ ٱللَّهَ لَهُۥ مُلْكُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ يُعَذِّبُ مَن يَشَآءُ وَيَغْفِرُ لِمَن يَشَآءُ ۗ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ
    arabicPlain: ألم تعلم أن الله له ملك السماوات والأرض يعذب من يشاء ويغفر لمن يشاء ۗ والله على كل شيء قدير
