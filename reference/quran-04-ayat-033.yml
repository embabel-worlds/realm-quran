  data:
    ref: '33:52'
    scripture: quran
    name: Quran 33:52
    chapter: 33
    verse: 52
    ordinal: 3585
    text: It is not allowed thee to take (other) women henceforth, nor that thou shouldst change them for other wives even though their beauty pleased thee, save those whom thy right hand possesseth. And Allah is ever Watcher over all things.
    translation: Pickthall
    original: لَّا يَحِلُّ لَكَ ٱلنِّسَآءُ مِنۢ بَعْدُ وَلَآ أَن تَبَدَّلَ بِهِنَّ مِنْ أَزْوَٰجٍ وَلَوْ أَعْجَبَكَ حُسْنُهُنَّ إِلَّا مَا مَلَكَتْ يَمِينُكَ ۗ وَكَانَ ٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ رَّقِيبًا
    arabicPlain: لا يحل لك النساء من بعد ولا أن تبدل بهن من أزواج ولو أعجبك حسنهن إلا ما ملكت يمينك ۗ وكان الله على كل شيء رقيبا
    surahName: Al-Ahzaab
    juz: 22
    manzil: 5
    ruku: 366
    page: 425
