  data:
    ref: '33:16'
    scripture: quran
    name: Quran 33:16
    chapter: 33
    verse: 16
    ordinal: 3549
    text: 'Say: Flight will not avail you if ye flee from death or killing, and then ye dwell in comfort but a little while.'
    translation: Pickthall
    original: قُل لَّن يَنفَعَكُمُ ٱلْفِرَارُ إِن فَرَرْتُم مِّنَ ٱلْمَوْتِ أَوِ ٱلْقَتْلِ وَإِذًا لَّا تُمَتَّعُونَ إِلَّا قَلِيلًا
    arabicPlain: قل لن ينفعكم الفرار إن فررتم من الموت أو القتل وإذا لا تمتعون إلا قليلا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 362
    page: 420
