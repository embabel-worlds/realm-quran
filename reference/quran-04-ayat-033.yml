    scripture: quran
    name: Quran 33:2
    chapter: 33
    verse: 2
    ordinal: 3535
    text: And follow that which is inspired in thee from thy Lord. Lo! Allah is Aware of what ye do.
    translation: Pickthall
    original: وَٱتَّبِعْ مَا يُوحَىٰٓ إِلَيْكَ مِن رَّبِّكَ ۚ إِنَّ ٱللَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيرًا
    arabicPlain: واتبع ما يوحى إليك من ربك ۚ إن الله كان بما تعملون خبيرا
