  data:
    ref: '33:17'
    scripture: quran
    name: Quran 33:17
    chapter: 33
    verse: 17
    ordinal: 3550
    text: 'Say: Who is he who can preserve you from Allah if He intendeth harm for you, or intendeth mercy for you. They will not find that they have any friend or helper other than Allah.'
    translation: Pickthall
    original: قُلْ مَن ذَا ٱلَّذِى يَعْصِمُكُم مِّنَ ٱللَّهِ إِنْ أَرَادَ بِكُمْ سُوٓءًا أَوْ أَرَادَ بِكُمْ رَحْمَةً ۚ وَلَا يَجِدُونَ لَهُم مِّن دُونِ ٱللَّهِ وَلِيًّا وَلَا نَصِيرًا
    arabicPlain: قل من ذا الذي يعصمكم من الله إن أراد بكم سوءا أو أراد بكم رحمة ۚ ولا يجدون لهم من دون الله وليا ولا نصيرا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 362
    page: 420
