  data:
    ref: '33:59'
    scripture: quran
    name: Quran 33:59
    chapter: 33
    verse: 59
    ordinal: 3592
    text: O Prophet! Tell thy wives and thy daughters and the women of the believers to draw their cloaks close round them (when they go abroad). That will be better, so that they may be recognised and not annoyed. Allah is ever Forgiving, Merciful.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلنَّبِىُّ قُل لِّأَزْوَٰجِكَ وَبَنَاتِكَ وَنِسَآءِ ٱلْمُؤْمِنِينَ يُدْنِينَ عَلَيْهِنَّ مِن جَلَـٰبِيبِهِنَّ ۚ ذَٰلِكَ أَدْنَىٰٓ أَن يُعْرَفْنَ فَلَا يُؤْذَيْنَ ۗ وَكَانَ ٱللَّهُ غَفُورًا رَّحِيمًا
    arabicPlain: يا أيها النبي قل لأزواجك وبناتك ونساء المؤمنين يدنين عليهن من جلابيبهن ۚ ذلك أدنى أن يعرفن فلا يؤذين ۗ وكان الله غفورا رحيما
    surahName: Al-Ahzaab
    juz: 22
    manzil: 5
    ruku: 368
    page: 426
