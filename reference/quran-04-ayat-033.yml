  data:
    ref: '33:13'
    scripture: quran
    name: Quran 33:13
    chapter: 33
    verse: 13
    ordinal: 3546
    text: 'And when a party of them said: O folk of Yathrib! There is no stand (possible) for you, therefor turn back. And certain of them (even) sought permission of the Prophet, saying: Our homes lie open (to the enemy). And they lay not open. They but wished to flee.'
    translation: Pickthall
    original: وَإِذْ قَالَت طَّآئِفَةٌ مِّنْهُمْ يَـٰٓأَهْلَ يَثْرِبَ لَا مُقَامَ لَكُمْ فَٱرْجِعُوا۟ ۚ وَيَسْتَـْٔذِنُ فَرِيقٌ مِّنْهُمُ ٱلنَّبِىَّ يَقُولُونَ إِنَّ بُيُوتَنَا عَوْرَةٌ وَمَا هِىَ بِعَوْرَةٍ ۖ إِن يُرِيدُونَ إِلَّا فِرَارًا
    arabicPlain: وإذ قالت طائفة منهم يا أهل يثرب لا مقام لكم فارجعوا ۚ ويستأذن فريق منهم النبي يقولون إن بيوتنا عورة وما هي بعورة ۖ إن يريدون إلا فرارا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 362
    page: 419
  relations:
