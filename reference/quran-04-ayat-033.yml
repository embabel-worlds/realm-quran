  data:
    ref: '33:46'
    scripture: quran
    name: Quran 33:46
    chapter: 33
    verse: 46
    ordinal: 3579
    text: And as a summoner unto Allah by His permission, and as a lamp that giveth light.
    translation: Pickthall
    original: وَدَاعِيًا إِلَى ٱللَّهِ بِإِذْنِهِۦ وَسِرَاجًا مُّنِيرًا
    arabicPlain: وداعيا إلى الله بإذنه وسراجا منيرا
