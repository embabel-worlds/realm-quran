  data:
    ref: '33:28'
    scripture: quran
    name: Quran 33:28
    chapter: 33
    verse: 28
    ordinal: 3561
    text: 'O Prophet! Say unto thy wives: If ye desire the world''s life and its adornment, come! I will content you and will release you with a fair release.'
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلنَّبِىُّ قُل لِّأَزْوَٰجِكَ إِن كُنتُنَّ تُرِدْنَ ٱلْحَيَوٰةَ ٱلدُّنْيَا وَزِينَتَهَا فَتَعَالَيْنَ أُمَتِّعْكُنَّ وَأُسَرِّحْكُنَّ سَرَاحًا جَمِيلًا
    arabicPlain: يا أيها النبي قل لأزواجك إن كنتن تردن الحياة الدنيا وزينتها فتعالين أمتعكن وأسرحكن سراحا جميلا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 364
    page: 421
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '33'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-21
- type: Ayah
  data:
    ref: '33:29'
    scripture: quran
    name: Quran 33:29
    chapter: 33
    verse: 29
    ordinal: 3562
    text: But if ye desire Allah and His messenger and the abode of the Hereafter, then lo! Allah hath prepared for the good among you an immense reward.
    translation: Pickthall
    original: وَإِن كُنتُنَّ تُرِدْنَ ٱللَّهَ وَرَسُولَهُۥ وَٱلدَّارَ ٱلْـَٔاخِرَةَ فَإِنَّ ٱللَّهَ أَعَدَّ لِلْمُحْسِنَـٰتِ مِنكُنَّ أَجْرًا عَظِيمًا
    arabicPlain: وإن كنتن تردن الله ورسوله والدار الآخرة فإن الله أعد للمحسنات منكن أجرا عظيما
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 364
    page: 421
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '33'
  - predicate: IN_PORTION
    to:
