- type: Ayah
  data:
    ref: '33:5'
    scripture: quran
    name: Quran 33:5
    chapter: 33
    verse: 5
    ordinal: 3538
    text: Proclaim their real parentage. That will be more equitable in the sight of Allah. And if ye know not their fathers, then (they are) your brethren in the faith, and your clients. And there is no sin for you in the mistakes that ye make unintentionally, but what your hearts purpose (that will be a sin for you). Allah is ever Forgiving, Merciful.
    translation: Pickthall
    original: ٱدْعُوهُمْ لِـَٔابَآئِهِمْ هُوَ أَقْسَطُ عِندَ ٱللَّهِ ۚ فَإِن لَّمْ تَعْلَمُوٓا۟ ءَابَآءَهُمْ فَإِخْوَٰنُكُمْ فِى ٱلدِّينِ وَمَوَٰلِيكُمْ ۚ وَلَيْسَ عَلَيْكُمْ جُنَاحٌ فِيمَآ أَخْطَأْتُم بِهِۦ وَلَـٰكِن مَّا تَعَمَّدَتْ قُلُوبُكُمْ ۚ وَكَانَ ٱللَّهُ غَفُورًا رَّحِيمًا
    arabicPlain: ادعوهم لآبائهم هو أقسط عند الله ۚ فإن لم تعلموا آباءهم فإخوانكم في الدين ومواليكم ۚ وليس عليكم جناح فيما أخطأتم به ولكن ما تعمدت قلوبكم ۚ وكان الله غفورا رحيما
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 361
