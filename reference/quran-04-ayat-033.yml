- type: Ayah
  data:
    ref: '33:7'
    scripture: quran
    name: Quran 33:7
    chapter: 33
    verse: 7
    ordinal: 3540
    text: And when We exacted a covenant from the prophets, and from thee (O Muhammad) and from Noah and Abraham and Moses and Jesus son of Mary. We took from them a solemn covenant;
    translation: Pickthall
    original: وَإِذْ أَخَذْنَا مِنَ ٱلنَّبِيِّـۧنَ مِيثَـٰقَهُمْ وَمِنكَ وَمِن نُّوحٍ وَإِبْرَٰهِيمَ وَمُوسَىٰ وَعِيسَى ٱبْنِ مَرْيَمَ ۖ وَأَخَذْنَا مِنْهُم مِّيثَـٰقًا غَلِيظًا
    arabicPlain: وإذ أخذنا من النبيين ميثاقهم ومنك ومن نوح وإبراهيم وموسى وعيسى ابن مريم ۖ وأخذنا منهم ميثاقا غليظا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 361
    page: 419
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '33'
