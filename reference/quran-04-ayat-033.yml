  data:
    ref: '33:36'
    scripture: quran
    name: Quran 33:36
    chapter: 33
    verse: 36
    ordinal: 3569
    text: And it becometh not a believing man or a believing woman, when Allah and His messenger have decided an affair (for them), that they should (after that) claim any say in their affair; and whoso is rebellious to Allah and His messenger, he verily goeth astray in error manifest.
    translation: Pickthall
    original: وَمَا كَانَ لِمُؤْمِنٍ وَلَا مُؤْمِنَةٍ إِذَا قَضَى ٱللَّهُ وَرَسُولُهُۥٓ أَمْرًا أَن يَكُونَ لَهُمُ ٱلْخِيَرَةُ مِنْ أَمْرِهِمْ ۗ وَمَن يَعْصِ ٱللَّهَ وَرَسُولَهُۥ فَقَدْ ضَلَّ ضَلَـٰلًا مُّبِينًا
    arabicPlain: وما كان لمؤمن ولا مؤمنة إذا قضى الله ورسوله أمرا أن يكون لهم الخيرة من أمرهم ۗ ومن يعص الله ورسوله فقد ضل ضلالا مبينا
    surahName: Al-Ahzaab
    juz: 22
    manzil: 5
    ruku: 365
    page: 423
