  data:
    ref: '33:43'
    scripture: quran
    name: Quran 33:43
    chapter: 33
    verse: 43
    ordinal: 3576
    text: He it is Who blesseth you, and His angels (bless you), that He may bring you forth from darkness unto light; and He is ever Merciful to the believers.
    translation: Pickthall
    original: هُوَ ٱلَّذِى يُصَلِّى عَلَيْكُمْ وَمَلَـٰٓئِكَتُهُۥ لِيُخْرِجَكُم مِّنَ ٱلظُّلُمَـٰتِ إِلَى ٱلنُّورِ ۚ وَكَانَ بِٱلْمُؤْمِنِينَ رَحِيمًا
    arabicPlain: هو الذي يصلي عليكم وملائكته ليخرجكم من الظلمات إلى النور ۚ وكان بالمؤمنين رحيما
