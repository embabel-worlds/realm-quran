    scripture: quran
    name: Quran 33:40
    chapter: 33
    verse: 40
    ordinal: 3573
    text: Muhammad is not the father of any man among you, but he is the messenger of Allah and the Seal of the Prophets; and Allah is ever Aware of all things.
    translation: Pickthall
    original: مَّا كَانَ مُحَمَّدٌ أَبَآ أَحَدٍ مِّن رِّجَالِكُمْ وَلَـٰكِن رَّسُولَ ٱللَّهِ وَخَاتَمَ ٱلنَّبِيِّـۧنَ ۗ وَكَانَ ٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمًا
    arabicPlain: ما كان محمد أبا أحد من رجالكم ولكن رسول الله وخاتم النبيين ۗ وكان الله بكل شيء عليما
