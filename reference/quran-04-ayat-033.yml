  data:
    ref: '33:48'
    scripture: quran
    name: Quran 33:48
    chapter: 33
    verse: 48
    ordinal: 3581
    text: And incline not to the disbelievers and the hypocrites. Disregard their noxious talk, and put thy trust in Allah. Allah is sufficient as Trustee.
    translation: Pickthall
    original: وَلَا تُطِعِ ٱلْكَـٰفِرِينَ وَٱلْمُنَـٰفِقِينَ وَدَعْ أَذَىٰهُمْ وَتَوَكَّلْ عَلَى ٱللَّهِ ۚ وَكَفَىٰ بِٱللَّهِ وَكِيلًا
    arabicPlain: ولا تطع الكافرين والمنافقين ودع أذاهم وتوكل على الله ۚ وكفى بالله وكيلا
