  data:
    ref: '33:27'
    scripture: quran
    name: Quran 33:27
    chapter: 33
    verse: 27
    ordinal: 3560
    text: And He caused you to inherit their land and their houses and their wealth, and land ye have not trodden. Allah is ever Able to do all things.
    translation: Pickthall
    original: وَأَوْرَثَكُمْ أَرْضَهُمْ وَدِيَـٰرَهُمْ وَأَمْوَٰلَهُمْ وَأَرْضًا لَّمْ تَطَـُٔوهَا ۚ وَكَانَ ٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ قَدِيرًا
    arabicPlain: وأورثكم أرضهم وديارهم وأموالهم وأرضا لم تطئوها ۚ وكان الله على كل شيء قديرا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 363
    page: 421
