  data:
    ref: '33:39'
    scripture: quran
    name: Quran 33:39
    chapter: 33
    verse: 39
    ordinal: 3572
    text: Who delivered the messages of Allah and feared Him, and feared none save Allah. Allah keepeth good account.
    translation: Pickthall
    original: ٱلَّذِينَ يُبَلِّغُونَ رِسَـٰلَـٰتِ ٱللَّهِ وَيَخْشَوْنَهُۥ وَلَا يَخْشَوْنَ أَحَدًا إِلَّا ٱللَّهَ ۗ وَكَفَىٰ بِٱللَّهِ حَسِيبًا
    arabicPlain: الذين يبلغون رسالات الله ويخشونه ولا يخشون أحدا إلا الله ۗ وكفى بالله حسيبا
