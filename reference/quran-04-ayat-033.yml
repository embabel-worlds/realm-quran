  data:
    ref: '33:15'
    scripture: quran
    name: Quran 33:15
    chapter: 33
    verse: 15
    ordinal: 3548
    text: And verily they had already sworn unto Allah that they would not turn their backs (to the foe). An oath to Allah must be answered for.
    translation: Pickthall
    original: وَلَقَدْ كَانُوا۟ عَـٰهَدُوا۟ ٱللَّهَ مِن قَبْلُ لَا يُوَلُّونَ ٱلْأَدْبَـٰرَ ۚ وَكَانَ عَهْدُ ٱللَّهِ مَسْـُٔولًا
    arabicPlain: ولقد كانوا عاهدوا الله من قبل لا يولون الأدبار ۚ وكان عهد الله مسئولا
    surahName: Al-Ahzaab
    juz: 21
