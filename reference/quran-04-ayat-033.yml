- type: Ayah
  data:
    ref: '33:9'
    scripture: quran
    name: Quran 33:9
    chapter: 33
    verse: 9
    ordinal: 3542
    text: O ye who believe! Remember Allah's favour unto you when there came against you hosts, and We sent against them a great wind and hosts ye could not see. And Allah is ever Seer of what ye do.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱذْكُرُوا۟ نِعْمَةَ ٱللَّهِ عَلَيْكُمْ إِذْ جَآءَتْكُمْ جُنُودٌ فَأَرْسَلْنَا عَلَيْهِمْ رِيحًا وَجُنُودًا لَّمْ تَرَوْهَا ۚ وَكَانَ ٱللَّهُ بِمَا تَعْمَلُونَ بَصِيرًا
    arabicPlain: يا أيها الذين آمنوا اذكروا نعمة الله عليكم إذ جاءتكم جنود فأرسلنا عليهم ريحا وجنودا لم تروها ۚ وكان الله بما تعملون بصيرا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 362
    page: 419
  relations:
  - predicate: IN
