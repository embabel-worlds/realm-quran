  data:
    ref: '33:44'
    scripture: quran
    name: Quran 33:44
    chapter: 33
    verse: 44
    ordinal: 3577
    text: 'Their salutation on the day when they shall meet Him will be: Peace. And He hath prepared for them a goodly recompense.'
    translation: Pickthall
    original: تَحِيَّتُهُمْ يَوْمَ يَلْقَوْنَهُۥ سَلَـٰمٌ ۚ وَأَعَدَّ لَهُمْ أَجْرًا كَرِيمًا
    arabicPlain: تحيتهم يوم يلقونه سلام ۚ وأعد لهم أجرا كريما
