- type: Ayah
  data:
    ref: '33:26'
    scripture: quran
    name: Quran 33:26
    chapter: 33
    verse: 26
    ordinal: 3559
    text: And He brought those of the People of the Scripture who supported them down from their strongholds, and cast panic into their hearts. Some ye slew, and ye made captive some.
    translation: Pickthall
    original: وَأَنزَلَ ٱلَّذِينَ ظَـٰهَرُوهُم مِّنْ أَهْلِ ٱلْكِتَـٰبِ مِن صَيَاصِيهِمْ وَقَذَفَ فِى قُلُوبِهِمُ ٱلرُّعْبَ فَرِيقًا تَقْتُلُونَ وَتَأْسِرُونَ فَرِيقًا
    arabicPlain: وأنزل الذين ظاهروهم من أهل الكتاب من صياصيهم وقذف في قلوبهم الرعب فريقا تقتلون وتأسرون فريقا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 363
    page: 421
  relations:
