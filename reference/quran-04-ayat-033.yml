  data:
    ref: '33:20'
    scripture: quran
    name: Quran 33:20
    chapter: 33
    verse: 20
    ordinal: 3553
    text: They hold that the clans have not retired (for good); and if the clans should advance (again), they would fain be in the desert with the wandering Arabs, asking for the news of you; and if they were among you, they would not give battle, save a little.
    translation: Pickthall
    original: يَحْسَبُونَ ٱلْأَحْزَابَ لَمْ يَذْهَبُوا۟ ۖ وَإِن يَأْتِ ٱلْأَحْزَابُ يَوَدُّوا۟ لَوْ أَنَّهُم بَادُونَ فِى ٱلْأَعْرَابِ يَسْـَٔلُونَ عَنْ أَنۢبَآئِكُمْ ۖ وَلَوْ كَانُوا۟ فِيكُم مَّا قَـٰتَلُوٓا۟ إِلَّا قَلِيلًا
    arabicPlain: يحسبون الأحزاب لم يذهبوا ۖ وإن يأت الأحزاب يودوا لو أنهم بادون في الأعراب يسألون عن أنبائكم ۖ ولو كانوا فيكم ما قاتلوا إلا قليلا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 362
    page: 420
