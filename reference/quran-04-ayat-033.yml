  data:
    ref: '33:45'
    scripture: quran
    name: Quran 33:45
    chapter: 33
    verse: 45
    ordinal: 3578
    text: O Prophet! Lo! We have sent thee as a witness and a bringer of good tidings and a warner.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلنَّبِىُّ إِنَّآ أَرْسَلْنَـٰكَ شَـٰهِدًا وَمُبَشِّرًا وَنَذِيرًا
    arabicPlain: يا أيها النبي إنا أرسلناك شاهدا ومبشرا ونذيرا
