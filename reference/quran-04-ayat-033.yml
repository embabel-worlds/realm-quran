  data:
    ref: '33:51'
    scripture: quran
    name: Quran 33:51
    chapter: 33
    verse: 51
    ordinal: 3584
    text: Thou canst defer whom thou wilt of them and receive unto thee whom thou wilt, and whomsoever thou desirest of those whom thou hast set aside (temporarily), it is no sin for thee (to receive her again); that is better; that they may be comforted and not grieve, and may all be pleased with what thou givest them. Allah knoweth what is in your hearts (O men), and Allah is ever Forgiving, Clement.
    translation: Pickthall
    original: ۞ تُرْجِى مَن تَشَآءُ مِنْهُنَّ وَتُـْٔوِىٓ إِلَيْكَ مَن تَشَآءُ ۖ وَمَنِ ٱبْتَغَيْتَ مِمَّنْ عَزَلْتَ فَلَا جُنَاحَ عَلَيْكَ ۚ ذَٰلِكَ أَدْنَىٰٓ أَن تَقَرَّ أَعْيُنُهُنَّ وَلَا يَحْزَنَّ وَيَرْضَيْنَ بِمَآ ءَاتَيْتَهُنَّ كُلُّهُنَّ ۚ وَٱللَّهُ يَعْلَمُ مَا فِى قُلُوبِكُمْ ۚ وَكَانَ ٱللَّهُ عَلِيمًا حَلِيمًا
    arabicPlain: ۞ ترجي من تشاء منهن وتؤوي إليك من تشاء ۖ ومن ابتغيت ممن عزلت فلا جناح عليك ۚ ذلك أدنى أن تقر أعينهن ولا يحزن ويرضين بما آتيتهن كلهن ۚ والله يعلم ما في قلوبكم ۚ وكان الله عليما حليما
    surahName: Al-Ahzaab
    juz: 22
    manzil: 5
    ruku: 366
    page: 425
