  data:
    ref: '33:56'
    scripture: quran
    name: Quran 33:56
    chapter: 33
    verse: 56
    ordinal: 3589
    text: Lo! Allah and His angels shower blessings on the Prophet. O ye who believe! Ask blessings on him and salute him with a worthy salutation.
    translation: Pickthall
    original: إِنَّ ٱللَّهَ وَمَلَـٰٓئِكَتَهُۥ يُصَلُّونَ عَلَى ٱلنَّبِىِّ ۚ يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ صَلُّوا۟ عَلَيْهِ وَسَلِّمُوا۟ تَسْلِيمًا
    arabicPlain: إن الله وملائكته يصلون على النبي ۚ يا أيها الذين آمنوا صلوا عليه وسلموا تسليما
    surahName: Al-Ahzaab
    juz: 22
    manzil: 5
    ruku: 367
