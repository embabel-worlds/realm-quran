  data:
    ref: '33:25'
    scripture: quran
    name: Quran 33:25
    chapter: 33
    verse: 25
    ordinal: 3558
    text: And Allah repulsed the disbelievers in their wrath; they gained no good. Allah averted their attack from the believers. Allah is ever Strong, Mighty.
    translation: Pickthall
    original: وَرَدَّ ٱللَّهُ ٱلَّذِينَ كَفَرُوا۟ بِغَيْظِهِمْ لَمْ يَنَالُوا۟ خَيْرًا ۚ وَكَفَى ٱللَّهُ ٱلْمُؤْمِنِينَ ٱلْقِتَالَ ۚ وَكَانَ ٱللَّهُ قَوِيًّا عَزِيزًا
    arabicPlain: ورد الله الذين كفروا بغيظهم لم ينالوا خيرا ۚ وكفى الله المؤمنين القتال ۚ وكان الله قويا عزيزا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 363
    page: 421
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '33'
  - predicate: IN_PORTION
