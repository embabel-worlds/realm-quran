  data:
    ref: '33:23'
    scripture: quran
    name: Quran 33:23
    chapter: 33
    verse: 23
    ordinal: 3556
    text: Of the believers are men who are true to that which they covenanted with Allah. Some of them have paid their vow by death (in battle), and some of them still are waiting; and they have not altered in the least;
    translation: Pickthall
    original: مِّنَ ٱلْمُؤْمِنِينَ رِجَالٌ صَدَقُوا۟ مَا عَـٰهَدُوا۟ ٱللَّهَ عَلَيْهِ ۖ فَمِنْهُم مَّن قَضَىٰ نَحْبَهُۥ وَمِنْهُم مَّن يَنتَظِرُ ۖ وَمَا بَدَّلُوا۟ تَبْدِيلًا
    arabicPlain: من المؤمنين رجال صدقوا ما عاهدوا الله عليه ۖ فمنهم من قضى نحبه ومنهم من ينتظر ۖ وما بدلوا تبديلا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 363
    page: 421
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '33'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-21
- type: Ayah
  data:
    ref: '33:24'
    scripture: quran
    name: Quran 33:24
    chapter: 33
    verse: 24
    ordinal: 3557
    text: That Allah may reward the true men for their truth, and punish the hypocrites if He will, or relent toward them (if He will). Lo! Allah is Forgiving, Merciful.
    translation: Pickthall
    original: لِّيَجْزِىَ ٱللَّهُ ٱلصَّـٰدِقِينَ بِصِدْقِهِمْ وَيُعَذِّبَ ٱلْمُنَـٰفِقِينَ إِن شَآءَ أَوْ يَتُوبَ عَلَيْهِمْ ۚ إِنَّ ٱللَّهَ كَانَ غَفُورًا رَّحِيمًا
    arabicPlain: ليجزي الله الصادقين بصدقهم ويعذب المنافقين إن شاء أو يتوب عليهم ۚ إن الله كان غفورا رحيما
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 363
    page: 421
  relations:
  - predicate: IN
    to:
      type: Surah
