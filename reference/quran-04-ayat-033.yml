- type: Ayah
  data:
    ref: '33:10'
    scripture: quran
    name: Quran 33:10
    chapter: 33
    verse: 10
    ordinal: 3543
    text: When they came upon you from above you and from below you, and when eyes grew wild and hearts reached to the throats, and ye were imagining vain thoughts concerning Allah.
    translation: Pickthall
    original: إِذْ جَآءُوكُم مِّن فَوْقِكُمْ وَمِنْ أَسْفَلَ مِنكُمْ وَإِذْ زَاغَتِ ٱلْأَبْصَـٰرُ وَبَلَغَتِ ٱلْقُلُوبُ ٱلْحَنَاجِرَ وَتَظُنُّونَ بِٱللَّهِ ٱلظُّنُونَا۠
    arabicPlain: إذ جاءوكم من فوقكم ومن أسفل منكم وإذ زاغت الأبصار وبلغت القلوب الحناجر وتظنون بالله الظنونا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 362
