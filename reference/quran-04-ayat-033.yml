  data:
    ref: '33:47'
    scripture: quran
    name: Quran 33:47
    chapter: 33
    verse: 47
    ordinal: 3580
    text: And announce unto the believers the good tidings that they will have great bounty from Allah.
    translation: Pickthall
    original: وَبَشِّرِ ٱلْمُؤْمِنِينَ بِأَنَّ لَهُم مِّنَ ٱللَّهِ فَضْلًا كَبِيرًا
    arabicPlain: وبشر المؤمنين بأن لهم من الله فضلا كبيرا
    surahName: Al-Ahzaab
    juz: 22
    manzil: 5
    ruku: 366
