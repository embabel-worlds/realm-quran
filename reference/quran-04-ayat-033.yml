  data:
    ref: '33:38'
    scripture: quran
    name: Quran 33:38
    chapter: 33
    verse: 38
    ordinal: 3571
    text: There is no reproach for the Prophet in that which Allah maketh his due. That was Allah's way with those who passed away of old - and the commandment of Allah is certain destiny -
    translation: Pickthall
    original: مَّا كَانَ عَلَى ٱلنَّبِىِّ مِنْ حَرَجٍ فِيمَا فَرَضَ ٱللَّهُ لَهُۥ ۖ سُنَّةَ ٱللَّهِ فِى ٱلَّذِينَ خَلَوْا۟ مِن قَبْلُ ۚ وَكَانَ أَمْرُ ٱللَّهِ قَدَرًا مَّقْدُورًا
    arabicPlain: ما كان على النبي من حرج فيما فرض الله له ۖ سنة الله في الذين خلوا من قبل ۚ وكان أمر الله قدرا مقدورا
    surahName: Al-Ahzaab
