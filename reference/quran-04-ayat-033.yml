    translation: Pickthall
    original: هُنَالِكَ ٱبْتُلِىَ ٱلْمُؤْمِنُونَ وَزُلْزِلُوا۟ زِلْزَالًا شَدِيدًا
    arabicPlain: هنالك ابتلي المؤمنون وزلزلوا زلزالا شديدا
    surahName: Al-Ahzaab
