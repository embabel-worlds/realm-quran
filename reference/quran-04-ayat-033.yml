  data:
    ref: '33:58'
    scripture: quran
    name: Quran 33:58
    chapter: 33
    verse: 58
    ordinal: 3591
    text: And those who malign believing men and believing women undeservedly, they bear the guilt of slander and manifest sin.
    translation: Pickthall
    original: وَٱلَّذِينَ يُؤْذُونَ ٱلْمُؤْمِنِينَ وَٱلْمُؤْمِنَـٰتِ بِغَيْرِ مَا ٱكْتَسَبُوا۟ فَقَدِ ٱحْتَمَلُوا۟ بُهْتَـٰنًا وَإِثْمًا مُّبِينًا
    arabicPlain: والذين يؤذون المؤمنين والمؤمنات بغير ما اكتسبوا فقد احتملوا بهتانا وإثما مبينا
    surahName: Al-Ahzaab
    juz: 22
    manzil: 5
    ruku: 367
    page: 426
