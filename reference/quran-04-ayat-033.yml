  data:
    ref: '33:14'
    scripture: quran
    name: Quran 33:14
    chapter: 33
    verse: 14
    ordinal: 3547
    text: If the enemy had entered from all sides and they had been exhorted to treachery, they would have committed it, and would have hesitated thereupon but little.
    translation: Pickthall
    original: وَلَوْ دُخِلَتْ عَلَيْهِم مِّنْ أَقْطَارِهَا ثُمَّ سُئِلُوا۟ ٱلْفِتْنَةَ لَـَٔاتَوْهَا وَمَا تَلَبَّثُوا۟ بِهَآ إِلَّا يَسِيرًا
    arabicPlain: ولو دخلت عليهم من أقطارها ثم سئلوا الفتنة لآتوها وما تلبثوا بها إلا يسيرا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 362
