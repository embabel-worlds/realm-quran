  data:
    ref: '33:12'
    scripture: quran
    name: Quran 33:12
    chapter: 33
    verse: 12
    ordinal: 3545
    text: 'And when the hypocrites, and those in whose hearts is a disease, were saying: Allah and His messenger promised us naught but delusion.'
    translation: Pickthall
    original: وَإِذْ يَقُولُ ٱلْمُنَـٰفِقُونَ وَٱلَّذِينَ فِى قُلُوبِهِم مَّرَضٌ مَّا وَعَدَنَا ٱللَّهُ وَرَسُولُهُۥٓ إِلَّا غُرُورًا
    arabicPlain: وإذ يقول المنافقون والذين في قلوبهم مرض ما وعدنا الله ورسوله إلا غرورا
    surahName: Al-Ahzaab
    juz: 21
