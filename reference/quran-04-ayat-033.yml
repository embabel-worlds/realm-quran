- type: Ayah
  data:
    ref: '33:8'
    scripture: quran
    name: Quran 33:8
    chapter: 33
    verse: 8
    ordinal: 3541
    text: That He may ask the loyal of their loyalty. And He hath prepared a painful doom for the unfaithful.
    translation: Pickthall
    original: لِّيَسْـَٔلَ ٱلصَّـٰدِقِينَ عَن صِدْقِهِمْ ۚ وَأَعَدَّ لِلْكَـٰفِرِينَ عَذَابًا أَلِيمًا
    arabicPlain: ليسأل الصادقين عن صدقهم ۚ وأعد للكافرين عذابا أليما
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 361
    page: 419
