  data:
    ref: '33:30'
    scripture: quran
    name: Quran 33:30
    chapter: 33
    verse: 30
    ordinal: 3563
    text: O ye wives of the Prophet! Whosoever of you committeth manifest lewdness, the punishment for her will be doubled, and that is easy for Allah.
    translation: Pickthall
    original: يَـٰنِسَآءَ ٱلنَّبِىِّ مَن يَأْتِ مِنكُنَّ بِفَـٰحِشَةٍ مُّبَيِّنَةٍ يُضَـٰعَفْ لَهَا ٱلْعَذَابُ ضِعْفَيْنِ ۚ وَكَانَ ذَٰلِكَ عَلَى ٱللَّهِ يَسِيرًا
    arabicPlain: يا نساء النبي من يأت منكن بفاحشة مبينة يضاعف لها العذاب ضعفين ۚ وكان ذلك على الله يسيرا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 364
    page: 421
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '33'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-21
- type: Ayah
  data:
    ref: '33:31'
    scripture: quran
    name: Quran 33:31
    chapter: 33
    verse: 31
    ordinal: 3564
    text: And whosoever of you is submissive unto Allah and His messenger and doeth right, We shall give her her reward twice over, and We have prepared for her a rich provision.
    translation: Pickthall
    original: ۞ وَمَن يَقْنُتْ مِنكُنَّ لِلَّهِ وَرَسُولِهِۦ وَتَعْمَلْ صَـٰلِحًا نُّؤْتِهَآ أَجْرَهَا مَرَّتَيْنِ وَأَعْتَدْنَا لَهَا رِزْقًا كَرِيمًا
    arabicPlain: ۞ ومن يقنت منكن لله ورسوله وتعمل صالحا نؤتها أجرها مرتين وأعتدنا لها رزقا كريما
    surahName: Al-Ahzaab
    juz: 22
    manzil: 5
    ruku: 364
    page: 422
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '33'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-22
- type: Ayah
  data:
    ref: '33:32'
    scripture: quran
    name: Quran 33:32
    chapter: 33
    verse: 32
    ordinal: 3565
    text: O ye wives of the Prophet! Ye are not like any other women. If ye keep your duty (to Allah), then be not soft of speech, lest he in whose heart is a disease aspire (to you), but utter customary speech.
    translation: Pickthall
    original: يَـٰنِسَآءَ ٱلنَّبِىِّ لَسْتُنَّ كَأَحَدٍ مِّنَ ٱلنِّسَآءِ ۚ إِنِ ٱتَّقَيْتُنَّ فَلَا تَخْضَعْنَ بِٱلْقَوْلِ فَيَطْمَعَ ٱلَّذِى فِى قَلْبِهِۦ مَرَضٌ وَقُلْنَ قَوْلًا مَّعْرُوفًا
    arabicPlain: يا نساء النبي لستن كأحد من النساء ۚ إن اتقيتن فلا تخضعن بالقول فيطمع الذي في قلبه مرض وقلن قولا معروفا
    surahName: Al-Ahzaab
    juz: 22
    manzil: 5
    ruku: 364
    page: 422
