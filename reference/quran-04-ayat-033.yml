- type: Ayah
  data:
    ref: '33:4'
    scripture: quran
    name: Quran 33:4
    chapter: 33
    verse: 4
    ordinal: 3537
    text: Allah hath not assigned unto any man two hearts within his body, nor hath He made your wives whom ye declare (to be your mothers) your mothers, nor hath He made those whom ye claim (to be your sons) your sons. This is but a saying of your mouths. But Allah saith the truth and He showeth the way.
    translation: Pickthall
    original: مَّا جَعَلَ ٱللَّهُ لِرَجُلٍ مِّن قَلْبَيْنِ فِى جَوْفِهِۦ ۚ وَمَا جَعَلَ أَزْوَٰجَكُمُ ٱلَّـٰٓـِٔى تُظَـٰهِرُونَ مِنْهُنَّ أُمَّهَـٰتِكُمْ ۚ وَمَا جَعَلَ أَدْعِيَآءَكُمْ أَبْنَآءَكُمْ ۚ ذَٰلِكُمْ قَوْلُكُم بِأَفْوَٰهِكُمْ ۖ وَٱللَّهُ يَقُولُ ٱلْحَقَّ وَهُوَ يَهْدِى ٱلسَّبِيلَ
    arabicPlain: ما جعل الله لرجل من قلبين في جوفه ۚ وما جعل أزواجكم اللائي تظاهرون منهن أمهاتكم ۚ وما جعل أدعياءكم أبناءكم ۚ ذلكم قولكم بأفواهكم ۖ والله يقول الحق وهو يهدي السبيل
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 361
    page: 418
