  data:
    ref: '33:21'
    scripture: quran
    name: Quran 33:21
    chapter: 33
    verse: 21
    ordinal: 3554
    text: Verily in the messenger of Allah ye have a good example for him who looketh unto Allah and the Last Day, and remembereth Allah much.
    translation: Pickthall
    original: لَّقَدْ كَانَ لَكُمْ فِى رَسُولِ ٱللَّهِ أُسْوَةٌ حَسَنَةٌ لِّمَن كَانَ يَرْجُوا۟ ٱللَّهَ وَٱلْيَوْمَ ٱلْـَٔاخِرَ وَذَكَرَ ٱللَّهَ كَثِيرًا
    arabicPlain: لقد كان لكم في رسول الله أسوة حسنة لمن كان يرجو الله واليوم الآخر وذكر الله كثيرا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 363
    page: 420
