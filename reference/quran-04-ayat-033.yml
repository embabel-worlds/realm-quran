  data:
    ref: '33:34'
    scripture: quran
    name: Quran 33:34
    chapter: 33
    verse: 34
    ordinal: 3567
    text: And bear in mind that which is recited in your houses of the revelations of Allah and wisdom. Lo! Allah is Subtile, Aware.
    translation: Pickthall
    original: وَٱذْكُرْنَ مَا يُتْلَىٰ فِى بُيُوتِكُنَّ مِنْ ءَايَـٰتِ ٱللَّهِ وَٱلْحِكْمَةِ ۚ إِنَّ ٱللَّهَ كَانَ لَطِيفًا خَبِيرًا
    arabicPlain: واذكرن ما يتلى في بيوتكن من آيات الله والحكمة ۚ إن الله كان لطيفا خبيرا
    surahName: Al-Ahzaab
    juz: 22
