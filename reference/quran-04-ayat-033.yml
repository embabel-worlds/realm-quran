  data:
    ref: '33:54'
    scripture: quran
    name: Quran 33:54
    chapter: 33
    verse: 54
    ordinal: 3587
    text: Whether ye divulge a thing or keep it hidden, lo! Allah is ever Knower of all things.
    translation: Pickthall
    original: إِن تُبْدُوا۟ شَيْـًٔا أَوْ تُخْفُوهُ فَإِنَّ ٱللَّهَ كَانَ بِكُلِّ شَىْءٍ عَلِيمًا
    arabicPlain: إن تبدوا شيئا أو تخفوه فإن الله كان بكل شيء عليما
    surahName: Al-Ahzaab
    juz: 22
    manzil: 5
    ruku: 367
