  data:
    ref: '33:18'
    scripture: quran
    name: Quran 33:18
    chapter: 33
    verse: 18
    ordinal: 3551
    text: 'Allah already knoweth those of you who hinder, and those who say unto their brethren: "Come ye hither unto us!" and they come not to the stress of battle save a little,'
    translation: Pickthall
    original: ۞ قَدْ يَعْلَمُ ٱللَّهُ ٱلْمُعَوِّقِينَ مِنكُمْ وَٱلْقَآئِلِينَ لِإِخْوَٰنِهِمْ هَلُمَّ إِلَيْنَا ۖ وَلَا يَأْتُونَ ٱلْبَأْسَ إِلَّا قَلِيلًا
    arabicPlain: ۞ قد يعلم الله المعوقين منكم والقائلين لإخوانهم هلم إلينا ۖ ولا يأتون البأس إلا قليلا
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 362
    page: 420
