  data:
    ref: '33:22'
    scripture: quran
    name: Quran 33:22
    chapter: 33
    verse: 22
    ordinal: 3555
    text: 'And when the true believers saw the clans, they said: This is that which Allah and His messenger promised us. Allah and His messenger are true. It did but confirm them in their faith and resignation.'
    translation: Pickthall
    original: وَلَمَّا رَءَا ٱلْمُؤْمِنُونَ ٱلْأَحْزَابَ قَالُوا۟ هَـٰذَا مَا وَعَدَنَا ٱللَّهُ وَرَسُولُهُۥ وَصَدَقَ ٱللَّهُ وَرَسُولُهُۥ ۚ وَمَا زَادَهُمْ إِلَّآ إِيمَـٰنًا وَتَسْلِيمًا
    arabicPlain: ولما رأى المؤمنون الأحزاب قالوا هذا ما وعدنا الله ورسوله وصدق الله ورسوله ۚ وما زادهم إلا إيمانا وتسليما
    surahName: Al-Ahzaab
    juz: 21
    manzil: 5
    ruku: 363
    page: 420
