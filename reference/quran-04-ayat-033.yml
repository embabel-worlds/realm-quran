  data:
    ref: '33:57'
    scripture: quran
    name: Quran 33:57
    chapter: 33
    verse: 57
    ordinal: 3590
    text: Lo! those who malign Allah and His messenger, Allah hath cursed them in the world and the Hereafter, and hath prepared for them the doom of the disdained.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ يُؤْذُونَ ٱللَّهَ وَرَسُولَهُۥ لَعَنَهُمُ ٱللَّهُ فِى ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ وَأَعَدَّ لَهُمْ عَذَابًا مُّهِينًا
    arabicPlain: إن الذين يؤذون الله ورسوله لعنهم الله في الدنيا والآخرة وأعد لهم عذابا مهينا
    surahName: Al-Ahzaab
    juz: 22
    manzil: 5
    ruku: 367
    page: 426
  relations:
