  data:
    ref: '31:8'
    scripture: quran
    name: Quran 31:8
    chapter: 31
    verse: 8
    ordinal: 3477
    text: Lo! those who believe and do good works, for them are the gardens of delight,
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ لَهُمْ جَنَّـٰتُ ٱلنَّعِيمِ
    arabicPlain: إن الذين آمنوا وعملوا الصالحات لهم جنات النعيم
    surahName: Luqman
    juz: 21
    manzil: 5
