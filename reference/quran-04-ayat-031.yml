  data:
    ref: '31:24'
    scripture: quran
    name: Quran 31:24
    chapter: 31
    verse: 24
    ordinal: 3493
    text: We give them comfort for a little, and then We drive them to a heavy doom.
    translation: Pickthall
    original: نُمَتِّعُهُمْ قَلِيلًا ثُمَّ نَضْطَرُّهُمْ إِلَىٰ عَذَابٍ غَلِيظٍ
    arabicPlain: نمتعهم قليلا ثم نضطرهم إلى عذاب غليظ
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 357
