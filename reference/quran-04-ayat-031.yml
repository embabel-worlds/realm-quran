  data:
    ref: '31:30'
    scripture: quran
    name: Quran 31:30
    chapter: 31
    verse: 30
    ordinal: 3499
    text: That (is so) because Allah, He is the True, and that which they invoke beside Him is the False, and because Allah, He is the Sublime, the Great.
    translation: Pickthall
    original: ذَٰلِكَ بِأَنَّ ٱللَّهَ هُوَ ٱلْحَقُّ وَأَنَّ مَا يَدْعُونَ مِن دُونِهِ ٱلْبَـٰطِلُ وَأَنَّ ٱللَّهَ هُوَ ٱلْعَلِىُّ ٱلْكَبِيرُ
    arabicPlain: ذلك بأن الله هو الحق وأن ما يدعون من دونه الباطل وأن الله هو العلي الكبير
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 357
    page: 414
  relations:
