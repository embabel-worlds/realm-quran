- type: Ayah
  data:
    ref: '31:32'
    scripture: quran
    name: Quran 31:32
    chapter: 31
    verse: 32
    ordinal: 3501
    text: And if a wave enshroudeth them like awnings, they cry unto Allah, making their faith pure for Him only. But when He bringeth them safe to land, some of them compromise. None denieth Our signs save every traitor ingrate.
    translation: Pickthall
    original: وَإِذَا غَشِيَهُم مَّوْجٌ كَٱلظُّلَلِ دَعَوُا۟ ٱللَّهَ مُخْلِصِينَ لَهُ ٱلدِّينَ فَلَمَّا نَجَّىٰهُمْ إِلَى ٱلْبَرِّ فَمِنْهُم مُّقْتَصِدٌ ۚ وَمَا يَجْحَدُ بِـَٔايَـٰتِنَآ إِلَّا كُلُّ خَتَّارٍ كَفُورٍ
    arabicPlain: وإذا غشيهم موج كالظلل دعوا الله مخلصين له الدين فلما نجاهم إلى البر فمنهم مقتصد ۚ وما يجحد بآياتنا إلا كل ختار كفور
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 357
    page: 414
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '31'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-21
- type: Ayah
  data:
    ref: '31:33'
    scripture: quran
    name: Quran 31:33
    chapter: 31
    verse: 33
    ordinal: 3502
    text: O mankind! Keep your duty to your Lord and fear a Day when the parent will not be able to avail the child in aught, nor the child to avail the parent. Lo! Allah's promise is the very truth. Let not the life of the world beguile you, nor let the deceiver beguile you, in regard to Allah.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلنَّاسُ ٱتَّقُوا۟ رَبَّكُمْ وَٱخْشَوْا۟ يَوْمًا لَّا يَجْزِى وَالِدٌ عَن وَلَدِهِۦ وَلَا مَوْلُودٌ هُوَ جَازٍ عَن وَالِدِهِۦ شَيْـًٔا ۚ إِنَّ وَعْدَ ٱللَّهِ حَقٌّ ۖ فَلَا تَغُرَّنَّكُمُ ٱلْحَيَوٰةُ ٱلدُّنْيَا وَلَا يَغُرَّنَّكُم بِٱللَّهِ ٱلْغَرُورُ
    arabicPlain: يا أيها الناس اتقوا ربكم واخشوا يوما لا يجزي والد عن ولده ولا مولود هو جاز عن والده شيئا ۚ إن وعد الله حق ۖ فلا تغرنكم الحياة الدنيا ولا يغرنكم بالله الغرور
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 357
    page: 414
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '31'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-21
- type: Ayah
  data:
    ref: '31:34'
    scripture: quran
    name: Quran 31:34
    chapter: 31
    verse: 34
    ordinal: 3503
    text: Lo! Allah! With Him is knowledge of the Hour. He sendeth down the rain, and knoweth that which is in the wombs. No soul knoweth what it will earn to-morrow, and no soul knoweth in what land it will die. Lo! Allah is Knower, Aware.
    translation: Pickthall
    original: إِنَّ ٱللَّهَ عِندَهُۥ عِلْمُ ٱلسَّاعَةِ وَيُنَزِّلُ ٱلْغَيْثَ وَيَعْلَمُ مَا فِى ٱلْأَرْحَامِ ۖ وَمَا تَدْرِى نَفْسٌ مَّاذَا تَكْسِبُ غَدًا ۖ وَمَا تَدْرِى نَفْسٌۢ بِأَىِّ أَرْضٍ تَمُوتُ ۚ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٌۢ
    arabicPlain: إن الله عنده علم الساعة وينزل الغيث ويعلم ما في الأرحام ۖ وما تدري نفس ماذا تكسب غدا ۖ وما تدري نفس بأي أرض تموت ۚ إن الله عليم خبير
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 357
    page: 414
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '31'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-21
