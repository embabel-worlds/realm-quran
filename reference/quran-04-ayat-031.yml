- type: Ayah
  data:
    ref: '31:12'
    scripture: quran
    name: Quran 31:12
    chapter: 31
    verse: 12
    ordinal: 3481
    text: 'And verily We gave Luqman wisdom, saying: Give thanks unto Allah; and whosoever giveth thanks, he giveth thanks for (the good of) his soul. And whosoever refuseth - Lo! Allah is Absolute, Owner of Praise.'
    translation: Pickthall
    original: وَلَقَدْ ءَاتَيْنَا لُقْمَـٰنَ ٱلْحِكْمَةَ أَنِ ٱشْكُرْ لِلَّهِ ۚ وَمَن يَشْكُرْ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِۦ ۖ وَمَن كَفَرَ فَإِنَّ ٱللَّهَ غَنِىٌّ حَمِيدٌ
    arabicPlain: ولقد آتينا لقمان الحكمة أن اشكر لله ۚ ومن يشكر فإنما يشكر لنفسه ۖ ومن كفر فإن الله غني حميد
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 356
    page: 412
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '31'
  - predicate: IN_PORTION
    to:
      type: Juz
