- type: Ayah
  data:
    ref: '31:6'
    scripture: quran
    name: Quran 31:6
    chapter: 31
    verse: 6
    ordinal: 3475
    text: And of mankind is he who payeth for mere pastime of discourse, that he may mislead from Allah's way without knowledge, and maketh it the butt of mockery. For such there is a shameful doom.
    translation: Pickthall
    original: وَمِنَ ٱلنَّاسِ مَن يَشْتَرِى لَهْوَ ٱلْحَدِيثِ لِيُضِلَّ عَن سَبِيلِ ٱللَّهِ بِغَيْرِ عِلْمٍ وَيَتَّخِذَهَا هُزُوًا ۚ أُو۟لَـٰٓئِكَ لَهُمْ عَذَابٌ مُّهِينٌ
    arabicPlain: ومن الناس من يشتري لهو الحديث ليضل عن سبيل الله بغير علم ويتخذها هزوا ۚ أولئك لهم عذاب مهين
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 355
    page: 411
