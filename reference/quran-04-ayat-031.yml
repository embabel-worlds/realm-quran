  data:
    ref: '31:21'
    scripture: quran
    name: Quran 31:21
    chapter: 31
    verse: 21
    ordinal: 3490
    text: 'And if it be said unto them: Follow that which Allah hath revealed, they say: Nay, but we follow that wherein we found our fathers. What! Even though the devil were inviting them unto the doom of flame?'
    translation: Pickthall
    original: وَإِذَا قِيلَ لَهُمُ ٱتَّبِعُوا۟ مَآ أَنزَلَ ٱللَّهُ قَالُوا۟ بَلْ نَتَّبِعُ مَا وَجَدْنَا عَلَيْهِ ءَابَآءَنَآ ۚ أَوَلَوْ كَانَ ٱلشَّيْطَـٰنُ يَدْعُوهُمْ إِلَىٰ عَذَابِ ٱلسَّعِيرِ
    arabicPlain: وإذا قيل لهم اتبعوا ما أنزل الله قالوا بل نتبع ما وجدنا عليه آباءنا ۚ أولو كان الشيطان يدعوهم إلى عذاب السعير
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 357
    page: 413
