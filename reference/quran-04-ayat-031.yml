- type: Ayah
  data:
    ref: '31:13'
    scripture: quran
    name: Quran 31:13
    chapter: 31
    verse: 13
    ordinal: 3482
    text: 'And (remember) when Luqman said unto his son, when he was exhorting him: O my dear son! Ascribe no partners unto Allah. Lo! to ascribe partners (unto Him) is a tremendous wrong -'
    translation: Pickthall
    original: وَإِذْ قَالَ لُقْمَـٰنُ لِٱبْنِهِۦ وَهُوَ يَعِظُهُۥ يَـٰبُنَىَّ لَا تُشْرِكْ بِٱللَّهِ ۖ إِنَّ ٱلشِّرْكَ لَظُلْمٌ عَظِيمٌ
    arabicPlain: وإذ قال لقمان لابنه وهو يعظه يا بني لا تشرك بالله ۖ إن الشرك لظلم عظيم
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 356
    page: 412
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '31'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-21
- type: Ayah
  data:
    ref: '31:14'
    scripture: quran
    name: Quran 31:14
    chapter: 31
    verse: 14
    ordinal: 3483
    text: And We have enjoined upon man concerning his partners - His mother beareth him in weakness upon weakness, and his weaning is in two years - Give thanks unto Me and unto thy parents. Unto Me is the journeying.
    translation: Pickthall
    original: وَوَصَّيْنَا ٱلْإِنسَـٰنَ بِوَٰلِدَيْهِ حَمَلَتْهُ أُمُّهُۥ وَهْنًا عَلَىٰ وَهْنٍ وَفِصَـٰلُهُۥ فِى عَامَيْنِ أَنِ ٱشْكُرْ لِى وَلِوَٰلِدَيْكَ إِلَىَّ ٱلْمَصِيرُ
    arabicPlain: ووصينا الإنسان بوالديه حملته أمه وهنا على وهن وفصاله في عامين أن اشكر لي ولوالديك إلي المصير
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 356
    page: 412
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '31'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-21
- type: Ayah
  data:
    ref: '31:15'
    scripture: quran
    name: Quran 31:15
    chapter: 31
    verse: 15
    ordinal: 3484
    text: But if they strive with thee to make thee ascribe unto Me as partner that of which thou hast no knowledge, then obey them not. Consort with them in the world kindly, and follow the path of him who repenteth unto Me. Then unto Me will be your return, and I shall tell you what ye used to do -
    translation: Pickthall
    original: وَإِن جَـٰهَدَاكَ عَلَىٰٓ أَن تُشْرِكَ بِى مَا لَيْسَ لَكَ بِهِۦ عِلْمٌ فَلَا تُطِعْهُمَا ۖ وَصَاحِبْهُمَا فِى ٱلدُّنْيَا مَعْرُوفًا ۖ وَٱتَّبِعْ سَبِيلَ مَنْ أَنَابَ إِلَىَّ ۚ ثُمَّ إِلَىَّ مَرْجِعُكُمْ فَأُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَ
    arabicPlain: وإن جاهداك على أن تشرك بي ما ليس لك به علم فلا تطعهما ۖ وصاحبهما في الدنيا معروفا ۖ واتبع سبيل من أناب إلي ۚ ثم إلي مرجعكم فأنبئكم بما كنتم تعملون
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 356
    page: 412
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '31'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-21
- type: Ayah
  data:
    ref: '31:16'
    scripture: quran
    name: Quran 31:16
    chapter: 31
    verse: 16
    ordinal: 3485
    text: O my dear son! Lo! though it be but the weight of a grain of mustard-seed, and though it be in a rock, or in the heavens, or in the earth, Allah will bring it forth. Lo! Allah is Subtile, Aware.
    translation: Pickthall
    original: يَـٰبُنَىَّ إِنَّهَآ إِن تَكُ مِثْقَالَ حَبَّةٍ مِّنْ خَرْدَلٍ فَتَكُن فِى صَخْرَةٍ أَوْ فِى ٱلسَّمَـٰوَٰتِ أَوْ فِى ٱلْأَرْضِ يَأْتِ بِهَا ٱللَّهُ ۚ إِنَّ ٱللَّهَ لَطِيفٌ خَبِيرٌ
    arabicPlain: يا بني إنها إن تك مثقال حبة من خردل فتكن في صخرة أو في السماوات أو في الأرض يأت بها الله ۚ إن الله لطيف خبير
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 356
    page: 412
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '31'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-21
- type: Ayah
  data:
    ref: '31:17'
    scripture: quran
    name: Quran 31:17
    chapter: 31
    verse: 17
    ordinal: 3486
    text: O my dear son! Establish worship and enjoin kindness and forbid iniquity, and persevere whatever may befall thee. Lo! that is of the steadfast heart of things.
    translation: Pickthall
    original: يَـٰبُنَىَّ أَقِمِ ٱلصَّلَوٰةَ وَأْمُرْ بِٱلْمَعْرُوفِ وَٱنْهَ عَنِ ٱلْمُنكَرِ وَٱصْبِرْ عَلَىٰ مَآ أَصَابَكَ ۖ إِنَّ ذَٰلِكَ مِنْ عَزْمِ ٱلْأُمُورِ
    arabicPlain: يا بني أقم الصلاة وأمر بالمعروف وانه عن المنكر واصبر على ما أصابك ۖ إن ذلك من عزم الأمور
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 356
    page: 412
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '31'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-21
- type: Ayah
  data:
    ref: '31:18'
    scripture: quran
    name: Quran 31:18
    chapter: 31
    verse: 18
    ordinal: 3487
    text: Turn not thy cheek in scorn toward folk, nor walk with pertness in the land. Lo! Allah loveth not each braggart boaster.
    translation: Pickthall
    original: وَلَا تُصَعِّرْ خَدَّكَ لِلنَّاسِ وَلَا تَمْشِ فِى ٱلْأَرْضِ مَرَحًا ۖ إِنَّ ٱللَّهَ لَا يُحِبُّ كُلَّ مُخْتَالٍ فَخُورٍ
    arabicPlain: ولا تصعر خدك للناس ولا تمش في الأرض مرحا ۖ إن الله لا يحب كل مختال فخور
    surahName: Luqman
    juz: 21
