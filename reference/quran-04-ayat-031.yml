  data:
    ref: '31:19'
    scripture: quran
    name: Quran 31:19
    chapter: 31
    verse: 19
    ordinal: 3488
    text: Be modest in thy bearing and subdue thy voice. Lo! the harshest of all voices is the voice of the ass.
    translation: Pickthall
    original: وَٱقْصِدْ فِى مَشْيِكَ وَٱغْضُضْ مِن صَوْتِكَ ۚ إِنَّ أَنكَرَ ٱلْأَصْوَٰتِ لَصَوْتُ ٱلْحَمِيرِ
    arabicPlain: واقصد في مشيك واغضض من صوتك ۚ إن أنكر الأصوات لصوت الحمير
