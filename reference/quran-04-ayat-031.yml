  data:
    ref: '31:25'
    scripture: quran
    name: Quran 31:25
    chapter: 31
    verse: 25
    ordinal: 3494
    text: 'If thou shouldst ask them: Who created the heavens and the earth? they would answer: Allah. Say: Praise be to Allah! But most of them know not.'
    translation: Pickthall
    original: وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ لَيَقُولُنَّ ٱللَّهُ ۚ قُلِ ٱلْحَمْدُ لِلَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ
    arabicPlain: ولئن سألتهم من خلق السماوات والأرض ليقولن الله ۚ قل الحمد لله ۚ بل أكثرهم لا يعلمون
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 357
    page: 413
