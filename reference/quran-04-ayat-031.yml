- type: Ayah
  data:
    ref: '31:10'
    scripture: quran
    name: Quran 31:10
    chapter: 31
    verse: 10
    ordinal: 3479
    text: He hath created the heavens without supports that ye can see, and hath cast into the earth firm hills, so that it quake not with you; and He hath dispersed therein all kinds of beasts. And We send down water from the sky and We cause (plants) of every goodly kind to grow therein.
    translation: Pickthall
    original: خَلَقَ ٱلسَّمَـٰوَٰتِ بِغَيْرِ عَمَدٍ تَرَوْنَهَا ۖ وَأَلْقَىٰ فِى ٱلْأَرْضِ رَوَٰسِىَ أَن تَمِيدَ بِكُمْ وَبَثَّ فِيهَا مِن كُلِّ دَآبَّةٍ ۚ وَأَنزَلْنَا مِنَ ٱلسَّمَآءِ مَآءً فَأَنۢبَتْنَا فِيهَا مِن كُلِّ زَوْجٍ كَرِيمٍ
    arabicPlain: خلق السماوات بغير عمد ترونها ۖ وألقى في الأرض رواسي أن تميد بكم وبث فيها من كل دابة ۚ وأنزلنا من السماء ماء فأنبتنا فيها من كل زوج كريم
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 355
