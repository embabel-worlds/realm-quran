  data:
    ref: '31:22'
    scripture: quran
    name: Quran 31:22
    chapter: 31
    verse: 22
    ordinal: 3491
    text: Whosoever surrendereth his purpose to Allah while doing good, he verily hath grasped the firm hand-hold. Unto Allah belongeth the sequel of all things.
    translation: Pickthall
    original: ۞ وَمَن يُسْلِمْ وَجْهَهُۥٓ إِلَى ٱللَّهِ وَهُوَ مُحْسِنٌ فَقَدِ ٱسْتَمْسَكَ بِٱلْعُرْوَةِ ٱلْوُثْقَىٰ ۗ وَإِلَى ٱللَّهِ عَـٰقِبَةُ ٱلْأُمُورِ
    arabicPlain: ۞ ومن يسلم وجهه إلى الله وهو محسن فقد استمسك بالعروة الوثقى ۗ وإلى الله عاقبة الأمور
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 357
    page: 413
