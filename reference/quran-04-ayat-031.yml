- type: Ayah
  data:
    ref: '31:7'
    scripture: quran
    name: Quran 31:7
    chapter: 31
    verse: 7
    ordinal: 3476
    text: And when Our revelations are recited unto him he turneth away in pride as if he heard them not, as if there were a deafness in his ears. So give him tidings of a painful doom.
    translation: Pickthall
    original: وَإِذَا تُتْلَىٰ عَلَيْهِ ءَايَـٰتُنَا وَلَّىٰ مُسْتَكْبِرًا كَأَن لَّمْ يَسْمَعْهَا كَأَنَّ فِىٓ أُذُنَيْهِ وَقْرًا ۖ فَبَشِّرْهُ بِعَذَابٍ أَلِيمٍ
    arabicPlain: وإذا تتلى عليه آياتنا ولى مستكبرا كأن لم يسمعها كأن في أذنيه وقرا ۖ فبشره بعذاب أليم
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 355
