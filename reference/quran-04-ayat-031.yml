  data:
    ref: '31:31'
    scripture: quran
    name: Quran 31:31
    chapter: 31
    verse: 31
    ordinal: 3500
    text: Hast thou not seen how the ships glide on the sea by Allah's grace, that He may show you of His wonders? Lo! therein indeed are portents for every steadfast, grateful (heart).
    translation: Pickthall
    original: أَلَمْ تَرَ أَنَّ ٱلْفُلْكَ تَجْرِى فِى ٱلْبَحْرِ بِنِعْمَتِ ٱللَّهِ لِيُرِيَكُم مِّنْ ءَايَـٰتِهِۦٓ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍ لِّكُلِّ صَبَّارٍ شَكُورٍ
    arabicPlain: ألم تر أن الفلك تجري في البحر بنعمت الله ليريكم من آياته ۚ إن في ذلك لآيات لكل صبار شكور
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 357
    page: 414
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '31'
  - predicate: IN_PORTION
    to:
      type: Juz
