- type: Ayah
  data:
    ref: '31:11'
    scripture: quran
    name: Quran 31:11
    chapter: 31
    verse: 11
    ordinal: 3480
    text: This is the Creation of Allah. Now show me that which those (ye worship) beside Him have created. Nay, but the wrong-doers are in error manifest!
    translation: Pickthall
    original: هَـٰذَا خَلْقُ ٱللَّهِ فَأَرُونِى مَاذَا خَلَقَ ٱلَّذِينَ مِن دُونِهِۦ ۚ بَلِ ٱلظَّـٰلِمُونَ فِى ضَلَـٰلٍ مُّبِينٍ
    arabicPlain: هذا خلق الله فأروني ماذا خلق الذين من دونه ۚ بل الظالمون في ضلال مبين
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 355
    page: 411
