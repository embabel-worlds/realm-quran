  data:
    ref: '31:9'
    scripture: quran
    name: Quran 31:9
    chapter: 31
    verse: 9
    ordinal: 3478
    text: Wherein they will abide. It is a promise of Allah in truth. He is the Mighty, the Wise.
    translation: Pickthall
    original: خَـٰلِدِينَ فِيهَا ۖ وَعْدَ ٱللَّهِ حَقًّا ۚ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ
    arabicPlain: خالدين فيها ۖ وعد الله حقا ۚ وهو العزيز الحكيم
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 355
