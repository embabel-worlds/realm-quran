  data:
    ref: '31:28'
    scripture: quran
    name: Quran 31:28
    chapter: 31
    verse: 28
    ordinal: 3497
    text: Your creation and your raising (from the dead) are only as (the creation and the raising of) a single soul. Lo! Allah is Hearer, Knower.
    translation: Pickthall
    original: مَّا خَلْقُكُمْ وَلَا بَعْثُكُمْ إِلَّا كَنَفْسٍ وَٰحِدَةٍ ۗ إِنَّ ٱللَّهَ سَمِيعٌۢ بَصِيرٌ
    arabicPlain: ما خلقكم ولا بعثكم إلا كنفس واحدة ۗ إن الله سميع بصير
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 357
    page: 413
