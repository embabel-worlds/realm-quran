  data:
    ref: '31:26'
    scripture: quran
    name: Quran 31:26
    chapter: 31
    verse: 26
    ordinal: 3495
    text: Unto Allah belongeth whatsoever is in the heavens and the earth. Lo! Allah, He is the Absolute, the Owner of Praise.
    translation: Pickthall
    original: لِلَّهِ مَا فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۚ إِنَّ ٱللَّهَ هُوَ ٱلْغَنِىُّ ٱلْحَمِيدُ
    arabicPlain: لله ما في السماوات والأرض ۚ إن الله هو الغني الحميد
    surahName: Luqman
    juz: 21
    manzil: 5
    ruku: 357
    page: 413
