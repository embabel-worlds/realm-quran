    scripture: quran
    name: Quran 14:46
    chapter: 14
    verse: 46
    ordinal: 1796
    text: Verily they have plotted their plot, and their plot is with Allah, though their plot were one whereby the mountains should be moved.
    translation: Pickthall
    original: وَقَدْ مَكَرُوا۟ مَكْرَهُمْ وَعِندَ ٱللَّهِ مَكْرُهُمْ وَإِن كَانَ مَكْرُهُمْ لِتَزُولَ مِنْهُ ٱلْجِبَالُ
    arabicPlain: وقد مكروا مكرهم وعند الله مكرهم وإن كان مكرهم لتزول منه الجبال
    surahName: Ibrahim
