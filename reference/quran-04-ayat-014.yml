- type: Ayah
  data:
    ref: '14:14'
    scripture: quran
    name: Quran 14:14
    chapter: 14
    verse: 14
    ordinal: 1764
    text: And verily We shall make you to dwell in the land after them. This is for him who feareth My Majesty and feareth My threats.
    translation: Pickthall
    original: وَلَنُسْكِنَنَّكُمُ ٱلْأَرْضَ مِنۢ بَعْدِهِمْ ۚ ذَٰلِكَ لِمَنْ خَافَ مَقَامِى وَخَافَ وَعِيدِ
    arabicPlain: ولنسكننكم الأرض من بعدهم ۚ ذلك لمن خاف مقامي وخاف وعيد
    surahName: Ibrahim
