- type: Ayah
  data:
    ref: '14:3'
    scripture: quran
    name: Quran 14:3
    chapter: 14
    verse: 3
    ordinal: 1753
    text: 'Those who love the life of the world more than the Hereafter, and debar (men) from the way of Allah and would have it crooked: such are far astray.'
    translation: Pickthall
    original: ٱلَّذِينَ يَسْتَحِبُّونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا عَلَى ٱلْـَٔاخِرَةِ وَيَصُدُّونَ عَن سَبِيلِ ٱللَّهِ وَيَبْغُونَهَا عِوَجًا ۚ أُو۟لَـٰٓئِكَ فِى ضَلَـٰلٍۭ بَعِيدٍ
    arabicPlain: الذين يستحبون الحياة الدنيا على الآخرة ويصدون عن سبيل الله ويبغونها عوجا ۚ أولئك في ضلال بعيد
    surahName: Ibrahim
    juz: 13
