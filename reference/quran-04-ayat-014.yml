    original: رَبَّنَا ٱغْفِرْ لِى وَلِوَٰلِدَىَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ ٱلْحِسَابُ
    arabicPlain: ربنا اغفر لي ولوالدي وللمؤمنين يوم يقوم الحساب
