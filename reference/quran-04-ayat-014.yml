- type: Ayah
  data:
    ref: '14:9'
    scripture: quran
    name: Quran 14:9
    chapter: 14
    verse: 9
    ordinal: 1759
    text: 'Hath not the history of those before you reached you: the folk of Noah, and (the tribes of) A''ad and Thamud, and those after them? None save Allah knoweth them. Their messengers came unto them with clear proofs, but they thrust their hands into their mouths, and said: Lo! we disbelieve in that wherewith ye have been sent, and lo! we are in grave doubt concerning that to which ye call us.'
    translation: Pickthall
    original: أَلَمْ يَأْتِكُمْ نَبَؤُا۟ ٱلَّذِينَ مِن قَبْلِكُمْ قَوْمِ نُوحٍ وَعَادٍ وَثَمُودَ ۛ وَٱلَّذِينَ مِنۢ بَعْدِهِمْ ۛ لَا يَعْلَمُهُمْ إِلَّا ٱللَّهُ ۚ جَآءَتْهُمْ رُسُلُهُم بِٱلْبَيِّنَـٰتِ فَرَدُّوٓا۟ أَيْدِيَهُمْ فِىٓ أَفْوَٰهِهِمْ وَقَالُوٓا۟ إِنَّا كَفَرْنَا بِمَآ أُرْسِلْتُم بِهِۦ وَإِنَّا لَفِى شَكٍّ مِّمَّا تَدْعُونَنَآ إِلَيْهِ مُرِيبٍ
    arabicPlain: ألم يأتكم نبأ الذين من قبلكم قوم نوح وعاد وثمود ۛ والذين من بعدهم ۛ لا يعلمهم إلا الله ۚ جاءتهم رسلهم بالبينات فردوا أيديهم في أفواههم وقالوا إنا كفرنا بما أرسلتم به وإنا لفي شك مما تدعوننا إليه مريب
    surahName: Ibrahim
    juz: 13
    manzil: 3
    ruku: 212
    page: 256
  relations:
  - predicate: IN
    to:
