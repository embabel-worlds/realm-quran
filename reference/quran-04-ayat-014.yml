- type: Ayah
  data:
    ref: '14:10'
    scripture: quran
    name: Quran 14:10
    chapter: 14
    verse: 10
    ordinal: 1760
    text: 'Their messengers said: Can there be doubt concerning Allah, the Creator of the heavens and the earth? He calleth you that He may forgive you your sins and reprieve you unto an appointed term. They said: Ye are but mortals like us, who would fain turn us away from what our fathers used to worship. Then bring some clear warrant.'
    translation: Pickthall
    original: ۞ قَالَتْ رُسُلُهُمْ أَفِى ٱللَّهِ شَكٌّ فَاطِرِ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۖ يَدْعُوكُمْ لِيَغْفِرَ لَكُم مِّن ذُنُوبِكُمْ وَيُؤَخِّرَكُمْ إِلَىٰٓ أَجَلٍ مُّسَمًّى ۚ قَالُوٓا۟ إِنْ أَنتُمْ إِلَّا بَشَرٌ مِّثْلُنَا تُرِيدُونَ أَن تَصُدُّونَا عَمَّا كَانَ يَعْبُدُ ءَابَآؤُنَا فَأْتُونَا بِسُلْطَـٰنٍ مُّبِينٍ
    arabicPlain: ۞ قالت رسلهم أفي الله شك فاطر السماوات والأرض ۖ يدعوكم ليغفر لكم من ذنوبكم ويؤخركم إلى أجل مسمى ۚ قالوا إن أنتم إلا بشر مثلنا تريدون أن تصدونا عما كان يعبد آباؤنا فأتونا بسلطان مبين
    surahName: Ibrahim
    juz: 13
    manzil: 3
    ruku: 212
    page: 256
  relations:
  - predicate: IN
    to:
      type: Surah
