    verse: 27
    ordinal: 1777
    text: Allah confirmeth those who believe by a firm saying in the life of the world and in the Hereafter, and Allah sendeth wrong-doers astray. And Allah doeth what He will.
    translation: Pickthall
    original: يُثَبِّتُ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ بِٱلْقَوْلِ ٱلثَّابِتِ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَفِى ٱلْـَٔاخِرَةِ ۖ وَيُضِلُّ ٱللَّهُ ٱلظَّـٰلِمِينَ ۚ وَيَفْعَلُ ٱللَّهُ مَا يَشَآءُ
    arabicPlain: يثبت الله الذين آمنوا بالقول الثابت في الحياة الدنيا وفي الآخرة ۖ ويضل الله الظالمين ۚ ويفعل الله ما يشاء
