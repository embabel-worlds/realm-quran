    name: Quran 14:25
    chapter: 14
    verse: 25
    ordinal: 1775
    text: Giving its fruit at every season by permission of its Lord? Allah coineth the similitudes for mankind in order that they may reflect.
    translation: Pickthall
    original: تُؤْتِىٓ أُكُلَهَا كُلَّ حِينٍۭ بِإِذْنِ رَبِّهَا ۗ وَيَضْرِبُ ٱللَّهُ ٱلْأَمْثَالَ لِلنَّاسِ لَعَلَّهُمْ يَتَذَكَّرُونَ
