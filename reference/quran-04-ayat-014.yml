    name: Quran 14:49
    chapter: 14
    verse: 49
    ordinal: 1799
    text: Thou wilt see the guilty on that day linked together in chains,
    translation: Pickthall
    original: وَتَرَى ٱلْمُجْرِمِينَ يَوْمَئِذٍ مُّقَرَّنِينَ فِى ٱلْأَصْفَادِ
