  data:
    ref: '14:35'
    scripture: quran
    name: Quran 14:35
    chapter: 14
    verse: 35
    ordinal: 1785
    text: 'And when Abraham said: My Lord! Make safe this territory, and preserve me and my sons from serving idols.'
    translation: Pickthall
    original: وَإِذْ قَالَ إِبْرَٰهِيمُ رَبِّ ٱجْعَلْ هَـٰذَا ٱلْبَلَدَ ءَامِنًا وَٱجْنُبْنِى وَبَنِىَّ أَن نَّعْبُدَ ٱلْأَصْنَامَ
    arabicPlain: وإذ قال إبراهيم رب اجعل هذا البلد آمنا واجنبني وبني أن نعبد الأصنام
