- type: Ayah
  data:
    ref: '14:4'
    scripture: quran
    name: Quran 14:4
    chapter: 14
    verse: 4
    ordinal: 1754
    text: And We never sent a messenger save with the language of his folk, that he might make (the message) clear for them. Then Allah sendeth whom He will astray, and guideth whom He will. He is the Mighty, the Wise.
    translation: Pickthall
    original: وَمَآ أَرْسَلْنَا مِن رَّسُولٍ إِلَّا بِلِسَانِ قَوْمِهِۦ لِيُبَيِّنَ لَهُمْ ۖ فَيُضِلُّ ٱللَّهُ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ ۚ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ
    arabicPlain: وما أرسلنا من رسول إلا بلسان قومه ليبين لهم ۖ فيضل الله من يشاء ويهدي من يشاء ۚ وهو العزيز الحكيم
    surahName: Ibrahim
    juz: 13
    manzil: 3
    ruku: 211
    page: 255
