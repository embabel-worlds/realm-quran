- type: Ayah
  data:
    ref: '14:11'
    scripture: quran
    name: Quran 14:11
    chapter: 14
    verse: 11
    ordinal: 1761
    text: 'Their messengers said unto them: We are but mortals like you, but Allah giveth grace unto whom He will of His slaves. It is not ours to bring you a warrant unless by the permission of Allah. In Allah let believers put their trust!'
    translation: Pickthall
    original: قَالَتْ لَهُمْ رُسُلُهُمْ إِن نَّحْنُ إِلَّا بَشَرٌ مِّثْلُكُمْ وَلَـٰكِنَّ ٱللَّهَ يَمُنُّ عَلَىٰ مَن يَشَآءُ مِنْ عِبَادِهِۦ ۖ وَمَا كَانَ لَنَآ أَن نَّأْتِيَكُم بِسُلْطَـٰنٍ إِلَّا بِإِذْنِ ٱللَّهِ ۚ وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ
    arabicPlain: قالت لهم رسلهم إن نحن إلا بشر مثلكم ولكن الله يمن على من يشاء من عباده ۖ وما كان لنا أن نأتيكم بسلطان إلا بإذن الله ۚ وعلى الله فليتوكل المؤمنون
    surahName: Ibrahim
    juz: 13
    manzil: 3
    ruku: 212
    page: 257
  relations:
