- type: Ayah
  data:
    ref: '14:7'
    scripture: quran
    name: Quran 14:7
    chapter: 14
    verse: 7
    ordinal: 1757
    text: 'And when your Lord proclaimed: If ye give thanks, I will give you more; but if ye are thankless, lo! My punishment is dire.'
    translation: Pickthall
    original: وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ ۖ وَلَئِن كَفَرْتُمْ إِنَّ عَذَابِى لَشَدِيدٌ
    arabicPlain: وإذ تأذن ربكم لئن شكرتم لأزيدنكم ۖ ولئن كفرتم إن عذابي لشديد
    surahName: Ibrahim
    juz: 13
    manzil: 3
    ruku: 212
    page: 256
