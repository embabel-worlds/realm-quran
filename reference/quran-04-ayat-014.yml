- type: Ayah
  data:
    ref: '14:13'
    scripture: quran
    name: Quran 14:13
    chapter: 14
    verse: 13
    ordinal: 1763
    text: 'And those who disbelieved said unto their messengers: Verily we will drive you out from our land, unless ye return to our religion. Then their Lord inspired them, (saying): Verily we shall destroy the wrong-doers,'
    translation: Pickthall
    original: وَقَالَ ٱلَّذِينَ كَفَرُوا۟ لِرُسُلِهِمْ لَنُخْرِجَنَّكُم مِّنْ أَرْضِنَآ أَوْ لَتَعُودُنَّ فِى مِلَّتِنَا ۖ فَأَوْحَىٰٓ إِلَيْهِمْ رَبُّهُمْ لَنُهْلِكَنَّ ٱلظَّـٰلِمِينَ
    arabicPlain: وقال الذين كفروا لرسلهم لنخرجنكم من أرضنا أو لتعودن في ملتنا ۖ فأوحى إليهم ربهم لنهلكن الظالمين
    surahName: Ibrahim
    juz: 13
    manzil: 3
    ruku: 213
    page: 257
