- type: Ayah
  data:
    ref: '14:8'
    scripture: quran
    name: Quran 14:8
    chapter: 14
    verse: 8
    ordinal: 1758
    text: 'And Moses said: Though ye and all who are in the earth prove thankless, lo! Allah verily is Absolute, Owner of Praise.'
    translation: Pickthall
    original: وَقَالَ مُوسَىٰٓ إِن تَكْفُرُوٓا۟ أَنتُمْ وَمَن فِى ٱلْأَرْضِ جَمِيعًا فَإِنَّ ٱللَّهَ لَغَنِىٌّ حَمِيدٌ
    arabicPlain: وقال موسى إن تكفروا أنتم ومن في الأرض جميعا فإن الله لغني حميد
    surahName: Ibrahim
    juz: 13
    manzil: 3
    ruku: 212
    page: 256
