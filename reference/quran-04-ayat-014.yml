  data:
    ref: '14:30'
    scripture: quran
    name: Quran 14:30
    chapter: 14
    verse: 30
    ordinal: 1780
    text: 'And they set up rivals to Allah that they may mislead (men) from His way. Say: Enjoy life (while ye may) for lo! your journey''s end will be the Fire.'
    translation: Pickthall
    original: وَجَعَلُوا۟ لِلَّهِ أَندَادًا لِّيُضِلُّوا۟ عَن سَبِيلِهِۦ ۗ قُلْ تَمَتَّعُوا۟ فَإِنَّ مَصِيرَكُمْ إِلَى ٱلنَّارِ
    arabicPlain: وجعلوا لله أندادا ليضلوا عن سبيله ۗ قل تمتعوا فإن مصيركم إلى النار
    surahName: Ibrahim
