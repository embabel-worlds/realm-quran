    name: Quran 14:38
    chapter: 14
    verse: 38
    ordinal: 1788
    text: Our Lord! Lo! Thou knowest that which we hide and that which we proclaim. Nothing in the earth or in the heaven is hidden from Allah.
    translation: Pickthall
    original: رَبَّنَآ إِنَّكَ تَعْلَمُ مَا نُخْفِى وَمَا نُعْلِنُ ۗ وَمَا يَخْفَىٰ عَلَى ٱللَّهِ مِن شَىْءٍ فِى ٱلْأَرْضِ وَلَا فِى ٱلسَّمَآءِ
    arabicPlain: ربنا إنك تعلم ما نخفي وما نعلن ۗ وما يخفى على الله من شيء في الأرض ولا في السماء
