    scripture: quran
    name: Quran 14:36
    chapter: 14
    verse: 36
    ordinal: 1786
    text: My Lord! Lo! they have led many of mankind astray. But whoso followeth me, he verily is of me. And whoso disobeyeth me - Still Thou art Forgiving, Merciful.
    translation: Pickthall
    original: رَبِّ إِنَّهُنَّ أَضْلَلْنَ كَثِيرًا مِّنَ ٱلنَّاسِ ۖ فَمَن تَبِعَنِى فَإِنَّهُۥ مِنِّى ۖ وَمَنْ عَصَانِى فَإِنَّكَ غَفُورٌ رَّحِيمٌ
    arabicPlain: رب إنهن أضللن كثيرا من الناس ۖ فمن تبعني فإنه مني ۖ ومن عصاني فإنك غفور رحيم
