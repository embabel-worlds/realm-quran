  data:
    ref: '14:2'
    scripture: quran
    name: Quran 14:2
    chapter: 14
    verse: 2
    ordinal: 1752
    text: Allah, unto Whom belongeth whatsoever is in the heavens and whatsoever is in the earth. and woe unto the disbelievers from an awful doom;
    translation: Pickthall
    original: ٱللَّهِ ٱلَّذِى لَهُۥ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ وَوَيْلٌ لِّلْكَـٰفِرِينَ مِنْ عَذَابٍ شَدِيدٍ
    arabicPlain: الله الذي له ما في السماوات وما في الأرض ۗ وويل للكافرين من عذاب شديد
