- type: Ayah
  data:
    ref: '14:6'
    scripture: quran
    name: Quran 14:6
    chapter: 14
    verse: 6
    ordinal: 1756
    text: 'And (remind them) how Moses said unto his people: Remember Allah''s favour unto you when He delivered you from Pharaoh''s folk who were afflicting you with dreadful torment, and were slaying your sons and sparing your women; that was a tremendous trial from your Lord.'
    translation: Pickthall
    original: وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِ ٱذْكُرُوا۟ نِعْمَةَ ٱللَّهِ عَلَيْكُمْ إِذْ أَنجَىٰكُم مِّنْ ءَالِ فِرْعَوْنَ يَسُومُونَكُمْ سُوٓءَ ٱلْعَذَابِ وَيُذَبِّحُونَ أَبْنَآءَكُمْ وَيَسْتَحْيُونَ نِسَآءَكُمْ ۚ وَفِى ذَٰلِكُم بَلَآءٌ مِّن رَّبِّكُمْ عَظِيمٌ
    arabicPlain: وإذ قال موسى لقومه اذكروا نعمة الله عليكم إذ أنجاكم من آل فرعون يسومونكم سوء العذاب ويذبحون أبناءكم ويستحيون نساءكم ۚ وفي ذلكم بلاء من ربكم عظيم
    surahName: Ibrahim
    juz: 13
    manzil: 3
    ruku: 211
    page: 256
  relations:
