- type: Ayah
  data:
    ref: '14:5'
    scripture: quran
    name: Quran 14:5
    chapter: 14
    verse: 5
    ordinal: 1755
    text: 'We verily sent Moses with Our revelations, saying: Bring thy people forth from darkness unto light. And remind them of the days of Allah. Lo! therein are revelations for each steadfast, thankful (heart).'
    translation: Pickthall
    original: وَلَقَدْ أَرْسَلْنَا مُوسَىٰ بِـَٔايَـٰتِنَآ أَنْ أَخْرِجْ قَوْمَكَ مِنَ ٱلظُّلُمَـٰتِ إِلَى ٱلنُّورِ وَذَكِّرْهُم بِأَيَّىٰمِ ٱللَّهِ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍ لِّكُلِّ صَبَّارٍ شَكُورٍ
    arabicPlain: ولقد أرسلنا موسى بآياتنا أن أخرج قومك من الظلمات إلى النور وذكرهم بأيام الله ۚ إن في ذلك لآيات لكل صبار شكور
    surahName: Ibrahim
    juz: 13
    manzil: 3
    ruku: 211
    page: 255
