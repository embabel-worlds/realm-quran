    scripture: quran
    name: Quran 14:43
    chapter: 14
    verse: 43
    ordinal: 1793
    text: As they come hurrying on in fear, their heads upraised, their gaze returning not to them, and their hearts as air.
    translation: Pickthall
    original: مُهْطِعِينَ مُقْنِعِى رُءُوسِهِمْ لَا يَرْتَدُّ إِلَيْهِمْ طَرْفُهُمْ ۖ وَأَفْـِٔدَتُهُمْ هَوَآءٌ
