    scripture: quran
    name: Quran 14:26
    chapter: 14
    verse: 26
    ordinal: 1776
    text: And the similitude of a bad saying is as a bad tree, uprooted from upon the earth, possessing no stability.
    translation: Pickthall
    original: وَمَثَلُ كَلِمَةٍ خَبِيثَةٍ كَشَجَرَةٍ خَبِيثَةٍ ٱجْتُثَّتْ مِن فَوْقِ ٱلْأَرْضِ مَا لَهَا مِن قَرَارٍ
    arabicPlain: ومثل كلمة خبيثة كشجرة خبيثة اجتثت من فوق الأرض ما لها من قرار
