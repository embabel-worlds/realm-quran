  data:
    ref: '14:18'
    scripture: quran
    name: Quran 14:18
    chapter: 14
    verse: 18
    ordinal: 1768
    text: 'A similitude of those who disbelieve in their Lord: Their works are as ashes which the wind bloweth hard upon a stormy day. They have no control of aught that they have earned. That is the extreme failure.'
    translation: Pickthall
    original: مَّثَلُ ٱلَّذِينَ كَفَرُوا۟ بِرَبِّهِمْ ۖ أَعْمَـٰلُهُمْ كَرَمَادٍ ٱشْتَدَّتْ بِهِ ٱلرِّيحُ فِى يَوْمٍ عَاصِفٍ ۖ لَّا يَقْدِرُونَ مِمَّا كَسَبُوا۟ عَلَىٰ شَىْءٍ ۚ ذَٰلِكَ هُوَ ٱلضَّلَـٰلُ ٱلْبَعِيدُ
    arabicPlain: مثل الذين كفروا بربهم ۖ أعمالهم كرماد اشتدت به الريح في يوم عاصف ۖ لا يقدرون مما كسبوا على شيء ۚ ذلك هو الضلال البعيد
