    scripture: quran
    name: Quran 14:42
    chapter: 14
    verse: 42
    ordinal: 1792
    text: Deem not that Allah is unaware of what the wicked do. He but giveth them a respite till a day when eyes will stare (in terror),
    translation: Pickthall
    original: وَلَا تَحْسَبَنَّ ٱللَّهَ غَـٰفِلًا عَمَّا يَعْمَلُ ٱلظَّـٰلِمُونَ ۚ إِنَّمَا يُؤَخِّرُهُمْ لِيَوْمٍ تَشْخَصُ فِيهِ ٱلْأَبْصَـٰرُ
