- type: Ayah
  data:
    ref: '14:12'
    scripture: quran
    name: Quran 14:12
    chapter: 14
    verse: 12
    ordinal: 1762
    text: How should we not put our trust in Allah when He hath shown us our ways? We surely will endure the hurt ye do us. In Allah let the trusting put their trust.
    translation: Pickthall
    original: وَمَا لَنَآ أَلَّا نَتَوَكَّلَ عَلَى ٱللَّهِ وَقَدْ هَدَىٰنَا سُبُلَنَا ۚ وَلَنَصْبِرَنَّ عَلَىٰ مَآ ءَاذَيْتُمُونَا ۚ وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُتَوَكِّلُونَ
    arabicPlain: وما لنا ألا نتوكل على الله وقد هدانا سبلنا ۚ ولنصبرن على ما آذيتمونا ۚ وعلى الله فليتوكل المتوكلون
    surahName: Ibrahim
    juz: 13
    manzil: 3
    ruku: 212
    page: 257
  relations:
  - predicate: IN
    to:
      type: Surah
