    ref: '36:15'
    scripture: quran
    name: Quran 36:15
    chapter: 36
    verse: 15
    ordinal: 3720
    text: 'They said: Ye are but mortals like unto us. The Beneficent hath naught revealed. Ye do but lie!'
    translation: Pickthall
    original: قَالُوا۟ مَآ أَنتُمْ إِلَّا بَشَرٌ مِّثْلُنَا وَمَآ أَنزَلَ ٱلرَّحْمَـٰنُ مِن شَىْءٍ إِنْ أَنتُمْ إِلَّا تَكْذِبُونَ
    arabicPlain: قالوا ما أنتم إلا بشر مثلنا وما أنزل الرحمن من شيء إن أنتم إلا تكذبون
    surahName: Yaseen
