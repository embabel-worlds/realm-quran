  data:
    ref: '36:18'
    scripture: quran
    name: Quran 36:18
    chapter: 36
    verse: 18
    ordinal: 3723
    text: '(The people of the city) said: We augur ill of you. If ye desist not, we shall surely stone you, and grievous torture will befall you at our hands.'
    translation: Pickthall
    original: قَالُوٓا۟ إِنَّا تَطَيَّرْنَا بِكُمْ ۖ لَئِن لَّمْ تَنتَهُوا۟ لَنَرْجُمَنَّكُمْ وَلَيَمَسَّنَّكُم مِّنَّا عَذَابٌ أَلِيمٌ
