  data:
    ref: '36:14'
    scripture: quran
    name: Quran 36:14
    chapter: 36
    verse: 14
    ordinal: 3719
    text: 'When We sent unto them twain, and they denied them both, so We reinforced them with a third, and they said: Lo! we have been sent unto you.'
    translation: Pickthall
    original: إِذْ أَرْسَلْنَآ إِلَيْهِمُ ٱثْنَيْنِ فَكَذَّبُوهُمَا فَعَزَّزْنَا بِثَالِثٍ فَقَالُوٓا۟ إِنَّآ إِلَيْكُم مُّرْسَلُونَ
    arabicPlain: إذ أرسلنا إليهم اثنين فكذبوهما فعززنا بثالث فقالوا إنا إليكم مرسلون
    surahName: Yaseen
