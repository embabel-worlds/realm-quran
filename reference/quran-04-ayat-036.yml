    scripture: quran
    name: Quran 36:8
    chapter: 36
    verse: 8
    ordinal: 3713
    text: Lo! We have put on their necks carcans reaching unto the chins, so that they are made stiff-necked.
    translation: Pickthall
    original: إِنَّا جَعَلْنَا فِىٓ أَعْنَـٰقِهِمْ أَغْلَـٰلًا فَهِىَ إِلَى ٱلْأَذْقَانِ فَهُم مُّقْمَحُونَ
