    ref: '36:9'
    scripture: quran
    name: Quran 36:9
    chapter: 36
    verse: 9
    ordinal: 3714
    text: And We have set a bar before them and a bar behind them, and (thus) have covered them so that they see not.
    translation: Pickthall
    original: وَجَعَلْنَا مِنۢ بَيْنِ أَيْدِيهِمْ سَدًّا وَمِنْ خَلْفِهِمْ سَدًّا فَأَغْشَيْنَـٰهُمْ فَهُمْ لَا يُبْصِرُونَ
    arabicPlain: وجعلنا من بين أيديهم سدا ومن خلفهم سدا فأغشيناهم فهم لا يبصرون
