    translation: Pickthall
    original: قَالُوا۟ طَـٰٓئِرُكُم مَّعَكُمْ ۚ أَئِن ذُكِّرْتُم ۚ بَلْ أَنتُمْ قَوْمٌ مُّسْرِفُونَ
    arabicPlain: قالوا طائركم معكم ۚ أئن ذكرتم ۚ بل أنتم قوم مسرفون
    surahName: Yaseen
    juz: 22
