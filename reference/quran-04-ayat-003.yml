  data:
    ref: 3:73
    scripture: quran
    name: Quran 3:73
    chapter: 3
    verse: 73
    ordinal: 366
    text: 'And believe not save in one who followeth your religion - Say (O Muhammad): Lo! the guidance is Allah''s Guidance - that anyone is given the like of that which was given unto you or that they may argue with you in the presence of their Lord. Say (O Muhammad): Lo! the bounty is in Allah''s hand. He bestoweth it on whom He will. Allah is All-Embracing, All-Knowing.'
    translation: Pickthall
    original: وَلَا تُؤْمِنُوٓا۟ إِلَّا لِمَن تَبِعَ دِينَكُمْ قُلْ إِنَّ ٱلْهُدَىٰ هُدَى ٱللَّهِ أَن يُؤْتَىٰٓ أَحَدٌ مِّثْلَ مَآ أُوتِيتُمْ أَوْ يُحَآجُّوكُمْ عِندَ رَبِّكُمْ ۗ قُلْ إِنَّ ٱلْفَضْلَ بِيَدِ ٱللَّهِ يُؤْتِيهِ مَن يَشَآءُ ۗ وَٱللَّهُ وَٰسِعٌ عَلِيمٌ
    arabicPlain: ولا تؤمنوا إلا لمن تبع دينكم قل إن الهدى هدى الله أن يؤتى أحد مثل ما أوتيتم أو يحاجوكم عند ربكم ۗ قل إن الفضل بيد الله يؤتيه من يشاء ۗ والله واسع عليم
    surahName: Aal-i-Imraan
    juz: 3
    manzil: 1
    ruku: 49
    page: 59
