  data:
    ref: 3:149
    scripture: quran
    name: Quran 3:149
    chapter: 3
    verse: 149
    ordinal: 442
    text: O ye who believe! if ye obey those who disbelieve, they will make you turn back on your heels, and ye turn back as losers.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن تُطِيعُوا۟ ٱلَّذِينَ كَفَرُوا۟ يَرُدُّوكُمْ عَلَىٰٓ أَعْقَـٰبِكُمْ فَتَنقَلِبُوا۟ خَـٰسِرِينَ
    arabicPlain: يا أيها الذين آمنوا إن تطيعوا الذين كفروا يردوكم على أعقابكم فتنقلبوا خاسرين
    surahName: Aal-i-Imraan
