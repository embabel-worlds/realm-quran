  data:
    ref: 3:108
    scripture: quran
    name: Quran 3:108
    chapter: 3
    verse: 108
    ordinal: 401
    text: These are revelations of Allah. We recite them unto thee in truth. Allah willeth no injustice to (His) creatures.
    translation: Pickthall
    original: تِلْكَ ءَايَـٰتُ ٱللَّهِ نَتْلُوهَا عَلَيْكَ بِٱلْحَقِّ ۗ وَمَا ٱللَّهُ يُرِيدُ ظُلْمًا لِّلْعَـٰلَمِينَ
    arabicPlain: تلك آيات الله نتلوها عليك بالحق ۗ وما الله يريد ظلما للعالمين
