  data:
    ref: 3:99
    scripture: quran
    name: Quran 3:99
    chapter: 3
    verse: 99
    ordinal: 392
    text: 'Say: O People of the Scripture! Why drive ye back believers from the way of Allah, seeking to make it crooked, when ye are witnesses (to Allah''s guidance)? Allah is not unaware of what ye do.'
    translation: Pickthall
    original: قُلْ يَـٰٓأَهْلَ ٱلْكِتَـٰبِ لِمَ تَصُدُّونَ عَن سَبِيلِ ٱللَّهِ مَنْ ءَامَنَ تَبْغُونَهَا عِوَجًا وَأَنتُمْ شُهَدَآءُ ۗ وَمَا ٱللَّهُ بِغَـٰفِلٍ عَمَّا تَعْمَلُونَ
    arabicPlain: قل يا أهل الكتاب لم تصدون عن سبيل الله من آمن تبغونها عوجا وأنتم شهداء ۗ وما الله بغافل عما تعملون
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
