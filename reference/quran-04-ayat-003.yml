  data:
    ref: 3:115
    scripture: quran
    name: Quran 3:115
    chapter: 3
    verse: 115
    ordinal: 408
    text: And whatever good they do, they will not be denied the meed thereof. Allah is Aware of those who ward off (evil).
    translation: Pickthall
    original: وَمَا يَفْعَلُوا۟ مِنْ خَيْرٍ فَلَن يُكْفَرُوهُ ۗ وَٱللَّهُ عَلِيمٌۢ بِٱلْمُتَّقِينَ
    arabicPlain: وما يفعلوا من خير فلن يكفروه ۗ والله عليم بالمتقين
