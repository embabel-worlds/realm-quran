    name: Quran 3:143
    chapter: 3
    verse: 143
    ordinal: 436
    text: And verily ye used to wish for death before ye met it (in the field). Now ye have seen it with your eyes!
    translation: Pickthall
    original: وَلَقَدْ كُنتُمْ تَمَنَّوْنَ ٱلْمَوْتَ مِن قَبْلِ أَن تَلْقَوْهُ فَقَدْ رَأَيْتُمُوهُ وَأَنتُمْ تَنظُرُونَ
