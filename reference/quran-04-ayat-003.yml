  data:
    ref: '3:28'
    scripture: quran
    name: Quran 3:28
    chapter: 3
    verse: 28
    ordinal: 321
    text: Let not the believers take disbelievers for their friends in preference to believers. Whoso doeth that hath no connection with Allah unless (it be) that ye but guard yourselves against them, taking (as it were) security. Allah biddeth you beware (only) of Himself. Unto Allah is the journeying.
    translation: Pickthall
    original: لَّا يَتَّخِذِ ٱلْمُؤْمِنُونَ ٱلْكَـٰفِرِينَ أَوْلِيَآءَ مِن دُونِ ٱلْمُؤْمِنِينَ ۖ وَمَن يَفْعَلْ ذَٰلِكَ فَلَيْسَ مِنَ ٱللَّهِ فِى شَىْءٍ إِلَّآ أَن تَتَّقُوا۟ مِنْهُمْ تُقَىٰةً ۗ وَيُحَذِّرُكُمُ ٱللَّهُ نَفْسَهُۥ ۗ وَإِلَى ٱللَّهِ ٱلْمَصِيرُ
    arabicPlain: لا يتخذ المؤمنون الكافرين أولياء من دون المؤمنين ۖ ومن يفعل ذلك فليس من الله في شيء إلا أن تتقوا منهم تقاة ۗ ويحذركم الله نفسه ۗ وإلى الله المصير
    surahName: Aal-i-Imraan
    juz: 3
    manzil: 1
    ruku: 44
    page: 53
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '3'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-3
