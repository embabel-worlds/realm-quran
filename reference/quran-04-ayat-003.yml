    verse: 95
    ordinal: 388
    text: 'Say: Allah speaketh truth. So follow the religion of Abraham, the upright. He was not of the idolaters.'
    translation: Pickthall
    original: قُلْ صَدَقَ ٱللَّهُ ۗ فَٱتَّبِعُوا۟ مِلَّةَ إِبْرَٰهِيمَ حَنِيفًا وَمَا كَانَ مِنَ ٱلْمُشْرِكِينَ
