    scripture: quran
    name: Quran 3:131
    chapter: 3
    verse: 131
    ordinal: 424
    text: And ward off (from yourselves) the Fire prepared for disbelievers.
    translation: Pickthall
    original: وَٱتَّقُوا۟ ٱلنَّارَ ٱلَّتِىٓ أُعِدَّتْ لِلْكَـٰفِرِينَ
    arabicPlain: واتقوا النار التي أعدت للكافرين
