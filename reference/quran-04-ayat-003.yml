    name: Quran 3:12
    chapter: 3
    verse: 12
    ordinal: 305
    text: 'Say (O Muhammad) unto those who disbelieve: Ye shall be overcome and gathered unto Hell, an evil resting-place.'
    translation: Pickthall
    original: قُل لِّلَّذِينَ كَفَرُوا۟ سَتُغْلَبُونَ وَتُحْشَرُونَ إِلَىٰ جَهَنَّمَ ۚ وَبِئْسَ ٱلْمِهَادُ
    arabicPlain: قل للذين كفروا ستغلبون وتحشرون إلى جهنم ۚ وبئس المهاد
    surahName: Aal-i-Imraan
