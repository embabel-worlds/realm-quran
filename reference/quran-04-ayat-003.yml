    scripture: quran
    name: Quran 3:48
    chapter: 3
    verse: 48
    ordinal: 341
    text: And He will teach him the Scripture and wisdom, and the Torah and the Gospel,
    translation: Pickthall
    original: وَيُعَلِّمُهُ ٱلْكِتَـٰبَ وَٱلْحِكْمَةَ وَٱلتَّوْرَىٰةَ وَٱلْإِنجِيلَ
