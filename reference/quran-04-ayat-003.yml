  data:
    ref: 3:169
    scripture: quran
    name: Quran 3:169
    chapter: 3
    verse: 169
    ordinal: 462
    text: Think not of those, who are slain in the way of Allah, as dead. Nay, they are living. With their Lord they have provision.
    translation: Pickthall
    original: وَلَا تَحْسَبَنَّ ٱلَّذِينَ قُتِلُوا۟ فِى سَبِيلِ ٱللَّهِ أَمْوَٰتًۢا ۚ بَلْ أَحْيَآءٌ عِندَ رَبِّهِمْ يُرْزَقُونَ
    arabicPlain: ولا تحسبن الذين قتلوا في سبيل الله أمواتا ۚ بل أحياء عند ربهم يرزقون
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 58
    page: 72
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '3'
  - predicate: IN_PORTION
    to:
