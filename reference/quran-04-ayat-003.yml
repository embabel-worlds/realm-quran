  data:
    ref: 3:168
    scripture: quran
    name: Quran 3:168
    chapter: 3
    verse: 168
    ordinal: 461
    text: 'Those who, while they sat at home, said of their brethren (who were fighting for the cause of Allah): If they had been guided by us they would not have been slain. Say (unto them, O Muhammad): Then avert death from yourselves if ye are truthful.'
    translation: Pickthall
    original: ٱلَّذِينَ قَالُوا۟ لِإِخْوَٰنِهِمْ وَقَعَدُوا۟ لَوْ أَطَاعُونَا مَا قُتِلُوا۟ ۗ قُلْ فَٱدْرَءُوا۟ عَنْ أَنفُسِكُمُ ٱلْمَوْتَ إِن كُنتُمْ صَـٰدِقِينَ
    arabicPlain: الذين قالوا لإخوانهم وقعدوا لو أطاعونا ما قتلوا ۗ قل فادرءوا عن أنفسكم الموت إن كنتم صادقين
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 58
    page: 72
