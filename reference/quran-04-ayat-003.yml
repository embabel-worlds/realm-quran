    scripture: quran
    name: Quran 3:122
    chapter: 3
    verse: 122
    ordinal: 415
    text: When two parties of you almost fell away, and Allah was their Protecting Friend. In Allah let believers put their trust.
    translation: Pickthall
    original: إِذْ هَمَّت طَّآئِفَتَانِ مِنكُمْ أَن تَفْشَلَا وَٱللَّهُ وَلِيُّهُمَا ۗ وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ
    arabicPlain: إذ همت طائفتان منكم أن تفشلا والله وليهما ۗ وعلى الله فليتوكل المؤمنون
