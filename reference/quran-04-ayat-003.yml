  data:
    ref: 3:105
    scripture: quran
    name: Quran 3:105
    chapter: 3
    verse: 105
    ordinal: 398
    text: And be ye not as those who separated and disputed after the clear proofs had come unto them. For such there is an awful doom,
    translation: Pickthall
    original: وَلَا تَكُونُوا۟ كَٱلَّذِينَ تَفَرَّقُوا۟ وَٱخْتَلَفُوا۟ مِنۢ بَعْدِ مَا جَآءَهُمُ ٱلْبَيِّنَـٰتُ ۚ وَأُو۟لَـٰٓئِكَ لَهُمْ عَذَابٌ عَظِيمٌ
    arabicPlain: ولا تكونوا كالذين تفرقوا واختلفوا من بعد ما جاءهم البينات ۚ وأولئك لهم عذاب عظيم
    surahName: Aal-i-Imraan
