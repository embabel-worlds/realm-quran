    scripture: quran
    name: Quran 3:158
    chapter: 3
    verse: 158
    ordinal: 451
    text: What though ye be slain or die, when unto Allah ye are gathered?
    translation: Pickthall
    original: وَلَئِن مُّتُّمْ أَوْ قُتِلْتُمْ لَإِلَى ٱللَّهِ تُحْشَرُونَ
    arabicPlain: ولئن متم أو قتلتم لإلى الله تحشرون
