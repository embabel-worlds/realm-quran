    scripture: quran
    name: Quran 3:68
    chapter: 3
    verse: 68
    ordinal: 361
    text: Lo! those of mankind who have the best claim to Abraham are those who followed him, and this Prophet and those who believe (with him); and Allah is the Protecting Guardian of the believers.
    translation: Pickthall
    original: إِنَّ أَوْلَى ٱلنَّاسِ بِإِبْرَٰهِيمَ لَلَّذِينَ ٱتَّبَعُوهُ وَهَـٰذَا ٱلنَّبِىُّ وَٱلَّذِينَ ءَامَنُوا۟ ۗ وَٱللَّهُ وَلِىُّ ٱلْمُؤْمِنِينَ
    arabicPlain: إن أولى الناس بإبراهيم للذين اتبعوه وهذا النبي والذين آمنوا ۗ والله ولي المؤمنين
