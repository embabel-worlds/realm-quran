  data:
    ref: '3:35'
    scripture: quran
    name: Quran 3:35
    chapter: 3
    verse: 35
    ordinal: 328
    text: '(Remember) when the wife of ''Imran said: My Lord! I have vowed unto Thee that which is in my belly as a consecrated (offering). Accept it from me. Lo! Thou, only Thou, art the Hearer, the Knower!'
    translation: Pickthall
    original: إِذْ قَالَتِ ٱمْرَأَتُ عِمْرَٰنَ رَبِّ إِنِّى نَذَرْتُ لَكَ مَا فِى بَطْنِى مُحَرَّرًا فَتَقَبَّلْ مِنِّىٓ ۖ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ
    arabicPlain: إذ قالت امرأت عمران رب إني نذرت لك ما في بطني محررا فتقبل مني ۖ إنك أنت السميع العليم
    surahName: Aal-i-Imraan
    juz: 3
    manzil: 1
    ruku: 45
