  data:
    ref: '3:43'
    scripture: quran
    name: Quran 3:43
    chapter: 3
    verse: 43
    ordinal: 336
    text: O Mary! Be obedient to thy Lord, prostrate thyself and bow with those who bow (in worship).
    translation: Pickthall
    original: يَـٰمَرْيَمُ ٱقْنُتِى لِرَبِّكِ وَٱسْجُدِى وَٱرْكَعِى مَعَ ٱلرَّٰكِعِينَ
