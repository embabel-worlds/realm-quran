  data:
    ref: 3:162
    scripture: quran
    name: Quran 3:162
    chapter: 3
    verse: 162
    ordinal: 455
    text: Is one who followeth the pleasure of Allah as one who hath earned condemnation from Allah, whose habitation is the Fire, a hapless journey's end?
    translation: Pickthall
    original: أَفَمَنِ ٱتَّبَعَ رِضْوَٰنَ ٱللَّهِ كَمَنۢ بَآءَ بِسَخَطٍ مِّنَ ٱللَّهِ وَمَأْوَىٰهُ جَهَنَّمُ ۚ وَبِئْسَ ٱلْمَصِيرُ
    arabicPlain: أفمن اتبع رضوان الله كمن باء بسخط من الله ومأواه جهنم ۚ وبئس المصير
    surahName: Aal-i-Imraan
    juz: 4
