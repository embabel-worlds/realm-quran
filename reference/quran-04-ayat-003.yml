  data:
    ref: 3:171
    scripture: quran
    name: Quran 3:171
    chapter: 3
    verse: 171
    ordinal: 464
    text: They rejoice because of favour from Allah and kindness, and that Allah wasteth not the wage of the believers.
    translation: Pickthall
    original: ۞ يَسْتَبْشِرُونَ بِنِعْمَةٍ مِّنَ ٱللَّهِ وَفَضْلٍ وَأَنَّ ٱللَّهَ لَا يُضِيعُ أَجْرَ ٱلْمُؤْمِنِينَ
    arabicPlain: ۞ يستبشرون بنعمة من الله وفضل وأن الله لا يضيع أجر المؤمنين
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 58
    page: 72
