  data:
    ref: 3:80
    scripture: quran
    name: Quran 3:80
    chapter: 3
    verse: 80
    ordinal: 373
    text: And he commanded you not that ye should take the angels and the prophets for lords. Would he command you to disbelieve after ye had surrendered (to Allah)?
    translation: Pickthall
    original: وَلَا يَأْمُرَكُمْ أَن تَتَّخِذُوا۟ ٱلْمَلَـٰٓئِكَةَ وَٱلنَّبِيِّـۧنَ أَرْبَابًا ۗ أَيَأْمُرُكُم بِٱلْكُفْرِ بَعْدَ إِذْ أَنتُم مُّسْلِمُونَ
    arabicPlain: ولا يأمركم أن تتخذوا الملائكة والنبيين أربابا ۗ أيأمركم بالكفر بعد إذ أنتم مسلمون
    surahName: Aal-i-Imraan
    juz: 3
    manzil: 1
    ruku: 49
    page: 60
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '3'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-3
