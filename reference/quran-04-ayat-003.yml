  data:
    ref: 3:172
    scripture: quran
    name: Quran 3:172
    chapter: 3
    verse: 172
    ordinal: 465
    text: As for those who heard the call of Allah and His messenger after the harm befell them (in the fight); for such of them as do right and ward off (evil), there is great reward.
    translation: Pickthall
    original: ٱلَّذِينَ ٱسْتَجَابُوا۟ لِلَّهِ وَٱلرَّسُولِ مِنۢ بَعْدِ مَآ أَصَابَهُمُ ٱلْقَرْحُ ۚ لِلَّذِينَ أَحْسَنُوا۟ مِنْهُمْ وَٱتَّقَوْا۟ أَجْرٌ عَظِيمٌ
    arabicPlain: الذين استجابوا لله والرسول من بعد ما أصابهم القرح ۚ للذين أحسنوا منهم واتقوا أجر عظيم
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 59
    page: 72
  relations:
