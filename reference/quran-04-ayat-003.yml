  data:
    ref: 3:113
    scripture: quran
    name: Quran 3:113
    chapter: 3
    verse: 113
    ordinal: 406
    text: They are not all alike. Of the People of the Scripture there is a staunch community who recite the revelations of Allah in the night season, falling prostrate (before Him).
    translation: Pickthall
    original: ۞ لَيْسُوا۟ سَوَآءً ۗ مِّنْ أَهْلِ ٱلْكِتَـٰبِ أُمَّةٌ قَآئِمَةٌ يَتْلُونَ ءَايَـٰتِ ٱللَّهِ ءَانَآءَ ٱلَّيْلِ وَهُمْ يَسْجُدُونَ
    arabicPlain: ۞ ليسوا سواء ۗ من أهل الكتاب أمة قائمة يتلون آيات الله آناء الليل وهم يسجدون
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 53
    page: 64
  relations:
  - predicate: IN
    to:
      type: Surah
