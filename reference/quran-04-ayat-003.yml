  data:
    ref: 3:192
    scripture: quran
    name: Quran 3:192
    chapter: 3
    verse: 192
    ordinal: 485
    text: 'Our Lord! Whom Thou causest to enter the Fire: him indeed Thou hast confounded. For evil-doers there will be no helpers.'
    translation: Pickthall
    original: رَبَّنَآ إِنَّكَ مَن تُدْخِلِ ٱلنَّارَ فَقَدْ أَخْزَيْتَهُۥ ۖ وَمَا لِلظَّـٰلِمِينَ مِنْ أَنصَارٍ
    arabicPlain: ربنا إنك من تدخل النار فقد أخزيته ۖ وما للظالمين من أنصار
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 61
    page: 75
  relations:
  - predicate: IN
    to:
      type: Surah
