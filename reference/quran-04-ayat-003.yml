  data:
    ref: '3:38'
    scripture: quran
    name: Quran 3:38
    chapter: 3
    verse: 38
    ordinal: 331
    text: 'Then Zachariah prayed unto his Lord and said: My Lord! Bestow upon me of Thy bounty goodly offspring. Lo! Thou art the Hearer of Prayer.'
    translation: Pickthall
    original: هُنَالِكَ دَعَا زَكَرِيَّا رَبَّهُۥ ۖ قَالَ رَبِّ هَبْ لِى مِن لَّدُنكَ ذُرِّيَّةً طَيِّبَةً ۖ إِنَّكَ سَمِيعُ ٱلدُّعَآءِ
    arabicPlain: هنالك دعا زكريا ربه ۖ قال رب هب لي من لدنك ذرية طيبة ۖ إنك سميع الدعاء
    surahName: Aal-i-Imraan
    juz: 3
    manzil: 1
    ruku: 45
    page: 55
  relations:
