    scripture: quran
    name: Quran 3:74
    chapter: 3
    verse: 74
    ordinal: 367
    text: He selecteth for His mercy whom He will. Allah is of Infinite Bounty.
    translation: Pickthall
    original: يَخْتَصُّ بِرَحْمَتِهِۦ مَن يَشَآءُ ۗ وَٱللَّهُ ذُو ٱلْفَضْلِ ٱلْعَظِيمِ
    arabicPlain: يختص برحمته من يشاء ۗ والله ذو الفضل العظيم
