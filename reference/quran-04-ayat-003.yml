  data:
    ref: '3:22'
    scripture: quran
    name: Quran 3:22
    chapter: 3
    verse: 22
    ordinal: 315
    text: Those are they whose works have failed in the world and the Hereafter; and they have no helpers.
    translation: Pickthall
    original: أُو۟لَـٰٓئِكَ ٱلَّذِينَ حَبِطَتْ أَعْمَـٰلُهُمْ فِى ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ وَمَا لَهُم مِّن نَّـٰصِرِينَ
    arabicPlain: أولئك الذين حبطت أعمالهم في الدنيا والآخرة وما لهم من ناصرين
    surahName: Aal-i-Imraan
    juz: 3
