  data:
    ref: 3:107
    scripture: quran
    name: Quran 3:107
    chapter: 3
    verse: 107
    ordinal: 400
    text: And as for those whose faces have been whitened, in the mercy of Allah they dwell for ever.
    translation: Pickthall
    original: وَأَمَّا ٱلَّذِينَ ٱبْيَضَّتْ وُجُوهُهُمْ فَفِى رَحْمَةِ ٱللَّهِ هُمْ فِيهَا خَـٰلِدُونَ
    arabicPlain: وأما الذين ابيضت وجوههم ففي رحمة الله هم فيها خالدون
