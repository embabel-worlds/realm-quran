  data:
    ref: 3:194
    scripture: quran
    name: Quran 3:194
    chapter: 3
    verse: 194
    ordinal: 487
    text: Our Lord! And give us that which Thou hast promised to us by Thy messengers. Confound us not upon the Day of Resurrection. Lo! Thou breakest not the tryst.
    translation: Pickthall
    original: رَبَّنَا وَءَاتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ ٱلْقِيَـٰمَةِ ۗ إِنَّكَ لَا تُخْلِفُ ٱلْمِيعَادَ
    arabicPlain: ربنا وآتنا ما وعدتنا على رسلك ولا تخزنا يوم القيامة ۗ إنك لا تخلف الميعاد
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 61
    page: 75
  relations:
  - predicate: IN
    to:
      type: Surah
