  data:
    ref: '3:29'
    scripture: quran
    name: Quran 3:29
    chapter: 3
    verse: 29
    ordinal: 322
    text: 'Say, (O Muhammad): Whether ye hide that which is in your breasts or reveal it, Allah knoweth it. He knoweth that which is in the heavens and that which is in the earth, and Allah is Able to do all things.'
    translation: Pickthall
    original: قُلْ إِن تُخْفُوا۟ مَا فِى صُدُورِكُمْ أَوْ تُبْدُوهُ يَعْلَمْهُ ٱللَّهُ ۗ وَيَعْلَمُ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ
    arabicPlain: قل إن تخفوا ما في صدوركم أو تبدوه يعلمه الله ۗ ويعلم ما في السماوات وما في الأرض ۗ والله على كل شيء قدير
    surahName: Aal-i-Imraan
    juz: 3
    manzil: 1
    ruku: 44
    page: 53
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '3'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-3
- type: Ayah
  data:
    ref: '3:30'
    scripture: quran
    name: Quran 3:30
    chapter: 3
    verse: 30
    ordinal: 323
    text: On the Day when every soul will find itself confronted with all that it hath done of good and all that it hath done of evil (every soul) will long that there might be a mighty space of distance between it and that (evil). Allah biddeth you beware of Him. And Allah is Full of Pity for (His) bondmen.
    translation: Pickthall
    original: يَوْمَ تَجِدُ كُلُّ نَفْسٍ مَّا عَمِلَتْ مِنْ خَيْرٍ مُّحْضَرًا وَمَا عَمِلَتْ مِن سُوٓءٍ تَوَدُّ لَوْ أَنَّ بَيْنَهَا وَبَيْنَهُۥٓ أَمَدًۢا بَعِيدًا ۗ وَيُحَذِّرُكُمُ ٱللَّهُ نَفْسَهُۥ ۗ وَٱللَّهُ رَءُوفٌۢ بِٱلْعِبَادِ
    arabicPlain: يوم تجد كل نفس ما عملت من خير محضرا وما عملت من سوء تود لو أن بينها وبينه أمدا بعيدا ۗ ويحذركم الله نفسه ۗ والله رءوف بالعباد
    surahName: Aal-i-Imraan
    juz: 3
    manzil: 1
    ruku: 44
    page: 54
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '3'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-3
- type: Ayah
  data:
    ref: '3:31'
    scripture: quran
    name: Quran 3:31
    chapter: 3
    verse: 31
    ordinal: 324
    text: 'Say, (O Muhammad, to mankind): If ye love Allah, follow me; Allah will love you and forgive you your sins. Allah is Forgiving, Merciful.'
    translation: Pickthall
    original: قُلْ إِن كُنتُمْ تُحِبُّونَ ٱللَّهَ فَٱتَّبِعُونِى يُحْبِبْكُمُ ٱللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ ۗ وَٱللَّهُ غَفُورٌ رَّحِيمٌ
    arabicPlain: قل إن كنتم تحبون الله فاتبعوني يحببكم الله ويغفر لكم ذنوبكم ۗ والله غفور رحيم
    surahName: Aal-i-Imraan
