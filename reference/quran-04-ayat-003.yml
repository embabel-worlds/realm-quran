  data:
    ref: 3:109
    scripture: quran
    name: Quran 3:109
    chapter: 3
    verse: 109
    ordinal: 402
    text: Unto Allah belongeth whatsoever is in the heavens and whatsoever is in the earth; and unto Allah all things are returned.
    translation: Pickthall
    original: وَلِلَّهِ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۚ وَإِلَى ٱللَّهِ تُرْجَعُ ٱلْأُمُورُ
    arabicPlain: ولله ما في السماوات وما في الأرض ۚ وإلى الله ترجع الأمور
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
