  data:
    ref: 3:70
    scripture: quran
    name: Quran 3:70
    chapter: 3
    verse: 70
    ordinal: 363
    text: O People of the Scripture! Why disbelieve ye in the revelations of Allah, when ye (yourselves) bear witness (to their truth)?
    translation: Pickthall
    original: يَـٰٓأَهْلَ ٱلْكِتَـٰبِ لِمَ تَكْفُرُونَ بِـَٔايَـٰتِ ٱللَّهِ وَأَنتُمْ تَشْهَدُونَ
    arabicPlain: يا أهل الكتاب لم تكفرون بآيات الله وأنتم تشهدون
