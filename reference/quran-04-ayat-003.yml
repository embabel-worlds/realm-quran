    scripture: quran
    name: Quran 3:182
    chapter: 3
    verse: 182
    ordinal: 475
    text: This is on account of that which your own hands have sent before (you to the judgment). Allah is no oppressor of (His) bondmen.
    translation: Pickthall
    original: ذَٰلِكَ بِمَا قَدَّمَتْ أَيْدِيكُمْ وَأَنَّ ٱللَّهَ لَيْسَ بِظَلَّامٍ لِّلْعَبِيدِ
    arabicPlain: ذلك بما قدمت أيديكم وأن الله ليس بظلام للعبيد
    surahName: Aal-i-Imraan
    juz: 4
