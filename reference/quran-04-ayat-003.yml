  data:
    ref: 3:163
    scripture: quran
    name: Quran 3:163
    chapter: 3
    verse: 163
    ordinal: 456
    text: There are degrees (of grace and reprobation) with Allah, and Allah is Seer of what they do.
    translation: Pickthall
    original: هُمْ دَرَجَـٰتٌ عِندَ ٱللَّهِ ۗ وَٱللَّهُ بَصِيرٌۢ بِمَا يَعْمَلُونَ
    arabicPlain: هم درجات عند الله ۗ والله بصير بما يعملون
