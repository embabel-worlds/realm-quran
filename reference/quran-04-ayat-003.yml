  data:
    ref: 3:71
    scripture: quran
    name: Quran 3:71
    chapter: 3
    verse: 71
    ordinal: 364
    text: O People of the Scripture! Why confound ye truth with falsehood and knowingly conceal the truth?
    translation: Pickthall
    original: يَـٰٓأَهْلَ ٱلْكِتَـٰبِ لِمَ تَلْبِسُونَ ٱلْحَقَّ بِٱلْبَـٰطِلِ وَتَكْتُمُونَ ٱلْحَقَّ وَأَنتُمْ تَعْلَمُونَ
    arabicPlain: يا أهل الكتاب لم تلبسون الحق بالباطل وتكتمون الحق وأنتم تعلمون
