  data:
    ref: '3:25'
    scripture: quran
    name: Quran 3:25
    chapter: 3
    verse: 25
    ordinal: 318
    text: How (will it be with them) when We have brought them all together to a Day of which there is no doubt, when every soul will be paid in full what it hath earned, and they will not be wronged.
    translation: Pickthall
    original: فَكَيْفَ إِذَا جَمَعْنَـٰهُمْ لِيَوْمٍ لَّا رَيْبَ فِيهِ وَوُفِّيَتْ كُلُّ نَفْسٍ مَّا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ
    arabicPlain: فكيف إذا جمعناهم ليوم لا ريب فيه ووفيت كل نفس ما كسبت وهم لا يظلمون
    surahName: Aal-i-Imraan
    juz: 3
    manzil: 1
    ruku: 44
    page: 53
