  data:
    ref: 3:161
    scripture: quran
    name: Quran 3:161
    chapter: 3
    verse: 161
    ordinal: 454
    text: It is not for any prophet to embezzle. Whoso embezzleth will bring what he embezzled with him on the Day of Resurrection. Then every soul will be paid in full what it hath earned; and they will not be wronged.
    translation: Pickthall
    original: وَمَا كَانَ لِنَبِىٍّ أَن يَغُلَّ ۚ وَمَن يَغْلُلْ يَأْتِ بِمَا غَلَّ يَوْمَ ٱلْقِيَـٰمَةِ ۚ ثُمَّ تُوَفَّىٰ كُلُّ نَفْسٍ مَّا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ
    arabicPlain: وما كان لنبي أن يغل ۚ ومن يغلل يأت بما غل يوم القيامة ۚ ثم توفى كل نفس ما كسبت وهم لا يظلمون
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 58
    page: 71
