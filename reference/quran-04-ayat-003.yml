  data:
    ref: '3:15'
    scripture: quran
    name: Quran 3:15
    chapter: 3
    verse: 15
    ordinal: 308
    text: 'Say: Shall I inform you of something better than that? For those who keep from evil, with their Lord, are Gardens underneath which rivers flow wherein they will abide, and pure companions, and contentment from Allah. Allah is Seer of His bondmen,'
    translation: Pickthall
    original: ۞ قُلْ أَؤُنَبِّئُكُم بِخَيْرٍ مِّن ذَٰلِكُمْ ۚ لِلَّذِينَ ٱتَّقَوْا۟ عِندَ رَبِّهِمْ جَنَّـٰتٌ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ خَـٰلِدِينَ فِيهَا وَأَزْوَٰجٌ مُّطَهَّرَةٌ وَرِضْوَٰنٌ مِّنَ ٱللَّهِ ۗ وَٱللَّهُ بَصِيرٌۢ بِٱلْعِبَادِ
    arabicPlain: ۞ قل أؤنبئكم بخير من ذلكم ۚ للذين اتقوا عند ربهم جنات تجري من تحتها الأنهار خالدين فيها وأزواج مطهرة ورضوان من الله ۗ والله بصير بالعباد
    surahName: Aal-i-Imraan
    juz: 3
    manzil: 1
    ruku: 43
    page: 51
  relations:
