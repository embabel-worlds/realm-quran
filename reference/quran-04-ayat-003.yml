  data:
    ref: '3:40'
    scripture: quran
    name: Quran 3:40
    chapter: 3
    verse: 40
    ordinal: 333
    text: 'He said: My Lord! How can I have a son when age hath overtaken me already and my wife is barren? (The angel) answered: So (it will be). Allah doeth what He will.'
    translation: Pickthall
    original: قَالَ رَبِّ أَنَّىٰ يَكُونُ لِى غُلَـٰمٌ وَقَدْ بَلَغَنِىَ ٱلْكِبَرُ وَٱمْرَأَتِى عَاقِرٌ ۖ قَالَ كَذَٰلِكَ ٱللَّهُ يَفْعَلُ مَا يَشَآءُ
    arabicPlain: قال رب أنى يكون لي غلام وقد بلغني الكبر وامرأتي عاقر ۖ قال كذلك الله يفعل ما يشاء
    surahName: Aal-i-Imraan
    juz: 3
    manzil: 1
    ruku: 45
    page: 55
