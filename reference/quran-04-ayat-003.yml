  data:
    ref: 3:148
    scripture: quran
    name: Quran 3:148
    chapter: 3
    verse: 148
    ordinal: 441
    text: So Allah gave them the reward of the world and the good reward of the Hereafter. Allah loveth those whose deeds are good.
    translation: Pickthall
    original: فَـَٔاتَىٰهُمُ ٱللَّهُ ثَوَابَ ٱلدُّنْيَا وَحُسْنَ ثَوَابِ ٱلْـَٔاخِرَةِ ۗ وَٱللَّهُ يُحِبُّ ٱلْمُحْسِنِينَ
    arabicPlain: فآتاهم الله ثواب الدنيا وحسن ثواب الآخرة ۗ والله يحب المحسنين
    surahName: Aal-i-Imraan
