  data:
    ref: 3:128
    scripture: quran
    name: Quran 3:128
    chapter: 3
    verse: 128
    ordinal: 421
    text: It is no concern at all of thee (Muhammad) whether He relent toward them or punish them; for they are evil-doers.
    translation: Pickthall
    original: لَيْسَ لَكَ مِنَ ٱلْأَمْرِ شَىْءٌ أَوْ يَتُوبَ عَلَيْهِمْ أَوْ يُعَذِّبَهُمْ فَإِنَّهُمْ ظَـٰلِمُونَ
    arabicPlain: ليس لك من الأمر شيء أو يتوب عليهم أو يعذبهم فإنهم ظالمون
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 54
