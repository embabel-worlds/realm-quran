  data:
    ref: 3:127
    scripture: quran
    name: Quran 3:127
    chapter: 3
    verse: 127
    ordinal: 420
    text: That He may cut off a part of those who disbelieve, or overwhelm them so that they retire, frustrated.
    translation: Pickthall
    original: لِيَقْطَعَ طَرَفًا مِّنَ ٱلَّذِينَ كَفَرُوٓا۟ أَوْ يَكْبِتَهُمْ فَيَنقَلِبُوا۟ خَآئِبِينَ
    arabicPlain: ليقطع طرفا من الذين كفروا أو يكبتهم فينقلبوا خائبين
