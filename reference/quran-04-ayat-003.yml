    scripture: quran
    name: Quran 3:139
    chapter: 3
    verse: 139
    ordinal: 432
    text: Faint not nor grieve, for ye will overcome them if ye are (indeed) believers.
    translation: Pickthall
    original: وَلَا تَهِنُوا۟ وَلَا تَحْزَنُوا۟ وَأَنتُمُ ٱلْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ
