  data:
    ref: '3:16'
    scripture: quran
    name: Quran 3:16
    chapter: 3
    verse: 16
    ordinal: 309
    text: 'Those who say: Our Lord! Lo! we believe. So forgive us our sins and guard us from the punishment of Fire;'
    translation: Pickthall
    original: ٱلَّذِينَ يَقُولُونَ رَبَّنَآ إِنَّنَآ ءَامَنَّا فَٱغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ ٱلنَّارِ
    arabicPlain: الذين يقولون ربنا إننا آمنا فاغفر لنا ذنوبنا وقنا عذاب النار
    surahName: Aal-i-Imraan
    juz: 3
