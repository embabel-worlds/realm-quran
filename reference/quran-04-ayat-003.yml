  data:
    ref: 3:174
    scripture: quran
    name: Quran 3:174
    chapter: 3
    verse: 174
    ordinal: 467
    text: So they returned with grace and favour from Allah, and no harm touched them. They followed the good pleasure of Allah, and Allah is of Infinite Bounty.
    translation: Pickthall
    original: فَٱنقَلَبُوا۟ بِنِعْمَةٍ مِّنَ ٱللَّهِ وَفَضْلٍ لَّمْ يَمْسَسْهُمْ سُوٓءٌ وَٱتَّبَعُوا۟ رِضْوَٰنَ ٱللَّهِ ۗ وَٱللَّهُ ذُو فَضْلٍ عَظِيمٍ
    arabicPlain: فانقلبوا بنعمة من الله وفضل لم يمسسهم سوء واتبعوا رضوان الله ۗ والله ذو فضل عظيم
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 59
    page: 73
