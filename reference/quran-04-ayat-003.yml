  data:
    ref: 3:129
    scripture: quran
    name: Quran 3:129
    chapter: 3
    verse: 129
    ordinal: 422
    text: Unto Allah belongeth whatsoever is in the heavens and whatsoever is in the earth. He forgiveth whom He will, and punisheth whom He will. Allah is Forgiving, Merciful.
    translation: Pickthall
    original: وَلِلَّهِ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۚ يَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ ۚ وَٱللَّهُ غَفُورٌ رَّحِيمٌ
    arabicPlain: ولله ما في السماوات وما في الأرض ۚ يغفر لمن يشاء ويعذب من يشاء ۚ والله غفور رحيم
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 54
    page: 66
  relations:
