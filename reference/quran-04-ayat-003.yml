  data:
    ref: '3:13'
    scripture: quran
    name: Quran 3:13
    chapter: 3
    verse: 13
    ordinal: 306
    text: 'There was a token for you in two hosts which met: one army fighting in the way of Allah, and another disbelieving, whom they saw as twice their number, clearly, with their very eyes. Thus Allah strengtheneth with His succour whom He will. Lo! herein verily is a lesson for those who have eyes.'
    translation: Pickthall
    original: قَدْ كَانَ لَكُمْ ءَايَةٌ فِى فِئَتَيْنِ ٱلْتَقَتَا ۖ فِئَةٌ تُقَـٰتِلُ فِى سَبِيلِ ٱللَّهِ وَأُخْرَىٰ كَافِرَةٌ يَرَوْنَهُم مِّثْلَيْهِمْ رَأْىَ ٱلْعَيْنِ ۚ وَٱللَّهُ يُؤَيِّدُ بِنَصْرِهِۦ مَن يَشَآءُ ۗ إِنَّ فِى ذَٰلِكَ لَعِبْرَةً لِّأُو۟لِى ٱلْأَبْصَـٰرِ
    arabicPlain: قد كان لكم آية في فئتين التقتا ۖ فئة تقاتل في سبيل الله وأخرى كافرة يرونهم مثليهم رأي العين ۚ والله يؤيد بنصره من يشاء ۗ إن في ذلك لعبرة لأولي الأبصار
    surahName: Aal-i-Imraan
    juz: 3
