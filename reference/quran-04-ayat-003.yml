  data:
    ref: 3:190
    scripture: quran
    name: Quran 3:190
    chapter: 3
    verse: 190
    ordinal: 483
    text: Lo! In the creation of the heavens and the earth and (in) the difference of night and day are tokens (of His Sovereignty) for men of understanding,
    translation: Pickthall
    original: إِنَّ فِى خَلْقِ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَٱخْتِلَـٰفِ ٱلَّيْلِ وَٱلنَّهَارِ لَـَٔايَـٰتٍ لِّأُو۟لِى ٱلْأَلْبَـٰبِ
    arabicPlain: إن في خلق السماوات والأرض واختلاف الليل والنهار لآيات لأولي الألباب
