  data:
    ref: 3:126
    scripture: quran
    name: Quran 3:126
    chapter: 3
    verse: 126
    ordinal: 419
    text: Allah ordained this only as a message of good cheer for you, and that thereby your hearts might be at rest - Victory cometh only from Allah, the Mighty, the Wise -
    translation: Pickthall
    original: وَمَا جَعَلَهُ ٱللَّهُ إِلَّا بُشْرَىٰ لَكُمْ وَلِتَطْمَئِنَّ قُلُوبُكُم بِهِۦ ۗ وَمَا ٱلنَّصْرُ إِلَّا مِنْ عِندِ ٱللَّهِ ٱلْعَزِيزِ ٱلْحَكِيمِ
    arabicPlain: وما جعله الله إلا بشرى لكم ولتطمئن قلوبكم به ۗ وما النصر إلا من عند الله العزيز الحكيم
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 54
    page: 66
