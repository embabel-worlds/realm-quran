  data:
    ref: 3:104
    scripture: quran
    name: Quran 3:104
    chapter: 3
    verse: 104
    ordinal: 397
    text: And there may spring from you a nation who invite to goodness, and enjoin right conduct and forbid indecency. Such are they who are successful.
    translation: Pickthall
    original: وَلْتَكُن مِّنكُمْ أُمَّةٌ يَدْعُونَ إِلَى ٱلْخَيْرِ وَيَأْمُرُونَ بِٱلْمَعْرُوفِ وَيَنْهَوْنَ عَنِ ٱلْمُنكَرِ ۚ وَأُو۟لَـٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ
    arabicPlain: ولتكن منكم أمة يدعون إلى الخير ويأمرون بالمعروف وينهون عن المنكر ۚ وأولئك هم المفلحون
    surahName: Aal-i-Imraan
    juz: 4
