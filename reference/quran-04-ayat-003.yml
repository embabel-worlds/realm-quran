  data:
    ref: 3:178
    scripture: quran
    name: Quran 3:178
    chapter: 3
    verse: 178
    ordinal: 471
    text: And let not those who disbelieve imagine that the rein We give them bodeth good unto their souls. We only give them rein that they may grow in sinfulness. And theirs will be a shameful doom.
    translation: Pickthall
    original: وَلَا يَحْسَبَنَّ ٱلَّذِينَ كَفَرُوٓا۟ أَنَّمَا نُمْلِى لَهُمْ خَيْرٌ لِّأَنفُسِهِمْ ۚ إِنَّمَا نُمْلِى لَهُمْ لِيَزْدَادُوٓا۟ إِثْمًا ۚ وَلَهُمْ عَذَابٌ مُّهِينٌ
    arabicPlain: ولا يحسبن الذين كفروا أنما نملي لهم خير لأنفسهم ۚ إنما نملي لهم ليزدادوا إثما ۚ ولهم عذاب مهين
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 59
    page: 73
  relations:
  - predicate: IN
    to:
      type: Surah
