  data:
    ref: 3:160
    scripture: quran
    name: Quran 3:160
    chapter: 3
    verse: 160
    ordinal: 453
    text: If Allah is your helper none can overcome you, and if He withdraw His help from you, who is there who can help you after Him? In Allah let believers put their trust.
    translation: Pickthall
    original: إِن يَنصُرْكُمُ ٱللَّهُ فَلَا غَالِبَ لَكُمْ ۖ وَإِن يَخْذُلْكُمْ فَمَن ذَا ٱلَّذِى يَنصُرُكُم مِّنۢ بَعْدِهِۦ ۗ وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ
    arabicPlain: إن ينصركم الله فلا غالب لكم ۖ وإن يخذلكم فمن ذا الذي ينصركم من بعده ۗ وعلى الله فليتوكل المؤمنون
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 58
    page: 71
