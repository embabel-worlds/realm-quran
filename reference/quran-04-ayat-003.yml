  data:
    ref: 3:177
    scripture: quran
    name: Quran 3:177
    chapter: 3
    verse: 177
    ordinal: 470
    text: Those who purchase disbelief at the price of faith harm Allah not at all, but theirs will be a painful doom.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ ٱشْتَرَوُا۟ ٱلْكُفْرَ بِٱلْإِيمَـٰنِ لَن يَضُرُّوا۟ ٱللَّهَ شَيْـًٔا وَلَهُمْ عَذَابٌ أَلِيمٌ
    arabicPlain: إن الذين اشتروا الكفر بالإيمان لن يضروا الله شيئا ولهم عذاب أليم
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 59
    page: 73
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '3'
  - predicate: IN_PORTION
    to:
      type: Juz
