    scripture: quran
    name: Quran 3:150
    chapter: 3
    verse: 150
    ordinal: 443
    text: But Allah is your Protector, and He is the Best of Helpers.
    translation: Pickthall
    original: بَلِ ٱللَّهُ مَوْلَىٰكُمْ ۖ وَهُوَ خَيْرُ ٱلنَّـٰصِرِينَ
