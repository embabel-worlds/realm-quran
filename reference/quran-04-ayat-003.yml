  data:
    ref: '3:24'
    scripture: quran
    name: Quran 3:24
    chapter: 3
    verse: 24
    ordinal: 317
    text: 'That is because they say: The Fire will not touch us save for a certain number of days. That which they used to invent hath deceived them regarding their religion.'
    translation: Pickthall
    original: ذَٰلِكَ بِأَنَّهُمْ قَالُوا۟ لَن تَمَسَّنَا ٱلنَّارُ إِلَّآ أَيَّامًا مَّعْدُودَٰتٍ ۖ وَغَرَّهُمْ فِى دِينِهِم مَّا كَانُوا۟ يَفْتَرُونَ
    arabicPlain: ذلك بأنهم قالوا لن تمسنا النار إلا أياما معدودات ۖ وغرهم في دينهم ما كانوا يفترون
    surahName: Aal-i-Imraan
    juz: 3
    manzil: 1
    ruku: 44
    page: 53
