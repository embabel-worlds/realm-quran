  data:
    ref: 3:184
    scripture: quran
    name: Quran 3:184
    chapter: 3
    verse: 184
    ordinal: 477
    text: And if they deny thee, even so did they deny messengers who were before thee, who came with miracles and with the Psalms and with the Scripture giving light.
    translation: Pickthall
    original: فَإِن كَذَّبُوكَ فَقَدْ كُذِّبَ رُسُلٌ مِّن قَبْلِكَ جَآءُو بِٱلْبَيِّنَـٰتِ وَٱلزُّبُرِ وَٱلْكِتَـٰبِ ٱلْمُنِيرِ
    arabicPlain: فإن كذبوك فقد كذب رسل من قبلك جاءوا بالبينات والزبر والكتاب المنير
    surahName: Aal-i-Imraan
