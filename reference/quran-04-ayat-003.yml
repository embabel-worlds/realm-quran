  data:
    ref: 3:111
    scripture: quran
    name: Quran 3:111
    chapter: 3
    verse: 111
    ordinal: 404
    text: They will not harm you save a trifling hurt, and if they fight against you they will turn and flee. And afterward they will not be helped.
    translation: Pickthall
    original: لَن يَضُرُّوكُمْ إِلَّآ أَذًى ۖ وَإِن يُقَـٰتِلُوكُمْ يُوَلُّوكُمُ ٱلْأَدْبَارَ ثُمَّ لَا يُنصَرُونَ
    arabicPlain: لن يضروكم إلا أذى ۖ وإن يقاتلوكم يولوكم الأدبار ثم لا ينصرون
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 53
    page: 64
