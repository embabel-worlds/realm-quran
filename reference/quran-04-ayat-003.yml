    scripture: quran
    name: Quran 3:132
    chapter: 3
    verse: 132
    ordinal: 425
    text: And obey Allah and the messenger, that ye may find mercy.
    translation: Pickthall
    original: وَأَطِيعُوا۟ ٱللَّهَ وَٱلرَّسُولَ لَعَلَّكُمْ تُرْحَمُونَ
