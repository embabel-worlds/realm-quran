    chapter: 3
    verse: 137
    ordinal: 430
    text: Systems have passed away before you. Do but travel in the land and see the nature of the consequence for those who did deny (the messengers).
    translation: Pickthall
    original: قَدْ خَلَتْ مِن قَبْلِكُمْ سُنَنٌ فَسِيرُوا۟ فِى ٱلْأَرْضِ فَٱنظُرُوا۟ كَيْفَ كَانَ عَـٰقِبَةُ ٱلْمُكَذِّبِينَ
