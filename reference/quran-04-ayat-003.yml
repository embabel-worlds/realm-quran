    scripture: quran
    name: Quran 3:46
    chapter: 3
    verse: 46
    ordinal: 339
    text: He will speak unto mankind in his cradle and in his manhood, and he is of the righteous.
    translation: Pickthall
    original: وَيُكَلِّمُ ٱلنَّاسَ فِى ٱلْمَهْدِ وَكَهْلًا وَمِنَ ٱلصَّـٰلِحِينَ
    arabicPlain: ويكلم الناس في المهد وكهلا ومن الصالحين
