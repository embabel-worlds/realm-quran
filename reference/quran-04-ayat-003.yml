    name: Quran 3:102
    chapter: 3
    verse: 102
    ordinal: 395
    text: O ye who believe! Observe your duty to Allah with right observance, and die not save as those who have surrendered (unto Him)
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ حَقَّ تُقَاتِهِۦ وَلَا تَمُوتُنَّ إِلَّا وَأَنتُم مُّسْلِمُونَ
    arabicPlain: يا أيها الذين آمنوا اتقوا الله حق تقاته ولا تموتن إلا وأنتم مسلمون
