  data:
    ref: 3:175
    scripture: quran
    name: Quran 3:175
    chapter: 3
    verse: 175
    ordinal: 468
    text: It is only the devil who would make (men) fear his partisans. Fear them not; fear Me, if ye are true believers.
    translation: Pickthall
    original: إِنَّمَا ذَٰلِكُمُ ٱلشَّيْطَـٰنُ يُخَوِّفُ أَوْلِيَآءَهُۥ فَلَا تَخَافُوهُمْ وَخَافُونِ إِن كُنتُم مُّؤْمِنِينَ
    arabicPlain: إنما ذلكم الشيطان يخوف أولياءه فلا تخافوهم وخافون إن كنتم مؤمنين
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 59
    page: 73
