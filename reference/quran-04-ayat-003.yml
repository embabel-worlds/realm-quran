  data:
    ref: 3:157
    scripture: quran
    name: Quran 3:157
    chapter: 3
    verse: 157
    ordinal: 450
    text: And what though ye be slain in Allah's way or die therein? Surely pardon from Allah and mercy are better than all that they amass.
    translation: Pickthall
    original: وَلَئِن قُتِلْتُمْ فِى سَبِيلِ ٱللَّهِ أَوْ مُتُّمْ لَمَغْفِرَةٌ مِّنَ ٱللَّهِ وَرَحْمَةٌ خَيْرٌ مِّمَّا يَجْمَعُونَ
    arabicPlain: ولئن قتلتم في سبيل الله أو متم لمغفرة من الله ورحمة خير مما يجمعون
