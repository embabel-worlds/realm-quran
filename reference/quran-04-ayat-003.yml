    ref: 3:124
    scripture: quran
    name: Quran 3:124
    chapter: 3
    verse: 124
    ordinal: 417
    text: 'When thou didst say unto the believers: Is it not sufficient for you that your Lord should support you with three thousand angels sent down (to your help)?'
    translation: Pickthall
    original: إِذْ تَقُولُ لِلْمُؤْمِنِينَ أَلَن يَكْفِيَكُمْ أَن يُمِدَّكُمْ رَبُّكُم بِثَلَـٰثَةِ ءَالَـٰفٍ مِّنَ ٱلْمَلَـٰٓئِكَةِ مُنزَلِينَ
    arabicPlain: إذ تقول للمؤمنين ألن يكفيكم أن يمدكم ربكم بثلاثة آلاف من الملائكة منزلين
    surahName: Aal-i-Imraan
    juz: 4
