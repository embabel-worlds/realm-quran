  data:
    ref: '3:9'
    scripture: quran
    name: Quran 3:9
    chapter: 3
    verse: 9
    ordinal: 302
    text: Our Lord! Lo! it is Thou Who gatherest mankind together to a Day of which there is no doubt. Lo! Allah faileth not to keep the tryst.
    translation: Pickthall
    original: رَبَّنَآ إِنَّكَ جَامِعُ ٱلنَّاسِ لِيَوْمٍ لَّا رَيْبَ فِيهِ ۚ إِنَّ ٱللَّهَ لَا يُخْلِفُ ٱلْمِيعَادَ
    arabicPlain: ربنا إنك جامع الناس ليوم لا ريب فيه ۚ إن الله لا يخلف الميعاد
    surahName: Aal-i-Imraan
    juz: 3
