  data:
    ref: 3:76
    scripture: quran
    name: Quran 3:76
    chapter: 3
    verse: 76
    ordinal: 369
    text: Nay, but (the chosen of Allah is) he who fulfilleth his pledge and wardeth off (evil); for lo! Allah loveth those who ward off (evil).
    translation: Pickthall
    original: بَلَىٰ مَنْ أَوْفَىٰ بِعَهْدِهِۦ وَٱتَّقَىٰ فَإِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَّقِينَ
    arabicPlain: بلى من أوفى بعهده واتقى فإن الله يحب المتقين
    surahName: Aal-i-Imraan
    juz: 3
    manzil: 1
    ruku: 49
    page: 59
