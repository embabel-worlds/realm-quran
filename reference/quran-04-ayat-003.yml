  data:
    ref: 3:69
    scripture: quran
    name: Quran 3:69
    chapter: 3
    verse: 69
    ordinal: 362
    text: A party of the People of the Scripture long to make you go astray; and they make none to go astray except themselves, but they perceive not.
    translation: Pickthall
    original: وَدَّت طَّآئِفَةٌ مِّنْ أَهْلِ ٱلْكِتَـٰبِ لَوْ يُضِلُّونَكُمْ وَمَا يُضِلُّونَ إِلَّآ أَنفُسَهُمْ وَمَا يَشْعُرُونَ
    arabicPlain: ودت طائفة من أهل الكتاب لو يضلونكم وما يضلون إلا أنفسهم وما يشعرون
    surahName: Aal-i-Imraan
    juz: 3
