    scripture: quran
    name: Quran 3:189
    chapter: 3
    verse: 189
    ordinal: 482
    text: Unto Allah belongeth the Sovereignty of the heavens and the earth. Allah is Able to do all things.
    translation: Pickthall
    original: وَلِلَّهِ مُلْكُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۗ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ
    arabicPlain: ولله ملك السماوات والأرض ۗ والله على كل شيء قدير
    surahName: Aal-i-Imraan
    juz: 4
