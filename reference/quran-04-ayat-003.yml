    scripture: quran
    name: Quran 3:4
    chapter: 3
    verse: 4
    ordinal: 297
    text: Aforetime, for a guidance to mankind; and hath revealed the Criterion (of right and wrong). Lo! those who disbelieve the revelations of Allah, theirs will be a heavy doom. Allah is Mighty, Able to Requite (the wrong).
    translation: Pickthall
    original: مِن قَبْلُ هُدًى لِّلنَّاسِ وَأَنزَلَ ٱلْفُرْقَانَ ۗ إِنَّ ٱلَّذِينَ كَفَرُوا۟ بِـَٔايَـٰتِ ٱللَّهِ لَهُمْ عَذَابٌ شَدِيدٌ ۗ وَٱللَّهُ عَزِيزٌ ذُو ٱنتِقَامٍ
    arabicPlain: من قبل هدى للناس وأنزل الفرقان ۗ إن الذين كفروا بآيات الله لهم عذاب شديد ۗ والله عزيز ذو انتقام
