  data:
    ref: 3:166
    scripture: quran
    name: Quran 3:166
    chapter: 3
    verse: 166
    ordinal: 459
    text: That which befell you, on the day when the two armies met, was by permission of Allah; that He might know the true believers;
    translation: Pickthall
    original: وَمَآ أَصَـٰبَكُمْ يَوْمَ ٱلْتَقَى ٱلْجَمْعَانِ فَبِإِذْنِ ٱللَّهِ وَلِيَعْلَمَ ٱلْمُؤْمِنِينَ
    arabicPlain: وما أصابكم يوم التقى الجمعان فبإذن الله وليعلم المؤمنين
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 58
    page: 72
