  data:
    ref: 3:173
    scripture: quran
    name: Quran 3:173
    chapter: 3
    verse: 173
    ordinal: 466
    text: 'Those unto whom men said: Lo! the people have gathered against you, therefor fear them. (The threat of danger) but increased the faith of them and they cried: Allah is Sufficient for us! Most Excellent is He in Whom we trust!'
    translation: Pickthall
    original: ٱلَّذِينَ قَالَ لَهُمُ ٱلنَّاسُ إِنَّ ٱلنَّاسَ قَدْ جَمَعُوا۟ لَكُمْ فَٱخْشَوْهُمْ فَزَادَهُمْ إِيمَـٰنًا وَقَالُوا۟ حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ
    arabicPlain: الذين قال لهم الناس إن الناس قد جمعوا لكم فاخشوهم فزادهم إيمانا وقالوا حسبنا الله ونعم الوكيل
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 59
    page: 72
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '3'
  - predicate: IN_PORTION
    to:
