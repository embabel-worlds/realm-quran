  data:
    ref: 3:170
    scripture: quran
    name: Quran 3:170
    chapter: 3
    verse: 170
    ordinal: 463
    text: 'Jubilant (are they) because of that which Allah hath bestowed upon them of His bounty, rejoicing for the sake of those who have not joined them but are left behind: That there shall no fear come upon them neither shall they grieve.'
    translation: Pickthall
    original: فَرِحِينَ بِمَآ ءَاتَىٰهُمُ ٱللَّهُ مِن فَضْلِهِۦ وَيَسْتَبْشِرُونَ بِٱلَّذِينَ لَمْ يَلْحَقُوا۟ بِهِم مِّنْ خَلْفِهِمْ أَلَّا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
    arabicPlain: فرحين بما آتاهم الله من فضله ويستبشرون بالذين لم يلحقوا بهم من خلفهم ألا خوف عليهم ولا هم يحزنون
    surahName: Aal-i-Imraan
    juz: 4
    manzil: 1
    ruku: 58
    page: 72
  relations:
  - predicate: IN
    to:
      type: Surah
