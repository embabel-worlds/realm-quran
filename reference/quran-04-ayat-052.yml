    translation: Pickthall
    original: وَٱصْبِرْ لِحُكْمِ رَبِّكَ فَإِنَّكَ بِأَعْيُنِنَا ۖ وَسَبِّحْ بِحَمْدِ رَبِّكَ حِينَ تَقُومُ
    arabicPlain: واصبر لحكم ربك فإنك بأعيننا ۖ وسبح بحمد ربك حين تقوم
