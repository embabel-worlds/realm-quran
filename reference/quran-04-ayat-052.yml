    name: Quran 52:36
    chapter: 52
    verse: 36
    ordinal: 4771
    text: Or did they create the heavens and the earth? Nay, but they are sure of nothing!
    translation: Pickthall
    original: أَمْ خَلَقُوا۟ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ ۚ بَل لَّا يُوقِنُونَ
