    translation: Pickthall
    original: يَوْمَ لَا يُغْنِى عَنْهُمْ كَيْدُهُمْ شَيْـًٔا وَلَا هُمْ يُنصَرُونَ
    arabicPlain: يوم لا يغني عنهم كيدهم شيئا ولا هم ينصرون
