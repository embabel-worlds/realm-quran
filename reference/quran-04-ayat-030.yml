  data:
    ref: '30:54'
    scripture: quran
    name: Quran 30:54
    chapter: 30
    verse: 54
    ordinal: 3463
    text: Allah is He Who shaped you out of weakness, then appointed after weakness strength, then, after strength, appointed weakness and grey hair. He createth what He will. He is the Knower, the Mighty.
    translation: Pickthall
    original: ۞ ٱللَّهُ ٱلَّذِى خَلَقَكُم مِّن ضَعْفٍ ثُمَّ جَعَلَ مِنۢ بَعْدِ ضَعْفٍ قُوَّةً ثُمَّ جَعَلَ مِنۢ بَعْدِ قُوَّةٍ ضَعْفًا وَشَيْبَةً ۚ يَخْلُقُ مَا يَشَآءُ ۖ وَهُوَ ٱلْعَلِيمُ ٱلْقَدِيرُ
    arabicPlain: ۞ الله الذي خلقكم من ضعف ثم جعل من بعد ضعف قوة ثم جعل من بعد قوة ضعفا وشيبة ۚ يخلق ما يشاء ۖ وهو العليم القدير
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 354
    page: 410
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '30'
  - predicate: IN_PORTION
    to:
