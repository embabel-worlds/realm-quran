  data:
    ref: '30:29'
    scripture: quran
    name: Quran 30:29
    chapter: 30
    verse: 29
    ordinal: 3438
    text: Nay, but those who do wrong follow their own lusts without knowledge. Who is able to guide him whom Allah hath sent astray? For such there are no helpers.
    translation: Pickthall
    original: بَلِ ٱتَّبَعَ ٱلَّذِينَ ظَلَمُوٓا۟ أَهْوَآءَهُم بِغَيْرِ عِلْمٍ ۖ فَمَن يَهْدِى مَنْ أَضَلَّ ٱللَّهُ ۖ وَمَا لَهُم مِّن نَّـٰصِرِينَ
    arabicPlain: بل اتبع الذين ظلموا أهواءهم بغير علم ۖ فمن يهدي من أضل الله ۖ وما لهم من ناصرين
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 352
    page: 407
