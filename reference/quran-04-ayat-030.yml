  data:
    ref: '30:10'
    scripture: quran
    name: Quran 30:10
    chapter: 30
    verse: 10
    ordinal: 3419
    text: Then evil was the consequence to those who dealt in evil, because they denied the revelations of Allah and made a mock of them.
    translation: Pickthall
    original: ثُمَّ كَانَ عَـٰقِبَةَ ٱلَّذِينَ أَسَـٰٓـُٔوا۟ ٱلسُّوٓأَىٰٓ أَن كَذَّبُوا۟ بِـَٔايَـٰتِ ٱللَّهِ وَكَانُوا۟ بِهَا يَسْتَهْزِءُونَ
    arabicPlain: ثم كان عاقبة الذين أساءوا السوأى أن كذبوا بآيات الله وكانوا بها يستهزئون
