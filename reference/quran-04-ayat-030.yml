  data:
    ref: '30:49'
    scripture: quran
    name: Quran 30:49
    chapter: 30
    verse: 49
    ordinal: 3458
    text: Though before that, even before it was sent down upon them, they were in despair.
    translation: Pickthall
    original: وَإِن كَانُوا۟ مِن قَبْلِ أَن يُنَزَّلَ عَلَيْهِم مِّن قَبْلِهِۦ لَمُبْلِسِينَ
    arabicPlain: وإن كانوا من قبل أن ينزل عليهم من قبله لمبلسين
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 353
