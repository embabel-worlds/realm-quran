  data:
    ref: '30:43'
    scripture: quran
    name: Quran 30:43
    chapter: 30
    verse: 43
    ordinal: 3452
    text: So set thy purpose resolutely for the right religion, before the inevitable day cometh from Allah. On that day mankind will be sundered-
    translation: Pickthall
    original: فَأَقِمْ وَجْهَكَ لِلدِّينِ ٱلْقَيِّمِ مِن قَبْلِ أَن يَأْتِىَ يَوْمٌ لَّا مَرَدَّ لَهُۥ مِنَ ٱللَّهِ ۖ يَوْمَئِذٍ يَصَّدَّعُونَ
    arabicPlain: فأقم وجهك للدين القيم من قبل أن يأتي يوم لا مرد له من الله ۖ يومئذ يصدعون
