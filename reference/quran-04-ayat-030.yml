  data:
    ref: '30:33'
    scripture: quran
    name: Quran 30:33
    chapter: 30
    verse: 33
    ordinal: 3442
    text: And when harm toucheth men they cry unto their Lord, turning to Him in repentance; then, when they have tasted of His mercy, behold! some of them attribute partners to their Lord
    translation: Pickthall
    original: وَإِذَا مَسَّ ٱلنَّاسَ ضُرٌّ دَعَوْا۟ رَبَّهُم مُّنِيبِينَ إِلَيْهِ ثُمَّ إِذَآ أَذَاقَهُم مِّنْهُ رَحْمَةً إِذَا فَرِيقٌ مِّنْهُم بِرَبِّهِمْ يُشْرِكُونَ
    arabicPlain: وإذا مس الناس ضر دعوا ربهم منيبين إليه ثم إذا أذاقهم منه رحمة إذا فريق منهم بربهم يشركون
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 352
    page: 408
  relations:
  - predicate: IN
    to:
