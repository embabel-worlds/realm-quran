    scripture: quran
    name: Quran 30:23
    chapter: 30
    verse: 23
    ordinal: 3432
    text: And of His signs is your slumber by night and by day, and your seeking of His bounty. Lo! herein indeed are portents for folk who heed.
    translation: Pickthall
    original: وَمِنْ ءَايَـٰتِهِۦ مَنَامُكُم بِٱلَّيْلِ وَٱلنَّهَارِ وَٱبْتِغَآؤُكُم مِّن فَضْلِهِۦٓ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍ لِّقَوْمٍ يَسْمَعُونَ
    arabicPlain: ومن آياته منامكم بالليل والنهار وابتغاؤكم من فضله ۚ إن في ذلك لآيات لقوم يسمعون
