- type: Ayah
  data:
    ref: '30:38'
    scripture: quran
    name: Quran 30:38
    chapter: 30
    verse: 38
    ordinal: 3447
    text: So give to the kinsman his due, and to the needy, and to the wayfarer. That is best for those who seek Allah's Countenance. And such are they who are successful.
    translation: Pickthall
    original: فَـَٔاتِ ذَا ٱلْقُرْبَىٰ حَقَّهُۥ وَٱلْمِسْكِينَ وَٱبْنَ ٱلسَّبِيلِ ۚ ذَٰلِكَ خَيْرٌ لِّلَّذِينَ يُرِيدُونَ وَجْهَ ٱللَّهِ ۖ وَأُو۟لَـٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ
    arabicPlain: فآت ذا القربى حقه والمسكين وابن السبيل ۚ ذلك خير للذين يريدون وجه الله ۖ وأولئك هم المفلحون
