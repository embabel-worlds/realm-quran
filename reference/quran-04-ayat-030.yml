  data:
    ref: '30:26'
    scripture: quran
    name: Quran 30:26
    chapter: 30
    verse: 26
    ordinal: 3435
    text: Unto Him belongeth whosoever is in the heavens and the earth. All are obedient unto Him.
    translation: Pickthall
    original: وَلَهُۥ مَن فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۖ كُلٌّ لَّهُۥ قَـٰنِتُونَ
    arabicPlain: وله من في السماوات والأرض ۖ كل له قانتون
