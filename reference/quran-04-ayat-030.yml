    scripture: quran
    name: Quran 30:56
    chapter: 30
    verse: 56
    ordinal: 3465
    text: 'But those to whom knowledge and faith are given will say: The truth is, ye have tarried, by Allah''s decree, until the Day of Resurrection. This is the Day of Resurrection, but ye used not to know.'
    translation: Pickthall
    original: وَقَالَ ٱلَّذِينَ أُوتُوا۟ ٱلْعِلْمَ وَٱلْإِيمَـٰنَ لَقَدْ لَبِثْتُمْ فِى كِتَـٰبِ ٱللَّهِ إِلَىٰ يَوْمِ ٱلْبَعْثِ ۖ فَهَـٰذَا يَوْمُ ٱلْبَعْثِ وَلَـٰكِنَّكُمْ كُنتُمْ لَا تَعْلَمُونَ
    arabicPlain: وقال الذين أوتوا العلم والإيمان لقد لبثتم في كتاب الله إلى يوم البعث ۖ فهذا يوم البعث ولكنكم كنتم لا تعلمون
