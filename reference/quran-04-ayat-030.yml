  data:
    ref: '30:55'
    scripture: quran
    name: Quran 30:55
    chapter: 30
    verse: 55
    ordinal: 3464
    text: And on the day when the Hour riseth the guilty will vow that they did tarry but an hour - thus were they ever deceived.
    translation: Pickthall
    original: وَيَوْمَ تَقُومُ ٱلسَّاعَةُ يُقْسِمُ ٱلْمُجْرِمُونَ مَا لَبِثُوا۟ غَيْرَ سَاعَةٍ ۚ كَذَٰلِكَ كَانُوا۟ يُؤْفَكُونَ
    arabicPlain: ويوم تقوم الساعة يقسم المجرمون ما لبثوا غير ساعة ۚ كذلك كانوا يؤفكون
    surahName: Ar-Room
    juz: 21
    manzil: 5
