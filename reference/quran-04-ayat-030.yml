  data:
    ref: '30:22'
    scripture: quran
    name: Quran 30:22
    chapter: 30
    verse: 22
    ordinal: 3431
    text: And of His signs is the creation of the heavens and the earth, and the difference of your languages and colours. Lo! herein indeed are portents for men of knowledge.
    translation: Pickthall
    original: وَمِنْ ءَايَـٰتِهِۦ خَلْقُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَٱخْتِلَـٰفُ أَلْسِنَتِكُمْ وَأَلْوَٰنِكُمْ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍ لِّلْعَـٰلِمِينَ
    arabicPlain: ومن آياته خلق السماوات والأرض واختلاف ألسنتكم وألوانكم ۚ إن في ذلك لآيات للعالمين
    surahName: Ar-Room
    juz: 21
