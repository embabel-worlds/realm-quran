  data:
    ref: '30:45'
    scripture: quran
    name: Quran 30:45
    chapter: 30
    verse: 45
    ordinal: 3454
    text: That He may reward out of His bounty those who believe and do good works. Lo! He loveth not the disbelievers (in His guidance).
    translation: Pickthall
    original: لِيَجْزِىَ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ مِن فَضْلِهِۦٓ ۚ إِنَّهُۥ لَا يُحِبُّ ٱلْكَـٰفِرِينَ
    arabicPlain: ليجزي الذين آمنوا وعملوا الصالحات من فضله ۚ إنه لا يحب الكافرين
