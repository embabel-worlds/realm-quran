  data:
    ref: '30:32'
    scripture: quran
    name: Quran 30:32
    chapter: 30
    verse: 32
    ordinal: 3441
    text: Of those who split up their religion and became schismatics, each sect exulting in its tenets.
    translation: Pickthall
    original: مِنَ ٱلَّذِينَ فَرَّقُوا۟ دِينَهُمْ وَكَانُوا۟ شِيَعًا ۖ كُلُّ حِزْبٍۭ بِمَا لَدَيْهِمْ فَرِحُونَ
    arabicPlain: من الذين فرقوا دينهم وكانوا شيعا ۖ كل حزب بما لديهم فرحون
    surahName: Ar-Room
    juz: 21
    manzil: 5
