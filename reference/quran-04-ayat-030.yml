    original: وَلَقَدْ ضَرَبْنَا لِلنَّاسِ فِى هَـٰذَا ٱلْقُرْءَانِ مِن كُلِّ مَثَلٍ ۚ وَلَئِن جِئْتَهُم بِـَٔايَةٍ لَّيَقُولَنَّ ٱلَّذِينَ كَفَرُوٓا۟ إِنْ أَنتُمْ إِلَّا مُبْطِلُونَ
    arabicPlain: ولقد ضربنا للناس في هذا القرآن من كل مثل ۚ ولئن جئتهم بآية ليقولن الذين كفروا إن أنتم إلا مبطلون
