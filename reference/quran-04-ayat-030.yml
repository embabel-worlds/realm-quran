  data:
    ref: '30:44'
    scripture: quran
    name: Quran 30:44
    chapter: 30
    verse: 44
    ordinal: 3453
    text: Whoso disbelieveth must (then) bear the consequences of his disbelief, while those who do right make provision for themselves -
    translation: Pickthall
    original: مَن كَفَرَ فَعَلَيْهِ كُفْرُهُۥ ۖ وَمَنْ عَمِلَ صَـٰلِحًا فَلِأَنفُسِهِمْ يَمْهَدُونَ
    arabicPlain: من كفر فعليه كفره ۖ ومن عمل صالحا فلأنفسهم يمهدون
