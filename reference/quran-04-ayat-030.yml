  data:
    ref: '30:27'
    scripture: quran
    name: Quran 30:27
    chapter: 30
    verse: 27
    ordinal: 3436
    text: He it is Who produceth creation, then reproduceth it, and it is easier for Him. His is the Sublime Similitude in the heavens and the earth. He is the Mighty, the Wise.
    translation: Pickthall
    original: وَهُوَ ٱلَّذِى يَبْدَؤُا۟ ٱلْخَلْقَ ثُمَّ يُعِيدُهُۥ وَهُوَ أَهْوَنُ عَلَيْهِ ۚ وَلَهُ ٱلْمَثَلُ ٱلْأَعْلَىٰ فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۚ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ
    arabicPlain: وهو الذي يبدأ الخلق ثم يعيده وهو أهون عليه ۚ وله المثل الأعلى في السماوات والأرض ۚ وهو العزيز الحكيم
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 351
    page: 407
