  data:
    ref: '30:21'
    scripture: quran
    name: Quran 30:21
    chapter: 30
    verse: 21
    ordinal: 3430
    text: 'And of His signs is this: He created for you helpmeets from yourselves that ye might find rest in them, and He ordained between you love and mercy. Lo! herein indeed are portents for folk who reflect.'
    translation: Pickthall
    original: وَمِنْ ءَايَـٰتِهِۦٓ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَٰجًا لِّتَسْكُنُوٓا۟ إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍ لِّقَوْمٍ يَتَفَكَّرُونَ
    arabicPlain: ومن آياته أن خلق لكم من أنفسكم أزواجا لتسكنوا إليها وجعل بينكم مودة ورحمة ۚ إن في ذلك لآيات لقوم يتفكرون
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 351
    page: 406
