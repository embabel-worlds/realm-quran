  data:
    ref: '30:31'
    scripture: quran
    name: Quran 30:31
    chapter: 30
    verse: 31
    ordinal: 3440
    text: Turning unto Him (only); and be careful of your duty unto Him and establish worship, and be not of those who ascribe partners (unto Him);
    translation: Pickthall
    original: ۞ مُنِيبِينَ إِلَيْهِ وَٱتَّقُوهُ وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَلَا تَكُونُوا۟ مِنَ ٱلْمُشْرِكِينَ
    arabicPlain: ۞ منيبين إليه واتقوه وأقيموا الصلاة ولا تكونوا من المشركين
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 352
