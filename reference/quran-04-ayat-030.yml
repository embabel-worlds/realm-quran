  data:
    ref: '30:50'
    scripture: quran
    name: Quran 30:50
    chapter: 30
    verse: 50
    ordinal: 3459
    text: 'Look, therefore, at the prints of Allah''s mercy (in creation): how He quickeneth the earth after her death. Lo! He verily is the Quickener of the Dead, and He is Able to do all things.'
    translation: Pickthall
    original: فَٱنظُرْ إِلَىٰٓ ءَاثَـٰرِ رَحْمَتِ ٱللَّهِ كَيْفَ يُحْىِ ٱلْأَرْضَ بَعْدَ مَوْتِهَآ ۚ إِنَّ ذَٰلِكَ لَمُحْىِ ٱلْمَوْتَىٰ ۖ وَهُوَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ
    arabicPlain: فانظر إلى آثار رحمت الله كيف يحيي الأرض بعد موتها ۚ إن ذلك لمحيي الموتى ۖ وهو على كل شيء قدير
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 353
