  data:
    ref: '30:52'
    scripture: quran
    name: Quran 30:52
    chapter: 30
    verse: 52
    ordinal: 3461
    text: For verily thou (Muhammad) canst not make the dead to hear, nor canst thou make the deaf to hear the call when they have turned to flee.
    translation: Pickthall
    original: فَإِنَّكَ لَا تُسْمِعُ ٱلْمَوْتَىٰ وَلَا تُسْمِعُ ٱلصُّمَّ ٱلدُّعَآءَ إِذَا وَلَّوْا۟ مُدْبِرِينَ
    arabicPlain: فإنك لا تسمع الموتى ولا تسمع الصم الدعاء إذا ولوا مدبرين
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 353
    page: 410
  relations:
