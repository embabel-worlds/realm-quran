  data:
    ref: '30:25'
    scripture: quran
    name: Quran 30:25
    chapter: 30
    verse: 25
    ordinal: 3434
    text: 'And of His signs is this: The heavens and the earth stand fast by His command, and afterward, when He calleth you, lo! from the earth ye will emerge.'
    translation: Pickthall
    original: وَمِنْ ءَايَـٰتِهِۦٓ أَن تَقُومَ ٱلسَّمَآءُ وَٱلْأَرْضُ بِأَمْرِهِۦ ۚ ثُمَّ إِذَا دَعَاكُمْ دَعْوَةً مِّنَ ٱلْأَرْضِ إِذَآ أَنتُمْ تَخْرُجُونَ
    arabicPlain: ومن آياته أن تقوم السماء والأرض بأمره ۚ ثم إذا دعاكم دعوة من الأرض إذا أنتم تخرجون
