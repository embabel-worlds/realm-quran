  data:
    ref: '30:30'
    scripture: quran
    name: Quran 30:30
    chapter: 30
    verse: 30
    ordinal: 3439
    text: So set thy purpose (O Muhammad) for religion as a man by nature upright - the nature (framed) of Allah, in which He hath created man. There is no altering (the laws of) Allah's creation. That is the right religion, but most men know not -
    translation: Pickthall
    original: فَأَقِمْ وَجْهَكَ لِلدِّينِ حَنِيفًا ۚ فِطْرَتَ ٱللَّهِ ٱلَّتِى فَطَرَ ٱلنَّاسَ عَلَيْهَا ۚ لَا تَبْدِيلَ لِخَلْقِ ٱللَّهِ ۚ ذَٰلِكَ ٱلدِّينُ ٱلْقَيِّمُ وَلَـٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يَعْلَمُونَ
    arabicPlain: فأقم وجهك للدين حنيفا ۚ فطرت الله التي فطر الناس عليها ۚ لا تبديل لخلق الله ۚ ذلك الدين القيم ولكن أكثر الناس لا يعلمون
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 352
    page: 407
  relations:
