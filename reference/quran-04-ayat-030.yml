  data:
    ref: '30:34'
    scripture: quran
    name: Quran 30:34
    chapter: 30
    verse: 34
    ordinal: 3443
    text: 'So as to disbelieve in that which We have given them. (Unto such it is said): Enjoy yourselves awhile, but ye will come to know.'
    translation: Pickthall
    original: لِيَكْفُرُوا۟ بِمَآ ءَاتَيْنَـٰهُمْ ۚ فَتَمَتَّعُوا۟ فَسَوْفَ تَعْلَمُونَ
    arabicPlain: ليكفروا بما آتيناهم ۚ فتمتعوا فسوف تعلمون
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 352
    page: 408
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '30'
  - predicate: IN_PORTION
    to:
      type: Juz
