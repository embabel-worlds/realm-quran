  data:
    ref: '30:36'
    scripture: quran
    name: Quran 30:36
    chapter: 30
    verse: 36
    ordinal: 3445
    text: And when We cause mankind to taste of mercy they rejoice therein; but if an evil thing befall them as the consequence of their own deeds, lo! they are in despair!
    translation: Pickthall
    original: وَإِذَآ أَذَقْنَا ٱلنَّاسَ رَحْمَةً فَرِحُوا۟ بِهَا ۖ وَإِن تُصِبْهُمْ سَيِّئَةٌۢ بِمَا قَدَّمَتْ أَيْدِيهِمْ إِذَا هُمْ يَقْنَطُونَ
    arabicPlain: وإذا أذقنا الناس رحمة فرحوا بها ۖ وإن تصبهم سيئة بما قدمت أيديهم إذا هم يقنطون
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 352
    page: 408
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '30'
  - predicate: IN_PORTION
    to:
