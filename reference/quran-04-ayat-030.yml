  data:
    ref: '30:35'
    scripture: quran
    name: Quran 30:35
    chapter: 30
    verse: 35
    ordinal: 3444
    text: Or have We revealed unto them any warrant which speaketh of that which they associate with Him?
    translation: Pickthall
    original: أَمْ أَنزَلْنَا عَلَيْهِمْ سُلْطَـٰنًا فَهُوَ يَتَكَلَّمُ بِمَا كَانُوا۟ بِهِۦ يُشْرِكُونَ
    arabicPlain: أم أنزلنا عليهم سلطانا فهو يتكلم بما كانوا به يشركون
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 352
    page: 408
  relations:
