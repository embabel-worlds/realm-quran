  data:
    ref: '30:53'
    scripture: quran
    name: Quran 30:53
    chapter: 30
    verse: 53
    ordinal: 3462
    text: Nor canst thou guide the blind out of their error. Thou canst make none to hear save those who believe in Our revelations so that they surrender (unto Him).
    translation: Pickthall
    original: وَمَآ أَنتَ بِهَـٰدِ ٱلْعُمْىِ عَن ضَلَـٰلَتِهِمْ ۖ إِن تُسْمِعُ إِلَّا مَن يُؤْمِنُ بِـَٔايَـٰتِنَا فَهُم مُّسْلِمُونَ
    arabicPlain: وما أنت بهاد العمي عن ضلالتهم ۖ إن تسمع إلا من يؤمن بآياتنا فهم مسلمون
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 353
    page: 410
  relations:
