  data:
    ref: '30:37'
    scripture: quran
    name: Quran 30:37
    chapter: 30
    verse: 37
    ordinal: 3446
    text: See they not that Allah enlargeth the provision for whom He will, and straiteneth (it for whom He will). Lo! herein indeed are portents for folk who believe.
    translation: Pickthall
    original: أَوَلَمْ يَرَوْا۟ أَنَّ ٱللَّهَ يَبْسُطُ ٱلرِّزْقَ لِمَن يَشَآءُ وَيَقْدِرُ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍ لِّقَوْمٍ يُؤْمِنُونَ
    arabicPlain: أولم يروا أن الله يبسط الرزق لمن يشاء ويقدر ۚ إن في ذلك لآيات لقوم يؤمنون
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 352
    page: 408
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '30'
