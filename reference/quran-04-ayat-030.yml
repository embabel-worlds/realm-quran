  data:
    ref: '30:51'
    scripture: quran
    name: Quran 30:51
    chapter: 30
    verse: 51
    ordinal: 3460
    text: And if We sent a wind and they beheld it yellow, they verily would still continue in their disbelief.
    translation: Pickthall
    original: وَلَئِنْ أَرْسَلْنَا رِيحًا فَرَأَوْهُ مُصْفَرًّا لَّظَلُّوا۟ مِنۢ بَعْدِهِۦ يَكْفُرُونَ
    arabicPlain: ولئن أرسلنا ريحا فرأوه مصفرا لظلوا من بعده يكفرون
    surahName: Ar-Room
    juz: 21
    manzil: 5
    ruku: 353
