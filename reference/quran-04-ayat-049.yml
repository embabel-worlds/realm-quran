- type: Ayah
  data:
    ref: '49:10'
    scripture: quran
    name: Quran 49:10
    chapter: 49
    verse: 10
    ordinal: 4622
    text: The believers are naught else than brothers. Therefore make peace between your brethren and observe your duty to Allah that haply ye may obtain mercy.
    translation: Pickthall
    original: إِنَّمَا ٱلْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا۟ بَيْنَ أَخَوَيْكُمْ ۚ وَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تُرْحَمُونَ
    arabicPlain: إنما المؤمنون إخوة فأصلحوا بين أخويكم ۚ واتقوا الله لعلكم ترحمون
    surahName: Al-Hujuraat
    juz: 26
    manzil: 6
    ruku: 450
    page: 516
