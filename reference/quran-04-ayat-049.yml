- type: Ayah
  data:
    ref: '49:9'
    scripture: quran
    name: Quran 49:9
    chapter: 49
    verse: 9
    ordinal: 4621
    text: And if two parties of believers fall to fighting, then make peace between them. And if one party of them doeth wrong to the other, fight ye that which doeth wrong till it return unto the ordinance of Allah; then, if it return, make peace between them justly, and act equitably. Lo! Allah loveth the equitable.
    translation: Pickthall
    original: وَإِن طَآئِفَتَانِ مِنَ ٱلْمُؤْمِنِينَ ٱقْتَتَلُوا۟ فَأَصْلِحُوا۟ بَيْنَهُمَا ۖ فَإِنۢ بَغَتْ إِحْدَىٰهُمَا عَلَى ٱلْأُخْرَىٰ فَقَـٰتِلُوا۟ ٱلَّتِى تَبْغِى حَتَّىٰ تَفِىٓءَ إِلَىٰٓ أَمْرِ ٱللَّهِ ۚ فَإِن فَآءَتْ فَأَصْلِحُوا۟ بَيْنَهُمَا بِٱلْعَدْلِ وَأَقْسِطُوٓا۟ ۖ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُقْسِطِينَ
    arabicPlain: وإن طائفتان من المؤمنين اقتتلوا فأصلحوا بينهما ۖ فإن بغت إحداهما على الأخرى فقاتلوا التي تبغي حتى تفيء إلى أمر الله ۚ فإن فاءت فأصلحوا بينهما بالعدل وأقسطوا ۖ إن الله يحب المقسطين
    surahName: Al-Hujuraat
    juz: 26
    manzil: 6
    ruku: 450
    page: 516
