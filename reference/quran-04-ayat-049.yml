  data:
    ref: '49:5'
    scripture: quran
    name: Quran 49:5
    chapter: 49
    verse: 5
    ordinal: 4617
    text: And if they had had patience till thou camest forth unto them, it had been better for them. And Allah is Forgiving, Merciful.
    translation: Pickthall
    original: وَلَوْ أَنَّهُمْ صَبَرُوا۟ حَتَّىٰ تَخْرُجَ إِلَيْهِمْ لَكَانَ خَيْرًا لَّهُمْ ۚ وَٱللَّهُ غَفُورٌ رَّحِيمٌ
    arabicPlain: ولو أنهم صبروا حتى تخرج إليهم لكان خيرا لهم ۚ والله غفور رحيم
