  data:
    ref: '49:8'
    scripture: quran
    name: Quran 49:8
    chapter: 49
    verse: 8
    ordinal: 4620
    text: (It is) a bounty and a grace from Allah; and Allah is Knower, Wise.
    translation: Pickthall
    original: فَضْلًا مِّنَ ٱللَّهِ وَنِعْمَةً ۚ وَٱللَّهُ عَلِيمٌ حَكِيمٌ
    arabicPlain: فضلا من الله ونعمة ۚ والله عليم حكيم
    surahName: Al-Hujuraat
    juz: 26
