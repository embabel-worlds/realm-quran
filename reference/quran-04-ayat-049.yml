- type: Ayah
  data:
    ref: '49:14'
    scripture: quran
    name: Quran 49:14
    chapter: 49
    verse: 14
    ordinal: 4626
    text: 'The wandering Arabs say: We believe. Say (unto them, O Muhammad): Ye believe not, but rather say "We submit," for the faith hath not yet entered into your hearts. Yet, if ye obey Allah and His messenger, He will not withhold from you aught of (the reward of) your deeds. Lo! Allah is Forgiving, Merciful.'
    translation: Pickthall
    original: ۞ قَالَتِ ٱلْأَعْرَابُ ءَامَنَّا ۖ قُل لَّمْ تُؤْمِنُوا۟ وَلَـٰكِن قُولُوٓا۟ أَسْلَمْنَا وَلَمَّا يَدْخُلِ ٱلْإِيمَـٰنُ فِى قُلُوبِكُمْ ۖ وَإِن تُطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥ لَا يَلِتْكُم مِّنْ أَعْمَـٰلِكُمْ شَيْـًٔا ۚ إِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ
    arabicPlain: ۞ قالت الأعراب آمنا ۖ قل لم تؤمنوا ولكن قولوا أسلمنا ولما يدخل الإيمان في قلوبكم ۖ وإن تطيعوا الله ورسوله لا يلتكم من أعمالكم شيئا ۚ إن الله غفور رحيم
    surahName: Al-Hujuraat
    juz: 26
    manzil: 6
    ruku: 451
