    scripture: quran
    name: Quran 49:4
    chapter: 49
    verse: 4
    ordinal: 4616
    text: Lo! those who call thee from behind the private apartments, most of them have no sense.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ يُنَادُونَكَ مِن وَرَآءِ ٱلْحُجُرَٰتِ أَكْثَرُهُمْ لَا يَعْقِلُونَ
    arabicPlain: إن الذين ينادونك من وراء الحجرات أكثرهم لا يعقلون
    surahName: Al-Hujuraat
    juz: 26
