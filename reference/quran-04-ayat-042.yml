  data:
    ref: '42:20'
    scripture: quran
    name: Quran 42:20
    chapter: 42
    verse: 20
    ordinal: 4292
    text: Whoso desireth the harvest of the Hereafter, We give him increase in its harvest. And whoso desireth the harvest of the world, We give him thereof, and he hath no portion in the Hereafter.
    translation: Pickthall
    original: مَن كَانَ يُرِيدُ حَرْثَ ٱلْـَٔاخِرَةِ نَزِدْ لَهُۥ فِى حَرْثِهِۦ ۖ وَمَن كَانَ يُرِيدُ حَرْثَ ٱلدُّنْيَا نُؤْتِهِۦ مِنْهَا وَمَا لَهُۥ فِى ٱلْـَٔاخِرَةِ مِن نَّصِيبٍ
    arabicPlain: من كان يريد حرث الآخرة نزد له في حرثه ۖ ومن كان يريد حرث الدنيا نؤته منها وما له في الآخرة من نصيب
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 421
