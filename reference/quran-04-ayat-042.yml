  data:
    ref: '42:40'
    scripture: quran
    name: Quran 42:40
    chapter: 42
    verse: 40
    ordinal: 4312
    text: The guerdon of an ill-deed is an ill the like thereof. But whosoever pardoneth and amendeth, his wage is the affair of Allah. Lo! He loveth not wrong-doers.
    translation: Pickthall
    original: وَجَزَٰٓؤُا۟ سَيِّئَةٍ سَيِّئَةٌ مِّثْلُهَا ۖ فَمَنْ عَفَا وَأَصْلَحَ فَأَجْرُهُۥ عَلَى ٱللَّهِ ۚ إِنَّهُۥ لَا يُحِبُّ ٱلظَّـٰلِمِينَ
    arabicPlain: وجزاء سيئة سيئة مثلها ۖ فمن عفا وأصلح فأجره على الله ۚ إنه لا يحب الظالمين
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 422
    page: 487
