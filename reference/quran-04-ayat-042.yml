- type: Ayah
  data:
    ref: '42:16'
    scripture: quran
    name: Quran 42:16
    chapter: 42
    verse: 16
    ordinal: 4288
    text: And those who argue concerning Allah after He hath been acknowledged, their argument hath no weight with their Lord, and wrath is upon them and theirs will be an awful doom.
    translation: Pickthall
    original: وَٱلَّذِينَ يُحَآجُّونَ فِى ٱللَّهِ مِنۢ بَعْدِ مَا ٱسْتُجِيبَ لَهُۥ حُجَّتُهُمْ دَاحِضَةٌ عِندَ رَبِّهِمْ وَعَلَيْهِمْ غَضَبٌ وَلَهُمْ عَذَابٌ شَدِيدٌ
    arabicPlain: والذين يحاجون في الله من بعد ما استجيب له حجتهم داحضة عند ربهم وعليهم غضب ولهم عذاب شديد
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 420
