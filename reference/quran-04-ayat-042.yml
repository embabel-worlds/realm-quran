  data:
    ref: '42:18'
    scripture: quran
    name: Quran 42:18
    chapter: 42
    verse: 18
    ordinal: 4290
    text: Those who believe not therein seek to hasten it, while those who believe are fearful of it and know that it is the Truth. Are not they who dispute, in doubt concerning the Hour, far astray?
    translation: Pickthall
    original: يَسْتَعْجِلُ بِهَا ٱلَّذِينَ لَا يُؤْمِنُونَ بِهَا ۖ وَٱلَّذِينَ ءَامَنُوا۟ مُشْفِقُونَ مِنْهَا وَيَعْلَمُونَ أَنَّهَا ٱلْحَقُّ ۗ أَلَآ إِنَّ ٱلَّذِينَ يُمَارُونَ فِى ٱلسَّاعَةِ لَفِى ضَلَـٰلٍۭ بَعِيدٍ
    arabicPlain: يستعجل بها الذين لا يؤمنون بها ۖ والذين آمنوا مشفقون منها ويعلمون أنها الحق ۗ ألا إن الذين يمارون في الساعة لفي ضلال بعيد
    surahName: Ash-Shura
    juz: 25
    manzil: 6
