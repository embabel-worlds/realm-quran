    scripture: quran
    name: Quran 42:39
    chapter: 42
    verse: 39
    ordinal: 4311
    text: And those who, when great wrong is done to them, defend themselves,
    translation: Pickthall
    original: وَٱلَّذِينَ إِذَآ أَصَابَهُمُ ٱلْبَغْىُ هُمْ يَنتَصِرُونَ
    arabicPlain: والذين إذا أصابهم البغي هم ينتصرون
