- type: Ayah
  data:
    ref: '42:45'
    scripture: quran
    name: Quran 42:45
    chapter: 42
    verse: 45
    ordinal: 4317
    text: 'And thou wilt see them exposed to (the Fire), made humble by disgrace, and looking with veiled eyes. And those who believe will say: Lo! the (eternal) losers are they who lose themselves and their housefolk on the Day of Resurrection. Lo! are not the wrong-doers in perpetual torment?'
    translation: Pickthall
    original: وَتَرَىٰهُمْ يُعْرَضُونَ عَلَيْهَا خَـٰشِعِينَ مِنَ ٱلذُّلِّ يَنظُرُونَ مِن طَرْفٍ خَفِىٍّ ۗ وَقَالَ ٱلَّذِينَ ءَامَنُوٓا۟ إِنَّ ٱلْخَـٰسِرِينَ ٱلَّذِينَ خَسِرُوٓا۟ أَنفُسَهُمْ وَأَهْلِيهِمْ يَوْمَ ٱلْقِيَـٰمَةِ ۗ أَلَآ إِنَّ ٱلظَّـٰلِمِينَ فِى عَذَابٍ مُّقِيمٍ
    arabicPlain: وتراهم يعرضون عليها خاشعين من الذل ينظرون من طرف خفي ۗ وقال الذين آمنوا إن الخاسرين الذين خسروا أنفسهم وأهليهم يوم القيامة ۗ ألا إن الظالمين في عذاب مقيم
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 423
    page: 488
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:46'
    scripture: quran
    name: Quran 42:46
    chapter: 42
    verse: 46
    ordinal: 4318
    text: And they will have no protecting friends to help them instead of Allah. He whom Allah sendeth astray, for him there is no road.
    translation: Pickthall
    original: وَمَا كَانَ لَهُم مِّنْ أَوْلِيَآءَ يَنصُرُونَهُم مِّن دُونِ ٱللَّهِ ۗ وَمَن يُضْلِلِ ٱللَّهُ فَمَا لَهُۥ مِن سَبِيلٍ
    arabicPlain: وما كان لهم من أولياء ينصرونهم من دون الله ۗ ومن يضلل الله فما له من سبيل
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 423
    page: 488
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
