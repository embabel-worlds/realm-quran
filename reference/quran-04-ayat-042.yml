  data:
    ref: '42:19'
    scripture: quran
    name: Quran 42:19
    chapter: 42
    verse: 19
    ordinal: 4291
    text: Allah is gracious unto His slaves. He provideth for whom He will. And He is the Strong, the Mighty.
    translation: Pickthall
    original: ٱللَّهُ لَطِيفٌۢ بِعِبَادِهِۦ يَرْزُقُ مَن يَشَآءُ ۖ وَهُوَ ٱلْقَوِىُّ ٱلْعَزِيزُ
    arabicPlain: الله لطيف بعباده يرزق من يشاء ۖ وهو القوي العزيز
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 420
