- type: Ayah
  data:
    ref: '42:6'
    scripture: quran
    name: Quran 42:6
    chapter: 42
    verse: 6
    ordinal: 4278
    text: And as for those who choose protecting friends beside Him, Allah is Warden over them, and thou art in no wise a guardian over them.
    translation: Pickthall
    original: وَٱلَّذِينَ ٱتَّخَذُوا۟ مِن دُونِهِۦٓ أَوْلِيَآءَ ٱللَّهُ حَفِيظٌ عَلَيْهِمْ وَمَآ أَنتَ عَلَيْهِم بِوَكِيلٍ
    arabicPlain: والذين اتخذوا من دونه أولياء الله حفيظ عليهم وما أنت عليهم بوكيل
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 419
    page: 483
