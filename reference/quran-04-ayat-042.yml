  data:
    ref: '42:36'
    scripture: quran
    name: Quran 42:36
    chapter: 42
    verse: 36
    ordinal: 4308
    text: Now whatever ye have been given is but a passing comfort for the life of the world, and that which Allah hath is better and more lasting for those who believe and put their trust in their Lord,
    translation: Pickthall
    original: فَمَآ أُوتِيتُم مِّن شَىْءٍ فَمَتَـٰعُ ٱلْحَيَوٰةِ ٱلدُّنْيَا ۖ وَمَا عِندَ ٱللَّهِ خَيْرٌ وَأَبْقَىٰ لِلَّذِينَ ءَامَنُوا۟ وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ
    arabicPlain: فما أوتيتم من شيء فمتاع الحياة الدنيا ۖ وما عند الله خير وأبقى للذين آمنوا وعلى ربهم يتوكلون
    surahName: Ash-Shura
    juz: 25
