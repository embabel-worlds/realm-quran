- type: Ayah
  data:
    ref: '42:11'
    scripture: quran
    name: Quran 42:11
    chapter: 42
    verse: 11
    ordinal: 4283
    text: The Creator of the heavens and the earth. He hath made for you pairs of yourselves, and of the cattle also pairs, whereby He multiplieth you. Naught is as His likeness; and He is the Hearer, the Seer.
    translation: Pickthall
    original: فَاطِرُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۚ جَعَلَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَٰجًا وَمِنَ ٱلْأَنْعَـٰمِ أَزْوَٰجًا ۖ يَذْرَؤُكُمْ فِيهِ ۚ لَيْسَ كَمِثْلِهِۦ شَىْءٌ ۖ وَهُوَ ٱلسَّمِيعُ ٱلْبَصِيرُ
    arabicPlain: فاطر السماوات والأرض ۚ جعل لكم من أنفسكم أزواجا ومن الأنعام أزواجا ۖ يذرؤكم فيه ۚ ليس كمثله شيء ۖ وهو السميع البصير
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 420
