- type: Ayah
  data:
    ref: '42:9'
    scripture: quran
    name: Quran 42:9
    chapter: 42
    verse: 9
    ordinal: 4281
    text: Or have they chosen protecting friends besides Him? But Allah, He (alone) is the Protecting Friend. He quickeneth the dead, and He is Able to do all things.
    translation: Pickthall
    original: أَمِ ٱتَّخَذُوا۟ مِن دُونِهِۦٓ أَوْلِيَآءَ ۖ فَٱللَّهُ هُوَ ٱلْوَلِىُّ وَهُوَ يُحْىِ ٱلْمَوْتَىٰ وَهُوَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ
    arabicPlain: أم اتخذوا من دونه أولياء ۖ فالله هو الولي وهو يحيي الموتى وهو على كل شيء قدير
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 419
