- type: Ayah
  data:
    ref: '42:47'
    scripture: quran
    name: Quran 42:47
    chapter: 42
    verse: 47
    ordinal: 4319
    text: Answer the call of your Lord before there cometh unto you from Allah a Day which there is no averting. Ye have no refuge on that Day, nor have a ye any (power of) refusal.
    translation: Pickthall
    original: ٱسْتَجِيبُوا۟ لِرَبِّكُم مِّن قَبْلِ أَن يَأْتِىَ يَوْمٌ لَّا مَرَدَّ لَهُۥ مِنَ ٱللَّهِ ۚ مَا لَكُم مِّن مَّلْجَإٍ يَوْمَئِذٍ وَمَا لَكُم مِّن نَّكِيرٍ
    arabicPlain: استجيبوا لربكم من قبل أن يأتي يوم لا مرد له من الله ۚ ما لكم من ملجإ يومئذ وما لكم من نكير
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 423
    page: 488
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:48'
    scripture: quran
    name: Quran 42:48
    chapter: 42
    verse: 48
    ordinal: 4320
    text: But if they are averse, We have not sent thee as a warder over them. Thine is only to convey (the message). And lo! when We cause man to taste of mercy from Us he exulteth therefor. And if some evil striketh them because of that which their own hands have sent before, then lo! man is an ingrate.
    translation: Pickthall
    original: فَإِنْ أَعْرَضُوا۟ فَمَآ أَرْسَلْنَـٰكَ عَلَيْهِمْ حَفِيظًا ۖ إِنْ عَلَيْكَ إِلَّا ٱلْبَلَـٰغُ ۗ وَإِنَّآ إِذَآ أَذَقْنَا ٱلْإِنسَـٰنَ مِنَّا رَحْمَةً فَرِحَ بِهَا ۖ وَإِن تُصِبْهُمْ سَيِّئَةٌۢ بِمَا قَدَّمَتْ أَيْدِيهِمْ فَإِنَّ ٱلْإِنسَـٰنَ كَفُورٌ
    arabicPlain: فإن أعرضوا فما أرسلناك عليهم حفيظا ۖ إن عليك إلا البلاغ ۗ وإنا إذا أذقنا الإنسان منا رحمة فرح بها ۖ وإن تصبهم سيئة بما قدمت أيديهم فإن الإنسان كفور
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 423
    page: 488
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:49'
    scripture: quran
    name: Quran 42:49
    chapter: 42
    verse: 49
    ordinal: 4321
    text: Unto Allah belongeth the Sovereignty of the heavens and the earth. He createth what He will. He bestoweth female (offspring) upon whom He will, and bestoweth male (offspring) upon whom He will;
    translation: Pickthall
    original: لِّلَّهِ مُلْكُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۚ يَخْلُقُ مَا يَشَآءُ ۚ يَهَبُ لِمَن يَشَآءُ إِنَـٰثًا وَيَهَبُ لِمَن يَشَآءُ ٱلذُّكُورَ
    arabicPlain: لله ملك السماوات والأرض ۚ يخلق ما يشاء ۚ يهب لمن يشاء إناثا ويهب لمن يشاء الذكور
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 423
    page: 488
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:50'
    scripture: quran
    name: Quran 42:50
    chapter: 42
    verse: 50
    ordinal: 4322
    text: Or He mingleth them, males and females, and He maketh barren whom He will. Lo! He is Knower, Powerful.
    translation: Pickthall
    original: أَوْ يُزَوِّجُهُمْ ذُكْرَانًا وَإِنَـٰثًا ۖ وَيَجْعَلُ مَن يَشَآءُ عَقِيمًا ۚ إِنَّهُۥ عَلِيمٌ قَدِيرٌ
    arabicPlain: أو يزوجهم ذكرانا وإناثا ۖ ويجعل من يشاء عقيما ۚ إنه عليم قدير
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 423
    page: 488
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:51'
    scripture: quran
    name: Quran 42:51
    chapter: 42
    verse: 51
    ordinal: 4323
    text: And it was not (vouchsafed) to any mortal that Allah should speak to him unless (it be) by revelation or from behind a veil, or (that) He sendeth a messenger to reveal what He will by His leave. Lo! He is Exalted, Wise.
    translation: Pickthall
    original: ۞ وَمَا كَانَ لِبَشَرٍ أَن يُكَلِّمَهُ ٱللَّهُ إِلَّا وَحْيًا أَوْ مِن وَرَآئِ حِجَابٍ أَوْ يُرْسِلَ رَسُولًا فَيُوحِىَ بِإِذْنِهِۦ مَا يَشَآءُ ۚ إِنَّهُۥ عَلِىٌّ حَكِيمٌ
    arabicPlain: ۞ وما كان لبشر أن يكلمه الله إلا وحيا أو من وراء حجاب أو يرسل رسولا فيوحي بإذنه ما يشاء ۚ إنه علي حكيم
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 423
    page: 488
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:52'
    scripture: quran
    name: Quran 42:52
    chapter: 42
    verse: 52
    ordinal: 4324
    text: And thus have We inspired in thee (Muhammad) a Spirit of Our command. Thou knewest not what the Scripture was, nor what the Faith. But We have made it a light whereby We guide whom We will of Our bondmen. And lo! thou verily dost guide unto a right path,
    translation: Pickthall
    original: وَكَذَٰلِكَ أَوْحَيْنَآ إِلَيْكَ رُوحًا مِّنْ أَمْرِنَا ۚ مَا كُنتَ تَدْرِى مَا ٱلْكِتَـٰبُ وَلَا ٱلْإِيمَـٰنُ وَلَـٰكِن جَعَلْنَـٰهُ نُورًا نَّهْدِى بِهِۦ مَن نَّشَآءُ مِنْ عِبَادِنَا ۚ وَإِنَّكَ لَتَهْدِىٓ إِلَىٰ صِرَٰطٍ مُّسْتَقِيمٍ
    arabicPlain: وكذلك أوحينا إليك روحا من أمرنا ۚ ما كنت تدري ما الكتاب ولا الإيمان ولكن جعلناه نورا نهدي به من نشاء من عبادنا ۚ وإنك لتهدي إلى صراط مستقيم
