  data:
    ref: '42:5'
    scripture: quran
    name: Quran 42:5
    chapter: 42
    verse: 5
    ordinal: 4277
    text: Almost might the heavens above be rent asunder while the angels hymn the praise of their Lord and ask forgiveness for those on the earth. Lo! Allah, He is the Forgiver, the Merciful.
    translation: Pickthall
    original: تَكَادُ ٱلسَّمَـٰوَٰتُ يَتَفَطَّرْنَ مِن فَوْقِهِنَّ ۚ وَٱلْمَلَـٰٓئِكَةُ يُسَبِّحُونَ بِحَمْدِ رَبِّهِمْ وَيَسْتَغْفِرُونَ لِمَن فِى ٱلْأَرْضِ ۗ أَلَآ إِنَّ ٱللَّهَ هُوَ ٱلْغَفُورُ ٱلرَّحِيمُ
    arabicPlain: تكاد السماوات يتفطرن من فوقهن ۚ والملائكة يسبحون بحمد ربهم ويستغفرون لمن في الأرض ۗ ألا إن الله هو الغفور الرحيم
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 419
