  data:
    ref: '42:43'
    scripture: quran
    name: Quran 42:43
    chapter: 42
    verse: 43
    ordinal: 4315
    text: And verily whoso is patient and forgiveth - lo! that, verily, is (of) the steadfast heart of things.
    translation: Pickthall
    original: وَلَمَن صَبَرَ وَغَفَرَ إِنَّ ذَٰلِكَ لَمِنْ عَزْمِ ٱلْأُمُورِ
    arabicPlain: ولمن صبر وغفر إن ذلك لمن عزم الأمور
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 422
