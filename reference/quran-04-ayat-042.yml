  data:
    ref: '42:17'
    scripture: quran
    name: Quran 42:17
    chapter: 42
    verse: 17
    ordinal: 4289
    text: Allah it is Who hath revealed the Scripture with truth, and the Balance. How canst thou know? It may be that the Hour is nigh.
    translation: Pickthall
    original: ٱللَّهُ ٱلَّذِىٓ أَنزَلَ ٱلْكِتَـٰبَ بِٱلْحَقِّ وَٱلْمِيزَانَ ۗ وَمَا يُدْرِيكَ لَعَلَّ ٱلسَّاعَةَ قَرِيبٌ
    arabicPlain: الله الذي أنزل الكتاب بالحق والميزان ۗ وما يدريك لعل الساعة قريب
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 420
