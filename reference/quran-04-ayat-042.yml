  data:
    ref: '42:23'
    scripture: quran
    name: Quran 42:23
    chapter: 42
    verse: 23
    ordinal: 4295
    text: 'This it is which Allah announceth unto His bondmen who believe and do good works. Say (O Muhammad, unto mankind): I ask of you no fee therefor, save lovingkindness among kinsfolk. And whoso scoreth a good deed We add unto its good for him. Lo! Allah is Forgiving, Responsive.'
    translation: Pickthall
    original: ذَٰلِكَ ٱلَّذِى يُبَشِّرُ ٱللَّهُ عِبَادَهُ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ ۗ قُل لَّآ أَسْـَٔلُكُمْ عَلَيْهِ أَجْرًا إِلَّا ٱلْمَوَدَّةَ فِى ٱلْقُرْبَىٰ ۗ وَمَن يَقْتَرِفْ حَسَنَةً نَّزِدْ لَهُۥ فِيهَا حُسْنًا ۚ إِنَّ ٱللَّهَ غَفُورٌ شَكُورٌ
    arabicPlain: ذلك الذي يبشر الله عباده الذين آمنوا وعملوا الصالحات ۗ قل لا أسألكم عليه أجرا إلا المودة في القربى ۗ ومن يقترف حسنة نزد له فيها حسنا ۚ إن الله غفور شكور
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 421
    page: 486
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:24'
    scripture: quran
    name: Quran 42:24
    chapter: 42
    verse: 24
    ordinal: 4296
    text: 'Or say they: He hath invented a lie concerning Allah? If Allah willed, He could have sealed thy heart (against them). And Allah will wipe out the lie and will vindicate the truth by His words. Lo! He is Aware of what is hidden in the breasts (of men).'
    translation: Pickthall
    original: أَمْ يَقُولُونَ ٱفْتَرَىٰ عَلَى ٱللَّهِ كَذِبًا ۖ فَإِن يَشَإِ ٱللَّهُ يَخْتِمْ عَلَىٰ قَلْبِكَ ۗ وَيَمْحُ ٱللَّهُ ٱلْبَـٰطِلَ وَيُحِقُّ ٱلْحَقَّ بِكَلِمَـٰتِهِۦٓ ۚ إِنَّهُۥ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ
    arabicPlain: أم يقولون افترى على الله كذبا ۖ فإن يشإ الله يختم على قلبك ۗ ويمح الله الباطل ويحق الحق بكلماته ۚ إنه عليم بذات الصدور
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 421
    page: 486
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:25'
    scripture: quran
    name: Quran 42:25
    chapter: 42
    verse: 25
    ordinal: 4297
    text: And He it is Who accepteth repentance from His bondmen, and pardoneth the evil deeds, and knoweth what ye do,
    translation: Pickthall
    original: وَهُوَ ٱلَّذِى يَقْبَلُ ٱلتَّوْبَةَ عَنْ عِبَادِهِۦ وَيَعْفُوا۟ عَنِ ٱلسَّيِّـَٔاتِ وَيَعْلَمُ مَا تَفْعَلُونَ
    arabicPlain: وهو الذي يقبل التوبة عن عباده ويعفو عن السيئات ويعلم ما تفعلون
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 421
    page: 486
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:26'
    scripture: quran
    name: Quran 42:26
    chapter: 42
    verse: 26
    ordinal: 4298
    text: And accepteth those who do good works, and giveth increase unto them of His bounty. And as for disbelievers, theirs will be an awful doom.
    translation: Pickthall
    original: وَيَسْتَجِيبُ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ وَيَزِيدُهُم مِّن فَضْلِهِۦ ۚ وَٱلْكَـٰفِرُونَ لَهُمْ عَذَابٌ شَدِيدٌ
    arabicPlain: ويستجيب الذين آمنوا وعملوا الصالحات ويزيدهم من فضله ۚ والكافرون لهم عذاب شديد
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 421
    page: 486
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:27'
    scripture: quran
    name: Quran 42:27
    chapter: 42
    verse: 27
    ordinal: 4299
    text: And if Allah were to enlarge the provision for His slaves they would surely rebel in the earth, but He sendeth down by measure as He willeth. Lo! He is Informed, a Seer of His bondmen.
    translation: Pickthall
    original: ۞ وَلَوْ بَسَطَ ٱللَّهُ ٱلرِّزْقَ لِعِبَادِهِۦ لَبَغَوْا۟ فِى ٱلْأَرْضِ وَلَـٰكِن يُنَزِّلُ بِقَدَرٍ مَّا يَشَآءُ ۚ إِنَّهُۥ بِعِبَادِهِۦ خَبِيرٌۢ بَصِيرٌ
    arabicPlain: ۞ ولو بسط الله الرزق لعباده لبغوا في الأرض ولكن ينزل بقدر ما يشاء ۚ إنه بعباده خبير بصير
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 421
    page: 486
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:28'
    scripture: quran
    name: Quran 42:28
    chapter: 42
    verse: 28
    ordinal: 4300
    text: And He it is Who sendeth down the saving rain after they have despaired, and spreadeth out His mercy. He is the Protecting Friend, the Praiseworthy.
    translation: Pickthall
    original: وَهُوَ ٱلَّذِى يُنَزِّلُ ٱلْغَيْثَ مِنۢ بَعْدِ مَا قَنَطُوا۟ وَيَنشُرُ رَحْمَتَهُۥ ۚ وَهُوَ ٱلْوَلِىُّ ٱلْحَمِيدُ
    arabicPlain: وهو الذي ينزل الغيث من بعد ما قنطوا وينشر رحمته ۚ وهو الولي الحميد
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 421
    page: 486
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:29'
    scripture: quran
    name: Quran 42:29
    chapter: 42
    verse: 29
    ordinal: 4301
    text: And of His portents is the creation of the heaven and the earth, and of whatever beasts He hath dispersed therein. And He is Able to gather them when He will.
    translation: Pickthall
    original: وَمِنْ ءَايَـٰتِهِۦ خَلْقُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَمَا بَثَّ فِيهِمَا مِن دَآبَّةٍ ۚ وَهُوَ عَلَىٰ جَمْعِهِمْ إِذَا يَشَآءُ قَدِيرٌ
    arabicPlain: ومن آياته خلق السماوات والأرض وما بث فيهما من دابة ۚ وهو على جمعهم إذا يشاء قدير
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 421
    page: 486
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:30'
    scripture: quran
    name: Quran 42:30
    chapter: 42
    verse: 30
    ordinal: 4302
    text: Whatever of misfortune striketh you, it is what your right hands have earned. And He forgiveth much.
    translation: Pickthall
    original: وَمَآ أَصَـٰبَكُم مِّن مُّصِيبَةٍ فَبِمَا كَسَبَتْ أَيْدِيكُمْ وَيَعْفُوا۟ عَن كَثِيرٍ
    arabicPlain: وما أصابكم من مصيبة فبما كسبت أيديكم ويعفو عن كثير
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 422
    page: 486
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:31'
    scripture: quran
    name: Quran 42:31
    chapter: 42
    verse: 31
    ordinal: 4303
    text: Ye cannot escape in the earth, for beside Allah ye have no protecting friend nor any helper.
    translation: Pickthall
    original: وَمَآ أَنتُم بِمُعْجِزِينَ فِى ٱلْأَرْضِ ۖ وَمَا لَكُم مِّن دُونِ ٱللَّهِ مِن وَلِىٍّ وَلَا نَصِيرٍ
    arabicPlain: وما أنتم بمعجزين في الأرض ۖ وما لكم من دون الله من ولي ولا نصير
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 422
    page: 486
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:32'
    scripture: quran
    name: Quran 42:32
    chapter: 42
    verse: 32
    ordinal: 4304
    text: And of His portents are the ships, like banners on the sea;
    translation: Pickthall
    original: وَمِنْ ءَايَـٰتِهِ ٱلْجَوَارِ فِى ٱلْبَحْرِ كَٱلْأَعْلَـٰمِ
    arabicPlain: ومن آياته الجوار في البحر كالأعلام
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 422
    page: 487
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '42:33'
    scripture: quran
    name: Quran 42:33
    chapter: 42
    verse: 33
    ordinal: 4305
    text: If He will He calmeth the wind so that they keep still upon its surface - Lo! herein verily are signs for every steadfast grateful (heart). -
    translation: Pickthall
    original: إِن يَشَأْ يُسْكِنِ ٱلرِّيحَ فَيَظْلَلْنَ رَوَاكِدَ عَلَىٰ ظَهْرِهِۦٓ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍ لِّكُلِّ صَبَّارٍ شَكُورٍ
    arabicPlain: إن يشأ يسكن الريح فيظللن رواكد على ظهره ۚ إن في ذلك لآيات لكل صبار شكور
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 422
    page: 487
  relations:
  - predicate: IN
