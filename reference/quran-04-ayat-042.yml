- type: Ayah
  data:
    ref: '42:10'
    scripture: quran
    name: Quran 42:10
    chapter: 42
    verse: 10
    ordinal: 4282
    text: And in whatsoever ye differ, the verdict therein belongeth to Allah. Such is my Lord, in Whom I put my trust, and unto Whom I turn.
    translation: Pickthall
    original: وَمَا ٱخْتَلَفْتُمْ فِيهِ مِن شَىْءٍ فَحُكْمُهُۥٓ إِلَى ٱللَّهِ ۚ ذَٰلِكُمُ ٱللَّهُ رَبِّى عَلَيْهِ تَوَكَّلْتُ وَإِلَيْهِ أُنِيبُ
    arabicPlain: وما اختلفتم فيه من شيء فحكمه إلى الله ۚ ذلكم الله ربي عليه توكلت وإليه أنيب
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 420
