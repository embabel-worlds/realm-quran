  data:
    ref: '42:37'
    scripture: quran
    name: Quran 42:37
    chapter: 42
    verse: 37
    ordinal: 4309
    text: And those who shun the worst of sins and indecencies and, when they are wroth, forgive,
    translation: Pickthall
    original: وَٱلَّذِينَ يَجْتَنِبُونَ كَبَـٰٓئِرَ ٱلْإِثْمِ وَٱلْفَوَٰحِشَ وَإِذَا مَا غَضِبُوا۟ هُمْ يَغْفِرُونَ
    arabicPlain: والذين يجتنبون كبائر الإثم والفواحش وإذا ما غضبوا هم يغفرون
    surahName: Ash-Shura
    juz: 25
