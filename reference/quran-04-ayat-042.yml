  data:
    ref: '42:22'
    scripture: quran
    name: Quran 42:22
    chapter: 42
    verse: 22
    ordinal: 4294
    text: Thou seest the wrong-doers fearful of that which they have earned, and it will surely befall them, while those who believe and do good works (will be) in flowering meadows of the Gardens, having what they wish from their Lord. This is the great preferment.
    translation: Pickthall
    original: تَرَى ٱلظَّـٰلِمِينَ مُشْفِقِينَ مِمَّا كَسَبُوا۟ وَهُوَ وَاقِعٌۢ بِهِمْ ۗ وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ فِى رَوْضَاتِ ٱلْجَنَّاتِ ۖ لَهُم مَّا يَشَآءُونَ عِندَ رَبِّهِمْ ۚ ذَٰلِكَ هُوَ ٱلْفَضْلُ ٱلْكَبِيرُ
    arabicPlain: ترى الظالمين مشفقين مما كسبوا وهو واقع بهم ۗ والذين آمنوا وعملوا الصالحات في روضات الجنات ۖ لهم ما يشاءون عند ربهم ۚ ذلك هو الفضل الكبير
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 421
    page: 485
  relations:
  - predicate: IN
    to:
