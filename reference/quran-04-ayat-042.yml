- type: Ayah
  data:
    ref: '42:12'
    scripture: quran
    name: Quran 42:12
    chapter: 42
    verse: 12
    ordinal: 4284
    text: His are the keys of the heavens and the earth. He enlargeth providence for whom He will and straiteneth (it for whom He will). Lo! He is Knower of all things.
    translation: Pickthall
    original: لَهُۥ مَقَالِيدُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۖ يَبْسُطُ ٱلرِّزْقَ لِمَن يَشَآءُ وَيَقْدِرُ ۚ إِنَّهُۥ بِكُلِّ شَىْءٍ عَلِيمٌ
    arabicPlain: له مقاليد السماوات والأرض ۖ يبسط الرزق لمن يشاء ويقدر ۚ إنه بكل شيء عليم
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 420
    page: 484
