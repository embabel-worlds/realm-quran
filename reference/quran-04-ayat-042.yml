- type: Ayah
  data:
    ref: '42:7'
    scripture: quran
    name: Quran 42:7
    chapter: 42
    verse: 7
    ordinal: 4279
    text: And thus We have inspired in thee a Lecture in Arabic, that thou mayst warn the mother-town and those around it, and mayst warn of a day of assembling whereof there is no doubt. A host will be in the Garden, and a host of them in the Flame.
    translation: Pickthall
    original: وَكَذَٰلِكَ أَوْحَيْنَآ إِلَيْكَ قُرْءَانًا عَرَبِيًّا لِّتُنذِرَ أُمَّ ٱلْقُرَىٰ وَمَنْ حَوْلَهَا وَتُنذِرَ يَوْمَ ٱلْجَمْعِ لَا رَيْبَ فِيهِ ۚ فَرِيقٌ فِى ٱلْجَنَّةِ وَفَرِيقٌ فِى ٱلسَّعِيرِ
    arabicPlain: وكذلك أوحينا إليك قرآنا عربيا لتنذر أم القرى ومن حولها وتنذر يوم الجمع لا ريب فيه ۚ فريق في الجنة وفريق في السعير
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 419
    page: 483
