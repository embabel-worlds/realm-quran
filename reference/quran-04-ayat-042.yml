  data:
    ref: '42:41'
    scripture: quran
    name: Quran 42:41
    chapter: 42
    verse: 41
    ordinal: 4313
    text: And whoso defendeth himself after he hath suffered wrong - for such, there is no way (of blame) against them.
    translation: Pickthall
    original: وَلَمَنِ ٱنتَصَرَ بَعْدَ ظُلْمِهِۦ فَأُو۟لَـٰٓئِكَ مَا عَلَيْهِم مِّن سَبِيلٍ
    arabicPlain: ولمن انتصر بعد ظلمه فأولئك ما عليهم من سبيل
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 422
    page: 487
  relations:
