  data:
    ref: '42:42'
    scripture: quran
    name: Quran 42:42
    chapter: 42
    verse: 42
    ordinal: 4314
    text: The way (of blame) is only against those who oppress mankind, and wrongfully rebel in the earth. For such there is a painful doom.
    translation: Pickthall
    original: إِنَّمَا ٱلسَّبِيلُ عَلَى ٱلَّذِينَ يَظْلِمُونَ ٱلنَّاسَ وَيَبْغُونَ فِى ٱلْأَرْضِ بِغَيْرِ ٱلْحَقِّ ۚ أُو۟لَـٰٓئِكَ لَهُمْ عَذَابٌ أَلِيمٌ
    arabicPlain: إنما السبيل على الذين يظلمون الناس ويبغون في الأرض بغير الحق ۚ أولئك لهم عذاب أليم
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 422
    page: 487
