  data:
    ref: '42:44'
    scripture: quran
    name: Quran 42:44
    chapter: 42
    verse: 44
    ordinal: 4316
    text: 'He whom Allah sendeth astray, for him there is no protecting friend after Him. And thou (Muhammad) wilt see the evil-doers when they see the doom, (how) they say: Is there any way of return?'
    translation: Pickthall
    original: وَمَن يُضْلِلِ ٱللَّهُ فَمَا لَهُۥ مِن وَلِىٍّ مِّنۢ بَعْدِهِۦ ۗ وَتَرَى ٱلظَّـٰلِمِينَ لَمَّا رَأَوُا۟ ٱلْعَذَابَ يَقُولُونَ هَلْ إِلَىٰ مَرَدٍّ مِّن سَبِيلٍ
    arabicPlain: ومن يضلل الله فما له من ولي من بعده ۗ وترى الظالمين لما رأوا العذاب يقولون هل إلى مرد من سبيل
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 423
    page: 487
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '42'
  - predicate: IN_PORTION
    to:
      type: Juz
