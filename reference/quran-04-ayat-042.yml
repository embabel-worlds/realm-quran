- type: Ayah
  data:
    ref: '42:8'
    scripture: quran
    name: Quran 42:8
    chapter: 42
    verse: 8
    ordinal: 4280
    text: Had Allah willed, He could have made them one community, but Allah bringeth whom He will into His mercy. And the wrong-doers have no friend nor helper.
    translation: Pickthall
    original: وَلَوْ شَآءَ ٱللَّهُ لَجَعَلَهُمْ أُمَّةً وَٰحِدَةً وَلَـٰكِن يُدْخِلُ مَن يَشَآءُ فِى رَحْمَتِهِۦ ۚ وَٱلظَّـٰلِمُونَ مَا لَهُم مِّن وَلِىٍّ وَلَا نَصِيرٍ
    arabicPlain: ولو شاء الله لجعلهم أمة واحدة ولكن يدخل من يشاء في رحمته ۚ والظالمون ما لهم من ولي ولا نصير
    surahName: Ash-Shura
    juz: 25
    manzil: 6
    ruku: 419
    page: 483
