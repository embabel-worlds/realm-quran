    name: Quran 42:35
    chapter: 42
    verse: 35
    ordinal: 4307
    text: And that those who argue concerning Our revelations may know they have no refuge.
    translation: Pickthall
    original: وَيَعْلَمَ ٱلَّذِينَ يُجَـٰدِلُونَ فِىٓ ءَايَـٰتِنَا مَا لَهُم مِّن مَّحِيصٍ
