  data:
    ref: '46:22'
    scripture: quran
    name: Quran 46:22
    chapter: 46
    verse: 22
    ordinal: 4532
    text: 'They said: Hast come to turn us away from our gods? Then bring upon us that wherewith thou threatenest us, if thou art of the truthful.'
    translation: Pickthall
    original: قَالُوٓا۟ أَجِئْتَنَا لِتَأْفِكَنَا عَنْ ءَالِهَتِنَا فَأْتِنَا بِمَا تَعِدُنَآ إِن كُنتَ مِنَ ٱلصَّـٰدِقِينَ
    arabicPlain: قالوا أجئتنا لتأفكنا عن آلهتنا فأتنا بما تعدنا إن كنت من الصادقين
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 440
    page: 505
