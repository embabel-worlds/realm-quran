- type: Ayah
  data:
    ref: '46:9'
    scripture: quran
    name: Quran 46:9
    chapter: 46
    verse: 9
    ordinal: 4519
    text: 'Say: I am no new thing among the messengers (of Allah), nor know I what will be done with me or with you. I do but follow that which is inspired in me, and I am but a plain warner.'
    translation: Pickthall
    original: قُلْ مَا كُنتُ بِدْعًا مِّنَ ٱلرُّسُلِ وَمَآ أَدْرِى مَا يُفْعَلُ بِى وَلَا بِكُمْ ۖ إِنْ أَتَّبِعُ إِلَّا مَا يُوحَىٰٓ إِلَىَّ وَمَآ أَنَا۠ إِلَّا نَذِيرٌ مُّبِينٌ
    arabicPlain: قل ما كنت بدعا من الرسل وما أدري ما يفعل بي ولا بكم ۖ إن أتبع إلا ما يوحى إلي وما أنا إلا نذير مبين
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 438
    page: 503
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '46'
  - predicate: IN_PORTION
