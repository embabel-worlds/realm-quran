  data:
    ref: '46:34'
    scripture: quran
    name: Quran 46:34
    chapter: 46
    verse: 34
    ordinal: 4544
    text: 'And on the day when those who disbelieve are exposed to the Fire (they will be asked): Is not this real? They will say: Yea, by our Lord. He will say: Then taste the doom for that ye disbelieved.'
    translation: Pickthall
    original: وَيَوْمَ يُعْرَضُ ٱلَّذِينَ كَفَرُوا۟ عَلَى ٱلنَّارِ أَلَيْسَ هَـٰذَا بِٱلْحَقِّ ۖ قَالُوا۟ بَلَىٰ وَرَبِّنَا ۚ قَالَ فَذُوقُوا۟ ٱلْعَذَابَ بِمَا كُنتُمْ تَكْفُرُونَ
    arabicPlain: ويوم يعرض الذين كفروا على النار أليس هذا بالحق ۖ قالوا بلى وربنا ۚ قال فذوقوا العذاب بما كنتم تكفرون
