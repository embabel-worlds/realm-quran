  data:
    ref: '46:27'
    scripture: quran
    name: Quran 46:27
    chapter: 46
    verse: 27
    ordinal: 4537
    text: And verily We have destroyed townships round about you, and displayed (for them) Our revelation, that haply they might return.
    translation: Pickthall
    original: وَلَقَدْ أَهْلَكْنَا مَا حَوْلَكُم مِّنَ ٱلْقُرَىٰ وَصَرَّفْنَا ٱلْـَٔايَـٰتِ لَعَلَّهُمْ يَرْجِعُونَ
    arabicPlain: ولقد أهلكنا ما حولكم من القرى وصرفنا الآيات لعلهم يرجعون
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 441
    page: 505
  relations:
