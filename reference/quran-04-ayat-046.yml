- type: Ayah
  data:
    ref: '46:8'
    scripture: quran
    name: Quran 46:8
    chapter: 46
    verse: 8
    ordinal: 4518
    text: 'Or say they: He hath invented it? Say (O Muhammad): If I have invented it, still ye have no power to support me against Allah. He is Best Aware of what ye say among yourselves concerning it. He sufficeth for a witness between me and you. And He is the Forgiving, the Merciful.'
    translation: Pickthall
    original: أَمْ يَقُولُونَ ٱفْتَرَىٰهُ ۖ قُلْ إِنِ ٱفْتَرَيْتُهُۥ فَلَا تَمْلِكُونَ لِى مِنَ ٱللَّهِ شَيْـًٔا ۖ هُوَ أَعْلَمُ بِمَا تُفِيضُونَ فِيهِ ۖ كَفَىٰ بِهِۦ شَهِيدًۢا بَيْنِى وَبَيْنَكُمْ ۖ وَهُوَ ٱلْغَفُورُ ٱلرَّحِيمُ
    arabicPlain: أم يقولون افتراه ۖ قل إن افتريته فلا تملكون لي من الله شيئا ۖ هو أعلم بما تفيضون فيه ۖ كفى به شهيدا بيني وبينكم ۖ وهو الغفور الرحيم
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 438
    page: 503
