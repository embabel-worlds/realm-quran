  data:
    ref: '46:12'
    scripture: quran
    name: Quran 46:12
    chapter: 46
    verse: 12
    ordinal: 4522
    text: When before it there was the Scripture of Moses, an example and a mercy; and this is a confirming Scripture in the Arabic language, that it may warn those who do wrong and bring good tidings for the righteous.
    translation: Pickthall
    original: وَمِن قَبْلِهِۦ كِتَـٰبُ مُوسَىٰٓ إِمَامًا وَرَحْمَةً ۚ وَهَـٰذَا كِتَـٰبٌ مُّصَدِّقٌ لِّسَانًا عَرَبِيًّا لِّيُنذِرَ ٱلَّذِينَ ظَلَمُوا۟ وَبُشْرَىٰ لِلْمُحْسِنِينَ
    arabicPlain: ومن قبله كتاب موسى إماما ورحمة ۚ وهذا كتاب مصدق لسانا عربيا لينذر الذين ظلموا وبشرى للمحسنين
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 439
    page: 503
