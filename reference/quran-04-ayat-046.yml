- type: Ayah
  data:
    ref: '46:4'
    scripture: quran
    name: Quran 46:4
    chapter: 46
    verse: 4
    ordinal: 4514
    text: 'Say (unto them, O Muhammad): Have ye thought on all that ye invoke beside Allah? Show me what they have created of the earth. Or have they any portion in the heavens? Bring me a scripture before this (Scripture), or some vestige of knowledge (in support of what ye say), if ye are truthful.'
    translation: Pickthall
    original: قُلْ أَرَءَيْتُم مَّا تَدْعُونَ مِن دُونِ ٱللَّهِ أَرُونِى مَاذَا خَلَقُوا۟ مِنَ ٱلْأَرْضِ أَمْ لَهُمْ شِرْكٌ فِى ٱلسَّمَـٰوَٰتِ ۖ ٱئْتُونِى بِكِتَـٰبٍ مِّن قَبْلِ هَـٰذَآ أَوْ أَثَـٰرَةٍ مِّنْ عِلْمٍ إِن كُنتُمْ صَـٰدِقِينَ
    arabicPlain: قل أرأيتم ما تدعون من دون الله أروني ماذا خلقوا من الأرض أم لهم شرك في السماوات ۖ ائتوني بكتاب من قبل هذا أو أثارة من علم إن كنتم صادقين
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 438
    page: 502
  relations:
