- type: Ayah
  data:
    ref: '46:14'
    scripture: quran
    name: Quran 46:14
    chapter: 46
    verse: 14
    ordinal: 4524
    text: Such are rightful owners of the Garden, immortal therein, as a reward for what they used to do.
    translation: Pickthall
    original: أُو۟لَـٰٓئِكَ أَصْحَـٰبُ ٱلْجَنَّةِ خَـٰلِدِينَ فِيهَا جَزَآءًۢ بِمَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: أولئك أصحاب الجنة خالدين فيها جزاء بما كانوا يعملون
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 439
    page: 503
