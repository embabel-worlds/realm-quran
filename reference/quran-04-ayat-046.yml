- type: Ayah
  data:
    ref: '46:10'
    scripture: quran
    name: Quran 46:10
    chapter: 46
    verse: 10
    ordinal: 4520
    text: 'Bethink you: If it is from Allah and ye disbelieve therein, and a witness of the Children of Israel hath already testified to the like thereof and hath believed, and ye are too proud (what plight is yours)? Lo! Allah guideth not wrong-doing folk.'
    translation: Pickthall
    original: قُلْ أَرَءَيْتُمْ إِن كَانَ مِنْ عِندِ ٱللَّهِ وَكَفَرْتُم بِهِۦ وَشَهِدَ شَاهِدٌ مِّنۢ بَنِىٓ إِسْرَٰٓءِيلَ عَلَىٰ مِثْلِهِۦ فَـَٔامَنَ وَٱسْتَكْبَرْتُمْ ۖ إِنَّ ٱللَّهَ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّـٰلِمِينَ
    arabicPlain: قل أرأيتم إن كان من عند الله وكفرتم به وشهد شاهد من بني إسرائيل على مثله فآمن واستكبرتم ۖ إن الله لا يهدي القوم الظالمين
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 438
    page: 503
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '46'
  - predicate: IN_PORTION
