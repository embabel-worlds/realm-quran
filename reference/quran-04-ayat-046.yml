  data:
    ref: '46:28'
    scripture: quran
    name: Quran 46:28
    chapter: 46
    verse: 28
    ordinal: 4538
    text: Then why did those whom they had chosen for gods as a way of approach (unto Allah) not help them? Nay, but they did fail them utterly. And (all) that was their lie, and what they used to invent.
    translation: Pickthall
    original: فَلَوْلَا نَصَرَهُمُ ٱلَّذِينَ ٱتَّخَذُوا۟ مِن دُونِ ٱللَّهِ قُرْبَانًا ءَالِهَةًۢ ۖ بَلْ ضَلُّوا۟ عَنْهُمْ ۚ وَذَٰلِكَ إِفْكُهُمْ وَمَا كَانُوا۟ يَفْتَرُونَ
    arabicPlain: فلولا نصرهم الذين اتخذوا من دون الله قربانا آلهة ۖ بل ضلوا عنهم ۚ وذلك إفكهم وما كانوا يفترون
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 441
    page: 505
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '46'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-26
- type: Ayah
  data:
    ref: '46:29'
    scripture: quran
    name: Quran 46:29
    chapter: 46
    verse: 29
    ordinal: 4539
    text: 'And when We inclined toward thee (Muhammad) certain of the jinn, who wished to hear the Qur''an and, when they were in its presence, said: Give ear! and, when it was finished, turned back to their people, warning.'
    translation: Pickthall
    original: وَإِذْ صَرَفْنَآ إِلَيْكَ نَفَرًا مِّنَ ٱلْجِنِّ يَسْتَمِعُونَ ٱلْقُرْءَانَ فَلَمَّا حَضَرُوهُ قَالُوٓا۟ أَنصِتُوا۟ ۖ فَلَمَّا قُضِىَ وَلَّوْا۟ إِلَىٰ قَوْمِهِم مُّنذِرِينَ
    arabicPlain: وإذ صرفنا إليك نفرا من الجن يستمعون القرآن فلما حضروه قالوا أنصتوا ۖ فلما قضي ولوا إلى قومهم منذرين
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 441
    page: 506
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '46'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-26
- type: Ayah
  data:
    ref: '46:30'
    scripture: quran
    name: Quran 46:30
    chapter: 46
    verse: 30
    ordinal: 4540
    text: 'They said: O our people! Lo! we have heard a scripture which hath been revealed after Moses, confirming that which was before it, guiding unto the truth and a right road.'
    translation: Pickthall
    original: قَالُوا۟ يَـٰقَوْمَنَآ إِنَّا سَمِعْنَا كِتَـٰبًا أُنزِلَ مِنۢ بَعْدِ مُوسَىٰ مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ يَهْدِىٓ إِلَى ٱلْحَقِّ وَإِلَىٰ طَرِيقٍ مُّسْتَقِيمٍ
    arabicPlain: قالوا يا قومنا إنا سمعنا كتابا أنزل من بعد موسى مصدقا لما بين يديه يهدي إلى الحق وإلى طريق مستقيم
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 441
    page: 506
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '46'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-26
- type: Ayah
  data:
    ref: '46:31'
    scripture: quran
    name: Quran 46:31
    chapter: 46
    verse: 31
    ordinal: 4541
    text: O our people! respond to Allah's summoner and believe in Him. He will forgive you some of your sins and guard you from a painful doom.
    translation: Pickthall
    original: يَـٰقَوْمَنَآ أَجِيبُوا۟ دَاعِىَ ٱللَّهِ وَءَامِنُوا۟ بِهِۦ يَغْفِرْ لَكُم مِّن ذُنُوبِكُمْ وَيُجِرْكُم مِّنْ عَذَابٍ أَلِيمٍ
    arabicPlain: يا قومنا أجيبوا داعي الله وآمنوا به يغفر لكم من ذنوبكم ويجركم من عذاب أليم
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 441
    page: 506
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '46'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-26
- type: Ayah
  data:
    ref: '46:32'
    scripture: quran
    name: Quran 46:32
    chapter: 46
    verse: 32
    ordinal: 4542
    text: And whoso respondeth not to Allah's summoner he can nowise escape in the earth, and he hath no protecting friends instead of Him. Such are in error manifest.
    translation: Pickthall
    original: وَمَن لَّا يُجِبْ دَاعِىَ ٱللَّهِ فَلَيْسَ بِمُعْجِزٍ فِى ٱلْأَرْضِ وَلَيْسَ لَهُۥ مِن دُونِهِۦٓ أَوْلِيَآءُ ۚ أُو۟لَـٰٓئِكَ فِى ضَلَـٰلٍ مُّبِينٍ
    arabicPlain: ومن لا يجب داعي الله فليس بمعجز في الأرض وليس له من دونه أولياء ۚ أولئك في ضلال مبين
