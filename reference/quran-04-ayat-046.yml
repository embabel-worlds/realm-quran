  data:
    ref: '46:19'
    scripture: quran
    name: Quran 46:19
    chapter: 46
    verse: 19
    ordinal: 4529
    text: And for all there will be ranks from what they do, that He may pay them for their deeds; and they will not be wronged.
    translation: Pickthall
    original: وَلِكُلٍّ دَرَجَـٰتٌ مِّمَّا عَمِلُوا۟ ۖ وَلِيُوَفِّيَهُمْ أَعْمَـٰلَهُمْ وَهُمْ لَا يُظْلَمُونَ
    arabicPlain: ولكل درجات مما عملوا ۖ وليوفيهم أعمالهم وهم لا يظلمون
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 439
