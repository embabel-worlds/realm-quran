- type: Ayah
  data:
    ref: '46:13'
    scripture: quran
    name: Quran 46:13
    chapter: 46
    verse: 13
    ordinal: 4523
    text: 'Lo! those who say: Our Lord is Allah, and thereafter walk aright, there shall no fear come upon them neither shall they grieve.'
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ قَالُوا۟ رَبُّنَا ٱللَّهُ ثُمَّ ٱسْتَقَـٰمُوا۟ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
    arabicPlain: إن الذين قالوا ربنا الله ثم استقاموا فلا خوف عليهم ولا هم يحزنون
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
