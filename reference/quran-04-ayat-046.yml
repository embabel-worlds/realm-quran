- type: Ayah
  data:
    ref: '46:11'
    scripture: quran
    name: Quran 46:11
    chapter: 46
    verse: 11
    ordinal: 4521
    text: 'And those who disbelieve say of those who believe: If it had been (any) good, they would not have been before us in attaining it. And since they will not be guided by it, they say: This is an ancient lie;'
    translation: Pickthall
    original: وَقَالَ ٱلَّذِينَ كَفَرُوا۟ لِلَّذِينَ ءَامَنُوا۟ لَوْ كَانَ خَيْرًا مَّا سَبَقُونَآ إِلَيْهِ ۚ وَإِذْ لَمْ يَهْتَدُوا۟ بِهِۦ فَسَيَقُولُونَ هَـٰذَآ إِفْكٌ قَدِيمٌ
    arabicPlain: وقال الذين كفروا للذين آمنوا لو كان خيرا ما سبقونا إليه ۚ وإذ لم يهتدوا به فسيقولون هذا إفك قديم
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 439
    page: 503
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '46'
  - predicate: IN_PORTION
