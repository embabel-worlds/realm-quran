- type: Ayah
  data:
    ref: '46:5'
    scripture: quran
    name: Quran 46:5
    chapter: 46
    verse: 5
    ordinal: 4515
    text: And who is further astray than those who, instead of Allah, pray unto such as hear not their prayer until the Day of Resurrection, and are unconscious of their prayer,
    translation: Pickthall
    original: وَمَنْ أَضَلُّ مِمَّن يَدْعُوا۟ مِن دُونِ ٱللَّهِ مَن لَّا يَسْتَجِيبُ لَهُۥٓ إِلَىٰ يَوْمِ ٱلْقِيَـٰمَةِ وَهُمْ عَن دُعَآئِهِمْ غَـٰفِلُونَ
    arabicPlain: ومن أضل ممن يدعو من دون الله من لا يستجيب له إلى يوم القيامة وهم عن دعائهم غافلون
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 438
