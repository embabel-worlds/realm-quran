- type: Ayah
  data:
    ref: '46:7'
    scripture: quran
    name: Quran 46:7
    chapter: 46
    verse: 7
    ordinal: 4517
    text: 'And when Our clear revelations are recited unto them, those who disbelieve say of the Truth when it reacheth them: This is mere magic.'
    translation: Pickthall
    original: وَإِذَا تُتْلَىٰ عَلَيْهِمْ ءَايَـٰتُنَا بَيِّنَـٰتٍ قَالَ ٱلَّذِينَ كَفَرُوا۟ لِلْحَقِّ لَمَّا جَآءَهُمْ هَـٰذَا سِحْرٌ مُّبِينٌ
    arabicPlain: وإذا تتلى عليهم آياتنا بينات قال الذين كفروا للحق لما جاءهم هذا سحر مبين
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 438
