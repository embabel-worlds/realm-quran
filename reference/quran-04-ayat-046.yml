  data:
    ref: '46:23'
    scripture: quran
    name: Quran 46:23
    chapter: 46
    verse: 23
    ordinal: 4533
    text: 'He said: The knowledge is with Allah only. I convey unto you that wherewith I have been sent, but I see you are a folk that know not.'
    translation: Pickthall
    original: قَالَ إِنَّمَا ٱلْعِلْمُ عِندَ ٱللَّهِ وَأُبَلِّغُكُم مَّآ أُرْسِلْتُ بِهِۦ وَلَـٰكِنِّىٓ أَرَىٰكُمْ قَوْمًا تَجْهَلُونَ
    arabicPlain: قال إنما العلم عند الله وأبلغكم ما أرسلت به ولكني أراكم قوما تجهلون
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 440
    page: 505
