- type: Ayah
  data:
    ref: '46:6'
    scripture: quran
    name: Quran 46:6
    chapter: 46
    verse: 6
    ordinal: 4516
    text: And when mankind are gathered (to the Judgment) will become enemies for them, and will become deniers of having been worshipped.
    translation: Pickthall
    original: وَإِذَا حُشِرَ ٱلنَّاسُ كَانُوا۟ لَهُمْ أَعْدَآءً وَكَانُوا۟ بِعِبَادَتِهِمْ كَـٰفِرِينَ
    arabicPlain: وإذا حشر الناس كانوا لهم أعداء وكانوا بعبادتهم كافرين
    surahName: Al-Ahqaf
    juz: 26
    manzil: 6
    ruku: 438
