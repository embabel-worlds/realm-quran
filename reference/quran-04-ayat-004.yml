    scripture: quran
    name: Quran 4:164
    chapter: 4
    verse: 164
    ordinal: 657
    text: And messengers We have mentioned unto thee before and messengers We have not mentioned unto thee; and Allah spake directly unto Moses;
    translation: Pickthall
    original: وَرُسُلًا قَدْ قَصَصْنَـٰهُمْ عَلَيْكَ مِن قَبْلُ وَرُسُلًا لَّمْ نَقْصُصْهُمْ عَلَيْكَ ۚ وَكَلَّمَ ٱللَّهُ مُوسَىٰ تَكْلِيمًا
    arabicPlain: ورسلا قد قصصناهم عليك من قبل ورسلا لم نقصصهم عليك ۚ وكلم الله موسى تكليما
