  data:
    ref: '4:54'
    scripture: quran
    name: Quran 4:54
    chapter: 4
    verse: 54
    ordinal: 547
    text: Or are they jealous of mankind because of that which Allah of His bounty hath bestowed upon them? For We bestowed upon the house of Abraham (of old) the Scripture and wisdom, and We bestowed on them a mighty kingdom.
    translation: Pickthall
    original: أَمْ يَحْسُدُونَ ٱلنَّاسَ عَلَىٰ مَآ ءَاتَىٰهُمُ ٱللَّهُ مِن فَضْلِهِۦ ۖ فَقَدْ ءَاتَيْنَآ ءَالَ إِبْرَٰهِيمَ ٱلْكِتَـٰبَ وَٱلْحِكْمَةَ وَءَاتَيْنَـٰهُم مُّلْكًا عَظِيمًا
    arabicPlain: أم يحسدون الناس على ما آتاهم الله من فضله ۖ فقد آتينا آل إبراهيم الكتاب والحكمة وآتيناهم ملكا عظيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 69
