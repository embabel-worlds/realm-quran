  data:
    ref: '4:50'
    scripture: quran
    name: Quran 4:50
    chapter: 4
    verse: 50
    ordinal: 543
    text: See, how they invent lies about Allah! That of itself is flagrant sin.
    translation: Pickthall
    original: ٱنظُرْ كَيْفَ يَفْتَرُونَ عَلَى ٱللَّهِ ٱلْكَذِبَ ۖ وَكَفَىٰ بِهِۦٓ إِثْمًا مُّبِينًا
    arabicPlain: انظر كيف يفترون على الله الكذب ۖ وكفى به إثما مبينا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 68
    page: 86
  relations:
