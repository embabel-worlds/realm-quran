- type: Ayah
  data:
    ref: 4:82
    scripture: quran
    name: Quran 4:82
    chapter: 4
    verse: 82
    ordinal: 575
    text: Will they not then ponder on the Qur'an? If it had been from other than Allah they would have found therein much incongruity.
    translation: Pickthall
    original: أَفَلَا يَتَدَبَّرُونَ ٱلْقُرْءَانَ ۚ وَلَوْ كَانَ مِنْ عِندِ غَيْرِ ٱللَّهِ لَوَجَدُوا۟ فِيهِ ٱخْتِلَـٰفًا كَثِيرًا
    arabicPlain: أفلا يتدبرون القرآن ۚ ولو كان من عند غير الله لوجدوا فيه اختلافا كثيرا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 72
    page: 91
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-5
- type: Ayah
  data:
    ref: 4:83
    scripture: quran
    name: Quran 4:83
    chapter: 4
    verse: 83
    ordinal: 576
    text: And if any tidings, whether of safety or fear, come unto them, they noise it abroad, whereas if they had referred it to the messenger and to such of them as are in authority, those among them who are able to think out the matter would have known it. If it had not been for the grace of Allah upon you and His mercy ye would have followed Satan, save a few (of you).
    translation: Pickthall
    original: وَإِذَا جَآءَهُمْ أَمْرٌ مِّنَ ٱلْأَمْنِ أَوِ ٱلْخَوْفِ أَذَاعُوا۟ بِهِۦ ۖ وَلَوْ رَدُّوهُ إِلَى ٱلرَّسُولِ وَإِلَىٰٓ أُو۟لِى ٱلْأَمْرِ مِنْهُمْ لَعَلِمَهُ ٱلَّذِينَ يَسْتَنۢبِطُونَهُۥ مِنْهُمْ ۗ وَلَوْلَا فَضْلُ ٱللَّهِ عَلَيْكُمْ وَرَحْمَتُهُۥ لَٱتَّبَعْتُمُ ٱلشَّيْطَـٰنَ إِلَّا قَلِيلًا
    arabicPlain: وإذا جاءهم أمر من الأمن أو الخوف أذاعوا به ۖ ولو ردوه إلى الرسول وإلى أولي الأمر منهم لعلمه الذين يستنبطونه منهم ۗ ولولا فضل الله عليكم ورحمته لاتبعتم الشيطان إلا قليلا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 72
