  data:
    ref: '4:45'
    scripture: quran
    name: Quran 4:45
    chapter: 4
    verse: 45
    ordinal: 538
    text: Allah knoweth best (who are) your enemies. Allah is sufficient as a Guardian, and Allah is sufficient as a Supporter.
    translation: Pickthall
    original: وَٱللَّهُ أَعْلَمُ بِأَعْدَآئِكُمْ ۚ وَكَفَىٰ بِٱللَّهِ وَلِيًّا وَكَفَىٰ بِٱللَّهِ نَصِيرًا
    arabicPlain: والله أعلم بأعدائكم ۚ وكفى بالله وليا وكفى بالله نصيرا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 68
