  data:
    ref: 4:114
    scripture: quran
    name: Quran 4:114
    chapter: 4
    verse: 114
    ordinal: 607
    text: There is no good in much of their secret conferences save (in) him who enjoineth almsgiving and kindness and peace-making among the people. Whoso doeth that, seeking the good pleasure of Allah, We shall bestow on him a vast reward.
    translation: Pickthall
    original: ۞ لَّا خَيْرَ فِى كَثِيرٍ مِّن نَّجْوَىٰهُمْ إِلَّا مَنْ أَمَرَ بِصَدَقَةٍ أَوْ مَعْرُوفٍ أَوْ إِصْلَـٰحٍۭ بَيْنَ ٱلنَّاسِ ۚ وَمَن يَفْعَلْ ذَٰلِكَ ٱبْتِغَآءَ مَرْضَاتِ ٱللَّهِ فَسَوْفَ نُؤْتِيهِ أَجْرًا عَظِيمًا
    arabicPlain: ۞ لا خير في كثير من نجواهم إلا من أمر بصدقة أو معروف أو إصلاح بين الناس ۚ ومن يفعل ذلك ابتغاء مرضات الله فسوف نؤتيه أجرا عظيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 78
    page: 97
