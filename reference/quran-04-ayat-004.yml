  data:
    ref: '4:27'
    scripture: quran
    name: Quran 4:27
    chapter: 4
    verse: 27
    ordinal: 520
    text: And Allah would turn to you in mercy; but those who follow vain desires would have you go tremendously astray.
    translation: Pickthall
    original: وَٱللَّهُ يُرِيدُ أَن يَتُوبَ عَلَيْكُمْ وَيُرِيدُ ٱلَّذِينَ يَتَّبِعُونَ ٱلشَّهَوَٰتِ أَن تَمِيلُوا۟ مَيْلًا عَظِيمًا
    arabicPlain: والله يريد أن يتوب عليكم ويريد الذين يتبعون الشهوات أن تميلوا ميلا عظيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 66
