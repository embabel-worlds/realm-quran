  data:
    ref: 4:128
    scripture: quran
    name: Quran 4:128
    chapter: 4
    verse: 128
    ordinal: 621
    text: If a woman feareth ill treatment from her husband, or desertion, it is no sin for them twain if they make terms of peace between themselves. Peace is better. But greed hath been made present in the minds (of men). If ye do good and keep from evil, lo! Allah is ever Informed of what ye do.
    translation: Pickthall
    original: وَإِنِ ٱمْرَأَةٌ خَافَتْ مِنۢ بَعْلِهَا نُشُوزًا أَوْ إِعْرَاضًا فَلَا جُنَاحَ عَلَيْهِمَآ أَن يُصْلِحَا بَيْنَهُمَا صُلْحًا ۚ وَٱلصُّلْحُ خَيْرٌ ۗ وَأُحْضِرَتِ ٱلْأَنفُسُ ٱلشُّحَّ ۚ وَإِن تُحْسِنُوا۟ وَتَتَّقُوا۟ فَإِنَّ ٱللَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيرًا
    arabicPlain: وإن امرأة خافت من بعلها نشوزا أو إعراضا فلا جناح عليهما أن يصلحا بينهما صلحا ۚ والصلح خير ۗ وأحضرت الأنفس الشح ۚ وإن تحسنوا وتتقوا فإن الله كان بما تعملون خبيرا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 80
    page: 99
