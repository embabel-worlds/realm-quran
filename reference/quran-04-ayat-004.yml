  data:
    ref: 4:111
    scripture: quran
    name: Quran 4:111
    chapter: 4
    verse: 111
    ordinal: 604
    text: Whoso committeth sin committeth it only against himself. Allah is ever Knower, Wise.
    translation: Pickthall
    original: وَمَن يَكْسِبْ إِثْمًا فَإِنَّمَا يَكْسِبُهُۥ عَلَىٰ نَفْسِهِۦ ۚ وَكَانَ ٱللَّهُ عَلِيمًا حَكِيمًا
    arabicPlain: ومن يكسب إثما فإنما يكسبه على نفسه ۚ وكان الله عليما حكيما
    surahName: An-Nisaa
    juz: 5
