  data:
    ref: 4:161
    scripture: quran
    name: Quran 4:161
    chapter: 4
    verse: 161
    ordinal: 654
    text: And of their taking usury when they were forbidden it, and of their devouring people's wealth by false pretences, We have prepared for those of them who disbelieve a painful doom.
    translation: Pickthall
    original: وَأَخْذِهِمُ ٱلرِّبَوٰا۟ وَقَدْ نُهُوا۟ عَنْهُ وَأَكْلِهِمْ أَمْوَٰلَ ٱلنَّاسِ بِٱلْبَـٰطِلِ ۚ وَأَعْتَدْنَا لِلْكَـٰفِرِينَ مِنْهُمْ عَذَابًا أَلِيمًا
    arabicPlain: وأخذهم الربا وقد نهوا عنه وأكلهم أموال الناس بالباطل ۚ وأعتدنا للكافرين منهم عذابا أليما
