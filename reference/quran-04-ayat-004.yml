  data:
    ref: '4:56'
    scripture: quran
    name: Quran 4:56
    chapter: 4
    verse: 56
    ordinal: 549
    text: Lo! Those who disbelieve Our revelations, We shall expose them to the Fire. As often as their skins are consumed We shall exchange them for fresh skins that they may taste the torment. Lo! Allah is ever Mighty, Wise.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ كَفَرُوا۟ بِـَٔايَـٰتِنَا سَوْفَ نُصْلِيهِمْ نَارًا كُلَّمَا نَضِجَتْ جُلُودُهُم بَدَّلْنَـٰهُمْ جُلُودًا غَيْرَهَا لِيَذُوقُوا۟ ٱلْعَذَابَ ۗ إِنَّ ٱللَّهَ كَانَ عَزِيزًا حَكِيمًا
    arabicPlain: إن الذين كفروا بآياتنا سوف نصليهم نارا كلما نضجت جلودهم بدلناهم جلودا غيرها ليذوقوا العذاب ۗ إن الله كان عزيزا حكيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 69
    page: 87
