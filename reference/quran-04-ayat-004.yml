  data:
    ref: 4:172
    scripture: quran
    name: Quran 4:172
    chapter: 4
    verse: 172
    ordinal: 665
    text: The Messiah will never scorn to be a slave unto Allah, nor will the favoured angels. Whoso scorneth His service and is proud, all such will He assemble unto Him;
    translation: Pickthall
    original: لَّن يَسْتَنكِفَ ٱلْمَسِيحُ أَن يَكُونَ عَبْدًا لِّلَّهِ وَلَا ٱلْمَلَـٰٓئِكَةُ ٱلْمُقَرَّبُونَ ۚ وَمَن يَسْتَنكِفْ عَنْ عِبَادَتِهِۦ وَيَسْتَكْبِرْ فَسَيَحْشُرُهُمْ إِلَيْهِ جَمِيعًا
    arabicPlain: لن يستنكف المسيح أن يكون عبدا لله ولا الملائكة المقربون ۚ ومن يستنكف عن عبادته ويستكبر فسيحشرهم إليه جميعا
