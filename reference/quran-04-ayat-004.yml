  data:
    ref: '4:53'
    scripture: quran
    name: Quran 4:53
    chapter: 4
    verse: 53
    ordinal: 546
    text: Or have they even a share in the Sovereignty? Then in that case, they would not give mankind even the speck on a date-stone.
    translation: Pickthall
    original: أَمْ لَهُمْ نَصِيبٌ مِّنَ ٱلْمُلْكِ فَإِذًا لَّا يُؤْتُونَ ٱلنَّاسَ نَقِيرًا
    arabicPlain: أم لهم نصيب من الملك فإذا لا يؤتون الناس نقيرا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 69
    page: 87
