  data:
    ref: 4:165
    scripture: quran
    name: Quran 4:165
    chapter: 4
    verse: 165
    ordinal: 658
    text: Messengers of good cheer and of warning, in order that mankind might have no argument against Allah after the messengers. Allah was ever Mighty, Wise.
    translation: Pickthall
    original: رُّسُلًا مُّبَشِّرِينَ وَمُنذِرِينَ لِئَلَّا يَكُونَ لِلنَّاسِ عَلَى ٱللَّهِ حُجَّةٌۢ بَعْدَ ٱلرُّسُلِ ۚ وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًا
    arabicPlain: رسلا مبشرين ومنذرين لئلا يكون للناس على الله حجة بعد الرسل ۚ وكان الله عزيزا حكيما
