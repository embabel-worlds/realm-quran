  data:
    ref: '4:28'
    scripture: quran
    name: Quran 4:28
    chapter: 4
    verse: 28
    ordinal: 521
    text: Allah would make the burden light for you, for man was created weak.
    translation: Pickthall
    original: يُرِيدُ ٱللَّهُ أَن يُخَفِّفَ عَنكُمْ ۚ وَخُلِقَ ٱلْإِنسَـٰنُ ضَعِيفًا
    arabicPlain: يريد الله أن يخفف عنكم ۚ وخلق الإنسان ضعيفا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 66
