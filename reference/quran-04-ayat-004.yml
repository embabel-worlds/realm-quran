  data:
    ref: '4:41'
    scripture: quran
    name: Quran 4:41
    chapter: 4
    verse: 41
    ordinal: 534
    text: But how (will it be with them) when We bring of every people a witness, and We bring thee (O Muhammad) a witness against these?
    translation: Pickthall
    original: فَكَيْفَ إِذَا جِئْنَا مِن كُلِّ أُمَّةٍۭ بِشَهِيدٍ وَجِئْنَا بِكَ عَلَىٰ هَـٰٓؤُلَآءِ شَهِيدًا
    arabicPlain: فكيف إذا جئنا من كل أمة بشهيد وجئنا بك على هؤلاء شهيدا
    surahName: An-Nisaa
    juz: 5
