  data:
    ref: 4:79
    scripture: quran
    name: Quran 4:79
    chapter: 4
    verse: 79
    ordinal: 572
    text: Whatever of good befalleth thee (O man) it is from Allah, and whatever of ill befalleth thee it is from thyself. We have sent thee (Muhammad) as a messenger unto mankind and Allah is sufficient as Witness.
    translation: Pickthall
    original: مَّآ أَصَابَكَ مِنْ حَسَنَةٍ فَمِنَ ٱللَّهِ ۖ وَمَآ أَصَابَكَ مِن سَيِّئَةٍ فَمِن نَّفْسِكَ ۚ وَأَرْسَلْنَـٰكَ لِلنَّاسِ رَسُولًا ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًا
    arabicPlain: ما أصابك من حسنة فمن الله ۖ وما أصابك من سيئة فمن نفسك ۚ وأرسلناك للناس رسولا ۚ وكفى بالله شهيدا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 72
    page: 90
  relations:
