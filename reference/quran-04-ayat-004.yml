  data:
    ref: '4:22'
    scripture: quran
    name: Quran 4:22
    chapter: 4
    verse: 22
    ordinal: 515
    text: And marry not those women whom your fathers married, except what hath already happened (of that nature) in the past. Lo! it was ever lewdness and abomination, and an evil way.
    translation: Pickthall
    original: وَلَا تَنكِحُوا۟ مَا نَكَحَ ءَابَآؤُكُم مِّنَ ٱلنِّسَآءِ إِلَّا مَا قَدْ سَلَفَ ۚ إِنَّهُۥ كَانَ فَـٰحِشَةً وَمَقْتًا وَسَآءَ سَبِيلًا
    arabicPlain: ولا تنكحوا ما نكح آباؤكم من النساء إلا ما قد سلف ۚ إنه كان فاحشة ومقتا وساء سبيلا
    surahName: An-Nisaa
    juz: 4
    manzil: 1
    ruku: 64
    page: 81
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
  - predicate: IN_PORTION
    to:
