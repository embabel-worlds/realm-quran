  data:
    ref: 4:138
    scripture: quran
    name: Quran 4:138
    chapter: 4
    verse: 138
    ordinal: 631
    text: Bear unto the hypocrites the tidings that for them there is a painful doom;
    translation: Pickthall
    original: بَشِّرِ ٱلْمُنَـٰفِقِينَ بِأَنَّ لَهُمْ عَذَابًا أَلِيمًا
    arabicPlain: بشر المنافقين بأن لهم عذابا أليما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 81
    page: 100
  relations:
