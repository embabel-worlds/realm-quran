  data:
    ref: 4:176
    scripture: quran
    name: Quran 4:176
    chapter: 4
    verse: 176
    ordinal: 669
    text: 'They ask thee for a pronouncement. Say: Allah hath pronounced for you concerning distant kindred. If a man die childless and he have a sister, hers is half the heritage, and he would have inherited from her had she died childless. And if there be two sisters, then theirs are two-thirds of the heritage, and if they be brethren, men and women, unto the male is the equivalent of the share of two females. Allah expoundeth unto you, so that ye err not. Allah is Knower of all things.'
    translation: Pickthall
    original: يَسْتَفْتُونَكَ قُلِ ٱللَّهُ يُفْتِيكُمْ فِى ٱلْكَلَـٰلَةِ ۚ إِنِ ٱمْرُؤٌا۟ هَلَكَ لَيْسَ لَهُۥ وَلَدٌ وَلَهُۥٓ أُخْتٌ فَلَهَا نِصْفُ مَا تَرَكَ ۚ وَهُوَ يَرِثُهَآ إِن لَّمْ يَكُن لَّهَا وَلَدٌ ۚ فَإِن كَانَتَا ٱثْنَتَيْنِ فَلَهُمَا ٱلثُّلُثَانِ مِمَّا تَرَكَ ۚ وَإِن كَانُوٓا۟ إِخْوَةً رِّجَالًا وَنِسَآءً فَلِلذَّكَرِ مِثْلُ حَظِّ ٱلْأُنثَيَيْنِ ۗ يُبَيِّنُ ٱللَّهُ لَكُمْ أَن تَضِلُّوا۟ ۗ وَٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمٌۢ
    arabicPlain: يستفتونك قل الله يفتيكم في الكلالة ۚ إن امرؤ هلك ليس له ولد وله أخت فلها نصف ما ترك ۚ وهو يرثها إن لم يكن لها ولد ۚ فإن كانتا اثنتين فلهما الثلثان مما ترك ۚ وإن كانوا إخوة رجالا ونساء فللذكر مثل حظ الأنثيين ۗ يبين الله لكم أن تضلوا ۗ والله بكل شيء عليم
