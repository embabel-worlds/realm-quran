  data:
    ref: '4:42'
    scripture: quran
    name: Quran 4:42
    chapter: 4
    verse: 42
    ordinal: 535
    text: On that day those who disbelieved and disobeyed the messenger will wish that they were level with the ground, and they can hide no fact from Allah.
    translation: Pickthall
    original: يَوْمَئِذٍ يَوَدُّ ٱلَّذِينَ كَفَرُوا۟ وَعَصَوُا۟ ٱلرَّسُولَ لَوْ تُسَوَّىٰ بِهِمُ ٱلْأَرْضُ وَلَا يَكْتُمُونَ ٱللَّهَ حَدِيثًا
    arabicPlain: يومئذ يود الذين كفروا وعصوا الرسول لو تسوى بهم الأرض ولا يكتمون الله حديثا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
