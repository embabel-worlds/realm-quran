  data:
    ref: 4:121
    scripture: quran
    name: Quran 4:121
    chapter: 4
    verse: 121
    ordinal: 614
    text: For such, their habitation will be hell, and they will find no refuge therefrom.
    translation: Pickthall
    original: أُو۟لَـٰٓئِكَ مَأْوَىٰهُمْ جَهَنَّمُ وَلَا يَجِدُونَ عَنْهَا مَحِيصًا
    arabicPlain: أولئك مأواهم جهنم ولا يجدون عنها محيصا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 79
    page: 97
  relations:
