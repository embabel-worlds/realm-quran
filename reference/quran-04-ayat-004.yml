  data:
    ref: 4:86
    scripture: quran
    name: Quran 4:86
    chapter: 4
    verse: 86
    ordinal: 579
    text: When ye are greeted with a greeting, greet ye with a better than it or return it. Lo! Allah taketh count of all things.
    translation: Pickthall
    original: وَإِذَا حُيِّيتُم بِتَحِيَّةٍ فَحَيُّوا۟ بِأَحْسَنَ مِنْهَآ أَوْ رُدُّوهَآ ۗ إِنَّ ٱللَّهَ كَانَ عَلَىٰ كُلِّ شَىْءٍ حَسِيبًا
    arabicPlain: وإذا حييتم بتحية فحيوا بأحسن منها أو ردوها ۗ إن الله كان على كل شيء حسيبا
    surahName: An-Nisaa
