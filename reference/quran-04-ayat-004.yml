- type: Ayah
  data:
    ref: '4:7'
    scripture: quran
    name: Quran 4:7
    chapter: 4
    verse: 7
    ordinal: 500
    text: Unto the men (of a family) belongeth a share of that which parents and near kindred leave, and unto the women a share of that which parents and near kindred leave, whether it be little or much - a legal share.
    translation: Pickthall
    original: لِّلرِّجَالِ نَصِيبٌ مِّمَّا تَرَكَ ٱلْوَٰلِدَانِ وَٱلْأَقْرَبُونَ وَلِلنِّسَآءِ نَصِيبٌ مِّمَّا تَرَكَ ٱلْوَٰلِدَانِ وَٱلْأَقْرَبُونَ مِمَّا قَلَّ مِنْهُ أَوْ كَثُرَ ۚ نَصِيبًا مَّفْرُوضًا
    arabicPlain: للرجال نصيب مما ترك الوالدان والأقربون وللنساء نصيب مما ترك الوالدان والأقربون مما قل منه أو كثر ۚ نصيبا مفروضا
    surahName: An-Nisaa
    juz: 4
    manzil: 1
    ruku: 62
    page: 78
