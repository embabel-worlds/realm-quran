  data:
    ref: 4:120
    scripture: quran
    name: Quran 4:120
    chapter: 4
    verse: 120
    ordinal: 613
    text: He promiseth them and stirreth up desires in them, and Satan promiseth them only to beguile.
    translation: Pickthall
    original: يَعِدُهُمْ وَيُمَنِّيهِمْ ۖ وَمَا يَعِدُهُمُ ٱلشَّيْطَـٰنُ إِلَّا غُرُورًا
    arabicPlain: يعدهم ويمنيهم ۖ وما يعدهم الشيطان إلا غرورا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 79
