    name: Quran 4:167
    chapter: 4
    verse: 167
    ordinal: 660
    text: Lo! those who disbelieve and hinder (others) from the way of Allah, they verily have wandered far astray.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ كَفَرُوا۟ وَصَدُّوا۟ عَن سَبِيلِ ٱللَّهِ قَدْ ضَلُّوا۟ ضَلَـٰلًۢا بَعِيدًا
