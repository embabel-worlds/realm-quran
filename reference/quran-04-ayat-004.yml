    name: Quran 4:144
    chapter: 4
    verse: 144
    ordinal: 637
    text: O ye who believe! Choose not disbelievers for (your) friends in place of believers. Would ye give Allah a clear warrant against you?
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ ٱلْكَـٰفِرِينَ أَوْلِيَآءَ مِن دُونِ ٱلْمُؤْمِنِينَ ۚ أَتُرِيدُونَ أَن تَجْعَلُوا۟ لِلَّهِ عَلَيْكُمْ سُلْطَـٰنًا مُّبِينًا
    arabicPlain: يا أيها الذين آمنوا لا تتخذوا الكافرين أولياء من دون المؤمنين ۚ أتريدون أن تجعلوا لله عليكم سلطانا مبينا
