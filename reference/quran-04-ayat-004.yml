  data:
    ref: '4:17'
    scripture: quran
    name: Quran 4:17
    chapter: 4
    verse: 17
    ordinal: 510
    text: Forgiveness is only incumbent on Allah toward those who do evil in ignorance (and) then turn quickly (in repentance) to Allah. These are they toward whom Allah relenteth. Allah is ever Knower, Wise.
    translation: Pickthall
    original: إِنَّمَا ٱلتَّوْبَةُ عَلَى ٱللَّهِ لِلَّذِينَ يَعْمَلُونَ ٱلسُّوٓءَ بِجَهَـٰلَةٍ ثُمَّ يَتُوبُونَ مِن قَرِيبٍ فَأُو۟لَـٰٓئِكَ يَتُوبُ ٱللَّهُ عَلَيْهِمْ ۗ وَكَانَ ٱللَّهُ عَلِيمًا حَكِيمًا
    arabicPlain: إنما التوبة على الله للذين يعملون السوء بجهالة ثم يتوبون من قريب فأولئك يتوب الله عليهم ۗ وكان الله عليما حكيما
    surahName: An-Nisaa
    juz: 4
    manzil: 1
    ruku: 64
    page: 80
  relations:
