  data:
    ref: 4:87
    scripture: quran
    name: Quran 4:87
    chapter: 4
    verse: 87
    ordinal: 580
    text: Allah! There is no Allah save Him. He gathereth you all unto a Day of Resurrection whereof there is no doubt. Who is more true in statement than Allah?
    translation: Pickthall
    original: ٱللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ ۚ لَيَجْمَعَنَّكُمْ إِلَىٰ يَوْمِ ٱلْقِيَـٰمَةِ لَا رَيْبَ فِيهِ ۗ وَمَنْ أَصْدَقُ مِنَ ٱللَّهِ حَدِيثًا
    arabicPlain: الله لا إله إلا هو ۚ ليجمعنكم إلى يوم القيامة لا ريب فيه ۗ ومن أصدق من الله حديثا
