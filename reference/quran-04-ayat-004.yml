  data:
    ref: 4:124
    scripture: quran
    name: Quran 4:124
    chapter: 4
    verse: 124
    ordinal: 617
    text: And whoso doeth good works, whether of male or female, and he (or she) is a believer, such will enter paradise and they will not be wronged the dint in a date-stone.
    translation: Pickthall
    original: وَمَن يَعْمَلْ مِنَ ٱلصَّـٰلِحَـٰتِ مِن ذَكَرٍ أَوْ أُنثَىٰ وَهُوَ مُؤْمِنٌ فَأُو۟لَـٰٓئِكَ يَدْخُلُونَ ٱلْجَنَّةَ وَلَا يُظْلَمُونَ نَقِيرًا
    arabicPlain: ومن يعمل من الصالحات من ذكر أو أنثى وهو مؤمن فأولئك يدخلون الجنة ولا يظلمون نقيرا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 79
    page: 98
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-5
- type: Ayah
  data:
    ref: 4:125
    scripture: quran
    name: Quran 4:125
    chapter: 4
    verse: 125
    ordinal: 618
    text: Who is better in religion than he who surrendereth his purpose to Allah while doing good (to men) and followeth the tradition of Abraham, the upright? Allah (Himself) chose Abraham for friend.
    translation: Pickthall
    original: وَمَنْ أَحْسَنُ دِينًا مِّمَّنْ أَسْلَمَ وَجْهَهُۥ لِلَّهِ وَهُوَ مُحْسِنٌ وَٱتَّبَعَ مِلَّةَ إِبْرَٰهِيمَ حَنِيفًا ۗ وَٱتَّخَذَ ٱللَّهُ إِبْرَٰهِيمَ خَلِيلًا
    arabicPlain: ومن أحسن دينا ممن أسلم وجهه لله وهو محسن واتبع ملة إبراهيم حنيفا ۗ واتخذ الله إبراهيم خليلا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 79
    page: 98
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-5
- type: Ayah
  data:
    ref: 4:126
    scripture: quran
    name: Quran 4:126
    chapter: 4
    verse: 126
    ordinal: 619
    text: Unto Allah belongeth whatsoever is in the heavens and whatsoever is in the earth. Allah ever surroundeth all things.
    translation: Pickthall
    original: وَلِلَّهِ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۚ وَكَانَ ٱللَّهُ بِكُلِّ شَىْءٍ مُّحِيطًا
    arabicPlain: ولله ما في السماوات وما في الأرض ۚ وكان الله بكل شيء محيطا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 79
    page: 98
  relations:
