  data:
    ref: 4:139
    scripture: quran
    name: Quran 4:139
    chapter: 4
    verse: 139
    ordinal: 632
    text: Those who chose disbelievers for their friends instead of believers! Do they look for power at their hands? Lo! all power appertaineth to Allah.
    translation: Pickthall
    original: ٱلَّذِينَ يَتَّخِذُونَ ٱلْكَـٰفِرِينَ أَوْلِيَآءَ مِن دُونِ ٱلْمُؤْمِنِينَ ۚ أَيَبْتَغُونَ عِندَهُمُ ٱلْعِزَّةَ فَإِنَّ ٱلْعِزَّةَ لِلَّهِ جَمِيعًا
    arabicPlain: الذين يتخذون الكافرين أولياء من دون المؤمنين ۚ أيبتغون عندهم العزة فإن العزة لله جميعا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 81
    page: 100
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
