  data:
    ref: 4:151
    scripture: quran
    name: Quran 4:151
    chapter: 4
    verse: 151
    ordinal: 644
    text: Such are disbelievers in truth; and for disbelievers We prepare a shameful doom.
    translation: Pickthall
    original: أُو۟لَـٰٓئِكَ هُمُ ٱلْكَـٰفِرُونَ حَقًّا ۚ وَأَعْتَدْنَا لِلْكَـٰفِرِينَ عَذَابًا مُّهِينًا
    arabicPlain: أولئك هم الكافرون حقا ۚ وأعتدنا للكافرين عذابا مهينا
    surahName: An-Nisaa
    juz: 6
