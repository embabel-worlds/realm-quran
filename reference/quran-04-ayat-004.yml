  data:
    ref: 4:119
    scripture: quran
    name: Quran 4:119
    chapter: 4
    verse: 119
    ordinal: 612
    text: And surely I will lead them astray, and surely I will arouse desires in them, and surely I will command them and they will cut the cattle' ears, and surely I will command them and they will change Allah's creation. Whoso chooseth Satan for a patron instead of Allah is verily a loser and his loss is manifest.
    translation: Pickthall
    original: وَلَأُضِلَّنَّهُمْ وَلَأُمَنِّيَنَّهُمْ وَلَـَٔامُرَنَّهُمْ فَلَيُبَتِّكُنَّ ءَاذَانَ ٱلْأَنْعَـٰمِ وَلَـَٔامُرَنَّهُمْ فَلَيُغَيِّرُنَّ خَلْقَ ٱللَّهِ ۚ وَمَن يَتَّخِذِ ٱلشَّيْطَـٰنَ وَلِيًّا مِّن دُونِ ٱللَّهِ فَقَدْ خَسِرَ خُسْرَانًا مُّبِينًا
    arabicPlain: ولأضلنهم ولأمنينهم ولآمرنهم فليبتكن آذان الأنعام ولآمرنهم فليغيرن خلق الله ۚ ومن يتخذ الشيطان وليا من دون الله فقد خسر خسرانا مبينا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 79
