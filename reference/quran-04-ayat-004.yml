    scripture: quran
    name: Quran 4:143
    chapter: 4
    verse: 143
    ordinal: 636
    text: 'Swaying between this (and that), (belonging) neither to these nor to those. He whom Allah causeth to go astray, thou (O Muhammad) wilt not find a way for him:'
    translation: Pickthall
    original: مُّذَبْذَبِينَ بَيْنَ ذَٰلِكَ لَآ إِلَىٰ هَـٰٓؤُلَآءِ وَلَآ إِلَىٰ هَـٰٓؤُلَآءِ ۚ وَمَن يُضْلِلِ ٱللَّهُ فَلَن تَجِدَ لَهُۥ سَبِيلًا
    arabicPlain: مذبذبين بين ذلك لا إلى هؤلاء ولا إلى هؤلاء ۚ ومن يضلل الله فلن تجد له سبيلا
