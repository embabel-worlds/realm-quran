- type: Ayah
  data:
    ref: 4:63
    scripture: quran
    name: Quran 4:63
    chapter: 4
    verse: 63
    ordinal: 556
    text: Those are they, the secrets of whose hearts Allah knoweth. So oppose them and admonish them, and address them in plain terms about their souls.
    translation: Pickthall
    original: أُو۟لَـٰٓئِكَ ٱلَّذِينَ يَعْلَمُ ٱللَّهُ مَا فِى قُلُوبِهِمْ فَأَعْرِضْ عَنْهُمْ وَعِظْهُمْ وَقُل لَّهُمْ فِىٓ أَنفُسِهِمْ قَوْلًۢا بَلِيغًا
    arabicPlain: أولئك الذين يعلم الله ما في قلوبهم فأعرض عنهم وعظهم وقل لهم في أنفسهم قولا بليغا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 70
    page: 88
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-5
- type: Ayah
  data:
    ref: 4:64
    scripture: quran
    name: Quran 4:64
    chapter: 4
    verse: 64
    ordinal: 557
    text: We sent no messenger save that he should be obeyed by Allah's leave. And if, when they had wronged themselves, they had but come unto thee and asked forgiveness of Allah, and asked forgiveness of the messenger, they would have found Allah Forgiving, Merciful.
    translation: Pickthall
    original: وَمَآ أَرْسَلْنَا مِن رَّسُولٍ إِلَّا لِيُطَاعَ بِإِذْنِ ٱللَّهِ ۚ وَلَوْ أَنَّهُمْ إِذ ظَّلَمُوٓا۟ أَنفُسَهُمْ جَآءُوكَ فَٱسْتَغْفَرُوا۟ ٱللَّهَ وَٱسْتَغْفَرَ لَهُمُ ٱلرَّسُولُ لَوَجَدُوا۟ ٱللَّهَ تَوَّابًا رَّحِيمًا
    arabicPlain: وما أرسلنا من رسول إلا ليطاع بإذن الله ۚ ولو أنهم إذ ظلموا أنفسهم جاءوك فاستغفروا الله واستغفر لهم الرسول لوجدوا الله توابا رحيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 70
    page: 88
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-5
- type: Ayah
  data:
    ref: 4:65
    scripture: quran
    name: Quran 4:65
    chapter: 4
    verse: 65
    ordinal: 558
    text: But nay, by thy Lord, they will not believe (in truth) until they make thee judge of what is in dispute between them and find within themselves no dislike of that which thou decidest, and submit with full submission.
    translation: Pickthall
    original: فَلَا وَرَبِّكَ لَا يُؤْمِنُونَ حَتَّىٰ يُحَكِّمُوكَ فِيمَا شَجَرَ بَيْنَهُمْ ثُمَّ لَا يَجِدُوا۟ فِىٓ أَنفُسِهِمْ حَرَجًا مِّمَّا قَضَيْتَ وَيُسَلِّمُوا۟ تَسْلِيمًا
    arabicPlain: فلا وربك لا يؤمنون حتى يحكموك فيما شجر بينهم ثم لا يجدوا في أنفسهم حرجا مما قضيت ويسلموا تسليما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 70
    page: 88
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-5
- type: Ayah
  data:
    ref: 4:66
    scripture: quran
    name: Quran 4:66
    chapter: 4
    verse: 66
    ordinal: 559
    text: 'And if We had decreed for them: Lay down your lives or go forth from your dwellings, but few of them would have done it; though if they did what they are exhorted to do it would be better for them, and more strengthening;'
    translation: Pickthall
    original: وَلَوْ أَنَّا كَتَبْنَا عَلَيْهِمْ أَنِ ٱقْتُلُوٓا۟ أَنفُسَكُمْ أَوِ ٱخْرُجُوا۟ مِن دِيَـٰرِكُم مَّا فَعَلُوهُ إِلَّا قَلِيلٌ مِّنْهُمْ ۖ وَلَوْ أَنَّهُمْ فَعَلُوا۟ مَا يُوعَظُونَ بِهِۦ لَكَانَ خَيْرًا لَّهُمْ وَأَشَدَّ تَثْبِيتًا
    arabicPlain: ولو أنا كتبنا عليهم أن اقتلوا أنفسكم أو اخرجوا من دياركم ما فعلوه إلا قليل منهم ۖ ولو أنهم فعلوا ما يوعظون به لكان خيرا لهم وأشد تثبيتا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 70
    page: 89
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-5
- type: Ayah
  data:
    ref: 4:67
    scripture: quran
    name: Quran 4:67
    chapter: 4
    verse: 67
    ordinal: 560
    text: And then We should bestow upon them from Our presence an immense reward,
    translation: Pickthall
    original: وَإِذًا لَّـَٔاتَيْنَـٰهُم مِّن لَّدُنَّآ أَجْرًا عَظِيمًا
    arabicPlain: وإذا لآتيناهم من لدنا أجرا عظيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 70
    page: 89
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-5
- type: Ayah
  data:
    ref: 4:68
    scripture: quran
    name: Quran 4:68
    chapter: 4
    verse: 68
    ordinal: 561
    text: And should guide them unto a straight path.
    translation: Pickthall
    original: وَلَهَدَيْنَـٰهُمْ صِرَٰطًا مُّسْتَقِيمًا
    arabicPlain: ولهديناهم صراطا مستقيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 70
    page: 89
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-5
- type: Ayah
  data:
    ref: 4:69
    scripture: quran
    name: Quran 4:69
    chapter: 4
    verse: 69
    ordinal: 562
    text: Whoso obeyeth Allah and the messenger, they are with those unto whom Allah hath shown favour, of the prophets and the saints and the martyrs and the righteous. The best of company are they!
    translation: Pickthall
    original: وَمَن يُطِعِ ٱللَّهَ وَٱلرَّسُولَ فَأُو۟لَـٰٓئِكَ مَعَ ٱلَّذِينَ أَنْعَمَ ٱللَّهُ عَلَيْهِم مِّنَ ٱلنَّبِيِّـۧنَ وَٱلصِّدِّيقِينَ وَٱلشُّهَدَآءِ وَٱلصَّـٰلِحِينَ ۚ وَحَسُنَ أُو۟لَـٰٓئِكَ رَفِيقًا
    arabicPlain: ومن يطع الله والرسول فأولئك مع الذين أنعم الله عليهم من النبيين والصديقين والشهداء والصالحين ۚ وحسن أولئك رفيقا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
