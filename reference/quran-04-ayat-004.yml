  data:
    ref: 4:99
    scripture: quran
    name: Quran 4:99
    chapter: 4
    verse: 99
    ordinal: 592
    text: As for such, it may be that Allah will pardon them. Allah is ever Clement, Forgiving.
    translation: Pickthall
    original: فَأُو۟لَـٰٓئِكَ عَسَى ٱللَّهُ أَن يَعْفُوَ عَنْهُمْ ۚ وَكَانَ ٱللَّهُ عَفُوًّا غَفُورًا
    arabicPlain: فأولئك عسى الله أن يعفو عنهم ۚ وكان الله عفوا غفورا
    surahName: An-Nisaa
    juz: 5
