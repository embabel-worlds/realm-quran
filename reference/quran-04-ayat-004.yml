  data:
    ref: '4:37'
    scripture: quran
    name: Quran 4:37
    chapter: 4
    verse: 37
    ordinal: 530
    text: Who hoard their wealth and enjoin avarice on others, and hide that which Allah hath bestowed upon them of His bounty. For disbelievers We prepare a shameful doom;
    translation: Pickthall
    original: ٱلَّذِينَ يَبْخَلُونَ وَيَأْمُرُونَ ٱلنَّاسَ بِٱلْبُخْلِ وَيَكْتُمُونَ مَآ ءَاتَىٰهُمُ ٱللَّهُ مِن فَضْلِهِۦ ۗ وَأَعْتَدْنَا لِلْكَـٰفِرِينَ عَذَابًا مُّهِينًا
    arabicPlain: الذين يبخلون ويأمرون الناس بالبخل ويكتمون ما آتاهم الله من فضله ۗ وأعتدنا للكافرين عذابا مهينا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 67
