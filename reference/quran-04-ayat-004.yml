  data:
    ref: '4:31'
    scripture: quran
    name: Quran 4:31
    chapter: 4
    verse: 31
    ordinal: 524
    text: If ye avoid the great (things) which ye are forbidden, We will remit from you your evil deeds and make you enter at a noble gate.
    translation: Pickthall
    original: إِن تَجْتَنِبُوا۟ كَبَآئِرَ مَا تُنْهَوْنَ عَنْهُ نُكَفِّرْ عَنكُمْ سَيِّـَٔاتِكُمْ وَنُدْخِلْكُم مُّدْخَلًا كَرِيمًا
    arabicPlain: إن تجتنبوا كبائر ما تنهون عنه نكفر عنكم سيئاتكم وندخلكم مدخلا كريما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 66
