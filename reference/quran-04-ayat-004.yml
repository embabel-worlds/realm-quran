  data:
    ref: 4:153
    scripture: quran
    name: Quran 4:153
    chapter: 4
    verse: 153
    ordinal: 646
    text: 'The people of the Scripture ask of thee that thou shouldst cause an (actual) Book to descend upon them from heaven. They asked a greater thing of Moses aforetime, for they said: Show us Allah plainly. The storm of lightning seized them for their wickedness. Then (even) after that) they chose the calf (for worship) after clear proofs (of Allah''s Sovereignty) had come unto them. And We forgave them that! And We bestowed on Moses evident authority.'
    translation: Pickthall
    original: يَسْـَٔلُكَ أَهْلُ ٱلْكِتَـٰبِ أَن تُنَزِّلَ عَلَيْهِمْ كِتَـٰبًا مِّنَ ٱلسَّمَآءِ ۚ فَقَدْ سَأَلُوا۟ مُوسَىٰٓ أَكْبَرَ مِن ذَٰلِكَ فَقَالُوٓا۟ أَرِنَا ٱللَّهَ جَهْرَةً فَأَخَذَتْهُمُ ٱلصَّـٰعِقَةُ بِظُلْمِهِمْ ۚ ثُمَّ ٱتَّخَذُوا۟ ٱلْعِجْلَ مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَـٰتُ فَعَفَوْنَا عَن ذَٰلِكَ ۚ وَءَاتَيْنَا مُوسَىٰ سُلْطَـٰنًا مُّبِينًا
    arabicPlain: يسألك أهل الكتاب أن تنزل عليهم كتابا من السماء ۚ فقد سألوا موسى أكبر من ذلك فقالوا أرنا الله جهرة فأخذتهم الصاعقة بظلمهم ۚ ثم اتخذوا العجل من بعد ما جاءتهم البينات فعفونا عن ذلك ۚ وآتينا موسى سلطانا مبينا
    surahName: An-Nisaa
    juz: 6
    manzil: 1
    ruku: 83
    page: 102
