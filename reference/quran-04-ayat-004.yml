  data:
    ref: 4:168
    scripture: quran
    name: Quran 4:168
    chapter: 4
    verse: 168
    ordinal: 661
    text: Lo! those who disbelieve and deal in wrong, Allah will never forgive them, neither will He guide them unto a road,
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ كَفَرُوا۟ وَظَلَمُوا۟ لَمْ يَكُنِ ٱللَّهُ لِيَغْفِرَ لَهُمْ وَلَا لِيَهْدِيَهُمْ طَرِيقًا
    arabicPlain: إن الذين كفروا وظلموا لم يكن الله ليغفر لهم ولا ليهديهم طريقا
