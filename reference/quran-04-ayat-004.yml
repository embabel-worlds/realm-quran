  data:
    ref: 4:132
    scripture: quran
    name: Quran 4:132
    chapter: 4
    verse: 132
    ordinal: 625
    text: Unto Allah belongeth whatsoever is in the heavens and whatsoever is in the earth. And Allah is sufficient as Defender.
    translation: Pickthall
    original: وَلِلَّهِ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۚ وَكَفَىٰ بِٱللَّهِ وَكِيلًا
