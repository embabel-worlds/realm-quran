- type: Ayah
  data:
    ref: '4:11'
    scripture: quran
    name: Quran 4:11
    chapter: 4
    verse: 11
    ordinal: 504
    text: 'Allah chargeth you concerning (the provision for) your children: to the male the equivalent of the portion of two females, and if there be women more than two, then theirs is two-thirds of the inheritance, and if there be one (only) then the half. And to each of his parents a sixth of the inheritance, if he have a son; and if he have no son and his parents are his heirs, then to his mother appertaineth the third; and if he have brethren, then to his mother appertaineth the sixth, after any legacy he may have bequeathed, or debt (hath been paid). Your parents and your children: Ye know not which of them is nearer unto you in usefulness. It is an injunction from Allah. Lo! Allah is Knower, Wise.'
    translation: Pickthall
    original: يُوصِيكُمُ ٱللَّهُ فِىٓ أَوْلَـٰدِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ ٱلْأُنثَيَيْنِ ۚ فَإِن كُنَّ نِسَآءً فَوْقَ ٱثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ ۖ وَإِن كَانَتْ وَٰحِدَةً فَلَهَا ٱلنِّصْفُ ۚ وَلِأَبَوَيْهِ لِكُلِّ وَٰحِدٍ مِّنْهُمَا ٱلسُّدُسُ مِمَّا تَرَكَ إِن كَانَ لَهُۥ وَلَدٌ ۚ فَإِن لَّمْ يَكُن لَّهُۥ وَلَدٌ وَوَرِثَهُۥٓ أَبَوَاهُ فَلِأُمِّهِ ٱلثُّلُثُ ۚ فَإِن كَانَ لَهُۥٓ إِخْوَةٌ فَلِأُمِّهِ ٱلسُّدُسُ ۚ مِنۢ بَعْدِ وَصِيَّةٍ يُوصِى بِهَآ أَوْ دَيْنٍ ۗ ءَابَآؤُكُمْ وَأَبْنَآؤُكُمْ لَا تَدْرُونَ أَيُّهُمْ أَقْرَبُ لَكُمْ نَفْعًا ۚ فَرِيضَةً مِّنَ ٱللَّهِ ۗ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمًا
    arabicPlain: يوصيكم الله في أولادكم ۖ للذكر مثل حظ الأنثيين ۚ فإن كن نساء فوق اثنتين فلهن ثلثا ما ترك ۖ وإن كانت واحدة فلها النصف ۚ ولأبويه لكل واحد منهما السدس مما ترك إن كان له ولد ۚ فإن لم يكن له ولد وورثه أبواه فلأمه الثلث ۚ فإن كان له إخوة فلأمه السدس ۚ من بعد وصية يوصي بها أو دين ۗ آباؤكم وأبناؤكم لا تدرون أيهم أقرب لكم نفعا ۚ فريضة من الله ۗ إن الله كان عليما حكيما
    surahName: An-Nisaa
    juz: 4
    manzil: 1
    ruku: 63
    page: 78
