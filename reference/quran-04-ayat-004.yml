  data:
    ref: '4:13'
    scripture: quran
    name: Quran 4:13
    chapter: 4
    verse: 13
    ordinal: 506
    text: These are the limits (imposed by) Allah. Whoso obeyeth Allah and His messenger, He will make him enter Gardens underneath which rivers flow, where such will dwell for ever. That will be the great success.
    translation: Pickthall
    original: تِلْكَ حُدُودُ ٱللَّهِ ۚ وَمَن يُطِعِ ٱللَّهَ وَرَسُولَهُۥ يُدْخِلْهُ جَنَّـٰتٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ خَـٰلِدِينَ فِيهَا ۚ وَذَٰلِكَ ٱلْفَوْزُ ٱلْعَظِيمُ
    arabicPlain: تلك حدود الله ۚ ومن يطع الله ورسوله يدخله جنات تجري من تحتها الأنهار خالدين فيها ۚ وذلك الفوز العظيم
    surahName: An-Nisaa
    juz: 4
    manzil: 1
    ruku: 63
    page: 79
