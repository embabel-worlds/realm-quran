    scripture: quran
    name: Quran 4:166
    chapter: 4
    verse: 166
    ordinal: 659
    text: But Allah (Himself) testifieth concerning that which He hath revealeth unto thee; in His knowledge hath He revealed it; and the angels also testify. And Allah is sufficient Witness.
    translation: Pickthall
    original: لَّـٰكِنِ ٱللَّهُ يَشْهَدُ بِمَآ أَنزَلَ إِلَيْكَ ۖ أَنزَلَهُۥ بِعِلْمِهِۦ ۖ وَٱلْمَلَـٰٓئِكَةُ يَشْهَدُونَ ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًا
    arabicPlain: لكن الله يشهد بما أنزل إليك ۖ أنزله بعلمه ۖ والملائكة يشهدون ۚ وكفى بالله شهيدا
