  data:
    ref: '4:52'
    scripture: quran
    name: Quran 4:52
    chapter: 4
    verse: 52
    ordinal: 545
    text: Those are they whom Allah hath cursed, and he whom Allah hath cursed, thou (O Muhammad) wilt find for him no helper.
    translation: Pickthall
    original: أُو۟لَـٰٓئِكَ ٱلَّذِينَ لَعَنَهُمُ ٱللَّهُ ۖ وَمَن يَلْعَنِ ٱللَّهُ فَلَن تَجِدَ لَهُۥ نَصِيرًا
    arabicPlain: أولئك الذين لعنهم الله ۖ ومن يلعن الله فلن تجد له نصيرا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 69
