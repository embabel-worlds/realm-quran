- type: Ayah
  data:
    ref: '4:2'
    scripture: quran
    name: Quran 4:2
    chapter: 4
    verse: 2
    ordinal: 495
    text: Give unto orphans their wealth. Exchange not the good for the bad (in your management thereof) nor absorb their wealth into your own wealth. Lo! that would be a great sin.
    translation: Pickthall
    original: وَءَاتُوا۟ ٱلْيَتَـٰمَىٰٓ أَمْوَٰلَهُمْ ۖ وَلَا تَتَبَدَّلُوا۟ ٱلْخَبِيثَ بِٱلطَّيِّبِ ۖ وَلَا تَأْكُلُوٓا۟ أَمْوَٰلَهُمْ إِلَىٰٓ أَمْوَٰلِكُمْ ۚ إِنَّهُۥ كَانَ حُوبًا كَبِيرًا
    arabicPlain: وآتوا اليتامى أموالهم ۖ ولا تتبدلوا الخبيث بالطيب ۖ ولا تأكلوا أموالهم إلى أموالكم ۚ إنه كان حوبا كبيرا
    surahName: An-Nisaa
    juz: 4
    manzil: 1
    ruku: 62
    page: 77
