  data:
    ref: 4:104
    scripture: quran
    name: Quran 4:104
    chapter: 4
    verse: 104
    ordinal: 597
    text: Relent not in pursuit of the enemy. If ye are suffering, lo! they suffer even as ye suffer and ye hope from Allah that for which they cannot hope. Allah is ever Knower, Wise.
    translation: Pickthall
    original: وَلَا تَهِنُوا۟ فِى ٱبْتِغَآءِ ٱلْقَوْمِ ۖ إِن تَكُونُوا۟ تَأْلَمُونَ فَإِنَّهُمْ يَأْلَمُونَ كَمَا تَأْلَمُونَ ۖ وَتَرْجُونَ مِنَ ٱللَّهِ مَا لَا يَرْجُونَ ۗ وَكَانَ ٱللَّهُ عَلِيمًا حَكِيمًا
    arabicPlain: ولا تهنوا في ابتغاء القوم ۖ إن تكونوا تألمون فإنهم يألمون كما تألمون ۖ وترجون من الله ما لا يرجون ۗ وكان الله عليما حكيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 76
    page: 95
