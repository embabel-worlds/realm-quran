- type: Ayah
  data:
    ref: '4:8'
    scripture: quran
    name: Quran 4:8
    chapter: 4
    verse: 8
    ordinal: 501
    text: And when kinsfolk and orphans and the needy are present at the division (of the heritage), bestow on them therefrom and speak kindly unto them.
    translation: Pickthall
    original: وَإِذَا حَضَرَ ٱلْقِسْمَةَ أُو۟لُوا۟ ٱلْقُرْبَىٰ وَٱلْيَتَـٰمَىٰ وَٱلْمَسَـٰكِينُ فَٱرْزُقُوهُم مِّنْهُ وَقُولُوا۟ لَهُمْ قَوْلًا مَّعْرُوفًا
    arabicPlain: وإذا حضر القسمة أولو القربى واليتامى والمساكين فارزقوهم منه وقولوا لهم قولا معروفا
    surahName: An-Nisaa
    juz: 4
