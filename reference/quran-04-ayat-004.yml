    scripture: quran
    name: Quran 4:145
    chapter: 4
    verse: 145
    ordinal: 638
    text: Lo! the hypocrites (will be) in the lowest deep of the Fire, and thou wilt find no helper for them;
    translation: Pickthall
    original: إِنَّ ٱلْمُنَـٰفِقِينَ فِى ٱلدَّرْكِ ٱلْأَسْفَلِ مِنَ ٱلنَّارِ وَلَن تَجِدَ لَهُمْ نَصِيرًا
