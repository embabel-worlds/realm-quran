  data:
    ref: 4:80
    scripture: quran
    name: Quran 4:80
    chapter: 4
    verse: 80
    ordinal: 573
    text: 'Whoso obeyeth the messenger hath obeyed Allah, and whoso turneth away: We have not sent thee as a warder over them.'
    translation: Pickthall
    original: مَّن يُطِعِ ٱلرَّسُولَ فَقَدْ أَطَاعَ ٱللَّهَ ۖ وَمَن تَوَلَّىٰ فَمَآ أَرْسَلْنَـٰكَ عَلَيْهِمْ حَفِيظًا
    arabicPlain: من يطع الرسول فقد أطاع الله ۖ ومن تولى فما أرسلناك عليهم حفيظا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 72
    page: 91
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-5
- type: Ayah
  data:
    ref: 4:81
    scripture: quran
    name: Quran 4:81
    chapter: 4
    verse: 81
    ordinal: 574
    text: 'And they say: (It is) obedience; but when they have gone forth from thee a party of them spend the night in planning other than what thou sayest. Allah recordeth what they plan by night. So oppose them and put thy trust in Allah. Allah is sufficient as Trustee.'
    translation: Pickthall
    original: وَيَقُولُونَ طَاعَةٌ فَإِذَا بَرَزُوا۟ مِنْ عِندِكَ بَيَّتَ طَآئِفَةٌ مِّنْهُمْ غَيْرَ ٱلَّذِى تَقُولُ ۖ وَٱللَّهُ يَكْتُبُ مَا يُبَيِّتُونَ ۖ فَأَعْرِضْ عَنْهُمْ وَتَوَكَّلْ عَلَى ٱللَّهِ ۚ وَكَفَىٰ بِٱللَّهِ وَكِيلًا
    arabicPlain: ويقولون طاعة فإذا برزوا من عندك بيت طائفة منهم غير الذي تقول ۖ والله يكتب ما يبيتون ۖ فأعرض عنهم وتوكل على الله ۚ وكفى بالله وكيلا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 72
    page: 91
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
  - predicate: IN_PORTION
    to:
      type: Juz
