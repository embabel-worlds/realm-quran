  data:
    ref: 4:147
    scripture: quran
    name: Quran 4:147
    chapter: 4
    verse: 147
    ordinal: 640
    text: What concern hath Allah for your punishment if ye are thankful (for His mercies) and believe (in Him)? Allah was ever Responsive, Aware.
    translation: Pickthall
    original: مَّا يَفْعَلُ ٱللَّهُ بِعَذَابِكُمْ إِن شَكَرْتُمْ وَءَامَنتُمْ ۚ وَكَانَ ٱللَّهُ شَاكِرًا عَلِيمًا
    arabicPlain: ما يفعل الله بعذابكم إن شكرتم وآمنتم ۚ وكان الله شاكرا عليما
