  data:
    ref: 4:108
    scripture: quran
    name: Quran 4:108
    chapter: 4
    verse: 108
    ordinal: 601
    text: They seek to hide from men and seek not to hide from Allah. He is with them when by night they hold discourse displeasing unto Him. Allah ever surroundeth what they do.
    translation: Pickthall
    original: يَسْتَخْفُونَ مِنَ ٱلنَّاسِ وَلَا يَسْتَخْفُونَ مِنَ ٱللَّهِ وَهُوَ مَعَهُمْ إِذْ يُبَيِّتُونَ مَا لَا يَرْضَىٰ مِنَ ٱلْقَوْلِ ۚ وَكَانَ ٱللَّهُ بِمَا يَعْمَلُونَ مُحِيطًا
    arabicPlain: يستخفون من الناس ولا يستخفون من الله وهو معهم إذ يبيتون ما لا يرضى من القول ۚ وكان الله بما يعملون محيطا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 77
    page: 96
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
  - predicate: IN_PORTION
