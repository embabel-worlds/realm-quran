  data:
    ref: 4:116
    scripture: quran
    name: Quran 4:116
    chapter: 4
    verse: 116
    ordinal: 609
    text: Lo! Allah pardoneth not that partners should be ascribed unto Him. He pardoneth all save that to whom He will. Whoso ascribeth partners unto Allah hath wandered far astray.
    translation: Pickthall
    original: إِنَّ ٱللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِۦ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَآءُ ۚ وَمَن يُشْرِكْ بِٱللَّهِ فَقَدْ ضَلَّ ضَلَـٰلًۢا بَعِيدًا
    arabicPlain: إن الله لا يغفر أن يشرك به ويغفر ما دون ذلك لمن يشاء ۚ ومن يشرك بالله فقد ضل ضلالا بعيدا
    surahName: An-Nisaa
    juz: 5
