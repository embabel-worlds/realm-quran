  data:
    ref: 4:118
    scripture: quran
    name: Quran 4:118
    chapter: 4
    verse: 118
    ordinal: 611
    text: 'Whom Allah cursed, and he said: Surely I will take of Thy bondmen an appointed portion,'
    translation: Pickthall
    original: لَّعَنَهُ ٱللَّهُ ۘ وَقَالَ لَأَتَّخِذَنَّ مِنْ عِبَادِكَ نَصِيبًا مَّفْرُوضًا
    arabicPlain: لعنه الله ۘ وقال لأتخذن من عبادك نصيبا مفروضا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 79
