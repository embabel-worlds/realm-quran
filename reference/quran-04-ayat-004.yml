  data:
    ref: 4:105
    scripture: quran
    name: Quran 4:105
    chapter: 4
    verse: 105
    ordinal: 598
    text: Lo! We reveal unto thee the Scripture with the truth, that thou mayst judge between mankind by that which Allah showeth thee. And be not thou a pleader for the treacherous;
    translation: Pickthall
    original: إِنَّآ أَنزَلْنَآ إِلَيْكَ ٱلْكِتَـٰبَ بِٱلْحَقِّ لِتَحْكُمَ بَيْنَ ٱلنَّاسِ بِمَآ أَرَىٰكَ ٱللَّهُ ۚ وَلَا تَكُن لِّلْخَآئِنِينَ خَصِيمًا
    arabicPlain: إنا أنزلنا إليك الكتاب بالحق لتحكم بين الناس بما أراك الله ۚ ولا تكن للخائنين خصيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 77
