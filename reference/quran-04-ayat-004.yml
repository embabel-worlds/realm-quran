  data:
    ref: 4:71
    scripture: quran
    name: Quran 4:71
    chapter: 4
    verse: 71
    ordinal: 564
    text: O ye who believe! Take your precautions, then advance the proven ones, or advance all together.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ خُذُوا۟ حِذْرَكُمْ فَٱنفِرُوا۟ ثُبَاتٍ أَوِ ٱنفِرُوا۟ جَمِيعًا
    arabicPlain: يا أيها الذين آمنوا خذوا حذركم فانفروا ثبات أو انفروا جميعا
