  data:
    ref: '4:26'
    scripture: quran
    name: Quran 4:26
    chapter: 4
    verse: 26
    ordinal: 519
    text: Allah would explain to you and guide you by the examples of those who were before you, and would turn to you in mercy. Allah is Knower, Wise.
    translation: Pickthall
    original: يُرِيدُ ٱللَّهُ لِيُبَيِّنَ لَكُمْ وَيَهْدِيَكُمْ سُنَنَ ٱلَّذِينَ مِن قَبْلِكُمْ وَيَتُوبَ عَلَيْكُمْ ۗ وَٱللَّهُ عَلِيمٌ حَكِيمٌ
    arabicPlain: يريد الله ليبين لكم ويهديكم سنن الذين من قبلكم ويتوب عليكم ۗ والله عليم حكيم
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 66
    page: 82
