  data:
    ref: '4:38'
    scripture: quran
    name: Quran 4:38
    chapter: 4
    verse: 38
    ordinal: 531
    text: And (also) those who spend their wealth in order to be seen of men, and believe not in Allah nor the Last Day. Whoso taketh Satan for a comrade, a bad comrade hath he.
    translation: Pickthall
    original: وَٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ رِئَآءَ ٱلنَّاسِ وَلَا يُؤْمِنُونَ بِٱللَّهِ وَلَا بِٱلْيَوْمِ ٱلْـَٔاخِرِ ۗ وَمَن يَكُنِ ٱلشَّيْطَـٰنُ لَهُۥ قَرِينًا فَسَآءَ قَرِينًا
    arabicPlain: والذين ينفقون أموالهم رئاء الناس ولا يؤمنون بالله ولا باليوم الآخر ۗ ومن يكن الشيطان له قرينا فساء قرينا
