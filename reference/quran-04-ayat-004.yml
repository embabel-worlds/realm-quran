- type: Ayah
  data:
    ref: '4:9'
    scripture: quran
    name: Quran 4:9
    chapter: 4
    verse: 9
    ordinal: 502
    text: And let those fear (in their behaviour toward orphans) who if they left behind them weak offspring would be afraid for them. So let them mind their duty to Allah, and speak justly.
    translation: Pickthall
    original: وَلْيَخْشَ ٱلَّذِينَ لَوْ تَرَكُوا۟ مِنْ خَلْفِهِمْ ذُرِّيَّةً ضِعَـٰفًا خَافُوا۟ عَلَيْهِمْ فَلْيَتَّقُوا۟ ٱللَّهَ وَلْيَقُولُوا۟ قَوْلًا سَدِيدًا
    arabicPlain: وليخش الذين لو تركوا من خلفهم ذرية ضعافا خافوا عليهم فليتقوا الله وليقولوا قولا سديدا
    surahName: An-Nisaa
    juz: 4
    manzil: 1
