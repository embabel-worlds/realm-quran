  data:
    ref: 4:156
    scripture: quran
    name: Quran 4:156
    chapter: 4
    verse: 156
    ordinal: 649
    text: And because of their disbelief and of their speaking against Mary a tremendous calumny;
    translation: Pickthall
    original: وَبِكُفْرِهِمْ وَقَوْلِهِمْ عَلَىٰ مَرْيَمَ بُهْتَـٰنًا عَظِيمًا
    arabicPlain: وبكفرهم وقولهم على مريم بهتانا عظيما
    surahName: An-Nisaa
    juz: 6
    manzil: 1
    ruku: 83
