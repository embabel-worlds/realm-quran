  data:
    ref: 4:107
    scripture: quran
    name: Quran 4:107
    chapter: 4
    verse: 107
    ordinal: 600
    text: And plead not on behalf of (people) who deceive themselves. Lo! Allah loveth not one who is treacherous and sinful.
    translation: Pickthall
    original: وَلَا تُجَـٰدِلْ عَنِ ٱلَّذِينَ يَخْتَانُونَ أَنفُسَهُمْ ۚ إِنَّ ٱللَّهَ لَا يُحِبُّ مَن كَانَ خَوَّانًا أَثِيمًا
    arabicPlain: ولا تجادل عن الذين يختانون أنفسهم ۚ إن الله لا يحب من كان خوانا أثيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 77
    page: 96
  relations:
