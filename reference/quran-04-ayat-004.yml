  data:
    ref: 4:131
    scripture: quran
    name: Quran 4:131
    chapter: 4
    verse: 131
    ordinal: 624
    text: Unto Allah belongeth whatsoever is in the heavens and whatsoever is in the earth. And We charged those who received the Scripture before you, and (We charge) you, that ye keep your duty toward Allah. And if ye disbelieve, lo! unto Allah belongeth whatsoever is in the heavens and whatsoever is in the earth, and Allah is ever Absolute, Owner of Praise.
    translation: Pickthall
    original: وَلِلَّهِ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ وَلَقَدْ وَصَّيْنَا ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَـٰبَ مِن قَبْلِكُمْ وَإِيَّاكُمْ أَنِ ٱتَّقُوا۟ ٱللَّهَ ۚ وَإِن تَكْفُرُوا۟ فَإِنَّ لِلَّهِ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۚ وَكَانَ ٱللَّهُ غَنِيًّا حَمِيدًا
    arabicPlain: ولله ما في السماوات وما في الأرض ۗ ولقد وصينا الذين أوتوا الكتاب من قبلكم وإياكم أن اتقوا الله ۚ وإن تكفروا فإن لله ما في السماوات وما في الأرض ۚ وكان الله غنيا حميدا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 80
    page: 99
