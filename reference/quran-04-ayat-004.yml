  data:
    ref: '4:14'
    scripture: quran
    name: Quran 4:14
    chapter: 4
    verse: 14
    ordinal: 507
    text: And whoso disobeyeth Allah and His messenger and transgresseth His limits, He will make him enter Fire, where he will dwell for ever; his will be a shameful doom.
    translation: Pickthall
    original: وَمَن يَعْصِ ٱللَّهَ وَرَسُولَهُۥ وَيَتَعَدَّ حُدُودَهُۥ يُدْخِلْهُ نَارًا خَـٰلِدًا فِيهَا وَلَهُۥ عَذَابٌ مُّهِينٌ
    arabicPlain: ومن يعص الله ورسوله ويتعد حدوده يدخله نارا خالدا فيها وله عذاب مهين
    surahName: An-Nisaa
    juz: 4
    manzil: 1
    ruku: 63
    page: 79
