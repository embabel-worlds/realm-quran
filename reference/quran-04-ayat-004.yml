  data:
    ref: 4:117
    scripture: quran
    name: Quran 4:117
    chapter: 4
    verse: 117
    ordinal: 610
    text: They invoke in His stead only females; they pray to none else than Satan, a rebel
    translation: Pickthall
    original: إِن يَدْعُونَ مِن دُونِهِۦٓ إِلَّآ إِنَـٰثًا وَإِن يَدْعُونَ إِلَّا شَيْطَـٰنًا مَّرِيدًا
    arabicPlain: إن يدعون من دونه إلا إناثا وإن يدعون إلا شيطانا مريدا
    surahName: An-Nisaa
    juz: 5
