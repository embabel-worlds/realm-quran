- type: Ayah
  data:
    ref: '4:5'
    scripture: quran
    name: Quran 4:5
    chapter: 4
    verse: 5
    ordinal: 498
    text: Give not unto the foolish (what is in) your (keeping of their) wealth, which Allah hath given you to maintain; but feed and clothe them from it, and speak kindly unto them.
    translation: Pickthall
    original: وَلَا تُؤْتُوا۟ ٱلسُّفَهَآءَ أَمْوَٰلَكُمُ ٱلَّتِى جَعَلَ ٱللَّهُ لَكُمْ قِيَـٰمًا وَٱرْزُقُوهُمْ فِيهَا وَٱكْسُوهُمْ وَقُولُوا۟ لَهُمْ قَوْلًا مَّعْرُوفًا
    arabicPlain: ولا تؤتوا السفهاء أموالكم التي جعل الله لكم قياما وارزقوهم فيها واكسوهم وقولوا لهم قولا معروفا
    surahName: An-Nisaa
    juz: 4
    manzil: 1
    ruku: 62
    page: 77
