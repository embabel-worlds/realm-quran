  data:
    ref: 4:169
    scripture: quran
    name: Quran 4:169
    chapter: 4
    verse: 169
    ordinal: 662
    text: Except the road of hell, wherein they will abide for ever. And that is ever easy for Allah.
    translation: Pickthall
    original: إِلَّا طَرِيقَ جَهَنَّمَ خَـٰلِدِينَ فِيهَآ أَبَدًا ۚ وَكَانَ ذَٰلِكَ عَلَى ٱللَّهِ يَسِيرًا
    arabicPlain: إلا طريق جهنم خالدين فيها أبدا ۚ وكان ذلك على الله يسيرا
