  data:
    ref: '4:58'
    scripture: quran
    name: Quran 4:58
    chapter: 4
    verse: 58
    ordinal: 551
    text: Lo! Allah commandeth you that ye restore deposits to their owners, and, if ye judge between mankind, that ye judge justly. Lo! comely is this which Allah admonisheth you. Lo! Allah is ever Hearer, Seer.
    translation: Pickthall
    original: ۞ إِنَّ ٱللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا۟ ٱلْأَمَـٰنَـٰتِ إِلَىٰٓ أَهْلِهَا وَإِذَا حَكَمْتُم بَيْنَ ٱلنَّاسِ أَن تَحْكُمُوا۟ بِٱلْعَدْلِ ۚ إِنَّ ٱللَّهَ نِعِمَّا يَعِظُكُم بِهِۦٓ ۗ إِنَّ ٱللَّهَ كَانَ سَمِيعًۢا بَصِيرًا
    arabicPlain: ۞ إن الله يأمركم أن تؤدوا الأمانات إلى أهلها وإذا حكمتم بين الناس أن تحكموا بالعدل ۚ إن الله نعما يعظكم به ۗ إن الله كان سميعا بصيرا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 69
    page: 87
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
