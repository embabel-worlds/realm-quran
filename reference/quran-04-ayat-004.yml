  data:
    ref: 4:130
    scripture: quran
    name: Quran 4:130
    chapter: 4
    verse: 130
    ordinal: 623
    text: But if they separate, Allah will compensate each out of His abundance. Allah is ever All-Embracing, All-Knowing.
    translation: Pickthall
    original: وَإِن يَتَفَرَّقَا يُغْنِ ٱللَّهُ كُلًّا مِّن سَعَتِهِۦ ۚ وَكَانَ ٱللَّهُ وَٰسِعًا حَكِيمًا
    arabicPlain: وإن يتفرقا يغن الله كلا من سعته ۚ وكان الله واسعا حكيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 80
    page: 99
