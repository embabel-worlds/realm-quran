  data:
    ref: 4:62
    scripture: quran
    name: Quran 4:62
    chapter: 4
    verse: 62
    ordinal: 555
    text: How would it be if a misfortune smote them because of that which their own hands have sent before (them)? Then would they come unto thee, swearing by Allah that they were seeking naught but harmony and kindness.
    translation: Pickthall
    original: فَكَيْفَ إِذَآ أَصَـٰبَتْهُم مُّصِيبَةٌۢ بِمَا قَدَّمَتْ أَيْدِيهِمْ ثُمَّ جَآءُوكَ يَحْلِفُونَ بِٱللَّهِ إِنْ أَرَدْنَآ إِلَّآ إِحْسَـٰنًا وَتَوْفِيقًا
    arabicPlain: فكيف إذا أصابتهم مصيبة بما قدمت أيديهم ثم جاءوك يحلفون بالله إن أردنا إلا إحسانا وتوفيقا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 70
    page: 88
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
  - predicate: IN_PORTION
    to:
