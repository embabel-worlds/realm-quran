  data:
    ref: 4:93
    scripture: quran
    name: Quran 4:93
    chapter: 4
    verse: 93
    ordinal: 586
    text: Whoso slayeth a believer of set purpose, his reward is hell for ever. Allah is wroth against him and He hath cursed him and prepared for him an awful doom.
    translation: Pickthall
    original: وَمَن يَقْتُلْ مُؤْمِنًا مُّتَعَمِّدًا فَجَزَآؤُهُۥ جَهَنَّمُ خَـٰلِدًا فِيهَا وَغَضِبَ ٱللَّهُ عَلَيْهِ وَلَعَنَهُۥ وَأَعَدَّ لَهُۥ عَذَابًا عَظِيمًا
    arabicPlain: ومن يقتل مؤمنا متعمدا فجزاؤه جهنم خالدا فيها وغضب الله عليه ولعنه وأعد له عذابا عظيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 74
    page: 93
