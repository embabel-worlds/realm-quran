  data:
    ref: 4:74
    scripture: quran
    name: Quran 4:74
    chapter: 4
    verse: 74
    ordinal: 567
    text: Let those fight in the way of Allah who sell the life of this world for the other. Whoso fighteth in the way of Allah, be he slain or be he victorious, on him We shall bestow a vast reward.
    translation: Pickthall
    original: ۞ فَلْيُقَـٰتِلْ فِى سَبِيلِ ٱللَّهِ ٱلَّذِينَ يَشْرُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا بِٱلْـَٔاخِرَةِ ۚ وَمَن يُقَـٰتِلْ فِى سَبِيلِ ٱللَّهِ فَيُقْتَلْ أَوْ يَغْلِبْ فَسَوْفَ نُؤْتِيهِ أَجْرًا عَظِيمًا
    arabicPlain: ۞ فليقاتل في سبيل الله الذين يشرون الحياة الدنيا بالآخرة ۚ ومن يقاتل في سبيل الله فيقتل أو يغلب فسوف نؤتيه أجرا عظيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 71
    page: 89
