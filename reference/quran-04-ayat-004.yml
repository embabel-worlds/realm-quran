- type: Ayah
  data:
    ref: '4:10'
    scripture: quran
    name: Quran 4:10
    chapter: 4
    verse: 10
    ordinal: 503
    text: Lo! Those who devour the wealth of orphans wrongfully, they do but swallow fire into their bellies, and they will be exposed to burning flame.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ يَأْكُلُونَ أَمْوَٰلَ ٱلْيَتَـٰمَىٰ ظُلْمًا إِنَّمَا يَأْكُلُونَ فِى بُطُونِهِمْ نَارًا ۖ وَسَيَصْلَوْنَ سَعِيرًا
    arabicPlain: إن الذين يأكلون أموال اليتامى ظلما إنما يأكلون في بطونهم نارا ۖ وسيصلون سعيرا
    surahName: An-Nisaa
