  data:
    ref: 4:76
    scripture: quran
    name: Quran 4:76
    chapter: 4
    verse: 76
    ordinal: 569
    text: Those who believe do battle for the cause of Allah; and those who disbelieve do battle for the cause of idols. So fight the minions of the devil. Lo! the devil's strategy is ever weak.
    translation: Pickthall
    original: ٱلَّذِينَ ءَامَنُوا۟ يُقَـٰتِلُونَ فِى سَبِيلِ ٱللَّهِ ۖ وَٱلَّذِينَ كَفَرُوا۟ يُقَـٰتِلُونَ فِى سَبِيلِ ٱلطَّـٰغُوتِ فَقَـٰتِلُوٓا۟ أَوْلِيَآءَ ٱلشَّيْطَـٰنِ ۖ إِنَّ كَيْدَ ٱلشَّيْطَـٰنِ كَانَ ضَعِيفًا
    arabicPlain: الذين آمنوا يقاتلون في سبيل الله ۖ والذين كفروا يقاتلون في سبيل الطاغوت فقاتلوا أولياء الشيطان ۖ إن كيد الشيطان كان ضعيفا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 71
    page: 90
