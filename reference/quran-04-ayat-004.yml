  data:
    ref: '4:48'
    scripture: quran
    name: Quran 4:48
    chapter: 4
    verse: 48
    ordinal: 541
    text: Lo! Allah forgiveth not that a partner should be ascribed unto Him. He forgiveth (all) save that to whom He will. Whoso ascribeth partners to Allah, he hath indeed invented a tremendous sin.
    translation: Pickthall
    original: إِنَّ ٱللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِۦ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَآءُ ۚ وَمَن يُشْرِكْ بِٱللَّهِ فَقَدِ ٱفْتَرَىٰٓ إِثْمًا عَظِيمًا
    arabicPlain: إن الله لا يغفر أن يشرك به ويغفر ما دون ذلك لمن يشاء ۚ ومن يشرك بالله فقد افترى إثما عظيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 68
    page: 86
