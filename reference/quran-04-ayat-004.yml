  data:
    ref: '4:46'
    scripture: quran
    name: Quran 4:46
    chapter: 4
    verse: 46
    ordinal: 539
    text: 'Some of those who are Jews change words from their context and say: "We hear and disobey; hear thou as one who heareth not" and "Listen to us!" distorting with their tongues and slandering religion. If they had said: "We hear and we obey: hear thou, and look at us" it had been better for them, and more upright. But Allah hath cursed them for their disbelief, so they believe not, save a few.'
    translation: Pickthall
    original: مِّنَ ٱلَّذِينَ هَادُوا۟ يُحَرِّفُونَ ٱلْكَلِمَ عَن مَّوَاضِعِهِۦ وَيَقُولُونَ سَمِعْنَا وَعَصَيْنَا وَٱسْمَعْ غَيْرَ مُسْمَعٍ وَرَٰعِنَا لَيًّۢا بِأَلْسِنَتِهِمْ وَطَعْنًا فِى ٱلدِّينِ ۚ وَلَوْ أَنَّهُمْ قَالُوا۟ سَمِعْنَا وَأَطَعْنَا وَٱسْمَعْ وَٱنظُرْنَا لَكَانَ خَيْرًا لَّهُمْ وَأَقْوَمَ وَلَـٰكِن لَّعَنَهُمُ ٱللَّهُ بِكُفْرِهِمْ فَلَا يُؤْمِنُونَ إِلَّا قَلِيلًا
    arabicPlain: من الذين هادوا يحرفون الكلم عن مواضعه ويقولون سمعنا وعصينا واسمع غير مسمع وراعنا ليا بألسنتهم وطعنا في الدين ۚ ولو أنهم قالوا سمعنا وأطعنا واسمع وانظرنا لكان خيرا لهم وأقوم ولكن لعنهم الله بكفرهم فلا يؤمنون إلا قليلا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 68
    page: 86
