  data:
    ref: 4:129
    scripture: quran
    name: Quran 4:129
    chapter: 4
    verse: 129
    ordinal: 622
    text: Ye will not be able to deal equally between (your) wives, however much ye wish (to do so). But turn not altogether away (from one), leaving her as in suspense. If ye do good and keep from evil, lo! Allah is ever Forgiving, Merciful.
    translation: Pickthall
    original: وَلَن تَسْتَطِيعُوٓا۟ أَن تَعْدِلُوا۟ بَيْنَ ٱلنِّسَآءِ وَلَوْ حَرَصْتُمْ ۖ فَلَا تَمِيلُوا۟ كُلَّ ٱلْمَيْلِ فَتَذَرُوهَا كَٱلْمُعَلَّقَةِ ۚ وَإِن تُصْلِحُوا۟ وَتَتَّقُوا۟ فَإِنَّ ٱللَّهَ كَانَ غَفُورًا رَّحِيمًا
    arabicPlain: ولن تستطيعوا أن تعدلوا بين النساء ولو حرصتم ۖ فلا تميلوا كل الميل فتذروها كالمعلقة ۚ وإن تصلحوا وتتقوا فإن الله كان غفورا رحيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 80
    page: 99
