    text: Degrees of rank from Him, and forgiveness and mercy. Allah is ever Forgiving, Merciful.
    translation: Pickthall
    original: دَرَجَـٰتٍ مِّنْهُ وَمَغْفِرَةً وَرَحْمَةً ۚ وَكَانَ ٱللَّهُ غَفُورًا رَّحِيمًا
    arabicPlain: درجات منه ومغفرة ورحمة ۚ وكان الله غفورا رحيما
    surahName: An-Nisaa
    juz: 5
