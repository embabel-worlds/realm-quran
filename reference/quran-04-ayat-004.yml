  data:
    ref: 4:134
    scripture: quran
    name: Quran 4:134
    chapter: 4
    verse: 134
    ordinal: 627
    text: Whoso desireth the reward of the world, (let him know that) with Allah is the reward of the world and the Hereafter. Allah is ever Hearer, Seer.
    translation: Pickthall
    original: مَّن كَانَ يُرِيدُ ثَوَابَ ٱلدُّنْيَا فَعِندَ ٱللَّهِ ثَوَابُ ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ ۚ وَكَانَ ٱللَّهُ سَمِيعًۢا بَصِيرًا
    arabicPlain: من كان يريد ثواب الدنيا فعند الله ثواب الدنيا والآخرة ۚ وكان الله سميعا بصيرا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 80
