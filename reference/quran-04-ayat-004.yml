  data:
    ref: 4:61
    scripture: quran
    name: Quran 4:61
    chapter: 4
    verse: 61
    ordinal: 554
    text: 'And when it is said unto them: Come unto that which Allah hath revealed and unto the messenger, thou seest the hypocrites turn from thee with aversion.'
    translation: Pickthall
    original: وَإِذَا قِيلَ لَهُمْ تَعَالَوْا۟ إِلَىٰ مَآ أَنزَلَ ٱللَّهُ وَإِلَى ٱلرَّسُولِ رَأَيْتَ ٱلْمُنَـٰفِقِينَ يَصُدُّونَ عَنكَ صُدُودًا
    arabicPlain: وإذا قيل لهم تعالوا إلى ما أنزل الله وإلى الرسول رأيت المنافقين يصدون عنك صدودا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 70
    page: 88
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '4'
  - predicate: IN_PORTION
    to:
