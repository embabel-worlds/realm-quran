  data:
    ref: '4:40'
    scripture: quran
    name: Quran 4:40
    chapter: 4
    verse: 40
    ordinal: 533
    text: Lo! Allah wrongeth not even of the weight of an ant; and if there is a good deed, He will double it and will give (the doer) from His presence an immense reward.
    translation: Pickthall
    original: إِنَّ ٱللَّهَ لَا يَظْلِمُ مِثْقَالَ ذَرَّةٍ ۖ وَإِن تَكُ حَسَنَةً يُضَـٰعِفْهَا وَيُؤْتِ مِن لَّدُنْهُ أَجْرًا عَظِيمًا
    arabicPlain: إن الله لا يظلم مثقال ذرة ۖ وإن تك حسنة يضاعفها ويؤت من لدنه أجرا عظيما
