  data:
    ref: 4:88
    scripture: quran
    name: Quran 4:88
    chapter: 4
    verse: 88
    ordinal: 581
    text: What aileth you that ye are become two parties regarding the hypocrites, when Allah cast them back (to disbelief) because of what they earned? Seek ye to guide him whom Allah hath sent astray? He whom Allah sendeth astray, for him thou (O MUhammad) canst not find a road.
    translation: Pickthall
    original: ۞ فَمَا لَكُمْ فِى ٱلْمُنَـٰفِقِينَ فِئَتَيْنِ وَٱللَّهُ أَرْكَسَهُم بِمَا كَسَبُوٓا۟ ۚ أَتُرِيدُونَ أَن تَهْدُوا۟ مَنْ أَضَلَّ ٱللَّهُ ۖ وَمَن يُضْلِلِ ٱللَّهُ فَلَن تَجِدَ لَهُۥ سَبِيلًا
    arabicPlain: ۞ فما لكم في المنافقين فئتين والله أركسهم بما كسبوا ۚ أتريدون أن تهدوا من أضل الله ۖ ومن يضلل الله فلن تجد له سبيلا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 73
