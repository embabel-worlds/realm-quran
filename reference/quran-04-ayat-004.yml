  data:
    ref: 4:98
    scripture: quran
    name: Quran 4:98
    chapter: 4
    verse: 98
    ordinal: 591
    text: Except the feeble among men, and the women, and the children, who are unable to devise a plan and are not shown a way.
    translation: Pickthall
    original: إِلَّا ٱلْمُسْتَضْعَفِينَ مِنَ ٱلرِّجَالِ وَٱلنِّسَآءِ وَٱلْوِلْدَٰنِ لَا يَسْتَطِيعُونَ حِيلَةً وَلَا يَهْتَدُونَ سَبِيلًا
    arabicPlain: إلا المستضعفين من الرجال والنساء والولدان لا يستطيعون حيلة ولا يهتدون سبيلا
    surahName: An-Nisaa
    juz: 5
