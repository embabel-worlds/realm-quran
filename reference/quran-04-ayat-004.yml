    name: Quran 4:159
    chapter: 4
    verse: 159
    ordinal: 652
    text: There is not one of the People of the Scripture but will believe in him before his death, and on the Day of Resurrection he will be a witness against them -
    translation: Pickthall
    original: وَإِن مِّنْ أَهْلِ ٱلْكِتَـٰبِ إِلَّا لَيُؤْمِنَنَّ بِهِۦ قَبْلَ مَوْتِهِۦ ۖ وَيَوْمَ ٱلْقِيَـٰمَةِ يَكُونُ عَلَيْهِمْ شَهِيدًا
    arabicPlain: وإن من أهل الكتاب إلا ليؤمنن به قبل موته ۖ ويوم القيامة يكون عليهم شهيدا
