  data:
    ref: 4:72
    scripture: quran
    name: Quran 4:72
    chapter: 4
    verse: 72
    ordinal: 565
    text: 'Lo! among you there is he who loitereth; and if disaster overtook you, he would say: Allah hath been gracious unto me since I was not present with them.'
    translation: Pickthall
    original: وَإِنَّ مِنكُمْ لَمَن لَّيُبَطِّئَنَّ فَإِنْ أَصَـٰبَتْكُم مُّصِيبَةٌ قَالَ قَدْ أَنْعَمَ ٱللَّهُ عَلَىَّ إِذْ لَمْ أَكُن مَّعَهُمْ شَهِيدًا
    arabicPlain: وإن منكم لمن ليبطئن فإن أصابتكم مصيبة قال قد أنعم الله علي إذ لم أكن معهم شهيدا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 71
