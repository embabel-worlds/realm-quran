  data:
    ref: 4:133
    scripture: quran
    name: Quran 4:133
    chapter: 4
    verse: 133
    ordinal: 626
    text: If He will, He can remove you, O people, and produce others (in your stead). Allah is Able to do that.
    translation: Pickthall
    original: إِن يَشَأْ يُذْهِبْكُمْ أَيُّهَا ٱلنَّاسُ وَيَأْتِ بِـَٔاخَرِينَ ۚ وَكَانَ ٱللَّهُ عَلَىٰ ذَٰلِكَ قَدِيرًا
    arabicPlain: إن يشأ يذهبكم أيها الناس ويأت بآخرين ۚ وكان الله على ذلك قديرا
    surahName: An-Nisaa
    juz: 5
