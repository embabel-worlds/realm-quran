  data:
    ref: 4:106
    scripture: quran
    name: Quran 4:106
    chapter: 4
    verse: 106
    ordinal: 599
    text: And seek forgiveness of Allah. Lo! Allah is ever Forgiving, Merciful.
    translation: Pickthall
    original: وَٱسْتَغْفِرِ ٱللَّهَ ۖ إِنَّ ٱللَّهَ كَانَ غَفُورًا رَّحِيمًا
    arabicPlain: واستغفر الله ۖ إن الله كان غفورا رحيما
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 77
    page: 96
  relations:
  - predicate: IN
    to:
