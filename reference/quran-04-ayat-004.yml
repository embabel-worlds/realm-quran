  data:
    ref: '4:16'
    scripture: quran
    name: Quran 4:16
    chapter: 4
    verse: 16
    ordinal: 509
    text: And as for the two of you who are guilty thereof, punish them both. And if they repent and improve, then let them be. Lo! Allah is ever relenting, Merciful.
    translation: Pickthall
    original: وَٱلَّذَانِ يَأْتِيَـٰنِهَا مِنكُمْ فَـَٔاذُوهُمَا ۖ فَإِن تَابَا وَأَصْلَحَا فَأَعْرِضُوا۟ عَنْهُمَآ ۗ إِنَّ ٱللَّهَ كَانَ تَوَّابًا رَّحِيمًا
    arabicPlain: واللذان يأتيانها منكم فآذوهما ۖ فإن تابا وأصلحا فأعرضوا عنهما ۗ إن الله كان توابا رحيما
    surahName: An-Nisaa
    juz: 4
    manzil: 1
    ruku: 64
    page: 80
