  data:
    ref: 4:149
    scripture: quran
    name: Quran 4:149
    chapter: 4
    verse: 149
    ordinal: 642
    text: If ye do good openly or keep it secret, or forgive evil, lo! Allah is ever Forgiving, Powerful.
    translation: Pickthall
    original: إِن تُبْدُوا۟ خَيْرًا أَوْ تُخْفُوهُ أَوْ تَعْفُوا۟ عَن سُوٓءٍ فَإِنَّ ٱللَّهَ كَانَ عَفُوًّا قَدِيرًا
    arabicPlain: إن تبدوا خيرا أو تخفوه أو تعفوا عن سوء فإن الله كان عفوا قديرا
