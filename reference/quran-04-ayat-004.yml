  data:
    ref: '4:49'
    scripture: quran
    name: Quran 4:49
    chapter: 4
    verse: 49
    ordinal: 542
    text: Hast thou not seen those who praise themselves for purity? Nay, Allah purifieth whom He will, and they will not be wronged even the hair upon a date-stone.
    translation: Pickthall
    original: أَلَمْ تَرَ إِلَى ٱلَّذِينَ يُزَكُّونَ أَنفُسَهُم ۚ بَلِ ٱللَّهُ يُزَكِّى مَن يَشَآءُ وَلَا يُظْلَمُونَ فَتِيلًا
    arabicPlain: ألم تر إلى الذين يزكون أنفسهم ۚ بل الله يزكي من يشاء ولا يظلمون فتيلا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 68
    page: 86
