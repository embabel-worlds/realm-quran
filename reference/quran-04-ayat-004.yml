    verse: 157
    ordinal: 650
    text: 'And because of their saying: We slew the Messiah, Jesus son of Mary, Allah''s messenger - they slew him not nor crucified him, but it appeared so unto them; and lo! those who disagree concerning it are in doubt thereof; they have no knowledge thereof save pursuit of a conjecture; they slew him not for certain.'
    translation: Pickthall
    original: وَقَوْلِهِمْ إِنَّا قَتَلْنَا ٱلْمَسِيحَ عِيسَى ٱبْنَ مَرْيَمَ رَسُولَ ٱللَّهِ وَمَا قَتَلُوهُ وَمَا صَلَبُوهُ وَلَـٰكِن شُبِّهَ لَهُمْ ۚ وَإِنَّ ٱلَّذِينَ ٱخْتَلَفُوا۟ فِيهِ لَفِى شَكٍّ مِّنْهُ ۚ مَا لَهُم بِهِۦ مِنْ عِلْمٍ إِلَّا ٱتِّبَاعَ ٱلظَّنِّ ۚ وَمَا قَتَلُوهُ يَقِينًۢا
    arabicPlain: وقولهم إنا قتلنا المسيح عيسى ابن مريم رسول الله وما قتلوه وما صلبوه ولكن شبه لهم ۚ وإن الذين اختلفوا فيه لفي شك منه ۚ ما لهم به من علم إلا اتباع الظن ۚ وما قتلوه يقينا
    surahName: An-Nisaa
    juz: 6
    manzil: 1
    ruku: 83
    page: 103
