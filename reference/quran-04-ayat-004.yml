  data:
    ref: '4:20'
    scripture: quran
    name: Quran 4:20
    chapter: 4
    verse: 20
    ordinal: 513
    text: And if ye wish to exchange one wife for another and ye have given unto one of them a sum of money (however great), take nothing from it. Would ye take it by the way of calumny and open wrong?
    translation: Pickthall
    original: وَإِنْ أَرَدتُّمُ ٱسْتِبْدَالَ زَوْجٍ مَّكَانَ زَوْجٍ وَءَاتَيْتُمْ إِحْدَىٰهُنَّ قِنطَارًا فَلَا تَأْخُذُوا۟ مِنْهُ شَيْـًٔا ۚ أَتَأْخُذُونَهُۥ بُهْتَـٰنًا وَإِثْمًا مُّبِينًا
    arabicPlain: وإن أردتم استبدال زوج مكان زوج وآتيتم إحداهن قنطارا فلا تأخذوا منه شيئا ۚ أتأخذونه بهتانا وإثما مبينا
    surahName: An-Nisaa
    juz: 4
    manzil: 1
    ruku: 64
    page: 81
  relations:
