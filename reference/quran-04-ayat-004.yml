  data:
    ref: '4:21'
    scripture: quran
    name: Quran 4:21
    chapter: 4
    verse: 21
    ordinal: 514
    text: How can ye take it (back) after one of you hath gone in unto the other, and they have taken a strong pledge from you?
    translation: Pickthall
    original: وَكَيْفَ تَأْخُذُونَهُۥ وَقَدْ أَفْضَىٰ بَعْضُكُمْ إِلَىٰ بَعْضٍ وَأَخَذْنَ مِنكُم مِّيثَـٰقًا غَلِيظًا
    arabicPlain: وكيف تأخذونه وقد أفضى بعضكم إلى بعض وأخذن منكم ميثاقا غليظا
    surahName: An-Nisaa
    juz: 4
    manzil: 1
    ruku: 64
    page: 81
