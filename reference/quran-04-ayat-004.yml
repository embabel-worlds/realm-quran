- type: Ayah
  data:
    ref: '4:4'
    scripture: quran
    name: Quran 4:4
    chapter: 4
    verse: 4
    ordinal: 497
    text: And give unto the women (whom ye marry) free gift of their marriage portions; but if they of their own accord remit unto you a part thereof, then ye are welcome to absorb it (in your wealth).
    translation: Pickthall
    original: وَءَاتُوا۟ ٱلنِّسَآءَ صَدُقَـٰتِهِنَّ نِحْلَةً ۚ فَإِن طِبْنَ لَكُمْ عَن شَىْءٍ مِّنْهُ نَفْسًا فَكُلُوهُ هَنِيٓـًٔا مَّرِيٓـًٔا
    arabicPlain: وآتوا النساء صدقاتهن نحلة ۚ فإن طبن لكم عن شيء منه نفسا فكلوه هنيئا مريئا
    surahName: An-Nisaa
    juz: 4
    manzil: 1
    ruku: 62
    page: 77
