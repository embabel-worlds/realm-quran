  data:
    ref: '4:30'
    scripture: quran
    name: Quran 4:30
    chapter: 4
    verse: 30
    ordinal: 523
    text: Whoso doeth that through aggression and injustice, we shall cast him into Fire, and that is ever easy for Allah.
    translation: Pickthall
    original: وَمَن يَفْعَلْ ذَٰلِكَ عُدْوَٰنًا وَظُلْمًا فَسَوْفَ نُصْلِيهِ نَارًا ۚ وَكَانَ ذَٰلِكَ عَلَى ٱللَّهِ يَسِيرًا
    arabicPlain: ومن يفعل ذلك عدوانا وظلما فسوف نصليه نارا ۚ وكان ذلك على الله يسيرا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 66
