  data:
    ref: '4:33'
    scripture: quran
    name: Quran 4:33
    chapter: 4
    verse: 33
    ordinal: 526
    text: And unto each We have appointed heirs of that which parents and near kindred leave; and as for those with whom your right hands have made a covenant, give them their due. Lo! Allah is ever Witness over all things.
    translation: Pickthall
    original: وَلِكُلٍّ جَعَلْنَا مَوَٰلِىَ مِمَّا تَرَكَ ٱلْوَٰلِدَانِ وَٱلْأَقْرَبُونَ ۚ وَٱلَّذِينَ عَقَدَتْ أَيْمَـٰنُكُمْ فَـَٔاتُوهُمْ نَصِيبَهُمْ ۚ إِنَّ ٱللَّهَ كَانَ عَلَىٰ كُلِّ شَىْءٍ شَهِيدًا
    arabicPlain: ولكل جعلنا موالي مما ترك الوالدان والأقربون ۚ والذين عقدت أيمانكم فآتوهم نصيبهم ۚ إن الله كان على كل شيء شهيدا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
    ruku: 66
    page: 83
