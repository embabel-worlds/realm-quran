  data:
    ref: 4:148
    scripture: quran
    name: Quran 4:148
    chapter: 4
    verse: 148
    ordinal: 641
    text: Allah loveth not the utterance of harsh speech save by one who hath been wronged. Allah is ever Hearer, Knower.
    translation: Pickthall
    original: ۞ لَّا يُحِبُّ ٱللَّهُ ٱلْجَهْرَ بِٱلسُّوٓءِ مِنَ ٱلْقَوْلِ إِلَّا مَن ظُلِمَ ۚ وَكَانَ ٱللَّهُ سَمِيعًا عَلِيمًا
    arabicPlain: ۞ لا يحب الله الجهر بالسوء من القول إلا من ظلم ۚ وكان الله سميعا عليما
