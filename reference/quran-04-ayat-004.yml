  data:
    ref: '4:39'
    scripture: quran
    name: Quran 4:39
    chapter: 4
    verse: 39
    ordinal: 532
    text: What have they (to fear) if they believe in Allah and the Last Day and spend (aright) of that which Allah hath bestowed upon them, when Allah is ever Aware of them (and all they do)?
    translation: Pickthall
    original: وَمَاذَا عَلَيْهِمْ لَوْ ءَامَنُوا۟ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ وَأَنفَقُوا۟ مِمَّا رَزَقَهُمُ ٱللَّهُ ۚ وَكَانَ ٱللَّهُ بِهِمْ عَلِيمًا
    arabicPlain: وماذا عليهم لو آمنوا بالله واليوم الآخر وأنفقوا مما رزقهم الله ۚ وكان الله بهم عليما
