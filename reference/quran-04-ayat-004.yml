  data:
    ref: '4:55'
    scripture: quran
    name: Quran 4:55
    chapter: 4
    verse: 55
    ordinal: 548
    text: And of them were (some) who believed therein and of them were (some) who turned away from it. Hell is sufficient for (their) burning.
    translation: Pickthall
    original: فَمِنْهُم مَّنْ ءَامَنَ بِهِۦ وَمِنْهُم مَّن صَدَّ عَنْهُ ۚ وَكَفَىٰ بِجَهَنَّمَ سَعِيرًا
    arabicPlain: فمنهم من آمن به ومنهم من صد عنه ۚ وكفى بجهنم سعيرا
    surahName: An-Nisaa
    juz: 5
    manzil: 1
