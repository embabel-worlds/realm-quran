- type: Ayah
  data:
    ref: '45:35'
    scripture: quran
    name: Quran 45:35
    chapter: 45
    verse: 35
    ordinal: 4508
    text: This, forasmuch as ye made the revelations of Allah a jest, and the life of the world beguiled you. Therefor this day they come not forth from thence, nor can they make amends.
    translation: Pickthall
    original: ذَٰلِكُم بِأَنَّكُمُ ٱتَّخَذْتُمْ ءَايَـٰتِ ٱللَّهِ هُزُوًا وَغَرَّتْكُمُ ٱلْحَيَوٰةُ ٱلدُّنْيَا ۚ فَٱلْيَوْمَ لَا يُخْرَجُونَ مِنْهَا وَلَا هُمْ يُسْتَعْتَبُونَ
    arabicPlain: ذلكم بأنكم اتخذتم آيات الله هزوا وغرتكم الحياة الدنيا ۚ فاليوم لا يخرجون منها ولا هم يستعتبون
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 437
    page: 502
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '45'
  - predicate: IN_PORTION
    to:
      type: Juz
