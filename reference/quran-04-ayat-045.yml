  data:
    ref: '45:28'
    scripture: quran
    name: Quran 45:28
    chapter: 45
    verse: 28
    ordinal: 4501
    text: 'And thou wilt see each nation crouching, each nation summoned to its record. (And it will be said unto them): This day ye are requited what ye used to do.'
    translation: Pickthall
    original: وَتَرَىٰ كُلَّ أُمَّةٍ جَاثِيَةً ۚ كُلُّ أُمَّةٍ تُدْعَىٰٓ إِلَىٰ كِتَـٰبِهَا ٱلْيَوْمَ تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَ
    arabicPlain: وترى كل أمة جاثية ۚ كل أمة تدعى إلى كتابها اليوم تجزون ما كنتم تعملون
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 437
