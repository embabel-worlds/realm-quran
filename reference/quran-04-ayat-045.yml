  data:
    ref: '45:22'
    scripture: quran
    name: Quran 45:22
    chapter: 45
    verse: 22
    ordinal: 4495
    text: And Allah hath created the heavens and the earth with truth, and that every soul may be repaid what it hath earned. And they will not be wronged.
    translation: Pickthall
    original: وَخَلَقَ ٱللَّهُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ بِٱلْحَقِّ وَلِتُجْزَىٰ كُلُّ نَفْسٍۭ بِمَا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ
    arabicPlain: وخلق الله السماوات والأرض بالحق ولتجزى كل نفس بما كسبت وهم لا يظلمون
    surahName: Al-Jaathiya
