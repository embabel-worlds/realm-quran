  data:
    ref: '45:25'
    scripture: quran
    name: Quran 45:25
    chapter: 45
    verse: 25
    ordinal: 4498
    text: 'And when Our clear revelations are recited unto them their only argument is that they say: Bring (back) our fathers. then, if ye are truthful.'
    translation: Pickthall
    original: وَإِذَا تُتْلَىٰ عَلَيْهِمْ ءَايَـٰتُنَا بَيِّنَـٰتٍ مَّا كَانَ حُجَّتَهُمْ إِلَّآ أَن قَالُوا۟ ٱئْتُوا۟ بِـَٔابَآئِنَآ إِن كُنتُمْ صَـٰدِقِينَ
    arabicPlain: وإذا تتلى عليهم آياتنا بينات ما كان حجتهم إلا أن قالوا ائتوا بآبائنا إن كنتم صادقين
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 436
    page: 501
