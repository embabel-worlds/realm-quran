- type: Ayah
  data:
    ref: '45:36'
    scripture: quran
    name: Quran 45:36
    chapter: 45
    verse: 36
    ordinal: 4509
    text: Then praise be to Allah, Lord of the heavens and Lord of the earth, the Lord of the Worlds.
    translation: Pickthall
    original: فَلِلَّهِ ٱلْحَمْدُ رَبِّ ٱلسَّمَـٰوَٰتِ وَرَبِّ ٱلْأَرْضِ رَبِّ ٱلْعَـٰلَمِينَ
    arabicPlain: فلله الحمد رب السماوات ورب الأرض رب العالمين
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 437
    page: 502
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '45'
  - predicate: IN_PORTION
    to:
      type: Juz
