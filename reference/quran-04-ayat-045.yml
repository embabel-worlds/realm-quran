    chapter: 45
    verse: 20
    ordinal: 4493
    text: This is clear indication for mankind, and a guidance and a mercy for a folk whose faith is sure.
    translation: Pickthall
    original: هَـٰذَا بَصَـٰٓئِرُ لِلنَّاسِ وَهُدًى وَرَحْمَةٌ لِّقَوْمٍ يُوقِنُونَ
    arabicPlain: هذا بصائر للناس وهدى ورحمة لقوم يوقنون
