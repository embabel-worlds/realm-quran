  data:
    ref: '45:27'
    scripture: quran
    name: Quran 45:27
    chapter: 45
    verse: 27
    ordinal: 4500
    text: And unto Allah belongeth the Sovereignty of the heavens and the earth; and on the day when the Hour riseth, on that day those who follow falsehood will be lost.
    translation: Pickthall
    original: وَلِلَّهِ مُلْكُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۚ وَيَوْمَ تَقُومُ ٱلسَّاعَةُ يَوْمَئِذٍ يَخْسَرُ ٱلْمُبْطِلُونَ
    arabicPlain: ولله ملك السماوات والأرض ۚ ويوم تقوم الساعة يومئذ يخسر المبطلون
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 437
