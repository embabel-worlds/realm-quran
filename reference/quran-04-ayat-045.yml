- type: Ayah
  data:
    ref: '45:19'
    scripture: quran
    name: Quran 45:19
    chapter: 45
    verse: 19
    ordinal: 4492
    text: Lo! they can avail thee naught against Allah. And lo! as for the wrong-doers, some of them are friends of others; and Allah is the Friend of those who ward off (evil).
    translation: Pickthall
    original: إِنَّهُمْ لَن يُغْنُوا۟ عَنكَ مِنَ ٱللَّهِ شَيْـًٔا ۚ وَإِنَّ ٱلظَّـٰلِمِينَ بَعْضُهُمْ أَوْلِيَآءُ بَعْضٍ ۖ وَٱللَّهُ وَلِىُّ ٱلْمُتَّقِينَ
    arabicPlain: إنهم لن يغنوا عنك من الله شيئا ۚ وإن الظالمين بعضهم أولياء بعض ۖ والله ولي المتقين
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 435
    page: 500
