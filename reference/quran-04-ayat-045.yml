- type: Ayah
  data:
    ref: '45:8'
    scripture: quran
    name: Quran 45:8
    chapter: 45
    verse: 8
    ordinal: 4481
    text: Who heareth the revelations of Allah recited unto him, and then continueth in pride as though he heard them not. Give him tidings of a painful doom.
    translation: Pickthall
    original: يَسْمَعُ ءَايَـٰتِ ٱللَّهِ تُتْلَىٰ عَلَيْهِ ثُمَّ يُصِرُّ مُسْتَكْبِرًا كَأَن لَّمْ يَسْمَعْهَا ۖ فَبَشِّرْهُ بِعَذَابٍ أَلِيمٍ
    arabicPlain: يسمع آيات الله تتلى عليه ثم يصر مستكبرا كأن لم يسمعها ۖ فبشره بعذاب أليم
    surahName: Al-Jaathiya
    juz: 25
