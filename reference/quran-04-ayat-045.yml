  data:
    ref: '45:29'
    scripture: quran
    name: Quran 45:29
    chapter: 45
    verse: 29
    ordinal: 4502
    text: This Our Book pronounceth against you with truth. Lo! We have caused (all) that ye did to be recorded.
    translation: Pickthall
    original: هَـٰذَا كِتَـٰبُنَا يَنطِقُ عَلَيْكُم بِٱلْحَقِّ ۚ إِنَّا كُنَّا نَسْتَنسِخُ مَا كُنتُمْ تَعْمَلُونَ
    arabicPlain: هذا كتابنا ينطق عليكم بالحق ۚ إنا كنا نستنسخ ما كنتم تعملون
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 437
