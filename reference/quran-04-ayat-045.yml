- type: Ayah
  data:
    ref: '45:15'
    scripture: quran
    name: Quran 45:15
    chapter: 45
    verse: 15
    ordinal: 4488
    text: Whoso doeth right, it is for his soul, and whoso doeth wrong, it is against it. And afterward unto your Lord ye will be brought back.
    translation: Pickthall
    original: مَنْ عَمِلَ صَـٰلِحًا فَلِنَفْسِهِۦ ۖ وَمَنْ أَسَآءَ فَعَلَيْهَا ۖ ثُمَّ إِلَىٰ رَبِّكُمْ تُرْجَعُونَ
    arabicPlain: من عمل صالحا فلنفسه ۖ ومن أساء فعليها ۖ ثم إلى ربكم ترجعون
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 435
