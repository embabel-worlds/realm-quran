- type: Ayah
  data:
    ref: '45:12'
    scripture: quran
    name: Quran 45:12
    chapter: 45
    verse: 12
    ordinal: 4485
    text: Allah it is Who hath made the sea of service unto you that the ships may run thereon by His command, and that ye may seek of His bounty, and that haply ye may be thankful;
    translation: Pickthall
    original: ۞ ٱللَّهُ ٱلَّذِى سَخَّرَ لَكُمُ ٱلْبَحْرَ لِتَجْرِىَ ٱلْفُلْكُ فِيهِ بِأَمْرِهِۦ وَلِتَبْتَغُوا۟ مِن فَضْلِهِۦ وَلَعَلَّكُمْ تَشْكُرُونَ
    arabicPlain: ۞ الله الذي سخر لكم البحر لتجري الفلك فيه بأمره ولتبتغوا من فضله ولعلكم تشكرون
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 435
    page: 499
