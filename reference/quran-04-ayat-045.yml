  data:
    ref: '45:31'
    scripture: quran
    name: Quran 45:31
    chapter: 45
    verse: 31
    ordinal: 4504
    text: 'And as for those who disbelieved (it will be said unto them): Were not Our revelations recited unto you? But ye were scornful and became a guilty folk.'
    translation: Pickthall
    original: وَأَمَّا ٱلَّذِينَ كَفَرُوٓا۟ أَفَلَمْ تَكُنْ ءَايَـٰتِى تُتْلَىٰ عَلَيْكُمْ فَٱسْتَكْبَرْتُمْ وَكُنتُمْ قَوْمًا مُّجْرِمِينَ
    arabicPlain: وأما الذين كفروا أفلم تكن آياتي تتلى عليكم فاستكبرتم وكنتم قوما مجرمين
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 437
    page: 501
  relations:
  - predicate: IN
    to:
      type: Surah
