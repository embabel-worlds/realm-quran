- type: Ayah
  data:
    ref: '45:10'
    scripture: quran
    name: Quran 45:10
    chapter: 45
    verse: 10
    ordinal: 4483
    text: Beyond them there is hell, and that which they have earned will naught avail them, nor those whom they have chosen for protecting friends beside Allah. Theirs will be an awful doom.
    translation: Pickthall
    original: مِّن وَرَآئِهِمْ جَهَنَّمُ ۖ وَلَا يُغْنِى عَنْهُم مَّا كَسَبُوا۟ شَيْـًٔا وَلَا مَا ٱتَّخَذُوا۟ مِن دُونِ ٱللَّهِ أَوْلِيَآءَ ۖ وَلَهُمْ عَذَابٌ عَظِيمٌ
    arabicPlain: من ورائهم جهنم ۖ ولا يغني عنهم ما كسبوا شيئا ولا ما اتخذوا من دون الله أولياء ۖ ولهم عذاب عظيم
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 434
    page: 499
