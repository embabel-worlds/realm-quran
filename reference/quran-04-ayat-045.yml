- type: Ayah
  data:
    ref: '45:11'
    scripture: quran
    name: Quran 45:11
    chapter: 45
    verse: 11
    ordinal: 4484
    text: This is guidance. And those who disbelieve the revelations of their Lord, for them there is a painful doom of wrath.
    translation: Pickthall
    original: هَـٰذَا هُدًى ۖ وَٱلَّذِينَ كَفَرُوا۟ بِـَٔايَـٰتِ رَبِّهِمْ لَهُمْ عَذَابٌ مِّن رِّجْزٍ أَلِيمٌ
    arabicPlain: هذا هدى ۖ والذين كفروا بآيات ربهم لهم عذاب من رجز أليم
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 434
    page: 499
