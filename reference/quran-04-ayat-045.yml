- type: Ayah
  data:
    ref: '45:9'
    scripture: quran
    name: Quran 45:9
    chapter: 45
    verse: 9
    ordinal: 4482
    text: And when he knoweth aught of Our revelations he maketh it a jest. For such there is a shameful doom.
    translation: Pickthall
    original: وَإِذَا عَلِمَ مِنْ ءَايَـٰتِنَا شَيْـًٔا ٱتَّخَذَهَا هُزُوًا ۚ أُو۟لَـٰٓئِكَ لَهُمْ عَذَابٌ مُّهِينٌ
    arabicPlain: وإذا علم من آياتنا شيئا اتخذها هزوا ۚ أولئك لهم عذاب مهين
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 434
