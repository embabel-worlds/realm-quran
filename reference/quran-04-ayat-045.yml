  data:
    ref: '45:30'
    scripture: quran
    name: Quran 45:30
    chapter: 45
    verse: 30
    ordinal: 4503
    text: Then, as for those who believed and did good works, their Lord will bring them in unto His mercy. That is the evident triumph.
    translation: Pickthall
    original: فَأَمَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ فَيُدْخِلُهُمْ رَبُّهُمْ فِى رَحْمَتِهِۦ ۚ ذَٰلِكَ هُوَ ٱلْفَوْزُ ٱلْمُبِينُ
    arabicPlain: فأما الذين آمنوا وعملوا الصالحات فيدخلهم ربهم في رحمته ۚ ذلك هو الفوز المبين
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 437
    page: 501
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '45'
  - predicate: IN_PORTION
    to:
