  data:
    ref: '45:32'
    scripture: quran
    name: Quran 45:32
    chapter: 45
    verse: 32
    ordinal: 4505
    text: 'And when it was said: Lo! Allah''s promise is the truth, and there is no doubt of the Hour''s coming, ye said: We know not what the Hour is. We deem it naught but a conjecture, and we are by no means convinced.'
    translation: Pickthall
    original: وَإِذَا قِيلَ إِنَّ وَعْدَ ٱللَّهِ حَقٌّ وَٱلسَّاعَةُ لَا رَيْبَ فِيهَا قُلْتُم مَّا نَدْرِى مَا ٱلسَّاعَةُ إِن نَّظُنُّ إِلَّا ظَنًّا وَمَا نَحْنُ بِمُسْتَيْقِنِينَ
    arabicPlain: وإذا قيل إن وعد الله حق والساعة لا ريب فيها قلتم ما ندري ما الساعة إن نظن إلا ظنا وما نحن بمستيقنين
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 437
    page: 501
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '45'
  - predicate: IN_PORTION
    to:
