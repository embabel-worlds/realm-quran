- type: Ayah
  data:
    ref: '45:33'
    scripture: quran
    name: Quran 45:33
    chapter: 45
    verse: 33
    ordinal: 4506
    text: And the evils of what they did will appear unto them, and that which they used to deride will befall them.
    translation: Pickthall
    original: وَبَدَا لَهُمْ سَيِّـَٔاتُ مَا عَمِلُوا۟ وَحَاقَ بِهِم مَّا كَانُوا۟ بِهِۦ يَسْتَهْزِءُونَ
    arabicPlain: وبدا لهم سيئات ما عملوا وحاق بهم ما كانوا به يستهزئون
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 437
    page: 502
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '45'
  - predicate: IN_PORTION
    to:
