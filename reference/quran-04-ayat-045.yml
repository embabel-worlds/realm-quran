  data:
    ref: '45:18'
    scripture: quran
    name: Quran 45:18
    chapter: 45
    verse: 18
    ordinal: 4491
    text: And now have We set thee (O Muhammad) on a clear road of (Our) commandment; so follow it, and follow not the whims of those who know not.
    translation: Pickthall
    original: ثُمَّ جَعَلْنَـٰكَ عَلَىٰ شَرِيعَةٍ مِّنَ ٱلْأَمْرِ فَٱتَّبِعْهَا وَلَا تَتَّبِعْ أَهْوَآءَ ٱلَّذِينَ لَا يَعْلَمُونَ
    arabicPlain: ثم جعلناك على شريعة من الأمر فاتبعها ولا تتبع أهواء الذين لا يعلمون
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 435
    page: 500
  relations:
  - predicate: IN
    to:
      type: Surah
