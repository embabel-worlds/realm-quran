  data:
    ref: '45:16'
    scripture: quran
    name: Quran 45:16
    chapter: 45
    verse: 16
    ordinal: 4489
    text: And verily we gave the Children of Israel the Scripture and the Command and the Prophethood, and provided them with good things and favoured them above (all) peoples;
    translation: Pickthall
    original: وَلَقَدْ ءَاتَيْنَا بَنِىٓ إِسْرَٰٓءِيلَ ٱلْكِتَـٰبَ وَٱلْحُكْمَ وَٱلنُّبُوَّةَ وَرَزَقْنَـٰهُم مِّنَ ٱلطَّيِّبَـٰتِ وَفَضَّلْنَـٰهُمْ عَلَى ٱلْعَـٰلَمِينَ
    arabicPlain: ولقد آتينا بني إسرائيل الكتاب والحكم والنبوة ورزقناهم من الطيبات وفضلناهم على العالمين
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 435
    page: 500
