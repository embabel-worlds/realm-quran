  data:
    ref: '45:24'
    scripture: quran
    name: Quran 45:24
    chapter: 45
    verse: 24
    ordinal: 4497
    text: 'And they say: There is naught but our life of the world; we die and we live, and naught destroyeth us save time; when they have no knowledge whatsoever of (all) that; they do but guess.'
    translation: Pickthall
    original: وَقَالُوا۟ مَا هِىَ إِلَّا حَيَاتُنَا ٱلدُّنْيَا نَمُوتُ وَنَحْيَا وَمَا يُهْلِكُنَآ إِلَّا ٱلدَّهْرُ ۚ وَمَا لَهُم بِذَٰلِكَ مِنْ عِلْمٍ ۖ إِنْ هُمْ إِلَّا يَظُنُّونَ
    arabicPlain: وقالوا ما هي إلا حياتنا الدنيا نموت ونحيا وما يهلكنا إلا الدهر ۚ وما لهم بذلك من علم ۖ إن هم إلا يظنون
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 436
    page: 501
