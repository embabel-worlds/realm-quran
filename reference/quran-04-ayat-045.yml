- type: Ayah
  data:
    ref: '45:14'
    scripture: quran
    name: Quran 45:14
    chapter: 45
    verse: 14
    ordinal: 4487
    text: Tell those who believe to forgive those who hope not for the days of Allah; in order that He may requite folk what they used to earn.
    translation: Pickthall
    original: قُل لِّلَّذِينَ ءَامَنُوا۟ يَغْفِرُوا۟ لِلَّذِينَ لَا يَرْجُونَ أَيَّامَ ٱللَّهِ لِيَجْزِىَ قَوْمًۢا بِمَا كَانُوا۟ يَكْسِبُونَ
    arabicPlain: قل للذين آمنوا يغفروا للذين لا يرجون أيام الله ليجزي قوما بما كانوا يكسبون
    surahName: Al-Jaathiya
    juz: 25
