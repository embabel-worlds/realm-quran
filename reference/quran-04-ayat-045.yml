  data:
    ref: '45:37'
    scripture: quran
    name: Quran 45:37
    chapter: 45
    verse: 37
    ordinal: 4510
    text: And unto Him (alone) belongeth Majesty in the heavens and the earth, and He is the Mighty, the Wise.
    translation: Pickthall
    original: وَلَهُ ٱلْكِبْرِيَآءُ فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ
    arabicPlain: وله الكبرياء في السماوات والأرض ۖ وهو العزيز الحكيم
