    scripture: quran
    name: Quran 45:4
    chapter: 45
    verse: 4
    ordinal: 4477
    text: And in your creation, and all the beasts that He scattereth in the earth, are portents for a folk whose faith is sure.
    translation: Pickthall
    original: وَفِى خَلْقِكُمْ وَمَا يَبُثُّ مِن دَآبَّةٍ ءَايَـٰتٌ لِّقَوْمٍ يُوقِنُونَ
