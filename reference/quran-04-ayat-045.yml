- type: Ayah
  data:
    ref: '45:34'
    scripture: quran
    name: Quran 45:34
    chapter: 45
    verse: 34
    ordinal: 4507
    text: 'And it will be said: This day We forget you, even as ye forgot the meeting of this your day; and your habitation is the Fire, and there is none to help you.'
    translation: Pickthall
    original: وَقِيلَ ٱلْيَوْمَ نَنسَىٰكُمْ كَمَا نَسِيتُمْ لِقَآءَ يَوْمِكُمْ هَـٰذَا وَمَأْوَىٰكُمُ ٱلنَّارُ وَمَا لَكُم مِّن نَّـٰصِرِينَ
    arabicPlain: وقيل اليوم ننساكم كما نسيتم لقاء يومكم هذا ومأواكم النار وما لكم من ناصرين
    surahName: Al-Jaathiya
    juz: 25
    manzil: 6
    ruku: 437
    page: 502
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '45'
  - predicate: IN_PORTION
    to:
      type: Juz
