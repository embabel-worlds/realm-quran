- type: Ayah
  data:
    ref: '45:13'
    scripture: quran
    name: Quran 45:13
    chapter: 45
    verse: 13
    ordinal: 4486
    text: And hath made of service unto you whatsoever is in the heavens and whatsoever is in the earth; it is all from Him. Lo! herein verily are portents for a people who reflect.
    translation: Pickthall
    original: وَسَخَّرَ لَكُم مَّا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ جَمِيعًا مِّنْهُ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍ لِّقَوْمٍ يَتَفَكَّرُونَ
    arabicPlain: وسخر لكم ما في السماوات وما في الأرض جميعا منه ۚ إن في ذلك لآيات لقوم يتفكرون
    surahName: Al-Jaathiya
    juz: 25
