  data:
    ref: 39:60
    scripture: quran
    name: Quran 39:60
    chapter: 39
    verse: 60
    ordinal: 4118
    text: And on the Day of Resurrection thou (Muhammad) seest those who lied concerning Allah with their faces blackened. Is not the home of the scorners in hell?
    translation: Pickthall
    original: وَيَوْمَ ٱلْقِيَـٰمَةِ تَرَى ٱلَّذِينَ كَذَبُوا۟ عَلَى ٱللَّهِ وُجُوهُهُم مُّسْوَدَّةٌ ۚ أَلَيْسَ فِى جَهَنَّمَ مَثْوًى لِّلْمُتَكَبِّرِينَ
    arabicPlain: ويوم القيامة ترى الذين كذبوا على الله وجوههم مسودة ۚ أليس في جهنم مثوى للمتكبرين
