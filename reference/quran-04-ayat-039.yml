- type: Ayah
  data:
    ref: '39:4'
    scripture: quran
    name: Quran 39:4
    chapter: 39
    verse: 4
    ordinal: 4062
    text: If Allah had willed to choose a son, He could have chosen what He would of that which He hath created. Be He Glorified! He is Allah, the One, the Absolute.
    translation: Pickthall
    original: لَّوْ أَرَادَ ٱللَّهُ أَن يَتَّخِذَ وَلَدًا لَّٱصْطَفَىٰ مِمَّا يَخْلُقُ مَا يَشَآءُ ۚ سُبْحَـٰنَهُۥ ۖ هُوَ ٱللَّهُ ٱلْوَٰحِدُ ٱلْقَهَّارُ
    arabicPlain: لو أراد الله أن يتخذ ولدا لاصطفى مما يخلق ما يشاء ۚ سبحانه ۖ هو الله الواحد القهار
    surahName: Az-Zumar
    juz: 23
    manzil: 6
    ruku: 396
    page: 458
