  data:
    ref: '39:59'
    scripture: quran
    name: Quran 39:59
    chapter: 39
    verse: 59
    ordinal: 4117
    text: '(But now the answer will be): Nay, for My revelations came unto thee, but thou didst deny them and wast scornful and wast among the disbelievers.'
    translation: Pickthall
    original: بَلَىٰ قَدْ جَآءَتْكَ ءَايَـٰتِى فَكَذَّبْتَ بِهَا وَٱسْتَكْبَرْتَ وَكُنتَ مِنَ ٱلْكَـٰفِرِينَ
    arabicPlain: بلى قد جاءتك آياتي فكذبت بها واستكبرت وكنت من الكافرين
