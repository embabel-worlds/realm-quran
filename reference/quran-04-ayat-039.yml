    name: Quran 39:39
    chapter: 39
    verse: 39
    ordinal: 4097
    text: 'Say: O my people! Act in your manner. Lo! I (too) am acting. Thus ye will come to know'
    translation: Pickthall
    original: قُلْ يَـٰقَوْمِ ٱعْمَلُوا۟ عَلَىٰ مَكَانَتِكُمْ إِنِّى عَـٰمِلٌ ۖ فَسَوْفَ تَعْلَمُونَ
    arabicPlain: قل يا قوم اعملوا على مكانتكم إني عامل ۖ فسوف تعلمون
