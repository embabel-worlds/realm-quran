    scripture: quran
    name: Quran 39:57
    chapter: 39
    verse: 57
    ordinal: 4115
    text: 'Or should say: If Allah had but guided me I should have been among the dutiful!'
    translation: Pickthall
    original: أَوْ تَقُولَ لَوْ أَنَّ ٱللَّهَ هَدَىٰنِى لَكُنتُ مِنَ ٱلْمُتَّقِينَ
