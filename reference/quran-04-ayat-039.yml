    name: Quran 39:64
    chapter: 39
    verse: 64
    ordinal: 4122
    text: 'Say (O Muhammad, to the disbelievers): Do ye bid me serve other than Allah? O ye fools!'
    translation: Pickthall
    original: قُلْ أَفَغَيْرَ ٱللَّهِ تَأْمُرُوٓنِّىٓ أَعْبُدُ أَيُّهَا ٱلْجَـٰهِلُونَ
    arabicPlain: قل أفغير الله تأمروني أعبد أيها الجاهلون
