  data:
    ref: '39:43'
    scripture: quran
    name: Quran 39:43
    chapter: 39
    verse: 43
    ordinal: 4101
    text: 'Or choose they intercessors other than Allah? Say: What! Even though they have power over nothing and have no intelligence?'
    translation: Pickthall
    original: أَمِ ٱتَّخَذُوا۟ مِن دُونِ ٱللَّهِ شُفَعَآءَ ۚ قُلْ أَوَلَوْ كَانُوا۟ لَا يَمْلِكُونَ شَيْـًٔا وَلَا يَعْقِلُونَ
    arabicPlain: أم اتخذوا من دون الله شفعاء ۚ قل أولو كانوا لا يملكون شيئا ولا يعقلون
    surahName: Az-Zumar
    juz: 24
    manzil: 6
    ruku: 400
    page: 463
