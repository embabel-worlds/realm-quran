    name: Quran 39:61
    chapter: 39
    verse: 61
    ordinal: 4119
    text: And Allah delivereth those who ward off (evil) because of their deserts. Evil toucheth them not, nor do they grieve.
    translation: Pickthall
    original: وَيُنَجِّى ٱللَّهُ ٱلَّذِينَ ٱتَّقَوْا۟ بِمَفَازَتِهِمْ لَا يَمَسُّهُمُ ٱلسُّوٓءُ وَلَا هُمْ يَحْزَنُونَ
    arabicPlain: وينجي الله الذين اتقوا بمفازتهم لا يمسهم السوء ولا هم يحزنون
    surahName: Az-Zumar
    juz: 24
    manzil: 6
