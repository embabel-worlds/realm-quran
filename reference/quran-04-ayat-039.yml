  data:
    ref: '39:31'
    scripture: quran
    name: Quran 39:31
    chapter: 39
    verse: 31
    ordinal: 4089
    text: Then lo! on the Day of Resurrection, before your Lord ye will dispute.
    translation: Pickthall
    original: ثُمَّ إِنَّكُمْ يَوْمَ ٱلْقِيَـٰمَةِ عِندَ رَبِّكُمْ تَخْتَصِمُونَ
    arabicPlain: ثم إنكم يوم القيامة عند ربكم تختصمون
    surahName: Az-Zumar
    juz: 23
    manzil: 6
    ruku: 398
    page: 461
  relations:
