- type: Ayah
  data:
    ref: '39:10'
    scripture: quran
    name: Quran 39:10
    chapter: 39
    verse: 10
    ordinal: 4068
    text: 'Say: O My bondmen who believe! Observe your duty to your Lord. For those who do good in this world there is good, and Allah''s earth is spacious. Verily the steadfast will be paid their wages without stint.'
    translation: Pickthall
    original: قُلْ يَـٰعِبَادِ ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ رَبَّكُمْ ۚ لِلَّذِينَ أَحْسَنُوا۟ فِى هَـٰذِهِ ٱلدُّنْيَا حَسَنَةٌ ۗ وَأَرْضُ ٱللَّهِ وَٰسِعَةٌ ۗ إِنَّمَا يُوَفَّى ٱلصَّـٰبِرُونَ أَجْرَهُم بِغَيْرِ حِسَابٍ
    arabicPlain: قل يا عباد الذين آمنوا اتقوا ربكم ۚ للذين أحسنوا في هذه الدنيا حسنة ۗ وأرض الله واسعة ۗ إنما يوفى الصابرون أجرهم بغير حساب
    surahName: Az-Zumar
    juz: 23
    manzil: 6
    ruku: 397
    page: 459
  relations:
