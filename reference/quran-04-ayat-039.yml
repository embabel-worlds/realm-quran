    scripture: quran
    name: Quran 39:16
    chapter: 39
    verse: 16
    ordinal: 4074
    text: They have an awning of fire above them and beneath them a dais (of fire). With this doth Allah appal His bondmen. O My bondmen, therefor fear Me!
    translation: Pickthall
    original: لَهُم مِّن فَوْقِهِمْ ظُلَلٌ مِّنَ ٱلنَّارِ وَمِن تَحْتِهِمْ ظُلَلٌ ۚ ذَٰلِكَ يُخَوِّفُ ٱللَّهُ بِهِۦ عِبَادَهُۥ ۚ يَـٰعِبَادِ فَٱتَّقُونِ
    arabicPlain: لهم من فوقهم ظلل من النار ومن تحتهم ظلل ۚ ذلك يخوف الله به عباده ۚ يا عباد فاتقون
