  data:
    ref: '39:24'
    scripture: quran
    name: Quran 39:24
    chapter: 39
    verse: 24
    ordinal: 4082
    text: 'Is he then, who will strike his face against the awful doom upon the Day of Resurrection (as he who doeth right)? And it will be said unto the wrong-doers: Taste what ye used to earn.'
    translation: Pickthall
    original: أَفَمَن يَتَّقِى بِوَجْهِهِۦ سُوٓءَ ٱلْعَذَابِ يَوْمَ ٱلْقِيَـٰمَةِ ۚ وَقِيلَ لِلظَّـٰلِمِينَ ذُوقُوا۟ مَا كُنتُمْ تَكْسِبُونَ
    arabicPlain: أفمن يتقي بوجهه سوء العذاب يوم القيامة ۚ وقيل للظالمين ذوقوا ما كنتم تكسبون
    surahName: Az-Zumar
    juz: 23
    manzil: 6
    ruku: 398
    page: 461
