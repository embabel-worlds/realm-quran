  data:
    ref: '39:41'
    scripture: quran
    name: Quran 39:41
    chapter: 39
    verse: 41
    ordinal: 4099
    text: Lo! We have revealed unto thee (Muhammad) the Scripture for mankind with truth. Then whosoever goeth right it is for his soul, and whosoever strayeth, strayeth only to its hurt. And thou art not a warder over them.
    translation: Pickthall
    original: إِنَّآ أَنزَلْنَا عَلَيْكَ ٱلْكِتَـٰبَ لِلنَّاسِ بِٱلْحَقِّ ۖ فَمَنِ ٱهْتَدَىٰ فَلِنَفْسِهِۦ ۖ وَمَن ضَلَّ فَإِنَّمَا يَضِلُّ عَلَيْهَا ۖ وَمَآ أَنتَ عَلَيْهِم بِوَكِيلٍ
    arabicPlain: إنا أنزلنا عليك الكتاب للناس بالحق ۖ فمن اهتدى فلنفسه ۖ ومن ضل فإنما يضل عليها ۖ وما أنت عليهم بوكيل
    surahName: Az-Zumar
    juz: 24
