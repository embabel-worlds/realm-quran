- type: Ayah
  data:
    ref: '39:5'
    scripture: quran
    name: Quran 39:5
    chapter: 39
    verse: 5
    ordinal: 4063
    text: He hath created the heavens and the earth with truth. He maketh night to succeed day, and He maketh day to succeed night, and He constraineth the sun and the moon to give service, each running on for an appointed term. Is not He the Mighty, the Forgiver?
    translation: Pickthall
    original: خَلَقَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ بِٱلْحَقِّ ۖ يُكَوِّرُ ٱلَّيْلَ عَلَى ٱلنَّهَارِ وَيُكَوِّرُ ٱلنَّهَارَ عَلَى ٱلَّيْلِ ۖ وَسَخَّرَ ٱلشَّمْسَ وَٱلْقَمَرَ ۖ كُلٌّ يَجْرِى لِأَجَلٍ مُّسَمًّى ۗ أَلَا هُوَ ٱلْعَزِيزُ ٱلْغَفَّـٰرُ
    arabicPlain: خلق السماوات والأرض بالحق ۖ يكور الليل على النهار ويكور النهار على الليل ۖ وسخر الشمس والقمر ۖ كل يجري لأجل مسمى ۗ ألا هو العزيز الغفار
    surahName: Az-Zumar
    juz: 23
    manzil: 6
    ruku: 396
    page: 458
  relations:
