  data:
    ref: '39:47'
    scripture: quran
    name: Quran 39:47
    chapter: 39
    verse: 47
    ordinal: 4105
    text: And though those who do wrong possess all that is in the earth, and therewith as much again, they verily will seek to ransom themselves therewith on the Day of Resurrection from the awful doom; and there will appear unto them, from their Lord, that wherewith they never reckoned.
    translation: Pickthall
    original: وَلَوْ أَنَّ لِلَّذِينَ ظَلَمُوا۟ مَا فِى ٱلْأَرْضِ جَمِيعًا وَمِثْلَهُۥ مَعَهُۥ لَٱفْتَدَوْا۟ بِهِۦ مِن سُوٓءِ ٱلْعَذَابِ يَوْمَ ٱلْقِيَـٰمَةِ ۚ وَبَدَا لَهُم مِّنَ ٱللَّهِ مَا لَمْ يَكُونُوا۟ يَحْتَسِبُونَ
    arabicPlain: ولو أن للذين ظلموا ما في الأرض جميعا ومثله معه لافتدوا به من سوء العذاب يوم القيامة ۚ وبدا لهم من الله ما لم يكونوا يحتسبون
    surahName: Az-Zumar
    juz: 24
    manzil: 6
    ruku: 400
    page: 463
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '39'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-24
- type: Ayah
  data:
    ref: '39:48'
    scripture: quran
    name: Quran 39:48
    chapter: 39
    verse: 48
    ordinal: 4106
    text: And the evils that they earned will appear unto them, and that whereat they used to scoff will surround them.
    translation: Pickthall
    original: وَبَدَا لَهُمْ سَيِّـَٔاتُ مَا كَسَبُوا۟ وَحَاقَ بِهِم مَّا كَانُوا۟ بِهِۦ يَسْتَهْزِءُونَ
    arabicPlain: وبدا لهم سيئات ما كسبوا وحاق بهم ما كانوا به يستهزئون
    surahName: Az-Zumar
    juz: 24
    manzil: 6
    ruku: 400
    page: 464
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '39'
  - predicate: IN_PORTION
    to:
