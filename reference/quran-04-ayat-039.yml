    scripture: quran
    name: Quran 39:37
    chapter: 39
    verse: 37
    ordinal: 4095
    text: And he whom Allah guideth, for him there can be no misleader. Is not Allah Mighty, Able to Requite (the wrong)?
    translation: Pickthall
    original: وَمَن يَهْدِ ٱللَّهُ فَمَا لَهُۥ مِن مُّضِلٍّ ۗ أَلَيْسَ ٱللَّهُ بِعَزِيزٍ ذِى ٱنتِقَامٍ
