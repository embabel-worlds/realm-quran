    name: Quran 39:40
    chapter: 39
    verse: 40
    ordinal: 4098
    text: Who it is unto whom cometh a doom that will abase him, and on whom there falleth everlasting doom.
    translation: Pickthall
    original: مَن يَأْتِيهِ عَذَابٌ يُخْزِيهِ وَيَحِلُّ عَلَيْهِ عَذَابٌ مُّقِيمٌ
