  data:
    ref: '39:25'
    scripture: quran
    name: Quran 39:25
    chapter: 39
    verse: 25
    ordinal: 4083
    text: Those before them denied, and so the doom came on them whence they knew not.
    translation: Pickthall
    original: كَذَّبَ ٱلَّذِينَ مِن قَبْلِهِمْ فَأَتَىٰهُمُ ٱلْعَذَابُ مِنْ حَيْثُ لَا يَشْعُرُونَ
    arabicPlain: كذب الذين من قبلهم فأتاهم العذاب من حيث لا يشعرون
    surahName: Az-Zumar
    juz: 23
    manzil: 6
    ruku: 398
    page: 461
