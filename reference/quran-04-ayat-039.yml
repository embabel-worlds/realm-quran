  data:
    ref: '39:29'
    scripture: quran
    name: Quran 39:29
    chapter: 39
    verse: 29
    ordinal: 4087
    text: 'Allah coineth a similitude: A man in relation to whom are several part-owners, quarrelling, and a man belonging wholly to one man. Are the two equal in similitude? Praise be to Allah! But most of them know not.'
    translation: Pickthall
    original: ضَرَبَ ٱللَّهُ مَثَلًا رَّجُلًا فِيهِ شُرَكَآءُ مُتَشَـٰكِسُونَ وَرَجُلًا سَلَمًا لِّرَجُلٍ هَلْ يَسْتَوِيَانِ مَثَلًا ۚ ٱلْحَمْدُ لِلَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ
    arabicPlain: ضرب الله مثلا رجلا فيه شركاء متشاكسون ورجلا سلما لرجل هل يستويان مثلا ۚ الحمد لله ۚ بل أكثرهم لا يعلمون
    surahName: Az-Zumar
    juz: 23
    manzil: 6
    ruku: 398
