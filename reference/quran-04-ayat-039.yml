    chapter: 39
    verse: 35
    ordinal: 4093
    text: That Allah will remit from them the worst of what they did, and will pay them for reward the best they used to do.
    translation: Pickthall
    original: لِيُكَفِّرَ ٱللَّهُ عَنْهُمْ أَسْوَأَ ٱلَّذِى عَمِلُوا۟ وَيَجْزِيَهُمْ أَجْرَهُم بِأَحْسَنِ ٱلَّذِى كَانُوا۟ يَعْمَلُونَ
