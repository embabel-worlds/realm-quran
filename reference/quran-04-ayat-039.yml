  data:
    ref: 39:63
    scripture: quran
    name: Quran 39:63
    chapter: 39
    verse: 63
    ordinal: 4121
    text: His are the keys of the heavens and the earth, and they who disbelieve the revelations of Allah - such are they who are the losers.
    translation: Pickthall
    original: لَّهُۥ مَقَالِيدُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۗ وَٱلَّذِينَ كَفَرُوا۟ بِـَٔايَـٰتِ ٱللَّهِ أُو۟لَـٰٓئِكَ هُمُ ٱلْخَـٰسِرُونَ
