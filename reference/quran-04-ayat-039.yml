  data:
    ref: '39:32'
    scripture: quran
    name: Quran 39:32
    chapter: 39
    verse: 32
    ordinal: 4090
    text: And who doth greater wrong than he who telleth a lie against Allah, and denieth the truth when it reacheth him? Will not the home of disbelievers be in hell?
    translation: Pickthall
    original: ۞ فَمَنْ أَظْلَمُ مِمَّن كَذَبَ عَلَى ٱللَّهِ وَكَذَّبَ بِٱلصِّدْقِ إِذْ جَآءَهُۥٓ ۚ أَلَيْسَ فِى جَهَنَّمَ مَثْوًى لِّلْكَـٰفِرِينَ
    arabicPlain: ۞ فمن أظلم ممن كذب على الله وكذب بالصدق إذ جاءه ۚ أليس في جهنم مثوى للكافرين
    surahName: Az-Zumar
    juz: 24
    manzil: 6
    ruku: 399
    page: 462
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '39'
