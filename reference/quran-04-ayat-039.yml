    scripture: quran
    name: Quran 39:56
    chapter: 39
    verse: 56
    ordinal: 4114
    text: 'Lest any soul should say: Alas, my grief that I was unmindful of Allah, and I was indeed among the scoffers!'
    translation: Pickthall
    original: أَن تَقُولَ نَفْسٌ يَـٰحَسْرَتَىٰ عَلَىٰ مَا فَرَّطتُ فِى جَنۢبِ ٱللَّهِ وَإِن كُنتُ لَمِنَ ٱلسَّـٰخِرِينَ
    arabicPlain: أن تقول نفس يا حسرتى على ما فرطت في جنب الله وإن كنت لمن الساخرين
