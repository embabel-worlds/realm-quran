  data:
    ref: '39:46'
    scripture: quran
    name: Quran 39:46
    chapter: 39
    verse: 46
    ordinal: 4104
    text: 'Say: O Allah! Creator of the heavens and the earth! Knower of the Invisible and the Visible! Thou wilt judge between Thy slaves concerning that wherein they used to differ.'
    translation: Pickthall
    original: قُلِ ٱللَّهُمَّ فَاطِرَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ عَـٰلِمَ ٱلْغَيْبِ وَٱلشَّهَـٰدَةِ أَنتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِى مَا كَانُوا۟ فِيهِ يَخْتَلِفُونَ
    arabicPlain: قل اللهم فاطر السماوات والأرض عالم الغيب والشهادة أنت تحكم بين عبادك في ما كانوا فيه يختلفون
    surahName: Az-Zumar
    juz: 24
    manzil: 6
    ruku: 400
    page: 463
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '39'
  - predicate: IN_PORTION
