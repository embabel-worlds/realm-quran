    chapter: 39
    verse: 36
    ordinal: 4094
    text: Will not Allah defend His slave? Yet they would frighten thee with those beside Him. He whom Allah sendeth astray, for him there is no guide.
    translation: Pickthall
    original: أَلَيْسَ ٱللَّهُ بِكَافٍ عَبْدَهُۥ ۖ وَيُخَوِّفُونَكَ بِٱلَّذِينَ مِن دُونِهِۦ ۚ وَمَن يُضْلِلِ ٱللَّهُ فَمَا لَهُۥ مِنْ هَادٍ
    arabicPlain: أليس الله بكاف عبده ۖ ويخوفونك بالذين من دونه ۚ ومن يضلل الله فما له من هاد
