- type: Ayah
  data:
    ref: '39:6'
    scripture: quran
    name: Quran 39:6
    chapter: 39
    verse: 6
    ordinal: 4064
    text: He created you from one being, then from that (being) He made its mate; and He hath provided for you of cattle eight kinds. He created you in the wombs of your mothers, creation after creation, in a threefold gloom. Such is Allah, your Lord. His is the Sovereignty. There is no Allah save Him. How then are ye turned away?
    translation: Pickthall
    original: خَلَقَكُم مِّن نَّفْسٍ وَٰحِدَةٍ ثُمَّ جَعَلَ مِنْهَا زَوْجَهَا وَأَنزَلَ لَكُم مِّنَ ٱلْأَنْعَـٰمِ ثَمَـٰنِيَةَ أَزْوَٰجٍ ۚ يَخْلُقُكُمْ فِى بُطُونِ أُمَّهَـٰتِكُمْ خَلْقًا مِّنۢ بَعْدِ خَلْقٍ فِى ظُلُمَـٰتٍ ثَلَـٰثٍ ۚ ذَٰلِكُمُ ٱللَّهُ رَبُّكُمْ لَهُ ٱلْمُلْكُ ۖ لَآ إِلَـٰهَ إِلَّا هُوَ ۖ فَأَنَّىٰ تُصْرَفُونَ
    arabicPlain: خلقكم من نفس واحدة ثم جعل منها زوجها وأنزل لكم من الأنعام ثمانية أزواج ۚ يخلقكم في بطون أمهاتكم خلقا من بعد خلق في ظلمات ثلاث ۚ ذلكم الله ربكم له الملك ۖ لا إله إلا هو ۖ فأنى تصرفون
    surahName: Az-Zumar
    juz: 23
    manzil: 6
    ruku: 396
    page: 459
