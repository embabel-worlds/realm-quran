    scripture: quran
    name: Quran 39:28
    chapter: 39
    verse: 28
    ordinal: 4086
    text: A Lecture in Arabic, containing no crookedness, that haply they may ward off (evil).
    translation: Pickthall
    original: قُرْءَانًا عَرَبِيًّا غَيْرَ ذِى عِوَجٍ لَّعَلَّهُمْ يَتَّقُونَ
    arabicPlain: قرآنا عربيا غير ذي عوج لعلهم يتقون
    surahName: Az-Zumar
    juz: 23
    manzil: 6
    ruku: 398
