  data:
    ref: 39:68
    scripture: quran
    name: Quran 39:68
    chapter: 39
    verse: 68
    ordinal: 4126
    text: And the trumpet is blown, and all who are in the heavens and all who are in the earth swoon away, save him whom Allah willeth. Then it is blown a second time, and behold them standing waiting!
    translation: Pickthall
    original: وَنُفِخَ فِى ٱلصُّورِ فَصَعِقَ مَن فِى ٱلسَّمَـٰوَٰتِ وَمَن فِى ٱلْأَرْضِ إِلَّا مَن شَآءَ ٱللَّهُ ۖ ثُمَّ نُفِخَ فِيهِ أُخْرَىٰ فَإِذَا هُمْ قِيَامٌ يَنظُرُونَ
    arabicPlain: ونفخ في الصور فصعق من في السماوات ومن في الأرض إلا من شاء الله ۖ ثم نفخ فيه أخرى فإذا هم قيام ينظرون
    surahName: Az-Zumar
    juz: 24
    manzil: 6
    ruku: 402
    page: 466
