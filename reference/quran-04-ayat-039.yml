    scripture: quran
    name: Quran 39:54
    chapter: 39
    verse: 54
    ordinal: 4112
    text: Turn unto your Lord repentant, and surrender unto Him, before there come unto you the doom, when ye cannot be helped.
    translation: Pickthall
    original: وَأَنِيبُوٓا۟ إِلَىٰ رَبِّكُمْ وَأَسْلِمُوا۟ لَهُۥ مِن قَبْلِ أَن يَأْتِيَكُمُ ٱلْعَذَابُ ثُمَّ لَا تُنصَرُونَ
    arabicPlain: وأنيبوا إلى ربكم وأسلموا له من قبل أن يأتيكم العذاب ثم لا تنصرون
