  data:
    ref: '39:44'
    scripture: quran
    name: Quran 39:44
    chapter: 39
    verse: 44
    ordinal: 4102
    text: 'Say: Unto Allah belongeth all intercession. His is the Sovereignty of the heavens and the earth. And afterward unto Him ye will be brought back.'
    translation: Pickthall
    original: قُل لِّلَّهِ ٱلشَّفَـٰعَةُ جَمِيعًا ۖ لَّهُۥ مُلْكُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۖ ثُمَّ إِلَيْهِ تُرْجَعُونَ
    arabicPlain: قل لله الشفاعة جميعا ۖ له ملك السماوات والأرض ۖ ثم إليه ترجعون
    surahName: Az-Zumar
    juz: 24
    manzil: 6
    ruku: 400
