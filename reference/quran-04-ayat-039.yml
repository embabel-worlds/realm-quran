  data:
    ref: '39:15'
    scripture: quran
    name: Quran 39:15
    chapter: 39
    verse: 15
    ordinal: 4073
    text: 'Then worship what ye will beside Him. Say: The losers will be those who lose themselves and their housefolk on the Day of Resurrection. Ah, that will be the manifest loss!'
    translation: Pickthall
    original: فَٱعْبُدُوا۟ مَا شِئْتُم مِّن دُونِهِۦ ۗ قُلْ إِنَّ ٱلْخَـٰسِرِينَ ٱلَّذِينَ خَسِرُوٓا۟ أَنفُسَهُمْ وَأَهْلِيهِمْ يَوْمَ ٱلْقِيَـٰمَةِ ۗ أَلَا ذَٰلِكَ هُوَ ٱلْخُسْرَانُ ٱلْمُبِينُ
    arabicPlain: فاعبدوا ما شئتم من دونه ۗ قل إن الخاسرين الذين خسروا أنفسهم وأهليهم يوم القيامة ۗ ألا ذلك هو الخسران المبين
    surahName: Az-Zumar
