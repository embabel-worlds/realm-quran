  data:
    ref: '39:26'
    scripture: quran
    name: Quran 39:26
    chapter: 39
    verse: 26
    ordinal: 4084
    text: Thus Allah made them taste humiliation in the life of the world, and verily the doom of the Hereafter will be greater if they did but know.
    translation: Pickthall
    original: فَأَذَاقَهُمُ ٱللَّهُ ٱلْخِزْىَ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا ۖ وَلَعَذَابُ ٱلْـَٔاخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ
    arabicPlain: فأذاقهم الله الخزي في الحياة الدنيا ۖ ولعذاب الآخرة أكبر ۚ لو كانوا يعلمون
    surahName: Az-Zumar
    juz: 23
    manzil: 6
    ruku: 398
