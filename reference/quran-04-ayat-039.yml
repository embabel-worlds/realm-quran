  data:
    ref: '39:42'
    scripture: quran
    name: Quran 39:42
    chapter: 39
    verse: 42
    ordinal: 4100
    text: Allah receiveth (men's) souls at the time of their death, and that (soul) which dieth not (yet) in its sleep. He keepeth that (soul) for which He hath ordained death and dismisseth the rest till an appointed term. Lo! herein verily are portents for people who take thought.
    translation: Pickthall
    original: ٱللَّهُ يَتَوَفَّى ٱلْأَنفُسَ حِينَ مَوْتِهَا وَٱلَّتِى لَمْ تَمُتْ فِى مَنَامِهَا ۖ فَيُمْسِكُ ٱلَّتِى قَضَىٰ عَلَيْهَا ٱلْمَوْتَ وَيُرْسِلُ ٱلْأُخْرَىٰٓ إِلَىٰٓ أَجَلٍ مُّسَمًّى ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍ لِّقَوْمٍ يَتَفَكَّرُونَ
    arabicPlain: الله يتوفى الأنفس حين موتها والتي لم تمت في منامها ۖ فيمسك التي قضى عليها الموت ويرسل الأخرى إلى أجل مسمى ۚ إن في ذلك لآيات لقوم يتفكرون
    surahName: Az-Zumar
    juz: 24
    manzil: 6
    ruku: 400
