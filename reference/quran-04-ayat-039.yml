  data:
    ref: '39:27'
    scripture: quran
    name: Quran 39:27
    chapter: 39
    verse: 27
    ordinal: 4085
    text: And verily We have coined for mankind in this Qur'an all kinds of similitudes, that haply they may reflect;
    translation: Pickthall
    original: وَلَقَدْ ضَرَبْنَا لِلنَّاسِ فِى هَـٰذَا ٱلْقُرْءَانِ مِن كُلِّ مَثَلٍ لَّعَلَّهُمْ يَتَذَكَّرُونَ
    arabicPlain: ولقد ضربنا للناس في هذا القرآن من كل مثل لعلهم يتذكرون
    surahName: Az-Zumar
    juz: 23
    manzil: 6
