    translation: Pickthall
    original: ٱللَّهُ خَـٰلِقُ كُلِّ شَىْءٍ ۖ وَهُوَ عَلَىٰ كُلِّ شَىْءٍ وَكِيلٌ
    arabicPlain: الله خالق كل شيء ۖ وهو على كل شيء وكيل
