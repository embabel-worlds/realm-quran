  data:
    ref: '39:30'
    scripture: quran
    name: Quran 39:30
    chapter: 39
    verse: 30
    ordinal: 4088
    text: Lo! thou wilt die, and lo! they will die;
    translation: Pickthall
    original: إِنَّكَ مَيِّتٌ وَإِنَّهُم مَّيِّتُونَ
    arabicPlain: إنك ميت وإنهم ميتون
    surahName: Az-Zumar
    juz: 23
    manzil: 6
    ruku: 398
