    chapter: 39
    verse: 13
    ordinal: 4071
    text: 'Say: Lo! if I should disobey my Lord, I fear the doom of a tremendous Day.'
    translation: Pickthall
    original: قُلْ إِنِّىٓ أَخَافُ إِنْ عَصَيْتُ رَبِّى عَذَابَ يَوْمٍ عَظِيمٍ
