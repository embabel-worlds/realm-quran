  data:
    ref: '39:17'
    scripture: quran
    name: Quran 39:17
    chapter: 39
    verse: 17
    ordinal: 4075
    text: And those who put away false gods lest they should worship them and turn to Allah in repentance, for them there are glad tidings. Therefor give good tidings (O Muhammad) to My bondmen
    translation: Pickthall
    original: وَٱلَّذِينَ ٱجْتَنَبُوا۟ ٱلطَّـٰغُوتَ أَن يَعْبُدُوهَا وَأَنَابُوٓا۟ إِلَى ٱللَّهِ لَهُمُ ٱلْبُشْرَىٰ ۚ فَبَشِّرْ عِبَادِ
    arabicPlain: والذين اجتنبوا الطاغوت أن يعبدوها وأنابوا إلى الله لهم البشرى ۚ فبشر عباد
