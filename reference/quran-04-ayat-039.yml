  data:
    ref: '39:49'
    scripture: quran
    name: Quran 39:49
    chapter: 39
    verse: 49
    ordinal: 4107
    text: 'Now when hurt toucheth a man he crieth unto Us, and afterward when We have granted him a boon from Us, he saith: Only by force of knowledge I obtained it. Nay, but it is a test. But most of them know not.'
    translation: Pickthall
    original: فَإِذَا مَسَّ ٱلْإِنسَـٰنَ ضُرٌّ دَعَانَا ثُمَّ إِذَا خَوَّلْنَـٰهُ نِعْمَةً مِّنَّا قَالَ إِنَّمَآ أُوتِيتُهُۥ عَلَىٰ عِلْمٍۭ ۚ بَلْ هِىَ فِتْنَةٌ وَلَـٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ
    arabicPlain: فإذا مس الإنسان ضر دعانا ثم إذا خولناه نعمة منا قال إنما أوتيته على علم ۚ بل هي فتنة ولكن أكثرهم لا يعلمون
    surahName: Az-Zumar
    juz: 24
    manzil: 6
    ruku: 400
    page: 464
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '39'
  - predicate: IN_PORTION
    to:
