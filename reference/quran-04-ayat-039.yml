    scripture: quran
    name: Quran 39:19
    chapter: 39
    verse: 19
    ordinal: 4077
    text: Is he on whom the word of doom is fulfilled (to be helped), and canst thou (O Muhammad) rescue him who is in the Fire?
    translation: Pickthall
    original: أَفَمَنْ حَقَّ عَلَيْهِ كَلِمَةُ ٱلْعَذَابِ أَفَأَنتَ تُنقِذُ مَن فِى ٱلنَّارِ
    arabicPlain: أفمن حق عليه كلمة العذاب أفأنت تنقذ من في النار
