    name: Quran 39:70
    chapter: 39
    verse: 70
    ordinal: 4128
    text: And each soul is paid in full for what it did. And He is Best Aware of what they do.
    translation: Pickthall
    original: وَوُفِّيَتْ كُلُّ نَفْسٍ مَّا عَمِلَتْ وَهُوَ أَعْلَمُ بِمَا يَفْعَلُونَ
    arabicPlain: ووفيت كل نفس ما عملت وهو أعلم بما يفعلون
    surahName: Az-Zumar
    juz: 24
    manzil: 6
