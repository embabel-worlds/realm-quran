- type: Ayah
  data:
    ref: '39:7'
    scripture: quran
    name: Quran 39:7
    chapter: 39
    verse: 7
    ordinal: 4065
    text: If ye are thankless, yet Allah is Independent of you, though He is not pleased with thanklessness for His bondmen; and if ye are thankful He is pleased therewith for you. No laden soul will bear another's load. Then unto your Lord is your return; and He will tell you what ye used to do. Lo! He knoweth what is in the breasts (of men).
    translation: Pickthall
    original: إِن تَكْفُرُوا۟ فَإِنَّ ٱللَّهَ غَنِىٌّ عَنكُمْ ۖ وَلَا يَرْضَىٰ لِعِبَادِهِ ٱلْكُفْرَ ۖ وَإِن تَشْكُرُوا۟ يَرْضَهُ لَكُمْ ۗ وَلَا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَىٰ ۗ ثُمَّ إِلَىٰ رَبِّكُم مَّرْجِعُكُمْ فَيُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَ ۚ إِنَّهُۥ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ
    arabicPlain: إن تكفروا فإن الله غني عنكم ۖ ولا يرضى لعباده الكفر ۖ وإن تشكروا يرضه لكم ۗ ولا تزر وازرة وزر أخرى ۗ ثم إلى ربكم مرجعكم فينبئكم بما كنتم تعملون ۚ إنه عليم بذات الصدور
    surahName: Az-Zumar
    juz: 23
    manzil: 6
    ruku: 396
    page: 459
