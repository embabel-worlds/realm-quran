  data:
    ref: '39:18'
    scripture: quran
    name: Quran 39:18
    chapter: 39
    verse: 18
    ordinal: 4076
    text: Who hear advice and follow the best thereof. Such are those whom Allah guideth, and such are men of understanding.
    translation: Pickthall
    original: ٱلَّذِينَ يَسْتَمِعُونَ ٱلْقَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُۥٓ ۚ أُو۟لَـٰٓئِكَ ٱلَّذِينَ هَدَىٰهُمُ ٱللَّهُ ۖ وَأُو۟لَـٰٓئِكَ هُمْ أُو۟لُوا۟ ٱلْأَلْبَـٰبِ
    arabicPlain: الذين يستمعون القول فيتبعون أحسنه ۚ أولئك الذين هداهم الله ۖ وأولئك هم أولو الألباب
