  data:
    ref: '39:50'
    scripture: quran
    name: Quran 39:50
    chapter: 39
    verse: 50
    ordinal: 4108
    text: Those before them said it, yet (all) that they had earned availed them not;
    translation: Pickthall
    original: قَدْ قَالَهَا ٱلَّذِينَ مِن قَبْلِهِمْ فَمَآ أَغْنَىٰ عَنْهُم مَّا كَانُوا۟ يَكْسِبُونَ
    arabicPlain: قد قالها الذين من قبلهم فما أغنى عنهم ما كانوا يكسبون
    surahName: Az-Zumar
    juz: 24
    manzil: 6
    ruku: 400
    page: 464
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '39'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-24
- type: Ayah
  data:
    ref: '39:51'
    scripture: quran
    name: Quran 39:51
    chapter: 39
    verse: 51
    ordinal: 4109
    text: But the evils that they earned smote them; and such of these as do wrong, the evils that they earn will smite them; they cannot escape.
    translation: Pickthall
    original: فَأَصَابَهُمْ سَيِّـَٔاتُ مَا كَسَبُوا۟ ۚ وَٱلَّذِينَ ظَلَمُوا۟ مِنْ هَـٰٓؤُلَآءِ سَيُصِيبُهُمْ سَيِّـَٔاتُ مَا كَسَبُوا۟ وَمَا هُم بِمُعْجِزِينَ
    arabicPlain: فأصابهم سيئات ما كسبوا ۚ والذين ظلموا من هؤلاء سيصيبهم سيئات ما كسبوا وما هم بمعجزين
