  data:
    ref: '39:58'
    scripture: quran
    name: Quran 39:58
    chapter: 39
    verse: 58
    ordinal: 4116
    text: 'Or should say, when it seeth the doom: Oh, that I had but a second chance that I might be among the righteous!'
    translation: Pickthall
    original: أَوْ تَقُولَ حِينَ تَرَى ٱلْعَذَابَ لَوْ أَنَّ لِى كَرَّةً فَأَكُونَ مِنَ ٱلْمُحْسِنِينَ
