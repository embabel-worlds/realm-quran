  data:
    ref: '39:22'
    scripture: quran
    name: Quran 39:22
    chapter: 39
    verse: 22
    ordinal: 4080
    text: Is he whose bosom Allah hath expanded for Al-Islam, so that he followeth a light from his Lord, (as he who disbelieveth)? Then woe unto those whose hearts are hardened against remembrance of Allah. Such are in plain error.
    translation: Pickthall
    original: أَفَمَن شَرَحَ ٱللَّهُ صَدْرَهُۥ لِلْإِسْلَـٰمِ فَهُوَ عَلَىٰ نُورٍ مِّن رَّبِّهِۦ ۚ فَوَيْلٌ لِّلْقَـٰسِيَةِ قُلُوبُهُم مِّن ذِكْرِ ٱللَّهِ ۚ أُو۟لَـٰٓئِكَ فِى ضَلَـٰلٍ مُّبِينٍ
    arabicPlain: أفمن شرح الله صدره للإسلام فهو على نور من ربه ۚ فويل للقاسية قلوبهم من ذكر الله ۚ أولئك في ضلال مبين
    surahName: Az-Zumar
    juz: 23
    manzil: 6
    ruku: 398
