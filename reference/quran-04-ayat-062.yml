- type: Ayah
  data:
    ref: '62:6'
    scripture: quran
    name: Quran 62:6
    chapter: 62
    verse: 6
    ordinal: 5183
    text: 'Say (O Muhammad): O ye who are Jews! If ye claim that ye are favoured of Allah apart from (all) mankind, then long for death if ye are truthful.'
    translation: Pickthall
    original: قُلْ يَـٰٓأَيُّهَا ٱلَّذِينَ هَادُوٓا۟ إِن زَعَمْتُمْ أَنَّكُمْ أَوْلِيَآءُ لِلَّهِ مِن دُونِ ٱلنَّاسِ فَتَمَنَّوُا۟ ٱلْمَوْتَ إِن كُنتُمْ صَـٰدِقِينَ
    arabicPlain: قل يا أيها الذين هادوا إن زعمتم أنكم أولياء لله من دون الناس فتمنوا الموت إن كنتم صادقين
    surahName: Al-Jumu'a
    juz: 28
    manzil: 7
    ruku: 486
    page: 553
