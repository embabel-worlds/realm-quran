- type: Ayah
  data:
    ref: '62:10'
    scripture: quran
    name: Quran 62:10
    chapter: 62
    verse: 10
    ordinal: 5187
    text: And when the prayer is ended, then disperse in the land and seek of Allah's bounty, and remember Allah much, that ye may be successful.
    translation: Pickthall
    original: فَإِذَا قُضِيَتِ ٱلصَّلَوٰةُ فَٱنتَشِرُوا۟ فِى ٱلْأَرْضِ وَٱبْتَغُوا۟ مِن فَضْلِ ٱللَّهِ وَٱذْكُرُوا۟ ٱللَّهَ كَثِيرًا لَّعَلَّكُمْ تُفْلِحُونَ
    arabicPlain: فإذا قضيت الصلاة فانتشروا في الأرض وابتغوا من فضل الله واذكروا الله كثيرا لعلكم تفلحون
    surahName: Al-Jumu'a
    juz: 28
    manzil: 7
    ruku: 487
    page: 554
  relations:
  - predicate: IN
    to:
      type: Surah
