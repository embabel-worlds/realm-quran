    scripture: quran
    name: Quran 62:3
    chapter: 62
    verse: 3
    ordinal: 5180
    text: Along with others of them who have not yet joined them. He is the Mighty, the Wise.
    translation: Pickthall
    original: وَءَاخَرِينَ مِنْهُمْ لَمَّا يَلْحَقُوا۟ بِهِمْ ۚ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ
    arabicPlain: وآخرين منهم لما يلحقوا بهم ۚ وهو العزيز الحكيم
    surahName: Al-Jumu'a
