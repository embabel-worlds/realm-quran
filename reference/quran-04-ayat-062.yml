- type: Ayah
  data:
    ref: '62:9'
    scripture: quran
    name: Quran 62:9
    chapter: 62
    verse: 9
    ordinal: 5186
    text: O ye who believe! When the call is heard for the prayer of the day of congregation, haste unto remembrance of Allah and leave your trading. That is better for you if ye did but know.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا نُودِىَ لِلصَّلَوٰةِ مِن يَوْمِ ٱلْجُمُعَةِ فَٱسْعَوْا۟ إِلَىٰ ذِكْرِ ٱللَّهِ وَذَرُوا۟ ٱلْبَيْعَ ۚ ذَٰلِكُمْ خَيْرٌ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ
    arabicPlain: يا أيها الذين آمنوا إذا نودي للصلاة من يوم الجمعة فاسعوا إلى ذكر الله وذروا البيع ۚ ذلكم خير لكم إن كنتم تعلمون
    surahName: Al-Jumu'a
    juz: 28
    manzil: 7
    ruku: 487
    page: 554
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '62'
  - predicate: IN_PORTION
