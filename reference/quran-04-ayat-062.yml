- type: Ayah
  data:
    ref: '62:7'
    scripture: quran
    name: Quran 62:7
    chapter: 62
    verse: 7
    ordinal: 5184
    text: But they will never long for it because of all that their own hands have sent before, and Allah is Aware of evil-doers.
    translation: Pickthall
    original: وَلَا يَتَمَنَّوْنَهُۥٓ أَبَدًۢا بِمَا قَدَّمَتْ أَيْدِيهِمْ ۚ وَٱللَّهُ عَلِيمٌۢ بِٱلظَّـٰلِمِينَ
    arabicPlain: ولا يتمنونه أبدا بما قدمت أيديهم ۚ والله عليم بالظالمين
    surahName: Al-Jumu'a
    juz: 28
    manzil: 7
    ruku: 486
    page: 553
