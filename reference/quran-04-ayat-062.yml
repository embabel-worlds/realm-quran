  data:
    ref: '62:4'
    scripture: quran
    name: Quran 62:4
    chapter: 62
    verse: 4
    ordinal: 5181
    text: That is the bounty of Allah; which He giveth unto whom He will. Allah is of Infinite Bounty.
    translation: Pickthall
    original: ذَٰلِكَ فَضْلُ ٱللَّهِ يُؤْتِيهِ مَن يَشَآءُ ۚ وَٱللَّهُ ذُو ٱلْفَضْلِ ٱلْعَظِيمِ
    arabicPlain: ذلك فضل الله يؤتيه من يشاء ۚ والله ذو الفضل العظيم
    surahName: Al-Jumu'a
    juz: 28
