  data:
    ref: 12:65
    scripture: quran
    name: Quran 12:65
    chapter: 12
    verse: 65
    ordinal: 1661
    text: 'And when they opened their belongings they discovered that their merchandise had been returned to them. They said: O our father! What (more) can we ask? Here is our merchandise returned to us. We shall get provision for our folk and guard our brother, and we shall have the extra measure of a camel (load). This (that we bring now) is a light measure.'
    translation: Pickthall
    original: وَلَمَّا فَتَحُوا۟ مَتَـٰعَهُمْ وَجَدُوا۟ بِضَـٰعَتَهُمْ رُدَّتْ إِلَيْهِمْ ۖ قَالُوا۟ يَـٰٓأَبَانَا مَا نَبْغِى ۖ هَـٰذِهِۦ بِضَـٰعَتُنَا رُدَّتْ إِلَيْنَا ۖ وَنَمِيرُ أَهْلَنَا وَنَحْفَظُ أَخَانَا وَنَزْدَادُ كَيْلَ بَعِيرٍ ۖ ذَٰلِكَ كَيْلٌ يَسِيرٌ
    arabicPlain: ولما فتحوا متاعهم وجدوا بضاعتهم ردت إليهم ۖ قالوا يا أبانا ما نبغي ۖ هذه بضاعتنا ردت إلينا ۖ ونمير أهلنا ونحفظ أخانا ونزداد كيل بعير ۖ ذلك كيل يسير
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 200
    page: 243
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '12'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-13
- type: Ayah
  data:
    ref: 12:66
    scripture: quran
    name: Quran 12:66
    chapter: 12
    verse: 66
    ordinal: 1662
    text: 'He said: I will not send him with you till ye give me an undertaking in the name of Allah that ye will bring him back to me, unless ye are surrounded. And when they gave him their undertaking he said: Allah is the Warden over what we say.'
    translation: Pickthall
    original: قَالَ لَنْ أُرْسِلَهُۥ مَعَكُمْ حَتَّىٰ تُؤْتُونِ مَوْثِقًا مِّنَ ٱللَّهِ لَتَأْتُنَّنِى بِهِۦٓ إِلَّآ أَن يُحَاطَ بِكُمْ ۖ فَلَمَّآ ءَاتَوْهُ مَوْثِقَهُمْ قَالَ ٱللَّهُ عَلَىٰ مَا نَقُولُ وَكِيلٌ
    arabicPlain: قال لن أرسله معكم حتى تؤتون موثقا من الله لتأتنني به إلا أن يحاط بكم ۖ فلما آتوه موثقهم قال الله على ما نقول وكيل
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 200
    page: 243
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '12'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-13
- type: Ayah
  data:
    ref: 12:67
    scripture: quran
    name: Quran 12:67
    chapter: 12
    verse: 67
    ordinal: 1663
    text: 'And he said: O my sons! Go not in by one gate; go in by different gates. I can naught avail you as against Allah. Lo! the decision rests with Allah only. In Him do I put my trust, and in Him let all the trusting put their trust.'
    translation: Pickthall
    original: وَقَالَ يَـٰبَنِىَّ لَا تَدْخُلُوا۟ مِنۢ بَابٍ وَٰحِدٍ وَٱدْخُلُوا۟ مِنْ أَبْوَٰبٍ مُّتَفَرِّقَةٍ ۖ وَمَآ أُغْنِى عَنكُم مِّنَ ٱللَّهِ مِن شَىْءٍ ۖ إِنِ ٱلْحُكْمُ إِلَّا لِلَّهِ ۖ عَلَيْهِ تَوَكَّلْتُ ۖ وَعَلَيْهِ فَلْيَتَوَكَّلِ ٱلْمُتَوَكِّلُونَ
    arabicPlain: وقال يا بني لا تدخلوا من باب واحد وادخلوا من أبواب متفرقة ۖ وما أغني عنكم من الله من شيء ۖ إن الحكم إلا لله ۖ عليه توكلت ۖ وعليه فليتوكل المتوكلون
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 200
    page: 243
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '12'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-13
- type: Ayah
  data:
    ref: 12:68
    scripture: quran
    name: Quran 12:68
    chapter: 12
    verse: 68
    ordinal: 1664
    text: And when they entered in the manner which their father had enjoined, it would have naught availed them as against Allah; it was but a need of Jacob's soul which he thus satisfied; and lo! he was a lord of knowledge because We had taught him; but most of mankind know not.
    translation: Pickthall
    original: وَلَمَّا دَخَلُوا۟ مِنْ حَيْثُ أَمَرَهُمْ أَبُوهُم مَّا كَانَ يُغْنِى عَنْهُم مِّنَ ٱللَّهِ مِن شَىْءٍ إِلَّا حَاجَةً فِى نَفْسِ يَعْقُوبَ قَضَىٰهَا ۚ وَإِنَّهُۥ لَذُو عِلْمٍ لِّمَا عَلَّمْنَـٰهُ وَلَـٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يَعْلَمُونَ
    arabicPlain: ولما دخلوا من حيث أمرهم أبوهم ما كان يغني عنهم من الله من شيء إلا حاجة في نفس يعقوب قضاها ۚ وإنه لذو علم لما علمناه ولكن أكثر الناس لا يعلمون
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 200
    page: 243
  relations:
  - predicate: IN
