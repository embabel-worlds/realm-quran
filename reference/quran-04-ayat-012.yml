  data:
    ref: '12:32'
    scripture: quran
    name: Quran 12:32
    chapter: 12
    verse: 32
    ordinal: 1628
    text: 'She said: This is he on whose account ye blamed me. I asked of him an evil act, but he proved continent, but if he do not my behest he verily shall be imprisoned, and verily shall be of those brought low.'
    translation: Pickthall
    original: قَالَتْ فَذَٰلِكُنَّ ٱلَّذِى لُمْتُنَّنِى فِيهِ ۖ وَلَقَدْ رَٰوَدتُّهُۥ عَن نَّفْسِهِۦ فَٱسْتَعْصَمَ ۖ وَلَئِن لَّمْ يَفْعَلْ مَآ ءَامُرُهُۥ لَيُسْجَنَنَّ وَلَيَكُونًا مِّنَ ٱلصَّـٰغِرِينَ
    arabicPlain: قالت فذلكن الذي لمتنني فيه ۖ ولقد راودته عن نفسه فاستعصم ۖ ولئن لم يفعل ما آمره ليسجنن وليكونا من الصاغرين
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 196
    page: 239
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '12'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-12
- type: Ayah
  data:
    ref: '12:33'
    scripture: quran
    name: Quran 12:33
    chapter: 12
    verse: 33
    ordinal: 1629
    text: 'He said: O my Lord! Prison is more dear than that unto which they urge me, and if Thou fend not off their wiles from me I shall incline unto them and become of the foolish.'
    translation: Pickthall
    original: قَالَ رَبِّ ٱلسِّجْنُ أَحَبُّ إِلَىَّ مِمَّا يَدْعُونَنِىٓ إِلَيْهِ ۖ وَإِلَّا تَصْرِفْ عَنِّى كَيْدَهُنَّ أَصْبُ إِلَيْهِنَّ وَأَكُن مِّنَ ٱلْجَـٰهِلِينَ
    arabicPlain: قال رب السجن أحب إلي مما يدعونني إليه ۖ وإلا تصرف عني كيدهن أصب إليهن وأكن من الجاهلين
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 196
    page: 239
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '12'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-12
- type: Ayah
  data:
    ref: '12:34'
    scripture: quran
    name: Quran 12:34
    chapter: 12
    verse: 34
    ordinal: 1630
    text: So his Lord heard his prayer and fended off their wiles from him. Lo! He is Hearer, Knower.
    translation: Pickthall
    original: فَٱسْتَجَابَ لَهُۥ رَبُّهُۥ فَصَرَفَ عَنْهُ كَيْدَهُنَّ ۚ إِنَّهُۥ هُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ
    arabicPlain: فاستجاب له ربه فصرف عنه كيدهن ۚ إنه هو السميع العليم
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 196
    page: 239
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '12'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-12
- type: Ayah
  data:
    ref: '12:35'
    scripture: quran
    name: Quran 12:35
    chapter: 12
    verse: 35
    ordinal: 1631
    text: And it seemed good to them (the men-folk) after they had seen the signs (of his innocence) to imprison him for a time.
    translation: Pickthall
    original: ثُمَّ بَدَا لَهُم مِّنۢ بَعْدِ مَا رَأَوُا۟ ٱلْـَٔايَـٰتِ لَيَسْجُنُنَّهُۥ حَتَّىٰ حِينٍ
    arabicPlain: ثم بدا لهم من بعد ما رأوا الآيات ليسجننه حتى حين
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 196
    page: 239
  relations:
