  data:
    ref: '12:43'
    scripture: quran
    name: Quran 12:43
    chapter: 12
    verse: 43
    ordinal: 1639
    text: 'And the king said: Lo! I saw in a dream seven fat kine which seven lean were eating, and seven green ears of corn and other (seven) dry. O notables! Expound for me my vision, if ye can interpret dreams.'
    translation: Pickthall
    original: وَقَالَ ٱلْمَلِكُ إِنِّىٓ أَرَىٰ سَبْعَ بَقَرَٰتٍ سِمَانٍ يَأْكُلُهُنَّ سَبْعٌ عِجَافٌ وَسَبْعَ سُنۢبُلَـٰتٍ خُضْرٍ وَأُخَرَ يَابِسَـٰتٍ ۖ يَـٰٓأَيُّهَا ٱلْمَلَأُ أَفْتُونِى فِى رُءْيَـٰىَ إِن كُنتُمْ لِلرُّءْيَا تَعْبُرُونَ
    arabicPlain: وقال الملك إني أرى سبع بقرات سمان يأكلهن سبع عجاف وسبع سنبلات خضر وأخر يابسات ۖ يا أيها الملأ أفتوني في رؤياي إن كنتم للرؤيا تعبرون
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 198
    page: 240
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '12'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-12
