    scripture: quran
    name: Quran 12:20
    chapter: 12
    verse: 20
    ordinal: 1616
    text: And they sold him for a low price, a number of silver coins; and they attached no value to him.
    translation: Pickthall
    original: وَشَرَوْهُ بِثَمَنٍۭ بَخْسٍ دَرَٰهِمَ مَعْدُودَةٍ وَكَانُوا۟ فِيهِ مِنَ ٱلزَّٰهِدِينَ
    arabicPlain: وشروه بثمن بخس دراهم معدودة وكانوا فيه من الزاهدين
    surahName: Yusuf
    juz: 12
    manzil: 3
