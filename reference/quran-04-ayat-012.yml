    scripture: quran
    name: Quran 12:74
    chapter: 12
    verse: 74
    ordinal: 1670
    text: 'They said: And what shall be the penalty for it, if ye prove liars?'
    translation: Pickthall
    original: قَالُوا۟ فَمَا جَزَٰٓؤُهُۥٓ إِن كُنتُمْ كَـٰذِبِينَ
