  data:
    ref: '12:15'
    scripture: quran
    name: Quran 12:15
    chapter: 12
    verse: 15
    ordinal: 1611
    text: 'Then, when they led him off, and were of one mind that they should place him in the depth of the pit, We inspired in him: Thou wilt tell them of this deed of theirs when they know (thee) not.'
    translation: Pickthall
    original: فَلَمَّا ذَهَبُوا۟ بِهِۦ وَأَجْمَعُوٓا۟ أَن يَجْعَلُوهُ فِى غَيَـٰبَتِ ٱلْجُبِّ ۚ وَأَوْحَيْنَآ إِلَيْهِ لَتُنَبِّئَنَّهُم بِأَمْرِهِمْ هَـٰذَا وَهُمْ لَا يَشْعُرُونَ
    arabicPlain: فلما ذهبوا به وأجمعوا أن يجعلوه في غيابت الجب ۚ وأوحينا إليه لتنبئنهم بأمرهم هذا وهم لا يشعرون
