  data:
    ref: 12:109
    scripture: quran
    name: Quran 12:109
    chapter: 12
    verse: 109
    ordinal: 1705
    text: We sent not before thee (any messengers) save men whom We inspired from among the folk of the townships - Have they not travelled in the land and seen the nature of the consequence for those who were before them? And verily the abode of the Hereafter, for those who ward off (evil), is best. Have ye then no sense? -
    translation: Pickthall
    original: وَمَآ أَرْسَلْنَا مِن قَبْلِكَ إِلَّا رِجَالًا نُّوحِىٓ إِلَيْهِم مِّنْ أَهْلِ ٱلْقُرَىٰٓ ۗ أَفَلَمْ يَسِيرُوا۟ فِى ٱلْأَرْضِ فَيَنظُرُوا۟ كَيْفَ كَانَ عَـٰقِبَةُ ٱلَّذِينَ مِن قَبْلِهِمْ ۗ وَلَدَارُ ٱلْـَٔاخِرَةِ خَيْرٌ لِّلَّذِينَ ٱتَّقَوْا۟ ۗ أَفَلَا تَعْقِلُونَ
    arabicPlain: وما أرسلنا من قبلك إلا رجالا نوحي إليهم من أهل القرى ۗ أفلم يسيروا في الأرض فينظروا كيف كان عاقبة الذين من قبلهم ۗ ولدار الآخرة خير للذين اتقوا ۗ أفلا تعقلون
