  data:
    ref: 12:78
    scripture: quran
    name: Quran 12:78
    chapter: 12
    verse: 78
    ordinal: 1674
    text: 'They said: O ruler of the land! Lo! he hath a very aged father, so take one of us instead of him. Lo! we behold thee of those who do kindness.'
    translation: Pickthall
    original: قَالُوا۟ يَـٰٓأَيُّهَا ٱلْعَزِيزُ إِنَّ لَهُۥٓ أَبًا شَيْخًا كَبِيرًا فَخُذْ أَحَدَنَا مَكَانَهُۥٓ ۖ إِنَّا نَرَىٰكَ مِنَ ٱلْمُحْسِنِينَ
    arabicPlain: قالوا يا أيها العزيز إن له أبا شيخا كبيرا فخذ أحدنا مكانه ۖ إنا نراك من المحسنين
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 201
    page: 244
