  data:
    ref: '12:37'
    scripture: quran
    name: Quran 12:37
    chapter: 12
    verse: 37
    ordinal: 1633
    text: 'He said: The food which ye are given (daily) shall not come unto you but I shall tell you the interpretation ere it cometh unto you. This is of that which my Lord hath taught me. Lo! I have forsaken the religion of folk who believe not in Allah and are disbelievers in the Hereafter.'
    translation: Pickthall
    original: قَالَ لَا يَأْتِيكُمَا طَعَامٌ تُرْزَقَانِهِۦٓ إِلَّا نَبَّأْتُكُمَا بِتَأْوِيلِهِۦ قَبْلَ أَن يَأْتِيَكُمَا ۚ ذَٰلِكُمَا مِمَّا عَلَّمَنِى رَبِّىٓ ۚ إِنِّى تَرَكْتُ مِلَّةَ قَوْمٍ لَّا يُؤْمِنُونَ بِٱللَّهِ وَهُم بِٱلْـَٔاخِرَةِ هُمْ كَـٰفِرُونَ
    arabicPlain: قال لا يأتيكما طعام ترزقانه إلا نبأتكما بتأويله قبل أن يأتيكما ۚ ذلكما مما علمني ربي ۚ إني تركت ملة قوم لا يؤمنون بالله وهم بالآخرة هم كافرون
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 197
    page: 239
