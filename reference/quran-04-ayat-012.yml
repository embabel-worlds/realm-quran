  data:
    ref: '12:44'
    scripture: quran
    name: Quran 12:44
    chapter: 12
    verse: 44
    ordinal: 1640
    text: 'They answered: Jumbled dreams! And we are not knowing in the interpretation of dreams.'
    translation: Pickthall
    original: قَالُوٓا۟ أَضْغَـٰثُ أَحْلَـٰمٍ ۖ وَمَا نَحْنُ بِتَأْوِيلِ ٱلْأَحْلَـٰمِ بِعَـٰلِمِينَ
    arabicPlain: قالوا أضغاث أحلام ۖ وما نحن بتأويل الأحلام بعالمين
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 198
    page: 241
