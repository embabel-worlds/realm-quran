- type: Ayah
  data:
    ref: '12:47'
    scripture: quran
    name: Quran 12:47
    chapter: 12
    verse: 47
    ordinal: 1643
    text: 'He said: Ye shall sow seven years as usual, but that which ye reap, leave it in the ear, all save a little which ye eat.'
    translation: Pickthall
    original: قَالَ تَزْرَعُونَ سَبْعَ سِنِينَ دَأَبًا فَمَا حَصَدتُّمْ فَذَرُوهُ فِى سُنۢبُلِهِۦٓ إِلَّا قَلِيلًا مِّمَّا تَأْكُلُونَ
    arabicPlain: قال تزرعون سبع سنين دأبا فما حصدتم فذروه في سنبله إلا قليلا مما تأكلون
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 198
    page: 241
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '12'
  - predicate: IN_PORTION
    to:
      type: Juz
