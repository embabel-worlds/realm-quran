- type: Ayah
  data:
    ref: '12:45'
    scripture: quran
    name: Quran 12:45
    chapter: 12
    verse: 45
    ordinal: 1641
    text: 'And he of the two who was released, and (now) at length remembered, said: I am going to announce unto you the interpretation, therefore send me forth.'
    translation: Pickthall
    original: وَقَالَ ٱلَّذِى نَجَا مِنْهُمَا وَٱدَّكَرَ بَعْدَ أُمَّةٍ أَنَا۠ أُنَبِّئُكُم بِتَأْوِيلِهِۦ فَأَرْسِلُونِ
    arabicPlain: وقال الذي نجا منهما وادكر بعد أمة أنا أنبئكم بتأويله فأرسلون
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 198
    page: 241
