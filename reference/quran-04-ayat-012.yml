    name: Quran 12:70
    chapter: 12
    verse: 70
    ordinal: 1666
    text: 'And when he provided them with their provision, he put the drinking-cup in his brother''s saddlebag, and then a crier cried: O camel-riders! Lo! ye are surely thieves!'
    translation: Pickthall
    original: فَلَمَّا جَهَّزَهُم بِجَهَازِهِمْ جَعَلَ ٱلسِّقَايَةَ فِى رَحْلِ أَخِيهِ ثُمَّ أَذَّنَ مُؤَذِّنٌ أَيَّتُهَا ٱلْعِيرُ إِنَّكُمْ لَسَـٰرِقُونَ
    arabicPlain: فلما جهزهم بجهازهم جعل السقاية في رحل أخيه ثم أذن مؤذن أيتها العير إنكم لسارقون
