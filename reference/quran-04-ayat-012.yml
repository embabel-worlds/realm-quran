  data:
    ref: 12:86
    scripture: quran
    name: Quran 12:86
    chapter: 12
    verse: 86
    ordinal: 1682
    text: 'He said: I expose my distress and anguish only unto Allah, and I know from Allah that which ye know not.'
    translation: Pickthall
    original: قَالَ إِنَّمَآ أَشْكُوا۟ بَثِّى وَحُزْنِىٓ إِلَى ٱللَّهِ وَأَعْلَمُ مِنَ ٱللَّهِ مَا لَا تَعْلَمُونَ
    arabicPlain: قال إنما أشكو بثي وحزني إلى الله وأعلم من الله ما لا تعلمون
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 202
    page: 245
