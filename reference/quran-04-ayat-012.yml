    scripture: quran
    name: Quran 12:11
    chapter: 12
    verse: 11
    ordinal: 1607
    text: 'They said: O our father! Why wilt thou not trust us with Joseph, when lo! we are good friends to him?'
    translation: Pickthall
    original: قَالُوا۟ يَـٰٓأَبَانَا مَا لَكَ لَا تَأْمَ۫نَّا عَلَىٰ يُوسُفَ وَإِنَّا لَهُۥ لَنَـٰصِحُونَ
    arabicPlain: قالوا يا أبانا ما لك لا تأمنا على يوسف وإنا له لناصحون
    surahName: Yusuf
    juz: 12
    manzil: 3
