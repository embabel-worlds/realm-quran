  data:
    ref: '12:57'
    scripture: quran
    name: Quran 12:57
    chapter: 12
    verse: 57
    ordinal: 1653
    text: And the reward of the Hereafter is better, for those who believe and ward off (evil).
    translation: Pickthall
    original: وَلَأَجْرُ ٱلْـَٔاخِرَةِ خَيْرٌ لِّلَّذِينَ ءَامَنُوا۟ وَكَانُوا۟ يَتَّقُونَ
    arabicPlain: ولأجر الآخرة خير للذين آمنوا وكانوا يتقون
