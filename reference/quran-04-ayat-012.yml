  data:
    ref: '12:56'
    scripture: quran
    name: Quran 12:56
    chapter: 12
    verse: 56
    ordinal: 1652
    text: Thus gave We power to Joseph in the land. He was the owner of it where he pleased. We reach with Our mercy whom We will. We lose not the reward of the good.
    translation: Pickthall
    original: وَكَذَٰلِكَ مَكَّنَّا لِيُوسُفَ فِى ٱلْأَرْضِ يَتَبَوَّأُ مِنْهَا حَيْثُ يَشَآءُ ۚ نُصِيبُ بِرَحْمَتِنَا مَن نَّشَآءُ ۖ وَلَا نُضِيعُ أَجْرَ ٱلْمُحْسِنِينَ
    arabicPlain: وكذلك مكنا ليوسف في الأرض يتبوأ منها حيث يشاء ۚ نصيب برحمتنا من نشاء ۖ ولا نضيع أجر المحسنين
    surahName: Yusuf
