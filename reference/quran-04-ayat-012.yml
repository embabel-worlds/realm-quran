  data:
    ref: 12:83
    scripture: quran
    name: Quran 12:83
    chapter: 12
    verse: 83
    ordinal: 1679
    text: '(And when they came unto their father and had spoken thus to him) he said: Nay, but your minds have beguiled you into something. (My course is) comely patience! It may be that Allah will bring them all unto me. Lo! He, only He, is the Knower, the Wise.'
    translation: Pickthall
    original: قَالَ بَلْ سَوَّلَتْ لَكُمْ أَنفُسُكُمْ أَمْرًا ۖ فَصَبْرٌ جَمِيلٌ ۖ عَسَى ٱللَّهُ أَن يَأْتِيَنِى بِهِمْ جَمِيعًا ۚ إِنَّهُۥ هُوَ ٱلْعَلِيمُ ٱلْحَكِيمُ
    arabicPlain: قال بل سولت لكم أنفسكم أمرا ۖ فصبر جميل ۖ عسى الله أن يأتيني بهم جميعا ۚ إنه هو العليم الحكيم
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 202
    page: 245
