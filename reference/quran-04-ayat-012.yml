  data:
    ref: 12:73
    scripture: quran
    name: Quran 12:73
    chapter: 12
    verse: 73
    ordinal: 1669
    text: 'They said: By Allah, well ye know we came not to do evil in the land, and are no thieves.'
    translation: Pickthall
    original: قَالُوا۟ تَٱللَّهِ لَقَدْ عَلِمْتُم مَّا جِئْنَا لِنُفْسِدَ فِى ٱلْأَرْضِ وَمَا كُنَّا سَـٰرِقِينَ
    arabicPlain: قالوا تالله لقد علمتم ما جئنا لنفسد في الأرض وما كنا سارقين
