  data:
    ref: '12:42'
    scripture: quran
    name: Quran 12:42
    chapter: 12
    verse: 42
    ordinal: 1638
    text: 'And he said unto him of the twain who he knew would be released: Mention me in the presence of thy lord. But Satan caused him to forget to mention it to his lord, so he (Joseph) stayed in prison for some years.'
    translation: Pickthall
    original: وَقَالَ لِلَّذِى ظَنَّ أَنَّهُۥ نَاجٍ مِّنْهُمَا ٱذْكُرْنِى عِندَ رَبِّكَ فَأَنسَىٰهُ ٱلشَّيْطَـٰنُ ذِكْرَ رَبِّهِۦ فَلَبِثَ فِى ٱلسِّجْنِ بِضْعَ سِنِينَ
    arabicPlain: وقال للذي ظن أنه ناج منهما اذكرني عند ربك فأنساه الشيطان ذكر ربه فلبث في السجن بضع سنين
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 197
    page: 240
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '12'
