  data:
    ref: 12:64
    scripture: quran
    name: Quran 12:64
    chapter: 12
    verse: 64
    ordinal: 1660
    text: 'He said: Can I entrust him to you save as I entrusted his brother to you aforetime? Allah is better at guarding, and He is the Most Merciful of those who show mercy.'
    translation: Pickthall
    original: قَالَ هَلْ ءَامَنُكُمْ عَلَيْهِ إِلَّا كَمَآ أَمِنتُكُمْ عَلَىٰٓ أَخِيهِ مِن قَبْلُ ۖ فَٱللَّهُ خَيْرٌ حَـٰفِظًا ۖ وَهُوَ أَرْحَمُ ٱلرَّٰحِمِينَ
    arabicPlain: قال هل آمنكم عليه إلا كما أمنتكم على أخيه من قبل ۖ فالله خير حافظا ۖ وهو أرحم الراحمين
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 200
    page: 243
