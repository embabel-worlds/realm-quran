  data:
    ref: 12:75
    scripture: quran
    name: Quran 12:75
    chapter: 12
    verse: 75
    ordinal: 1671
    text: 'They said: The penalty for it! He in whose bag (the cup) is found, he is the penalty for it. Thus we requite wrong-doers.'
    translation: Pickthall
    original: قَالُوا۟ جَزَٰٓؤُهُۥ مَن وُجِدَ فِى رَحْلِهِۦ فَهُوَ جَزَٰٓؤُهُۥ ۚ كَذَٰلِكَ نَجْزِى ٱلظَّـٰلِمِينَ
    arabicPlain: قالوا جزاؤه من وجد في رحله فهو جزاؤه ۚ كذلك نجزي الظالمين
