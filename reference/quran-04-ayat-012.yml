  data:
    ref: 12:76
    scripture: quran
    name: Quran 12:76
    chapter: 12
    verse: 76
    ordinal: 1672
    text: Then he (Joseph) began the search with their bags before his brother's bag, then he produced it from his brother's bag. Thus did We contrive for Joseph. He could not have taken his brother according to the king's law unless Allah willed. We raise by grades (of mercy) whom We will, and over every lord of knowledge there is one more knowing.
    translation: Pickthall
    original: فَبَدَأَ بِأَوْعِيَتِهِمْ قَبْلَ وِعَآءِ أَخِيهِ ثُمَّ ٱسْتَخْرَجَهَا مِن وِعَآءِ أَخِيهِ ۚ كَذَٰلِكَ كِدْنَا لِيُوسُفَ ۖ مَا كَانَ لِيَأْخُذَ أَخَاهُ فِى دِينِ ٱلْمَلِكِ إِلَّآ أَن يَشَآءَ ٱللَّهُ ۚ نَرْفَعُ دَرَجَـٰتٍ مَّن نَّشَآءُ ۗ وَفَوْقَ كُلِّ ذِى عِلْمٍ عَلِيمٌ
    arabicPlain: فبدأ بأوعيتهم قبل وعاء أخيه ثم استخرجها من وعاء أخيه ۚ كذلك كدنا ليوسف ۖ ما كان ليأخذ أخاه في دين الملك إلا أن يشاء الله ۚ نرفع درجات من نشاء ۗ وفوق كل ذي علم عليم
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 201
    page: 244
