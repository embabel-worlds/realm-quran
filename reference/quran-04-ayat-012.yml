  data:
    ref: '12:30'
    scripture: quran
    name: Quran 12:30
    chapter: 12
    verse: 30
    ordinal: 1626
    text: 'And women in the city said: The ruler''s wife is asking of her slave-boy an ill-deed. Indeed he has smitten her to the heart with love. We behold her in plain aberration.'
    translation: Pickthall
    original: ۞ وَقَالَ نِسْوَةٌ فِى ٱلْمَدِينَةِ ٱمْرَأَتُ ٱلْعَزِيزِ تُرَٰوِدُ فَتَىٰهَا عَن نَّفْسِهِۦ ۖ قَدْ شَغَفَهَا حُبًّا ۖ إِنَّا لَنَرَىٰهَا فِى ضَلَـٰلٍ مُّبِينٍ
    arabicPlain: ۞ وقال نسوة في المدينة امرأت العزيز تراود فتاها عن نفسه ۖ قد شغفها حبا ۖ إنا لنراها في ضلال مبين
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 196
    page: 238
