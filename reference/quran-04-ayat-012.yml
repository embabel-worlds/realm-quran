- type: Ayah
  data:
    ref: '12:27'
    scripture: quran
    name: Quran 12:27
    chapter: 12
    verse: 27
    ordinal: 1623
    text: And if his shirt is torn from behind, then she hath lied and he is of the truthful.
    translation: Pickthall
    original: وَإِن كَانَ قَمِيصُهُۥ قُدَّ مِن دُبُرٍ فَكَذَبَتْ وَهُوَ مِنَ ٱلصَّـٰدِقِينَ
    arabicPlain: وإن كان قميصه قد من دبر فكذبت وهو من الصادقين
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 195
    page: 238
