- type: Ayah
  data:
    ref: '12:48'
    scripture: quran
    name: Quran 12:48
    chapter: 12
    verse: 48
    ordinal: 1644
    text: Then after that will come seven hard years which will devour all that ye have prepared for them, save a little of that which ye have stored.
    translation: Pickthall
    original: ثُمَّ يَأْتِى مِنۢ بَعْدِ ذَٰلِكَ سَبْعٌ شِدَادٌ يَأْكُلْنَ مَا قَدَّمْتُمْ لَهُنَّ إِلَّا قَلِيلًا مِّمَّا تُحْصِنُونَ
    arabicPlain: ثم يأتي من بعد ذلك سبع شداد يأكلن ما قدمتم لهن إلا قليلا مما تحصنون
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 198
    page: 241
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '12'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-12
- type: Ayah
  data:
    ref: '12:49'
    scripture: quran
    name: Quran 12:49
    chapter: 12
    verse: 49
    ordinal: 1645
    text: Then, after that, will come a year when the people will have plenteous crops and when they will press (wine and oil).
    translation: Pickthall
    original: ثُمَّ يَأْتِى مِنۢ بَعْدِ ذَٰلِكَ عَامٌ فِيهِ يُغَاثُ ٱلنَّاسُ وَفِيهِ يَعْصِرُونَ
    arabicPlain: ثم يأتي من بعد ذلك عام فيه يغاث الناس وفيه يعصرون
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 198
    page: 241
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '12'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-12
- type: Ayah
  data:
    ref: '12:50'
    scripture: quran
    name: Quran 12:50
    chapter: 12
    verse: 50
    ordinal: 1646
    text: 'And the king said: Bring him unto me. And when the messenger came unto him, he (Joseph) said: Return unto thy lord and ask him what was the case of the women who cut their hands. Lo! my Lord knoweth their guile.'
    translation: Pickthall
    original: وَقَالَ ٱلْمَلِكُ ٱئْتُونِى بِهِۦ ۖ فَلَمَّا جَآءَهُ ٱلرَّسُولُ قَالَ ٱرْجِعْ إِلَىٰ رَبِّكَ فَسْـَٔلْهُ مَا بَالُ ٱلنِّسْوَةِ ٱلَّـٰتِى قَطَّعْنَ أَيْدِيَهُنَّ ۚ إِنَّ رَبِّى بِكَيْدِهِنَّ عَلِيمٌ
    arabicPlain: وقال الملك ائتوني به ۖ فلما جاءه الرسول قال ارجع إلى ربك فاسأله ما بال النسوة اللاتي قطعن أيديهن ۚ إن ربي بكيدهن عليم
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 199
    page: 241
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '12'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-12
- type: Ayah
  data:
    ref: '12:51'
    scripture: quran
    name: Quran 12:51
    chapter: 12
    verse: 51
    ordinal: 1647
    text: 'He (the king) (then sent for those women and) said: What happened when ye asked an evil act of Joseph? They answered: Allah Blameless! We know no evil of him. Said the wife of the ruler: Now the truth is out. I asked of him an evil act, and he is surely of the truthful.'
    translation: Pickthall
    original: قَالَ مَا خَطْبُكُنَّ إِذْ رَٰوَدتُّنَّ يُوسُفَ عَن نَّفْسِهِۦ ۚ قُلْنَ حَـٰشَ لِلَّهِ مَا عَلِمْنَا عَلَيْهِ مِن سُوٓءٍ ۚ قَالَتِ ٱمْرَأَتُ ٱلْعَزِيزِ ٱلْـَٔـٰنَ حَصْحَصَ ٱلْحَقُّ أَنَا۠ رَٰوَدتُّهُۥ عَن نَّفْسِهِۦ وَإِنَّهُۥ لَمِنَ ٱلصَّـٰدِقِينَ
    arabicPlain: قال ما خطبكن إذ راودتن يوسف عن نفسه ۚ قلن حاش لله ما علمنا عليه من سوء ۚ قالت امرأت العزيز الآن حصحص الحق أنا راودته عن نفسه وإنه لمن الصادقين
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 199
