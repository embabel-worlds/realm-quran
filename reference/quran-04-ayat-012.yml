  data:
    ref: '12:5'
    scripture: quran
    name: Quran 12:5
    chapter: 12
    verse: 5
    ordinal: 1601
    text: 'He said: O my dear son! Tell not thy brethren of thy vision, lest they plot a plot against thee. Lo! Satan is for man an open foe.'
    translation: Pickthall
    original: قَالَ يَـٰبُنَىَّ لَا تَقْصُصْ رُءْيَاكَ عَلَىٰٓ إِخْوَتِكَ فَيَكِيدُوا۟ لَكَ كَيْدًا ۖ إِنَّ ٱلشَّيْطَـٰنَ لِلْإِنسَـٰنِ عَدُوٌّ مُّبِينٌ
    arabicPlain: قال يا بني لا تقصص رؤياك على إخوتك فيكيدوا لك كيدا ۖ إن الشيطان للإنسان عدو مبين
    surahName: Yusuf
