    ref: '12:12'
    scripture: quran
    name: Quran 12:12
    chapter: 12
    verse: 12
    ordinal: 1608
    text: Send him with us to-morrow that he may enjoy himself and play. And lo! we shall take good care of him.
    translation: Pickthall
    original: أَرْسِلْهُ مَعَنَا غَدًا يَرْتَعْ وَيَلْعَبْ وَإِنَّا لَهُۥ لَحَـٰفِظُونَ
    arabicPlain: أرسله معنا غدا يرتع ويلعب وإنا له لحافظون
    surahName: Yusuf
    juz: 12
    manzil: 3
