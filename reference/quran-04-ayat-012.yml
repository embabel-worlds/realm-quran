    scripture: quran
    name: Quran 12:53
    chapter: 12
    verse: 53
    ordinal: 1649
    text: I do not exculpate myself. Lo! the (human) soul enjoineth unto evil, save that whereon my Lord hath mercy. Lo! my Lord is Forgiving, Merciful.
    translation: Pickthall
    original: ۞ وَمَآ أُبَرِّئُ نَفْسِىٓ ۚ إِنَّ ٱلنَّفْسَ لَأَمَّارَةٌۢ بِٱلسُّوٓءِ إِلَّا مَا رَحِمَ رَبِّىٓ ۚ إِنَّ رَبِّى غَفُورٌ رَّحِيمٌ
    arabicPlain: ۞ وما أبرئ نفسي ۚ إن النفس لأمارة بالسوء إلا ما رحم ربي ۚ إن ربي غفور رحيم
    surahName: Yusuf
