  data:
    ref: '12:24'
    scripture: quran
    name: Quran 12:24
    chapter: 12
    verse: 24
    ordinal: 1620
    text: She verily desired him, and he would have desired her if it had not been that he saw the argument of his Lord. Thus it was, that We might ward off from him evil and lewdness. Lo! he was of Our chosen slaves.
    translation: Pickthall
    original: وَلَقَدْ هَمَّتْ بِهِۦ ۖ وَهَمَّ بِهَا لَوْلَآ أَن رَّءَا بُرْهَـٰنَ رَبِّهِۦ ۚ كَذَٰلِكَ لِنَصْرِفَ عَنْهُ ٱلسُّوٓءَ وَٱلْفَحْشَآءَ ۚ إِنَّهُۥ مِنْ عِبَادِنَا ٱلْمُخْلَصِينَ
    arabicPlain: ولقد همت به ۖ وهم بها لولا أن رأى برهان ربه ۚ كذلك لنصرف عنه السوء والفحشاء ۚ إنه من عبادنا المخلصين
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 195
    page: 238
  relations:
