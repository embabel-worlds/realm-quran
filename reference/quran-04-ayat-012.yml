  data:
    ref: 12:72
    scripture: quran
    name: Quran 12:72
    chapter: 12
    verse: 72
    ordinal: 1668
    text: 'They said: We have lost the king''s cup, and he who bringeth it shall have a camel-load, and I (said Joseph) am answerable for it.'
    translation: Pickthall
    original: قَالُوا۟ نَفْقِدُ صُوَاعَ ٱلْمَلِكِ وَلِمَن جَآءَ بِهِۦ حِمْلُ بَعِيرٍ وَأَنَا۠ بِهِۦ زَعِيمٌ
    arabicPlain: قالوا نفقد صواع الملك ولمن جاء به حمل بعير وأنا به زعيم
