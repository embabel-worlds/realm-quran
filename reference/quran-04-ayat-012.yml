  data:
    ref: 12:81
    scripture: quran
    name: Quran 12:81
    chapter: 12
    verse: 81
    ordinal: 1677
    text: 'Return unto your father and say: O our father! Lo! thy son hath stolen. We testify only to that which we know; we are not guardians of the Unseen.'
    translation: Pickthall
    original: ٱرْجِعُوٓا۟ إِلَىٰٓ أَبِيكُمْ فَقُولُوا۟ يَـٰٓأَبَانَآ إِنَّ ٱبْنَكَ سَرَقَ وَمَا شَهِدْنَآ إِلَّا بِمَا عَلِمْنَا وَمَا كُنَّا لِلْغَيْبِ حَـٰفِظِينَ
    arabicPlain: ارجعوا إلى أبيكم فقولوا يا أبانا إن ابنك سرق وما شهدنا إلا بما علمنا وما كنا للغيب حافظين
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 202
