  data:
    ref: '12:58'
    scripture: quran
    name: Quran 12:58
    chapter: 12
    verse: 58
    ordinal: 1654
    text: And Joseph's brethren came and presented themselves before him, and he knew them but they knew him not.
    translation: Pickthall
    original: وَجَآءَ إِخْوَةُ يُوسُفَ فَدَخَلُوا۟ عَلَيْهِ فَعَرَفَهُمْ وَهُمْ لَهُۥ مُنكِرُونَ
    arabicPlain: وجاء إخوة يوسف فدخلوا عليه فعرفهم وهم له منكرون
