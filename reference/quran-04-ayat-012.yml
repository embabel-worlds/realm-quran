  data:
    ref: '12:41'
    scripture: quran
    name: Quran 12:41
    chapter: 12
    verse: 41
    ordinal: 1637
    text: O my two fellow-prisoners! As for one of you, he will pour out wine for his lord to drink; and as for the other, he will be crucified so that the birds will eat from his head. Thus is the case judged concerning which ye did inquire.
    translation: Pickthall
    original: يَـٰصَـٰحِبَىِ ٱلسِّجْنِ أَمَّآ أَحَدُكُمَا فَيَسْقِى رَبَّهُۥ خَمْرًا ۖ وَأَمَّا ٱلْـَٔاخَرُ فَيُصْلَبُ فَتَأْكُلُ ٱلطَّيْرُ مِن رَّأْسِهِۦ ۚ قُضِىَ ٱلْأَمْرُ ٱلَّذِى فِيهِ تَسْتَفْتِيَانِ
    arabicPlain: يا صاحبي السجن أما أحدكما فيسقي ربه خمرا ۖ وأما الآخر فيصلب فتأكل الطير من رأسه ۚ قضي الأمر الذي فيه تستفتيان
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 197
    page: 240
  relations:
  - predicate: IN
    to:
