  data:
    ref: 12:63
    scripture: quran
    name: Quran 12:63
    chapter: 12
    verse: 63
    ordinal: 1659
    text: 'So when they went back to their father they said: O our father! The measure is denied us, so send with us our brother that we may obtain the measure, surely we will guard him well.'
    translation: Pickthall
    original: فَلَمَّا رَجَعُوٓا۟ إِلَىٰٓ أَبِيهِمْ قَالُوا۟ يَـٰٓأَبَانَا مُنِعَ مِنَّا ٱلْكَيْلُ فَأَرْسِلْ مَعَنَآ أَخَانَا نَكْتَلْ وَإِنَّا لَهُۥ لَحَـٰفِظُونَ
    arabicPlain: فلما رجعوا إلى أبيهم قالوا يا أبانا منع منا الكيل فأرسل معنا أخانا نكتل وإنا له لحافظون
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 200
    page: 242
  relations:
  - predicate: IN
    to:
      type: Surah
