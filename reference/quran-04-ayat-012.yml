  data:
    ref: '12:22'
    scripture: quran
    name: Quran 12:22
    chapter: 12
    verse: 22
    ordinal: 1618
    text: And And when he reached his prime We gave him wisdom and knowledge. Thus We reward the good.
    translation: Pickthall
    original: وَلَمَّا بَلَغَ أَشُدَّهُۥٓ ءَاتَيْنَـٰهُ حُكْمًا وَعِلْمًا ۚ وَكَذَٰلِكَ نَجْزِى ٱلْمُحْسِنِينَ
    arabicPlain: ولما بلغ أشده آتيناه حكما وعلما ۚ وكذلك نجزي المحسنين
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 195
