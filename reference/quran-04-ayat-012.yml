  data:
    ref: '12:38'
    scripture: quran
    name: Quran 12:38
    chapter: 12
    verse: 38
    ordinal: 1634
    text: And I have followed the religion of my fathers, Abraham and Isaac and Jacob. It never was for us to attribute aught as partner to Allah. This is of the bounty of Allah unto us (the seed of Abraham) and unto mankind; but most men give not thanks.
    translation: Pickthall
    original: وَٱتَّبَعْتُ مِلَّةَ ءَابَآءِىٓ إِبْرَٰهِيمَ وَإِسْحَـٰقَ وَيَعْقُوبَ ۚ مَا كَانَ لَنَآ أَن نُّشْرِكَ بِٱللَّهِ مِن شَىْءٍ ۚ ذَٰلِكَ مِن فَضْلِ ٱللَّهِ عَلَيْنَا وَعَلَى ٱلنَّاسِ وَلَـٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يَشْكُرُونَ
    arabicPlain: واتبعت ملة آبائي إبراهيم وإسحاق ويعقوب ۚ ما كان لنا أن نشرك بالله من شيء ۚ ذلك من فضل الله علينا وعلى الناس ولكن أكثر الناس لا يشكرون
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 197
    page: 240
