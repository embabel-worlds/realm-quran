  data:
    ref: 12:77
    scripture: quran
    name: Quran 12:77
    chapter: 12
    verse: 77
    ordinal: 1673
    text: 'They said: If he stealeth, a brother of his stole before. But Joseph kept it secret in his soul and revealed it not unto them. He said (within himself): Ye are in worse case, and Allah knoweth best (the truth of) that which ye allege.'
    translation: Pickthall
    original: ۞ قَالُوٓا۟ إِن يَسْرِقْ فَقَدْ سَرَقَ أَخٌ لَّهُۥ مِن قَبْلُ ۚ فَأَسَرَّهَا يُوسُفُ فِى نَفْسِهِۦ وَلَمْ يُبْدِهَا لَهُمْ ۚ قَالَ أَنتُمْ شَرٌّ مَّكَانًا ۖ وَٱللَّهُ أَعْلَمُ بِمَا تَصِفُونَ
    arabicPlain: ۞ قالوا إن يسرق فقد سرق أخ له من قبل ۚ فأسرها يوسف في نفسه ولم يبدها لهم ۚ قال أنتم شر مكانا ۖ والله أعلم بما تصفون
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 201
    page: 244
