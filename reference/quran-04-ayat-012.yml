  data:
    ref: '12:23'
    scripture: quran
    name: Quran 12:23
    chapter: 12
    verse: 23
    ordinal: 1619
    text: 'And she, in whose house he was, asked of him an evil act. She bolted the doors and said: Come! He said: I seek refuge in Allah! Lo! he is my lord, who hath treated me honourably. Lo! wrong-doers never prosper.'
    translation: Pickthall
    original: وَرَٰوَدَتْهُ ٱلَّتِى هُوَ فِى بَيْتِهَا عَن نَّفْسِهِۦ وَغَلَّقَتِ ٱلْأَبْوَٰبَ وَقَالَتْ هَيْتَ لَكَ ۚ قَالَ مَعَاذَ ٱللَّهِ ۖ إِنَّهُۥ رَبِّىٓ أَحْسَنَ مَثْوَاىَ ۖ إِنَّهُۥ لَا يُفْلِحُ ٱلظَّـٰلِمُونَ
    arabicPlain: وراودته التي هو في بيتها عن نفسه وغلقت الأبواب وقالت هيت لك ۚ قال معاذ الله ۖ إنه ربي أحسن مثواي ۖ إنه لا يفلح الظالمون
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 195
    page: 238
  relations:
  - predicate: IN
    to:
      type: Surah
