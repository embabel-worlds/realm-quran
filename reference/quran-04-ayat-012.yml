  data:
    ref: 12:79
    scripture: quran
    name: Quran 12:79
    chapter: 12
    verse: 79
    ordinal: 1675
    text: 'He said: Allah forbid that we should seize save him with whom we found our property; then truly we should be wrong-doers.'
    translation: Pickthall
    original: قَالَ مَعَاذَ ٱللَّهِ أَن نَّأْخُذَ إِلَّا مَن وَجَدْنَا مَتَـٰعَنَا عِندَهُۥٓ إِنَّآ إِذًا لَّظَـٰلِمُونَ
    arabicPlain: قال معاذ الله أن نأخذ إلا من وجدنا متاعنا عنده إنا إذا لظالمون
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 201
