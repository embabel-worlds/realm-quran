  data:
    ref: 12:62
    scripture: quran
    name: Quran 12:62
    chapter: 12
    verse: 62
    ordinal: 1658
    text: 'He said unto his young men: Place their merchandise in their saddlebags, so that they may know it when they go back to their folk, and so will come again.'
    translation: Pickthall
    original: وَقَالَ لِفِتْيَـٰنِهِ ٱجْعَلُوا۟ بِضَـٰعَتَهُمْ فِى رِحَالِهِمْ لَعَلَّهُمْ يَعْرِفُونَهَآ إِذَا ٱنقَلَبُوٓا۟ إِلَىٰٓ أَهْلِهِمْ لَعَلَّهُمْ يَرْجِعُونَ
    arabicPlain: وقال لفتيانه اجعلوا بضاعتهم في رحالهم لعلهم يعرفونها إذا انقلبوا إلى أهلهم لعلهم يرجعون
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 200
    page: 242
  relations:
