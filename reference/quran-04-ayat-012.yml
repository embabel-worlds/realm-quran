  data:
    ref: 12:85
    scripture: quran
    name: Quran 12:85
    chapter: 12
    verse: 85
    ordinal: 1681
    text: 'They said: By Allah, thou wilt never cease remembering Joseph till thy health is ruined or thou art of those who perish!'
    translation: Pickthall
    original: قَالُوا۟ تَٱللَّهِ تَفْتَؤُا۟ تَذْكُرُ يُوسُفَ حَتَّىٰ تَكُونَ حَرَضًا أَوْ تَكُونَ مِنَ ٱلْهَـٰلِكِينَ
    arabicPlain: قالوا تالله تفتأ تذكر يوسف حتى تكون حرضا أو تكون من الهالكين
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 202
