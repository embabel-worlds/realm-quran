  data:
    ref: '12:54'
    scripture: quran
    name: Quran 12:54
    chapter: 12
    verse: 54
    ordinal: 1650
    text: 'And the king said: Bring him unto me that I may attach him to my person. And when he had talked with him he said: Lo! thou art to-day in our presence established and trusted.'
    translation: Pickthall
    original: وَقَالَ ٱلْمَلِكُ ٱئْتُونِى بِهِۦٓ أَسْتَخْلِصْهُ لِنَفْسِى ۖ فَلَمَّا كَلَّمَهُۥ قَالَ إِنَّكَ ٱلْيَوْمَ لَدَيْنَا مَكِينٌ أَمِينٌ
    arabicPlain: وقال الملك ائتوني به أستخلصه لنفسي ۖ فلما كلمه قال إنك اليوم لدينا مكين أمين
    surahName: Yusuf
    juz: 13
