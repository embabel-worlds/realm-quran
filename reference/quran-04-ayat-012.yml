    translation: Pickthall
    original: ۞ رَبِّ قَدْ ءَاتَيْتَنِى مِنَ ٱلْمُلْكِ وَعَلَّمْتَنِى مِن تَأْوِيلِ ٱلْأَحَادِيثِ ۚ فَاطِرَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ أَنتَ وَلِىِّۦ فِى ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ ۖ تَوَفَّنِى مُسْلِمًا وَأَلْحِقْنِى بِٱلصَّـٰلِحِينَ
    arabicPlain: ۞ رب قد آتيتني من الملك وعلمتني من تأويل الأحاديث ۚ فاطر السماوات والأرض أنت وليي في الدنيا والآخرة ۖ توفني مسلما وألحقني بالصالحين
