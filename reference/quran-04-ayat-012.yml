    scripture: quran
    name: Quran 12:9
    chapter: 12
    verse: 9
    ordinal: 1605
    text: '(One said): Kill Joseph or cast him to some (other) land, so that your father''s favour may be all for you, and (that) ye may afterward be righteous folk.'
    translation: Pickthall
    original: ٱقْتُلُوا۟ يُوسُفَ أَوِ ٱطْرَحُوهُ أَرْضًا يَخْلُ لَكُمْ وَجْهُ أَبِيكُمْ وَتَكُونُوا۟ مِنۢ بَعْدِهِۦ قَوْمًا صَـٰلِحِينَ
    arabicPlain: اقتلوا يوسف أو اطرحوه أرضا يخل لكم وجه أبيكم وتكونوا من بعده قوما صالحين
    surahName: Yusuf
    juz: 12
