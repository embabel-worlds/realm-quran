    name: Quran 12:52
    chapter: 12
    verse: 52
    ordinal: 1648
    text: '(Then Joseph said: I asked for) this, that he (my lord) may know that I betrayed him not in secret, and that surely Allah guideth not the snare of the betrayers.'
    translation: Pickthall
    original: ذَٰلِكَ لِيَعْلَمَ أَنِّى لَمْ أَخُنْهُ بِٱلْغَيْبِ وَأَنَّ ٱللَّهَ لَا يَهْدِى كَيْدَ ٱلْخَآئِنِينَ
    arabicPlain: ذلك ليعلم أني لم أخنه بالغيب وأن الله لا يهدي كيد الخائنين
    surahName: Yusuf
