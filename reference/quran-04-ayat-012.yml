    scripture: quran
    name: Quran 12:19
    chapter: 12
    verse: 19
    ordinal: 1615
    text: 'And there came a caravan, and they sent their waterdrawer. He let down his pail (into the pit). He said: Good luck! Here is a youth. And they hid him as a treasure, and Allah was Aware of what they did.'
    translation: Pickthall
    original: وَجَآءَتْ سَيَّارَةٌ فَأَرْسَلُوا۟ وَارِدَهُمْ فَأَدْلَىٰ دَلْوَهُۥ ۖ قَالَ يَـٰبُشْرَىٰ هَـٰذَا غُلَـٰمٌ ۚ وَأَسَرُّوهُ بِضَـٰعَةً ۚ وَٱللَّهُ عَلِيمٌۢ بِمَا يَعْمَلُونَ
    arabicPlain: وجاءت سيارة فأرسلوا واردهم فأدلى دلوه ۖ قال يا بشرى هذا غلام ۚ وأسروه بضاعة ۚ والله عليم بما يعملون
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 194
