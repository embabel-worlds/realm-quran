    scripture: quran
    name: Quran 12:55
    chapter: 12
    verse: 55
    ordinal: 1651
    text: 'He said: Set me over the storehouses of the land. Lo! I am a skilled custodian.'
    translation: Pickthall
    original: قَالَ ٱجْعَلْنِى عَلَىٰ خَزَآئِنِ ٱلْأَرْضِ ۖ إِنِّى حَفِيظٌ عَلِيمٌ
    arabicPlain: قال اجعلني على خزائن الأرض ۖ إني حفيظ عليم
