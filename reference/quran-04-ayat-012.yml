  data:
    ref: '12:28'
    scripture: quran
    name: Quran 12:28
    chapter: 12
    verse: 28
    ordinal: 1624
    text: 'So when he saw his shirt torn from behind, he said: Lo! this is of the guile of you women. Lo! the guile of you is very great.'
    translation: Pickthall
    original: فَلَمَّا رَءَا قَمِيصَهُۥ قُدَّ مِن دُبُرٍ قَالَ إِنَّهُۥ مِن كَيْدِكُنَّ ۖ إِنَّ كَيْدَكُنَّ عَظِيمٌ
    arabicPlain: فلما رأى قميصه قد من دبر قال إنه من كيدكن ۖ إن كيدكن عظيم
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 195
