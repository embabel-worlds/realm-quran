  data:
    ref: 12:82
    scripture: quran
    name: Quran 12:82
    chapter: 12
    verse: 82
    ordinal: 1678
    text: Ask the township where we were, and the caravan with which we travelled hither. Lo! we speak the truth.
    translation: Pickthall
    original: وَسْـَٔلِ ٱلْقَرْيَةَ ٱلَّتِى كُنَّا فِيهَا وَٱلْعِيرَ ٱلَّتِىٓ أَقْبَلْنَا فِيهَا ۖ وَإِنَّا لَصَـٰدِقُونَ
    arabicPlain: واسأل القرية التي كنا فيها والعير التي أقبلنا فيها ۖ وإنا لصادقون
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 202
    page: 245
