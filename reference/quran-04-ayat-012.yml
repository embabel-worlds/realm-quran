    name: Quran 12:108
    chapter: 12
    verse: 108
    ordinal: 1704
    text: 'Say: This is my Way: I call on Allah with sure knowledge. I and whosoever followeth me - Glory be to Allah! - and I am not of the idolaters.'
    translation: Pickthall
    original: قُلْ هَـٰذِهِۦ سَبِيلِىٓ أَدْعُوٓا۟ إِلَى ٱللَّهِ ۚ عَلَىٰ بَصِيرَةٍ أَنَا۠ وَمَنِ ٱتَّبَعَنِى ۖ وَسُبْحَـٰنَ ٱللَّهِ وَمَآ أَنَا۠ مِنَ ٱلْمُشْرِكِينَ
    arabicPlain: قل هذه سبيلي أدعو إلى الله ۚ على بصيرة أنا ومن اتبعني ۖ وسبحان الله وما أنا من المشركين
