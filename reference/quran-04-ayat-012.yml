  data:
    ref: '12:39'
    scripture: quran
    name: Quran 12:39
    chapter: 12
    verse: 39
    ordinal: 1635
    text: O my fellow-prisoners! Are divers lords better, or Allah the One, Almighty?
    translation: Pickthall
    original: يَـٰصَـٰحِبَىِ ٱلسِّجْنِ ءَأَرْبَابٌ مُّتَفَرِّقُونَ خَيْرٌ أَمِ ٱللَّهُ ٱلْوَٰحِدُ ٱلْقَهَّارُ
    arabicPlain: يا صاحبي السجن أأرباب متفرقون خير أم الله الواحد القهار
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 197
    page: 240
