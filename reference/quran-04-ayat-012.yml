  data:
    ref: '12:36'
    scripture: quran
    name: Quran 12:36
    chapter: 12
    verse: 36
    ordinal: 1632
    text: 'And two young men went to prison with him. One of them said: I dreamed that I was pressing wine. The other said: I dreamed that I was carrying upon my head bread whereof the birds were eating. Announce unto us the interpretation, for we see thee of those good (at interpretation).'
    translation: Pickthall
    original: وَدَخَلَ مَعَهُ ٱلسِّجْنَ فَتَيَانِ ۖ قَالَ أَحَدُهُمَآ إِنِّىٓ أَرَىٰنِىٓ أَعْصِرُ خَمْرًا ۖ وَقَالَ ٱلْـَٔاخَرُ إِنِّىٓ أَرَىٰنِىٓ أَحْمِلُ فَوْقَ رَأْسِى خُبْزًا تَأْكُلُ ٱلطَّيْرُ مِنْهُ ۖ نَبِّئْنَا بِتَأْوِيلِهِۦٓ ۖ إِنَّا نَرَىٰكَ مِنَ ٱلْمُحْسِنِينَ
    arabicPlain: ودخل معه السجن فتيان ۖ قال أحدهما إني أراني أعصر خمرا ۖ وقال الآخر إني أراني أحمل فوق رأسي خبزا تأكل الطير منه ۖ نبئنا بتأويله ۖ إنا نراك من المحسنين
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 197
    page: 239
