  data:
    ref: '12:26'
    scripture: quran
    name: Quran 12:26
    chapter: 12
    verse: 26
    ordinal: 1622
    text: '(Joseph) said: She it was who asked of me an evil act. And a witness of her own folk testified: If his shirt is torn from before, then she speaketh truth and he is of the liars.'
    translation: Pickthall
    original: قَالَ هِىَ رَٰوَدَتْنِى عَن نَّفْسِى ۚ وَشَهِدَ شَاهِدٌ مِّنْ أَهْلِهَآ إِن كَانَ قَمِيصُهُۥ قُدَّ مِن قُبُلٍ فَصَدَقَتْ وَهُوَ مِنَ ٱلْكَـٰذِبِينَ
    arabicPlain: قال هي راودتني عن نفسي ۚ وشهد شاهد من أهلها إن كان قميصه قد من قبل فصدقت وهو من الكاذبين
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 195
    page: 238
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '12'
  - predicate: IN_PORTION
    to:
      type: Juz
