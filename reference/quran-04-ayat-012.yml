    name: Quran 12:69
    chapter: 12
    verse: 69
    ordinal: 1665
    text: 'And when they went in before Joseph, he took his brother unto him, saying: Lo! I, even I, am thy brother, therefore sorrow not for what they did.'
    translation: Pickthall
    original: وَلَمَّا دَخَلُوا۟ عَلَىٰ يُوسُفَ ءَاوَىٰٓ إِلَيْهِ أَخَاهُ ۖ قَالَ إِنِّىٓ أَنَا۠ أَخُوكَ فَلَا تَبْتَئِسْ بِمَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: ولما دخلوا على يوسف آوى إليه أخاه ۖ قال إني أنا أخوك فلا تبتئس بما كانوا يعملون
    surahName: Yusuf
