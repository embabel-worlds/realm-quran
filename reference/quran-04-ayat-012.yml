  data:
    ref: '12:10'
    scripture: quran
    name: Quran 12:10
    chapter: 12
    verse: 10
    ordinal: 1606
    text: 'One among them said: Kill not Joseph but, if ye must be doing, fling him into the depth of the pit; some caravan will find him.'
    translation: Pickthall
    original: قَالَ قَآئِلٌ مِّنْهُمْ لَا تَقْتُلُوا۟ يُوسُفَ وَأَلْقُوهُ فِى غَيَـٰبَتِ ٱلْجُبِّ يَلْتَقِطْهُ بَعْضُ ٱلسَّيَّارَةِ إِن كُنتُمْ فَـٰعِلِينَ
    arabicPlain: قال قائل منهم لا تقتلوا يوسف وألقوه في غيابت الجب يلتقطه بعض السيارة إن كنتم فاعلين
    surahName: Yusuf
    juz: 12
