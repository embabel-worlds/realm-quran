    scripture: quran
    name: Quran 12:18
    chapter: 12
    verse: 18
    ordinal: 1614
    text: 'And they came with false blood on his shirt. He said: Nay, but your minds have beguiled you into something. (My course is) comely patience. And Allah it is Whose help is to be sought in that (predicament) which ye describe.'
    translation: Pickthall
    original: وَجَآءُو عَلَىٰ قَمِيصِهِۦ بِدَمٍ كَذِبٍ ۚ قَالَ بَلْ سَوَّلَتْ لَكُمْ أَنفُسُكُمْ أَمْرًا ۖ فَصَبْرٌ جَمِيلٌ ۖ وَٱللَّهُ ٱلْمُسْتَعَانُ عَلَىٰ مَا تَصِفُونَ
    arabicPlain: وجاءوا على قميصه بدم كذب ۚ قال بل سولت لكم أنفسكم أمرا ۖ فصبر جميل ۖ والله المستعان على ما تصفون
    surahName: Yusuf
