  data:
    ref: 12:60
    scripture: quran
    name: Quran 12:60
    chapter: 12
    verse: 60
    ordinal: 1656
    text: And if ye bring him not unto me, then there shall be no measure for you with me, nor shall ye draw near.
    translation: Pickthall
    original: فَإِن لَّمْ تَأْتُونِى بِهِۦ فَلَا كَيْلَ لَكُمْ عِندِى وَلَا تَقْرَبُونِ
    arabicPlain: فإن لم تأتوني به فلا كيل لكم عندي ولا تقربون
    surahName: Yusuf
    juz: 13
    manzil: 3
