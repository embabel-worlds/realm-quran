  data:
    ref: 12:61
    scripture: quran
    name: Quran 12:61
    chapter: 12
    verse: 61
    ordinal: 1657
    text: 'They said: We will try to win him from his father: that we will surely do.'
    translation: Pickthall
    original: قَالُوا۟ سَنُرَٰوِدُ عَنْهُ أَبَاهُ وَإِنَّا لَفَـٰعِلُونَ
    arabicPlain: قالوا سنراود عنه أباه وإنا لفاعلون
