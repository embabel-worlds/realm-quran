  data:
    ref: '12:59'
    scripture: quran
    name: Quran 12:59
    chapter: 12
    verse: 59
    ordinal: 1655
    text: 'And when he provided them with their provision he said: Bring unto me a brother of yours from your father. See ye not that I fill up the measure and I am the best of hosts?'
    translation: Pickthall
    original: وَلَمَّا جَهَّزَهُم بِجَهَازِهِمْ قَالَ ٱئْتُونِى بِأَخٍ لَّكُم مِّنْ أَبِيكُمْ ۚ أَلَا تَرَوْنَ أَنِّىٓ أُوفِى ٱلْكَيْلَ وَأَنَا۠ خَيْرُ ٱلْمُنزِلِينَ
    arabicPlain: ولما جهزهم بجهازهم قال ائتوني بأخ لكم من أبيكم ۚ ألا ترون أني أوفي الكيل وأنا خير المنزلين
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 200
