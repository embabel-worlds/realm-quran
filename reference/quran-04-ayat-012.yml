  data:
    ref: '12:29'
    scripture: quran
    name: Quran 12:29
    chapter: 12
    verse: 29
    ordinal: 1625
    text: O Joseph! Turn away from this, and thou, (O woman), ask forgiveness for thy sin. Lo! thou art of the faulty.
    translation: Pickthall
    original: يُوسُفُ أَعْرِضْ عَنْ هَـٰذَا ۚ وَٱسْتَغْفِرِى لِذَنۢبِكِ ۖ إِنَّكِ كُنتِ مِنَ ٱلْخَاطِـِٔينَ
    arabicPlain: يوسف أعرض عن هذا ۚ واستغفري لذنبك ۖ إنك كنت من الخاطئين
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 195
