  data:
    ref: '12:25'
    scripture: quran
    name: Quran 12:25
    chapter: 12
    verse: 25
    ordinal: 1621
    text: 'And they raced with one another to the door, and she tore his shirt from behind, and they met her lord and master at the door. She said: What shall be his reward, who wisheth evil to thy folk, save prison or a painful doom?'
    translation: Pickthall
    original: وَٱسْتَبَقَا ٱلْبَابَ وَقَدَّتْ قَمِيصَهُۥ مِن دُبُرٍ وَأَلْفَيَا سَيِّدَهَا لَدَا ٱلْبَابِ ۚ قَالَتْ مَا جَزَآءُ مَنْ أَرَادَ بِأَهْلِكَ سُوٓءًا إِلَّآ أَن يُسْجَنَ أَوْ عَذَابٌ أَلِيمٌ
    arabicPlain: واستبقا الباب وقدت قميصه من دبر وألفيا سيدها لدى الباب ۚ قالت ما جزاء من أراد بأهلك سوءا إلا أن يسجن أو عذاب أليم
    surahName: Yusuf
    juz: 12
    manzil: 3
    ruku: 195
    page: 238
