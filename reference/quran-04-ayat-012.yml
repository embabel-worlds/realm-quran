  data:
    ref: 12:84
    scripture: quran
    name: Quran 12:84
    chapter: 12
    verse: 84
    ordinal: 1680
    text: 'And he turned away from them and said: Alas, my grief for Joseph! And his eyes were whitened with the sorrow that he was suppressing.'
    translation: Pickthall
    original: وَتَوَلَّىٰ عَنْهُمْ وَقَالَ يَـٰٓأَسَفَىٰ عَلَىٰ يُوسُفَ وَٱبْيَضَّتْ عَيْنَاهُ مِنَ ٱلْحُزْنِ فَهُوَ كَظِيمٌ
    arabicPlain: وتولى عنهم وقال يا أسفى على يوسف وابيضت عيناه من الحزن فهو كظيم
    surahName: Yusuf
    juz: 13
    manzil: 3
    ruku: 202
    page: 245
