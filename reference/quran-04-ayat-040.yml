  data:
    ref: '40:30'
    scripture: quran
    name: Quran 40:30
    chapter: 40
    verse: 30
    ordinal: 4163
    text: 'And he who believed said: O my people! Lo! I fear for you a fate like that of the factions (of old);'
    translation: Pickthall
    original: وَقَالَ ٱلَّذِىٓ ءَامَنَ يَـٰقَوْمِ إِنِّىٓ أَخَافُ عَلَيْكُم مِّثْلَ يَوْمِ ٱلْأَحْزَابِ
    arabicPlain: وقال الذي آمن يا قوم إني أخاف عليكم مثل يوم الأحزاب
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 407
    page: 470
  relations:
  - predicate: IN
    to:
