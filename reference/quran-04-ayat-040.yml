- type: Ayah
  data:
    ref: '40:5'
    scripture: quran
    name: Quran 40:5
    chapter: 40
    verse: 5
    ordinal: 4138
    text: The folk of Noah and the factions after them denied (their messengers) before these, and every nation purposed to seize their messenger and argued falsely, (thinking) thereby to refute the Truth. Then I seized them, and how (awful) was My punishment.
    translation: Pickthall
    original: كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍ وَٱلْأَحْزَابُ مِنۢ بَعْدِهِمْ ۖ وَهَمَّتْ كُلُّ أُمَّةٍۭ بِرَسُولِهِمْ لِيَأْخُذُوهُ ۖ وَجَـٰدَلُوا۟ بِٱلْبَـٰطِلِ لِيُدْحِضُوا۟ بِهِ ٱلْحَقَّ فَأَخَذْتُهُمْ ۖ فَكَيْفَ كَانَ عِقَابِ
    arabicPlain: كذبت قبلهم قوم نوح والأحزاب من بعدهم ۖ وهمت كل أمة برسولهم ليأخذوه ۖ وجادلوا بالباطل ليدحضوا به الحق فأخذتهم ۖ فكيف كان عقاب
    surahName: Al-Ghaafir
    juz: 24
