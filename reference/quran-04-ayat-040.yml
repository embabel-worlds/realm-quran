    scripture: quran
    name: Quran 40:56
    chapter: 40
    verse: 56
    ordinal: 4189
    text: Lo! those who wrangle concerning the revelations of Allah without a warrant having come unto them, there is naught else in their breasts save pride which they will never attain. So take thou refuge in Allah. Lo! He, only He, is the Hearer, the Seer.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ يُجَـٰدِلُونَ فِىٓ ءَايَـٰتِ ٱللَّهِ بِغَيْرِ سُلْطَـٰنٍ أَتَىٰهُمْ ۙ إِن فِى صُدُورِهِمْ إِلَّا كِبْرٌ مَّا هُم بِبَـٰلِغِيهِ ۚ فَٱسْتَعِذْ بِٱللَّهِ ۖ إِنَّهُۥ هُوَ ٱلسَّمِيعُ ٱلْبَصِيرُ
    arabicPlain: إن الذين يجادلون في آيات الله بغير سلطان أتاهم ۙ إن في صدورهم إلا كبر ما هم ببالغيه ۚ فاستعذ بالله ۖ إنه هو السميع البصير
