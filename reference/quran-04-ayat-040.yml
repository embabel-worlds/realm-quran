  data:
    ref: 40:68
    scripture: quran
    name: Quran 40:68
    chapter: 40
    verse: 68
    ordinal: 4201
    text: 'He it is Who quickeneth and giveth death. When He ordaineth a thing, He saith unto it only: Be! and it is.'
    translation: Pickthall
    original: هُوَ ٱلَّذِى يُحْىِۦ وَيُمِيتُ ۖ فَإِذَا قَضَىٰٓ أَمْرًا فَإِنَّمَا يَقُولُ لَهُۥ كُن فَيَكُونُ
    arabicPlain: هو الذي يحيي ويميت ۖ فإذا قضى أمرا فإنما يقول له كن فيكون
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 410
