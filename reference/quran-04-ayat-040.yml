    scripture: quran
    name: Quran 40:59
    chapter: 40
    verse: 59
    ordinal: 4192
    text: Lo! the Hour is surely coming, there is no doubt thereof; yet most of mankind believe not.
    translation: Pickthall
    original: إِنَّ ٱلسَّاعَةَ لَـَٔاتِيَةٌ لَّا رَيْبَ فِيهَا وَلَـٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يُؤْمِنُونَ
