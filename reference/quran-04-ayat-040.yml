    scripture: quran
    name: Quran 40:65
    chapter: 40
    verse: 65
    ordinal: 4198
    text: He is the Living One. There is no Allah save Him. So pray unto Him, making religion pure for Him (only). Praise be to Allah, the Lord of the Worlds!
    translation: Pickthall
    original: هُوَ ٱلْحَىُّ لَآ إِلَـٰهَ إِلَّا هُوَ فَٱدْعُوهُ مُخْلِصِينَ لَهُ ٱلدِّينَ ۗ ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَـٰلَمِينَ
    arabicPlain: هو الحي لا إله إلا هو فادعوه مخلصين له الدين ۗ الحمد لله رب العالمين
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
