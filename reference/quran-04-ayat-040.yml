  data:
    ref: '40:33'
    scripture: quran
    name: Quran 40:33
    chapter: 40
    verse: 33
    ordinal: 4166
    text: 'A day when ye will turn to flee, having no preserver from Allah: and he whom Allah sendeth astray, for him there is no guide.'
    translation: Pickthall
    original: يَوْمَ تُوَلُّونَ مُدْبِرِينَ مَا لَكُم مِّنَ ٱللَّهِ مِنْ عَاصِمٍ ۗ وَمَن يُضْلِلِ ٱللَّهُ فَمَا لَهُۥ مِنْ هَادٍ
    arabicPlain: يوم تولون مدبرين ما لكم من الله من عاصم ۗ ومن يضلل الله فما له من هاد
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 407
    page: 470
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '40'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-24
- type: Ayah
  data:
    ref: '40:34'
    scripture: quran
    name: Quran 40:34
    chapter: 40
    verse: 34
    ordinal: 4167
    text: 'And verily Joseph brought you of old clear proofs, yet ye ceased not to be in doubt concerning what he brought you till, when he died, ye said: Allah will not send any messenger after him. Thus Allah deceiveth him who is a prodigal, a doubter.'
    translation: Pickthall
    original: وَلَقَدْ جَآءَكُمْ يُوسُفُ مِن قَبْلُ بِٱلْبَيِّنَـٰتِ فَمَا زِلْتُمْ فِى شَكٍّ مِّمَّا جَآءَكُم بِهِۦ ۖ حَتَّىٰٓ إِذَا هَلَكَ قُلْتُمْ لَن يَبْعَثَ ٱللَّهُ مِنۢ بَعْدِهِۦ رَسُولًا ۚ كَذَٰلِكَ يُضِلُّ ٱللَّهُ مَنْ هُوَ مُسْرِفٌ مُّرْتَابٌ
    arabicPlain: ولقد جاءكم يوسف من قبل بالبينات فما زلتم في شك مما جاءكم به ۖ حتى إذا هلك قلتم لن يبعث الله من بعده رسولا ۚ كذلك يضل الله من هو مسرف مرتاب
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 407
    page: 471
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '40'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-24
- type: Ayah
  data:
    ref: '40:35'
    scripture: quran
    name: Quran 40:35
    chapter: 40
    verse: 35
    ordinal: 4168
    text: Those who wrangle concerning the revelations of Allah without any warrant that hath come unto them, it is greatly hateful in the sight of Allah and in the sight of those who believe. Thus doth Allah print on every arrogant, disdainful heart.
    translation: Pickthall
    original: ٱلَّذِينَ يُجَـٰدِلُونَ فِىٓ ءَايَـٰتِ ٱللَّهِ بِغَيْرِ سُلْطَـٰنٍ أَتَىٰهُمْ ۖ كَبُرَ مَقْتًا عِندَ ٱللَّهِ وَعِندَ ٱلَّذِينَ ءَامَنُوا۟ ۚ كَذَٰلِكَ يَطْبَعُ ٱللَّهُ عَلَىٰ كُلِّ قَلْبِ مُتَكَبِّرٍ جَبَّارٍ
    arabicPlain: الذين يجادلون في آيات الله بغير سلطان أتاهم ۖ كبر مقتا عند الله وعند الذين آمنوا ۚ كذلك يطبع الله على كل قلب متكبر جبار
    surahName: Al-Ghaafir
