  data:
    ref: '40:24'
    scripture: quran
    name: Quran 40:24
    chapter: 40
    verse: 24
    ordinal: 4157
    text: 'Unto Pharaoh and Haman and Korah, but they said: A lying sorcerer!'
    translation: Pickthall
    original: إِلَىٰ فِرْعَوْنَ وَهَـٰمَـٰنَ وَقَـٰرُونَ فَقَالُوا۟ سَـٰحِرٌ كَذَّابٌ
    arabicPlain: إلى فرعون وهامان وقارون فقالوا ساحر كذاب
    surahName: Al-Ghaafir
    juz: 24
