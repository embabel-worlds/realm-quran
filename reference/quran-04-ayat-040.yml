    scripture: quran
    name: Quran 40:72
    chapter: 40
    verse: 72
    ordinal: 4205
    text: Through boiling waters; then they are thrust into the Fire.
    translation: Pickthall
    original: فِى ٱلْحَمِيمِ ثُمَّ فِى ٱلنَّارِ يُسْجَرُونَ
    arabicPlain: في الحميم ثم في النار يسجرون
