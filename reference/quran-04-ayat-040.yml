  data:
    ref: '40:18'
    scripture: quran
    name: Quran 40:18
    chapter: 40
    verse: 18
    ordinal: 4151
    text: Warn them (O Muhammad) of the Day of the approaching (doom), when the hearts will be choking the throats, (when) there will be no friend for the wrong-doers, nor any intercessor who will be heard.
    translation: Pickthall
    original: وَأَنذِرْهُمْ يَوْمَ ٱلْـَٔازِفَةِ إِذِ ٱلْقُلُوبُ لَدَى ٱلْحَنَاجِرِ كَـٰظِمِينَ ۚ مَا لِلظَّـٰلِمِينَ مِنْ حَمِيمٍ وَلَا شَفِيعٍ يُطَاعُ
    arabicPlain: وأنذرهم يوم الآزفة إذ القلوب لدى الحناجر كاظمين ۚ ما للظالمين من حميم ولا شفيع يطاع
    surahName: Al-Ghaafir
