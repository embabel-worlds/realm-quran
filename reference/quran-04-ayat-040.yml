    scripture: quran
    name: Quran 40:41
    chapter: 40
    verse: 41
    ordinal: 4174
    text: And, O my people! What aileth me that I call you unto deliverance when ye call me unto the Fire?
    translation: Pickthall
    original: ۞ وَيَـٰقَوْمِ مَا لِىٓ أَدْعُوكُمْ إِلَى ٱلنَّجَوٰةِ وَتَدْعُونَنِىٓ إِلَى ٱلنَّارِ
    arabicPlain: ۞ ويا قوم ما لي أدعوكم إلى النجاة وتدعونني إلى النار
    surahName: Al-Ghaafir
    juz: 24
