- type: Ayah
  data:
    ref: '40:9'
    scripture: quran
    name: Quran 40:9
    chapter: 40
    verse: 9
    ordinal: 4142
    text: And ward off from them ill-deeds; and he from whom Thou wardest off ill-deeds that day, him verily hast Thou taken into mercy. That is the supreme triumph.
    translation: Pickthall
    original: وَقِهِمُ ٱلسَّيِّـَٔاتِ ۚ وَمَن تَقِ ٱلسَّيِّـَٔاتِ يَوْمَئِذٍ فَقَدْ رَحِمْتَهُۥ ۚ وَذَٰلِكَ هُوَ ٱلْفَوْزُ ٱلْعَظِيمُ
    arabicPlain: وقهم السيئات ۚ ومن تق السيئات يومئذ فقد رحمته ۚ وذلك هو الفوز العظيم
    surahName: Al-Ghaafir
