  data:
    ref: '40:17'
    scripture: quran
    name: Quran 40:17
    chapter: 40
    verse: 17
    ordinal: 4150
    text: This day is each soul requited that which it hath earned; no wrong (is done) this day. Lo! Allah is swift at reckoning.
    translation: Pickthall
    original: ٱلْيَوْمَ تُجْزَىٰ كُلُّ نَفْسٍۭ بِمَا كَسَبَتْ ۚ لَا ظُلْمَ ٱلْيَوْمَ ۚ إِنَّ ٱللَّهَ سَرِيعُ ٱلْحِسَابِ
    arabicPlain: اليوم تجزى كل نفس بما كسبت ۚ لا ظلم اليوم ۚ إن الله سريع الحساب
    surahName: Al-Ghaafir
