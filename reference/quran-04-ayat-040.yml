    text: Enter ye the gates of hell, to dwell therein. Evil is the habitation of the scornful.
    translation: Pickthall
    original: ٱدْخُلُوٓا۟ أَبْوَٰبَ جَهَنَّمَ خَـٰلِدِينَ فِيهَا ۖ فَبِئْسَ مَثْوَى ٱلْمُتَكَبِّرِينَ
