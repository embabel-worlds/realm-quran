  data:
    ref: '40:32'
    scripture: quran
    name: Quran 40:32
    chapter: 40
    verse: 32
    ordinal: 4165
    text: And, O my people! Lo! I fear for you a Day of Summoning,
    translation: Pickthall
    original: وَيَـٰقَوْمِ إِنِّىٓ أَخَافُ عَلَيْكُمْ يَوْمَ ٱلتَّنَادِ
    arabicPlain: ويا قوم إني أخاف عليكم يوم التناد
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 407
    page: 470
  relations:
