  data:
    ref: '40:37'
    scripture: quran
    name: Quran 40:37
    chapter: 40
    verse: 37
    ordinal: 4170
    text: The roads of the heavens, and may look upon the god of Moses, though verily I think him a liar. Thus was the evil that he did made fairseeming unto Pharaoh, and he was debarred from the (right) way. The plot of Pharaoh ended but in ruin.
    translation: Pickthall
    original: أَسْبَـٰبَ ٱلسَّمَـٰوَٰتِ فَأَطَّلِعَ إِلَىٰٓ إِلَـٰهِ مُوسَىٰ وَإِنِّى لَأَظُنُّهُۥ كَـٰذِبًا ۚ وَكَذَٰلِكَ زُيِّنَ لِفِرْعَوْنَ سُوٓءُ عَمَلِهِۦ وَصُدَّ عَنِ ٱلسَّبِيلِ ۚ وَمَا كَيْدُ فِرْعَوْنَ إِلَّا فِى تَبَابٍ
    arabicPlain: أسباب السماوات فأطلع إلى إله موسى وإني لأظنه كاذبا ۚ وكذلك زين لفرعون سوء عمله وصد عن السبيل ۚ وما كيد فرعون إلا في تباب
