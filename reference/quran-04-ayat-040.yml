  data:
    ref: 40:82
    scripture: quran
    name: Quran 40:82
    chapter: 40
    verse: 82
    ordinal: 4215
    text: Have they not travelled in the land to see the nature of the consequence for those before them? They were more numerous than these, and mightier in power and (in the) traces (which they left behind them) in the earth. But all that they used to earn availed them not.
    translation: Pickthall
    original: أَفَلَمْ يَسِيرُوا۟ فِى ٱلْأَرْضِ فَيَنظُرُوا۟ كَيْفَ كَانَ عَـٰقِبَةُ ٱلَّذِينَ مِن قَبْلِهِمْ ۚ كَانُوٓا۟ أَكْثَرَ مِنْهُمْ وَأَشَدَّ قُوَّةً وَءَاثَارًا فِى ٱلْأَرْضِ فَمَآ أَغْنَىٰ عَنْهُم مَّا كَانُوا۟ يَكْسِبُونَ
    arabicPlain: أفلم يسيروا في الأرض فينظروا كيف كان عاقبة الذين من قبلهم ۚ كانوا أكثر منهم وأشد قوة وآثارا في الأرض فما أغنى عنهم ما كانوا يكسبون
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 412
    page: 476
