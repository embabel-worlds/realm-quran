    chapter: 40
    verse: 79
    ordinal: 4212
    text: Allah it is Who hath appointed for you cattle, that ye may ride on some of them, and eat of some -
    translation: Pickthall
    original: ٱللَّهُ ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَنْعَـٰمَ لِتَرْكَبُوا۟ مِنْهَا وَمِنْهَا تَأْكُلُونَ
    arabicPlain: الله الذي جعل لكم الأنعام لتركبوا منها ومنها تأكلون
