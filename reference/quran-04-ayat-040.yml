  data:
    ref: '40:22'
    scripture: quran
    name: Quran 40:22
    chapter: 40
    verse: 22
    ordinal: 4155
    text: That was because their messengers kept bringing them clear proofs (of Allah's Sovereignty) but they disbelieved; so Allah seized them. Lo! He is Strong, severe in punishment.
    translation: Pickthall
    original: ذَٰلِكَ بِأَنَّهُمْ كَانَت تَّأْتِيهِمْ رُسُلُهُم بِٱلْبَيِّنَـٰتِ فَكَفَرُوا۟ فَأَخَذَهُمُ ٱللَّهُ ۚ إِنَّهُۥ قَوِىٌّ شَدِيدُ ٱلْعِقَابِ
    arabicPlain: ذلك بأنهم كانت تأتيهم رسلهم بالبينات فكفروا فأخذهم الله ۚ إنه قوي شديد العقاب
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 406
