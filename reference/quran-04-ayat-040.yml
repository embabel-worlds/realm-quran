    scripture: quran
    name: Quran 40:61
    chapter: 40
    verse: 61
    ordinal: 4194
    text: Allah it is Who hath appointed for you night that ye may rest therein, and day for seeing. Lo! Allah is a Lord of bounty for mankind, yet most of mankind give not thanks.
    translation: Pickthall
    original: ٱللَّهُ ٱلَّذِى جَعَلَ لَكُمُ ٱلَّيْلَ لِتَسْكُنُوا۟ فِيهِ وَٱلنَّهَارَ مُبْصِرًا ۚ إِنَّ ٱللَّهَ لَذُو فَضْلٍ عَلَى ٱلنَّاسِ وَلَـٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يَشْكُرُونَ
    arabicPlain: الله الذي جعل لكم الليل لتسكنوا فيه والنهار مبصرا ۚ إن الله لذو فضل على الناس ولكن أكثر الناس لا يشكرون
    surahName: Al-Ghaafir
