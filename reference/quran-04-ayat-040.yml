    scripture: quran
    name: Quran 40:81
    chapter: 40
    verse: 81
    ordinal: 4214
    text: And He showeth you His tokens. Which, then, of the tokens of Allah do ye deny?
    translation: Pickthall
    original: وَيُرِيكُمْ ءَايَـٰتِهِۦ فَأَىَّ ءَايَـٰتِ ٱللَّهِ تُنكِرُونَ
