  data:
    ref: '40:51'
    scripture: quran
    name: Quran 40:51
    chapter: 40
    verse: 51
    ordinal: 4184
    text: Lo! We verily do help Our messengers, and those who believe, in the life of the world and on the day when the witnesses arise,
    translation: Pickthall
    original: إِنَّا لَنَنصُرُ رُسُلَنَا وَٱلَّذِينَ ءَامَنُوا۟ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَيَوْمَ يَقُومُ ٱلْأَشْهَـٰدُ
    arabicPlain: إنا لننصر رسلنا والذين آمنوا في الحياة الدنيا ويوم يقوم الأشهاد
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 409
