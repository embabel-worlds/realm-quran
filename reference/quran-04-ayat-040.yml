    scripture: quran
    name: Quran 40:71
    chapter: 40
    verse: 71
    ordinal: 4204
    text: When carcans are about their necks and chains. They are dragged
    translation: Pickthall
    original: إِذِ ٱلْأَغْلَـٰلُ فِىٓ أَعْنَـٰقِهِمْ وَٱلسَّلَـٰسِلُ يُسْحَبُونَ
    arabicPlain: إذ الأغلال في أعناقهم والسلاسل يسحبون
