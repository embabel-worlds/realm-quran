    scripture: quran
    name: Quran 40:46
    chapter: 40
    verse: 46
    ordinal: 4179
    text: 'The Fire; they are exposed to it morning and evening; and on the day when the Hour upriseth (it is said): Cause Pharaoh''s folk to enter the most awful doom.'
    translation: Pickthall
    original: ٱلنَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوًّا وَعَشِيًّا ۖ وَيَوْمَ تَقُومُ ٱلسَّاعَةُ أَدْخِلُوٓا۟ ءَالَ فِرْعَوْنَ أَشَدَّ ٱلْعَذَابِ
    arabicPlain: النار يعرضون عليها غدوا وعشيا ۖ ويوم تقوم الساعة أدخلوا آل فرعون أشد العذاب
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 408
