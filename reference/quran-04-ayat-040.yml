    chapter: 40
    verse: 14
    ordinal: 4147
    text: Therefor (O believers) pray unto Allah, making religion pure for Him (only), however much the disbelievers be averse -
    translation: Pickthall
    original: فَٱدْعُوا۟ ٱللَّهَ مُخْلِصِينَ لَهُ ٱلدِّينَ وَلَوْ كَرِهَ ٱلْكَـٰفِرُونَ
