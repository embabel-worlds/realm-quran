  data:
    ref: '40:13'
    scripture: quran
    name: Quran 40:13
    chapter: 40
    verse: 13
    ordinal: 4146
    text: He it is Who showeth you His portents, and sendeth down for you provision from the sky. None payeth heed save him who turneth (unto Him) repentant.
    translation: Pickthall
    original: هُوَ ٱلَّذِى يُرِيكُمْ ءَايَـٰتِهِۦ وَيُنَزِّلُ لَكُم مِّنَ ٱلسَّمَآءِ رِزْقًا ۚ وَمَا يَتَذَكَّرُ إِلَّا مَن يُنِيبُ
    arabicPlain: هو الذي يريكم آياته وينزل لكم من السماء رزقا ۚ وما يتذكر إلا من ينيب
    surahName: Al-Ghaafir
