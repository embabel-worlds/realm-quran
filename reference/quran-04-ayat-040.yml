  data:
    ref: '40:49'
    scripture: quran
    name: Quran 40:49
    chapter: 40
    verse: 49
    ordinal: 4182
    text: 'And those in the Fire say unto the guards of hell: Entreat your Lord that He relieve us of a day of the torment.'
    translation: Pickthall
    original: وَقَالَ ٱلَّذِينَ فِى ٱلنَّارِ لِخَزَنَةِ جَهَنَّمَ ٱدْعُوا۟ رَبَّكُمْ يُخَفِّفْ عَنَّا يَوْمًا مِّنَ ٱلْعَذَابِ
    arabicPlain: وقال الذين في النار لخزنة جهنم ادعوا ربكم يخفف عنا يوما من العذاب
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 408
    page: 472
  relations:
