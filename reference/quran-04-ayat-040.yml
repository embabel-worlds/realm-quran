- type: Ayah
  data:
    ref: '40:10'
    scripture: quran
    name: Quran 40:10
    chapter: 40
    verse: 10
    ordinal: 4143
    text: 'Lo! (on that day) those who disbelieve are informed by proclamation: Verily Allah''s abhorrence is more terrible than your abhorrence one of another, when ye were called unto the faith but did refuse.'
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ كَفَرُوا۟ يُنَادَوْنَ لَمَقْتُ ٱللَّهِ أَكْبَرُ مِن مَّقْتِكُمْ أَنفُسَكُمْ إِذْ تُدْعَوْنَ إِلَى ٱلْإِيمَـٰنِ فَتَكْفُرُونَ
    arabicPlain: إن الذين كفروا ينادون لمقت الله أكبر من مقتكم أنفسكم إذ تدعون إلى الإيمان فتكفرون
    surahName: Al-Ghaafir
