  data:
    ref: 40:74
    scripture: quran
    name: Quran 40:74
    chapter: 40
    verse: 74
    ordinal: 4207
    text: 'Beside Allah? They say: They have failed us; but we used not to pray to anything before. Thus doth Allah send astray the disbelievers (in His guidance).'
    translation: Pickthall
    original: مِن دُونِ ٱللَّهِ ۖ قَالُوا۟ ضَلُّوا۟ عَنَّا بَل لَّمْ نَكُن نَّدْعُوا۟ مِن قَبْلُ شَيْـًٔا ۚ كَذَٰلِكَ يُضِلُّ ٱللَّهُ ٱلْكَـٰفِرِينَ
    arabicPlain: من دون الله ۖ قالوا ضلوا عنا بل لم نكن ندعو من قبل شيئا ۚ كذلك يضل الله الكافرين
    surahName: Al-Ghaafir
