  data:
    ref: '40:16'
    scripture: quran
    name: Quran 40:16
    chapter: 40
    verse: 16
    ordinal: 4149
    text: The day when they come forth, nothing of them being hidden from Allah. Whose is the Sovereignty this day? It is Allah's, the One, the Almighty.
    translation: Pickthall
    original: يَوْمَ هُم بَـٰرِزُونَ ۖ لَا يَخْفَىٰ عَلَى ٱللَّهِ مِنْهُمْ شَىْءٌ ۚ لِّمَنِ ٱلْمُلْكُ ٱلْيَوْمَ ۖ لِلَّهِ ٱلْوَٰحِدِ ٱلْقَهَّارِ
    arabicPlain: يوم هم بارزون ۖ لا يخفى على الله منهم شيء ۚ لمن الملك اليوم ۖ لله الواحد القهار
