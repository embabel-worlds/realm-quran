    scripture: quran
    name: Quran 40:39
    chapter: 40
    verse: 39
    ordinal: 4172
    text: O my people! Lo! this life of the world is but a passing comfort, and lo! the Hereafter, that is the enduring home.
    translation: Pickthall
    original: يَـٰقَوْمِ إِنَّمَا هَـٰذِهِ ٱلْحَيَوٰةُ ٱلدُّنْيَا مَتَـٰعٌ وَإِنَّ ٱلْـَٔاخِرَةَ هِىَ دَارُ ٱلْقَرَارِ
    arabicPlain: يا قوم إنما هذه الحياة الدنيا متاع وإن الآخرة هي دار القرار
