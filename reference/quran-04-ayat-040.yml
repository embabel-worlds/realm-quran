    name: Quran 40:62
    chapter: 40
    verse: 62
    ordinal: 4195
    text: Such is Allah, your Lord, the Creator of all things, There is no Allah save Him. How then are ye perverted?
    translation: Pickthall
    original: ذَٰلِكُمُ ٱللَّهُ رَبُّكُمْ خَـٰلِقُ كُلِّ شَىْءٍ لَّآ إِلَـٰهَ إِلَّا هُوَ ۖ فَأَنَّىٰ تُؤْفَكُونَ
    arabicPlain: ذلكم الله ربكم خالق كل شيء لا إله إلا هو ۖ فأنى تؤفكون
    surahName: Al-Ghaafir
