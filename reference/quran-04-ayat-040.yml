    scripture: quran
    name: Quran 40:45
    chapter: 40
    verse: 45
    ordinal: 4178
    text: So Allah warded off from him the evils which they plotted, while a dreadful doom encompassed Pharaoh's folk,
    translation: Pickthall
    original: فَوَقَىٰهُ ٱللَّهُ سَيِّـَٔاتِ مَا مَكَرُوا۟ ۖ وَحَاقَ بِـَٔالِ فِرْعَوْنَ سُوٓءُ ٱلْعَذَابِ
    arabicPlain: فوقاه الله سيئات ما مكروا ۖ وحاق بآل فرعون سوء العذاب
