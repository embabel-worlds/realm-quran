    scripture: quran
    name: Quran 40:48
    chapter: 40
    verse: 48
    ordinal: 4181
    text: 'Those who were proud say: Lo! we are all (together) herein. Lo! Allah hath judged between (His) slaves.'
    translation: Pickthall
    original: قَالَ ٱلَّذِينَ ٱسْتَكْبَرُوٓا۟ إِنَّا كُلٌّ فِيهَآ إِنَّ ٱللَّهَ قَدْ حَكَمَ بَيْنَ ٱلْعِبَادِ
    arabicPlain: قال الذين استكبروا إنا كل فيها إن الله قد حكم بين العباد
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 408
