  data:
    ref: '40:31'
    scripture: quran
    name: Quran 40:31
    chapter: 40
    verse: 31
    ordinal: 4164
    text: A plight like that of Noah's folk, and A'ad and Thamud, and those after them, and Allah willeth no injustice for (His) slaves.
    translation: Pickthall
    original: مِثْلَ دَأْبِ قَوْمِ نُوحٍ وَعَادٍ وَثَمُودَ وَٱلَّذِينَ مِنۢ بَعْدِهِمْ ۚ وَمَا ٱللَّهُ يُرِيدُ ظُلْمًا لِّلْعِبَادِ
    arabicPlain: مثل دأب قوم نوح وعاد وثمود والذين من بعدهم ۚ وما الله يريد ظلما للعباد
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 407
    page: 470
  relations:
  - predicate: IN
    to:
