    scripture: quran
    name: Quran 40:63
    chapter: 40
    verse: 63
    ordinal: 4196
    text: Thus are they perverted who deny the revelations of Allah.
    translation: Pickthall
    original: كَذَٰلِكَ يُؤْفَكُ ٱلَّذِينَ كَانُوا۟ بِـَٔايَـٰتِ ٱللَّهِ يَجْحَدُونَ
    arabicPlain: كذلك يؤفك الذين كانوا بآيات الله يجحدون
