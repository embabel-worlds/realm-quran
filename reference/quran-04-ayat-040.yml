    verse: 23
    ordinal: 4156
    text: And verily We sent Moses with Our revelations and a clear warrant
    translation: Pickthall
    original: وَلَقَدْ أَرْسَلْنَا مُوسَىٰ بِـَٔايَـٰتِنَا وَسُلْطَـٰنٍ مُّبِينٍ
