    name: Quran 40:75
    chapter: 40
    verse: 75
    ordinal: 4208
    text: '(And it is said unto them): This is because ye exulted in the earth without right, and because ye were petulant.'
    translation: Pickthall
    original: ذَٰلِكُم بِمَا كُنتُمْ تَفْرَحُونَ فِى ٱلْأَرْضِ بِغَيْرِ ٱلْحَقِّ وَبِمَا كُنتُمْ تَمْرَحُونَ
    arabicPlain: ذلكم بما كنتم تفرحون في الأرض بغير الحق وبما كنتم تمرحون
