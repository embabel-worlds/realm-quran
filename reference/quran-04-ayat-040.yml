    scripture: quran
    name: Quran 40:53
    chapter: 40
    verse: 53
    ordinal: 4186
    text: And We verily gave Moses the guidance, and We caused the Children of Israel to inherit the Scripture,
    translation: Pickthall
    original: وَلَقَدْ ءَاتَيْنَا مُوسَى ٱلْهُدَىٰ وَأَوْرَثْنَا بَنِىٓ إِسْرَٰٓءِيلَ ٱلْكِتَـٰبَ
    arabicPlain: ولقد آتينا موسى الهدى وأورثنا بني إسرائيل الكتاب
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
