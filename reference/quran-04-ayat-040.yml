  data:
    ref: '40:26'
    scripture: quran
    name: Quran 40:26
    chapter: 40
    verse: 26
    ordinal: 4159
    text: 'And Pharaoh said: Suffer me to kill Moses, and let him cry unto his Lord. Lo! I fear that he will alter your religion or that he will cause confusion in the land.'
    translation: Pickthall
    original: وَقَالَ فِرْعَوْنُ ذَرُونِىٓ أَقْتُلْ مُوسَىٰ وَلْيَدْعُ رَبَّهُۥٓ ۖ إِنِّىٓ أَخَافُ أَن يُبَدِّلَ دِينَكُمْ أَوْ أَن يُظْهِرَ فِى ٱلْأَرْضِ ٱلْفَسَادَ
    arabicPlain: وقال فرعون ذروني أقتل موسى وليدع ربه ۖ إني أخاف أن يبدل دينكم أو أن يظهر في الأرض الفساد
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 406
    page: 470
