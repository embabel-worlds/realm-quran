  data:
    ref: '40:50'
    scripture: quran
    name: Quran 40:50
    chapter: 40
    verse: 50
    ordinal: 4183
    text: 'They say: Came not your messengers unto you with clear proofs? They say: Yea, verily. They say: Then do ye pray, although the prayer of disbelievers is in vain.'
    translation: Pickthall
    original: قَالُوٓا۟ أَوَلَمْ تَكُ تَأْتِيكُمْ رُسُلُكُم بِٱلْبَيِّنَـٰتِ ۖ قَالُوا۟ بَلَىٰ ۚ قَالُوا۟ فَٱدْعُوا۟ ۗ وَمَا دُعَـٰٓؤُا۟ ٱلْكَـٰفِرِينَ إِلَّا فِى ضَلَـٰلٍ
    arabicPlain: قالوا أولم تك تأتيكم رسلكم بالبينات ۖ قالوا بلى ۚ قالوا فادعوا ۗ وما دعاء الكافرين إلا في ضلال
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 408
    page: 473
