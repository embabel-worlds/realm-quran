  data:
    ref: '40:20'
    scripture: quran
    name: Quran 40:20
    chapter: 40
    verse: 20
    ordinal: 4153
    text: Allah judgeth with truth, while those to whom they cry instead of Him judge not at all. Lo! Allah, He is the Hearer, the Seer.
    translation: Pickthall
    original: وَٱللَّهُ يَقْضِى بِٱلْحَقِّ ۖ وَٱلَّذِينَ يَدْعُونَ مِن دُونِهِۦ لَا يَقْضُونَ بِشَىْءٍ ۗ إِنَّ ٱللَّهَ هُوَ ٱلسَّمِيعُ ٱلْبَصِيرُ
    arabicPlain: والله يقضي بالحق ۖ والذين يدعون من دونه لا يقضون بشيء ۗ إن الله هو السميع البصير
    surahName: Al-Ghaafir
