    chapter: 40
    verse: 36
    ordinal: 4169
    text: 'And Pharaoh said: O Haman! Build for me a tower that haply I may reach the roads,'
    translation: Pickthall
    original: وَقَالَ فِرْعَوْنُ يَـٰهَـٰمَـٰنُ ٱبْنِ لِى صَرْحًا لَّعَلِّىٓ أَبْلُغُ ٱلْأَسْبَـٰبَ
    arabicPlain: وقال فرعون يا هامان ابن لي صرحا لعلي أبلغ الأسباب
    surahName: Al-Ghaafir
