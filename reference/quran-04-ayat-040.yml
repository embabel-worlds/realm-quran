    scripture: quran
    name: Quran 40:60
    chapter: 40
    verse: 60
    ordinal: 4193
    text: 'And your Lord hath said: Pray unto Me and I will hear your prayer. Lo! those who scorn My service, they will enter hell, disgraced.'
    translation: Pickthall
    original: وَقَالَ رَبُّكُمُ ٱدْعُونِىٓ أَسْتَجِبْ لَكُمْ ۚ إِنَّ ٱلَّذِينَ يَسْتَكْبِرُونَ عَنْ عِبَادَتِى سَيَدْخُلُونَ جَهَنَّمَ دَاخِرِينَ
    arabicPlain: وقال ربكم ادعوني أستجب لكم ۚ إن الذين يستكبرون عن عبادتي سيدخلون جهنم داخرين
    surahName: Al-Ghaafir
