- type: Ayah
  data:
    ref: '40:11'
    scripture: quran
    name: Quran 40:11
    chapter: 40
    verse: 11
    ordinal: 4144
    text: 'They say: Our Lord! Twice hast Thou made us die, and twice hast Thou made us live. Now we confess our sins. Is there any way to go out?'
    translation: Pickthall
    original: قَالُوا۟ رَبَّنَآ أَمَتَّنَا ٱثْنَتَيْنِ وَأَحْيَيْتَنَا ٱثْنَتَيْنِ فَٱعْتَرَفْنَا بِذُنُوبِنَا فَهَلْ إِلَىٰ خُرُوجٍ مِّن سَبِيلٍ
    arabicPlain: قالوا ربنا أمتنا اثنتين وأحييتنا اثنتين فاعترفنا بذنوبنا فهل إلى خروج من سبيل
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 405
