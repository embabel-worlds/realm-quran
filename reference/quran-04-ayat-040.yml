    scripture: quran
    name: Quran 40:69
    chapter: 40
    verse: 69
    ordinal: 4202
    text: Hast thou not seen those who wrangle concerning the revelations of Allah, how they are turned away? -
    translation: Pickthall
    original: أَلَمْ تَرَ إِلَى ٱلَّذِينَ يُجَـٰدِلُونَ فِىٓ ءَايَـٰتِ ٱللَّهِ أَنَّىٰ يُصْرَفُونَ
    arabicPlain: ألم تر إلى الذين يجادلون في آيات الله أنى يصرفون
