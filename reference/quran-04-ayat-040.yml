    scripture: quran
    name: Quran 40:73
    chapter: 40
    verse: 73
    ordinal: 4206
    text: 'Then it is said unto them: Where are (all) that ye used to make partners (in the Sovereignty)'
    translation: Pickthall
    original: ثُمَّ قِيلَ لَهُمْ أَيْنَ مَا كُنتُمْ تُشْرِكُونَ
    arabicPlain: ثم قيل لهم أين ما كنتم تشركون
