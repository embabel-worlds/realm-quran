  data:
    ref: '40:52'
    scripture: quran
    name: Quran 40:52
    chapter: 40
    verse: 52
    ordinal: 4185
    text: The day when their excuse availeth not the evil-doers, and theirs is the curse, and theirs the ill abode.
    translation: Pickthall
    original: يَوْمَ لَا يَنفَعُ ٱلظَّـٰلِمِينَ مَعْذِرَتُهُمْ ۖ وَلَهُمُ ٱللَّعْنَةُ وَلَهُمْ سُوٓءُ ٱلدَّارِ
    arabicPlain: يوم لا ينفع الظالمين معذرتهم ۖ ولهم اللعنة ولهم سوء الدار
    surahName: Al-Ghaafir
    juz: 24
