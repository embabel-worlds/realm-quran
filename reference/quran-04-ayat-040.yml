- type: Ayah
  data:
    ref: 40:85
    scripture: quran
    name: Quran 40:85
    chapter: 40
    verse: 85
    ordinal: 4218
    text: But their faith could not avail them when they saw Our doom. This is Allah's law which hath ever taken course for His bondmen. And then the disbelievers will be ruined.
    translation: Pickthall
    original: فَلَمْ يَكُ يَنفَعُهُمْ إِيمَـٰنُهُمْ لَمَّا رَأَوْا۟ بَأْسَنَا ۖ سُنَّتَ ٱللَّهِ ٱلَّتِى قَدْ خَلَتْ فِى عِبَادِهِۦ ۖ وَخَسِرَ هُنَالِكَ ٱلْكَـٰفِرُونَ
    arabicPlain: فلم يك ينفعهم إيمانهم لما رأوا بأسنا ۖ سنت الله التي قد خلت في عباده ۖ وخسر هنالك الكافرون
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 412
