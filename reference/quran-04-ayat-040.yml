    name: Quran 40:57
    chapter: 40
    verse: 57
    ordinal: 4190
    text: Assuredly the creation of the heavens and the earth is greater than the creation of mankind; but most of mankind know not.
    translation: Pickthall
    original: لَخَلْقُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ أَكْبَرُ مِنْ خَلْقِ ٱلنَّاسِ وَلَـٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يَعْلَمُونَ
    arabicPlain: لخلق السماوات والأرض أكبر من خلق الناس ولكن أكثر الناس لا يعلمون
