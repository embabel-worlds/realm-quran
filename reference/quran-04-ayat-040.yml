  data:
    ref: '40:21'
    scripture: quran
    name: Quran 40:21
    chapter: 40
    verse: 21
    ordinal: 4154
    text: Have they not travelled in the land to see the nature of the consequence for those who disbelieved before them? They were mightier than these in power and (in the) traces (which they left behind them) in the earth. Yet Allah seized them for their sins, and they had no protector from Allah.
    translation: Pickthall
    original: ۞ أَوَلَمْ يَسِيرُوا۟ فِى ٱلْأَرْضِ فَيَنظُرُوا۟ كَيْفَ كَانَ عَـٰقِبَةُ ٱلَّذِينَ كَانُوا۟ مِن قَبْلِهِمْ ۚ كَانُوا۟ هُمْ أَشَدَّ مِنْهُمْ قُوَّةً وَءَاثَارًا فِى ٱلْأَرْضِ فَأَخَذَهُمُ ٱللَّهُ بِذُنُوبِهِمْ وَمَا كَانَ لَهُم مِّنَ ٱللَّهِ مِن وَاقٍ
    arabicPlain: ۞ أولم يسيروا في الأرض فينظروا كيف كان عاقبة الذين كانوا من قبلهم ۚ كانوا هم أشد منهم قوة وآثارا في الأرض فأخذهم الله بذنوبهم وما كان لهم من الله من واق
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 406
