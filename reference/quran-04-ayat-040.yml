    text: 'And he who believed said: O my people! Follow me. I will show you the way of right conduct.'
    translation: Pickthall
    original: وَقَالَ ٱلَّذِىٓ ءَامَنَ يَـٰقَوْمِ ٱتَّبِعُونِ أَهْدِكُمْ سَبِيلَ ٱلرَّشَادِ
    arabicPlain: وقال الذي آمن يا قوم اتبعون أهدكم سبيل الرشاد
