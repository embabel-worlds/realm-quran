    scripture: quran
    name: Quran 40:58
    chapter: 40
    verse: 58
    ordinal: 4191
    text: And the blind man and the seer are not equal, neither are those who believe and do good works (equal with) the evil-doer. Little do ye reflect!
    translation: Pickthall
    original: وَمَا يَسْتَوِى ٱلْأَعْمَىٰ وَٱلْبَصِيرُ وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ وَلَا ٱلْمُسِىٓءُ ۚ قَلِيلًا مَّا تَتَذَكَّرُونَ
    arabicPlain: وما يستوي الأعمى والبصير والذين آمنوا وعملوا الصالحات ولا المسيء ۚ قليلا ما تتذكرون
