  data:
    ref: 40:84
    scripture: quran
    name: Quran 40:84
    chapter: 40
    verse: 84
    ordinal: 4217
    text: 'Then, when they saw Our doom, they said: We believe in Allah only and reject (all) that we used to associate (with Him).'
    translation: Pickthall
    original: فَلَمَّا رَأَوْا۟ بَأْسَنَا قَالُوٓا۟ ءَامَنَّا بِٱللَّهِ وَحْدَهُۥ وَكَفَرْنَا بِمَا كُنَّا بِهِۦ مُشْرِكِينَ
    arabicPlain: فلما رأوا بأسنا قالوا آمنا بالله وحده وكفرنا بما كنا به مشركين
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 412
    page: 476
