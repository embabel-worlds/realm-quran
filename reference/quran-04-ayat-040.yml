    scripture: quran
    name: Quran 40:44
    chapter: 40
    verse: 44
    ordinal: 4177
    text: And ye will remember what I say unto you. I confide my cause unto Allah. Lo! Allah is Seer of (His) slaves.
    translation: Pickthall
    original: فَسَتَذْكُرُونَ مَآ أَقُولُ لَكُمْ ۚ وَأُفَوِّضُ أَمْرِىٓ إِلَى ٱللَّهِ ۚ إِنَّ ٱللَّهَ بَصِيرٌۢ بِٱلْعِبَادِ
    arabicPlain: فستذكرون ما أقول لكم ۚ وأفوض أمري إلى الله ۚ إن الله بصير بالعباد
