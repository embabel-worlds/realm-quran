  data:
    ref: 40:70
    scripture: quran
    name: Quran 40:70
    chapter: 40
    verse: 70
    ordinal: 4203
    text: Those who deny the Scripture and that wherewith We send Our messengers. But they will come to know,
    translation: Pickthall
    original: ٱلَّذِينَ كَذَّبُوا۟ بِٱلْكِتَـٰبِ وَبِمَآ أَرْسَلْنَا بِهِۦ رُسُلَنَا ۖ فَسَوْفَ يَعْلَمُونَ
    arabicPlain: الذين كذبوا بالكتاب وبما أرسلنا به رسلنا ۖ فسوف يعلمون
