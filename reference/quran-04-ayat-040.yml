- type: Ayah
  data:
    ref: '40:6'
    scripture: quran
    name: Quran 40:6
    chapter: 40
    verse: 6
    ordinal: 4139
    text: 'Thus was the word of thy Lord concerning those who disbelieve fulfilled: That they are owners of the Fire.'
    translation: Pickthall
    original: وَكَذَٰلِكَ حَقَّتْ كَلِمَتُ رَبِّكَ عَلَى ٱلَّذِينَ كَفَرُوٓا۟ أَنَّهُمْ أَصْحَـٰبُ ٱلنَّارِ
    arabicPlain: وكذلك حقت كلمت ربك على الذين كفروا أنهم أصحاب النار
    surahName: Al-Ghaafir
