  data:
    ref: '40:27'
    scripture: quran
    name: Quran 40:27
    chapter: 40
    verse: 27
    ordinal: 4160
    text: 'Moses said: Lo! I seek refuge in my Lord and your Lord from every scorner who believeth not in a Day of Reckoning.'
    translation: Pickthall
    original: وَقَالَ مُوسَىٰٓ إِنِّى عُذْتُ بِرَبِّى وَرَبِّكُم مِّن كُلِّ مُتَكَبِّرٍ لَّا يُؤْمِنُ بِيَوْمِ ٱلْحِسَابِ
    arabicPlain: وقال موسى إني عذت بربي وربكم من كل متكبر لا يؤمن بيوم الحساب
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 406
    page: 470
