  data:
    ref: 40:83
    scripture: quran
    name: Quran 40:83
    chapter: 40
    verse: 83
    ordinal: 4216
    text: And when their messengers brought them clear proofs (of Allah's Sovereignty) they exulted in the knowledge they (themselves) possessed. And that which they were wont to mock befell them.
    translation: Pickthall
    original: فَلَمَّا جَآءَتْهُمْ رُسُلُهُم بِٱلْبَيِّنَـٰتِ فَرِحُوا۟ بِمَا عِندَهُم مِّنَ ٱلْعِلْمِ وَحَاقَ بِهِم مَّا كَانُوا۟ بِهِۦ يَسْتَهْزِءُونَ
    arabicPlain: فلما جاءتهم رسلهم بالبينات فرحوا بما عندهم من العلم وحاق بهم ما كانوا به يستهزئون
    surahName: Al-Ghaafir
    juz: 24
    manzil: 6
    ruku: 412
    page: 476
