  data:
    ref: '40:4'
    scripture: quran
    name: Quran 40:4
    chapter: 40
    verse: 4
    ordinal: 4137
    text: None argue concerning the revelations of Allah save those who disbelieve, so let not their turn of fortune in the land deceive thee (O Muhammad).
    translation: Pickthall
    original: مَا يُجَـٰدِلُ فِىٓ ءَايَـٰتِ ٱللَّهِ إِلَّا ٱلَّذِينَ كَفَرُوا۟ فَلَا يَغْرُرْكَ تَقَلُّبُهُمْ فِى ٱلْبِلَـٰدِ
    arabicPlain: ما يجادل في آيات الله إلا الذين كفروا فلا يغررك تقلبهم في البلاد
