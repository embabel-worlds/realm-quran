- type: Ayah
  data:
    ref: '65:8'
    scripture: quran
    name: Quran 65:8
    chapter: 65
    verse: 8
    ordinal: 5225
    text: And how many a community revolted against the ordinance of its Lord and His messengers, and We called it to a stern account and punished it with dire punishment,
    translation: Pickthall
    original: وَكَأَيِّن مِّن قَرْيَةٍ عَتَتْ عَنْ أَمْرِ رَبِّهَا وَرُسُلِهِۦ فَحَاسَبْنَـٰهَا حِسَابًا شَدِيدًا وَعَذَّبْنَـٰهَا عَذَابًا نُّكْرًا
    arabicPlain: وكأين من قرية عتت عن أمر ربها ورسله فحاسبناها حسابا شديدا وعذبناها عذابا نكرا
    surahName: At-Talaaq
    juz: 28
    manzil: 7
    ruku: 493
    page: 559
