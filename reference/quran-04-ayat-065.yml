- type: Ayah
  data:
    ref: '65:5'
    scripture: quran
    name: Quran 65:5
    chapter: 65
    verse: 5
    ordinal: 5222
    text: That is the commandment of Allah which He revealeth unto you. And whoso keepeth his duty to Allah, He will remit from him his evil deeds and magnify reward for him.
    translation: Pickthall
    original: ذَٰلِكَ أَمْرُ ٱللَّهِ أَنزَلَهُۥٓ إِلَيْكُمْ ۚ وَمَن يَتَّقِ ٱللَّهَ يُكَفِّرْ عَنْهُ سَيِّـَٔاتِهِۦ وَيُعْظِمْ لَهُۥٓ أَجْرًا
    arabicPlain: ذلك أمر الله أنزله إليكم ۚ ومن يتق الله يكفر عنه سيئاته ويعظم له أجرا
    surahName: At-Talaaq
    juz: 28
    manzil: 7
    ruku: 492
    page: 558
