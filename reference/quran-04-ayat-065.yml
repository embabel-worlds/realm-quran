- type: Ayah
  data:
    ref: '65:4'
    scripture: quran
    name: Quran 65:4
    chapter: 65
    verse: 4
    ordinal: 5221
    text: And for such of your women as despair of menstruation, if ye doubt, their period (of waiting) shall be three months, along with those who have it not. And for those with child, their period shall be till they bring forth their burden. And whosoever keepeth his duty to Allah, He maketh his course easy for him.
    translation: Pickthall
    original: وَٱلَّـٰٓـِٔى يَئِسْنَ مِنَ ٱلْمَحِيضِ مِن نِّسَآئِكُمْ إِنِ ٱرْتَبْتُمْ فَعِدَّتُهُنَّ ثَلَـٰثَةُ أَشْهُرٍ وَٱلَّـٰٓـِٔى لَمْ يَحِضْنَ ۚ وَأُو۟لَـٰتُ ٱلْأَحْمَالِ أَجَلُهُنَّ أَن يَضَعْنَ حَمْلَهُنَّ ۚ وَمَن يَتَّقِ ٱللَّهَ يَجْعَل لَّهُۥ مِنْ أَمْرِهِۦ يُسْرًا
    arabicPlain: واللائي يئسن من المحيض من نسائكم إن ارتبتم فعدتهن ثلاثة أشهر واللائي لم يحضن ۚ وأولات الأحمال أجلهن أن يضعن حملهن ۚ ومن يتق الله يجعل له من أمره يسرا
    surahName: At-Talaaq
    juz: 28
    manzil: 7
    ruku: 492
    page: 558
