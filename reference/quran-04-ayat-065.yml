- type: Ayah
  data:
    ref: '65:3'
    scripture: quran
    name: Quran 65:3
    chapter: 65
    verse: 3
    ordinal: 5220
    text: And will provide for him from (a quarter) whence he hath no expectation. And whosoever putteth his trust in Allah, He will suffice him. Lo! Allah bringeth His command to pass. Allah hath set a measure for all things.
    translation: Pickthall
    original: وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ۚ وَمَن يَتَوَكَّلْ عَلَى ٱللَّهِ فَهُوَ حَسْبُهُۥٓ ۚ إِنَّ ٱللَّهَ بَـٰلِغُ أَمْرِهِۦ ۚ قَدْ جَعَلَ ٱللَّهُ لِكُلِّ شَىْءٍ قَدْرًا
    arabicPlain: ويرزقه من حيث لا يحتسب ۚ ومن يتوكل على الله فهو حسبه ۚ إن الله بالغ أمره ۚ قد جعل الله لكل شيء قدرا
    surahName: At-Talaaq
    juz: 28
    manzil: 7
    ruku: 492
    page: 558
