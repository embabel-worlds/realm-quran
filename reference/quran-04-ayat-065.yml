- type: Ayah
  data:
    ref: '65:10'
    scripture: quran
    name: Quran 65:10
    chapter: 65
    verse: 10
    ordinal: 5227
    text: Allah hath prepared for them stern punishment; so keep your duty to Allah, O men of understanding! O ye who believe! Now Allah hath sent down unto you a reminder,
    translation: Pickthall
    original: أَعَدَّ ٱللَّهُ لَهُمْ عَذَابًا شَدِيدًا ۖ فَٱتَّقُوا۟ ٱللَّهَ يَـٰٓأُو۟لِى ٱلْأَلْبَـٰبِ ٱلَّذِينَ ءَامَنُوا۟ ۚ قَدْ أَنزَلَ ٱللَّهُ إِلَيْكُمْ ذِكْرًا
    arabicPlain: أعد الله لهم عذابا شديدا ۖ فاتقوا الله يا أولي الألباب الذين آمنوا ۚ قد أنزل الله إليكم ذكرا
    surahName: At-Talaaq
    juz: 28
    manzil: 7
    ruku: 493
