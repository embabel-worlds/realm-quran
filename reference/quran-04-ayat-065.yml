  data:
    ref: '65:9'
    scripture: quran
    name: Quran 65:9
    chapter: 65
    verse: 9
    ordinal: 5226
    text: So that it tasted the ill-effects of its conduct, and the consequence of its conduct was loss.
    translation: Pickthall
    original: فَذَاقَتْ وَبَالَ أَمْرِهَا وَكَانَ عَـٰقِبَةُ أَمْرِهَا خُسْرًا
    arabicPlain: فذاقت وبال أمرها وكان عاقبة أمرها خسرا
    surahName: At-Talaaq
    juz: 28
    manzil: 7
    ruku: 493
    page: 559
