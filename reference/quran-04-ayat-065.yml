- type: Ayah
  data:
    ref: '65:7'
    scripture: quran
    name: Quran 65:7
    chapter: 65
    verse: 7
    ordinal: 5224
    text: Let him who hath abundance spend of his abundance, and he whose provision is measured, let him spend of that which Allah hath given him. Allah asketh naught of any soul save that which He hath given it. Allah will vouchsafe, after hardship, ease.
    translation: Pickthall
    original: لِيُنفِقْ ذُو سَعَةٍ مِّن سَعَتِهِۦ ۖ وَمَن قُدِرَ عَلَيْهِ رِزْقُهُۥ فَلْيُنفِقْ مِمَّآ ءَاتَىٰهُ ٱللَّهُ ۚ لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا مَآ ءَاتَىٰهَا ۚ سَيَجْعَلُ ٱللَّهُ بَعْدَ عُسْرٍ يُسْرًا
    arabicPlain: لينفق ذو سعة من سعته ۖ ومن قدر عليه رزقه فلينفق مما آتاه الله ۚ لا يكلف الله نفسا إلا ما آتاها ۚ سيجعل الله بعد عسر يسرا
    surahName: At-Talaaq
    juz: 28
    manzil: 7
    ruku: 492
    page: 559
  relations:
