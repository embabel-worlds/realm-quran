  data:
    ref: '48:22'
    scripture: quran
    name: Quran 48:22
    chapter: 48
    verse: 22
    ordinal: 4605
    text: And if those who disbelieve join battle with you they will take to flight, and afterward they will find no protecting friend nor helper.
    translation: Pickthall
    original: وَلَوْ قَـٰتَلَكُمُ ٱلَّذِينَ كَفَرُوا۟ لَوَلَّوُا۟ ٱلْأَدْبَـٰرَ ثُمَّ لَا يَجِدُونَ وَلِيًّا وَلَا نَصِيرًا
    arabicPlain: ولو قاتلكم الذين كفروا لولوا الأدبار ثم لا يجدون وليا ولا نصيرا
    surahName: Al-Fath
    juz: 26
