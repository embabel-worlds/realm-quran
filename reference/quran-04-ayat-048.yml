  data:
    ref: '48:5'
    scripture: quran
    name: Quran 48:5
    chapter: 48
    verse: 5
    ordinal: 4588
    text: That He may bring the believing men and the believing women into Gardens underneath which rivers flow, wherein they will abide, and may remit from them their evil deeds - That, in the sight of Allah, is the supreme triumph -
    translation: Pickthall
    original: لِّيُدْخِلَ ٱلْمُؤْمِنِينَ وَٱلْمُؤْمِنَـٰتِ جَنَّـٰتٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ خَـٰلِدِينَ فِيهَا وَيُكَفِّرَ عَنْهُمْ سَيِّـَٔاتِهِمْ ۚ وَكَانَ ذَٰلِكَ عِندَ ٱللَّهِ فَوْزًا عَظِيمًا
    arabicPlain: ليدخل المؤمنين والمؤمنات جنات تجري من تحتها الأنهار خالدين فيها ويكفر عنهم سيئاتهم ۚ وكان ذلك عند الله فوزا عظيما
    surahName: Al-Fath
    juz: 26
    manzil: 6
    ruku: 446
    page: 511
