  data:
    ref: '48:28'
    scripture: quran
    name: Quran 48:28
    chapter: 48
    verse: 28
    ordinal: 4611
    text: He it is Who hath sent His messenger with the guidance and the religion of truth, that He may cause it to prevail over all religion. And Allah sufficeth as a Witness.
    translation: Pickthall
    original: هُوَ ٱلَّذِىٓ أَرْسَلَ رَسُولَهُۥ بِٱلْهُدَىٰ وَدِينِ ٱلْحَقِّ لِيُظْهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦ ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًا
    arabicPlain: هو الذي أرسل رسوله بالهدى ودين الحق ليظهره على الدين كله ۚ وكفى بالله شهيدا
    surahName: Al-Fath
    juz: 26
    manzil: 6
    ruku: 449
    page: 514
  relations:
  - predicate: IN
    to:
      type: Surah
