  data:
    ref: '48:21'
    scripture: quran
    name: Quran 48:21
    chapter: 48
    verse: 21
    ordinal: 4604
    text: And other (gain), which ye have not been able to achieve, Allah will compass it, Allah is Able to do all things.
    translation: Pickthall
    original: وَأُخْرَىٰ لَمْ تَقْدِرُوا۟ عَلَيْهَا قَدْ أَحَاطَ ٱللَّهُ بِهَا ۚ وَكَانَ ٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ قَدِيرًا
    arabicPlain: وأخرى لم تقدروا عليها قد أحاط الله بها ۚ وكان الله على كل شيء قديرا
    surahName: Al-Fath
    juz: 26
    manzil: 6
    ruku: 448
