  data:
    ref: '48:19'
    scripture: quran
    name: Quran 48:19
    chapter: 48
    verse: 19
    ordinal: 4602
    text: And much booty that they will capture. Allah is ever Mighty, Wise.
    translation: Pickthall
    original: وَمَغَانِمَ كَثِيرَةً يَأْخُذُونَهَا ۗ وَكَانَ ٱللَّهُ عَزِيزًا حَكِيمًا
    arabicPlain: ومغانم كثيرة يأخذونها ۗ وكان الله عزيزا حكيما
    surahName: Al-Fath
