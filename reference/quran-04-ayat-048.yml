  data:
    ref: '48:23'
    scripture: quran
    name: Quran 48:23
    chapter: 48
    verse: 23
    ordinal: 4606
    text: It is the law of Allah which hath taken course aforetime. Thou wilt not find for the law of Allah aught of power to change.
    translation: Pickthall
    original: سُنَّةَ ٱللَّهِ ٱلَّتِى قَدْ خَلَتْ مِن قَبْلُ ۖ وَلَن تَجِدَ لِسُنَّةِ ٱللَّهِ تَبْدِيلًا
    arabicPlain: سنة الله التي قد خلت من قبل ۖ ولن تجد لسنة الله تبديلا
    surahName: Al-Fath
    juz: 26
