  data:
    ref: '24:53'
    scripture: quran
    name: Quran 24:53
    chapter: 24
    verse: 53
    ordinal: 2844
    text: 'They swear by Allah solemnly that, if thou order them, they will go forth. Say: Swear not; known obedience (is better). Lo! Allah is Informed of what ye do.'
    translation: Pickthall
    original: ۞ وَأَقْسَمُوا۟ بِٱللَّهِ جَهْدَ أَيْمَـٰنِهِمْ لَئِنْ أَمَرْتَهُمْ لَيَخْرُجُنَّ ۖ قُل لَّا تُقْسِمُوا۟ ۖ طَاعَةٌ مَّعْرُوفَةٌ ۚ إِنَّ ٱللَّهَ خَبِيرٌۢ بِمَا تَعْمَلُونَ
    arabicPlain: ۞ وأقسموا بالله جهد أيمانهم لئن أمرتهم ليخرجن ۖ قل لا تقسموا ۖ طاعة معروفة ۚ إن الله خبير بما تعملون
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 307
    page: 356
