    scripture: quran
    name: Quran 24:49
    chapter: 24
    verse: 49
    ordinal: 2840
    text: But if right had been with them they would have come unto him willingly.
    translation: Pickthall
    original: وَإِن يَكُن لَّهُمُ ٱلْحَقُّ يَأْتُوٓا۟ إِلَيْهِ مُذْعِنِينَ
