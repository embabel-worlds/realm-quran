  data:
    ref: '24:8'
    scripture: quran
    name: Quran 24:8
    chapter: 24
    verse: 8
    ordinal: 2799
    text: And it shall avert the punishment from her if she bear witness before Allah four times that the thing he saith is indeed false,
    translation: Pickthall
    original: وَيَدْرَؤُا۟ عَنْهَا ٱلْعَذَابَ أَن تَشْهَدَ أَرْبَعَ شَهَـٰدَٰتٍۭ بِٱللَّهِ ۙ إِنَّهُۥ لَمِنَ ٱلْكَـٰذِبِينَ
    arabicPlain: ويدرأ عنها العذاب أن تشهد أربع شهادات بالله ۙ إنه لمن الكاذبين
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 301
