    scripture: quran
    name: Quran 24:47
    chapter: 24
    verse: 47
    ordinal: 2838
    text: 'And they say: We believe in Allah and the messenger, and we obey; then after that a faction of them turn away. Such are not believers.'
    translation: Pickthall
    original: وَيَقُولُونَ ءَامَنَّا بِٱللَّهِ وَبِٱلرَّسُولِ وَأَطَعْنَا ثُمَّ يَتَوَلَّىٰ فَرِيقٌ مِّنْهُم مِّنۢ بَعْدِ ذَٰلِكَ ۚ وَمَآ أُو۟لَـٰٓئِكَ بِٱلْمُؤْمِنِينَ
    arabicPlain: ويقولون آمنا بالله وبالرسول وأطعنا ثم يتولى فريق منهم من بعد ذلك ۚ وما أولئك بالمؤمنين
