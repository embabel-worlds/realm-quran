- type: Ayah
  data:
    ref: '24:4'
    scripture: quran
    name: Quran 24:4
    chapter: 24
    verse: 4
    ordinal: 2795
    text: And those who accuse honourable women but bring not four witnesses, scourge them (with) eighty stripes and never (afterward) accept their testimony - They indeed are evil-doers -
    translation: Pickthall
    original: وَٱلَّذِينَ يَرْمُونَ ٱلْمُحْصَنَـٰتِ ثُمَّ لَمْ يَأْتُوا۟ بِأَرْبَعَةِ شُهَدَآءَ فَٱجْلِدُوهُمْ ثَمَـٰنِينَ جَلْدَةً وَلَا تَقْبَلُوا۟ لَهُمْ شَهَـٰدَةً أَبَدًا ۚ وَأُو۟لَـٰٓئِكَ هُمُ ٱلْفَـٰسِقُونَ
    arabicPlain: والذين يرمون المحصنات ثم لم يأتوا بأربعة شهداء فاجلدوهم ثمانين جلدة ولا تقبلوا لهم شهادة أبدا ۚ وأولئك هم الفاسقون
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 301
    page: 350
