  data:
    ref: '24:34'
    scripture: quran
    name: Quran 24:34
    chapter: 24
    verse: 34
    ordinal: 2825
    text: And verily We have sent down for you revelations that make plain, and the example of those who passed away before you. An admonition unto those who ward off (evil).
    translation: Pickthall
    original: وَلَقَدْ أَنزَلْنَآ إِلَيْكُمْ ءَايَـٰتٍ مُّبَيِّنَـٰتٍ وَمَثَلًا مِّنَ ٱلَّذِينَ خَلَوْا۟ مِن قَبْلِكُمْ وَمَوْعِظَةً لِّلْمُتَّقِينَ
    arabicPlain: ولقد أنزلنا إليكم آيات مبينات ومثلا من الذين خلوا من قبلكم وموعظة للمتقين
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 304
    page: 354
