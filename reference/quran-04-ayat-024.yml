  data:
    ref: '24:28'
    scripture: quran
    name: Quran 24:28
    chapter: 24
    verse: 28
    ordinal: 2819
    text: 'And if ye find no-one therein, still enter not until permission hath been given. And if it be said unto you: Go away again, then go away, for it is purer for you. Allah knoweth what ye do.'
    translation: Pickthall
    original: فَإِن لَّمْ تَجِدُوا۟ فِيهَآ أَحَدًا فَلَا تَدْخُلُوهَا حَتَّىٰ يُؤْذَنَ لَكُمْ ۖ وَإِن قِيلَ لَكُمُ ٱرْجِعُوا۟ فَٱرْجِعُوا۟ ۖ هُوَ أَزْكَىٰ لَكُمْ ۚ وَٱللَّهُ بِمَا تَعْمَلُونَ عَلِيمٌ
    arabicPlain: فإن لم تجدوا فيها أحدا فلا تدخلوها حتى يؤذن لكم ۖ وإن قيل لكم ارجعوا فارجعوا ۖ هو أزكى لكم ۚ والله بما تعملون عليم
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 304
    page: 353
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '24'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-18
