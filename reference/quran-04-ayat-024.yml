  data:
    ref: '24:56'
    scripture: quran
    name: Quran 24:56
    chapter: 24
    verse: 56
    ordinal: 2847
    text: Establish worship and pay the poor-due and obey the messenger, that haply ye may find mercy.
    translation: Pickthall
    original: وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَأَطِيعُوا۟ ٱلرَّسُولَ لَعَلَّكُمْ تُرْحَمُونَ
    arabicPlain: وأقيموا الصلاة وآتوا الزكاة وأطيعوا الرسول لعلكم ترحمون
    surahName: An-Noor
    juz: 18
