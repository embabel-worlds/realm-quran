  data:
    ref: '24:16'
    scripture: quran
    name: Quran 24:16
    chapter: 24
    verse: 16
    ordinal: 2807
    text: 'Wherefor, when ye heard it, said ye not: It is not for us to speak of this. Glory be to Thee (O Allah)! This is awful calumny.'
    translation: Pickthall
    original: وَلَوْلَآ إِذْ سَمِعْتُمُوهُ قُلْتُم مَّا يَكُونُ لَنَآ أَن نَّتَكَلَّمَ بِهَـٰذَا سُبْحَـٰنَكَ هَـٰذَا بُهْتَـٰنٌ عَظِيمٌ
    arabicPlain: ولولا إذ سمعتموه قلتم ما يكون لنا أن نتكلم بهذا سبحانك هذا بهتان عظيم
    surahName: An-Noor
