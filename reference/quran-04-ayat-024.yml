  data:
    ref: '24:29'
    scripture: quran
    name: Quran 24:29
    chapter: 24
    verse: 29
    ordinal: 2820
    text: (It is) no sin for you to enter uninhabited houses wherein is comfort for you. Allah knoweth what ye proclaim and what ye hide.
    translation: Pickthall
    original: لَّيْسَ عَلَيْكُمْ جُنَاحٌ أَن تَدْخُلُوا۟ بُيُوتًا غَيْرَ مَسْكُونَةٍ فِيهَا مَتَـٰعٌ لَّكُمْ ۚ وَٱللَّهُ يَعْلَمُ مَا تُبْدُونَ وَمَا تَكْتُمُونَ
    arabicPlain: ليس عليكم جناح أن تدخلوا بيوتا غير مسكونة فيها متاع لكم ۚ والله يعلم ما تبدون وما تكتمون
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 304
    page: 353
  relations:
