  data:
    ref: '24:59'
    scripture: quran
    name: Quran 24:59
    chapter: 24
    verse: 59
    ordinal: 2850
    text: And when the children among you come to puberty then let them ask leave even as those before them used to ask it. Thus Allah maketh clear His revelations for you. Allah is Knower, Wise.
    translation: Pickthall
    original: وَإِذَا بَلَغَ ٱلْأَطْفَـٰلُ مِنكُمُ ٱلْحُلُمَ فَلْيَسْتَـْٔذِنُوا۟ كَمَا ٱسْتَـْٔذَنَ ٱلَّذِينَ مِن قَبْلِهِمْ ۚ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمْ ءَايَـٰتِهِۦ ۗ وَٱللَّهُ عَلِيمٌ حَكِيمٌ
    arabicPlain: وإذا بلغ الأطفال منكم الحلم فليستأذنوا كما استأذن الذين من قبلهم ۚ كذلك يبين الله لكم آياته ۗ والله عليم حكيم
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 308
