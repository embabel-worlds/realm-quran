  data:
    ref: '24:7'
    scripture: quran
    name: Quran 24:7
    chapter: 24
    verse: 7
    ordinal: 2798
    text: And yet a fifth, invoking the curse of Allah on him if he is of those who lie.
    translation: Pickthall
    original: وَٱلْخَـٰمِسَةُ أَنَّ لَعْنَتَ ٱللَّهِ عَلَيْهِ إِن كَانَ مِنَ ٱلْكَـٰذِبِينَ
    arabicPlain: والخامسة أن لعنت الله عليه إن كان من الكاذبين
    surahName: An-Noor
    juz: 18
