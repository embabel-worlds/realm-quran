- type: Ayah
  data:
    ref: '24:6'
    scripture: quran
    name: Quran 24:6
    chapter: 24
    verse: 6
    ordinal: 2797
    text: As for those who accuse their wives but have no witnesses except themselves; let the testimony of one of them be four testimonies, (swearing) by Allah that he is of those who speak the truth;
    translation: Pickthall
    original: وَٱلَّذِينَ يَرْمُونَ أَزْوَٰجَهُمْ وَلَمْ يَكُن لَّهُمْ شُهَدَآءُ إِلَّآ أَنفُسُهُمْ فَشَهَـٰدَةُ أَحَدِهِمْ أَرْبَعُ شَهَـٰدَٰتٍۭ بِٱللَّهِ ۙ إِنَّهُۥ لَمِنَ ٱلصَّـٰدِقِينَ
    arabicPlain: والذين يرمون أزواجهم ولم يكن لهم شهداء إلا أنفسهم فشهادة أحدهم أربع شهادات بالله ۙ إنه لمن الصادقين
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 301
