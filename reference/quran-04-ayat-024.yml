  data:
    ref: '24:17'
    scripture: quran
    name: Quran 24:17
    chapter: 24
    verse: 17
    ordinal: 2808
    text: Allah admonisheth you that ye repeat not the like thereof ever, if ye are (in truth) believers.
    translation: Pickthall
    original: يَعِظُكُمُ ٱللَّهُ أَن تَعُودُوا۟ لِمِثْلِهِۦٓ أَبَدًا إِن كُنتُم مُّؤْمِنِينَ
