  data:
    ref: '24:9'
    scripture: quran
    name: Quran 24:9
    chapter: 24
    verse: 9
    ordinal: 2800
    text: And a fifth (time) that the wrath of Allah be upon her if he speaketh truth.
    translation: Pickthall
    original: وَٱلْخَـٰمِسَةَ أَنَّ غَضَبَ ٱللَّهِ عَلَيْهَآ إِن كَانَ مِنَ ٱلصَّـٰدِقِينَ
    arabicPlain: والخامسة أن غضب الله عليها إن كان من الصادقين
