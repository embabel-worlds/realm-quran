    scripture: quran
    name: Quran 24:20
    chapter: 24
    verse: 20
    ordinal: 2811
    text: Had it not been for the grace of Allah and His mercy unto you, and that Allah is Clement, Merciful, (ye had been undone).
    translation: Pickthall
    original: وَلَوْلَا فَضْلُ ٱللَّهِ عَلَيْكُمْ وَرَحْمَتُهُۥ وَأَنَّ ٱللَّهَ رَءُوفٌ رَّحِيمٌ
    arabicPlain: ولولا فضل الله عليكم ورحمته وأن الله رءوف رحيم
    surahName: An-Noor
    juz: 18
    manzil: 4
