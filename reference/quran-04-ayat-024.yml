- type: Ayah
  data:
    ref: '24:2'
    scripture: quran
    name: Quran 24:2
    chapter: 24
    verse: 2
    ordinal: 2793
    text: The adulterer and the adulteress, scourge ye each one of them (with) a hundred stripes. And let not pity for the twain withhold you from obedience to Allah, if ye believe in Allah and the Last Day. And let a party of believers witness their punishment.
    translation: Pickthall
    original: ٱلزَّانِيَةُ وَٱلزَّانِى فَٱجْلِدُوا۟ كُلَّ وَٰحِدٍ مِّنْهُمَا مِا۟ئَةَ جَلْدَةٍ ۖ وَلَا تَأْخُذْكُم بِهِمَا رَأْفَةٌ فِى دِينِ ٱللَّهِ إِن كُنتُمْ تُؤْمِنُونَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ ۖ وَلْيَشْهَدْ عَذَابَهُمَا طَآئِفَةٌ مِّنَ ٱلْمُؤْمِنِينَ
    arabicPlain: الزانية والزاني فاجلدوا كل واحد منهما مائة جلدة ۖ ولا تأخذكم بهما رأفة في دين الله إن كنتم تؤمنون بالله واليوم الآخر ۖ وليشهد عذابهما طائفة من المؤمنين
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 301
    page: 350
