  data:
    ref: 24:64
    scripture: quran
    name: Quran 24:64
    chapter: 24
    verse: 64
    ordinal: 2855
    text: Lo! verily unto Allah belongeth whatsoever is in the heavens and the earth. He knoweth your condition. And (He knoweth) the Day when they are returned unto Him so that He may inform them of what they did. Allah is Knower of all things.
    translation: Pickthall
    original: أَلَآ إِنَّ لِلَّهِ مَا فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۖ قَدْ يَعْلَمُ مَآ أَنتُمْ عَلَيْهِ وَيَوْمَ يُرْجَعُونَ إِلَيْهِ فَيُنَبِّئُهُم بِمَا عَمِلُوا۟ ۗ وَٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمٌۢ
    arabicPlain: ألا إن لله ما في السماوات والأرض ۖ قد يعلم ما أنتم عليه ويوم يرجعون إليه فينبئهم بما عملوا ۗ والله بكل شيء عليم
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 309
    page: 359
