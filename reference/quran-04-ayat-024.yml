    name: Quran 24:46
    chapter: 24
    verse: 46
    ordinal: 2837
    text: Verily We have sent down revelations and explained them. Allah guideth whom He will unto a straight path.
    translation: Pickthall
    original: لَّقَدْ أَنزَلْنَآ ءَايَـٰتٍ مُّبَيِّنَـٰتٍ ۚ وَٱللَّهُ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍ مُّسْتَقِيمٍ
    arabicPlain: لقد أنزلنا آيات مبينات ۚ والله يهدي من يشاء إلى صراط مستقيم
