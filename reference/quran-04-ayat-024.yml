- type: Ayah
  data:
    ref: '24:3'
    scripture: quran
    name: Quran 24:3
    chapter: 24
    verse: 3
    ordinal: 2794
    text: The adulterer shall not marry save an adulteress or an idolatress, and the adulteress none shall marry save an adulterer or an idolater. All that is forbidden unto believers.
    translation: Pickthall
    original: ٱلزَّانِى لَا يَنكِحُ إِلَّا زَانِيَةً أَوْ مُشْرِكَةً وَٱلزَّانِيَةُ لَا يَنكِحُهَآ إِلَّا زَانٍ أَوْ مُشْرِكٌ ۚ وَحُرِّمَ ذَٰلِكَ عَلَى ٱلْمُؤْمِنِينَ
    arabicPlain: الزاني لا ينكح إلا زانية أو مشركة والزانية لا ينكحها إلا زان أو مشرك ۚ وحرم ذلك على المؤمنين
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 301
    page: 350
