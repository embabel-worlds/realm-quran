  data:
    ref: '24:24'
    scripture: quran
    name: Quran 24:24
    chapter: 24
    verse: 24
    ordinal: 2815
    text: On the day when their tongues and their hands and their feet testify against them as to what they used to do,
    translation: Pickthall
    original: يَوْمَ تَشْهَدُ عَلَيْهِمْ أَلْسِنَتُهُمْ وَأَيْدِيهِمْ وَأَرْجُلُهُم بِمَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: يوم تشهد عليهم ألسنتهم وأيديهم وأرجلهم بما كانوا يعملون
