  data:
    ref: '24:50'
    scripture: quran
    name: Quran 24:50
    chapter: 24
    verse: 50
    ordinal: 2841
    text: Is there in their hearts a disease, or have they doubts, or fear they lest Allah and His messenger should wrong them in judgment? Nay, but such are evil-doers.
    translation: Pickthall
    original: أَفِى قُلُوبِهِم مَّرَضٌ أَمِ ٱرْتَابُوٓا۟ أَمْ يَخَافُونَ أَن يَحِيفَ ٱللَّهُ عَلَيْهِمْ وَرَسُولُهُۥ ۚ بَلْ أُو۟لَـٰٓئِكَ هُمُ ٱلظَّـٰلِمُونَ
    arabicPlain: أفي قلوبهم مرض أم ارتابوا أم يخافون أن يحيف الله عليهم ورسوله ۚ بل أولئك هم الظالمون
    surahName: An-Noor
