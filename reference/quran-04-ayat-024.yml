  data:
    ref: '24:41'
    scripture: quran
    name: Quran 24:41
    chapter: 24
    verse: 41
    ordinal: 2832
    text: Hast thou not seen that Allah, He it is Whom all who are in the heavens and the earth praise, and the birds in their flight? Of each He knoweth verily the worship and the praise; and Allah is Aware of what they do.
    translation: Pickthall
    original: أَلَمْ تَرَ أَنَّ ٱللَّهَ يُسَبِّحُ لَهُۥ مَن فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَٱلطَّيْرُ صَـٰٓفَّـٰتٍ ۖ كُلٌّ قَدْ عَلِمَ صَلَاتَهُۥ وَتَسْبِيحَهُۥ ۗ وَٱللَّهُ عَلِيمٌۢ بِمَا يَفْعَلُونَ
    arabicPlain: ألم تر أن الله يسبح له من في السماوات والأرض والطير صافات ۖ كل قد علم صلاته وتسبيحه ۗ والله عليم بما يفعلون
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 306
    page: 355
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '24'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-18
- type: Ayah
  data:
    ref: '24:42'
    scripture: quran
    name: Quran 24:42
    chapter: 24
    verse: 42
    ordinal: 2833
    text: And unto Allah belongeth the Sovereignty of the heavens and the earth, and unto Allah is the journeying.
    translation: Pickthall
    original: وَلِلَّهِ مُلْكُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۖ وَإِلَى ٱللَّهِ ٱلْمَصِيرُ
    arabicPlain: ولله ملك السماوات والأرض ۖ وإلى الله المصير
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 306
    page: 355
  relations:
  - predicate: IN
    to:
