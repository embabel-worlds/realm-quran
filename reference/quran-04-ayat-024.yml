  data:
    ref: '24:26'
    scripture: quran
    name: Quran 24:26
    chapter: 24
    verse: 26
    ordinal: 2817
    text: 'Vile women are for vile men, and vile men for vile women. Good women are for good men, and good men for good women; such are innocent of that which people say: For them is pardon and a bountiful provision.'
    translation: Pickthall
    original: ٱلْخَبِيثَـٰتُ لِلْخَبِيثِينَ وَٱلْخَبِيثُونَ لِلْخَبِيثَـٰتِ ۖ وَٱلطَّيِّبَـٰتُ لِلطَّيِّبِينَ وَٱلطَّيِّبُونَ لِلطَّيِّبَـٰتِ ۚ أُو۟لَـٰٓئِكَ مُبَرَّءُونَ مِمَّا يَقُولُونَ ۖ لَهُم مَّغْفِرَةٌ وَرِزْقٌ كَرِيمٌ
    arabicPlain: الخبيثات للخبيثين والخبيثون للخبيثات ۖ والطيبات للطيبين والطيبون للطيبات ۚ أولئك مبرءون مما يقولون ۖ لهم مغفرة ورزق كريم
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 303
