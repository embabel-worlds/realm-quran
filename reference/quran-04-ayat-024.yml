- type: Ayah
  data:
    ref: '24:11'
    scripture: quran
    name: Quran 24:11
    chapter: 24
    verse: 11
    ordinal: 2802
    text: Lo! they who spread the slander are a gang among you. Deem it not a bad thing for you; nay, it is good for you. Unto every man of them (will be paid) that which he hath earned of the sin; and as for him among them who had the greater share therein, his will be an awful doom.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ جَآءُو بِٱلْإِفْكِ عُصْبَةٌ مِّنكُمْ ۚ لَا تَحْسَبُوهُ شَرًّا لَّكُم ۖ بَلْ هُوَ خَيْرٌ لَّكُمْ ۚ لِكُلِّ ٱمْرِئٍ مِّنْهُم مَّا ٱكْتَسَبَ مِنَ ٱلْإِثْمِ ۚ وَٱلَّذِى تَوَلَّىٰ كِبْرَهُۥ مِنْهُمْ لَهُۥ عَذَابٌ عَظِيمٌ
    arabicPlain: إن الذين جاءوا بالإفك عصبة منكم ۚ لا تحسبوه شرا لكم ۖ بل هو خير لكم ۚ لكل امرئ منهم ما اكتسب من الإثم ۚ والذي تولى كبره منهم له عذاب عظيم
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 302
