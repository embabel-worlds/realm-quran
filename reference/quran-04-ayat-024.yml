  data:
    ref: '24:54'
    scripture: quran
    name: Quran 24:54
    chapter: 24
    verse: 54
    ordinal: 2845
    text: 'Say: Obey Allah and obey the messenger. But if ye turn away, then (it is) for him (to do) only that wherewith he hath been charged, and for you (to do) only that wherewith ye have been charged. If ye obey him, ye will go aright. But the messenger hath no other charge than to convey (the message) plainly.'
    translation: Pickthall
    original: قُلْ أَطِيعُوا۟ ٱللَّهَ وَأَطِيعُوا۟ ٱلرَّسُولَ ۖ فَإِن تَوَلَّوْا۟ فَإِنَّمَا عَلَيْهِ مَا حُمِّلَ وَعَلَيْكُم مَّا حُمِّلْتُمْ ۖ وَإِن تُطِيعُوهُ تَهْتَدُوا۟ ۚ وَمَا عَلَى ٱلرَّسُولِ إِلَّا ٱلْبَلَـٰغُ ٱلْمُبِينُ
    arabicPlain: قل أطيعوا الله وأطيعوا الرسول ۖ فإن تولوا فإنما عليه ما حمل وعليكم ما حملتم ۖ وإن تطيعوه تهتدوا ۚ وما على الرسول إلا البلاغ المبين
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 307
    page: 357
  relations:
