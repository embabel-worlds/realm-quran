  data:
    ref: '24:38'
    scripture: quran
    name: Quran 24:38
    chapter: 24
    verse: 38
    ordinal: 2829
    text: That Allah may reward them with the best of what they did, and increase reward for them of His bounty. Allah giveth blessings without stint to whom He will.
    translation: Pickthall
    original: لِيَجْزِيَهُمُ ٱللَّهُ أَحْسَنَ مَا عَمِلُوا۟ وَيَزِيدَهُم مِّن فَضْلِهِۦ ۗ وَٱللَّهُ يَرْزُقُ مَن يَشَآءُ بِغَيْرِ حِسَابٍ
    arabicPlain: ليجزيهم الله أحسن ما عملوا ويزيدهم من فضله ۗ والله يرزق من يشاء بغير حساب
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 305
    page: 355
  relations:
