  data:
    ref: '24:13'
    scripture: quran
    name: Quran 24:13
    chapter: 24
    verse: 13
    ordinal: 2804
    text: Why did they not produce four witnesses? Since they produce not witnesses, they verily are liars in the sight of Allah.
    translation: Pickthall
    original: لَّوْلَا جَآءُو عَلَيْهِ بِأَرْبَعَةِ شُهَدَآءَ ۚ فَإِذْ لَمْ يَأْتُوا۟ بِٱلشُّهَدَآءِ فَأُو۟لَـٰٓئِكَ عِندَ ٱللَّهِ هُمُ ٱلْكَـٰذِبُونَ
    arabicPlain: لولا جاءوا عليه بأربعة شهداء ۚ فإذ لم يأتوا بالشهداء فأولئك عند الله هم الكاذبون
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 302
