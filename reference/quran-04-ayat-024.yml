  data:
    ref: '24:25'
    scripture: quran
    name: Quran 24:25
    chapter: 24
    verse: 25
    ordinal: 2816
    text: On that day Allah will pay them their just due, and they will know that Allah, He is the Manifest Truth.
    translation: Pickthall
    original: يَوْمَئِذٍ يُوَفِّيهِمُ ٱللَّهُ دِينَهُمُ ٱلْحَقَّ وَيَعْلَمُونَ أَنَّ ٱللَّهَ هُوَ ٱلْحَقُّ ٱلْمُبِينُ
    arabicPlain: يومئذ يوفيهم الله دينهم الحق ويعلمون أن الله هو الحق المبين
