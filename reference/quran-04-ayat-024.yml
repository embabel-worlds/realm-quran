  data:
    ref: '24:57'
    scripture: quran
    name: Quran 24:57
    chapter: 24
    verse: 57
    ordinal: 2848
    text: Think not that the disbelievers can escape in the land. Fire will be their home - a hapless journey's end!
    translation: Pickthall
    original: لَا تَحْسَبَنَّ ٱلَّذِينَ كَفَرُوا۟ مُعْجِزِينَ فِى ٱلْأَرْضِ ۚ وَمَأْوَىٰهُمُ ٱلنَّارُ ۖ وَلَبِئْسَ ٱلْمَصِيرُ
    arabicPlain: لا تحسبن الذين كفروا معجزين في الأرض ۚ ومأواهم النار ۖ ولبئس المصير
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 307
    page: 357
  relations:
