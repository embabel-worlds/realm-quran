  data:
    ref: '24:12'
    scripture: quran
    name: Quran 24:12
    chapter: 24
    verse: 12
    ordinal: 2803
    text: 'Why did not the believers, men and women, when ye heard it, think good of their own own folk, and say: It is a manifest untruth?'
    translation: Pickthall
    original: لَّوْلَآ إِذْ سَمِعْتُمُوهُ ظَنَّ ٱلْمُؤْمِنُونَ وَٱلْمُؤْمِنَـٰتُ بِأَنفُسِهِمْ خَيْرًا وَقَالُوا۟ هَـٰذَآ إِفْكٌ مُّبِينٌ
    arabicPlain: لولا إذ سمعتموه ظن المؤمنون والمؤمنات بأنفسهم خيرا وقالوا هذا إفك مبين
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 302
    page: 351
  relations:
