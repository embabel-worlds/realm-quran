  data:
    ref: '24:36'
    scripture: quran
    name: Quran 24:36
    chapter: 24
    verse: 36
    ordinal: 2827
    text: (This lamp is found) in houses which Allah hath allowed to be exalted and that His name shall be remembered therein. Therein do offer praise to Him at morn and evening.
    translation: Pickthall
    original: فِى بُيُوتٍ أَذِنَ ٱللَّهُ أَن تُرْفَعَ وَيُذْكَرَ فِيهَا ٱسْمُهُۥ يُسَبِّحُ لَهُۥ فِيهَا بِٱلْغُدُوِّ وَٱلْـَٔاصَالِ
    arabicPlain: في بيوت أذن الله أن ترفع ويذكر فيها اسمه يسبح له فيها بالغدو والآصال
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 305
    page: 354
