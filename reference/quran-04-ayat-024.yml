  data:
    ref: '24:27'
    scripture: quran
    name: Quran 24:27
    chapter: 24
    verse: 27
    ordinal: 2818
    text: O ye who believe! Enter not houses other than your own without first announcing your presence and invoking peace upon the folk thereof. That is better for you, that ye may be heedful.
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَدْخُلُوا۟ بُيُوتًا غَيْرَ بُيُوتِكُمْ حَتَّىٰ تَسْتَأْنِسُوا۟ وَتُسَلِّمُوا۟ عَلَىٰٓ أَهْلِهَا ۚ ذَٰلِكُمْ خَيْرٌ لَّكُمْ لَعَلَّكُمْ تَذَكَّرُونَ
    arabicPlain: يا أيها الذين آمنوا لا تدخلوا بيوتا غير بيوتكم حتى تستأنسوا وتسلموا على أهلها ۚ ذلكم خير لكم لعلكم تذكرون
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 304
    page: 352
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '24'
  - predicate: IN_PORTION
    to:
      type: Juz
