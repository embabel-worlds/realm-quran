  data:
    ref: '24:48'
    scripture: quran
    name: Quran 24:48
    chapter: 24
    verse: 48
    ordinal: 2839
    text: And when they appeal unto Allah and His messenger to judge between them, lo! a faction of them are averse;
    translation: Pickthall
    original: وَإِذَا دُعُوٓا۟ إِلَى ٱللَّهِ وَرَسُولِهِۦ لِيَحْكُمَ بَيْنَهُمْ إِذَا فَرِيقٌ مِّنْهُم مُّعْرِضُونَ
    arabicPlain: وإذا دعوا إلى الله ورسوله ليحكم بينهم إذا فريق منهم معرضون
