- type: Ayah
  data:
    ref: '24:10'
    scripture: quran
    name: Quran 24:10
    chapter: 24
    verse: 10
    ordinal: 2801
    text: And had it not been for the grace of Allah and His mercy unto you, and that Allah is Clement, Wise, (ye had been undone).
    translation: Pickthall
    original: وَلَوْلَا فَضْلُ ٱللَّهِ عَلَيْكُمْ وَرَحْمَتُهُۥ وَأَنَّ ٱللَّهَ تَوَّابٌ حَكِيمٌ
    arabicPlain: ولولا فضل الله عليكم ورحمته وأن الله تواب حكيم
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 301
