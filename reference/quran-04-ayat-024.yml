  data:
    ref: '24:40'
    scripture: quran
    name: Quran 24:40
    chapter: 24
    verse: 40
    ordinal: 2831
    text: Or as darkness on a vast, abysmal sea. There covereth him a wave, above which is a wave, above which is a cloud. Layer upon layer of darkness. When he holdeth out his hand he scarce can see it. And he for whom Allah hath not appointed light, for him there is no light.
    translation: Pickthall
    original: أَوْ كَظُلُمَـٰتٍ فِى بَحْرٍ لُّجِّىٍّ يَغْشَىٰهُ مَوْجٌ مِّن فَوْقِهِۦ مَوْجٌ مِّن فَوْقِهِۦ سَحَابٌ ۚ ظُلُمَـٰتٌۢ بَعْضُهَا فَوْقَ بَعْضٍ إِذَآ أَخْرَجَ يَدَهُۥ لَمْ يَكَدْ يَرَىٰهَا ۗ وَمَن لَّمْ يَجْعَلِ ٱللَّهُ لَهُۥ نُورًا فَمَا لَهُۥ مِن نُّورٍ
    arabicPlain: أو كظلمات في بحر لجي يغشاه موج من فوقه موج من فوقه سحاب ۚ ظلمات بعضها فوق بعض إذا أخرج يده لم يكد يراها ۗ ومن لم يجعل الله له نورا فما له من نور
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 305
    page: 355
  relations:
