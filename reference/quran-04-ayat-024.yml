  data:
    ref: '24:52'
    scripture: quran
    name: Quran 24:52
    chapter: 24
    verse: 52
    ordinal: 2843
    text: 'He who obeyeth Allah and His messenger, and feareth Allah, and keepeth duty (unto Him): such indeed are the victorious.'
    translation: Pickthall
    original: وَمَن يُطِعِ ٱللَّهَ وَرَسُولَهُۥ وَيَخْشَ ٱللَّهَ وَيَتَّقْهِ فَأُو۟لَـٰٓئِكَ هُمُ ٱلْفَآئِزُونَ
    arabicPlain: ومن يطع الله ورسوله ويخش الله ويتقه فأولئك هم الفائزون
    surahName: An-Noor
    juz: 18
    manzil: 4
