- type: Ayah
  data:
    ref: '24:5'
    scripture: quran
    name: Quran 24:5
    chapter: 24
    verse: 5
    ordinal: 2796
    text: Save those who afterward repent and make amends. (For such) lo! Allah is Forgiving, Merciful.
    translation: Pickthall
    original: إِلَّا ٱلَّذِينَ تَابُوا۟ مِنۢ بَعْدِ ذَٰلِكَ وَأَصْلَحُوا۟ فَإِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ
    arabicPlain: إلا الذين تابوا من بعد ذلك وأصلحوا فإن الله غفور رحيم
    surahName: An-Noor
    juz: 18
    manzil: 4
    ruku: 301
