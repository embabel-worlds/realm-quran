    translation: Pickthall
    original: يُقَلِّبُ ٱللَّهُ ٱلَّيْلَ وَٱلنَّهَارَ ۚ إِنَّ فِى ذَٰلِكَ لَعِبْرَةً لِّأُو۟لِى ٱلْأَبْصَـٰرِ
    arabicPlain: يقلب الله الليل والنهار ۚ إن في ذلك لعبرة لأولي الأبصار
