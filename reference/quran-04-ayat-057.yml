  data:
    ref: '57:28'
    scripture: quran
    name: Quran 57:28
    chapter: 57
    verse: 28
    ordinal: 5103
    text: O ye who believe! Be mindful of your duty to Allah and put faith in His messenger. He will give you twofold of His mercy and will appoint for you a light wherein ye shall walk, and will forgive you. Allah is Forgiving, Merciful;
    translation: Pickthall
    original: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَءَامِنُوا۟ بِرَسُولِهِۦ يُؤْتِكُمْ كِفْلَيْنِ مِن رَّحْمَتِهِۦ وَيَجْعَل لَّكُمْ نُورًا تَمْشُونَ بِهِۦ وَيَغْفِرْ لَكُمْ ۚ وَٱللَّهُ غَفُورٌ رَّحِيمٌ
    arabicPlain: يا أيها الذين آمنوا اتقوا الله وآمنوا برسوله يؤتكم كفلين من رحمته ويجعل لكم نورا تمشون به ويغفر لكم ۚ والله غفور رحيم
    surahName: Al-Hadid
    juz: 27
    manzil: 7
    ruku: 475
    page: 541
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '57'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-27
- type: Ayah
  data:
    ref: '57:29'
    scripture: quran
    name: Quran 57:29
    chapter: 57
    verse: 29
    ordinal: 5104
    text: That the People of the Scripture may know that they control naught of the bounty of Allah, but that the bounty is in Allah's hand to give to whom He will. And Allah is of Infinite Bounty.
    translation: Pickthall
    original: لِّئَلَّا يَعْلَمَ أَهْلُ ٱلْكِتَـٰبِ أَلَّا يَقْدِرُونَ عَلَىٰ شَىْءٍ مِّن فَضْلِ ٱللَّهِ ۙ وَأَنَّ ٱلْفَضْلَ بِيَدِ ٱللَّهِ يُؤْتِيهِ مَن يَشَآءُ ۚ وَٱللَّهُ ذُو ٱلْفَضْلِ ٱلْعَظِيمِ
    arabicPlain: لئلا يعلم أهل الكتاب ألا يقدرون على شيء من فضل الله ۙ وأن الفضل بيد الله يؤتيه من يشاء ۚ والله ذو الفضل العظيم
