  data:
    ref: '57:23'
    scripture: quran
    name: Quran 57:23
    chapter: 57
    verse: 23
    ordinal: 5098
    text: That ye grieve not for the sake of that which hath escaped you, nor yet exult because of that which hath been given. Allah loveth not all prideful boasters,
    translation: Pickthall
    original: لِّكَيْلَا تَأْسَوْا۟ عَلَىٰ مَا فَاتَكُمْ وَلَا تَفْرَحُوا۟ بِمَآ ءَاتَىٰكُمْ ۗ وَٱللَّهُ لَا يُحِبُّ كُلَّ مُخْتَالٍ فَخُورٍ
    arabicPlain: لكيلا تأسوا على ما فاتكم ولا تفرحوا بما آتاكم ۗ والله لا يحب كل مختال فخور
    surahName: Al-Hadid
    juz: 27
    manzil: 7
    ruku: 474
    page: 540
