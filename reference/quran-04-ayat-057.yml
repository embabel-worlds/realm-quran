- type: Ayah
  data:
    ref: '57:10'
    scripture: quran
    name: Quran 57:10
    chapter: 57
    verse: 10
    ordinal: 5085
    text: And what aileth you that ye spend not in the way of Allah when unto Allah belongeth the inheritance of the heavens and the earth? Those who spent and fought before the victory are not upon a level (with the rest of you). Such are greater in rank than those who spent and fought afterwards. Unto each hath Allah promised good. And Allah is Informed of what ye do.
    translation: Pickthall
    original: وَمَا لَكُمْ أَلَّا تُنفِقُوا۟ فِى سَبِيلِ ٱللَّهِ وَلِلَّهِ مِيرَٰثُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۚ لَا يَسْتَوِى مِنكُم مَّنْ أَنفَقَ مِن قَبْلِ ٱلْفَتْحِ وَقَـٰتَلَ ۚ أُو۟لَـٰٓئِكَ أَعْظَمُ دَرَجَةً مِّنَ ٱلَّذِينَ أَنفَقُوا۟ مِنۢ بَعْدُ وَقَـٰتَلُوا۟ ۚ وَكُلًّا وَعَدَ ٱللَّهُ ٱلْحُسْنَىٰ ۚ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ
    arabicPlain: وما لكم ألا تنفقوا في سبيل الله ولله ميراث السماوات والأرض ۚ لا يستوي منكم من أنفق من قبل الفتح وقاتل ۚ أولئك أعظم درجة من الذين أنفقوا من بعد وقاتلوا ۚ وكلا وعد الله الحسنى ۚ والله بما تعملون خبير
    surahName: Al-Hadid
    juz: 27
    manzil: 7
    ruku: 472
    page: 538
  relations:
  - predicate: IN
