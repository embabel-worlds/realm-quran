  data:
    ref: '57:11'
    scripture: quran
    name: Quran 57:11
    chapter: 57
    verse: 11
    ordinal: 5086
    text: Who is he that will lend unto Allah a goodly loan, that He may double it for him and his may be a rich reward?
    translation: Pickthall
    original: مَّن ذَا ٱلَّذِى يُقْرِضُ ٱللَّهَ قَرْضًا حَسَنًا فَيُضَـٰعِفَهُۥ لَهُۥ وَلَهُۥٓ أَجْرٌ كَرِيمٌ
    arabicPlain: من ذا الذي يقرض الله قرضا حسنا فيضاعفه له وله أجر كريم
    surahName: Al-Hadid
    juz: 27
    manzil: 7
