  data:
    ref: '57:24'
    scripture: quran
    name: Quran 57:24
    chapter: 57
    verse: 24
    ordinal: 5099
    text: Who hoard and who enjoin upon the people avarice. And whosoever turneth away, still Allah is the Absolute, the Owner of Praise.
    translation: Pickthall
    original: ٱلَّذِينَ يَبْخَلُونَ وَيَأْمُرُونَ ٱلنَّاسَ بِٱلْبُخْلِ ۗ وَمَن يَتَوَلَّ فَإِنَّ ٱللَّهَ هُوَ ٱلْغَنِىُّ ٱلْحَمِيدُ
    arabicPlain: الذين يبخلون ويأمرون الناس بالبخل ۗ ومن يتول فإن الله هو الغني الحميد
    surahName: Al-Hadid
    juz: 27
    manzil: 7
    ruku: 474
    page: 540
