- type: Ayah
  data:
    ref: '57:9'
    scripture: quran
    name: Quran 57:9
    chapter: 57
    verse: 9
    ordinal: 5084
    text: He it is Who sendeth down clear revelations unto His slave, that He may bring you forth from darkness unto light; and lo! for you, Allah is Full of Pity, Merciful.
    translation: Pickthall
    original: هُوَ ٱلَّذِى يُنَزِّلُ عَلَىٰ عَبْدِهِۦٓ ءَايَـٰتٍۭ بَيِّنَـٰتٍ لِّيُخْرِجَكُم مِّنَ ٱلظُّلُمَـٰتِ إِلَى ٱلنُّورِ ۚ وَإِنَّ ٱللَّهَ بِكُمْ لَرَءُوفٌ رَّحِيمٌ
    arabicPlain: هو الذي ينزل على عبده آيات بينات ليخرجكم من الظلمات إلى النور ۚ وإن الله بكم لرءوف رحيم
    surahName: Al-Hadid
    juz: 27
    manzil: 7
    ruku: 472
