- type: Ayah
  data:
    ref: '57:8'
    scripture: quran
    name: Quran 57:8
    chapter: 57
    verse: 8
    ordinal: 5083
    text: What aileth you that ye believe not in Allah, when the messenger calleth you to believe in your Lord, and He hath already made a covenant with you, if ye are believers?
    translation: Pickthall
    original: وَمَا لَكُمْ لَا تُؤْمِنُونَ بِٱللَّهِ ۙ وَٱلرَّسُولُ يَدْعُوكُمْ لِتُؤْمِنُوا۟ بِرَبِّكُمْ وَقَدْ أَخَذَ مِيثَـٰقَكُمْ إِن كُنتُم مُّؤْمِنِينَ
    arabicPlain: وما لكم لا تؤمنون بالله ۙ والرسول يدعوكم لتؤمنوا بربكم وقد أخذ ميثاقكم إن كنتم مؤمنين
    surahName: Al-Hadid
    juz: 27
    manzil: 7
