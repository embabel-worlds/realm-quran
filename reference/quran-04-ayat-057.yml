- type: Ayah
  data:
    ref: '57:4'
    scripture: quran
    name: Quran 57:4
    chapter: 57
    verse: 4
    ordinal: 5079
    text: He it is Who created the heavens and the earth in six Days; then He mounted the Throne. He knoweth all that entereth the earth and all that emergeth therefrom and all that cometh down from the sky and all that ascendeth therein; and He is with you wheresoever ye may be. And Allah is Seer of what ye do.
    translation: Pickthall
    original: هُوَ ٱلَّذِى خَلَقَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ فِى سِتَّةِ أَيَّامٍ ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ ۚ يَعْلَمُ مَا يَلِجُ فِى ٱلْأَرْضِ وَمَا يَخْرُجُ مِنْهَا وَمَا يَنزِلُ مِنَ ٱلسَّمَآءِ وَمَا يَعْرُجُ فِيهَا ۖ وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ ۚ وَٱللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ
    arabicPlain: هو الذي خلق السماوات والأرض في ستة أيام ثم استوى على العرش ۚ يعلم ما يلج في الأرض وما يخرج منها وما ينزل من السماء وما يعرج فيها ۖ وهو معكم أين ما كنتم ۚ والله بما تعملون بصير
    surahName: Al-Hadid
    juz: 27
    manzil: 7
    ruku: 472
    page: 538
