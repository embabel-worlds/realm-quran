  data:
    ref: '57:17'
    scripture: quran
    name: Quran 57:17
    chapter: 57
    verse: 17
    ordinal: 5092
    text: Know that Allah quickeneth the earth after its death. We have made clear Our revelations for you, that haply ye may understand.
    translation: Pickthall
    original: ٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ يُحْىِ ٱلْأَرْضَ بَعْدَ مَوْتِهَا ۚ قَدْ بَيَّنَّا لَكُمُ ٱلْـَٔايَـٰتِ لَعَلَّكُمْ تَعْقِلُونَ
    arabicPlain: اعلموا أن الله يحيي الأرض بعد موتها ۚ قد بينا لكم الآيات لعلكم تعقلون
    surahName: Al-Hadid
    juz: 27
