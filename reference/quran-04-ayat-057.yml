  data:
    ref: '57:18'
    scripture: quran
    name: Quran 57:18
    chapter: 57
    verse: 18
    ordinal: 5093
    text: Lo! those who give alms, both men and women, and lend unto Allah a goodly loan, it will be doubled for them, and theirs will be a rich reward.
    translation: Pickthall
    original: إِنَّ ٱلْمُصَّدِّقِينَ وَٱلْمُصَّدِّقَـٰتِ وَأَقْرَضُوا۟ ٱللَّهَ قَرْضًا حَسَنًا يُضَـٰعَفُ لَهُمْ وَلَهُمْ أَجْرٌ كَرِيمٌ
    arabicPlain: إن المصدقين والمصدقات وأقرضوا الله قرضا حسنا يضاعف لهم ولهم أجر كريم
    surahName: Al-Hadid
    juz: 27
