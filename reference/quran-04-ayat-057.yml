  data:
    ref: '57:22'
    scripture: quran
    name: Quran 57:22
    chapter: 57
    verse: 22
    ordinal: 5097
    text: Naught of disaster befalleth in the earth or in yourselves but it is in a Book before we bring it into being - Lo! that is easy for Allah -
    translation: Pickthall
    original: مَآ أَصَابَ مِن مُّصِيبَةٍ فِى ٱلْأَرْضِ وَلَا فِىٓ أَنفُسِكُمْ إِلَّا فِى كِتَـٰبٍ مِّن قَبْلِ أَن نَّبْرَأَهَآ ۚ إِنَّ ذَٰلِكَ عَلَى ٱللَّهِ يَسِيرٌ
    arabicPlain: ما أصاب من مصيبة في الأرض ولا في أنفسكم إلا في كتاب من قبل أن نبرأها ۚ إن ذلك على الله يسير
    surahName: Al-Hadid
    juz: 27
    manzil: 7
    ruku: 474
    page: 540
