- type: Ayah
  data:
    ref: '57:15'
    scripture: quran
    name: Quran 57:15
    chapter: 57
    verse: 15
    ordinal: 5090
    text: So this day no ransom can be taken from you nor from those who disbelieved. Your home is the Fire; that is your patron, and a hapless journey's end.
    translation: Pickthall
    original: فَٱلْيَوْمَ لَا يُؤْخَذُ مِنكُمْ فِدْيَةٌ وَلَا مِنَ ٱلَّذِينَ كَفَرُوا۟ ۚ مَأْوَىٰكُمُ ٱلنَّارُ ۖ هِىَ مَوْلَىٰكُمْ ۖ وَبِئْسَ ٱلْمَصِيرُ
    arabicPlain: فاليوم لا يؤخذ منكم فدية ولا من الذين كفروا ۚ مأواكم النار ۖ هي مولاكم ۖ وبئس المصير
    surahName: Al-Hadid
    juz: 27
    manzil: 7
    ruku: 473
