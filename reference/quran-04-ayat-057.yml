  data:
    ref: '57:6'
    scripture: quran
    name: Quran 57:6
    chapter: 57
    verse: 6
    ordinal: 5081
    text: He causeth the night to pass into the day, and He causeth the day to pass into the night, and He is knower of all that is in the breasts.
    translation: Pickthall
    original: يُولِجُ ٱلَّيْلَ فِى ٱلنَّهَارِ وَيُولِجُ ٱلنَّهَارَ فِى ٱلَّيْلِ ۚ وَهُوَ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ
    arabicPlain: يولج الليل في النهار ويولج النهار في الليل ۚ وهو عليم بذات الصدور
