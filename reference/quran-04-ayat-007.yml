  data:
    ref: 7:189
    scripture: quran
    name: Quran 7:189
    chapter: 7
    verse: 189
    ordinal: 1143
    text: 'He it is Who did create you from a single soul, and therefrom did make his mate that he might take rest in her. And when he covered her she bore a light burden, and she passed (unnoticed) with it, but when it became heavy they cried unto Allah, their Lord, saying: If thou givest unto us aright we shall be of the thankful.'
    translation: Pickthall
    original: ۞ هُوَ ٱلَّذِى خَلَقَكُم مِّن نَّفْسٍ وَٰحِدَةٍ وَجَعَلَ مِنْهَا زَوْجَهَا لِيَسْكُنَ إِلَيْهَا ۖ فَلَمَّا تَغَشَّىٰهَا حَمَلَتْ حَمْلًا خَفِيفًا فَمَرَّتْ بِهِۦ ۖ فَلَمَّآ أَثْقَلَت دَّعَوَا ٱللَّهَ رَبَّهُمَا لَئِنْ ءَاتَيْتَنَا صَـٰلِحًا لَّنَكُونَنَّ مِنَ ٱلشَّـٰكِرِينَ
    arabicPlain: ۞ هو الذي خلقكم من نفس واحدة وجعل منها زوجها ليسكن إليها ۖ فلما تغشاها حملت حملا خفيفا فمرت به ۖ فلما أثقلت دعوا الله ربهما لئن آتيتنا صالحا لنكونن من الشاكرين
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 145
