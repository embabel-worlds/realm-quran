  data:
    ref: 7:133
    scripture: quran
    name: Quran 7:133
    chapter: 7
    verse: 133
    ordinal: 1087
    text: So We sent against them the flood and the locusts and the vermin and the frogs and the blood - a succession of clear signs. But they were arrogant and became a guilty folk.
    translation: Pickthall
    original: فَأَرْسَلْنَا عَلَيْهِمُ ٱلطُّوفَانَ وَٱلْجَرَادَ وَٱلْقُمَّلَ وَٱلضَّفَادِعَ وَٱلدَّمَ ءَايَـٰتٍ مُّفَصَّلَـٰتٍ فَٱسْتَكْبَرُوا۟ وَكَانُوا۟ قَوْمًا مُّجْرِمِينَ
    arabicPlain: فأرسلنا عليهم الطوفان والجراد والقمل والضفادع والدم آيات مفصلات فاستكبروا وكانوا قوما مجرمين
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 137
    page: 166
