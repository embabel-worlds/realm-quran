    scripture: quran
    name: Quran 7:45
    chapter: 7
    verse: 45
    ordinal: 999
    text: Who debar (men) from the path of Allah and would have it crooked, and who are disbelievers in the Last Day.
    translation: Pickthall
    original: ٱلَّذِينَ يَصُدُّونَ عَن سَبِيلِ ٱللَّهِ وَيَبْغُونَهَا عِوَجًا وَهُم بِٱلْـَٔاخِرَةِ كَـٰفِرُونَ
    arabicPlain: الذين يصدون عن سبيل الله ويبغونها عوجا وهم بالآخرة كافرون
    surahName: Al-A'raaf
