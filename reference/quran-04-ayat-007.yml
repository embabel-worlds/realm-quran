  data:
    ref: '7:3'
    scripture: quran
    name: Quran 7:3
    chapter: 7
    verse: 3
    ordinal: 957
    text: '(Saying): Follow that which is sent down unto you from your Lord, and follow no protecting friends beside Him. Little do ye recollect!'
    translation: Pickthall
    original: ٱتَّبِعُوا۟ مَآ أُنزِلَ إِلَيْكُم مِّن رَّبِّكُمْ وَلَا تَتَّبِعُوا۟ مِن دُونِهِۦٓ أَوْلِيَآءَ ۗ قَلِيلًا مَّا تَذَكَّرُونَ
    arabicPlain: اتبعوا ما أنزل إليكم من ربكم ولا تتبعوا من دونه أولياء ۗ قليلا ما تذكرون
