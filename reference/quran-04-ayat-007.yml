  data:
    ref: 7:164
    scripture: quran
    name: Quran 7:164
    chapter: 7
    verse: 164
    ordinal: 1118
    text: 'And when a community among them said: Why preach ye to a folk whom Allah is about to destroy or punish with an awful doom, they said: In order to be free from guilt before your Lord, and that haply they may ward off (evil).'
    translation: Pickthall
    original: وَإِذْ قَالَتْ أُمَّةٌ مِّنْهُمْ لِمَ تَعِظُونَ قَوْمًا ۙ ٱللَّهُ مُهْلِكُهُمْ أَوْ مُعَذِّبُهُمْ عَذَابًا شَدِيدًا ۖ قَالُوا۟ مَعْذِرَةً إِلَىٰ رَبِّكُمْ وَلَعَلَّهُمْ يَتَّقُونَ
    arabicPlain: وإذ قالت أمة منهم لم تعظون قوما ۙ الله مهلكهم أو معذبهم عذابا شديدا ۖ قالوا معذرة إلى ربكم ولعلهم يتقون
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 142
    page: 172
