  data:
    ref: '7:28'
    scripture: quran
    name: Quran 7:28
    chapter: 7
    verse: 28
    ordinal: 982
    text: 'And when they do some lewdness they say: We found our fathers doing it and Allah hath enjoined it on us. Say: Allah, verily, enjoineth not lewdness. Tell ye concerning Allah that which ye know not?'
    translation: Pickthall
    original: وَإِذَا فَعَلُوا۟ فَـٰحِشَةً قَالُوا۟ وَجَدْنَا عَلَيْهَآ ءَابَآءَنَا وَٱللَّهُ أَمَرَنَا بِهَا ۗ قُلْ إِنَّ ٱللَّهَ لَا يَأْمُرُ بِٱلْفَحْشَآءِ ۖ أَتَقُولُونَ عَلَى ٱللَّهِ مَا لَا تَعْلَمُونَ
    arabicPlain: وإذا فعلوا فاحشة قالوا وجدنا عليها آباءنا والله أمرنا بها ۗ قل إن الله لا يأمر بالفحشاء ۖ أتقولون على الله ما لا تعلمون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 124
    page: 153
  relations:
  - predicate: IN
    to:
