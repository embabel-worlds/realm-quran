    translation: Pickthall
    original: وَلَقَدْ مَكَّنَّـٰكُمْ فِى ٱلْأَرْضِ وَجَعَلْنَا لَكُمْ فِيهَا مَعَـٰيِشَ ۗ قَلِيلًا مَّا تَشْكُرُونَ
    arabicPlain: ولقد مكناكم في الأرض وجعلنا لكم فيها معايش ۗ قليلا ما تشكرون
    surahName: Al-A'raaf
