    name: Quran 7:90
    chapter: 7
    verse: 90
    ordinal: 1044
    text: 'But the chieftains of his people, who were disbelieving, said: If ye follow Shu''eyb, then truly ye shall be the losers.'
    translation: Pickthall
    original: وَقَالَ ٱلْمَلَأُ ٱلَّذِينَ كَفَرُوا۟ مِن قَوْمِهِۦ لَئِنِ ٱتَّبَعْتُمْ شُعَيْبًا إِنَّكُمْ إِذًا لَّخَـٰسِرُونَ
    arabicPlain: وقال الملأ الذين كفروا من قومه لئن اتبعتم شعيبا إنكم إذا لخاسرون
