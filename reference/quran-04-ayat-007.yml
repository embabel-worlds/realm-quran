  data:
    ref: 7:161
    scripture: quran
    name: Quran 7:161
    chapter: 7
    verse: 161
    ordinal: 1115
    text: 'And when it was said unto them: Dwell in this township and eat therefrom whence ye will, and say "Repentance," and enter the gate prostrate; We shall forgive you your sins; We shall increase (reward) for the right-doers.'
    translation: Pickthall
    original: وَإِذْ قِيلَ لَهُمُ ٱسْكُنُوا۟ هَـٰذِهِ ٱلْقَرْيَةَ وَكُلُوا۟ مِنْهَا حَيْثُ شِئْتُمْ وَقُولُوا۟ حِطَّةٌ وَٱدْخُلُوا۟ ٱلْبَابَ سُجَّدًا نَّغْفِرْ لَكُمْ خَطِيٓـَٔـٰتِكُمْ ۚ سَنَزِيدُ ٱلْمُحْسِنِينَ
    arabicPlain: وإذ قيل لهم اسكنوا هذه القرية وكلوا منها حيث شئتم وقولوا حطة وادخلوا الباب سجدا نغفر لكم خطيئاتكم ۚ سنزيد المحسنين
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 141
