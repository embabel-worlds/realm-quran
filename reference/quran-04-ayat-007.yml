  data:
    ref: 7:166
    scripture: quran
    name: Quran 7:166
    chapter: 7
    verse: 166
    ordinal: 1120
    text: 'So when they took pride in that which they had been forbidden, We said unto them: Be ye apes despised and loathed!'
    translation: Pickthall
    original: فَلَمَّا عَتَوْا۟ عَن مَّا نُهُوا۟ عَنْهُ قُلْنَا لَهُمْ كُونُوا۟ قِرَدَةً خَـٰسِـِٔينَ
    arabicPlain: فلما عتوا عن ما نهوا عنه قلنا لهم كونوا قردة خاسئين
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 142
