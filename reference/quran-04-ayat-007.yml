    name: Quran 7:4
    chapter: 7
    verse: 4
    ordinal: 958
    text: How many a township have We destroyed! As a raid by night, or while they slept at noon, Our terror came unto them.
    translation: Pickthall
    original: وَكَم مِّن قَرْيَةٍ أَهْلَكْنَـٰهَا فَجَآءَهَا بَأْسُنَا بَيَـٰتًا أَوْ هُمْ قَآئِلُونَ
    arabicPlain: وكم من قرية أهلكناها فجاءها بأسنا بياتا أو هم قائلون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
