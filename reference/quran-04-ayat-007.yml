  data:
    ref: '7:24'
    scripture: quran
    name: Quran 7:24
    chapter: 7
    verse: 24
    ordinal: 978
    text: 'He said: Go down (from hence), one of you a foe unto the other. There will be for you on earth a habitation and provision for a while.'
    translation: Pickthall
    original: قَالَ ٱهْبِطُوا۟ بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ ۖ وَلَكُمْ فِى ٱلْأَرْضِ مُسْتَقَرٌّ وَمَتَـٰعٌ إِلَىٰ حِينٍ
    arabicPlain: قال اهبطوا بعضكم لبعض عدو ۖ ولكم في الأرض مستقر ومتاع إلى حين
    surahName: Al-A'raaf
    juz: 8
