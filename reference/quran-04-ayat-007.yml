  data:
    ref: 7:87
    scripture: quran
    name: Quran 7:87
    chapter: 7
    verse: 87
    ordinal: 1041
    text: And if there is a party of you which believeth in that wherewith I have been sent, and there is a party which believeth not, then have patience until Allah judge between us. He is the Best of all who deal in judgment.
    translation: Pickthall
    original: وَإِن كَانَ طَآئِفَةٌ مِّنكُمْ ءَامَنُوا۟ بِٱلَّذِىٓ أُرْسِلْتُ بِهِۦ وَطَآئِفَةٌ لَّمْ يُؤْمِنُوا۟ فَٱصْبِرُوا۟ حَتَّىٰ يَحْكُمَ ٱللَّهُ بَيْنَنَا ۚ وَهُوَ خَيْرُ ٱلْحَـٰكِمِينَ
    arabicPlain: وإن كان طائفة منكم آمنوا بالذي أرسلت به وطائفة لم يؤمنوا فاصبروا حتى يحكم الله بيننا ۚ وهو خير الحاكمين
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 132
