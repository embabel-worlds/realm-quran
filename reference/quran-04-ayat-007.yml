  data:
    ref: 7:195
    scripture: quran
    name: Quran 7:195
    chapter: 7
    verse: 195
    ordinal: 1149
    text: 'Have they feet wherewith they walk, or have they hands wherewith they hold, or have they eyes wherewith they see, or have they ears wherewith they hear? Say: Call upon your (so-called) partners (of Allah), and then contrive against me, spare me not!'
    translation: Pickthall
    original: أَلَهُمْ أَرْجُلٌ يَمْشُونَ بِهَآ ۖ أَمْ لَهُمْ أَيْدٍ يَبْطِشُونَ بِهَآ ۖ أَمْ لَهُمْ أَعْيُنٌ يُبْصِرُونَ بِهَآ ۖ أَمْ لَهُمْ ءَاذَانٌ يَسْمَعُونَ بِهَا ۗ قُلِ ٱدْعُوا۟ شُرَكَآءَكُمْ ثُمَّ كِيدُونِ فَلَا تُنظِرُونِ
    arabicPlain: ألهم أرجل يمشون بها ۖ أم لهم أيد يبطشون بها ۖ أم لهم أعين يبصرون بها ۖ أم لهم آذان يسمعون بها ۗ قل ادعوا شركاءكم ثم كيدون فلا تنظرون
    surahName: Al-A'raaf
