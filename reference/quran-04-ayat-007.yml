  data:
    ref: 7:86
    scripture: quran
    name: Quran 7:86
    chapter: 7
    verse: 86
    ordinal: 1040
    text: Lurk not on every road to threaten (wayfarers), and to turn away from Allah's path him who believeth in Him, and to seek to make it crooked. And remember, when ye were but few, how He did multiply you. And see the nature of the consequence for the corrupters!
    translation: Pickthall
    original: وَلَا تَقْعُدُوا۟ بِكُلِّ صِرَٰطٍ تُوعِدُونَ وَتَصُدُّونَ عَن سَبِيلِ ٱللَّهِ مَنْ ءَامَنَ بِهِۦ وَتَبْغُونَهَا عِوَجًا ۚ وَٱذْكُرُوٓا۟ إِذْ كُنتُمْ قَلِيلًا فَكَثَّرَكُمْ ۖ وَٱنظُرُوا۟ كَيْفَ كَانَ عَـٰقِبَةُ ٱلْمُفْسِدِينَ
    arabicPlain: ولا تقعدوا بكل صراط توعدون وتصدون عن سبيل الله من آمن به وتبغونها عوجا ۚ واذكروا إذ كنتم قليلا فكثركم ۖ وانظروا كيف كان عاقبة المفسدين
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 132
