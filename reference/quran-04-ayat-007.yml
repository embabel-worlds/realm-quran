  data:
    ref: '7:25'
    scripture: quran
    name: Quran 7:25
    chapter: 7
    verse: 25
    ordinal: 979
    text: 'He said: There shall ye live, and there shall ye die, and thence shall ye be brought forth.'
    translation: Pickthall
    original: قَالَ فِيهَا تَحْيَوْنَ وَفِيهَا تَمُوتُونَ وَمِنْهَا تُخْرَجُونَ
    arabicPlain: قال فيها تحيون وفيها تموتون ومنها تخرجون
