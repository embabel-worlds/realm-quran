    scripture: quran
    name: Quran 7:64
    chapter: 7
    verse: 64
    ordinal: 1018
    text: But they denied him, so We saved him and those with him in the ship, and We drowned those who denied Our tokens. Lo! they were blind folk.
    translation: Pickthall
    original: فَكَذَّبُوهُ فَأَنجَيْنَـٰهُ وَٱلَّذِينَ مَعَهُۥ فِى ٱلْفُلْكِ وَأَغْرَقْنَا ٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَـٰتِنَآ ۚ إِنَّهُمْ كَانُوا۟ قَوْمًا عَمِينَ
    arabicPlain: فكذبوه فأنجيناه والذين معه في الفلك وأغرقنا الذين كذبوا بآياتنا ۚ إنهم كانوا قوما عمين
