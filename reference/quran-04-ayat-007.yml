    scripture: quran
    name: Quran 7:84
    chapter: 7
    verse: 84
    ordinal: 1038
    text: And We rained a rain upon them. See now the nature of the consequence of evil-doers!
    translation: Pickthall
    original: وَأَمْطَرْنَا عَلَيْهِم مَّطَرًا ۖ فَٱنظُرْ كَيْفَ كَانَ عَـٰقِبَةُ ٱلْمُجْرِمِينَ
    arabicPlain: وأمطرنا عليهم مطرا ۖ فانظر كيف كان عاقبة المجرمين
