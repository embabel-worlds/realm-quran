    scripture: quran
    name: Quran 7:200
    chapter: 7
    verse: 200
    ordinal: 1154
    text: And if a slander from the devil wound thee, then seek refuge in Allah. Lo! He is Hearer, Knower.
    translation: Pickthall
    original: وَإِمَّا يَنزَغَنَّكَ مِنَ ٱلشَّيْطَـٰنِ نَزْغٌ فَٱسْتَعِذْ بِٱللَّهِ ۚ إِنَّهُۥ سَمِيعٌ عَلِيمٌ
