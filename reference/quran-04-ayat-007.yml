  data:
    ref: 7:72
    scripture: quran
    name: Quran 7:72
    chapter: 7
    verse: 72
    ordinal: 1026
    text: And We saved him and those with him by a mercy from Us, and We cut the root of those who denied Our revelations and were not believers.
    translation: Pickthall
    original: فَأَنجَيْنَـٰهُ وَٱلَّذِينَ مَعَهُۥ بِرَحْمَةٍ مِّنَّا وَقَطَعْنَا دَابِرَ ٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَـٰتِنَا ۖ وَمَا كَانُوا۟ مُؤْمِنِينَ
    arabicPlain: فأنجيناه والذين معه برحمة منا وقطعنا دابر الذين كذبوا بآياتنا ۖ وما كانوا مؤمنين
    surahName: Al-A'raaf
    juz: 8
