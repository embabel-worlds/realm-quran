  data:
    ref: 7:97
    scripture: quran
    name: Quran 7:97
    chapter: 7
    verse: 97
    ordinal: 1051
    text: Are the people of the townships then secure from the coming of Our wrath upon them as a night-raid while they sleep?
    translation: Pickthall
    original: أَفَأَمِنَ أَهْلُ ٱلْقُرَىٰٓ أَن يَأْتِيَهُم بَأْسُنَا بَيَـٰتًا وَهُمْ نَآئِمُونَ
    arabicPlain: أفأمن أهل القرى أن يأتيهم بأسنا بياتا وهم نائمون
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 133
