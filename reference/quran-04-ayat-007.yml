    name: Quran 7:80
    chapter: 7
    verse: 80
    ordinal: 1034
    text: 'And Lot! (Remember) when he said unto his folk: Will ye commit abomination such as no creature ever did before you?'
    translation: Pickthall
    original: وَلُوطًا إِذْ قَالَ لِقَوْمِهِۦٓ أَتَأْتُونَ ٱلْفَـٰحِشَةَ مَا سَبَقَكُم بِهَا مِنْ أَحَدٍ مِّنَ ٱلْعَـٰلَمِينَ
    arabicPlain: ولوطا إذ قال لقومه أتأتون الفاحشة ما سبقكم بها من أحد من العالمين
