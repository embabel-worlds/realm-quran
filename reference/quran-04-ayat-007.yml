  data:
    ref: '7:43'
    scripture: quran
    name: Quran 7:43
    chapter: 7
    verse: 43
    ordinal: 997
    text: 'And We remove whatever rancour may be in their hearts. Rivers flow beneath them. And they say: The praise to Allah, Who hath guided us to this. We could not truly have been led aright if Allah had not guided us. Verily the messengers of our Lord did bring the Truth. And it is cried unto them: This is the Garden. Ye inherit it for what ye used to do.'
    translation: Pickthall
    original: وَنَزَعْنَا مَا فِى صُدُورِهِم مِّنْ غِلٍّ تَجْرِى مِن تَحْتِهِمُ ٱلْأَنْهَـٰرُ ۖ وَقَالُوا۟ ٱلْحَمْدُ لِلَّهِ ٱلَّذِى هَدَىٰنَا لِهَـٰذَا وَمَا كُنَّا لِنَهْتَدِىَ لَوْلَآ أَنْ هَدَىٰنَا ٱللَّهُ ۖ لَقَدْ جَآءَتْ رُسُلُ رَبِّنَا بِٱلْحَقِّ ۖ وَنُودُوٓا۟ أَن تِلْكُمُ ٱلْجَنَّةُ أُورِثْتُمُوهَا بِمَا كُنتُمْ تَعْمَلُونَ
    arabicPlain: ونزعنا ما في صدورهم من غل تجري من تحتهم الأنهار ۖ وقالوا الحمد لله الذي هدانا لهذا وما كنا لنهتدي لولا أن هدانا الله ۖ لقد جاءت رسل ربنا بالحق ۖ ونودوا أن تلكم الجنة أورثتموها بما كنتم تعملون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 126
    page: 155
