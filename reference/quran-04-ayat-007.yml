  data:
    ref: 7:140
    scripture: quran
    name: Quran 7:140
    chapter: 7
    verse: 140
    ordinal: 1094
    text: 'He said: Shall I seek for you a god other than Allah when He hath favoured you above (all) creatures?'
    translation: Pickthall
    original: قَالَ أَغَيْرَ ٱللَّهِ أَبْغِيكُمْ إِلَـٰهًا وَهُوَ فَضَّلَكُمْ عَلَى ٱلْعَـٰلَمِينَ
    arabicPlain: قال أغير الله أبغيكم إلها وهو فضلكم على العالمين
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 137
    page: 167
  relations:
  - predicate: IN
    to:
