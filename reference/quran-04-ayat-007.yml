  data:
    ref: '7:30'
    scripture: quran
    name: Quran 7:30
    chapter: 7
    verse: 30
    ordinal: 984
    text: A party hath He led aright, while error hath just hold over (another) party, for lo! they choose the devils for protecting supporters instead of Allah and deem that they are rightly guided.
    translation: Pickthall
    original: فَرِيقًا هَدَىٰ وَفَرِيقًا حَقَّ عَلَيْهِمُ ٱلضَّلَـٰلَةُ ۗ إِنَّهُمُ ٱتَّخَذُوا۟ ٱلشَّيَـٰطِينَ أَوْلِيَآءَ مِن دُونِ ٱللَّهِ وَيَحْسَبُونَ أَنَّهُم مُّهْتَدُونَ
    arabicPlain: فريقا هدى وفريقا حق عليهم الضلالة ۗ إنهم اتخذوا الشياطين أولياء من دون الله ويحسبون أنهم مهتدون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 124
    page: 153
