    scripture: quran
    name: Quran 7:98
    chapter: 7
    verse: 98
    ordinal: 1052
    text: Or are the people of the townships then secure from the coming of Our wrath upon them in the daytime while they play?
    translation: Pickthall
    original: أَوَأَمِنَ أَهْلُ ٱلْقُرَىٰٓ أَن يَأْتِيَهُم بَأْسُنَا ضُحًى وَهُمْ يَلْعَبُونَ
    arabicPlain: أوأمن أهل القرى أن يأتيهم بأسنا ضحى وهم يلعبون
