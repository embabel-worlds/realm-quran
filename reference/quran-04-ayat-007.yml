    scripture: quran
    name: Quran 7:18
    chapter: 7
    verse: 18
    ordinal: 972
    text: 'He said: Go forth from hence, degraded, banished. As for such of them as follow thee, surely I will fill hell with all of you.'
    translation: Pickthall
    original: قَالَ ٱخْرُجْ مِنْهَا مَذْءُومًا مَّدْحُورًا ۖ لَّمَن تَبِعَكَ مِنْهُمْ لَأَمْلَأَنَّ جَهَنَّمَ مِنكُمْ أَجْمَعِينَ
    arabicPlain: قال اخرج منها مذءوما مدحورا ۖ لمن تبعك منهم لأملأن جهنم منكم أجمعين
    surahName: Al-A'raaf
