  data:
    ref: 7:100
    scripture: quran
    name: Quran 7:100
    chapter: 7
    verse: 100
    ordinal: 1054
    text: Is it not an indication to those who inherit the land after its people (who thus reaped the consequence of evil-doing) that, if We will, We can smite them for their sins and print upon their hearts so that they hear not?
    translation: Pickthall
    original: أَوَلَمْ يَهْدِ لِلَّذِينَ يَرِثُونَ ٱلْأَرْضَ مِنۢ بَعْدِ أَهْلِهَآ أَن لَّوْ نَشَآءُ أَصَبْنَـٰهُم بِذُنُوبِهِمْ ۚ وَنَطْبَعُ عَلَىٰ قُلُوبِهِمْ فَهُمْ لَا يَسْمَعُونَ
    arabicPlain: أولم يهد للذين يرثون الأرض من بعد أهلها أن لو نشاء أصبناهم بذنوبهم ۚ ونطبع على قلوبهم فهم لا يسمعون
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 134
    page: 163
  relations:
  - predicate: IN
    to:
      type: Surah
