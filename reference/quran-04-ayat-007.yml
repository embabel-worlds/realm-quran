  data:
    ref: 7:187
    scripture: quran
    name: Quran 7:187
    chapter: 7
    verse: 187
    ordinal: 1141
    text: 'They ask thee of the (destined) Hour, when will it come to port. Say: Knowledge thereof is with my Lord only. He alone will manifest it at its proper time. It is heavy in the heavens and the earth. It cometh not to you save unawares. They question thee as if thou couldst be well informed thereof. Say: Knowledge thereof is with Allah only, but most of mankind know not.'
    translation: Pickthall
    original: يَسْـَٔلُونَكَ عَنِ ٱلسَّاعَةِ أَيَّانَ مُرْسَىٰهَا ۖ قُلْ إِنَّمَا عِلْمُهَا عِندَ رَبِّى ۖ لَا يُجَلِّيهَا لِوَقْتِهَآ إِلَّا هُوَ ۚ ثَقُلَتْ فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۚ لَا تَأْتِيكُمْ إِلَّا بَغْتَةً ۗ يَسْـَٔلُونَكَ كَأَنَّكَ حَفِىٌّ عَنْهَا ۖ قُلْ إِنَّمَا عِلْمُهَا عِندَ ٱللَّهِ وَلَـٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يَعْلَمُونَ
    arabicPlain: يسألونك عن الساعة أيان مرساها ۖ قل إنما علمها عند ربي ۖ لا يجليها لوقتها إلا هو ۚ ثقلت في السماوات والأرض ۚ لا تأتيكم إلا بغتة ۗ يسألونك كأنك حفي عنها ۖ قل إنما علمها عند الله ولكن أكثر الناس لا يعلمون
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 144
    page: 174
