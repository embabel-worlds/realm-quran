  data:
    ref: '7:9'
    scripture: quran
    name: Quran 7:9
    chapter: 7
    verse: 9
    ordinal: 963
    text: 'And as for those whose scale is light: those are they who lose their souls because they used to wrong Our revelations.'
    translation: Pickthall
    original: وَمَنْ خَفَّتْ مَوَٰزِينُهُۥ فَأُو۟لَـٰٓئِكَ ٱلَّذِينَ خَسِرُوٓا۟ أَنفُسَهُم بِمَا كَانُوا۟ بِـَٔايَـٰتِنَا يَظْلِمُونَ
    arabicPlain: ومن خفت موازينه فأولئك الذين خسروا أنفسهم بما كانوا بآياتنا يظلمون
