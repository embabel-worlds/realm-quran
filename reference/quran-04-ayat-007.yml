    text: Lo! ye come with lust unto men instead of women. Nay, but ye are wanton folk.
    translation: Pickthall
    original: إِنَّكُمْ لَتَأْتُونَ ٱلرِّجَالَ شَهْوَةً مِّن دُونِ ٱلنِّسَآءِ ۚ بَلْ أَنتُمْ قَوْمٌ مُّسْرِفُونَ
