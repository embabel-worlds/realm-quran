  data:
    ref: 7:139
    scripture: quran
    name: Quran 7:139
    chapter: 7
    verse: 139
    ordinal: 1093
    text: Lo! as for these, their way will be destroyed and all that they are doing is in vain.
    translation: Pickthall
    original: إِنَّ هَـٰٓؤُلَآءِ مُتَبَّرٌ مَّا هُمْ فِيهِ وَبَـٰطِلٌ مَّا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: إن هؤلاء متبر ما هم فيه وباطل ما كانوا يعملون
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 137
    page: 167
  relations:
