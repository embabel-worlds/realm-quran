    arabicPlain: تلك القرى نقص عليك من أنبائها ۚ ولقد جاءتهم رسلهم بالبينات فما كانوا ليؤمنوا بما كذبوا من قبل ۚ كذلك يطبع الله على قلوب الكافرين
    surahName: Al-A'raaf
