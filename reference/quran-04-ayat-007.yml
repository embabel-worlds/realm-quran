    scripture: quran
    name: Quran 7:21
    chapter: 7
    verse: 21
    ordinal: 975
    text: 'And he swore unto them (saying): Lo! I am a sincere adviser unto you.'
    translation: Pickthall
    original: وَقَاسَمَهُمَآ إِنِّى لَكُمَا لَمِنَ ٱلنَّـٰصِحِينَ
    arabicPlain: وقاسمهما إني لكما لمن الناصحين
    surahName: Al-A'raaf
    juz: 8
