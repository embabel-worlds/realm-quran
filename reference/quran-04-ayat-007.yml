  data:
    ref: '7:47'
    scripture: quran
    name: Quran 7:47
    chapter: 7
    verse: 47
    ordinal: 1001
    text: 'And when their eyes are turned toward the dwellers of the Fire, they say: Our Lord! Place us not with the wrong-doing folk.'
    translation: Pickthall
    original: ۞ وَإِذَا صُرِفَتْ أَبْصَـٰرُهُمْ تِلْقَآءَ أَصْحَـٰبِ ٱلنَّارِ قَالُوا۟ رَبَّنَا لَا تَجْعَلْنَا مَعَ ٱلْقَوْمِ ٱلظَّـٰلِمِينَ
    arabicPlain: ۞ وإذا صرفت أبصارهم تلقاء أصحاب النار قالوا ربنا لا تجعلنا مع القوم الظالمين
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 126
