  data:
    ref: 7:154
    scripture: quran
    name: Quran 7:154
    chapter: 7
    verse: 154
    ordinal: 1108
    text: Then, when the anger of Moses abated, he took up the tablets, and in their inscription there was guidance and mercy for all those who fear their Lord.
    translation: Pickthall
    original: وَلَمَّا سَكَتَ عَن مُّوسَى ٱلْغَضَبُ أَخَذَ ٱلْأَلْوَاحَ ۖ وَفِى نُسْخَتِهَا هُدًى وَرَحْمَةٌ لِّلَّذِينَ هُمْ لِرَبِّهِمْ يَرْهَبُونَ
    arabicPlain: ولما سكت عن موسى الغضب أخذ الألواح ۖ وفي نسختها هدى ورحمة للذين هم لربهم يرهبون
    surahName: Al-A'raaf
    juz: 9
