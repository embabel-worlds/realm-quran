  data:
    ref: 7:94
    scripture: quran
    name: Quran 7:94
    chapter: 7
    verse: 94
    ordinal: 1048
    text: And We sent no prophet unto any township but We did afflict its folk with tribulation and adversity that haply they might grow humble.
    translation: Pickthall
    original: وَمَآ أَرْسَلْنَا فِى قَرْيَةٍ مِّن نَّبِىٍّ إِلَّآ أَخَذْنَآ أَهْلَهَا بِٱلْبَأْسَآءِ وَٱلضَّرَّآءِ لَعَلَّهُمْ يَضَّرَّعُونَ
    arabicPlain: وما أرسلنا في قرية من نبي إلا أخذنا أهلها بالبأساء والضراء لعلهم يضرعون
    surahName: Al-A'raaf
    juz: 9
