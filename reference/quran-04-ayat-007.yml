    chapter: 7
    verse: 17
    ordinal: 971
    text: Then I shall come upon them from before them and from behind them and from their right hands and from their left hands, and Thou wilt not find most of them beholden (unto Thee).
    translation: Pickthall
    original: ثُمَّ لَـَٔاتِيَنَّهُم مِّنۢ بَيْنِ أَيْدِيهِمْ وَمِنْ خَلْفِهِمْ وَعَنْ أَيْمَـٰنِهِمْ وَعَن شَمَآئِلِهِمْ ۖ وَلَا تَجِدُ أَكْثَرَهُمْ شَـٰكِرِينَ
    arabicPlain: ثم لآتينهم من بين أيديهم ومن خلفهم وعن أيمانهم وعن شمائلهم ۖ ولا تجد أكثرهم شاكرين
    surahName: Al-A'raaf
