  data:
    ref: 7:130
    scripture: quran
    name: Quran 7:130
    chapter: 7
    verse: 130
    ordinal: 1084
    text: And we straitened Pharaoh's folk with famine and dearth of fruits, that peradventure they might heed.
    translation: Pickthall
    original: وَلَقَدْ أَخَذْنَآ ءَالَ فِرْعَوْنَ بِٱلسِّنِينَ وَنَقْصٍ مِّنَ ٱلثَّمَرَٰتِ لَعَلَّهُمْ يَذَّكَّرُونَ
    arabicPlain: ولقد أخذنا آل فرعون بالسنين ونقص من الثمرات لعلهم يذكرون
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 137
    page: 165
