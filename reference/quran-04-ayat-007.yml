  data:
    ref: 7:131
    scripture: quran
    name: Quran 7:131
    chapter: 7
    verse: 131
    ordinal: 1085
    text: 'But whenever good befell them, they said: This is ours; and whenever evil smote them they ascribed it to the evil auspices of Moses and those with him. Surely their evil auspice was only with Allah. But most of them knew not.'
    translation: Pickthall
    original: فَإِذَا جَآءَتْهُمُ ٱلْحَسَنَةُ قَالُوا۟ لَنَا هَـٰذِهِۦ ۖ وَإِن تُصِبْهُمْ سَيِّئَةٌ يَطَّيَّرُوا۟ بِمُوسَىٰ وَمَن مَّعَهُۥٓ ۗ أَلَآ إِنَّمَا طَـٰٓئِرُهُمْ عِندَ ٱللَّهِ وَلَـٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ
    arabicPlain: فإذا جاءتهم الحسنة قالوا لنا هذه ۖ وإن تصبهم سيئة يطيروا بموسى ومن معه ۗ ألا إنما طائرهم عند الله ولكن أكثرهم لا يعلمون
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 137
    page: 166
