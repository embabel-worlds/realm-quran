  data:
    ref: 7:126
    scripture: quran
    name: Quran 7:126
    chapter: 7
    verse: 126
    ordinal: 1080
    text: Thou takest vengeance on us only forasmuch as we believed the tokens of our Lord when they came unto us. Our Lord! Vouchsafe unto us steadfastness and make us die as men who have surrendered (unto Thee).
    translation: Pickthall
    original: وَمَا تَنقِمُ مِنَّآ إِلَّآ أَنْ ءَامَنَّا بِـَٔايَـٰتِ رَبِّنَا لَمَّا جَآءَتْنَا ۚ رَبَّنَآ أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ
    arabicPlain: وما تنقم منا إلا أن آمنا بآيات ربنا لما جاءتنا ۚ ربنا أفرغ علينا صبرا وتوفنا مسلمين
    surahName: Al-A'raaf
