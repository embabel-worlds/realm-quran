  data:
    ref: 7:190
    scripture: quran
    name: Quran 7:190
    chapter: 7
    verse: 190
    ordinal: 1144
    text: But when He gave unto them aright, they ascribed unto Him partners in respect of that which He had given them. High is He Exalted above all that they associate (with Him).
    translation: Pickthall
    original: فَلَمَّآ ءَاتَىٰهُمَا صَـٰلِحًا جَعَلَا لَهُۥ شُرَكَآءَ فِيمَآ ءَاتَىٰهُمَا ۚ فَتَعَـٰلَى ٱللَّهُ عَمَّا يُشْرِكُونَ
    arabicPlain: فلما آتاهما صالحا جعلا له شركاء فيما آتاهما ۚ فتعالى الله عما يشركون
