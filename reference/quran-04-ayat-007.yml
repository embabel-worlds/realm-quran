  data:
    ref: 7:128
    scripture: quran
    name: Quran 7:128
    chapter: 7
    verse: 128
    ordinal: 1082
    text: 'And Moses said unto his people: Seek help in Allah and endure. Lo! the earth is Allah''s. He giveth it for an inheritance to whom He will. And lo! the sequel is for those who keep their duty (unto Him).'
    translation: Pickthall
    original: قَالَ مُوسَىٰ لِقَوْمِهِ ٱسْتَعِينُوا۟ بِٱللَّهِ وَٱصْبِرُوٓا۟ ۖ إِنَّ ٱلْأَرْضَ لِلَّهِ يُورِثُهَا مَن يَشَآءُ مِنْ عِبَادِهِۦ ۖ وَٱلْعَـٰقِبَةُ لِلْمُتَّقِينَ
    arabicPlain: قال موسى لقومه استعينوا بالله واصبروا ۖ إن الأرض لله يورثها من يشاء من عباده ۖ والعاقبة للمتقين
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 136
    page: 165
