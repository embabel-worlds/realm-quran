    name: Quran 7:79
    chapter: 7
    verse: 79
    ordinal: 1033
    text: 'And (Salih) turned from them and said: O my people! I delivered my Lord''s message unto you and gave you good advice, but ye love not good advisers.'
    translation: Pickthall
    original: فَتَوَلَّىٰ عَنْهُمْ وَقَالَ يَـٰقَوْمِ لَقَدْ أَبْلَغْتُكُمْ رِسَالَةَ رَبِّى وَنَصَحْتُ لَكُمْ وَلَـٰكِن لَّا تُحِبُّونَ ٱلنَّـٰصِحِينَ
    arabicPlain: فتولى عنهم وقال يا قوم لقد أبلغتكم رسالة ربي ونصحت لكم ولكن لا تحبون الناصحين
