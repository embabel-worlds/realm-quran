    name: Quran 7:91
    chapter: 7
    verse: 91
    ordinal: 1045
    text: So the earthquake seized them and morning found them prostrate in their dwelling-place.
    translation: Pickthall
    original: فَأَخَذَتْهُمُ ٱلرَّجْفَةُ فَأَصْبَحُوا۟ فِى دَارِهِمْ جَـٰثِمِينَ
    arabicPlain: فأخذتهم الرجفة فأصبحوا في دارهم جاثمين
