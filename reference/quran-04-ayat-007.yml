  data:
    ref: 7:168
    scripture: quran
    name: Quran 7:168
    chapter: 7
    verse: 168
    ordinal: 1122
    text: And We have sundered them in the earth as (separate) nations. Some of them are righteous, and some far from that. And We have tried them with good things and evil things that haply they might return.
    translation: Pickthall
    original: وَقَطَّعْنَـٰهُمْ فِى ٱلْأَرْضِ أُمَمًا ۖ مِّنْهُمُ ٱلصَّـٰلِحُونَ وَمِنْهُمْ دُونَ ذَٰلِكَ ۖ وَبَلَوْنَـٰهُم بِٱلْحَسَنَـٰتِ وَٱلسَّيِّـَٔاتِ لَعَلَّهُمْ يَرْجِعُونَ
    arabicPlain: وقطعناهم في الأرض أمما ۖ منهم الصالحون ومنهم دون ذلك ۖ وبلوناهم بالحسنات والسيئات لعلهم يرجعون
    surahName: Al-A'raaf
