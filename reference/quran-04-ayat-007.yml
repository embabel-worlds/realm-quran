  data:
    ref: '7:8'
    scripture: quran
    name: Quran 7:8
    chapter: 7
    verse: 8
    ordinal: 962
    text: The weighing on that day is the true (weighing). As for those whose scale is heavy, they are the successful.
    translation: Pickthall
    original: وَٱلْوَزْنُ يَوْمَئِذٍ ٱلْحَقُّ ۚ فَمَن ثَقُلَتْ مَوَٰزِينُهُۥ فَأُو۟لَـٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ
    arabicPlain: والوزن يومئذ الحق ۚ فمن ثقلت موازينه فأولئك هم المفلحون
