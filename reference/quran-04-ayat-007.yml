    scripture: quran
    name: Quran 7:82
    chapter: 7
    verse: 82
    ordinal: 1036
    text: 'And the answer of his people was only that they said (one to another): Turn them out of your township. They are folk, forsooth, who keep pure.'
    translation: Pickthall
    original: وَمَا كَانَ جَوَابَ قَوْمِهِۦٓ إِلَّآ أَن قَالُوٓا۟ أَخْرِجُوهُم مِّن قَرْيَتِكُمْ ۖ إِنَّهُمْ أُنَاسٌ يَتَطَهَّرُونَ
    arabicPlain: وما كان جواب قومه إلا أن قالوا أخرجوهم من قريتكم ۖ إنهم أناس يتطهرون
