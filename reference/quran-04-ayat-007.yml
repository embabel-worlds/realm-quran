    chapter: 7
    verse: 76
    ordinal: 1030
    text: 'Those who were scornful said: Lo! in that which ye believe we are disbelievers.'
    translation: Pickthall
    original: قَالَ ٱلَّذِينَ ٱسْتَكْبَرُوٓا۟ إِنَّا بِٱلَّذِىٓ ءَامَنتُم بِهِۦ كَـٰفِرُونَ
    arabicPlain: قال الذين استكبروا إنا بالذي آمنتم به كافرون
