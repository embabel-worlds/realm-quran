    scripture: quran
    name: Quran 7:58
    chapter: 7
    verse: 58
    ordinal: 1012
    text: As for the good land, its vegetation cometh forth by permission of its Lord; while as for that which is bad, only the useless cometh forth (from it). Thus do We recount the tokens for people who give thanks.
    translation: Pickthall
    original: وَٱلْبَلَدُ ٱلطَّيِّبُ يَخْرُجُ نَبَاتُهُۥ بِإِذْنِ رَبِّهِۦ ۖ وَٱلَّذِى خَبُثَ لَا يَخْرُجُ إِلَّا نَكِدًا ۚ كَذَٰلِكَ نُصَرِّفُ ٱلْـَٔايَـٰتِ لِقَوْمٍ يَشْكُرُونَ
    arabicPlain: والبلد الطيب يخرج نباته بإذن ربه ۖ والذي خبث لا يخرج إلا نكدا ۚ كذلك نصرف الآيات لقوم يشكرون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
