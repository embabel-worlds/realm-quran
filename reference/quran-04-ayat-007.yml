  data:
    ref: 7:203
    scripture: quran
    name: Quran 7:203
    chapter: 7
    verse: 203
    ordinal: 1157
    text: 'And when thou bringest not a verse for them they say: Why hast thou not chosen it? Say: I follow only that which is inspired in me from my Lord. This (Qur''an) is insight from your Lord, and a guidance and a mercy for a people that believe.'
    translation: Pickthall
    original: وَإِذَا لَمْ تَأْتِهِم بِـَٔايَةٍ قَالُوا۟ لَوْلَا ٱجْتَبَيْتَهَا ۚ قُلْ إِنَّمَآ أَتَّبِعُ مَا يُوحَىٰٓ إِلَىَّ مِن رَّبِّى ۚ هَـٰذَا بَصَآئِرُ مِن رَّبِّكُمْ وَهُدًى وَرَحْمَةٌ لِّقَوْمٍ يُؤْمِنُونَ
    arabicPlain: وإذا لم تأتهم بآية قالوا لولا اجتبيتها ۚ قل إنما أتبع ما يوحى إلي من ربي ۚ هذا بصائر من ربكم وهدى ورحمة لقوم يؤمنون
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 145
    page: 176
