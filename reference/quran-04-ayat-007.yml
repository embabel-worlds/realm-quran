  data:
    ref: '7:31'
    scripture: quran
    name: Quran 7:31
    chapter: 7
    verse: 31
    ordinal: 985
    text: O Children of Adam! Look to your adornment at every place of worship, and eat and drink, but be not prodigal. Lo! He loveth not the prodigals.
    translation: Pickthall
    original: ۞ يَـٰبَنِىٓ ءَادَمَ خُذُوا۟ زِينَتَكُمْ عِندَ كُلِّ مَسْجِدٍ وَكُلُوا۟ وَٱشْرَبُوا۟ وَلَا تُسْرِفُوٓا۟ ۚ إِنَّهُۥ لَا يُحِبُّ ٱلْمُسْرِفِينَ
    arabicPlain: ۞ يا بني آدم خذوا زينتكم عند كل مسجد وكلوا واشربوا ولا تسرفوا ۚ إنه لا يحب المسرفين
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 124
    page: 154
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '7'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-8
- type: Ayah
  data:
    ref: '7:32'
    scripture: quran
    name: Quran 7:32
    chapter: 7
    verse: 32
    ordinal: 986
    text: 'Say: Who hath forbidden the adornment of Allah which He hath brought forth for His bondmen, and the good things of His providing? Say: Such, on the Day of Resurrection, will be only for those who believed during the life of the world. Thus do we detail Our revelations for people who have knowledge.'
    translation: Pickthall
    original: قُلْ مَنْ حَرَّمَ زِينَةَ ٱللَّهِ ٱلَّتِىٓ أَخْرَجَ لِعِبَادِهِۦ وَٱلطَّيِّبَـٰتِ مِنَ ٱلرِّزْقِ ۚ قُلْ هِىَ لِلَّذِينَ ءَامَنُوا۟ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا خَالِصَةً يَوْمَ ٱلْقِيَـٰمَةِ ۗ كَذَٰلِكَ نُفَصِّلُ ٱلْـَٔايَـٰتِ لِقَوْمٍ يَعْلَمُونَ
    arabicPlain: قل من حرم زينة الله التي أخرج لعباده والطيبات من الرزق ۚ قل هي للذين آمنوا في الحياة الدنيا خالصة يوم القيامة ۗ كذلك نفصل الآيات لقوم يعلمون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 125
    page: 154
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '7'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-8
- type: Ayah
  data:
    ref: '7:33'
    scripture: quran
    name: Quran 7:33
    chapter: 7
    verse: 33
    ordinal: 987
    text: 'Say: My Lord forbiddeth only indecencies, such of them as are apparent and such as are within, and sin and wrongful oppression, and that ye associate with Allah that for which no warrant hath been revealed, and that ye tell concerning Allah that which ye know not.'
    translation: Pickthall
    original: قُلْ إِنَّمَا حَرَّمَ رَبِّىَ ٱلْفَوَٰحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ وَٱلْإِثْمَ وَٱلْبَغْىَ بِغَيْرِ ٱلْحَقِّ وَأَن تُشْرِكُوا۟ بِٱللَّهِ مَا لَمْ يُنَزِّلْ بِهِۦ سُلْطَـٰنًا وَأَن تَقُولُوا۟ عَلَى ٱللَّهِ مَا لَا تَعْلَمُونَ
    arabicPlain: قل إنما حرم ربي الفواحش ما ظهر منها وما بطن والإثم والبغي بغير الحق وأن تشركوا بالله ما لم ينزل به سلطانا وأن تقولوا على الله ما لا تعلمون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 125
    page: 154
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '7'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-8
- type: Ayah
  data:
    ref: '7:34'
    scripture: quran
    name: Quran 7:34
    chapter: 7
    verse: 34
    ordinal: 988
    text: And every nation hath its term, and when its term cometh, they cannot put it off an hour nor yet advance (it).
    translation: Pickthall
    original: وَلِكُلِّ أُمَّةٍ أَجَلٌ ۖ فَإِذَا جَآءَ أَجَلُهُمْ لَا يَسْتَأْخِرُونَ سَاعَةً ۖ وَلَا يَسْتَقْدِمُونَ
    arabicPlain: ولكل أمة أجل ۖ فإذا جاء أجلهم لا يستأخرون ساعة ۖ ولا يستقدمون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 125
    page: 154
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '7'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-8
- type: Ayah
  data:
    ref: '7:35'
    scripture: quran
    name: Quran 7:35
    chapter: 7
    verse: 35
    ordinal: 989
    text: O Children of Adam! When messengers of your own come unto you who narrate unto you My revelations, then whosoever refraineth from evil and amendeth - there shall no fear come upon them neither shall they grieve.
    translation: Pickthall
    original: يَـٰبَنِىٓ ءَادَمَ إِمَّا يَأْتِيَنَّكُمْ رُسُلٌ مِّنكُمْ يَقُصُّونَ عَلَيْكُمْ ءَايَـٰتِى ۙ فَمَنِ ٱتَّقَىٰ وَأَصْلَحَ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
    arabicPlain: يا بني آدم إما يأتينكم رسل منكم يقصون عليكم آياتي ۙ فمن اتقى وأصلح فلا خوف عليهم ولا هم يحزنون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 125
    page: 154
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '7'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-8
- type: Ayah
  data:
    ref: '7:36'
    scripture: quran
    name: Quran 7:36
    chapter: 7
    verse: 36
    ordinal: 990
    text: But they who deny Our revelations and scorn them - each are rightful owners of the Fire; they will abide therein.
    translation: Pickthall
    original: وَٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَـٰتِنَا وَٱسْتَكْبَرُوا۟ عَنْهَآ أُو۟لَـٰٓئِكَ أَصْحَـٰبُ ٱلنَّارِ ۖ هُمْ فِيهَا خَـٰلِدُونَ
    arabicPlain: والذين كذبوا بآياتنا واستكبروا عنها أولئك أصحاب النار ۖ هم فيها خالدون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 125
    page: 154
