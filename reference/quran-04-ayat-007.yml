  data:
    ref: '7:49'
    scripture: quran
    name: Quran 7:49
    chapter: 7
    verse: 49
    ordinal: 1003
    text: 'Are these they of whom ye swore that Allah would not show them mercy? (Unto them it hath been said): Enter the Garden. No fear shall come upon you nor is it ye who will grieve.'
    translation: Pickthall
    original: أَهَـٰٓؤُلَآءِ ٱلَّذِينَ أَقْسَمْتُمْ لَا يَنَالُهُمُ ٱللَّهُ بِرَحْمَةٍ ۚ ٱدْخُلُوا۟ ٱلْجَنَّةَ لَا خَوْفٌ عَلَيْكُمْ وَلَآ أَنتُمْ تَحْزَنُونَ
    arabicPlain: أهؤلاء الذين أقسمتم لا ينالهم الله برحمة ۚ ادخلوا الجنة لا خوف عليكم ولا أنتم تحزنون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 127
    page: 156
