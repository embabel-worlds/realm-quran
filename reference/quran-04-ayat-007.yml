  data:
    ref: 7:93
    scripture: quran
    name: Quran 7:93
    chapter: 7
    verse: 93
    ordinal: 1047
    text: 'So he turned from them and said: O my people! I delivered my Lord''s messages unto you and gave you good advice; then how can I sorrow for a people that rejected (truth)?'
    translation: Pickthall
    original: فَتَوَلَّىٰ عَنْهُمْ وَقَالَ يَـٰقَوْمِ لَقَدْ أَبْلَغْتُكُمْ رِسَـٰلَـٰتِ رَبِّى وَنَصَحْتُ لَكُمْ ۖ فَكَيْفَ ءَاسَىٰ عَلَىٰ قَوْمٍ كَـٰفِرِينَ
    arabicPlain: فتولى عنهم وقال يا قوم لقد أبلغتكم رسالات ربي ونصحت لكم ۖ فكيف آسى على قوم كافرين
    surahName: Al-A'raaf
