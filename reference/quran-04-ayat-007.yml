    verse: 193
    ordinal: 1147
    text: And if ye call them to the Guidance, they follow you not. Whether ye call them or are silent is all one for you.
    translation: Pickthall
    original: وَإِن تَدْعُوهُمْ إِلَى ٱلْهُدَىٰ لَا يَتَّبِعُوكُمْ ۚ سَوَآءٌ عَلَيْكُمْ أَدَعَوْتُمُوهُمْ أَمْ أَنتُمْ صَـٰمِتُونَ
    arabicPlain: وإن تدعوهم إلى الهدى لا يتبعوكم ۚ سواء عليكم أدعوتموهم أم أنتم صامتون
