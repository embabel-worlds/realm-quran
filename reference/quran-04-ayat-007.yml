    verse: 159
    ordinal: 1113
    text: And of Moses' folk there is a community who lead with truth and establish justice therewith.
    translation: Pickthall
    original: وَمِن قَوْمِ مُوسَىٰٓ أُمَّةٌ يَهْدُونَ بِٱلْحَقِّ وَبِهِۦ يَعْدِلُونَ
    arabicPlain: ومن قوم موسى أمة يهدون بالحق وبه يعدلون
    surahName: Al-A'raaf
