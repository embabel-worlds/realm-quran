  data:
    ref: 7:138
    scripture: quran
    name: Quran 7:138
    chapter: 7
    verse: 138
    ordinal: 1092
    text: 'And We brought the Children of Israel across the sea, and they came unto a people who were given up to idols which they had. They said: O Moses! Make for us a god even as they have gods. He said: Lo! ye are a folk who know not.'
    translation: Pickthall
    original: وَجَـٰوَزْنَا بِبَنِىٓ إِسْرَٰٓءِيلَ ٱلْبَحْرَ فَأَتَوْا۟ عَلَىٰ قَوْمٍ يَعْكُفُونَ عَلَىٰٓ أَصْنَامٍ لَّهُمْ ۚ قَالُوا۟ يَـٰمُوسَى ٱجْعَل لَّنَآ إِلَـٰهًا كَمَا لَهُمْ ءَالِهَةٌ ۚ قَالَ إِنَّكُمْ قَوْمٌ تَجْهَلُونَ
    arabicPlain: وجاوزنا ببني إسرائيل البحر فأتوا على قوم يعكفون على أصنام لهم ۚ قالوا يا موسى اجعل لنا إلها كما لهم آلهة ۚ قال إنكم قوم تجهلون
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 137
    page: 167
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '7'
  - predicate: IN_PORTION
    to:
