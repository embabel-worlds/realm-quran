- type: Ayah
  data:
    ref: '7:12'
    scripture: quran
    name: Quran 7:12
    chapter: 7
    verse: 12
    ordinal: 966
    text: 'He said: What hindered thee that thou didst not fall prostrate when I bade thee? (Iblis) said: I am better than him. Thou createdst me of fire while him Thou didst create of mud.'
    translation: Pickthall
    original: قَالَ مَا مَنَعَكَ أَلَّا تَسْجُدَ إِذْ أَمَرْتُكَ ۖ قَالَ أَنَا۠ خَيْرٌ مِّنْهُ خَلَقْتَنِى مِن نَّارٍ وَخَلَقْتَهُۥ مِن طِينٍ
    arabicPlain: قال ما منعك ألا تسجد إذ أمرتك ۖ قال أنا خير منه خلقتني من نار وخلقته من طين
    surahName: Al-A'raaf
