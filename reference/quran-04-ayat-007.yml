  data:
    ref: '7:23'
    scripture: quran
    name: Quran 7:23
    chapter: 7
    verse: 23
    ordinal: 977
    text: 'They said: Our Lord! We have wronged ourselves. If thou forgive us not and have not mercy on us, surely we are of the lost!'
    translation: Pickthall
    original: قَالَا رَبَّنَا ظَلَمْنَآ أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ ٱلْخَـٰسِرِينَ
    arabicPlain: قالا ربنا ظلمنا أنفسنا وإن لم تغفر لنا وترحمنا لنكونن من الخاسرين
    surahName: Al-A'raaf
