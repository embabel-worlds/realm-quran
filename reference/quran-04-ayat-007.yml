  data:
    ref: 7:152
    scripture: quran
    name: Quran 7:152
    chapter: 7
    verse: 152
    ordinal: 1106
    text: Lo! Those who chose the calf (for worship), terror from their Lord and humiliation will come upon them in the life of the world. Thus do We requite those who invent a lie.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ ٱتَّخَذُوا۟ ٱلْعِجْلَ سَيَنَالُهُمْ غَضَبٌ مِّن رَّبِّهِمْ وَذِلَّةٌ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا ۚ وَكَذَٰلِكَ نَجْزِى ٱلْمُفْتَرِينَ
    arabicPlain: إن الذين اتخذوا العجل سينالهم غضب من ربهم وذلة في الحياة الدنيا ۚ وكذلك نجزي المفترين
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 140
