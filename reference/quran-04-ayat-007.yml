  data:
    ref: 7:136
    scripture: quran
    name: Quran 7:136
    chapter: 7
    verse: 136
    ordinal: 1090
    text: 'Therefore We took retribution from them; therefore We drowned them in the sea: because they denied Our revelations and were heedless of them.'
    translation: Pickthall
    original: فَٱنتَقَمْنَا مِنْهُمْ فَأَغْرَقْنَـٰهُمْ فِى ٱلْيَمِّ بِأَنَّهُمْ كَذَّبُوا۟ بِـَٔايَـٰتِنَا وَكَانُوا۟ عَنْهَا غَـٰفِلِينَ
    arabicPlain: فانتقمنا منهم فأغرقناهم في اليم بأنهم كذبوا بآياتنا وكانوا عنها غافلين
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 137
    page: 166
