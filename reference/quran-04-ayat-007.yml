  data:
    ref: 7:71
    scripture: quran
    name: Quran 7:71
    chapter: 7
    verse: 71
    ordinal: 1025
    text: 'He said: Terror and wrath from your Lord have already fallen on you. Would ye wrangle with me over names which ye have named, ye and your fathers, for which no warrant from Allah hath been revealed? Then await (the consequence), lo! I (also) am of those awaiting (it).'
    translation: Pickthall
    original: قَالَ قَدْ وَقَعَ عَلَيْكُم مِّن رَّبِّكُمْ رِجْسٌ وَغَضَبٌ ۖ أَتُجَـٰدِلُونَنِى فِىٓ أَسْمَآءٍ سَمَّيْتُمُوهَآ أَنتُمْ وَءَابَآؤُكُم مَّا نَزَّلَ ٱللَّهُ بِهَا مِن سُلْطَـٰنٍ ۚ فَٱنتَظِرُوٓا۟ إِنِّى مَعَكُم مِّنَ ٱلْمُنتَظِرِينَ
    arabicPlain: قال قد وقع عليكم من ربكم رجس وغضب ۖ أتجادلونني في أسماء سميتموها أنتم وآباؤكم ما نزل الله بها من سلطان ۚ فانتظروا إني معكم من المنتظرين
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 130
