  data:
    ref: '7:29'
    scripture: quran
    name: Quran 7:29
    chapter: 7
    verse: 29
    ordinal: 983
    text: 'Say: My Lord enjoineth justice. And set your faces upright (toward Him) at every place of worship and call upon Him, making religion pure for Him (only). As He brought you into being, so return ye (unto Him).'
    translation: Pickthall
    original: قُلْ أَمَرَ رَبِّى بِٱلْقِسْطِ ۖ وَأَقِيمُوا۟ وُجُوهَكُمْ عِندَ كُلِّ مَسْجِدٍ وَٱدْعُوهُ مُخْلِصِينَ لَهُ ٱلدِّينَ ۚ كَمَا بَدَأَكُمْ تَعُودُونَ
    arabicPlain: قل أمر ربي بالقسط ۖ وأقيموا وجوهكم عند كل مسجد وادعوه مخلصين له الدين ۚ كما بدأكم تعودون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 124
    page: 153
  relations:
  - predicate: IN
    to:
