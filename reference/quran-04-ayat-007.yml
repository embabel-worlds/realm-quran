  data:
    ref: 7:134
    scripture: quran
    name: Quran 7:134
    chapter: 7
    verse: 134
    ordinal: 1088
    text: 'And when the terror fell on them they cried: O Moses! Pray for us unto thy Lord, because He hath a covenant with thee. If thou removest the terror from us we verily will trust thee and will let the Children of Israel go with thee.'
    translation: Pickthall
    original: وَلَمَّا وَقَعَ عَلَيْهِمُ ٱلرِّجْزُ قَالُوا۟ يَـٰمُوسَى ٱدْعُ لَنَا رَبَّكَ بِمَا عَهِدَ عِندَكَ ۖ لَئِن كَشَفْتَ عَنَّا ٱلرِّجْزَ لَنُؤْمِنَنَّ لَكَ وَلَنُرْسِلَنَّ مَعَكَ بَنِىٓ إِسْرَٰٓءِيلَ
    arabicPlain: ولما وقع عليهم الرجز قالوا يا موسى ادع لنا ربك بما عهد عندك ۖ لئن كشفت عنا الرجز لنؤمنن لك ولنرسلن معك بني إسرائيل
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 137
    page: 166
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '7'
  - predicate: IN_PORTION
    to:
