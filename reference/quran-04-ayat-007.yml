    scripture: quran
    name: Quran 7:56
    chapter: 7
    verse: 56
    ordinal: 1010
    text: Work not confusion in the earth after the fair ordering (thereof). and call on Him in fear and hope. Lo! the mercy of Allah is nigh unto the good.
    translation: Pickthall
    original: وَلَا تُفْسِدُوا۟ فِى ٱلْأَرْضِ بَعْدَ إِصْلَـٰحِهَا وَٱدْعُوهُ خَوْفًا وَطَمَعًا ۚ إِنَّ رَحْمَتَ ٱللَّهِ قَرِيبٌ مِّنَ ٱلْمُحْسِنِينَ
    arabicPlain: ولا تفسدوا في الأرض بعد إصلاحها وادعوه خوفا وطمعا ۚ إن رحمت الله قريب من المحسنين
