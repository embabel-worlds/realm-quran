    scripture: quran
    name: Quran 7:69
    chapter: 7
    verse: 69
    ordinal: 1023
    text: Marvel ye that there should come unto you a Reminder from your Lord by means of a man among you, that he may warn you? Remember how He made you viceroys after Noah's folk, and gave you growth of stature. Remember (all) the bounties of your Lord, that haply ye may be successful.
    translation: Pickthall
    original: أَوَعَجِبْتُمْ أَن جَآءَكُمْ ذِكْرٌ مِّن رَّبِّكُمْ عَلَىٰ رَجُلٍ مِّنكُمْ لِيُنذِرَكُمْ ۚ وَٱذْكُرُوٓا۟ إِذْ جَعَلَكُمْ خُلَفَآءَ مِنۢ بَعْدِ قَوْمِ نُوحٍ وَزَادَكُمْ فِى ٱلْخَلْقِ بَصْۜطَةً ۖ فَٱذْكُرُوٓا۟ ءَالَآءَ ٱللَّهِ لَعَلَّكُمْ تُفْلِحُونَ
    arabicPlain: أوعجبتم أن جاءكم ذكر من ربكم على رجل منكم لينذركم ۚ واذكروا إذ جعلكم خلفاء من بعد قوم نوح وزادكم في الخلق بسطة ۖ فاذكروا آلاء الله لعلكم تفلحون
