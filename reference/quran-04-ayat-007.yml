  data:
    ref: 7:151
    scripture: quran
    name: Quran 7:151
    chapter: 7
    verse: 151
    ordinal: 1105
    text: 'He said: My Lord! Have mercy on me and on my brother; bring us into Thy mercy, Thou the Most Merciful of all who show mercy.'
    translation: Pickthall
    original: قَالَ رَبِّ ٱغْفِرْ لِى وَلِأَخِى وَأَدْخِلْنَا فِى رَحْمَتِكَ ۖ وَأَنتَ أَرْحَمُ ٱلرَّٰحِمِينَ
    arabicPlain: قال رب اغفر لي ولأخي وأدخلنا في رحمتك ۖ وأنت أرحم الراحمين
    surahName: Al-A'raaf
    juz: 9
