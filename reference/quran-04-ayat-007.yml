  data:
    ref: 7:70
    scripture: quran
    name: Quran 7:70
    chapter: 7
    verse: 70
    ordinal: 1024
    text: 'They said: Hast come unto us that we should serve Allah alone, and forsake what our fathers worshipped? Then bring upon us that wherewith thou threatenest us if thou art of the truthful!'
    translation: Pickthall
    original: قَالُوٓا۟ أَجِئْتَنَا لِنَعْبُدَ ٱللَّهَ وَحْدَهُۥ وَنَذَرَ مَا كَانَ يَعْبُدُ ءَابَآؤُنَا ۖ فَأْتِنَا بِمَا تَعِدُنَآ إِن كُنتَ مِنَ ٱلصَّـٰدِقِينَ
    arabicPlain: قالوا أجئتنا لنعبد الله وحده ونذر ما كان يعبد آباؤنا ۖ فأتنا بما تعدنا إن كنت من الصادقين
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 130
