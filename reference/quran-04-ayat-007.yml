    scripture: quran
    name: Quran 7:194
    chapter: 7
    verse: 194
    ordinal: 1148
    text: Lo! those on whom ye call beside Allah are slaves like unto you. Call on them now, and let them answer you, if ye are truthful!
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ تَدْعُونَ مِن دُونِ ٱللَّهِ عِبَادٌ أَمْثَالُكُمْ ۖ فَٱدْعُوهُمْ فَلْيَسْتَجِيبُوا۟ لَكُمْ إِن كُنتُمْ صَـٰدِقِينَ
    arabicPlain: إن الذين تدعون من دون الله عباد أمثالكم ۖ فادعوهم فليستجيبوا لكم إن كنتم صادقين
