  data:
    ref: 7:92
    scripture: quran
    name: Quran 7:92
    chapter: 7
    verse: 92
    ordinal: 1046
    text: Those who denied Shu'eyb became as though they had not dwelt there. Those who denied Shu'eyb, they were the losers.
    translation: Pickthall
    original: ٱلَّذِينَ كَذَّبُوا۟ شُعَيْبًا كَأَن لَّمْ يَغْنَوْا۟ فِيهَا ۚ ٱلَّذِينَ كَذَّبُوا۟ شُعَيْبًا كَانُوا۟ هُمُ ٱلْخَـٰسِرِينَ
    arabicPlain: الذين كذبوا شعيبا كأن لم يغنوا فيها ۚ الذين كذبوا شعيبا كانوا هم الخاسرين
