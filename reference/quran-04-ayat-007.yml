    scripture: quran
    name: Quran 7:41
    chapter: 7
    verse: 41
    ordinal: 995
    text: Theirs will be a bed of hell, and over them coverings (of hell). Thus do We requite wrong-doers.
    translation: Pickthall
    original: لَهُم مِّن جَهَنَّمَ مِهَادٌ وَمِن فَوْقِهِمْ غَوَاشٍ ۚ وَكَذَٰلِكَ نَجْزِى ٱلظَّـٰلِمِينَ
    arabicPlain: لهم من جهنم مهاد ومن فوقهم غواش ۚ وكذلك نجزي الظالمين
    surahName: Al-A'raaf
    juz: 8
