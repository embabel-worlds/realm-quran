  data:
    ref: 7:99
    scripture: quran
    name: Quran 7:99
    chapter: 7
    verse: 99
    ordinal: 1053
    text: Are they then secure from Allah's scheme? None deemeth himself secure from Allah's scheme save folk that perish.
    translation: Pickthall
    original: أَفَأَمِنُوا۟ مَكْرَ ٱللَّهِ ۚ فَلَا يَأْمَنُ مَكْرَ ٱللَّهِ إِلَّا ٱلْقَوْمُ ٱلْخَـٰسِرُونَ
    arabicPlain: أفأمنوا مكر الله ۚ فلا يأمن مكر الله إلا القوم الخاسرون
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
