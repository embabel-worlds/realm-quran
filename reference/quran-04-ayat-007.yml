  data:
    ref: 7:135
    scripture: quran
    name: Quran 7:135
    chapter: 7
    verse: 135
    ordinal: 1089
    text: But when We did remove from them the terror for a term which they must reach, behold! they broke their covenant.
    translation: Pickthall
    original: فَلَمَّا كَشَفْنَا عَنْهُمُ ٱلرِّجْزَ إِلَىٰٓ أَجَلٍ هُم بَـٰلِغُوهُ إِذَا هُمْ يَنكُثُونَ
    arabicPlain: فلما كشفنا عنهم الرجز إلى أجل هم بالغوه إذا هم ينكثون
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 137
    page: 166
