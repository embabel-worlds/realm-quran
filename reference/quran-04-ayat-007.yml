  data:
    ref: 7:88
    scripture: quran
    name: Quran 7:88
    chapter: 7
    verse: 88
    ordinal: 1042
    text: 'The chieftains of his people, who were scornful, said: Surely we will drive thee out, O Shu''eyb, and those who believe with thee, from our township, unless ye return to our religion. He said: Even though we hate it?'
    translation: Pickthall
    original: ۞ قَالَ ٱلْمَلَأُ ٱلَّذِينَ ٱسْتَكْبَرُوا۟ مِن قَوْمِهِۦ لَنُخْرِجَنَّكَ يَـٰشُعَيْبُ وَٱلَّذِينَ ءَامَنُوا۟ مَعَكَ مِن قَرْيَتِنَآ أَوْ لَتَعُودُنَّ فِى مِلَّتِنَا ۚ قَالَ أَوَلَوْ كُنَّا كَـٰرِهِينَ
    arabicPlain: ۞ قال الملأ الذين استكبروا من قومه لنخرجنك يا شعيب والذين آمنوا معك من قريتنا أو لتعودن في ملتنا ۚ قال أولو كنا كارهين
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 132
    page: 162
