  data:
    ref: '7:39'
    scripture: quran
    name: Quran 7:39
    chapter: 7
    verse: 39
    ordinal: 993
    text: 'And the first of them saith unto the last of them: Ye were no whit better than us, so taste the doom for what ye used to earn.'
    translation: Pickthall
    original: وَقَالَتْ أُولَىٰهُمْ لِأُخْرَىٰهُمْ فَمَا كَانَ لَكُمْ عَلَيْنَا مِن فَضْلٍ فَذُوقُوا۟ ٱلْعَذَابَ بِمَا كُنتُمْ تَكْسِبُونَ
    arabicPlain: وقالت أولاهم لأخراهم فما كان لكم علينا من فضل فذوقوا العذاب بما كنتم تكسبون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 125
