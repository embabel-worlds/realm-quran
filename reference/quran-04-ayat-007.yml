  data:
    ref: 7:101
    scripture: quran
    name: Quran 7:101
    chapter: 7
    verse: 101
    ordinal: 1055
    text: Such were the townships. We relate some tidings of them unto thee (Muhammad). Their messengers verily came unto them with clear proofs (of Allah's Sovereignty), but they could not believe because they had before denied. Thus doth Allah print upon the hearts of disbelievers (that they hear not).
    translation: Pickthall
