  data:
    ref: 7:132
    scripture: quran
    name: Quran 7:132
    chapter: 7
    verse: 132
    ordinal: 1086
    text: 'And they said: Whatever portent thou bringest wherewith to bewitch us, we shall not put faith in thee.'
    translation: Pickthall
    original: وَقَالُوا۟ مَهْمَا تَأْتِنَا بِهِۦ مِنْ ءَايَةٍ لِّتَسْحَرَنَا بِهَا فَمَا نَحْنُ لَكَ بِمُؤْمِنِينَ
    arabicPlain: وقالوا مهما تأتنا به من آية لتسحرنا بها فما نحن لك بمؤمنين
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 137
