  data:
    ref: '7:46'
    scripture: quran
    name: Quran 7:46
    chapter: 7
    verse: 46
    ordinal: 1000
    text: 'Between them is a veil. And on the Heights are men who know them all by their marks. And they call unto the dwellers of the Garden: Peace be unto you! They enter it not although they hope (to enter).'
    translation: Pickthall
    original: وَبَيْنَهُمَا حِجَابٌ ۚ وَعَلَى ٱلْأَعْرَافِ رِجَالٌ يَعْرِفُونَ كُلًّۢا بِسِيمَىٰهُمْ ۚ وَنَادَوْا۟ أَصْحَـٰبَ ٱلْجَنَّةِ أَن سَلَـٰمٌ عَلَيْكُمْ ۚ لَمْ يَدْخُلُوهَا وَهُمْ يَطْمَعُونَ
    arabicPlain: وبينهما حجاب ۚ وعلى الأعراف رجال يعرفون كلا بسيماهم ۚ ونادوا أصحاب الجنة أن سلام عليكم ۚ لم يدخلوها وهم يطمعون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 126
    page: 156
