  data:
    ref: 7:89
    scripture: quran
    name: Quran 7:89
    chapter: 7
    verse: 89
    ordinal: 1043
    text: We should have invented a lie against Allah if we returned to your religion after Allah hath rescued us from it. It is not for us to return to it unless Allah our Lord should (so) will. Our Lord comprehendeth all things in knowledge. In Allah do we put our trust. Our Lord! Decide with truth between us and our folk, for Thou art the best of those who make decision.
    translation: Pickthall
    original: قَدِ ٱفْتَرَيْنَا عَلَى ٱللَّهِ كَذِبًا إِنْ عُدْنَا فِى مِلَّتِكُم بَعْدَ إِذْ نَجَّىٰنَا ٱللَّهُ مِنْهَا ۚ وَمَا يَكُونُ لَنَآ أَن نَّعُودَ فِيهَآ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّنَا ۚ وَسِعَ رَبُّنَا كُلَّ شَىْءٍ عِلْمًا ۚ عَلَى ٱللَّهِ تَوَكَّلْنَا ۚ رَبَّنَا ٱفْتَحْ بَيْنَنَا وَبَيْنَ قَوْمِنَا بِٱلْحَقِّ وَأَنتَ خَيْرُ ٱلْفَـٰتِحِينَ
    arabicPlain: قد افترينا على الله كذبا إن عدنا في ملتكم بعد إذ نجانا الله منها ۚ وما يكون لنا أن نعود فيها إلا أن يشاء الله ربنا ۚ وسع ربنا كل شيء علما ۚ على الله توكلنا ۚ ربنا افتح بيننا وبين قومنا بالحق وأنت خير الفاتحين
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 132
    page: 162
