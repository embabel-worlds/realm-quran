  data:
    ref: '7:26'
    scripture: quran
    name: Quran 7:26
    chapter: 7
    verse: 26
    ordinal: 980
    text: O Children of Adam! We have revealed unto you raiment to conceal your shame, and splendid vesture, but the raiment of restraint from evil, that is best. This is of the revelations of Allah, that they may remember.
    translation: Pickthall
    original: يَـٰبَنِىٓ ءَادَمَ قَدْ أَنزَلْنَا عَلَيْكُمْ لِبَاسًا يُوَٰرِى سَوْءَٰتِكُمْ وَرِيشًا ۖ وَلِبَاسُ ٱلتَّقْوَىٰ ذَٰلِكَ خَيْرٌ ۚ ذَٰلِكَ مِنْ ءَايَـٰتِ ٱللَّهِ لَعَلَّهُمْ يَذَّكَّرُونَ
    arabicPlain: يا بني آدم قد أنزلنا عليكم لباسا يواري سوآتكم وريشا ۖ ولباس التقوى ذلك خير ۚ ذلك من آيات الله لعلهم يذكرون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 124
    page: 153
