    name: Quran 7:13
    chapter: 7
    verse: 13
    ordinal: 967
    text: 'He said: Then go down hence! It is not for thee to show pride here, so go forth! Lo! thou art of those degraded.'
    translation: Pickthall
    original: قَالَ فَٱهْبِطْ مِنْهَا فَمَا يَكُونُ لَكَ أَن تَتَكَبَّرَ فِيهَا فَٱخْرُجْ إِنَّكَ مِنَ ٱلصَّـٰغِرِينَ
    arabicPlain: قال فاهبط منها فما يكون لك أن تتكبر فيها فاخرج إنك من الصاغرين
