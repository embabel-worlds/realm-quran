  data:
    ref: '7:42'
    scripture: quran
    name: Quran 7:42
    chapter: 7
    verse: 42
    ordinal: 996
    text: But (as for) those who believe and do good works - We tax not any soul beyond its scope - Such are rightful owners of the Garden. They abide therein.
    translation: Pickthall
    original: وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ لَا نُكَلِّفُ نَفْسًا إِلَّا وُسْعَهَآ أُو۟لَـٰٓئِكَ أَصْحَـٰبُ ٱلْجَنَّةِ ۖ هُمْ فِيهَا خَـٰلِدُونَ
    arabicPlain: والذين آمنوا وعملوا الصالحات لا نكلف نفسا إلا وسعها أولئك أصحاب الجنة ۖ هم فيها خالدون
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 126
