  data:
    ref: 7:147
    scripture: quran
    name: Quran 7:147
    chapter: 7
    verse: 147
    ordinal: 1101
    text: Those who deny Our revelations and the meeting of the Hereafter, their works are fruitless. Are they requited aught save what they used to do?
    translation: Pickthall
    original: وَٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَـٰتِنَا وَلِقَآءِ ٱلْـَٔاخِرَةِ حَبِطَتْ أَعْمَـٰلُهُمْ ۚ هَلْ يُجْزَوْنَ إِلَّا مَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: والذين كذبوا بآياتنا ولقاء الآخرة حبطت أعمالهم ۚ هل يجزون إلا ما كانوا يعملون
    surahName: Al-A'raaf
    juz: 9
