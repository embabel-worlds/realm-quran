  data:
    ref: '7:5'
    scripture: quran
    name: Quran 7:5
    chapter: 7
    verse: 5
    ordinal: 959
    text: 'No plea had they, when Our terror came unto them, save that they said: Lo! We were wrong-doers.'
    translation: Pickthall
    original: فَمَا كَانَ دَعْوَىٰهُمْ إِذْ جَآءَهُم بَأْسُنَآ إِلَّآ أَن قَالُوٓا۟ إِنَّا كُنَّا ظَـٰلِمِينَ
    arabicPlain: فما كان دعواهم إذ جاءهم بأسنا إلا أن قالوا إنا كنا ظالمين
    surahName: Al-A'raaf
    juz: 8
    manzil: 2
    ruku: 122
