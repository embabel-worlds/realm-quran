    scripture: quran
    name: Quran 7:55
    chapter: 7
    verse: 55
    ordinal: 1009
    text: (O mankind!) Call upon your Lord humbly and in secret. Lo! He loveth not aggressors.
    translation: Pickthall
    original: ٱدْعُوا۟ رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً ۚ إِنَّهُۥ لَا يُحِبُّ ٱلْمُعْتَدِينَ
    arabicPlain: ادعوا ربكم تضرعا وخفية ۚ إنه لا يحب المعتدين
