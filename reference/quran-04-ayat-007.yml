    text: Who took their religion for a sport and pastime, and whom the life of the world beguiled. So this day We have forgotten them even as they forgot the meeting of this their Day and as they used to deny Our tokens.
    translation: Pickthall
    original: ٱلَّذِينَ ٱتَّخَذُوا۟ دِينَهُمْ لَهْوًا وَلَعِبًا وَغَرَّتْهُمُ ٱلْحَيَوٰةُ ٱلدُّنْيَا ۚ فَٱلْيَوْمَ نَنسَىٰهُمْ كَمَا نَسُوا۟ لِقَآءَ يَوْمِهِمْ هَـٰذَا وَمَا كَانُوا۟ بِـَٔايَـٰتِنَا يَجْحَدُونَ
    arabicPlain: الذين اتخذوا دينهم لهوا ولعبا وغرتهم الحياة الدنيا ۚ فاليوم ننساهم كما نسوا لقاء يومهم هذا وما كانوا بآياتنا يجحدون
    surahName: Al-A'raaf
