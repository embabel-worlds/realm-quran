  data:
    ref: 7:141
    scripture: quran
    name: Quran 7:141
    chapter: 7
    verse: 141
    ordinal: 1095
    text: And (remember) when We did deliver you from Pharaoh's folk who were afflicting you with dreadful torment, slaughtering your sons and sparing your women. That was a tremendous trial from your Lord.
    translation: Pickthall
    original: وَإِذْ أَنجَيْنَـٰكُم مِّنْ ءَالِ فِرْعَوْنَ يَسُومُونَكُمْ سُوٓءَ ٱلْعَذَابِ ۖ يُقَتِّلُونَ أَبْنَآءَكُمْ وَيَسْتَحْيُونَ نِسَآءَكُمْ ۚ وَفِى ذَٰلِكُم بَلَآءٌ مِّن رَّبِّكُمْ عَظِيمٌ
    arabicPlain: وإذ أنجيناكم من آل فرعون يسومونكم سوء العذاب ۖ يقتلون أبناءكم ويستحيون نساءكم ۚ وفي ذلكم بلاء من ربكم عظيم
    surahName: Al-A'raaf
    juz: 9
    manzil: 2
    ruku: 137
    page: 167
