  data:
    ref: '59:20'
    scripture: quran
    name: Quran 59:20
    chapter: 59
    verse: 20
    ordinal: 5146
    text: Not equal are the owners of the Fire and the owners of the Garden. The owners of the Garden, they are the victorious.
    translation: Pickthall
    original: لَا يَسْتَوِىٓ أَصْحَـٰبُ ٱلنَّارِ وَأَصْحَـٰبُ ٱلْجَنَّةِ ۚ أَصْحَـٰبُ ٱلْجَنَّةِ هُمُ ٱلْفَآئِزُونَ
    arabicPlain: لا يستوي أصحاب النار وأصحاب الجنة ۚ أصحاب الجنة هم الفائزون
    surahName: Al-Hashr
    juz: 28
    manzil: 7
