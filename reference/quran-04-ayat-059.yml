  data:
    ref: '59:16'
    scripture: quran
    name: Quran 59:16
    chapter: 59
    verse: 16
    ordinal: 5142
    text: '(And the hypocrites are) on the likeness of the devil when he telleth man to disbelieve, then, when he disbelieveth saith: Lo! I am quit of thee. Lo! I fear Allah, the Lord of the Worlds.'
    translation: Pickthall
    original: كَمَثَلِ ٱلشَّيْطَـٰنِ إِذْ قَالَ لِلْإِنسَـٰنِ ٱكْفُرْ فَلَمَّا كَفَرَ قَالَ إِنِّى بَرِىٓءٌ مِّنكَ إِنِّىٓ أَخَافُ ٱللَّهَ رَبَّ ٱلْعَـٰلَمِينَ
    arabicPlain: كمثل الشيطان إذ قال للإنسان اكفر فلما كفر قال إني بريء منك إني أخاف الله رب العالمين
    surahName: Al-Hashr
    juz: 28
    manzil: 7
    ruku: 480
    page: 547
