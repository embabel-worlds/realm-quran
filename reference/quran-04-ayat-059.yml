- type: Ayah
  data:
    ref: '59:8'
    scripture: quran
    name: Quran 59:8
    chapter: 59
    verse: 8
    ordinal: 5134
    text: And (it is) for the poor fugitives who have been driven out from their homes and their belongings, who seek bounty from Allah and help Allah and His messenger. They are the loyal.
    translation: Pickthall
    original: لِلْفُقَرَآءِ ٱلْمُهَـٰجِرِينَ ٱلَّذِينَ أُخْرِجُوا۟ مِن دِيَـٰرِهِمْ وَأَمْوَٰلِهِمْ يَبْتَغُونَ فَضْلًا مِّنَ ٱللَّهِ وَرِضْوَٰنًا وَيَنصُرُونَ ٱللَّهَ وَرَسُولَهُۥٓ ۚ أُو۟لَـٰٓئِكَ هُمُ ٱلصَّـٰدِقُونَ
    arabicPlain: للفقراء المهاجرين الذين أخرجوا من ديارهم وأموالهم يبتغون فضلا من الله ورضوانا وينصرون الله ورسوله ۚ أولئك هم الصادقون
    surahName: Al-Hashr
    juz: 28
    manzil: 7
    ruku: 479
    page: 546
