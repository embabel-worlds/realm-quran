- type: Ayah
  data:
    ref: '59:14'
    scripture: quran
    name: Quran 59:14
    chapter: 59
    verse: 14
    ordinal: 5140
    text: They will not fight against you in a body save in fortified villages or from behind walls. Their adversity among themselves is very great. Ye think of them as a whole whereas their hearts are divers. That is because they are a folk who have no sense.
    translation: Pickthall
    original: لَا يُقَـٰتِلُونَكُمْ جَمِيعًا إِلَّا فِى قُرًى مُّحَصَّنَةٍ أَوْ مِن وَرَآءِ جُدُرٍۭ ۚ بَأْسُهُم بَيْنَهُمْ شَدِيدٌ ۚ تَحْسَبُهُمْ جَمِيعًا وَقُلُوبُهُمْ شَتَّىٰ ۚ ذَٰلِكَ بِأَنَّهُمْ قَوْمٌ لَّا يَعْقِلُونَ
    arabicPlain: لا يقاتلونكم جميعا إلا في قرى محصنة أو من وراء جدر ۚ بأسهم بينهم شديد ۚ تحسبهم جميعا وقلوبهم شتى ۚ ذلك بأنهم قوم لا يعقلون
    surahName: Al-Hashr
    juz: 28
    manzil: 7
    ruku: 480
    page: 547
