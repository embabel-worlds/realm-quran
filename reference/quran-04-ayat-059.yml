  data:
    ref: '59:22'
    scripture: quran
    name: Quran 59:22
    chapter: 59
    verse: 22
    ordinal: 5148
    text: He is Allah, than Whom there is no other Allah, the Knower of the Invisible and the Visible. He is the Beneficent, Merciful.
    translation: Pickthall
    original: هُوَ ٱللَّهُ ٱلَّذِى لَآ إِلَـٰهَ إِلَّا هُوَ ۖ عَـٰلِمُ ٱلْغَيْبِ وَٱلشَّهَـٰدَةِ ۖ هُوَ ٱلرَّحْمَـٰنُ ٱلرَّحِيمُ
    arabicPlain: هو الله الذي لا إله إلا هو ۖ عالم الغيب والشهادة ۖ هو الرحمن الرحيم
    surahName: Al-Hashr
    juz: 28
    manzil: 7
    ruku: 481
    page: 548
