  data:
    ref: '59:21'
    scripture: quran
    name: Quran 59:21
    chapter: 59
    verse: 21
    ordinal: 5147
    text: If We had caused this Qur'an to descend upon a mountain, thou (O Muhammad) verily hadst seen it humbled, rent asunder by the fear of Allah. Such similitudes coin We for mankind that haply they may reflect.
    translation: Pickthall
    original: لَوْ أَنزَلْنَا هَـٰذَا ٱلْقُرْءَانَ عَلَىٰ جَبَلٍ لَّرَأَيْتَهُۥ خَـٰشِعًا مُّتَصَدِّعًا مِّنْ خَشْيَةِ ٱللَّهِ ۚ وَتِلْكَ ٱلْأَمْثَـٰلُ نَضْرِبُهَا لِلنَّاسِ لَعَلَّهُمْ يَتَفَكَّرُونَ
    arabicPlain: لو أنزلنا هذا القرآن على جبل لرأيته خاشعا متصدعا من خشية الله ۚ وتلك الأمثال نضربها للناس لعلهم يتفكرون
    surahName: Al-Hashr
    juz: 28
    manzil: 7
    ruku: 481
    page: 548
