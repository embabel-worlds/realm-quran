- type: Ayah
  data:
    ref: '59:10'
    scripture: quran
    name: Quran 59:10
    chapter: 59
    verse: 10
    ordinal: 5136
    text: 'And those who came (into the faith) after them say: Our Lord! Forgive us and our brethren who were before us in the faith, and place not in our hearts any rancour toward those who believe. Our Lord! Thou art Full of Pity, Merciful.'
    translation: Pickthall
    original: وَٱلَّذِينَ جَآءُو مِنۢ بَعْدِهِمْ يَقُولُونَ رَبَّنَا ٱغْفِرْ لَنَا وَلِإِخْوَٰنِنَا ٱلَّذِينَ سَبَقُونَا بِٱلْإِيمَـٰنِ وَلَا تَجْعَلْ فِى قُلُوبِنَا غِلًّا لِّلَّذِينَ ءَامَنُوا۟ رَبَّنَآ إِنَّكَ رَءُوفٌ رَّحِيمٌ
    arabicPlain: والذين جاءوا من بعدهم يقولون ربنا اغفر لنا ولإخواننا الذين سبقونا بالإيمان ولا تجعل في قلوبنا غلا للذين آمنوا ربنا إنك رءوف رحيم
    surahName: Al-Hashr
    juz: 28
    manzil: 7
    ruku: 479
    page: 547
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '59'
  - predicate: IN_PORTION
    to:
      type: Juz
