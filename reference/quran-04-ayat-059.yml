  data:
    ref: '59:19'
    scripture: quran
    name: Quran 59:19
    chapter: 59
    verse: 19
    ordinal: 5145
    text: And be not ye as those who forgot Allah, therefor He caused them to forget their souls. Such are the evil-doers.
    translation: Pickthall
    original: وَلَا تَكُونُوا۟ كَٱلَّذِينَ نَسُوا۟ ٱللَّهَ فَأَنسَىٰهُمْ أَنفُسَهُمْ ۚ أُو۟لَـٰٓئِكَ هُمُ ٱلْفَـٰسِقُونَ
    arabicPlain: ولا تكونوا كالذين نسوا الله فأنساهم أنفسهم ۚ أولئك هم الفاسقون
    surahName: Al-Hashr
    juz: 28
