  data:
    ref: '59:17'
    scripture: quran
    name: Quran 59:17
    chapter: 59
    verse: 17
    ordinal: 5143
    text: And the consequence for both will be that they are in the Fire, therein abiding. Such is the reward of evil-doers.
    translation: Pickthall
    original: فَكَانَ عَـٰقِبَتَهُمَآ أَنَّهُمَا فِى ٱلنَّارِ خَـٰلِدَيْنِ فِيهَا ۚ وَذَٰلِكَ جَزَٰٓؤُا۟ ٱلظَّـٰلِمِينَ
    arabicPlain: فكان عاقبتهما أنهما في النار خالدين فيها ۚ وذلك جزاء الظالمين
    surahName: Al-Hashr
    juz: 28
    manzil: 7
    ruku: 480
