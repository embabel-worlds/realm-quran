- type: Ayah
  data:
    ref: '59:5'
    scripture: quran
    name: Quran 59:5
    chapter: 59
    verse: 5
    ordinal: 5131
    text: Whatsoever palm-trees ye cut down or left standing on their roots, it was by Allah's leave, in order that He might confound the evil-livers.
    translation: Pickthall
    original: مَا قَطَعْتُم مِّن لِّينَةٍ أَوْ تَرَكْتُمُوهَا قَآئِمَةً عَلَىٰٓ أُصُولِهَا فَبِإِذْنِ ٱللَّهِ وَلِيُخْزِىَ ٱلْفَـٰسِقِينَ
    arabicPlain: ما قطعتم من لينة أو تركتموها قائمة على أصولها فبإذن الله وليخزي الفاسقين
    surahName: Al-Hashr
    juz: 28
    manzil: 7
    ruku: 479
