- type: Ayah
  data:
    ref: '59:4'
    scripture: quran
    name: Quran 59:4
    chapter: 59
    verse: 4
    ordinal: 5130
    text: That is because they were opposed to Allah and His messenger; and whoso is opposed to Allah, (for him) verily Allah is stern in reprisal.
    translation: Pickthall
    original: ذَٰلِكَ بِأَنَّهُمْ شَآقُّوا۟ ٱللَّهَ وَرَسُولَهُۥ ۖ وَمَن يُشَآقِّ ٱللَّهَ فَإِنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ
    arabicPlain: ذلك بأنهم شاقوا الله ورسوله ۖ ومن يشاق الله فإن الله شديد العقاب
    surahName: Al-Hashr
    juz: 28
