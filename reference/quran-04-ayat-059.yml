- type: Ayah
  data:
    ref: '59:12'
    scripture: quran
    name: Quran 59:12
    chapter: 59
    verse: 12
    ordinal: 5138
    text: (For) indeed if they are driven out they go not out with them, and indeed if they are attacked they help them not, and indeed if they had helped them they would have turned and fled, and then they would not have been victorious.
    translation: Pickthall
    original: لَئِنْ أُخْرِجُوا۟ لَا يَخْرُجُونَ مَعَهُمْ وَلَئِن قُوتِلُوا۟ لَا يَنصُرُونَهُمْ وَلَئِن نَّصَرُوهُمْ لَيُوَلُّنَّ ٱلْأَدْبَـٰرَ ثُمَّ لَا يُنصَرُونَ
    arabicPlain: لئن أخرجوا لا يخرجون معهم ولئن قوتلوا لا ينصرونهم ولئن نصروهم ليولن الأدبار ثم لا ينصرون
    surahName: Al-Hashr
    juz: 28
    manzil: 7
    ruku: 480
    page: 547
  relations:
  - predicate: IN
    to:
      type: Surah
