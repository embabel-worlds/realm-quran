- type: Ayah
  data:
    ref: '59:3'
    scripture: quran
    name: Quran 59:3
    chapter: 59
    verse: 3
    ordinal: 5129
    text: And if Allah had not decreed migration for them, He verily would have punished them in the world, and theirs in the Hereafter is the punishment of the Fire.
    translation: Pickthall
    original: وَلَوْلَآ أَن كَتَبَ ٱللَّهُ عَلَيْهِمُ ٱلْجَلَآءَ لَعَذَّبَهُمْ فِى ٱلدُّنْيَا ۖ وَلَهُمْ فِى ٱلْـَٔاخِرَةِ عَذَابُ ٱلنَّارِ
    arabicPlain: ولولا أن كتب الله عليهم الجلاء لعذبهم في الدنيا ۖ ولهم في الآخرة عذاب النار
    surahName: Al-Hashr
    juz: 28
    manzil: 7
    ruku: 479
