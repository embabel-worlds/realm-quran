    ordinal: 5127
    text: All that is in the heavens and all that is in the earth glorifieth Allah, and He is the Mighty, the Wise.
    translation: Pickthall
    original: بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ سَبَّحَ لِلَّهِ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ
    arabicPlain: بسم الله الرحمن الرحيم سبح لله ما في السماوات وما في الأرض ۖ وهو العزيز الحكيم
