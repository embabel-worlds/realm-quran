  data:
    ref: '59:15'
    scripture: quran
    name: Quran 59:15
    chapter: 59
    verse: 15
    ordinal: 5141
    text: On the likeness of those (who suffered) a short time before them, they taste the ill-effects of their own conduct, and theirs is painful punishment.
    translation: Pickthall
    original: كَمَثَلِ ٱلَّذِينَ مِن قَبْلِهِمْ قَرِيبًا ۖ ذَاقُوا۟ وَبَالَ أَمْرِهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌ
    arabicPlain: كمثل الذين من قبلهم قريبا ۖ ذاقوا وبال أمرهم ولهم عذاب أليم
    surahName: Al-Hashr
    juz: 28
    manzil: 7
