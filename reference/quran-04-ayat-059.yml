- type: Ayah
  data:
    ref: '59:6'
    scripture: quran
    name: Quran 59:6
    chapter: 59
    verse: 6
    ordinal: 5132
    text: And that which Allah gave as spoil unto His messenger from them, ye urged not any horse or riding-camel for the sake thereof, but Allah giveth His messenger lordship over whom He will. Allah is Able to do all things.
    translation: Pickthall
    original: وَمَآ أَفَآءَ ٱللَّهُ عَلَىٰ رَسُولِهِۦ مِنْهُمْ فَمَآ أَوْجَفْتُمْ عَلَيْهِ مِنْ خَيْلٍ وَلَا رِكَابٍ وَلَـٰكِنَّ ٱللَّهَ يُسَلِّطُ رُسُلَهُۥ عَلَىٰ مَن يَشَآءُ ۚ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ
    arabicPlain: وما أفاء الله على رسوله منهم فما أوجفتم عليه من خيل ولا ركاب ولكن الله يسلط رسله على من يشاء ۚ والله على كل شيء قدير
    surahName: Al-Hashr
    juz: 28
    manzil: 7
    ruku: 479
    page: 546
