- type: Ayah
  data:
    ref: '59:13'
    scripture: quran
    name: Quran 59:13
    chapter: 59
    verse: 13
    ordinal: 5139
    text: Ye are more awful as a fear in their bosoms than Allah. That is because they are a folk who understand not.
    translation: Pickthall
    original: لَأَنتُمْ أَشَدُّ رَهْبَةً فِى صُدُورِهِم مِّنَ ٱللَّهِ ۚ ذَٰلِكَ بِأَنَّهُمْ قَوْمٌ لَّا يَفْقَهُونَ
    arabicPlain: لأنتم أشد رهبة في صدورهم من الله ۚ ذلك بأنهم قوم لا يفقهون
    surahName: Al-Hashr
    juz: 28
    manzil: 7
    ruku: 480
