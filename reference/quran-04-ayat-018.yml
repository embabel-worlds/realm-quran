    text: 'So they twain set out till, when they were in the ship, he made a hole therein. (Moses) said: Hast thou made a hole therein to drown the folk thereof? Thou verily hast done a dreadful thing.'
    translation: Pickthall
    original: فَٱنطَلَقَا حَتَّىٰٓ إِذَا رَكِبَا فِى ٱلسَّفِينَةِ خَرَقَهَا ۖ قَالَ أَخَرَقْتَهَا لِتُغْرِقَ أَهْلَهَا لَقَدْ جِئْتَ شَيْـًٔا إِمْرًا
    arabicPlain: فانطلقا حتى إذا ركبا في السفينة خرقها ۖ قال أخرقتها لتغرق أهلها لقد جئت شيئا إمرا
