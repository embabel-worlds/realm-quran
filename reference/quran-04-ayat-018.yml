    chapter: 18
    verse: 62
    ordinal: 2202
    text: 'And when they had gone further, he said unto his servant: Bring us our breakfast. Verily we have found fatigue in this our journey.'
    translation: Pickthall
    original: فَلَمَّا جَاوَزَا قَالَ لِفَتَىٰهُ ءَاتِنَا غَدَآءَنَا لَقَدْ لَقِينَا مِن سَفَرِنَا هَـٰذَا نَصَبًا
    arabicPlain: فلما جاوزا قال لفتاه آتنا غداءنا لقد لقينا من سفرنا هذا نصبا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
