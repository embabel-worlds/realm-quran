  data:
    ref: '18:44'
    scripture: quran
    name: Quran 18:44
    chapter: 18
    verse: 44
    ordinal: 2184
    text: In this case is protection only from Allah, the True, He is Best for reward, and best for consequence.
    translation: Pickthall
    original: هُنَالِكَ ٱلْوَلَـٰيَةُ لِلَّهِ ٱلْحَقِّ ۚ هُوَ خَيْرٌ ثَوَابًا وَخَيْرٌ عُقْبًا
    arabicPlain: هنالك الولاية لله الحق ۚ هو خير ثوابا وخير عقبا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
    ruku: 256
