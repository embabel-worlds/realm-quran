  data:
    ref: '18:41'
    scripture: quran
    name: Quran 18:41
    chapter: 18
    verse: 41
    ordinal: 2181
    text: Or some morning the water thereof will be lost in the earth so that thou canst not make search for it.
    translation: Pickthall
    original: أَوْ يُصْبِحَ مَآؤُهَا غَوْرًا فَلَن تَسْتَطِيعَ لَهُۥ طَلَبًا
    arabicPlain: أو يصبح ماؤها غورا فلن تستطيع له طلبا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
