    name: Quran 18:12
    chapter: 18
    verse: 12
    ordinal: 2152
    text: And afterward We raised them up that We might know which of the two parties would best calculate the time that they had tarried.
    translation: Pickthall
    original: ثُمَّ بَعَثْنَـٰهُمْ لِنَعْلَمَ أَىُّ ٱلْحِزْبَيْنِ أَحْصَىٰ لِمَا لَبِثُوٓا۟ أَمَدًا
