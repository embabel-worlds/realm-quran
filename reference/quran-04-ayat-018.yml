    scripture: quran
    name: Quran 18:58
    chapter: 18
    verse: 58
    ordinal: 2198
    text: Thy Lord is the Forgiver, Full of Mercy. If He took them to task (now) for what they earn, He would hasten on the doom for them; but theirs is an appointed term from which they will find no escape.
    translation: Pickthall
    original: وَرَبُّكَ ٱلْغَفُورُ ذُو ٱلرَّحْمَةِ ۖ لَوْ يُؤَاخِذُهُم بِمَا كَسَبُوا۟ لَعَجَّلَ لَهُمُ ٱلْعَذَابَ ۚ بَل لَّهُم مَّوْعِدٌ لَّن يَجِدُوا۟ مِن دُونِهِۦ مَوْئِلًا
    arabicPlain: وربك الغفور ذو الرحمة ۖ لو يؤاخذهم بما كسبوا لعجل لهم العذاب ۚ بل لهم موعد لن يجدوا من دونه موئلا
