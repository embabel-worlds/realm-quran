    scripture: quran
    name: Quran 18:65
    chapter: 18
    verse: 65
    ordinal: 2205
    text: Then found they one of Our slaves, unto whom We had given mercy from Us, and had taught him knowledge from Our presence.
    translation: Pickthall
    original: فَوَجَدَا عَبْدًا مِّنْ عِبَادِنَآ ءَاتَيْنَـٰهُ رَحْمَةً مِّنْ عِندِنَا وَعَلَّمْنَـٰهُ مِن لَّدُنَّا عِلْمًا
    arabicPlain: فوجدا عبدا من عبادنا آتيناه رحمة من عندنا وعلمناه من لدنا علما
    surahName: Al-Kahf
