  data:
    ref: '18:47'
    scripture: quran
    name: Quran 18:47
    chapter: 18
    verse: 47
    ordinal: 2187
    text: And (bethink you of) the Day when we remove the hills and ye see the earth emerging, and We gather them together so as to leave not one of them behind.
    translation: Pickthall
    original: وَيَوْمَ نُسَيِّرُ ٱلْجِبَالَ وَتَرَى ٱلْأَرْضَ بَارِزَةً وَحَشَرْنَـٰهُمْ فَلَمْ نُغَادِرْ مِنْهُمْ أَحَدًا
    arabicPlain: ويوم نسير الجبال وترى الأرض بارزة وحشرناهم فلم نغادر منهم أحدا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
    ruku: 257
    page: 299
  relations:
