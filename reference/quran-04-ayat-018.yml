    chapter: 18
    verse: 51
    ordinal: 2191
    text: I made them not to witness the creation of the heavens and the earth, nor their own creation; nor choose I misleaders for (My) helpers.
    translation: Pickthall
    original: ۞ مَّآ أَشْهَدتُّهُمْ خَلْقَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَلَا خَلْقَ أَنفُسِهِمْ وَمَا كُنتُ مُتَّخِذَ ٱلْمُضِلِّينَ عَضُدًا
    arabicPlain: ۞ ما أشهدتهم خلق السماوات والأرض ولا خلق أنفسهم وما كنت متخذ المضلين عضدا
