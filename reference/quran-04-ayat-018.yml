  data:
    ref: '18:35'
    scripture: quran
    name: Quran 18:35
    chapter: 18
    verse: 35
    ordinal: 2175
    text: 'And he went into his garden, while he (thus) wronged himself. He said: I think not that all this will ever perish.'
    translation: Pickthall
    original: وَدَخَلَ جَنَّتَهُۥ وَهُوَ ظَالِمٌ لِّنَفْسِهِۦ قَالَ مَآ أَظُنُّ أَن تَبِيدَ هَـٰذِهِۦٓ أَبَدًا
    arabicPlain: ودخل جنته وهو ظالم لنفسه قال ما أظن أن تبيد هذه أبدا
    surahName: Al-Kahf
    juz: 15
