  data:
    ref: '18:25'
    scripture: quran
    name: Quran 18:25
    chapter: 18
    verse: 25
    ordinal: 2165
    text: And (it is said) they tarried in their Cave three hundred years and add nine.
    translation: Pickthall
    original: وَلَبِثُوا۟ فِى كَهْفِهِمْ ثَلَـٰثَ مِا۟ئَةٍ سِنِينَ وَٱزْدَادُوا۟ تِسْعًا
    arabicPlain: ولبثوا في كهفهم ثلاث مائة سنين وازدادوا تسعا
    surahName: Al-Kahf
    juz: 15
