  data:
    ref: '18:13'
    scripture: quran
    name: Quran 18:13
    chapter: 18
    verse: 13
    ordinal: 2153
    text: We narrate unto thee their story with truth. Lo! they were young men who believed in their Lord, and We increased them in guidance.
    translation: Pickthall
    original: نَّحْنُ نَقُصُّ عَلَيْكَ نَبَأَهُم بِٱلْحَقِّ ۚ إِنَّهُمْ فِتْيَةٌ ءَامَنُوا۟ بِرَبِّهِمْ وَزِدْنَـٰهُمْ هُدًى
    arabicPlain: نحن نقص عليك نبأهم بالحق ۚ إنهم فتية آمنوا بربهم وزدناهم هدى
