    text: 'And say not of anything: Lo! I shall do that tomorrow,'
    translation: Pickthall
    original: وَلَا تَقُولَنَّ لِشَا۟ىْءٍ إِنِّى فَاعِلٌ ذَٰلِكَ غَدًا
    arabicPlain: ولا تقولن لشيء إني فاعل ذلك غدا
