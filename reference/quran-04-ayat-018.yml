    scripture: quran
    name: Quran 18:54
    chapter: 18
    verse: 54
    ordinal: 2194
    text: And verily We have displayed for mankind in this Qur'an all manner of similitudes, but man is more than anything contentious.
    translation: Pickthall
    original: وَلَقَدْ صَرَّفْنَا فِى هَـٰذَا ٱلْقُرْءَانِ لِلنَّاسِ مِن كُلِّ مَثَلٍ ۚ وَكَانَ ٱلْإِنسَـٰنُ أَكْثَرَ شَىْءٍ جَدَلًا
    arabicPlain: ولقد صرفنا في هذا القرآن للناس من كل مثل ۚ وكان الإنسان أكثر شيء جدلا
