  data:
    ref: '18:32'
    scripture: quran
    name: Quran 18:32
    chapter: 18
    verse: 32
    ordinal: 2172
    text: 'Coin for them a similitude: Two men, unto one of whom We had assigned two gardens of grapes, and We had surrounded both with date-palms and had put between them tillage.'
    translation: Pickthall
    original: ۞ وَٱضْرِبْ لَهُم مَّثَلًا رَّجُلَيْنِ جَعَلْنَا لِأَحَدِهِمَا جَنَّتَيْنِ مِنْ أَعْنَـٰبٍ وَحَفَفْنَـٰهُمَا بِنَخْلٍ وَجَعَلْنَا بَيْنَهُمَا زَرْعًا
    arabicPlain: ۞ واضرب لهم مثلا رجلين جعلنا لأحدهما جنتين من أعناب وحففناهما بنخل وجعلنا بينهما زرعا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
    ruku: 256
