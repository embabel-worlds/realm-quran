  data:
    ref: '18:38'
    scripture: quran
    name: Quran 18:38
    chapter: 18
    verse: 38
    ordinal: 2178
    text: But He is Allah, my Lord, and I ascribe unto my Lord no partner.
    translation: Pickthall
    original: لَّـٰكِنَّا۠ هُوَ ٱللَّهُ رَبِّى وَلَآ أُشْرِكُ بِرَبِّىٓ أَحَدًا
    arabicPlain: لكنا هو الله ربي ولا أشرك بربي أحدا
