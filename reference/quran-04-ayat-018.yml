  data:
    ref: '18:27'
    scripture: quran
    name: Quran 18:27
    chapter: 18
    verse: 27
    ordinal: 2167
    text: And recite that which hath been revealed unto thee of the Scripture of thy Lord. There is none who can change His words, and thou wilt find no refuge beside Him.
    translation: Pickthall
    original: وَٱتْلُ مَآ أُوحِىَ إِلَيْكَ مِن كِتَابِ رَبِّكَ ۖ لَا مُبَدِّلَ لِكَلِمَـٰتِهِۦ وَلَن تَجِدَ مِن دُونِهِۦ مُلْتَحَدًا
    arabicPlain: واتل ما أوحي إليك من كتاب ربك ۖ لا مبدل لكلماته ولن تجد من دونه ملتحدا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
