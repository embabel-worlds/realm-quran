  data:
    ref: '18:46'
    scripture: quran
    name: Quran 18:46
    chapter: 18
    verse: 46
    ordinal: 2186
    text: Wealth and children are an ornament of the life of the world. But the good deeds which endure are better in thy Lord's sight for reward, and better in respect of hope.
    translation: Pickthall
    original: ٱلْمَالُ وَٱلْبَنُونَ زِينَةُ ٱلْحَيَوٰةِ ٱلدُّنْيَا ۖ وَٱلْبَـٰقِيَـٰتُ ٱلصَّـٰلِحَـٰتُ خَيْرٌ عِندَ رَبِّكَ ثَوَابًا وَخَيْرٌ أَمَلًا
    arabicPlain: المال والبنون زينة الحياة الدنيا ۖ والباقيات الصالحات خير عند ربك ثوابا وخير أملا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
    ruku: 257
    page: 299
