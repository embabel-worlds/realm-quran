  data:
    ref: '18:43'
    scripture: quran
    name: Quran 18:43
    chapter: 18
    verse: 43
    ordinal: 2183
    text: And he had no troop of men to help him as against Allah, nor could he save himself.
    translation: Pickthall
    original: وَلَمْ تَكُن لَّهُۥ فِئَةٌ يَنصُرُونَهُۥ مِن دُونِ ٱللَّهِ وَمَا كَانَ مُنتَصِرًا
    arabicPlain: ولم تكن له فئة ينصرونه من دون الله وما كان منتصرا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
    ruku: 256
    page: 298
  relations:
