    scripture: quran
    name: Quran 18:66
    chapter: 18
    verse: 66
    ordinal: 2206
    text: 'Moses said unto him: May I follow thee, to the end that thou mayst teach me right conduct of that which thou hast been taught?'
    translation: Pickthall
    original: قَالَ لَهُۥ مُوسَىٰ هَلْ أَتَّبِعُكَ عَلَىٰٓ أَن تُعَلِّمَنِ مِمَّا عُلِّمْتَ رُشْدًا
    arabicPlain: قال له موسى هل أتبعك على أن تعلمن مما علمت رشدا
