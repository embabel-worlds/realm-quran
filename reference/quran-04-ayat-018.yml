    scripture: quran
    name: Quran 18:81
    chapter: 18
    verse: 81
    ordinal: 2221
    text: And we intended that their Lord should change him for them for one better in purity and nearer to mercy.
    translation: Pickthall
    original: فَأَرَدْنَآ أَن يُبْدِلَهُمَا رَبُّهُمَا خَيْرًا مِّنْهُ زَكَوٰةً وَأَقْرَبَ رُحْمًا
    arabicPlain: فأردنا أن يبدلهما ربهما خيرا منه زكاة وأقرب رحما
    surahName: Al-Kahf
    juz: 16
    manzil: 4
    ruku: 261
