  data:
    ref: '18:20'
    scripture: quran
    name: Quran 18:20
    chapter: 18
    verse: 20
    ordinal: 2160
    text: For they, if they should come to know of you, will stone you or turn you back to their religion; then ye will never prosper.
    translation: Pickthall
    original: إِنَّهُمْ إِن يَظْهَرُوا۟ عَلَيْكُمْ يَرْجُمُوكُمْ أَوْ يُعِيدُوكُمْ فِى مِلَّتِهِمْ وَلَن تُفْلِحُوٓا۟ إِذًا أَبَدًا
    arabicPlain: إنهم إن يظهروا عليكم يرجموكم أو يعيدوكم في ملتهم ولن تفلحوا إذا أبدا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
    ruku: 254
