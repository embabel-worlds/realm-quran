    scripture: quran
    name: Quran 18:53
    chapter: 18
    verse: 53
    ordinal: 2193
    text: And the guilty behold the Fire and know that they are about to fall therein, and they find no way of escape thence.
    translation: Pickthall
    original: وَرَءَا ٱلْمُجْرِمُونَ ٱلنَّارَ فَظَنُّوٓا۟ أَنَّهُم مُّوَاقِعُوهَا وَلَمْ يَجِدُوا۟ عَنْهَا مَصْرِفًا
    arabicPlain: ورأى المجرمون النار فظنوا أنهم مواقعوها ولم يجدوا عنها مصرفا
