  data:
    ref: '18:29'
    scripture: quran
    name: Quran 18:29
    chapter: 18
    verse: 29
    ordinal: 2169
    text: 'Say: (It is) the truth from the Lord of you (all). Then whosoever will, let him believe, and whosoever will, let him disbelieve. Lo! We have prepared for disbelievers Fire. Its tent encloseth them. If they ask for showers, they will be showered with water like to molten lead which burneth the faces. Calamitous the drink and ill the resting-place!'
    translation: Pickthall
    original: وَقُلِ ٱلْحَقُّ مِن رَّبِّكُمْ ۖ فَمَن شَآءَ فَلْيُؤْمِن وَمَن شَآءَ فَلْيَكْفُرْ ۚ إِنَّآ أَعْتَدْنَا لِلظَّـٰلِمِينَ نَارًا أَحَاطَ بِهِمْ سُرَادِقُهَا ۚ وَإِن يَسْتَغِيثُوا۟ يُغَاثُوا۟ بِمَآءٍ كَٱلْمُهْلِ يَشْوِى ٱلْوُجُوهَ ۚ بِئْسَ ٱلشَّرَابُ وَسَآءَتْ مُرْتَفَقًا
    arabicPlain: وقل الحق من ربكم ۖ فمن شاء فليؤمن ومن شاء فليكفر ۚ إنا أعتدنا للظالمين نارا أحاط بهم سرادقها ۚ وإن يستغيثوا يغاثوا بماء كالمهل يشوي الوجوه ۚ بئس الشراب وساءت مرتفقا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
    ruku: 255
    page: 297
