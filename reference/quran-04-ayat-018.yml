  data:
    ref: '18:40'
    scripture: quran
    name: Quran 18:40
    chapter: 18
    verse: 40
    ordinal: 2180
    text: Yet it may be that my Lord will give me better than thy garden, and will send on it a bolt from heaven, and some morning it will be a smooth hillside,
    translation: Pickthall
    original: فَعَسَىٰ رَبِّىٓ أَن يُؤْتِيَنِ خَيْرًا مِّن جَنَّتِكَ وَيُرْسِلَ عَلَيْهَا حُسْبَانًا مِّنَ ٱلسَّمَآءِ فَتُصْبِحَ صَعِيدًا زَلَقًا
    arabicPlain: فعسى ربي أن يؤتين خيرا من جنتك ويرسل عليها حسبانا من السماء فتصبح صعيدا زلقا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
