    chapter: 18
    verse: 60
    ordinal: 2200
    text: 'And when Moses said unto his servant: I will not give up until I reach the point where the two rivers meet, though I march on for ages.'
    translation: Pickthall
    original: وَإِذْ قَالَ مُوسَىٰ لِفَتَىٰهُ لَآ أَبْرَحُ حَتَّىٰٓ أَبْلُغَ مَجْمَعَ ٱلْبَحْرَيْنِ أَوْ أَمْضِىَ حُقُبًا
    arabicPlain: وإذ قال موسى لفتاه لا أبرح حتى أبلغ مجمع البحرين أو أمضي حقبا
    surahName: Al-Kahf
