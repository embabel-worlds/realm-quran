    name: Quran 18:68
    chapter: 18
    verse: 68
    ordinal: 2208
    text: How canst thou bear with that whereof thou canst not compass any knowledge?
    translation: Pickthall
    original: وَكَيْفَ تَصْبِرُ عَلَىٰ مَا لَمْ تُحِطْ بِهِۦ خُبْرًا
    arabicPlain: وكيف تصبر على ما لم تحط به خبرا
