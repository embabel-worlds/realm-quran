    scripture: quran
    name: Quran 18:61
    chapter: 18
    verse: 61
    ordinal: 2201
    text: And when they reached the point where the two met, they forgot their fish, and it took its way into the waters, being free.
    translation: Pickthall
    original: فَلَمَّا بَلَغَا مَجْمَعَ بَيْنِهِمَا نَسِيَا حُوتَهُمَا فَٱتَّخَذَ سَبِيلَهُۥ فِى ٱلْبَحْرِ سَرَبًا
    arabicPlain: فلما بلغا مجمع بينهما نسيا حوتهما فاتخذ سبيله في البحر سربا
