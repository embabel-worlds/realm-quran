  data:
    ref: '18:14'
    scripture: quran
    name: Quran 18:14
    chapter: 18
    verse: 14
    ordinal: 2154
    text: 'And We made firm their hearts when they stood forth and said: Our Lord is the Lord of the heavens and the earth. We cry unto no Allah beside Him, for then should we utter an enormity.'
    translation: Pickthall
    original: وَرَبَطْنَا عَلَىٰ قُلُوبِهِمْ إِذْ قَامُوا۟ فَقَالُوا۟ رَبُّنَا رَبُّ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ لَن نَّدْعُوَا۟ مِن دُونِهِۦٓ إِلَـٰهًا ۖ لَّقَدْ قُلْنَآ إِذًا شَطَطًا
    arabicPlain: وربطنا على قلوبهم إذ قاموا فقالوا ربنا رب السماوات والأرض لن ندعو من دونه إلها ۖ لقد قلنا إذا شططا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
