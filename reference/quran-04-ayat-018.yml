  data:
    ref: '18:36'
    scripture: quran
    name: Quran 18:36
    chapter: 18
    verse: 36
    ordinal: 2176
    text: I think not that the Hour will ever come, and if indeed I am brought back unto my Lord I surely shall find better than this as a resort.
    translation: Pickthall
    original: وَمَآ أَظُنُّ ٱلسَّاعَةَ قَآئِمَةً وَلَئِن رُّدِدتُّ إِلَىٰ رَبِّى لَأَجِدَنَّ خَيْرًا مِّنْهَا مُنقَلَبًا
    arabicPlain: وما أظن الساعة قائمة ولئن رددت إلى ربي لأجدن خيرا منها منقلبا
    surahName: Al-Kahf
