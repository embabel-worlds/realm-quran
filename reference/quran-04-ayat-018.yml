    name: Quran 18:78
    chapter: 18
    verse: 78
    ordinal: 2218
    text: 'He said: This is the parting between thee and me! I will announce unto thee the interpretation of that thou couldst not bear with patience.'
    translation: Pickthall
    original: قَالَ هَـٰذَا فِرَاقُ بَيْنِى وَبَيْنِكَ ۚ سَأُنَبِّئُكَ بِتَأْوِيلِ مَا لَمْ تَسْتَطِع عَّلَيْهِ صَبْرًا
    arabicPlain: قال هذا فراق بيني وبينك ۚ سأنبئك بتأويل ما لم تستطع عليه صبرا
    surahName: Al-Kahf
