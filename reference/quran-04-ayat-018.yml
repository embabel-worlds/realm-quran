    translation: Pickthall
    original: وَأَمَّا مَنْ ءَامَنَ وَعَمِلَ صَـٰلِحًا فَلَهُۥ جَزَآءً ٱلْحُسْنَىٰ ۖ وَسَنَقُولُ لَهُۥ مِنْ أَمْرِنَا يُسْرًا
    arabicPlain: وأما من آمن وعمل صالحا فله جزاء الحسنى ۖ وسنقول له من أمرنا يسرا
    surahName: Al-Kahf
