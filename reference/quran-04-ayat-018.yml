    name: Quran 18:33
    chapter: 18
    verse: 33
    ordinal: 2173
    text: Each of the gardens gave its fruit and withheld naught thereof. And We caused a river to gush forth therein.
    translation: Pickthall
    original: كِلْتَا ٱلْجَنَّتَيْنِ ءَاتَتْ أُكُلَهَا وَلَمْ تَظْلِم مِّنْهُ شَيْـًٔا ۚ وَفَجَّرْنَا خِلَـٰلَهُمَا نَهَرًا
    arabicPlain: كلتا الجنتين آتت أكلها ولم تظلم منه شيئا ۚ وفجرنا خلالهما نهرا
    surahName: Al-Kahf
    juz: 15
