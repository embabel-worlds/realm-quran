  data:
    ref: '18:15'
    scripture: quran
    name: Quran 18:15
    chapter: 18
    verse: 15
    ordinal: 2155
    text: These, our people, have chosen (other) gods beside Him though they bring no clear warrant (vouchsafed) to them. And who doth greater wrong than he who inventeth a lie concerning Allah?
    translation: Pickthall
    original: هَـٰٓؤُلَآءِ قَوْمُنَا ٱتَّخَذُوا۟ مِن دُونِهِۦٓ ءَالِهَةً ۖ لَّوْلَا يَأْتُونَ عَلَيْهِم بِسُلْطَـٰنٍۭ بَيِّنٍ ۖ فَمَنْ أَظْلَمُ مِمَّنِ ٱفْتَرَىٰ عَلَى ٱللَّهِ كَذِبًا
    arabicPlain: هؤلاء قومنا اتخذوا من دونه آلهة ۖ لولا يأتون عليهم بسلطان بين ۖ فمن أظلم ممن افترى على الله كذبا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
    ruku: 253
