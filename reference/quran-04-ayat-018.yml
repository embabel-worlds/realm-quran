  data:
    ref: '18:24'
    scripture: quran
    name: Quran 18:24
    chapter: 18
    verse: 24
    ordinal: 2164
    text: 'Except if Allah will. And remember thy Lord when thou forgettest, and say: It may be that my Lord guideth me unto a nearer way of truth than this.'
    translation: Pickthall
    original: إِلَّآ أَن يَشَآءَ ٱللَّهُ ۚ وَٱذْكُر رَّبَّكَ إِذَا نَسِيتَ وَقُلْ عَسَىٰٓ أَن يَهْدِيَنِ رَبِّى لِأَقْرَبَ مِنْ هَـٰذَا رَشَدًا
    arabicPlain: إلا أن يشاء الله ۚ واذكر ربك إذا نسيت وقل عسى أن يهدين ربي لأقرب من هذا رشدا
