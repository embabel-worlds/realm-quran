    scripture: quran
    name: Quran 18:67
    chapter: 18
    verse: 67
    ordinal: 2207
    text: 'He said: Lo! thou canst not bear with me.'
    translation: Pickthall
    original: قَالَ إِنَّكَ لَن تَسْتَطِيعَ مَعِىَ صَبْرًا
    arabicPlain: قال إنك لن تستطيع معي صبرا
