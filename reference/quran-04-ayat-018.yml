    translation: Pickthall
    original: وَأَمَّا ٱلْغُلَـٰمُ فَكَانَ أَبَوَاهُ مُؤْمِنَيْنِ فَخَشِينَآ أَن يُرْهِقَهُمَا طُغْيَـٰنًا وَكُفْرًا
    arabicPlain: وأما الغلام فكان أبواه مؤمنين فخشينا أن يرهقهما طغيانا وكفرا
    surahName: Al-Kahf
    juz: 16
