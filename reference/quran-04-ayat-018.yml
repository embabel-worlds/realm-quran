    chapter: 18
    verse: 64
    ordinal: 2204
    text: 'He said: This is that which we have been seeking. So they retraced their steps again.'
    translation: Pickthall
    original: قَالَ ذَٰلِكَ مَا كُنَّا نَبْغِ ۚ فَٱرْتَدَّا عَلَىٰٓ ءَاثَارِهِمَا قَصَصًا
    arabicPlain: قال ذلك ما كنا نبغ ۚ فارتدا على آثارهما قصصا
