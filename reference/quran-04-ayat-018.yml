  data:
    ref: '18:34'
    scripture: quran
    name: Quran 18:34
    chapter: 18
    verse: 34
    ordinal: 2174
    text: 'And he had fruit. And he said unto his comrade, when he spake with him: I am more than thee in wealth, and stronger in respect of men.'
    translation: Pickthall
    original: وَكَانَ لَهُۥ ثَمَرٌ فَقَالَ لِصَـٰحِبِهِۦ وَهُوَ يُحَاوِرُهُۥٓ أَنَا۠ أَكْثَرُ مِنكَ مَالًا وَأَعَزُّ نَفَرًا
    arabicPlain: وكان له ثمر فقال لصاحبه وهو يحاوره أنا أكثر منك مالا وأعز نفرا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
