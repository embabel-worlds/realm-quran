    chapter: 18
    verse: 59
    ordinal: 2199
    text: And (all) those townships! We destroyed them when they did wrong, and We appointed a fixed time for their destruction.
    translation: Pickthall
    original: وَتِلْكَ ٱلْقُرَىٰٓ أَهْلَكْنَـٰهُمْ لَمَّا ظَلَمُوا۟ وَجَعَلْنَا لِمَهْلِكِهِم مَّوْعِدًا
    arabicPlain: وتلك القرى أهلكناهم لما ظلموا وجعلنا لمهلكهم موعدا
