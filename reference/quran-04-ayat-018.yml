  data:
    ref: '18:56'
    scripture: quran
    name: Quran 18:56
    chapter: 18
    verse: 56
    ordinal: 2196
    text: We send not the messengers save as bearers of good news and warners. Those who disbelieve contend with falsehood in order to refute the Truth thereby. And they take Our revelations and that wherewith they are threatened as a jest.
    translation: Pickthall
    original: وَمَا نُرْسِلُ ٱلْمُرْسَلِينَ إِلَّا مُبَشِّرِينَ وَمُنذِرِينَ ۚ وَيُجَـٰدِلُ ٱلَّذِينَ كَفَرُوا۟ بِٱلْبَـٰطِلِ لِيُدْحِضُوا۟ بِهِ ٱلْحَقَّ ۖ وَٱتَّخَذُوٓا۟ ءَايَـٰتِى وَمَآ أُنذِرُوا۟ هُزُوًا
    arabicPlain: وما نرسل المرسلين إلا مبشرين ومنذرين ۚ ويجادل الذين كفروا بالباطل ليدحضوا به الحق ۖ واتخذوا آياتي وما أنذروا هزوا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
    ruku: 259
    page: 300
