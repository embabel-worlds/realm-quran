- type: Ayah
  data:
    ref: '18:18'
    scripture: quran
    name: Quran 18:18
    chapter: 18
    verse: 18
    ordinal: 2158
    text: And thou wouldst have deemed them waking though they were asleep, and We caused them to turn over to the right and the left, and their dog stretching out his paws on the threshold. If thou hadst observed them closely thou hadst assuredly turned away from them in flight, and hadst been filled with awe of them.
    translation: Pickthall
    original: وَتَحْسَبُهُمْ أَيْقَاظًا وَهُمْ رُقُودٌ ۚ وَنُقَلِّبُهُمْ ذَاتَ ٱلْيَمِينِ وَذَاتَ ٱلشِّمَالِ ۖ وَكَلْبُهُم بَـٰسِطٌ ذِرَاعَيْهِ بِٱلْوَصِيدِ ۚ لَوِ ٱطَّلَعْتَ عَلَيْهِمْ لَوَلَّيْتَ مِنْهُمْ فِرَارًا وَلَمُلِئْتَ مِنْهُمْ رُعْبًا
    arabicPlain: وتحسبهم أيقاظا وهم رقود ۚ ونقلبهم ذات اليمين وذات الشمال ۖ وكلبهم باسط ذراعيه بالوصيد ۚ لو اطلعت عليهم لوليت منهم فرارا ولملئت منهم رعبا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
    ruku: 254
    page: 295
