  data:
    ref: '18:30'
    scripture: quran
    name: Quran 18:30
    chapter: 18
    verse: 30
    ordinal: 2170
    text: Lo! as for those who believe and do good works - Lo! We suffer not the reward of one whose work is goodly to be lost.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا
    arabicPlain: إن الذين آمنوا وعملوا الصالحات إنا لا نضيع أجر من أحسن عملا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
    ruku: 255
    page: 297
  relations:
