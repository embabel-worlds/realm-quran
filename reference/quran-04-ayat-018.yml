  data:
    ref: '18:26'
    scripture: quran
    name: Quran 18:26
    chapter: 18
    verse: 26
    ordinal: 2166
    text: 'Say: Allah is Best Aware how long they tarried. His is the Invisible of the heavens and the earth. How clear of sight is He and keen of hearing! They have no protecting friend beside Him, and He maketh none to share in His government.'
    translation: Pickthall
    original: قُلِ ٱللَّهُ أَعْلَمُ بِمَا لَبِثُوا۟ ۖ لَهُۥ غَيْبُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۖ أَبْصِرْ بِهِۦ وَأَسْمِعْ ۚ مَا لَهُم مِّن دُونِهِۦ مِن وَلِىٍّ وَلَا يُشْرِكُ فِى حُكْمِهِۦٓ أَحَدًا
    arabicPlain: قل الله أعلم بما لبثوا ۖ له غيب السماوات والأرض ۖ أبصر به وأسمع ۚ ما لهم من دونه من ولي ولا يشرك في حكمه أحدا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
    ruku: 255
    page: 296
