  data:
    ref: '18:39'
    scripture: quran
    name: Quran 18:39
    chapter: 18
    verse: 39
    ordinal: 2179
    text: 'If only, when thou enteredst thy garden, thou hadst said: That which Allah willeth (will come to pass)! There is no strength save in Allah! Though thou seest me as less than thee in wealth and children,'
    translation: Pickthall
    original: وَلَوْلَآ إِذْ دَخَلْتَ جَنَّتَكَ قُلْتَ مَا شَآءَ ٱللَّهُ لَا قُوَّةَ إِلَّا بِٱللَّهِ ۚ إِن تَرَنِ أَنَا۠ أَقَلَّ مِنكَ مَالًا وَوَلَدًا
    arabicPlain: ولولا إذ دخلت جنتك قلت ما شاء الله لا قوة إلا بالله ۚ إن ترن أنا أقل منك مالا وولدا
    surahName: Al-Kahf
    juz: 15
    manzil: 4
