    name: Quran 20:66
    chapter: 20
    verse: 66
    ordinal: 2414
    text: 'He said: Nay, do ye throw! Then lo! their cords and their staves, by their magic, appeared to him as though they ran.'
    translation: Pickthall
    original: قَالَ بَلْ أَلْقُوا۟ ۖ فَإِذَا حِبَالُهُمْ وَعِصِيُّهُمْ يُخَيَّلُ إِلَيْهِ مِن سِحْرِهِمْ أَنَّهَا تَسْعَىٰ
    arabicPlain: قال بل ألقوا ۖ فإذا حبالهم وعصيهم يخيل إليه من سحرهم أنها تسعى
    surahName: Taa-Haa
