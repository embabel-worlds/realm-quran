  data:
    ref: 20:131
    scripture: quran
    name: Quran 20:131
    chapter: 20
    verse: 131
    ordinal: 2479
    text: And strain not thine eyes toward that which We cause some wedded pairs among them to enjoy, the flower of the life of the world, that We may try them thereby. The provision of thy Lord is better and more lasting.
    translation: Pickthall
    original: وَلَا تَمُدَّنَّ عَيْنَيْكَ إِلَىٰ مَا مَتَّعْنَا بِهِۦٓ أَزْوَٰجًا مِّنْهُمْ زَهْرَةَ ٱلْحَيَوٰةِ ٱلدُّنْيَا لِنَفْتِنَهُمْ فِيهِ ۚ وَرِزْقُ رَبِّكَ خَيْرٌ وَأَبْقَىٰ
    arabicPlain: ولا تمدن عينيك إلى ما متعنا به أزواجا منهم زهرة الحياة الدنيا لنفتنهم فيه ۚ ورزق ربك خير وأبقى
    surahName: Taa-Haa
    juz: 16
    manzil: 4
    ruku: 277
    page: 321
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '20'
  - predicate: IN_PORTION
    to:
