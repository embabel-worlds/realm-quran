    scripture: quran
    name: Quran 20:65
    chapter: 20
    verse: 65
    ordinal: 2413
    text: 'They said: O Moses! Either throw first, or let us be the first to throw?'
    translation: Pickthall
    original: قَالُوا۟ يَـٰمُوسَىٰٓ إِمَّآ أَن تُلْقِىَ وَإِمَّآ أَن نَّكُونَ أَوَّلَ مَنْ أَلْقَىٰ
    arabicPlain: قالوا يا موسى إما أن تلقي وإما أن نكون أول من ألقى
