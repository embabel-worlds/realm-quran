  data:
    ref: 20:120
    scripture: quran
    name: Quran 20:120
    chapter: 20
    verse: 120
    ordinal: 2468
    text: 'But the devil whispered to him, saying: O Adam! Shall I show thee the tree of immortality and power that wasteth not away?'
    translation: Pickthall
    original: فَوَسْوَسَ إِلَيْهِ ٱلشَّيْطَـٰنُ قَالَ يَـٰٓـَٔادَمُ هَلْ أَدُلُّكَ عَلَىٰ شَجَرَةِ ٱلْخُلْدِ وَمُلْكٍ لَّا يَبْلَىٰ
    arabicPlain: فوسوس إليه الشيطان قال يا آدم هل أدلك على شجرة الخلد وملك لا يبلى
    surahName: Taa-Haa
