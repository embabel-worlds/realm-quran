    scripture: quran
    name: Quran 20:122
    chapter: 20
    verse: 122
    ordinal: 2470
    text: Then his Lord chose him, and relented toward him, and guided him.
    translation: Pickthall
    original: ثُمَّ ٱجْتَبَـٰهُ رَبُّهُۥ فَتَابَ عَلَيْهِ وَهَدَىٰ
    arabicPlain: ثم اجتباه ربه فتاب عليه وهدى
