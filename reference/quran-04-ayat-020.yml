    scripture: quran
    name: Quran 20:70
    chapter: 20
    verse: 70
    ordinal: 2418
    text: 'Then the wizards were (all) flung down prostrate, crying: We believe in the Lord of Aaron and Moses.'
    translation: Pickthall
    original: فَأُلْقِىَ ٱلسَّحَرَةُ سُجَّدًا قَالُوٓا۟ ءَامَنَّا بِرَبِّ هَـٰرُونَ وَمُوسَىٰ
    arabicPlain: فألقي السحرة سجدا قالوا آمنا برب هارون وموسى
    surahName: Taa-Haa
    juz: 16
