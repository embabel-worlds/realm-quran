  data:
    ref: 20:132
    scripture: quran
    name: Quran 20:132
    chapter: 20
    verse: 132
    ordinal: 2480
    text: 'And enjoin upon thy people worship, and be constant therein. We ask not of thee a provision: We provided for thee. And the sequel is for righteousness.'
    translation: Pickthall
    original: وَأْمُرْ أَهْلَكَ بِٱلصَّلَوٰةِ وَٱصْطَبِرْ عَلَيْهَا ۖ لَا نَسْـَٔلُكَ رِزْقًا ۖ نَّحْنُ نَرْزُقُكَ ۗ وَٱلْعَـٰقِبَةُ لِلتَّقْوَىٰ
    arabicPlain: وأمر أهلك بالصلاة واصطبر عليها ۖ لا نسألك رزقا ۖ نحن نرزقك ۗ والعاقبة للتقوى
    surahName: Taa-Haa
    juz: 16
    manzil: 4
    ruku: 277
    page: 321
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '20'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-16
- type: Ayah
  data:
    ref: 20:133
    scripture: quran
    name: Quran 20:133
    chapter: 20
    verse: 133
    ordinal: 2481
    text: 'And they say: If only he would bring us a miracle from his Lord! Hath there not come unto them the proof of what is in the former scriptures?'
    translation: Pickthall
    original: وَقَالُوا۟ لَوْلَا يَأْتِينَا بِـَٔايَةٍ مِّن رَّبِّهِۦٓ ۚ أَوَلَمْ تَأْتِهِم بَيِّنَةُ مَا فِى ٱلصُّحُفِ ٱلْأُولَىٰ
    arabicPlain: وقالوا لولا يأتينا بآية من ربه ۚ أولم تأتهم بينة ما في الصحف الأولى
    surahName: Taa-Haa
    juz: 16
    manzil: 4
    ruku: 277
    page: 321
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '20'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-16
- type: Ayah
  data:
    ref: 20:134
    scripture: quran
    name: Quran 20:134
    chapter: 20
    verse: 134
    ordinal: 2482
    text: 'And if we had destroyed them with some punishment before it, they would assuredly have said: Our Lord! If only Thou hadst sent unto us a messenger, so that we might have followed Thy revelations before we were (thus) humbled and disgraced!'
    translation: Pickthall
    original: وَلَوْ أَنَّآ أَهْلَكْنَـٰهُم بِعَذَابٍ مِّن قَبْلِهِۦ لَقَالُوا۟ رَبَّنَا لَوْلَآ أَرْسَلْتَ إِلَيْنَا رَسُولًا فَنَتَّبِعَ ءَايَـٰتِكَ مِن قَبْلِ أَن نَّذِلَّ وَنَخْزَىٰ
    arabicPlain: ولو أنا أهلكناهم بعذاب من قبله لقالوا ربنا لولا أرسلت إلينا رسولا فنتبع آياتك من قبل أن نذل ونخزى
    surahName: Taa-Haa
    juz: 16
    manzil: 4
    ruku: 277
    page: 321
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '20'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-16
- type: Ayah
  data:
    ref: 20:135
    scripture: quran
    name: Quran 20:135
    chapter: 20
    verse: 135
    ordinal: 2483
    text: 'Say: Each is awaiting; so await ye! Ye will come to know who are the owners of the path of equity, and who is right.'
    translation: Pickthall
    original: قُلْ كُلٌّ مُّتَرَبِّصٌ فَتَرَبَّصُوا۟ ۖ فَسَتَعْلَمُونَ مَنْ أَصْحَـٰبُ ٱلصِّرَٰطِ ٱلسَّوِىِّ وَمَنِ ٱهْتَدَىٰ
    arabicPlain: قل كل متربص فتربصوا ۖ فستعلمون من أصحاب الصراط السوي ومن اهتدى
    surahName: Taa-Haa
    juz: 16
    manzil: 4
    ruku: 277
    page: 321
  relations:
