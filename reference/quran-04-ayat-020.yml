  data:
    ref: 20:129
    scripture: quran
    name: Quran 20:129
    chapter: 20
    verse: 129
    ordinal: 2477
    text: And but for a decree that had already gone forth from thy Lord, and a term already fixed, the judgment would have been inevitable (in this world).
    translation: Pickthall
    original: وَلَوْلَا كَلِمَةٌ سَبَقَتْ مِن رَّبِّكَ لَكَانَ لِزَامًا وَأَجَلٌ مُّسَمًّى
    arabicPlain: ولولا كلمة سبقت من ربك لكان لزاما وأجل مسمى
    surahName: Taa-Haa
    juz: 16
    manzil: 4
    ruku: 277
    page: 321
