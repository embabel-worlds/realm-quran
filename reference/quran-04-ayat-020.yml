    scripture: quran
    name: Quran 20:64
    chapter: 20
    verse: 64
    ordinal: 2412
    text: So arrange your plan, and come in battle line. Whoso is uppermost this day will be indeed successful.
    translation: Pickthall
    original: فَأَجْمِعُوا۟ كَيْدَكُمْ ثُمَّ ٱئْتُوا۟ صَفًّا ۚ وَقَدْ أَفْلَحَ ٱلْيَوْمَ مَنِ ٱسْتَعْلَىٰ
    arabicPlain: فأجمعوا كيدكم ثم ائتوا صفا ۚ وقد أفلح اليوم من استعلى
