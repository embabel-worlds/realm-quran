  data:
    ref: 20:72
    scripture: quran
    name: Quran 20:72
    chapter: 20
    verse: 72
    ordinal: 2420
    text: 'They said: We choose thee not above the clear proofs that have come unto us, and above Him Who created us. So decree what thou wilt decree. Thou wilt end for us only this life of the world.'
    translation: Pickthall
    original: قَالُوا۟ لَن نُّؤْثِرَكَ عَلَىٰ مَا جَآءَنَا مِنَ ٱلْبَيِّنَـٰتِ وَٱلَّذِى فَطَرَنَا ۖ فَٱقْضِ مَآ أَنتَ قَاضٍ ۖ إِنَّمَا تَقْضِى هَـٰذِهِ ٱلْحَيَوٰةَ ٱلدُّنْيَآ
    arabicPlain: قالوا لن نؤثرك على ما جاءنا من البينات والذي فطرنا ۖ فاقض ما أنت قاض ۖ إنما تقضي هذه الحياة الدنيا
    surahName: Taa-Haa
    juz: 16
    manzil: 4
    ruku: 272
    page: 316
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '20'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-16
