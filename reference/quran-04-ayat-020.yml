  data:
    ref: 20:127
    scripture: quran
    name: Quran 20:127
    chapter: 20
    verse: 127
    ordinal: 2475
    text: Thus do We reward him who is prodigal and believeth not the revelations of his Lord; and verily the doom of the Hereafter will be sterner and more lasting.
    translation: Pickthall
    original: وَكَذَٰلِكَ نَجْزِى مَنْ أَسْرَفَ وَلَمْ يُؤْمِنۢ بِـَٔايَـٰتِ رَبِّهِۦ ۚ وَلَعَذَابُ ٱلْـَٔاخِرَةِ أَشَدُّ وَأَبْقَىٰٓ
    arabicPlain: وكذلك نجزي من أسرف ولم يؤمن بآيات ربه ۚ ولعذاب الآخرة أشد وأبقى
    surahName: Taa-Haa
    juz: 16
