  data:
    ref: 20:128
    scripture: quran
    name: Quran 20:128
    chapter: 20
    verse: 128
    ordinal: 2476
    text: Is it not a guidance for them (to know) how many a generation We destroyed before them, amid whose dwellings they walk? Lo! therein verily are signs for men of thought.
    translation: Pickthall
    original: أَفَلَمْ يَهْدِ لَهُمْ كَمْ أَهْلَكْنَا قَبْلَهُم مِّنَ ٱلْقُرُونِ يَمْشُونَ فِى مَسَـٰكِنِهِمْ ۗ إِنَّ فِى ذَٰلِكَ لَـَٔايَـٰتٍ لِّأُو۟لِى ٱلنُّهَىٰ
    arabicPlain: أفلم يهد لهم كم أهلكنا قبلهم من القرون يمشون في مساكنهم ۗ إن في ذلك لآيات لأولي النهى
    surahName: Taa-Haa
    juz: 16
    manzil: 4
    ruku: 276
    page: 321
