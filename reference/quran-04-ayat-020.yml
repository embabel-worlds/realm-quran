  data:
    ref: 20:123
    scripture: quran
    name: Quran 20:123
    chapter: 20
    verse: 123
    ordinal: 2471
    text: 'He said: Go down hence, both of you, one of you a foe unto the other. But when there come unto you from Me a guidance, then whoso followeth My guidance, he will not go astray nor come to grief.'
    translation: Pickthall
    original: قَالَ ٱهْبِطَا مِنْهَا جَمِيعًۢا ۖ بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ ۖ فَإِمَّا يَأْتِيَنَّكُم مِّنِّى هُدًى فَمَنِ ٱتَّبَعَ هُدَاىَ فَلَا يَضِلُّ وَلَا يَشْقَىٰ
    arabicPlain: قال اهبطا منها جميعا ۖ بعضكم لبعض عدو ۖ فإما يأتينكم مني هدى فمن اتبع هداي فلا يضل ولا يشقى
    surahName: Taa-Haa
    juz: 16
    manzil: 4
    ruku: 276
    page: 320
