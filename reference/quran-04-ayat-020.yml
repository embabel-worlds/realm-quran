  data:
    ref: 20:69
    scripture: quran
    name: Quran 20:69
    chapter: 20
    verse: 69
    ordinal: 2417
    text: Throw that which is in thy right hand! It will eat up that which they have made. Lo! that which they have made is but a wizard's artifice, and a wizard shall not be successful to whatever point (of skill) he may attain.
    translation: Pickthall
    original: وَأَلْقِ مَا فِى يَمِينِكَ تَلْقَفْ مَا صَنَعُوٓا۟ ۖ إِنَّمَا صَنَعُوا۟ كَيْدُ سَـٰحِرٍ ۖ وَلَا يُفْلِحُ ٱلسَّاحِرُ حَيْثُ أَتَىٰ
    arabicPlain: وألق ما في يمينك تلقف ما صنعوا ۖ إنما صنعوا كيد ساحر ۖ ولا يفلح الساحر حيث أتى
    surahName: Taa-Haa
