  data:
    ref: 20:125
    scripture: quran
    name: Quran 20:125
    chapter: 20
    verse: 125
    ordinal: 2473
    text: 'He will say: My Lord! Wherefor hast Thou gathered me (hither) blind, when I was wont to see?'
    translation: Pickthall
    original: قَالَ رَبِّ لِمَ حَشَرْتَنِىٓ أَعْمَىٰ وَقَدْ كُنتُ بَصِيرًا
    arabicPlain: قال رب لم حشرتني أعمى وقد كنت بصيرا
    surahName: Taa-Haa
    juz: 16
    manzil: 4
    ruku: 276
