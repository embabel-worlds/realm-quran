  data:
    ref: 20:121
    scripture: quran
    name: Quran 20:121
    chapter: 20
    verse: 121
    ordinal: 2469
    text: Then they twain ate thereof, so that their shame became apparent unto them, and they began to hide by heaping on themselves some of the leaves of the Garden. And Adam disobeyed his Lord, so went astray.
    translation: Pickthall
    original: فَأَكَلَا مِنْهَا فَبَدَتْ لَهُمَا سَوْءَٰتُهُمَا وَطَفِقَا يَخْصِفَانِ عَلَيْهِمَا مِن وَرَقِ ٱلْجَنَّةِ ۚ وَعَصَىٰٓ ءَادَمُ رَبَّهُۥ فَغَوَىٰ
    arabicPlain: فأكلا منها فبدت لهما سوآتهما وطفقا يخصفان عليهما من ورق الجنة ۚ وعصى آدم ربه فغوى
