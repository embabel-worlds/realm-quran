    name: Quran 20:61
    chapter: 20
    verse: 61
    ordinal: 2409
    text: 'Moses said unto them: Woe unto you! Invent not a lie against Allah, lest He extirpate you by some punishment. He who lieth faileth miserably.'
    translation: Pickthall
    original: قَالَ لَهُم مُّوسَىٰ وَيْلَكُمْ لَا تَفْتَرُوا۟ عَلَى ٱللَّهِ كَذِبًا فَيُسْحِتَكُم بِعَذَابٍ ۖ وَقَدْ خَابَ مَنِ ٱفْتَرَىٰ
    arabicPlain: قال لهم موسى ويلكم لا تفتروا على الله كذبا فيسحتكم بعذاب ۖ وقد خاب من افترى
