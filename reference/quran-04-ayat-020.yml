    text: 'And when We said unto the angels: Fall prostrate before Adam, they fell prostrate (all) save Iblis; he refused.'
    translation: Pickthall
    original: وَإِذْ قُلْنَا لِلْمَلَـٰٓئِكَةِ ٱسْجُدُوا۟ لِـَٔادَمَ فَسَجَدُوٓا۟ إِلَّآ إِبْلِيسَ أَبَىٰ
    arabicPlain: وإذ قلنا للملائكة اسجدوا لآدم فسجدوا إلا إبليس أبى
    surahName: Taa-Haa
    juz: 16
