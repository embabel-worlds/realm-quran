  data:
    ref: 20:124
    scripture: quran
    name: Quran 20:124
    chapter: 20
    verse: 124
    ordinal: 2472
    text: But he who turneth away from remembrance of Me, his will be a narrow life, and I shall bring him blind to the assembly on the Day of Resurrection.
    translation: Pickthall
    original: وَمَنْ أَعْرَضَ عَن ذِكْرِى فَإِنَّ لَهُۥ مَعِيشَةً ضَنكًا وَنَحْشُرُهُۥ يَوْمَ ٱلْقِيَـٰمَةِ أَعْمَىٰ
    arabicPlain: ومن أعرض عن ذكري فإن له معيشة ضنكا ونحشره يوم القيامة أعمى
    surahName: Taa-Haa
    juz: 16
