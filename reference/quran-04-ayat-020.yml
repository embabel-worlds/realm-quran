    scripture: quran
    name: Quran 20:119
    chapter: 20
    verse: 119
    ordinal: 2467
    text: And that thou thirstest not therein nor art exposed to the sun's heat.
    translation: Pickthall
    original: وَأَنَّكَ لَا تَظْمَؤُا۟ فِيهَا وَلَا تَضْحَىٰ
