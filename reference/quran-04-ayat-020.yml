  data:
    ref: 20:130
    scripture: quran
    name: Quran 20:130
    chapter: 20
    verse: 130
    ordinal: 2478
    text: Therefor (O Muhammad), bear with what they say, and celebrate the praise of thy Lord ere the rising of the sun and ere the going down thereof. And glorify Him some hours of the night and at the two ends of the day, that thou mayst find acceptance.
    translation: Pickthall
    original: فَٱصْبِرْ عَلَىٰ مَا يَقُولُونَ وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ ٱلشَّمْسِ وَقَبْلَ غُرُوبِهَا ۖ وَمِنْ ءَانَآئِ ٱلَّيْلِ فَسَبِّحْ وَأَطْرَافَ ٱلنَّهَارِ لَعَلَّكَ تَرْضَىٰ
    arabicPlain: فاصبر على ما يقولون وسبح بحمد ربك قبل طلوع الشمس وقبل غروبها ۖ ومن آناء الليل فسبح وأطراف النهار لعلك ترضى
    surahName: Taa-Haa
    juz: 16
    manzil: 4
    ruku: 277
    page: 321
