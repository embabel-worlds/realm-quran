  data:
    ref: 20:71
    scripture: quran
    name: Quran 20:71
    chapter: 20
    verse: 71
    ordinal: 2419
    text: '(Pharaoh) said: Ye put faith in him before I give you leave. Lo! he is your chief who taught you magic. Now surely I shall cut off your hands and your feet alternately, and I shall crucify you on the trunks of palm trees, and ye shall know for certain which of us hath sterner and more lasting punishment.'
    translation: Pickthall
    original: قَالَ ءَامَنتُمْ لَهُۥ قَبْلَ أَنْ ءَاذَنَ لَكُمْ ۖ إِنَّهُۥ لَكَبِيرُكُمُ ٱلَّذِى عَلَّمَكُمُ ٱلسِّحْرَ ۖ فَلَأُقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُم مِّنْ خِلَـٰفٍ وَلَأُصَلِّبَنَّكُمْ فِى جُذُوعِ ٱلنَّخْلِ وَلَتَعْلَمُنَّ أَيُّنَآ أَشَدُّ عَذَابًا وَأَبْقَىٰ
    arabicPlain: قال آمنتم له قبل أن آذن لكم ۖ إنه لكبيركم الذي علمكم السحر ۖ فلأقطعن أيديكم وأرجلكم من خلاف ولأصلبنكم في جذوع النخل ولتعلمن أينا أشد عذابا وأبقى
    surahName: Taa-Haa
    juz: 16
    manzil: 4
    ruku: 272
    page: 316
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '20'
  - predicate: IN_PORTION
    to:
      type: Juz
