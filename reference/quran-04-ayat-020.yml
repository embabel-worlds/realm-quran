  data:
    ref: 20:126
    scripture: quran
    name: Quran 20:126
    chapter: 20
    verse: 126
    ordinal: 2474
    text: 'He will say: So (it must be). Our revelations came unto thee but thou didst forget them. In like manner thou art forgotten this Day.'
    translation: Pickthall
    original: قَالَ كَذَٰلِكَ أَتَتْكَ ءَايَـٰتُنَا فَنَسِيتَهَا ۖ وَكَذَٰلِكَ ٱلْيَوْمَ تُنسَىٰ
    arabicPlain: قال كذلك أتتك آياتنا فنسيتها ۖ وكذلك اليوم تنسى
    surahName: Taa-Haa
    juz: 16
    manzil: 4
