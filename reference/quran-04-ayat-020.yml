    name: Quran 20:63
    chapter: 20
    verse: 63
    ordinal: 2411
    text: 'They said: Lo! these are two wizards who would drive you out from your country by their magic, and destroy your best traditions;'
    translation: Pickthall
    original: قَالُوٓا۟ إِنْ هَـٰذَٰنِ لَسَـٰحِرَٰنِ يُرِيدَانِ أَن يُخْرِجَاكُم مِّنْ أَرْضِكُم بِسِحْرِهِمَا وَيَذْهَبَا بِطَرِيقَتِكُمُ ٱلْمُثْلَىٰ
    arabicPlain: قالوا إن هذان لساحران يريدان أن يخرجاكم من أرضكم بسحرهما ويذهبا بطريقتكم المثلى
