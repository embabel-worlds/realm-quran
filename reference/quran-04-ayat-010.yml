    chapter: 10
    verse: 103
    ordinal: 1467
    text: Then shall We save Our messengers and the believers, in like manner (as of old). It is incumbent upon Us to save believers.
    translation: Pickthall
    original: ثُمَّ نُنَجِّى رُسُلَنَا وَٱلَّذِينَ ءَامَنُوا۟ ۚ كَذَٰلِكَ حَقًّا عَلَيْنَا نُنجِ ٱلْمُؤْمِنِينَ
