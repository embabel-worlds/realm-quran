  data:
    ref: '10:16'
    scripture: quran
    name: Quran 10:16
    chapter: 10
    verse: 16
    ordinal: 1380
    text: 'Say: If Allah had so willed I should not have recited it to you nor would He have made it known to you. I dwelt among you a whole lifetime before it (came to me). Have ye then no sense?'
    translation: Pickthall
    original: قُل لَّوْ شَآءَ ٱللَّهُ مَا تَلَوْتُهُۥ عَلَيْكُمْ وَلَآ أَدْرَىٰكُم بِهِۦ ۖ فَقَدْ لَبِثْتُ فِيكُمْ عُمُرًا مِّن قَبْلِهِۦٓ ۚ أَفَلَا تَعْقِلُونَ
    arabicPlain: قل لو شاء الله ما تلوته عليكم ولا أدراكم به ۖ فقد لبثت فيكم عمرا من قبله ۚ أفلا تعقلون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 173
