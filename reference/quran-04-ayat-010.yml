    name: Quran 10:92
    chapter: 10
    verse: 92
    ordinal: 1456
    text: But this day We save thee in thy body that thou mayst be a portent for those after thee. Lo! most of mankind are heedless of Our portents.
    translation: Pickthall
    original: فَٱلْيَوْمَ نُنَجِّيكَ بِبَدَنِكَ لِتَكُونَ لِمَنْ خَلْفَكَ ءَايَةً ۚ وَإِنَّ كَثِيرًا مِّنَ ٱلنَّاسِ عَنْ ءَايَـٰتِنَا لَغَـٰفِلُونَ
    arabicPlain: فاليوم ننجيك ببدنك لتكون لمن خلفك آية ۚ وإن كثيرا من الناس عن آياتنا لغافلون
