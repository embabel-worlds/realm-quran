  data:
    ref: '10:10'
    scripture: quran
    name: Quran 10:10
    chapter: 10
    verse: 10
    ordinal: 1374
    text: 'Their prayer therein will be: Glory be to Thee, O Allah! and their greeting therein will be: Peace. And the conclusion of their prayer will be: Praise be to Allah, Lord of the Worlds!'
    translation: Pickthall
    original: دَعْوَىٰهُمْ فِيهَا سُبْحَـٰنَكَ ٱللَّهُمَّ وَتَحِيَّتُهُمْ فِيهَا سَلَـٰمٌ ۚ وَءَاخِرُ دَعْوَىٰهُمْ أَنِ ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَـٰلَمِينَ
    arabicPlain: دعواهم فيها سبحانك اللهم وتحيتهم فيها سلام ۚ وآخر دعواهم أن الحمد لله رب العالمين
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 172
