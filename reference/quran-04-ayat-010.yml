    scripture: quran
    name: Quran 10:79
    chapter: 10
    verse: 79
    ordinal: 1443
    text: 'And Pharaoh said: Bring every cunning wizard unto me.'
    translation: Pickthall
    original: وَقَالَ فِرْعَوْنُ ٱئْتُونِى بِكُلِّ سَـٰحِرٍ عَلِيمٍ
    arabicPlain: وقال فرعون ائتوني بكل ساحر عليم
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 179
    page: 218
  relations:
