    scripture: quran
    name: Quran 10:42
    chapter: 10
    verse: 42
    ordinal: 1406
    text: And of them are some who listen unto thee. But canst thou make the deaf to hear even though they apprehend not?
    translation: Pickthall
    original: وَمِنْهُم مَّن يَسْتَمِعُونَ إِلَيْكَ ۚ أَفَأَنتَ تُسْمِعُ ٱلصُّمَّ وَلَوْ كَانُوا۟ لَا يَعْقِلُونَ
    arabicPlain: ومنهم من يستمعون إليك ۚ أفأنت تسمع الصم ولو كانوا لا يعقلون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 176
