    scripture: quran
    name: Quran 10:62
    chapter: 10
    verse: 62
    ordinal: 1426
    text: Lo! verily the friends of Allah are (those) on whom fear (cometh) not, nor do they grieve?
    translation: Pickthall
    original: أَلَآ إِنَّ أَوْلِيَآءَ ٱللَّهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
    arabicPlain: ألا إن أولياء الله لا خوف عليهم ولا هم يحزنون
