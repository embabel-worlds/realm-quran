    translation: Pickthall
    original: وَأَنْ أَقِمْ وَجْهَكَ لِلدِّينِ حَنِيفًا وَلَا تَكُونَنَّ مِنَ ٱلْمُشْرِكِينَ
    arabicPlain: وأن أقم وجهك للدين حنيفا ولا تكونن من المشركين
