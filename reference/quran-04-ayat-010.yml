  data:
    ref: 10:65
    scripture: quran
    name: Quran 10:65
    chapter: 10
    verse: 65
    ordinal: 1429
    text: And let not their speech grieve thee (O Muhammad). Lo! power belongeth wholly to Allah. He is the Hearer, the Knower.
    translation: Pickthall
    original: وَلَا يَحْزُنكَ قَوْلُهُمْ ۘ إِنَّ ٱلْعِزَّةَ لِلَّهِ جَمِيعًا ۚ هُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ
    arabicPlain: ولا يحزنك قولهم ۘ إن العزة لله جميعا ۚ هو السميع العليم
