  data:
    ref: 10:94
    scripture: quran
    name: Quran 10:94
    chapter: 10
    verse: 94
    ordinal: 1458
    text: And if thou (Muhammad) art in doubt concerning that which We reveal unto thee, then question those who read the Scripture (that was) before thee. Verily the Truth from thy Lord hath come unto thee. So be not thou of the waverers.
    translation: Pickthall
    original: فَإِن كُنتَ فِى شَكٍّ مِّمَّآ أَنزَلْنَآ إِلَيْكَ فَسْـَٔلِ ٱلَّذِينَ يَقْرَءُونَ ٱلْكِتَـٰبَ مِن قَبْلِكَ ۚ لَقَدْ جَآءَكَ ٱلْحَقُّ مِن رَّبِّكَ فَلَا تَكُونَنَّ مِنَ ٱلْمُمْتَرِينَ
    arabicPlain: فإن كنت في شك مما أنزلنا إليك فاسأل الذين يقرءون الكتاب من قبلك ۚ لقد جاءك الحق من ربك فلا تكونن من الممترين
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 181
