    name: Quran 10:102
    chapter: 10
    verse: 102
    ordinal: 1466
    text: 'What expect they save the like of the days of those who passed away before them? Say: Expect then! I am with you among the expectant.'
    translation: Pickthall
    original: فَهَلْ يَنتَظِرُونَ إِلَّا مِثْلَ أَيَّامِ ٱلَّذِينَ خَلَوْا۟ مِن قَبْلِهِمْ ۚ قُلْ فَٱنتَظِرُوٓا۟ إِنِّى مَعَكُم مِّنَ ٱلْمُنتَظِرِينَ
    arabicPlain: فهل ينتظرون إلا مثل أيام الذين خلوا من قبلهم ۚ قل فانتظروا إني معكم من المنتظرين
