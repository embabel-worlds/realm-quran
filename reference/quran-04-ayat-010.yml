    text: And (O Muhammad) follow that which is inspired in thee, and forbear until Allah give judgment. And He is the Best of Judges.
    translation: Pickthall
    original: وَٱتَّبِعْ مَا يُوحَىٰٓ إِلَيْكَ وَٱصْبِرْ حَتَّىٰ يَحْكُمَ ٱللَّهُ ۚ وَهُوَ خَيْرُ ٱلْحَـٰكِمِينَ
    arabicPlain: واتبع ما يوحى إليك واصبر حتى يحكم الله ۚ وهو خير الحاكمين
