    scripture: quran
    name: Quran 10:33
    chapter: 10
    verse: 33
    ordinal: 1397
    text: 'Thus is the Word of thy Lord justified concerning those who do wrong: that they believe not.'
    translation: Pickthall
    original: كَذَٰلِكَ حَقَّتْ كَلِمَتُ رَبِّكَ عَلَى ٱلَّذِينَ فَسَقُوٓا۟ أَنَّهُمْ لَا يُؤْمِنُونَ
