  data:
    ref: 10:73
    scripture: quran
    name: Quran 10:73
    chapter: 10
    verse: 73
    ordinal: 1437
    text: But they denied him, so We saved him and those with him in the ship, and made them viceroys (in the earth), while We drowned those who denied Our revelations. See then the nature of the consequence for those who had been warned.
    translation: Pickthall
    original: فَكَذَّبُوهُ فَنَجَّيْنَـٰهُ وَمَن مَّعَهُۥ فِى ٱلْفُلْكِ وَجَعَلْنَـٰهُمْ خَلَـٰٓئِفَ وَأَغْرَقْنَا ٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَـٰتِنَا ۖ فَٱنظُرْ كَيْفَ كَانَ عَـٰقِبَةُ ٱلْمُنذَرِينَ
    arabicPlain: فكذبوه فنجيناه ومن معه في الفلك وجعلناهم خلائف وأغرقنا الذين كذبوا بآياتنا ۖ فانظر كيف كان عاقبة المنذرين
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 179
    page: 217
