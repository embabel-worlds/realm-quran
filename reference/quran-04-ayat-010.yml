  data:
    ref: '10:9'
    scripture: quran
    name: Quran 10:9
    chapter: 10
    verse: 9
    ordinal: 1373
    text: Lo! those who believe and do good works, their Lord guideth them by their faith. Rivers will flow beneath them in the Gardens of Delight,
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ يَهْدِيهِمْ رَبُّهُم بِإِيمَـٰنِهِمْ ۖ تَجْرِى مِن تَحْتِهِمُ ٱلْأَنْهَـٰرُ فِى جَنَّـٰتِ ٱلنَّعِيمِ
    arabicPlain: إن الذين آمنوا وعملوا الصالحات يهديهم ربهم بإيمانهم ۖ تجري من تحتهم الأنهار في جنات النعيم
