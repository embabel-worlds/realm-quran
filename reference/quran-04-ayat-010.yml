  data:
    ref: '10:27'
    scripture: quran
    name: Quran 10:27
    chapter: 10
    verse: 27
    ordinal: 1391
    text: And those who earn ill-deeds, (for them) requital of each ill-deed by the like thereof; and ignominy overtaketh them - They have no protector from Allah - as if their faces had been covered with a cloak of darkest night. Such are rightful owners of the Fire; they will abide therein.
    translation: Pickthall
    original: وَٱلَّذِينَ كَسَبُوا۟ ٱلسَّيِّـَٔاتِ جَزَآءُ سَيِّئَةٍۭ بِمِثْلِهَا وَتَرْهَقُهُمْ ذِلَّةٌ ۖ مَّا لَهُم مِّنَ ٱللَّهِ مِنْ عَاصِمٍ ۖ كَأَنَّمَآ أُغْشِيَتْ وُجُوهُهُمْ قِطَعًا مِّنَ ٱلَّيْلِ مُظْلِمًا ۚ أُو۟لَـٰٓئِكَ أَصْحَـٰبُ ٱلنَّارِ ۖ هُمْ فِيهَا خَـٰلِدُونَ
    arabicPlain: والذين كسبوا السيئات جزاء سيئة بمثلها وترهقهم ذلة ۖ ما لهم من الله من عاصم ۖ كأنما أغشيت وجوههم قطعا من الليل مظلما ۚ أولئك أصحاب النار ۖ هم فيها خالدون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 174
    page: 212
