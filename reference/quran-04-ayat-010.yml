    scripture: quran
    name: Quran 10:32
    chapter: 10
    verse: 32
    ordinal: 1396
    text: Such then is Allah, your rightful Lord. After the Truth what is there saving error? How then are ye turned away!
    translation: Pickthall
    original: فَذَٰلِكُمُ ٱللَّهُ رَبُّكُمُ ٱلْحَقُّ ۖ فَمَاذَا بَعْدَ ٱلْحَقِّ إِلَّا ٱلضَّلَـٰلُ ۖ فَأَنَّىٰ تُصْرَفُونَ
    arabicPlain: فذلكم الله ربكم الحق ۖ فماذا بعد الحق إلا الضلال ۖ فأنى تصرفون
