  data:
    ref: 10:77
    scripture: quran
    name: Quran 10:77
    chapter: 10
    verse: 77
    ordinal: 1441
    text: 'Moses said: Speak ye (so) of the Truth when it hath come unto you? Is this magic? Now magicians thrive not.'
    translation: Pickthall
    original: قَالَ مُوسَىٰٓ أَتَقُولُونَ لِلْحَقِّ لَمَّا جَآءَكُمْ ۖ أَسِحْرٌ هَـٰذَا وَلَا يُفْلِحُ ٱلسَّـٰحِرُونَ
    arabicPlain: قال موسى أتقولون للحق لما جاءكم ۖ أسحر هذا ولا يفلح الساحرون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 179
