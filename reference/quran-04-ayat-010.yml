  data:
    ref: 10:75
    scripture: quran
    name: Quran 10:75
    chapter: 10
    verse: 75
    ordinal: 1439
    text: Then, after them, We sent Moses and Aaron unto Pharaoh and his chiefs with Our revelations, but they were arrogant and were a guilty folk.
    translation: Pickthall
    original: ثُمَّ بَعَثْنَا مِنۢ بَعْدِهِم مُّوسَىٰ وَهَـٰرُونَ إِلَىٰ فِرْعَوْنَ وَمَلَإِي۟هِۦ بِـَٔايَـٰتِنَا فَٱسْتَكْبَرُوا۟ وَكَانُوا۟ قَوْمًا مُّجْرِمِينَ
    arabicPlain: ثم بعثنا من بعدهم موسى وهارون إلى فرعون وملئه بآياتنا فاستكبروا وكانوا قوما مجرمين
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 179
    page: 217
