  data:
    ref: '10:41'
    scripture: quran
    name: Quran 10:41
    chapter: 10
    verse: 41
    ordinal: 1405
    text: 'And if they deny thee, say: Unto me my work, and unto you your work. Ye are innocent of what I do, and I am innocent of what ye do.'
    translation: Pickthall
    original: وَإِن كَذَّبُوكَ فَقُل لِّى عَمَلِى وَلَكُمْ عَمَلُكُمْ ۖ أَنتُم بَرِيٓـُٔونَ مِمَّآ أَعْمَلُ وَأَنَا۠ بَرِىٓءٌ مِّمَّا تَعْمَلُونَ
    arabicPlain: وإن كذبوك فقل لي عملي ولكم عملكم ۖ أنتم بريئون مما أعمل وأنا بريء مما تعملون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 176
