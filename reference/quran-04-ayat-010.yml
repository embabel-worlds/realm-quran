  data:
    ref: '10:36'
    scripture: quran
    name: Quran 10:36
    chapter: 10
    verse: 36
    ordinal: 1400
    text: Most of them follow not but conjecture. Assuredly conjecture can by no means take the place of truth. Lo! Allah is Aware of what they do.
    translation: Pickthall
    original: وَمَا يَتَّبِعُ أَكْثَرُهُمْ إِلَّا ظَنًّا ۚ إِنَّ ٱلظَّنَّ لَا يُغْنِى مِنَ ٱلْحَقِّ شَيْـًٔا ۚ إِنَّ ٱللَّهَ عَلِيمٌۢ بِمَا يَفْعَلُونَ
    arabicPlain: وما يتبع أكثرهم إلا ظنا ۚ إن الظن لا يغني من الحق شيئا ۚ إن الله عليم بما يفعلون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 175
