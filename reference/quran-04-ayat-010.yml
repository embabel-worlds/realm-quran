    scripture: quran
    name: Quran 10:51
    chapter: 10
    verse: 51
    ordinal: 1415
    text: Is it (only) then, when it hath befallen you, that ye will believe? What! (Believe) now, when (until now) ye have been hastening it on (through disbelief)?
    translation: Pickthall
    original: أَثُمَّ إِذَا مَا وَقَعَ ءَامَنتُم بِهِۦٓ ۚ ءَآلْـَٔـٰنَ وَقَدْ كُنتُم بِهِۦ تَسْتَعْجِلُونَ
    arabicPlain: أثم إذا ما وقع آمنتم به ۚ آلآن وقد كنتم به تستعجلون
