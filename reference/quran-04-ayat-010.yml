    scripture: quran
    name: Quran 10:59
    chapter: 10
    verse: 59
    ordinal: 1423
    text: 'Say: Have ye considered what provision Allah hath sent down for you, how ye have made of it lawful and unlawful? Hath Allah permitted you, or do ye invent a lie concerning Allah?'
    translation: Pickthall
    original: قُلْ أَرَءَيْتُم مَّآ أَنزَلَ ٱللَّهُ لَكُم مِّن رِّزْقٍ فَجَعَلْتُم مِّنْهُ حَرَامًا وَحَلَـٰلًا قُلْ ءَآللَّهُ أَذِنَ لَكُمْ ۖ أَمْ عَلَى ٱللَّهِ تَفْتَرُونَ
    arabicPlain: قل أرأيتم ما أنزل الله لكم من رزق فجعلتم منه حراما وحلالا قل آلله أذن لكم ۖ أم على الله تفترون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 177
    page: 215
