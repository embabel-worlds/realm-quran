  data:
    ref: '10:21'
    scripture: quran
    name: Quran 10:21
    chapter: 10
    verse: 21
    ordinal: 1385
    text: 'And when We cause mankind to taste of mercy after some adversity which had afflicted them, behold! they have some plot against Our revelations. Say: Allah is more swift in plotting. Lo! Our messengers write down that which ye plot.'
    translation: Pickthall
    original: وَإِذَآ أَذَقْنَا ٱلنَّاسَ رَحْمَةً مِّنۢ بَعْدِ ضَرَّآءَ مَسَّتْهُمْ إِذَا لَهُم مَّكْرٌ فِىٓ ءَايَاتِنَا ۚ قُلِ ٱللَّهُ أَسْرَعُ مَكْرًا ۚ إِنَّ رُسُلَنَا يَكْتُبُونَ مَا تَمْكُرُونَ
    arabicPlain: وإذا أذقنا الناس رحمة من بعد ضراء مستهم إذا لهم مكر في آياتنا ۚ قل الله أسرع مكرا ۚ إن رسلنا يكتبون ما تمكرون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 174
    page: 211
