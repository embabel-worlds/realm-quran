- type: Ayah
  data:
    ref: '10:4'
    scripture: quran
    name: Quran 10:4
    chapter: 10
    verse: 4
    ordinal: 1368
    text: Unto Him is the return of all of you; it is a promise of Allah in truth. Lo! He produceth creation, then reproduceth it, that He may reward those who believe and do good works with equity; while, as for those who disbelieve, theirs will be a boiling drink and painful doom because they disbelieved.
    translation: Pickthall
    original: إِلَيْهِ مَرْجِعُكُمْ جَمِيعًا ۖ وَعْدَ ٱللَّهِ حَقًّا ۚ إِنَّهُۥ يَبْدَؤُا۟ ٱلْخَلْقَ ثُمَّ يُعِيدُهُۥ لِيَجْزِىَ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ بِٱلْقِسْطِ ۚ وَٱلَّذِينَ كَفَرُوا۟ لَهُمْ شَرَابٌ مِّنْ حَمِيمٍ وَعَذَابٌ أَلِيمٌۢ بِمَا كَانُوا۟ يَكْفُرُونَ
    arabicPlain: إليه مرجعكم جميعا ۖ وعد الله حقا ۚ إنه يبدأ الخلق ثم يعيده ليجزي الذين آمنوا وعملوا الصالحات بالقسط ۚ والذين كفروا لهم شراب من حميم وعذاب أليم بما كانوا يكفرون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 172
