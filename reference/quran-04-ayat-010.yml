  data:
    ref: 10:68
    scripture: quran
    name: Quran 10:68
    chapter: 10
    verse: 68
    ordinal: 1432
    text: 'They say: Allah hath taken (unto Him) a son - Glorified be He! He hath no needs! His is all that is in the heavens and all that is in the earth. Ye have no warrant for this. Tell ye concerning Allah that which ye know not?'
    translation: Pickthall
    original: قَالُوا۟ ٱتَّخَذَ ٱللَّهُ وَلَدًا ۗ سُبْحَـٰنَهُۥ ۖ هُوَ ٱلْغَنِىُّ ۖ لَهُۥ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۚ إِنْ عِندَكُم مِّن سُلْطَـٰنٍۭ بِهَـٰذَآ ۚ أَتَقُولُونَ عَلَى ٱللَّهِ مَا لَا تَعْلَمُونَ
    arabicPlain: قالوا اتخذ الله ولدا ۗ سبحانه ۖ هو الغني ۖ له ما في السماوات وما في الأرض ۚ إن عندكم من سلطان بهذا ۚ أتقولون على الله ما لا تعلمون
