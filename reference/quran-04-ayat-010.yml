    scripture: quran
    name: Quran 10:97
    chapter: 10
    verse: 97
    ordinal: 1461
    text: Though every token come unto them, till they see the painful doom.
    translation: Pickthall
    original: وَلَوْ جَآءَتْهُمْ كُلُّ ءَايَةٍ حَتَّىٰ يَرَوُا۟ ٱلْعَذَابَ ٱلْأَلِيمَ
