    scripture: quran
    name: Quran 10:63
    chapter: 10
    verse: 63
    ordinal: 1427
    text: Those who believe and keep their duty (to Allah).
    translation: Pickthall
    original: ٱلَّذِينَ ءَامَنُوا۟ وَكَانُوا۟ يَتَّقُونَ
    arabicPlain: الذين آمنوا وكانوا يتقون
    surahName: Yunus
