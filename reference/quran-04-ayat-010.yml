  data:
    ref: '10:26'
    scripture: quran
    name: Quran 10:26
    chapter: 10
    verse: 26
    ordinal: 1390
    text: For those who do good is the best (reward) and more (thereto). Neither dust nor ignominy cometh near their faces. Such are rightful owners of the Garden; they will abide therein.
    translation: Pickthall
    original: ۞ لِّلَّذِينَ أَحْسَنُوا۟ ٱلْحُسْنَىٰ وَزِيَادَةٌ ۖ وَلَا يَرْهَقُ وُجُوهَهُمْ قَتَرٌ وَلَا ذِلَّةٌ ۚ أُو۟لَـٰٓئِكَ أَصْحَـٰبُ ٱلْجَنَّةِ ۖ هُمْ فِيهَا خَـٰلِدُونَ
    arabicPlain: ۞ للذين أحسنوا الحسنى وزيادة ۖ ولا يرهق وجوههم قتر ولا ذلة ۚ أولئك أصحاب الجنة ۖ هم فيها خالدون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 174
    page: 212
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '10'
  - predicate: IN_PORTION
