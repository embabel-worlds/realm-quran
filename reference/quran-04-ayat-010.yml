  data:
    ref: '10:19'
    scripture: quran
    name: Quran 10:19
    chapter: 10
    verse: 19
    ordinal: 1383
    text: Mankind were but one community; then they differed; and had it not been for a word that had already gone forth from thy Lord it had been judged between them in respect of that wherein they differ.
    translation: Pickthall
    original: وَمَا كَانَ ٱلنَّاسُ إِلَّآ أُمَّةً وَٰحِدَةً فَٱخْتَلَفُوا۟ ۚ وَلَوْلَا كَلِمَةٌ سَبَقَتْ مِن رَّبِّكَ لَقُضِىَ بَيْنَهُمْ فِيمَا فِيهِ يَخْتَلِفُونَ
    arabicPlain: وما كان الناس إلا أمة واحدة فاختلفوا ۚ ولولا كلمة سبقت من ربك لقضي بينهم فيما فيه يختلفون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 173
