    scripture: quran
    name: Quran 10:101
    chapter: 10
    verse: 101
    ordinal: 1465
    text: 'Say: Behold what is in the heavens and the earth! But revelations and warnings avail not folk who will not believe.'
    translation: Pickthall
    original: قُلِ ٱنظُرُوا۟ مَاذَا فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۚ وَمَا تُغْنِى ٱلْـَٔايَـٰتُ وَٱلنُّذُرُ عَن قَوْمٍ لَّا يُؤْمِنُونَ
    arabicPlain: قل انظروا ماذا في السماوات والأرض ۚ وما تغني الآيات والنذر عن قوم لا يؤمنون
