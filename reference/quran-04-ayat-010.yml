    name: Quran 10:30
    chapter: 10
    verse: 30
    ordinal: 1394
    text: There doth every soul experience that which it did aforetime, and they are returned unto Allah, their rightful Lord, and that which they used to invent hath failed them.
    translation: Pickthall
    original: هُنَالِكَ تَبْلُوا۟ كُلُّ نَفْسٍ مَّآ أَسْلَفَتْ ۚ وَرُدُّوٓا۟ إِلَى ٱللَّهِ مَوْلَىٰهُمُ ٱلْحَقِّ ۖ وَضَلَّ عَنْهُم مَّا كَانُوا۟ يَفْتَرُونَ
    arabicPlain: هنالك تبلو كل نفس ما أسلفت ۚ وردوا إلى الله مولاهم الحق ۖ وضل عنهم ما كانوا يفترون
