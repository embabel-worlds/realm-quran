- type: Ayah
  data:
    ref: '10:13'
    scripture: quran
    name: Quran 10:13
    chapter: 10
    verse: 13
    ordinal: 1377
    text: We destroyed the generations before you when they did wrong; and their messengers (from Allah) came unto them with clear proofs (of His Sovereignty) but they would not believe. Thus do We reward the guilty folk.
    translation: Pickthall
    original: وَلَقَدْ أَهْلَكْنَا ٱلْقُرُونَ مِن قَبْلِكُمْ لَمَّا ظَلَمُوا۟ ۙ وَجَآءَتْهُمْ رُسُلُهُم بِٱلْبَيِّنَـٰتِ وَمَا كَانُوا۟ لِيُؤْمِنُوا۟ ۚ كَذَٰلِكَ نَجْزِى ٱلْقَوْمَ ٱلْمُجْرِمِينَ
    arabicPlain: ولقد أهلكنا القرون من قبلكم لما ظلموا ۙ وجاءتهم رسلهم بالبينات وما كانوا ليؤمنوا ۚ كذلك نجزي القوم المجرمين
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 173
    page: 209
  relations:
  - predicate: IN
