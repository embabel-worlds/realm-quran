  data:
    ref: '10:17'
    scripture: quran
    name: Quran 10:17
    chapter: 10
    verse: 17
    ordinal: 1381
    text: Who doeth greater wrong than he who inventeth a lie concerning Allah and denieth His revelations? Lo! the guilty never are successful.
    translation: Pickthall
    original: فَمَنْ أَظْلَمُ مِمَّنِ ٱفْتَرَىٰ عَلَى ٱللَّهِ كَذِبًا أَوْ كَذَّبَ بِـَٔايَـٰتِهِۦٓ ۚ إِنَّهُۥ لَا يُفْلِحُ ٱلْمُجْرِمُونَ
    arabicPlain: فمن أظلم ممن افترى على الله كذبا أو كذب بآياته ۚ إنه لا يفلح المجرمون
    surahName: Yunus
    juz: 11
