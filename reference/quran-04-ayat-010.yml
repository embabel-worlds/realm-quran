  data:
    ref: 10:100
    scripture: quran
    name: Quran 10:100
    chapter: 10
    verse: 100
    ordinal: 1464
    text: It is not for any soul to believe save by the permission of Allah. He hath set uncleanness upon those who have no sense.
    translation: Pickthall
    original: وَمَا كَانَ لِنَفْسٍ أَن تُؤْمِنَ إِلَّا بِإِذْنِ ٱللَّهِ ۚ وَيَجْعَلُ ٱلرِّجْسَ عَلَى ٱلَّذِينَ لَا يَعْقِلُونَ
    arabicPlain: وما كان لنفس أن تؤمن إلا بإذن الله ۚ ويجعل الرجس على الذين لا يعقلون
    surahName: Yunus
    juz: 11
