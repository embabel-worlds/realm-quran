  data:
    ref: '10:39'
    scripture: quran
    name: Quran 10:39
    chapter: 10
    verse: 39
    ordinal: 1403
    text: Nay, but they denied that, the knowledge whereof they could not compass, and whereof the interpretation (in events) hath not yet come unto them. Even so did those before them deny. Then see what was the consequence for the wrong-doers!
    translation: Pickthall
    original: بَلْ كَذَّبُوا۟ بِمَا لَمْ يُحِيطُوا۟ بِعِلْمِهِۦ وَلَمَّا يَأْتِهِمْ تَأْوِيلُهُۥ ۚ كَذَٰلِكَ كَذَّبَ ٱلَّذِينَ مِن قَبْلِهِمْ ۖ فَٱنظُرْ كَيْفَ كَانَ عَـٰقِبَةُ ٱلظَّـٰلِمِينَ
    arabicPlain: بل كذبوا بما لم يحيطوا بعلمه ولما يأتهم تأويله ۚ كذلك كذب الذين من قبلهم ۖ فانظر كيف كان عاقبة الظالمين
    surahName: Yunus
    juz: 11
    manzil: 3
