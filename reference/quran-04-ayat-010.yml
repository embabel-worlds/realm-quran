    name: Quran 10:38
    chapter: 10
    verse: 38
    ordinal: 1402
    text: 'Or say they: He hath invented it? Say: Then bring a surah like unto it, and call (for help) on all ye can besides Allah, if ye are truthful.'
    translation: Pickthall
    original: أَمْ يَقُولُونَ ٱفْتَرَىٰهُ ۖ قُلْ فَأْتُوا۟ بِسُورَةٍ مِّثْلِهِۦ وَٱدْعُوا۟ مَنِ ٱسْتَطَعْتُم مِّن دُونِ ٱللَّهِ إِن كُنتُمْ صَـٰدِقِينَ
    arabicPlain: أم يقولون افتراه ۖ قل فأتوا بسورة مثله وادعوا من استطعتم من دون الله إن كنتم صادقين
    surahName: Yunus
