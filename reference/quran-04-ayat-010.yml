  data:
    ref: 10:83
    scripture: quran
    name: Quran 10:83
    chapter: 10
    verse: 83
    ordinal: 1447
    text: But none trusted Moses, save some scions of his people, (and they were) in fear of Pharaoh and their chiefs, that he would persecute them. Lo! Pharaoh was verily a tyrant in the land, and lo! he verily was of the wanton.
    translation: Pickthall
    original: فَمَآ ءَامَنَ لِمُوسَىٰٓ إِلَّا ذُرِّيَّةٌ مِّن قَوْمِهِۦ عَلَىٰ خَوْفٍ مِّن فِرْعَوْنَ وَمَلَإِي۟هِمْ أَن يَفْتِنَهُمْ ۚ وَإِنَّ فِرْعَوْنَ لَعَالٍ فِى ٱلْأَرْضِ وَإِنَّهُۥ لَمِنَ ٱلْمُسْرِفِينَ
    arabicPlain: فما آمن لموسى إلا ذرية من قومه على خوف من فرعون وملئهم أن يفتنهم ۚ وإن فرعون لعال في الأرض وإنه لمن المسرفين
    surahName: Yunus
    juz: 11
    manzil: 3
