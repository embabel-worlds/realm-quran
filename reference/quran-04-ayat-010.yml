    chapter: 10
    verse: 66
    ordinal: 1430
    text: Lo! is it not unto Allah that belongeth whosoever is in the heavens and whosoever is in the earth? Those who follow aught instead of Allah follow not (His) partners. They follow only a conjecture, and they do but guess.
    translation: Pickthall
    original: أَلَآ إِنَّ لِلَّهِ مَن فِى ٱلسَّمَـٰوَٰتِ وَمَن فِى ٱلْأَرْضِ ۗ وَمَا يَتَّبِعُ ٱلَّذِينَ يَدْعُونَ مِن دُونِ ٱللَّهِ شُرَكَآءَ ۚ إِن يَتَّبِعُونَ إِلَّا ٱلظَّنَّ وَإِنْ هُمْ إِلَّا يَخْرُصُونَ
    arabicPlain: ألا إن لله من في السماوات ومن في الأرض ۗ وما يتبع الذين يدعون من دون الله شركاء ۚ إن يتبعون إلا الظن وإن هم إلا يخرصون
