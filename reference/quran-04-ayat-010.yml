  data:
    ref: 10:72
    scripture: quran
    name: Quran 10:72
    chapter: 10
    verse: 72
    ordinal: 1436
    text: But if ye are averse I have asked of you no wage. My wage is the concern of Allah only, and I am commanded to be of those who surrender (unto Him).
    translation: Pickthall
    original: فَإِن تَوَلَّيْتُمْ فَمَا سَأَلْتُكُم مِّنْ أَجْرٍ ۖ إِنْ أَجْرِىَ إِلَّا عَلَى ٱللَّهِ ۖ وَأُمِرْتُ أَنْ أَكُونَ مِنَ ٱلْمُسْلِمِينَ
    arabicPlain: فإن توليتم فما سألتكم من أجر ۖ إن أجري إلا على الله ۖ وأمرت أن أكون من المسلمين
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 179
