    scripture: quran
    name: Quran 10:58
    chapter: 10
    verse: 58
    ordinal: 1422
    text: 'Say: In the bounty of Allah and in His mercy: therein let them rejoice. It is better than what they hoard.'
    translation: Pickthall
    original: قُلْ بِفَضْلِ ٱللَّهِ وَبِرَحْمَتِهِۦ فَبِذَٰلِكَ فَلْيَفْرَحُوا۟ هُوَ خَيْرٌ مِّمَّا يَجْمَعُونَ
    arabicPlain: قل بفضل الله وبرحمته فبذلك فليفرحوا هو خير مما يجمعون
    surahName: Yunus
    juz: 11
