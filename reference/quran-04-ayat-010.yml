    scripture: quran
    name: Quran 10:45
    chapter: 10
    verse: 45
    ordinal: 1409
    text: And on the day when He shall gather them together, (when it will seem) as though they had tarried but an hour of the day, recognising one another, those will verily have perished who denied the meeting with Allah and were not guided.
    translation: Pickthall
    original: وَيَوْمَ يَحْشُرُهُمْ كَأَن لَّمْ يَلْبَثُوٓا۟ إِلَّا سَاعَةً مِّنَ ٱلنَّهَارِ يَتَعَارَفُونَ بَيْنَهُمْ ۚ قَدْ خَسِرَ ٱلَّذِينَ كَذَّبُوا۟ بِلِقَآءِ ٱللَّهِ وَمَا كَانُوا۟ مُهْتَدِينَ
    arabicPlain: ويوم يحشرهم كأن لم يلبثوا إلا ساعة من النهار يتعارفون بينهم ۚ قد خسر الذين كذبوا بلقاء الله وما كانوا مهتدين
