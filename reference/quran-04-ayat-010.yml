  data:
    ref: '10:25'
    scripture: quran
    name: Quran 10:25
    chapter: 10
    verse: 25
    ordinal: 1389
    text: And Allah summoneth to the abode of peace, and leadeth whom He will to a straight path.
    translation: Pickthall
    original: وَٱللَّهُ يَدْعُوٓا۟ إِلَىٰ دَارِ ٱلسَّلَـٰمِ وَيَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍ مُّسْتَقِيمٍ
    arabicPlain: والله يدعو إلى دار السلام ويهدي من يشاء إلى صراط مستقيم
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 174
