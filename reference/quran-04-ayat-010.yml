- type: Ayah
  data:
    ref: '10:3'
    scripture: quran
    name: Quran 10:3
    chapter: 10
    verse: 3
    ordinal: 1367
    text: Lo! your Lord is Allah Who created the heavens and the earth in six Days, then He established Himself upon the Throne, directing all things. There is no intercessor (with Him) save after His permission. That is Allah, your Lord, so worship Him. Oh, will ye not remind?
    translation: Pickthall
    original: إِنَّ رَبَّكُمُ ٱللَّهُ ٱلَّذِى خَلَقَ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ فِى سِتَّةِ أَيَّامٍ ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ ۖ يُدَبِّرُ ٱلْأَمْرَ ۖ مَا مِن شَفِيعٍ إِلَّا مِنۢ بَعْدِ إِذْنِهِۦ ۚ ذَٰلِكُمُ ٱللَّهُ رَبُّكُمْ فَٱعْبُدُوهُ ۚ أَفَلَا تَذَكَّرُونَ
    arabicPlain: إن ربكم الله الذي خلق السماوات والأرض في ستة أيام ثم استوى على العرش ۖ يدبر الأمر ۖ ما من شفيع إلا من بعد إذنه ۚ ذلكم الله ربكم فاعبدوه ۚ أفلا تذكرون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 172
    page: 208
