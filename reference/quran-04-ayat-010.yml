    scripture: quran
    name: Quran 10:76
    chapter: 10
    verse: 76
    ordinal: 1440
    text: 'And when the Truth from Our presence came unto them, they said: Lo! this is mere magic.'
    translation: Pickthall
    original: فَلَمَّا جَآءَهُمُ ٱلْحَقُّ مِنْ عِندِنَا قَالُوٓا۟ إِنَّ هَـٰذَا لَسِحْرٌ مُّبِينٌ
    arabicPlain: فلما جاءهم الحق من عندنا قالوا إن هذا لسحر مبين
    surahName: Yunus
    juz: 11
    manzil: 3
