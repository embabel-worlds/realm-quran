    scripture: quran
    name: Quran 10:89
    chapter: 10
    verse: 89
    ordinal: 1453
    text: 'He said: Your prayer is heard. Do ye twain keep to the straight path, and follow not the road of those who have no knowledge.'
    translation: Pickthall
    original: قَالَ قَدْ أُجِيبَت دَّعْوَتُكُمَا فَٱسْتَقِيمَا وَلَا تَتَّبِعَآنِّ سَبِيلَ ٱلَّذِينَ لَا يَعْلَمُونَ
    arabicPlain: قال قد أجيبت دعوتكما فاستقيما ولا تتبعان سبيل الذين لا يعلمون
    surahName: Yunus
