  data:
    ref: 10:106
    scripture: quran
    name: Quran 10:106
    chapter: 10
    verse: 106
    ordinal: 1470
    text: And cry not, beside Allah, unto that which cannot profit thee nor hurt thee, for if thou didst so then wert thou of the wrong-doers.
    translation: Pickthall
    original: وَلَا تَدْعُ مِن دُونِ ٱللَّهِ مَا لَا يَنفَعُكَ وَلَا يَضُرُّكَ ۖ فَإِن فَعَلْتَ فَإِنَّكَ إِذًا مِّنَ ٱلظَّـٰلِمِينَ
    arabicPlain: ولا تدع من دون الله ما لا ينفعك ولا يضرك ۖ فإن فعلت فإنك إذا من الظالمين
