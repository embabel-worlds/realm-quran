  data:
    ref: 10:81
    scripture: quran
    name: Quran 10:81
    chapter: 10
    verse: 81
    ordinal: 1445
    text: 'And when they had cast, Moses said: That which ye have brought is magic. Lo! Allah will make it vain. Lo! Allah upholdeth not the work of mischief-makers.'
    translation: Pickthall
    original: فَلَمَّآ أَلْقَوْا۟ قَالَ مُوسَىٰ مَا جِئْتُم بِهِ ٱلسِّحْرُ ۖ إِنَّ ٱللَّهَ سَيُبْطِلُهُۥٓ ۖ إِنَّ ٱللَّهَ لَا يُصْلِحُ عَمَلَ ٱلْمُفْسِدِينَ
    arabicPlain: فلما ألقوا قال موسى ما جئتم به السحر ۖ إن الله سيبطله ۖ إن الله لا يصلح عمل المفسدين
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 179
    page: 218
  relations:
  - predicate: IN
    to:
      type: Surah
