  data:
    ref: 10:82
    scripture: quran
    name: Quran 10:82
    chapter: 10
    verse: 82
    ordinal: 1446
    text: And Allah will vindicate the Truth by His words, however much the guilty be averse.
    translation: Pickthall
    original: وَيُحِقُّ ٱللَّهُ ٱلْحَقَّ بِكَلِمَـٰتِهِۦ وَلَوْ كَرِهَ ٱلْمُجْرِمُونَ
    arabicPlain: ويحق الله الحق بكلماته ولو كره المجرمون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 179
    page: 218
