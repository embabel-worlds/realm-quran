  data:
    ref: '10:14'
    scripture: quran
    name: Quran 10:14
    chapter: 10
    verse: 14
    ordinal: 1378
    text: Then We appointed you viceroys in the earth after them, that We might see how ye behave.
    translation: Pickthall
    original: ثُمَّ جَعَلْنَـٰكُمْ خَلَـٰٓئِفَ فِى ٱلْأَرْضِ مِنۢ بَعْدِهِمْ لِنَنظُرَ كَيْفَ تَعْمَلُونَ
    arabicPlain: ثم جعلناكم خلائف في الأرض من بعدهم لننظر كيف تعملون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 173
