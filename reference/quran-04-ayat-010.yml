  data:
    ref: '10:15'
    scripture: quran
    name: Quran 10:15
    chapter: 10
    verse: 15
    ordinal: 1379
    text: 'And when Our clear revelations are recited unto them, they who look not for the meeting with Us say: Bring a Lecture other than this, or change it. Say (O Muhammad): It is not for me to change it of my accord. I only follow that which is inspired in me. Lo! if I disobey my Lord I fear the retribution of an awful Day.'
    translation: Pickthall
    original: وَإِذَا تُتْلَىٰ عَلَيْهِمْ ءَايَاتُنَا بَيِّنَـٰتٍ ۙ قَالَ ٱلَّذِينَ لَا يَرْجُونَ لِقَآءَنَا ٱئْتِ بِقُرْءَانٍ غَيْرِ هَـٰذَآ أَوْ بَدِّلْهُ ۚ قُلْ مَا يَكُونُ لِىٓ أَنْ أُبَدِّلَهُۥ مِن تِلْقَآئِ نَفْسِىٓ ۖ إِنْ أَتَّبِعُ إِلَّا مَا يُوحَىٰٓ إِلَىَّ ۖ إِنِّىٓ أَخَافُ إِنْ عَصَيْتُ رَبِّى عَذَابَ يَوْمٍ عَظِيمٍ
    arabicPlain: وإذا تتلى عليهم آياتنا بينات ۙ قال الذين لا يرجون لقاءنا ائت بقرآن غير هذا أو بدله ۚ قل ما يكون لي أن أبدله من تلقاء نفسي ۖ إن أتبع إلا ما يوحى إلي ۖ إني أخاف إن عصيت ربي عذاب يوم عظيم
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 173
