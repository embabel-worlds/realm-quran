  data:
    ref: '10:40'
    scripture: quran
    name: Quran 10:40
    chapter: 10
    verse: 40
    ordinal: 1404
    text: And of them is he who believeth therein, and of them is he who believeth not therein, and thy Lord is Best Aware of the corrupters.
    translation: Pickthall
    original: وَمِنْهُم مَّن يُؤْمِنُ بِهِۦ وَمِنْهُم مَّن لَّا يُؤْمِنُ بِهِۦ ۚ وَرَبُّكَ أَعْلَمُ بِٱلْمُفْسِدِينَ
    arabicPlain: ومنهم من يؤمن به ومنهم من لا يؤمن به ۚ وربك أعلم بالمفسدين
    surahName: Yunus
