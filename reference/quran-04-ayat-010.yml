    ref: '10:6'
    scripture: quran
    name: Quran 10:6
    chapter: 10
    verse: 6
    ordinal: 1370
    text: Lo! in the difference of day and night and all that Allah hath created in the heavens and the earth are portents, verily, for folk who ward off (evil).
    translation: Pickthall
    original: إِنَّ فِى ٱخْتِلَـٰفِ ٱلَّيْلِ وَٱلنَّهَارِ وَمَا خَلَقَ ٱللَّهُ فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ لَـَٔايَـٰتٍ لِّقَوْمٍ يَتَّقُونَ
    arabicPlain: إن في اختلاف الليل والنهار وما خلق الله في السماوات والأرض لآيات لقوم يتقون
    surahName: Yunus
