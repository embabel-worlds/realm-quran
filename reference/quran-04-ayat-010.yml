  data:
    ref: 10:78
    scripture: quran
    name: Quran 10:78
    chapter: 10
    verse: 78
    ordinal: 1442
    text: 'They said: Hast thou come unto us to pervert us from that (faith) in which we found our fathers, and that you two may own the place of greatness in the land? We will not believe you two.'
    translation: Pickthall
    original: قَالُوٓا۟ أَجِئْتَنَا لِتَلْفِتَنَا عَمَّا وَجَدْنَا عَلَيْهِ ءَابَآءَنَا وَتَكُونَ لَكُمَا ٱلْكِبْرِيَآءُ فِى ٱلْأَرْضِ وَمَا نَحْنُ لَكُمَا بِمُؤْمِنِينَ
    arabicPlain: قالوا أجئتنا لتلفتنا عما وجدنا عليه آباءنا وتكون لكما الكبرياء في الأرض وما نحن لكما بمؤمنين
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 179
