    scripture: quran
    name: Quran 10:95
    chapter: 10
    verse: 95
    ordinal: 1459
    text: And be not thou of those who deny the revelations of Allah, for then wert thou of the losers.
    translation: Pickthall
    original: وَلَا تَكُونَنَّ مِنَ ٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَـٰتِ ٱللَّهِ فَتَكُونَ مِنَ ٱلْخَـٰسِرِينَ
    arabicPlain: ولا تكونن من الذين كذبوا بآيات الله فتكون من الخاسرين
