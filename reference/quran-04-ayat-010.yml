  data:
    ref: 10:107
    scripture: quran
    name: Quran 10:107
    chapter: 10
    verse: 107
    ordinal: 1471
    text: If Allah afflicteth thee with some hurt, there is none who can remove it save Him; and if He desireth good for thee, there is none who can repel His bounty. He striketh with it whom He will of his bondmen. He is the Forgiving, the Merciful.
    translation: Pickthall
    original: وَإِن يَمْسَسْكَ ٱللَّهُ بِضُرٍّ فَلَا كَاشِفَ لَهُۥٓ إِلَّا هُوَ ۖ وَإِن يُرِدْكَ بِخَيْرٍ فَلَا رَآدَّ لِفَضْلِهِۦ ۚ يُصِيبُ بِهِۦ مَن يَشَآءُ مِنْ عِبَادِهِۦ ۚ وَهُوَ ٱلْغَفُورُ ٱلرَّحِيمُ
    arabicPlain: وإن يمسسك الله بضر فلا كاشف له إلا هو ۖ وإن يردك بخير فلا راد لفضله ۚ يصيب به من يشاء من عباده ۚ وهو الغفور الرحيم
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 182
