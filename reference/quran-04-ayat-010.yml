    scripture: quran
    name: Quran 10:43
    chapter: 10
    verse: 43
    ordinal: 1407
    text: And of them is he who looketh toward thee. But canst thou guide the blind even though they see not?
    translation: Pickthall
    original: وَمِنْهُم مَّن يَنظُرُ إِلَيْكَ ۚ أَفَأَنتَ تَهْدِى ٱلْعُمْىَ وَلَوْ كَانُوا۟ لَا يُبْصِرُونَ
