  data:
    ref: 10:64
    scripture: quran
    name: Quran 10:64
    chapter: 10
    verse: 64
    ordinal: 1428
    text: Theirs are good tidings in the life of the world and in the Hereafter - There is no changing the Words of Allah - that is the Supreme Triumph.
    translation: Pickthall
    original: لَهُمُ ٱلْبُشْرَىٰ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَفِى ٱلْـَٔاخِرَةِ ۚ لَا تَبْدِيلَ لِكَلِمَـٰتِ ٱللَّهِ ۚ ذَٰلِكَ هُوَ ٱلْفَوْزُ ٱلْعَظِيمُ
    arabicPlain: لهم البشرى في الحياة الدنيا وفي الآخرة ۚ لا تبديل لكلمات الله ۚ ذلك هو الفوز العظيم
    surahName: Yunus
    juz: 11
