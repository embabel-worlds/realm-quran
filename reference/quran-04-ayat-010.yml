    scripture: quran
    name: Quran 10:44
    chapter: 10
    verse: 44
    ordinal: 1408
    text: Lo! Allah wrongeth not mankind in aught; but mankind wrong themselves.
    translation: Pickthall
    original: إِنَّ ٱللَّهَ لَا يَظْلِمُ ٱلنَّاسَ شَيْـًٔا وَلَـٰكِنَّ ٱلنَّاسَ أَنفُسَهُمْ يَظْلِمُونَ
    arabicPlain: إن الله لا يظلم الناس شيئا ولكن الناس أنفسهم يظلمون
