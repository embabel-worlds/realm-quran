  data:
    ref: '10:11'
    scripture: quran
    name: Quran 10:11
    chapter: 10
    verse: 11
    ordinal: 1375
    text: If Allah were to hasten on for men the ill (that they have earned) as they would hasten on the good, their respite would already have expired. But We suffer those who look not for the meeting with Us to wander blindly on in their contumacy.
    translation: Pickthall
    original: ۞ وَلَوْ يُعَجِّلُ ٱللَّهُ لِلنَّاسِ ٱلشَّرَّ ٱسْتِعْجَالَهُم بِٱلْخَيْرِ لَقُضِىَ إِلَيْهِمْ أَجَلُهُمْ ۖ فَنَذَرُ ٱلَّذِينَ لَا يَرْجُونَ لِقَآءَنَا فِى طُغْيَـٰنِهِمْ يَعْمَهُونَ
    arabicPlain: ۞ ولو يعجل الله للناس الشر استعجالهم بالخير لقضي إليهم أجلهم ۖ فنذر الذين لا يرجون لقاءنا في طغيانهم يعمهون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 173
    page: 209
