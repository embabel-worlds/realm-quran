  data:
    ref: '10:8'
    scripture: quran
    name: Quran 10:8
    chapter: 10
    verse: 8
    ordinal: 1372
    text: Their home will be the Fire because of what they used to earn.
    translation: Pickthall
    original: أُو۟لَـٰٓئِكَ مَأْوَىٰهُمُ ٱلنَّارُ بِمَا كَانُوا۟ يَكْسِبُونَ
    arabicPlain: أولئك مأواهم النار بما كانوا يكسبون
