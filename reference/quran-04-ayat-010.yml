  data:
    ref: '10:35'
    scripture: quran
    name: Quran 10:35
    chapter: 10
    verse: 35
    ordinal: 1399
    text: 'Say: Is there of your partners (whom ye ascribe unto Allah) one that leadeth to the Truth? Say: Allah leadeth to the Truth. Is He Who leadeth to the Truth more deserving that He should be followed, or he who findeth not the way unless he (himself) be guided. What aileth you? How judge ye?'
    translation: Pickthall
    original: قُلْ هَلْ مِن شُرَكَآئِكُم مَّن يَهْدِىٓ إِلَى ٱلْحَقِّ ۚ قُلِ ٱللَّهُ يَهْدِى لِلْحَقِّ ۗ أَفَمَن يَهْدِىٓ إِلَى ٱلْحَقِّ أَحَقُّ أَن يُتَّبَعَ أَمَّن لَّا يَهِدِّىٓ إِلَّآ أَن يُهْدَىٰ ۖ فَمَا لَكُمْ كَيْفَ تَحْكُمُونَ
    arabicPlain: قل هل من شركائكم من يهدي إلى الحق ۚ قل الله يهدي للحق ۗ أفمن يهدي إلى الحق أحق أن يتبع أمن لا يهدي إلا أن يهدى ۖ فما لكم كيف تحكمون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 175
