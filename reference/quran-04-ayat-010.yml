  data:
    ref: '10:49'
    scripture: quran
    name: Quran 10:49
    chapter: 10
    verse: 49
    ordinal: 1413
    text: 'Say: I have no power to hurt or benefit myself, save that which Allah willeth. For every nation there is an appointed time. When their time cometh, then they cannot put it off an hour, nor hasten (it).'
    translation: Pickthall
    original: قُل لَّآ أَمْلِكُ لِنَفْسِى ضَرًّا وَلَا نَفْعًا إِلَّا مَا شَآءَ ٱللَّهُ ۗ لِكُلِّ أُمَّةٍ أَجَلٌ ۚ إِذَا جَآءَ أَجَلُهُمْ فَلَا يَسْتَـْٔخِرُونَ سَاعَةً ۖ وَلَا يَسْتَقْدِمُونَ
    arabicPlain: قل لا أملك لنفسي ضرا ولا نفعا إلا ما شاء الله ۗ لكل أمة أجل ۚ إذا جاء أجلهم فلا يستأخرون ساعة ۖ ولا يستقدمون
    surahName: Yunus
