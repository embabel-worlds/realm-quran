  data:
    ref: '10:20'
    scripture: quran
    name: Quran 10:20
    chapter: 10
    verse: 20
    ordinal: 1384
    text: 'And they will say: If only a portent were sent down upon him from his Lord! Then say, (O Muhammad): The Unseen belongeth to Allah. So wait! Lo! I am waiting with you.'
    translation: Pickthall
    original: وَيَقُولُونَ لَوْلَآ أُنزِلَ عَلَيْهِ ءَايَةٌ مِّن رَّبِّهِۦ ۖ فَقُلْ إِنَّمَا ٱلْغَيْبُ لِلَّهِ فَٱنتَظِرُوٓا۟ إِنِّى مَعَكُم مِّنَ ٱلْمُنتَظِرِينَ
    arabicPlain: ويقولون لولا أنزل عليه آية من ربه ۖ فقل إنما الغيب لله فانتظروا إني معكم من المنتظرين
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 173
