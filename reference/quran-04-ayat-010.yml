  data:
    ref: 10:80
    scripture: quran
    name: Quran 10:80
    chapter: 10
    verse: 80
    ordinal: 1444
    text: 'And when the wizards came, Moses said unto them: Cast your cast!'
    translation: Pickthall
    original: فَلَمَّا جَآءَ ٱلسَّحَرَةُ قَالَ لَهُم مُّوسَىٰٓ أَلْقُوا۟ مَآ أَنتُم مُّلْقُونَ
    arabicPlain: فلما جاء السحرة قال لهم موسى ألقوا ما أنتم ملقون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 179
    page: 218
  relations:
