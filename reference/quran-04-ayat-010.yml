  data:
    ref: '10:34'
    scripture: quran
    name: Quran 10:34
    chapter: 10
    verse: 34
    ordinal: 1398
    text: 'Say: Is there of your partners (whom ye ascribe unto Allah) one that produceth Creation and then reproduceth it? Say: Allah produceth Creation, then reproduceth it. How then, are ye misled!'
    translation: Pickthall
    original: قُلْ هَلْ مِن شُرَكَآئِكُم مَّن يَبْدَؤُا۟ ٱلْخَلْقَ ثُمَّ يُعِيدُهُۥ ۚ قُلِ ٱللَّهُ يَبْدَؤُا۟ ٱلْخَلْقَ ثُمَّ يُعِيدُهُۥ ۖ فَأَنَّىٰ تُؤْفَكُونَ
    arabicPlain: قل هل من شركائكم من يبدأ الخلق ثم يعيده ۚ قل الله يبدأ الخلق ثم يعيده ۖ فأنى تؤفكون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 175
