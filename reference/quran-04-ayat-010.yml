    scripture: quran
    name: Quran 10:99
    chapter: 10
    verse: 99
    ordinal: 1463
    text: And if thy Lord willed, all who are in the earth would have believed together. Wouldst thou (Muhammad) compel men until they are believers?
    translation: Pickthall
    original: وَلَوْ شَآءَ رَبُّكَ لَـَٔامَنَ مَن فِى ٱلْأَرْضِ كُلُّهُمْ جَمِيعًا ۚ أَفَأَنتَ تُكْرِهُ ٱلنَّاسَ حَتَّىٰ يَكُونُوا۟ مُؤْمِنِينَ
    arabicPlain: ولو شاء ربك لآمن من في الأرض كلهم جميعا ۚ أفأنت تكره الناس حتى يكونوا مؤمنين
