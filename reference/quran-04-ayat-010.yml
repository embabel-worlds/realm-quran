    scripture: quran
    name: Quran 10:60
    chapter: 10
    verse: 60
    ordinal: 1424
    text: And what think those who invent a lie concerning Allah (will be their plight) upon the Day of Resurrection? Lo! Allah truly is Bountiful toward mankind, but most of them give not thanks.
    translation: Pickthall
    original: وَمَا ظَنُّ ٱلَّذِينَ يَفْتَرُونَ عَلَى ٱللَّهِ ٱلْكَذِبَ يَوْمَ ٱلْقِيَـٰمَةِ ۗ إِنَّ ٱللَّهَ لَذُو فَضْلٍ عَلَى ٱلنَّاسِ وَلَـٰكِنَّ أَكْثَرَهُمْ لَا يَشْكُرُونَ
    arabicPlain: وما ظن الذين يفترون على الله الكذب يوم القيامة ۗ إن الله لذو فضل على الناس ولكن أكثرهم لا يشكرون
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 177
