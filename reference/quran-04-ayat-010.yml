    name: Quran 10:53
    chapter: 10
    verse: 53
    ordinal: 1417
    text: 'And they ask thee to inform them (saying): Is it true? Say: Yea, by my Lord, verily it is true, and ye cannot escape.'
    translation: Pickthall
    original: ۞ وَيَسْتَنۢبِـُٔونَكَ أَحَقٌّ هُوَ ۖ قُلْ إِى وَرَبِّىٓ إِنَّهُۥ لَحَقٌّ ۖ وَمَآ أَنتُم بِمُعْجِزِينَ
    arabicPlain: ۞ ويستنبئونك أحق هو ۖ قل إي وربي إنه لحق ۖ وما أنتم بمعجزين
