    name: Quran 10:55
    chapter: 10
    verse: 55
    ordinal: 1419
    text: Lo! verily all that is in the heavens and the earth is Allah's. Lo! verily Allah's promise is true. But most of them know not.
    translation: Pickthall
    original: أَلَآ إِنَّ لِلَّهِ مَا فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۗ أَلَآ إِنَّ وَعْدَ ٱللَّهِ حَقٌّ وَلَـٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ
    arabicPlain: ألا إن لله ما في السماوات والأرض ۗ ألا إن وعد الله حق ولكن أكثرهم لا يعلمون
