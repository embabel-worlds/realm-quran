  data:
    ref: 10:108
    scripture: quran
    name: Quran 10:108
    chapter: 10
    verse: 108
    ordinal: 1472
    text: 'Say: O mankind! Now hath the Truth from your Lord come unto you. So whosoever is guided, is guided only for (the good of) his soul, and whosoever erreth erreth only against it. And I am not a warder over you.'
    translation: Pickthall
    original: قُلْ يَـٰٓأَيُّهَا ٱلنَّاسُ قَدْ جَآءَكُمُ ٱلْحَقُّ مِن رَّبِّكُمْ ۖ فَمَنِ ٱهْتَدَىٰ فَإِنَّمَا يَهْتَدِى لِنَفْسِهِۦ ۖ وَمَن ضَلَّ فَإِنَّمَا يَضِلُّ عَلَيْهَا ۖ وَمَآ أَنَا۠ عَلَيْكُم بِوَكِيلٍ
    arabicPlain: قل يا أيها الناس قد جاءكم الحق من ربكم ۖ فمن اهتدى فإنما يهتدي لنفسه ۖ ومن ضل فإنما يضل عليها ۖ وما أنا عليكم بوكيل
    surahName: Yunus
    juz: 11
    manzil: 3
    ruku: 182
    page: 221
