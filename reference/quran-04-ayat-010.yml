  data:
    ref: '10:54'
    scripture: quran
    name: Quran 10:54
    chapter: 10
    verse: 54
    ordinal: 1418
    text: And if each soul that doeth wrong had all that is in the earth it would seek to ransom itself therewith; and they will feel remorse within them, when they see the doom. But it hath been judged between them fairly and they are not wronged.
    translation: Pickthall
    original: وَلَوْ أَنَّ لِكُلِّ نَفْسٍ ظَلَمَتْ مَا فِى ٱلْأَرْضِ لَٱفْتَدَتْ بِهِۦ ۗ وَأَسَرُّوا۟ ٱلنَّدَامَةَ لَمَّا رَأَوُا۟ ٱلْعَذَابَ ۖ وَقُضِىَ بَيْنَهُم بِٱلْقِسْطِ ۚ وَهُمْ لَا يُظْلَمُونَ
    arabicPlain: ولو أن لكل نفس ظلمت ما في الأرض لافتدت به ۗ وأسروا الندامة لما رأوا العذاب ۖ وقضي بينهم بالقسط ۚ وهم لا يظلمون
