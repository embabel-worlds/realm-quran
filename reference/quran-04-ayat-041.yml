  data:
    ref: '41:23'
    scripture: quran
    name: Quran 41:23
    chapter: 41
    verse: 23
    ordinal: 4241
    text: That, your thought which ye did think about your Lord, hath ruined you; and ye find yourselves (this day) among the lost.
    translation: Pickthall
    original: وَذَٰلِكُمْ ظَنُّكُمُ ٱلَّذِى ظَنَنتُم بِرَبِّكُمْ أَرْدَىٰكُمْ فَأَصْبَحْتُم مِّنَ ٱلْخَـٰسِرِينَ
    arabicPlain: وذلكم ظنكم الذي ظننتم بربكم أرداكم فأصبحتم من الخاسرين
    surahName: Fussilat
    juz: 24
