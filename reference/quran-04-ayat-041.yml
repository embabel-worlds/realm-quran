  data:
    ref: '41:24'
    scripture: quran
    name: Quran 41:24
    chapter: 41
    verse: 24
    ordinal: 4242
    text: And though they are resigned, yet the Fire is still their home; and if they ask for favour, yet they are not of those unto whom favour can be shown.
    translation: Pickthall
    original: فَإِن يَصْبِرُوا۟ فَٱلنَّارُ مَثْوًى لَّهُمْ ۖ وَإِن يَسْتَعْتِبُوا۟ فَمَا هُم مِّنَ ٱلْمُعْتَبِينَ
    arabicPlain: فإن يصبروا فالنار مثوى لهم ۖ وإن يستعتبوا فما هم من المعتبين
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 415
    page: 479
