  data:
    ref: '41:21'
    scripture: quran
    name: Quran 41:21
    chapter: 41
    verse: 21
    ordinal: 4239
    text: 'And they say unto their skins: Why testify ye against us? They say: Allah hath given us speech Who giveth speech to all things, and Who created you at the first, and unto Whom ye are returned.'
    translation: Pickthall
    original: وَقَالُوا۟ لِجُلُودِهِمْ لِمَ شَهِدتُّمْ عَلَيْنَا ۖ قَالُوٓا۟ أَنطَقَنَا ٱللَّهُ ٱلَّذِىٓ أَنطَقَ كُلَّ شَىْءٍ وَهُوَ خَلَقَكُمْ أَوَّلَ مَرَّةٍ وَإِلَيْهِ تُرْجَعُونَ
    arabicPlain: وقالوا لجلودهم لم شهدتم علينا ۖ قالوا أنطقنا الله الذي أنطق كل شيء وهو خلقكم أول مرة وإليه ترجعون
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 415
    page: 479
