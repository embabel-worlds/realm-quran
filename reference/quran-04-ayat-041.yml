  data:
    ref: '41:48'
    scripture: quran
    name: Quran 41:48
    chapter: 41
    verse: 48
    ordinal: 4266
    text: And those to whom they used to cry of old have failed them, and they perceive they have no place of refuge.
    translation: Pickthall
    original: وَضَلَّ عَنْهُم مَّا كَانُوا۟ يَدْعُونَ مِن قَبْلُ ۖ وَظَنُّوا۟ مَا لَهُم مِّن مَّحِيصٍ
    arabicPlain: وضل عنهم ما كانوا يدعون من قبل ۖ وظنوا ما لهم من محيص
    surahName: Fussilat
    juz: 25
    manzil: 6
    ruku: 418
