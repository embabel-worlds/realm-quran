- type: Ayah
  data:
    ref: '41:32'
    scripture: quran
    name: Quran 41:32
    chapter: 41
    verse: 32
    ordinal: 4250
    text: A gift of welcome from One Forgiving, Merciful.
    translation: Pickthall
    original: نُزُلًا مِّنْ غَفُورٍ رَّحِيمٍ
    arabicPlain: نزلا من غفور رحيم
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 416
    page: 480
  relations:
