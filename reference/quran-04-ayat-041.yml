- type: Ayah
  data:
    ref: '41:14'
    scripture: quran
    name: Quran 41:14
    chapter: 41
    verse: 14
    ordinal: 4232
    text: 'When their messengers came unto them from before them and behind them, saying: Worship none but Allah! they said: If our Lord had willed, He surely would have sent down angels (unto us), so lo! we are disbelievers in that wherewith ye have been sent.'
    translation: Pickthall
    original: إِذْ جَآءَتْهُمُ ٱلرُّسُلُ مِنۢ بَيْنِ أَيْدِيهِمْ وَمِنْ خَلْفِهِمْ أَلَّا تَعْبُدُوٓا۟ إِلَّا ٱللَّهَ ۖ قَالُوا۟ لَوْ شَآءَ رَبُّنَا لَأَنزَلَ مَلَـٰٓئِكَةً فَإِنَّا بِمَآ أُرْسِلْتُم بِهِۦ كَـٰفِرُونَ
    arabicPlain: إذ جاءتهم الرسل من بين أيديهم ومن خلفهم ألا تعبدوا إلا الله ۖ قالوا لو شاء ربنا لأنزل ملائكة فإنا بما أرسلتم به كافرون
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 414
    page: 478
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '41'
  - predicate: IN_PORTION
    to:
      type: Juz
