  data:
    ref: '41:50'
    scripture: quran
    name: Quran 41:50
    chapter: 41
    verse: 50
    ordinal: 4268
    text: 'And verily, if We cause him to taste mercy after some hurt that hath touched him, he will say: This is my own; and I deem not that the Hour will ever rise, and if I am brought back to my Lord, I surely shall be better off with Him - But We verily shall tell those who disbelieve (all) that they did, and We verily shall make them taste hard punishment.'
    translation: Pickthall
    original: وَلَئِنْ أَذَقْنَـٰهُ رَحْمَةً مِّنَّا مِنۢ بَعْدِ ضَرَّآءَ مَسَّتْهُ لَيَقُولَنَّ هَـٰذَا لِى وَمَآ أَظُنُّ ٱلسَّاعَةَ قَآئِمَةً وَلَئِن رُّجِعْتُ إِلَىٰ رَبِّىٓ إِنَّ لِى عِندَهُۥ لَلْحُسْنَىٰ ۚ فَلَنُنَبِّئَنَّ ٱلَّذِينَ كَفَرُوا۟ بِمَا عَمِلُوا۟ وَلَنُذِيقَنَّهُم مِّنْ عَذَابٍ غَلِيظٍ
    arabicPlain: ولئن أذقناه رحمة منا من بعد ضراء مسته ليقولن هذا لي وما أظن الساعة قائمة ولئن رجعت إلى ربي إن لي عنده للحسنى ۚ فلننبئن الذين كفروا بما عملوا ولنذيقنهم من عذاب غليظ
    surahName: Fussilat
    juz: 25
    manzil: 6
    ruku: 418
    page: 482
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '41'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '41:51'
    scripture: quran
    name: Quran 41:51
    chapter: 41
    verse: 51
    ordinal: 4269
    text: When We show favour unto man, he withdraweth and turneth aside, but when ill toucheth him then he aboundeth in prayer.
    translation: Pickthall
    original: وَإِذَآ أَنْعَمْنَا عَلَى ٱلْإِنسَـٰنِ أَعْرَضَ وَنَـَٔا بِجَانِبِهِۦ وَإِذَا مَسَّهُ ٱلشَّرُّ فَذُو دُعَآءٍ عَرِيضٍ
    arabicPlain: وإذا أنعمنا على الإنسان أعرض ونأى بجانبه وإذا مسه الشر فذو دعاء عريض
    surahName: Fussilat
    juz: 25
    manzil: 6
    ruku: 418
    page: 482
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '41'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '41:52'
    scripture: quran
    name: Quran 41:52
    chapter: 41
    verse: 52
    ordinal: 4270
    text: 'Bethink you: If it is from Allah and ye reject it - Who is further astray than one who is at open feud (with Allah)?'
    translation: Pickthall
    original: قُلْ أَرَءَيْتُمْ إِن كَانَ مِنْ عِندِ ٱللَّهِ ثُمَّ كَفَرْتُم بِهِۦ مَنْ أَضَلُّ مِمَّنْ هُوَ فِى شِقَاقٍۭ بَعِيدٍ
    arabicPlain: قل أرأيتم إن كان من عند الله ثم كفرتم به من أضل ممن هو في شقاق بعيد
    surahName: Fussilat
    juz: 25
    manzil: 6
    ruku: 418
    page: 482
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '41'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-25
- type: Ayah
  data:
    ref: '41:53'
    scripture: quran
    name: Quran 41:53
    chapter: 41
    verse: 53
    ordinal: 4271
    text: We shall show them Our portents on the horizons and within themselves until it will be manifest unto them that it is the Truth. Doth not thy Lord suffice, since He is Witness over all things?
