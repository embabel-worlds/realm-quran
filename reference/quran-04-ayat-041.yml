- type: Ayah
  data:
    ref: '41:15'
    scripture: quran
    name: Quran 41:15
    chapter: 41
    verse: 15
    ordinal: 4233
    text: 'As for A''ad, they were arrogant in the land without right, and they said: Who is mightier than us in power? Could they not see that Allah Who created them, He was mightier than them in power? And they denied Our revelations.'
    translation: Pickthall
    original: فَأَمَّا عَادٌ فَٱسْتَكْبَرُوا۟ فِى ٱلْأَرْضِ بِغَيْرِ ٱلْحَقِّ وَقَالُوا۟ مَنْ أَشَدُّ مِنَّا قُوَّةً ۖ أَوَلَمْ يَرَوْا۟ أَنَّ ٱللَّهَ ٱلَّذِى خَلَقَهُمْ هُوَ أَشَدُّ مِنْهُمْ قُوَّةً ۖ وَكَانُوا۟ بِـَٔايَـٰتِنَا يَجْحَدُونَ
    arabicPlain: فأما عاد فاستكبروا في الأرض بغير الحق وقالوا من أشد منا قوة ۖ أولم يروا أن الله الذي خلقهم هو أشد منهم قوة ۖ وكانوا بآياتنا يجحدون
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 414
    page: 478
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '41'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-24
- type: Ayah
  data:
    ref: '41:16'
    scripture: quran
    name: Quran 41:16
    chapter: 41
    verse: 16
    ordinal: 4234
    text: Therefor We let loose on them a raging wind in evil days, that We might make them taste the torment of disgrace in the life of the world. And verily the doom of the Hereafter will be more shameful, and they will not be helped.
    translation: Pickthall
    original: فَأَرْسَلْنَا عَلَيْهِمْ رِيحًا صَرْصَرًا فِىٓ أَيَّامٍ نَّحِسَاتٍ لِّنُذِيقَهُمْ عَذَابَ ٱلْخِزْىِ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا ۖ وَلَعَذَابُ ٱلْـَٔاخِرَةِ أَخْزَىٰ ۖ وَهُمْ لَا يُنصَرُونَ
    arabicPlain: فأرسلنا عليهم ريحا صرصرا في أيام نحسات لنذيقهم عذاب الخزي في الحياة الدنيا ۖ ولعذاب الآخرة أخزى ۖ وهم لا ينصرون
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 414
    page: 478
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '41'
  - predicate: IN_PORTION
