  data:
    ref: '41:39'
    scripture: quran
    name: Quran 41:39
    chapter: 41
    verse: 39
    ordinal: 4257
    text: 'And of His portents (is this): that thou seest the earth lowly, but when We send down water thereon it thrilleth and groweth. Lo! He Who quickeneth it is verily the Quickener of the Dead. Lo! He is Able to do all things.'
    translation: Pickthall
    original: وَمِنْ ءَايَـٰتِهِۦٓ أَنَّكَ تَرَى ٱلْأَرْضَ خَـٰشِعَةً فَإِذَآ أَنزَلْنَا عَلَيْهَا ٱلْمَآءَ ٱهْتَزَّتْ وَرَبَتْ ۚ إِنَّ ٱلَّذِىٓ أَحْيَاهَا لَمُحْىِ ٱلْمَوْتَىٰٓ ۚ إِنَّهُۥ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ
    arabicPlain: ومن آياته أنك ترى الأرض خاشعة فإذا أنزلنا عليها الماء اهتزت وربت ۚ إن الذي أحياها لمحيي الموتى ۚ إنه على كل شيء قدير
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 417
