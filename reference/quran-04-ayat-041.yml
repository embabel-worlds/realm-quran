  data:
    ref: '41:42'
    scripture: quran
    name: Quran 41:42
    chapter: 41
    verse: 42
    ordinal: 4260
    text: Falsehood cannot come at it from before it or from behind it. (It is) a revelation from the Wise, the Owner of Praise.
    translation: Pickthall
    original: لَّا يَأْتِيهِ ٱلْبَـٰطِلُ مِنۢ بَيْنِ يَدَيْهِ وَلَا مِنْ خَلْفِهِۦ ۖ تَنزِيلٌ مِّنْ حَكِيمٍ حَمِيدٍ
    arabicPlain: لا يأتيه الباطل من بين يديه ولا من خلفه ۖ تنزيل من حكيم حميد
    surahName: Fussilat
    juz: 24
    manzil: 6
