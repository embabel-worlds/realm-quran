- type: Ayah
  data:
    ref: '41:9'
    scripture: quran
    name: Quran 41:9
    chapter: 41
    verse: 9
    ordinal: 4227
    text: 'Say (O Muhammad, unto the idolaters): Disbelieve ye verily in Him Who created the earth in two Days, and ascribe ye unto Him rivals? He (and none else) is the Lord of the Worlds.'
    translation: Pickthall
    original: ۞ قُلْ أَئِنَّكُمْ لَتَكْفُرُونَ بِٱلَّذِى خَلَقَ ٱلْأَرْضَ فِى يَوْمَيْنِ وَتَجْعَلُونَ لَهُۥٓ أَندَادًا ۚ ذَٰلِكَ رَبُّ ٱلْعَـٰلَمِينَ
    arabicPlain: ۞ قل أئنكم لتكفرون بالذي خلق الأرض في يومين وتجعلون له أندادا ۚ ذلك رب العالمين
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 414
