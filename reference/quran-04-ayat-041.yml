  data:
    ref: '41:43'
    scripture: quran
    name: Quran 41:43
    chapter: 41
    verse: 43
    ordinal: 4261
    text: Naught is said unto thee (Muhammad) save what was said unto the messengers before thee. Lo! thy Lord is owner of forgiveness, and owner (also) of dire punishment.
    translation: Pickthall
    original: مَّا يُقَالُ لَكَ إِلَّا مَا قَدْ قِيلَ لِلرُّسُلِ مِن قَبْلِكَ ۚ إِنَّ رَبَّكَ لَذُو مَغْفِرَةٍ وَذُو عِقَابٍ أَلِيمٍ
    arabicPlain: ما يقال لك إلا ما قد قيل للرسل من قبلك ۚ إن ربك لذو مغفرة وذو عقاب أليم
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 417
    page: 481
