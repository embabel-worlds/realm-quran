- type: Ayah
  data:
    ref: '41:18'
    scripture: quran
    name: Quran 41:18
    chapter: 41
    verse: 18
    ordinal: 4236
    text: And We delivered those who believed and used to keep their duty to Allah.
    translation: Pickthall
    original: وَنَجَّيْنَا ٱلَّذِينَ ءَامَنُوا۟ وَكَانُوا۟ يَتَّقُونَ
    arabicPlain: ونجينا الذين آمنوا وكانوا يتقون
