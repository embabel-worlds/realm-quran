  data:
    ref: '41:41'
    scripture: quran
    name: Quran 41:41
    chapter: 41
    verse: 41
    ordinal: 4259
    text: Lo! those who disbelieve in the Reminder when it cometh unto them (are guilty), for lo! it is an unassailable Scripture.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ كَفَرُوا۟ بِٱلذِّكْرِ لَمَّا جَآءَهُمْ ۖ وَإِنَّهُۥ لَكِتَـٰبٌ عَزِيزٌ
    arabicPlain: إن الذين كفروا بالذكر لما جاءهم ۖ وإنه لكتاب عزيز
    surahName: Fussilat
    juz: 24
    manzil: 6
