  data:
    ref: '41:6'
    scripture: quran
    name: Quran 41:6
    chapter: 41
    verse: 6
    ordinal: 4224
    text: 'Say (unto them O Muhammad): I am only a mortal like you. It is inspired in me that your Allah is One Allah, therefor take the straight path unto Him and seek forgiveness of Him. And woe unto the idolaters,'
    translation: Pickthall
    original: قُلْ إِنَّمَآ أَنَا۠ بَشَرٌ مِّثْلُكُمْ يُوحَىٰٓ إِلَىَّ أَنَّمَآ إِلَـٰهُكُمْ إِلَـٰهٌ وَٰحِدٌ فَٱسْتَقِيمُوٓا۟ إِلَيْهِ وَٱسْتَغْفِرُوهُ ۗ وَوَيْلٌ لِّلْمُشْرِكِينَ
    arabicPlain: قل إنما أنا بشر مثلكم يوحى إلي أنما إلهكم إله واحد فاستقيموا إليه واستغفروه ۗ وويل للمشركين
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 413
    page: 477
