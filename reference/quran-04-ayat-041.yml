  data:
    ref: '41:45'
    scripture: quran
    name: Quran 41:45
    chapter: 41
    verse: 45
    ordinal: 4263
    text: And We verily gave Moses the Scripture, but there hath been dispute concerning it; and but for a Word that had already gone forth from thy Lord, it would ere now have been judged between them; but lo! they are in hopeless doubt concerning it.
    translation: Pickthall
    original: وَلَقَدْ ءَاتَيْنَا مُوسَى ٱلْكِتَـٰبَ فَٱخْتُلِفَ فِيهِ ۗ وَلَوْلَا كَلِمَةٌ سَبَقَتْ مِن رَّبِّكَ لَقُضِىَ بَيْنَهُمْ ۚ وَإِنَّهُمْ لَفِى شَكٍّ مِّنْهُ مُرِيبٍ
    arabicPlain: ولقد آتينا موسى الكتاب فاختلف فيه ۗ ولولا كلمة سبقت من ربك لقضي بينهم ۚ وإنهم لفي شك منه مريب
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 418
    page: 481
