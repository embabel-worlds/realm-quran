- type: Ayah
  data:
    ref: '41:13'
    scripture: quran
    name: Quran 41:13
    chapter: 41
    verse: 13
    ordinal: 4231
    text: 'But if they turn away, then say: I warn you of a thunderbolt like the thunderbolt (which fell of old upon the tribes) of A''ad and Thamud;'
    translation: Pickthall
    original: فَإِنْ أَعْرَضُوا۟ فَقُلْ أَنذَرْتُكُمْ صَـٰعِقَةً مِّثْلَ صَـٰعِقَةِ عَادٍ وَثَمُودَ
    arabicPlain: فإن أعرضوا فقل أنذرتكم صاعقة مثل صاعقة عاد وثمود
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 414
    page: 478
