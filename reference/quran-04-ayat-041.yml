- type: Ayah
  data:
    ref: '41:5'
    scripture: quran
    name: Quran 41:5
    chapter: 41
    verse: 5
    ordinal: 4223
    text: 'And they say: Our hearts are protected from that unto which thou (O Muhammad) callest us, and in our ears there is a deafness, and between us and thee there is a veil. Act, then. Lo! we also shall be acting.'
    translation: Pickthall
    original: وَقَالُوا۟ قُلُوبُنَا فِىٓ أَكِنَّةٍ مِّمَّا تَدْعُونَآ إِلَيْهِ وَفِىٓ ءَاذَانِنَا وَقْرٌ وَمِنۢ بَيْنِنَا وَبَيْنِكَ حِجَابٌ فَٱعْمَلْ إِنَّنَا عَـٰمِلُونَ
    arabicPlain: وقالوا قلوبنا في أكنة مما تدعونا إليه وفي آذاننا وقر ومن بيننا وبينك حجاب فاعمل إننا عاملون
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 413
    page: 477
