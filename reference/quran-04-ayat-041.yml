  data:
    ref: '41:47'
    scripture: quran
    name: Quran 41:47
    chapter: 41
    verse: 47
    ordinal: 4265
    text: 'Unto Him is referred (all) knowledge of the Hour. And no fruits burst forth from their sheaths, and no female carrieth or bringeth forth but with His knowledge. And on the day when He calleth unto them: Where are now My partners? they will say: We confess unto Thee, not one of us is a witness (for them).'
    translation: Pickthall
    original: ۞ إِلَيْهِ يُرَدُّ عِلْمُ ٱلسَّاعَةِ ۚ وَمَا تَخْرُجُ مِن ثَمَرَٰتٍ مِّنْ أَكْمَامِهَا وَمَا تَحْمِلُ مِنْ أُنثَىٰ وَلَا تَضَعُ إِلَّا بِعِلْمِهِۦ ۚ وَيَوْمَ يُنَادِيهِمْ أَيْنَ شُرَكَآءِى قَالُوٓا۟ ءَاذَنَّـٰكَ مَا مِنَّا مِن شَهِيدٍ
    arabicPlain: ۞ إليه يرد علم الساعة ۚ وما تخرج من ثمرات من أكمامها وما تحمل من أنثى ولا تضع إلا بعلمه ۚ ويوم يناديهم أين شركائي قالوا آذناك ما منا من شهيد
    surahName: Fussilat
    juz: 25
    manzil: 6
    ruku: 418
    page: 482
