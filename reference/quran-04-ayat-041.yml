- type: Ayah
  data:
    ref: '41:12'
    scripture: quran
    name: Quran 41:12
    chapter: 41
    verse: 12
    ordinal: 4230
    text: Then He ordained them seven heavens in two Days and inspired in each heaven its mandate; and We decked the nether heaven with lamps, and rendered it inviolable. That is the measuring of the Mighty, the Knower.
    translation: Pickthall
    original: فَقَضَىٰهُنَّ سَبْعَ سَمَـٰوَاتٍ فِى يَوْمَيْنِ وَأَوْحَىٰ فِى كُلِّ سَمَآءٍ أَمْرَهَا ۚ وَزَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَـٰبِيحَ وَحِفْظًا ۚ ذَٰلِكَ تَقْدِيرُ ٱلْعَزِيزِ ٱلْعَلِيمِ
    arabicPlain: فقضاهن سبع سماوات في يومين وأوحى في كل سماء أمرها ۚ وزينا السماء الدنيا بمصابيح وحفظا ۚ ذلك تقدير العزيز العليم
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 414
    page: 478
