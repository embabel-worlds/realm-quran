  data:
    ref: '41:26'
    scripture: quran
    name: Quran 41:26
    chapter: 41
    verse: 26
    ordinal: 4244
    text: 'Those who disbelieve say: Heed not this Qur''an, and drown the hearing of it; haply ye may conquer.'
    translation: Pickthall
    original: وَقَالَ ٱلَّذِينَ كَفَرُوا۟ لَا تَسْمَعُوا۟ لِهَـٰذَا ٱلْقُرْءَانِ وَٱلْغَوْا۟ فِيهِ لَعَلَّكُمْ تَغْلِبُونَ
    arabicPlain: وقال الذين كفروا لا تسمعوا لهذا القرآن والغوا فيه لعلكم تغلبون
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 416
    page: 479
