  data:
    ref: '41:10'
    scripture: quran
    name: Quran 41:10
    chapter: 41
    verse: 10
    ordinal: 4228
    text: He placed therein firm hills rising above it, and blessed it and measured therein its sustenance in four Days, alike for (all) who ask;
    translation: Pickthall
    original: وَجَعَلَ فِيهَا رَوَٰسِىَ مِن فَوْقِهَا وَبَـٰرَكَ فِيهَا وَقَدَّرَ فِيهَآ أَقْوَٰتَهَا فِىٓ أَرْبَعَةِ أَيَّامٍ سَوَآءً لِّلسَّآئِلِينَ
    arabicPlain: وجعل فيها رواسي من فوقها وبارك فيها وقدر فيها أقواتها في أربعة أيام سواء للسائلين
    surahName: Fussilat
    juz: 24
