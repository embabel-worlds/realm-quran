  data:
    ref: '41:44'
    scripture: quran
    name: Quran 41:44
    chapter: 41
    verse: 44
    ordinal: 4262
    text: 'And if We had appointed it a Lecture in a foreign tongue they would assuredly have said: If only its verses were expounded (so that we might understand)? What! A foreign tongue and an Arab? - Say unto them (O Muhammad): For those who believe it is a guidance and a healing; and as for those who disbelieve, there is a deafness in their ears, and it is blindness for them. Such are called to from afar.'
    translation: Pickthall
    original: وَلَوْ جَعَلْنَـٰهُ قُرْءَانًا أَعْجَمِيًّا لَّقَالُوا۟ لَوْلَا فُصِّلَتْ ءَايَـٰتُهُۥٓ ۖ ءَا۬عْجَمِىٌّ وَعَرَبِىٌّ ۗ قُلْ هُوَ لِلَّذِينَ ءَامَنُوا۟ هُدًى وَشِفَآءٌ ۖ وَٱلَّذِينَ لَا يُؤْمِنُونَ فِىٓ ءَاذَانِهِمْ وَقْرٌ وَهُوَ عَلَيْهِمْ عَمًى ۚ أُو۟لَـٰٓئِكَ يُنَادَوْنَ مِن مَّكَانٍۭ بَعِيدٍ
    arabicPlain: ولو جعلناه قرآنا أعجميا لقالوا لولا فصلت آياته ۖ أأعجمي وعربي ۗ قل هو للذين آمنوا هدى وشفاء ۖ والذين لا يؤمنون في آذانهم وقر وهو عليهم عمى ۚ أولئك ينادون من مكان بعيد
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 417
    page: 481
