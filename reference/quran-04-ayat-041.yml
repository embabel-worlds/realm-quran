  data:
    ref: '41:28'
    scripture: quran
    name: Quran 41:28
    chapter: 41
    verse: 28
    ordinal: 4246
    text: 'That is the reward of Allah''s enemies: the Fire. Therein is their immortal home, payment forasmuch as they denied Our revelations.'
    translation: Pickthall
    original: ذَٰلِكَ جَزَآءُ أَعْدَآءِ ٱللَّهِ ٱلنَّارُ ۖ لَهُمْ فِيهَا دَارُ ٱلْخُلْدِ ۖ جَزَآءًۢ بِمَا كَانُوا۟ بِـَٔايَـٰتِنَا يَجْحَدُونَ
    arabicPlain: ذلك جزاء أعداء الله النار ۖ لهم فيها دار الخلد ۖ جزاء بما كانوا بآياتنا يجحدون
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 416
    page: 479
  relations:
  - predicate: IN
    to:
