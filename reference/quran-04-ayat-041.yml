  data:
    ref: '41:38'
    scripture: quran
    name: Quran 41:38
    chapter: 41
    verse: 38
    ordinal: 4256
    text: But if they are too proud - still those who are with thy Lord glorify Him night and day, and tire not.
    translation: Pickthall
    original: فَإِنِ ٱسْتَكْبَرُوا۟ فَٱلَّذِينَ عِندَ رَبِّكَ يُسَبِّحُونَ لَهُۥ بِٱلَّيْلِ وَٱلنَّهَارِ وَهُمْ لَا يَسْـَٔمُونَ ۩
    arabicPlain: فإن استكبروا فالذين عند ربك يسبحون له بالليل والنهار وهم لا يسأمون ۩
    surahName: Fussilat
    juz: 24
    manzil: 6
