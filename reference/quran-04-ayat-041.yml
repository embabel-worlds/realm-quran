  data:
    ref: '41:33'
    scripture: quran
    name: Quran 41:33
    chapter: 41
    verse: 33
    ordinal: 4251
    text: 'And who is better in speech than him who prayeth unto his Lord and doeth right, and saith: Lo! I am of those who are muslims (surrender unto Him).'
    translation: Pickthall
    original: وَمَنْ أَحْسَنُ قَوْلًا مِّمَّن دَعَآ إِلَى ٱللَّهِ وَعَمِلَ صَـٰلِحًا وَقَالَ إِنَّنِى مِنَ ٱلْمُسْلِمِينَ
    arabicPlain: ومن أحسن قولا ممن دعا إلى الله وعمل صالحا وقال إنني من المسلمين
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 417
    page: 480
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '41'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-24
- type: Ayah
  data:
    ref: '41:34'
    scripture: quran
    name: Quran 41:34
    chapter: 41
    verse: 34
    ordinal: 4252
    text: The good deed and the evil deed are not alike. Repel the evil deed with one which is better, then lo! he, between whom and thee there was enmity (will become) as though he was a bosom friend.
    translation: Pickthall
    original: وَلَا تَسْتَوِى ٱلْحَسَنَةُ وَلَا ٱلسَّيِّئَةُ ۚ ٱدْفَعْ بِٱلَّتِى هِىَ أَحْسَنُ فَإِذَا ٱلَّذِى بَيْنَكَ وَبَيْنَهُۥ عَدَٰوَةٌ كَأَنَّهُۥ وَلِىٌّ حَمِيمٌ
    arabicPlain: ولا تستوي الحسنة ولا السيئة ۚ ادفع بالتي هي أحسن فإذا الذي بينك وبينه عداوة كأنه ولي حميم
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 417
    page: 480
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '41'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-24
- type: Ayah
  data:
    ref: '41:35'
    scripture: quran
    name: Quran 41:35
    chapter: 41
    verse: 35
    ordinal: 4253
    text: But none is granted it save those who are steadfast, and none is granted it save the owner of great happiness.
    translation: Pickthall
    original: وَمَا يُلَقَّىٰهَآ إِلَّا ٱلَّذِينَ صَبَرُوا۟ وَمَا يُلَقَّىٰهَآ إِلَّا ذُو حَظٍّ عَظِيمٍ
    arabicPlain: وما يلقاها إلا الذين صبروا وما يلقاها إلا ذو حظ عظيم
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 417
    page: 480
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '41'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-24
- type: Ayah
  data:
    ref: '41:36'
    scripture: quran
    name: Quran 41:36
    chapter: 41
    verse: 36
    ordinal: 4254
    text: And if a whisper from the devil reach thee (O Muhammad) then seek refuge in Allah. Lo! He is the Hearer, the Knower.
    translation: Pickthall
    original: وَإِمَّا يَنزَغَنَّكَ مِنَ ٱلشَّيْطَـٰنِ نَزْغٌ فَٱسْتَعِذْ بِٱللَّهِ ۖ إِنَّهُۥ هُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ
    arabicPlain: وإما ينزغنك من الشيطان نزغ فاستعذ بالله ۖ إنه هو السميع العليم
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 417
    page: 480
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '41'
  - predicate: IN_PORTION
    to:
      type: Juz
      key: juz-24
- type: Ayah
  data:
    ref: '41:37'
    scripture: quran
    name: Quran 41:37
    chapter: 41
    verse: 37
    ordinal: 4255
    text: And of His portents are the night and the day and the sun and the moon. Do not prostrate to the sun or the moon; but prostrate to Allah Who created them, if it is in truth Him Whom ye worship.
    translation: Pickthall
    original: وَمِنْ ءَايَـٰتِهِ ٱلَّيْلُ وَٱلنَّهَارُ وَٱلشَّمْسُ وَٱلْقَمَرُ ۚ لَا تَسْجُدُوا۟ لِلشَّمْسِ وَلَا لِلْقَمَرِ وَٱسْجُدُوا۟ لِلَّهِ ٱلَّذِى خَلَقَهُنَّ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ
    arabicPlain: ومن آياته الليل والنهار والشمس والقمر ۚ لا تسجدوا للشمس ولا للقمر واسجدوا لله الذي خلقهن إن كنتم إياه تعبدون
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 417
    page: 480
