  data:
    ref: '41:40'
    scripture: quran
    name: Quran 41:40
    chapter: 41
    verse: 40
    ordinal: 4258
    text: Lo! those who distort Our revelations are not hid from Us. Is he who is hurled into the Fire better, or he who cometh secure on the Day of Resurrection? Do what ye will. Lo! He is Seer of what ye do.
    translation: Pickthall
    original: إِنَّ ٱلَّذِينَ يُلْحِدُونَ فِىٓ ءَايَـٰتِنَا لَا يَخْفَوْنَ عَلَيْنَآ ۗ أَفَمَن يُلْقَىٰ فِى ٱلنَّارِ خَيْرٌ أَم مَّن يَأْتِىٓ ءَامِنًا يَوْمَ ٱلْقِيَـٰمَةِ ۚ ٱعْمَلُوا۟ مَا شِئْتُمْ ۖ إِنَّهُۥ بِمَا تَعْمَلُونَ بَصِيرٌ
    arabicPlain: إن الذين يلحدون في آياتنا لا يخفون علينا ۗ أفمن يلقى في النار خير أم من يأتي آمنا يوم القيامة ۚ اعملوا ما شئتم ۖ إنه بما تعملون بصير
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 417
    page: 481
