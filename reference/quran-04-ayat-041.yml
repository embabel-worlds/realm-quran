  data:
    ref: '41:46'
    scripture: quran
    name: Quran 41:46
    chapter: 41
    verse: 46
    ordinal: 4264
    text: Whoso doeth right it is for his soul, and whoso doeth wrong it is against it. And thy Lord is not at all a tyrant to His slaves.
    translation: Pickthall
    original: مَّنْ عَمِلَ صَـٰلِحًا فَلِنَفْسِهِۦ ۖ وَمَنْ أَسَآءَ فَعَلَيْهَا ۗ وَمَا رَبُّكَ بِظَلَّـٰمٍ لِّلْعَبِيدِ
    arabicPlain: من عمل صالحا فلنفسه ۖ ومن أساء فعليها ۗ وما ربك بظلام للعبيد
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 418
    page: 481
