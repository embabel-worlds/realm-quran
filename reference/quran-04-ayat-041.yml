  data:
    ref: '41:31'
    scripture: quran
    name: Quran 41:31
    chapter: 41
    verse: 31
    ordinal: 4249
    text: We are your protecting friends in the life of the world and in the Hereafter. There ye will have (all) that your souls desire, and there ye will have (all) for which ye pray.
    translation: Pickthall
    original: نَحْنُ أَوْلِيَآؤُكُمْ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَفِى ٱلْـَٔاخِرَةِ ۖ وَلَكُمْ فِيهَا مَا تَشْتَهِىٓ أَنفُسُكُمْ وَلَكُمْ فِيهَا مَا تَدَّعُونَ
    arabicPlain: نحن أولياؤكم في الحياة الدنيا وفي الآخرة ۖ ولكم فيها ما تشتهي أنفسكم ولكم فيها ما تدعون
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 416
    page: 480
