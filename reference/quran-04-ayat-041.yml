- type: Ayah
  data:
    ref: '41:27'
    scripture: quran
    name: Quran 41:27
    chapter: 41
    verse: 27
    ordinal: 4245
    text: But verily We shall cause those who disbelieve to taste an awful doom, and verily We shall requite them the worst of what they used to do.
    translation: Pickthall
    original: فَلَنُذِيقَنَّ ٱلَّذِينَ كَفَرُوا۟ عَذَابًا شَدِيدًا وَلَنَجْزِيَنَّهُمْ أَسْوَأَ ٱلَّذِى كَانُوا۟ يَعْمَلُونَ
    arabicPlain: فلنذيقن الذين كفروا عذابا شديدا ولنجزينهم أسوأ الذي كانوا يعملون
    surahName: Fussilat
    juz: 24
    manzil: 6
    ruku: 416
