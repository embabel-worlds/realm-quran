- type: Ayah
  data:
    ref: '41:11'
    scripture: quran
    name: Quran 41:11
    chapter: 41
    verse: 11
    ordinal: 4229
    text: 'Then turned He to the heaven when it was smoke, and said unto it and unto the earth: Come both of you, willingly or loth. They said: We come, obedient.'
    translation: Pickthall
    original: ثُمَّ ٱسْتَوَىٰٓ إِلَى ٱلسَّمَآءِ وَهِىَ دُخَانٌ فَقَالَ لَهَا وَلِلْأَرْضِ ٱئْتِيَا طَوْعًا أَوْ كَرْهًا قَالَتَآ أَتَيْنَا طَآئِعِينَ
    arabicPlain: ثم استوى إلى السماء وهي دخان فقال لها وللأرض ائتيا طوعا أو كرها قالتا أتينا طائعين
    surahName: Fussilat
    juz: 24
