  data:
    ref: '41:49'
    scripture: quran
    name: Quran 41:49
    chapter: 41
    verse: 49
    ordinal: 4267
    text: Man tireth not of praying for good, and if ill toucheth him, then he is disheartened, desperate.
    translation: Pickthall
    original: لَّا يَسْـَٔمُ ٱلْإِنسَـٰنُ مِن دُعَآءِ ٱلْخَيْرِ وَإِن مَّسَّهُ ٱلشَّرُّ فَيَـُٔوسٌ قَنُوطٌ
    arabicPlain: لا يسأم الإنسان من دعاء الخير وإن مسه الشر فيئوس قنوط
    surahName: Fussilat
    juz: 25
    manzil: 6
    ruku: 418
    page: 482
  relations:
  - predicate: IN
    to:
      type: Surah
      ref: '41'
  - predicate: IN_PORTION
    to:
