  data:
    ref: '41:20'
    scripture: quran
    name: Quran 41:20
    chapter: 41
    verse: 20
    ordinal: 4238
    text: Till, when they reach it, their ears and their eyes and their skins testify against them as to what they used to do.
    translation: Pickthall
    original: حَتَّىٰٓ إِذَا مَا جَآءُوهَا شَهِدَ عَلَيْهِمْ سَمْعُهُمْ وَأَبْصَـٰرُهُمْ وَجُلُودُهُم بِمَا كَانُوا۟ يَعْمَلُونَ
    arabicPlain: حتى إذا ما جاءوها شهد عليهم سمعهم وأبصارهم وجلودهم بما كانوا يعملون
    surahName: Fussilat
