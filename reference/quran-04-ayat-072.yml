  data:
    ref: '72:13'
    scripture: quran
    name: Quran 72:13
    chapter: 72
    verse: 13
    ordinal: 5460
    text: And when we heard the guidance, we believed therein, and whoso believeth in his Lord, he feareth neither loss nor oppression.
    translation: Pickthall
    original: وَأَنَّا لَمَّا سَمِعْنَا ٱلْهُدَىٰٓ ءَامَنَّا بِهِۦ ۖ فَمَن يُؤْمِنۢ بِرَبِّهِۦ فَلَا يَخَافُ بَخْسًا وَلَا رَهَقًا
    arabicPlain: وأنا لما سمعنا الهدى آمنا به ۖ فمن يؤمن بربه فلا يخاف بخسا ولا رهقا
