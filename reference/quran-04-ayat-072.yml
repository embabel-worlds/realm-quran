    translation: Pickthall
    original: وَأَنَّا مِنَّا ٱلصَّـٰلِحُونَ وَمِنَّا دُونَ ذَٰلِكَ ۖ كُنَّا طَرَآئِقَ قِدَدًا
    arabicPlain: وأنا منا الصالحون ومنا دون ذلك ۖ كنا طرائق قددا
